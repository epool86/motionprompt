<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MotionPrompt</title>
  <meta name="description" content="Animation styles you can make with Claude. Tap a style, copy its prompt, paste it into Claude, and record the result as a video.">
  <meta name="theme-color" content="#07070c">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.3.0/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.3.0/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/instrument-serif@5.3.0/400-italic.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <script type="module" src="assets/js/gallery.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-current="page"><img src="assets/img/logo.svg" alt="" width="26" height="26">MotionPrompt</a>
      <nav class="site-nav" aria-label="Main">
        <span class="soon" title="Coming soon">Builder</span>
        <span class="soon" title="Coming soon">Guide</span>
      </nav>
    </div>
  </header>

  <main class="stage">
    <div class="backdrop" aria-hidden="true"><span class="orb a"></span><span class="orb b"></span><span class="orb c"></span></div>
    <div class="wrap">
      <div class="intro">
        <h1>Pick a style. <span class="serif shine">Copy the prompt.</span></h1>
        <p>Paste it into Claude, open the page it makes, and screen-record it as a video.</p>
      </div>

      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17"/></svg>
          <span class="visually-hidden">Search styles</span>
          <input type="search" id="search" placeholder="Search styles" autocomplete="off">
        </label>
        <div class="filters" id="filters" role="group" aria-label="Filter by tag"></div>
      </div>

      <p class="count" id="count" aria-live="polite"></p>

      <div class="grid" id="gallery">
        <p class="empty">Loading styles...</p>
      </div>
    </div>
  </main>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-preview" id="sheet-preview"></div>
      <div class="sheet-info">
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button class="icon-button" type="button" id="sheet-close" aria-label="Close">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
          </button>
        </div>
        <p id="sheet-summary"></p>
        <ul class="chips" id="sheet-chips" aria-label="Details"></ul>
        <div class="sheet-actions">
          <button class="button" type="button" id="sheet-copy">Copy prompt</button>
          <a class="button secondary" id="sheet-open" target="_blank" rel="noopener">Full screen</a>
        </div>
        <p class="status" id="sheet-status" role="status" aria-live="polite"></p>
        <pre class="prompt-text" id="sheet-prompt" tabindex="0" aria-label="Prompt"></pre>
      </div>
    </div>
  </dialog>

  <footer class="site-footer">
    <div class="wrap">
      <p>Free to use. Made with Claude.</p>
      <a href="https://github.com/epool86/motionprompt">GitHub</a>
    </div>
  </footer>
</body>
</html>
