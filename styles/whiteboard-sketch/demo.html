<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whiteboard sketch demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/caveat@5.3.0/700.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=fbf8f1&ink=23262f&accent=ffd84a&accent2=2f6fe4 */
    :root {
      --bg: #fbf8f1;
      --ink: #23262f;
      --accent: #ffd84a;
      --accent2: #2f6fe4;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* A soft sheen, like light on a glossy board */
    .sheen {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.28) 42%, transparent 55%),
        radial-gradient(120% 90% at 50% 40%, transparent 60%, rgba(0, 0, 0, 0.05) 100%);
    }

    .ink { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
    .blue { fill: none; stroke: var(--accent2); stroke-linecap: round; stroke-linejoin: round; }
    .hand { font-family: "Caveat", "Comic Sans MS", cursive; font-weight: 700; fill: var(--ink); }
    .marker { fill: var(--accent); opacity: 0.75; mix-blend-mode: multiply; }
  </style>
</head>
<body>
  <svg id="board" role="img" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="sheen"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const root = document.documentElement;
    for (const key of ["bg", "ink", "accent", "accent2"]) {
      const value = params.get(key);
      if (/^[0-9a-f]{6}$/i.test(value ?? "")) root.style.setProperty(`--${key}`, `#${value}`);
    }
    const text = (params.get("text") || "How it works").trim().slice(0, 60);
    // Long titles go on two lines, split where the longer line is shortest.
    const titleWords = text.split(/\s+/);
    let titleLines = [text];
    if (text.length > 20 && titleWords.length > 1) {
      for (let i = 1; i < titleWords.length; i++) {
        const pair = [titleWords.slice(0, i).join(" "), titleWords.slice(i).join(" ")];
        if (titleLines.length === 1 || Math.max(...pair.map((x) => x.length)) < Math.max(...titleLines.map((x) => x.length))) titleLines = pair;
      }
    }
    const labels = ["idea", "plan", "grow"];

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("board");
    svg.setAttribute("aria-label", `A whiteboard sketch that draws itself: ${text}`);

    // Small seeded random, so the wobble looks the same on every build.
    let seed = 1;
    function rand() {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    function el(name, attrs, parent) {
      const node = document.createElementNS(NS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (parent) parent.append(node);
      return node;
    }

    // Turn a list of points into one smooth curve.
    const f = (p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    function smooth(pts) {
      let d = `M${f(pts[0])}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ` C${f(c1)} ${f(c2)} ${f(p2)}`;
      }
      return d;
    }

    // Add a little hand wobble between the points of a line.
    function wobble(pts, amount = 2.5) {
      const out = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
        const len = Math.hypot(bx - ax, by - ay);
        const steps = Math.max(1, Math.round(len / 34));
        const nx = -(by - ay) / (len || 1), ny = (bx - ax) / (len || 1);
        for (let s = 1; s < steps; s++) {
          const k = s / steps, n = (rand() - 0.5) * amount * 2;
          out.push([ax + (bx - ax) * k + nx * n, ay + (by - ay) * k + ny * n]);
        }
        out.push([bx + (rand() - 0.5) * amount * 0.6, by + (rand() - 0.5) * amount * 0.6]);
      }
      return out;
    }

    // A loose loop that overshoots its start, like a quick marker circle.
    function loop(cx, cy, rx, ry, turn = 1.12) {
      const pts = [], start = -2.2 + rand() * 0.4, n = 26;
      for (let i = 0; i <= n; i++) {
        const a = start + (i / n) * Math.PI * 2 * turn;
        const grow = 1 + (i / n) * 0.07 + (rand() - 0.5) * 0.04;
        pts.push([cx + Math.cos(a) * rx * grow, cy + Math.sin(a) * ry * grow]);
      }
      return pts;
    }

    // Every stroke goes into this list with the time it starts and how long it takes.
    let steps = [];
    function stroke(parent, pts, cls = "ink", width = 6, wob = 2.5) {
      const path = el("path", { d: smooth(wobble(pts, wob)), class: cls, "stroke-width": width }, parent);
      return path;
    }
    function draw(paths, at, dur, gap = 0) {
      [paths].flat().forEach((p, i) => steps.push({ kind: "draw", node: p, at: at + i * (dur + gap), dur }));
      return at + [paths].flat().length * (dur + gap);
    }

    // Handwritten text that writes on from left to right behind a moving clip.
    let clipId = 0;
    function write(parent, str, x, y, size, anchor = "start") {
      const id = `wb-clip-${clipId++}`;
      const clip = el("clipPath", { id }, parent);
      const node = el("text", { x, y, class: "hand", "font-size": size, "text-anchor": anchor, "clip-path": `url(#${id})` }, parent);
      node.textContent = str;
      const w = node.getComputedTextLength();
      const left = anchor === "middle" ? x - w / 2 : x;
      const rect = el("rect", { x: left - size * 0.2, y: y - size, width: 0, height: size * 1.4 }, clip);
      return { node, rect, w, left, full: w + size * 0.4 };
    }
    function reveal(item, at, dur) {
      steps.push({ kind: "reveal", node: item.rect, full: item.full, at, dur });
      return at + dur;
    }

    // A highlighter band that swipes on behind some words.
    function marker(parent, x, y, w, h) {
      const pts = [[x, y + h * 0.1], [x + w, y], [x + w + h * 0.1, y + h * 0.95], [x + h * 0.08, y + h]];
      const id = `wb-clip-${clipId++}`;
      const clip = el("clipPath", { id }, parent);
      const band = el("path", { d: smooth(wobble([...pts, pts[0]], 2)) + "Z", class: "marker", "clip-path": `url(#${id})` }, parent);
      const rect = el("rect", { x: x - 10, y: y - 10, width: 0, height: h + 20 }, clip);
      return { node: band, rect, full: w + h * 0.3 + 20 };
    }

    // An arrow with a slight curve and a two stroke head.
    function arrow(parent, a, b, bend = 0.15, cls = "blue") {
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const c = [mx - dy * bend, my + dx * bend];
      const pts = [];
      for (let i = 0; i <= 8; i++) {
        const t = i / 8;
        pts.push([(1 - t) ** 2 * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]]);
      }
      const ang = Math.atan2(b[1] - c[1], b[0] - c[0]);
      const head = [ang + 2.6, ang - 2.6].map((h) => [b[0] + Math.cos(h) * 26, b[1] + Math.sin(h) * 26]);
      return [stroke(parent, pts, cls, 6, 1.2), stroke(parent, [head[0], b, head[1]], cls, 6, 0.6)];
    }

    // Doodles, drawn around their own centre, about 200 units across.
    function bulb(g) {
      const glass = [[-26, 58]];
      for (let a = 125; a <= 415; a += 15) {
        const r = (a * Math.PI) / 180;
        glass.push([Math.cos(r) * 62, -20 + Math.sin(r) * 62]);
      }
      glass.push([26, 58]);
      const out = [stroke(g, glass)];
      out.push(stroke(g, [[-30, 68], [30, 66]]), stroke(g, [[-28, 80], [27, 79]]), stroke(g, [[-17, 92], [16, 92]]));
      out.push(stroke(g, [[-14, 56], [-14, 12], [-7, 0], [0, 12], [7, 0], [14, 12], [14, 56]], "ink", 4, 0.8));
      const rays = [-150, -115, -90, -65, -30].map((deg) => {
        const r = (deg * Math.PI) / 180;
        return stroke(g, [[Math.cos(r) * 80, -20 + Math.sin(r) * 80], [Math.cos(r) * 102, -20 + Math.sin(r) * 102]], "blue", 6, 0.5);
      });
      return { body: out, rays };
    }

    function checklist(g) {
      const boxes = [], lines = [], ticks = [];
      [-62, 0, 62].forEach((y, i) => {
        boxes.push(stroke(g, [[-96, y - 17], [-62, y - 18], [-61, y + 17], [-95, y + 17], [-96, y - 19]], "ink", 5, 1.2));
        lines.push(stroke(g, [[-40, y + 2], [[88, 60, 76][i], y - 1]], "ink", 5, 3));
        ticks.push(stroke(g, [[-90, y - 2], [-80, y + 10], [-54, y - 26]], "blue", 7, 0.6));
      });
      return { boxes, lines, ticks };
    }

    function chart(g) {
      const axes = stroke(g, [[-92, -92], [-90, 82], [98, 80]]);
      const bars = [[-66, 40], [-24, 80], [18, 120]].map(([x, h]) =>
        stroke(g, [[x, 80], [x + 1, 80 - h], [x + 30, 80 - h + 1], [x + 30, 80]], "ink", 5, 1));
      const hatch = [0, 1, 2, 3].map((i) => stroke(g, [[22, 78 - i * 26], [44, 58 - i * 26]], "ink", 3, 0.4));
      const trend = [stroke(g, [[-80, 6], [-40, -28], [-8, -12], [66, -86]], "blue", 7, 1)];
      const ang = Math.atan2(-74, 74);
      const head = [ang + 2.6, ang - 2.6].map((h) => [66 + Math.cos(h) * 26, -86 + Math.sin(h) * 26]);
      trend.push(stroke(g, [head[0], [66, -86], head[1]], "blue", 7, 0.5));
      return { axes, bars, hatch, trend };
    }

    // Three layouts, picked by the shape of the window. Units are scene units, scaled to fit.
    const layouts = {
      row: {
        w: 1000, h: 600, title: { x: 60, y: 118, size: 116, max: 880 },
        cells: [[170, 340], [500, 340], [830, 340]], scale: 0.95,
        labels: [[170, 540, "middle"], [500, 540, "middle"], [830, 540, "middle"]],
        arrows: [[[290, 350], [390, 346], -0.2], [[620, 350], [720, 346], -0.2]],
      },
      square: {
        w: 1000, h: 940, title: { x: 60, y: 130, size: 124, max: 880 },
        cells: [[240, 390], [740, 390], [460, 800]], scale: 1,
        labels: [[240, 580, "middle"], [740, 580, "middle"], [760, 830, "middle"]],
        arrows: [[[385, 390], [590, 386], -0.18], [[720, 615], [590, 700], -0.2]],
      },
      column: {
        w: 600, h: 1000, title: { x: 40, y: 112, size: 104, max: 520 },
        cells: [[170, 340], [170, 610], [170, 880]], scale: 0.92,
        labels: [[330, 360, "start"], [330, 630, "start"], [330, 900, "start"]],
        arrows: [[[176, 440], [172, 522], 0.25], [[176, 710], [172, 792], 0.25]],
      },
    };

    let tl = null, content = null, eraser = null;
    const LOOP = 11; // seconds
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");

    function build() {
      const keep = tl ? tl.time() : 0;
      if (tl) tl.kill();
      svg.replaceChildren();
      seed = 7;
      clipId = 0;
      steps = [];

      const W = innerWidth, H = innerHeight, aspect = W / H;
      const L = aspect >= 1.3 ? layouts.row : aspect <= 0.85 ? layouts.column : layouts.square;
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

      // The eraser: a soft edged mask that sweeps across at the end of the loop.
      const defs = el("defs", {}, svg);
      const grad = el("linearGradient", { id: "wb-fade" }, defs);
      [[0, "#000"], [0.43, "#000"], [0.57, "#fff"], [1, "#fff"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, grad));
      const mask = el("mask", { id: "wb-erase", maskUnits: "userSpaceOnUse", x: 0, y: 0, width: W, height: H }, defs);
      eraser = el("rect", { x: -1.4 * W, y: 0, width: 2.3 * W, height: H, fill: "url(#wb-fade)" }, mask);

      const s = Math.min((W * 0.92) / L.w, (H * 0.9) / L.h);
      const outer = el("g", { mask: "url(#wb-erase)" }, svg);
      content = el("g", { transform: `translate(${(W - L.w * s) / 2} ${(H - L.h * s) / 2}) scale(${s})` }, outer);

      // Title: one line, or two for a long title. Shrink to fit, then underline and highlight it.
      const T = L.title;
      const back = el("g", {}, content);
      const two = titleLines.length > 1;
      let size = two ? T.size * 0.6 : T.size;
      const probe = el("text", { class: "hand", "font-size": size }, content);
      const widest = Math.max(...titleLines.map((line) => { probe.textContent = line; return probe.getComputedTextLength(); }));
      probe.remove();
      if (widest > T.max) size *= T.max / widest;
      const titles = titleLines.map((line, i) => write(content, line, T.x, T.y - (titleLines.length - 1 - i) * size * 0.95, size));
      const tw = Math.max(...titles.map((x) => x.w));
      const firstY = T.y - (titleLines.length - 1) * size * 0.95;
      const hl = marker(back, T.x - 12, firstY - size * 0.36, titles[0].w + 18, size * 0.42);
      const under = stroke(content, [[T.x - 6, T.y + 30], [T.x + tw * 0.5, T.y + 24], [T.x + tw + 8, T.y + 28]], "blue", 7, 2);

      let t = 0.2;
      for (const line of titles) t = reveal(line, t, Math.min(1.2, 0.3 + line.node.textContent.length * 0.05) / titles.length);
      t = draw(under, t + 0.05, 0.3);
      reveal(hl, t - 0.1, 0.3);

      // The three doodles, each with a label, joined by arrows.
      const groups = L.cells.map(([x, y]) => el("g", { transform: `translate(${x} ${y}) scale(${L.scale})` }, content));
      const b = bulb(groups[0]);
      const c = checklist(groups[1]);
      const ch = chart(groups[2]);
      const labelBack = el("g", {}, content);
      const words = L.labels.map(([x, y, anchor], i) => write(content, labels[i], x, y, 64, anchor));
      const arrows = L.arrows.map(([a, bb, bend]) => arrow(content, a, bb, bend));

      t = draw(b.body[0], t + 0.2, 0.45);
      t = draw(b.body.slice(1, 4), t, 0.08);
      t = draw(b.body[4], t, 0.22);
      t = draw(b.rays, t, 0.05, 0.01);
      reveal(words[0], t, 0.3);

      t = draw(arrows[0], t + 0.2, 0.15);
      t = draw(c.boxes, t + 0.05, 0.1);
      t = draw(c.lines, t, 0.1);
      t = draw(c.ticks, t, 0.1, 0.03);
      reveal(words[1], t, 0.3);

      t = draw(arrows[1], t + 0.2, 0.15);
      t = draw(ch.axes, t + 0.05, 0.3);
      t = draw(ch.bars, t, 0.12);
      t = draw(ch.hatch, t, 0.04);
      t = draw(ch.trend, t, 0.2);
      t = reveal(words[2], t, 0.3);

      // Finish with a circle and a highlight on the last label.
      const w3 = words[2];
      const hl2 = marker(labelBack, w3.left - 8, L.labels[2][1] - 30, w3.w + 16, 30);
      const ring = stroke(content, loop(w3.left + w3.w / 2, L.labels[2][1] - 18, w3.w / 2 + 40, 50), "blue", 6, 1.5);
      t = draw(ring, t + 0.1, 0.45);
      t = reveal(hl2, t, 0.3);
      window.drawnBy = t;

      // Timeline: hide everything, then play each stroke in order, hold, erase, repeat.
      tl = gsap.timeline({ repeat: -1 });
      for (const step of steps) {
        if (step.kind === "draw") {
          // The gap is longer than the line, so no round cap dot shows before it draws.
          const len = step.node.getTotalLength() + 2;
          gsap.set(step.node, { strokeDasharray: `${len} ${len + 30}`, strokeDashoffset: len + 15 });
          tl.to(step.node, { strokeDashoffset: 0, duration: step.dur, ease: "power1.inOut" }, step.at);
        } else {
          tl.to(step.node, { attr: { width: step.full }, duration: step.dur, ease: "none" }, step.at);
        }
      }
      tl.addLabel("hold", t + 0.5)
        .fromTo(eraser, { attr: { x: -1.4 * W } }, { attr: { x: 0.2 * W }, duration: 0.8, ease: "power2.inOut", immediateRender: false }, LOOP - 1.1)
        .set({}, {}, LOOP);

      if (reduce.matches) tl.pause(tl.labels.hold);
      else tl.time(keep % LOOP);
      sound.replan();
    }

    reduce.addEventListener("change", () => {
      if (!tl) return;
      if (reduce.matches) tl.pause(tl.labels.hold);
      else tl.play();
    });

    // Sound: every sound is made with the Web Audio API. It is off until the
    // parent page (or ?sound=1 / ?sound=effects) turns it on, and it follows the
    // GSAP timeline clock. The sounds are worked out from the same list of strokes
    // the timeline draws, so each squeak starts and stops with its line.
    const sound = (() => {
      const LEVEL = 1.1, MUSIC = 0.15;
      const BEAT = LOOP / 16; // 87 bpm: four bars fill one 11 s loop exactly
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      const clock = () => (tl && !tl.paused() ? tl.totalTime() : null);
      const loopLength = () => tl.duration();
      // Ukulele chords (G C E A tuning): C  Am  F  G.
      const CHORDS = [[67, 60, 64, 72], [69, 60, 64, 69], [69, 60, 65, 69], [67, 62, 67, 71]];
      const ROOTS = [36, 33, 41, 43];
      let strings = null, uke = null;
      let ctx = null, master, impulse, noiseBuf, session = null, fxBus, musicBus, verbSend;
      let wantOn = false, wantMusic = true, playing = false;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0;

      // The list of sounds for one loop, read from the strokes of the current build.
      function plan() {
        const list = [];
        const add = (t, type, extra = {}, music = false) => list.push({ t, type, music, ...extra });
        // Same small seeded random for every build, so each loop sounds the same.
        let s = 3;
        const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
        const panAt = (node) => {
          const r = node.getBoundingClientRect();
          return Math.max(-0.6, Math.min(0.6, ((r.left + r.width / 2) / innerWidth - 0.5) * 1.2));
        };
        // The doodle groups, in the order they are drawn: bulb, checklist, chart.
        const groups = [];
        steps.forEach((st) => {
          const g = st.node.parentNode;
          if (st.kind === "draw" && g !== content && !groups.includes(g)) groups.push(g);
        });
        let rays = 0, ticks = 0, long = 0;
        steps.forEach((st) => {
          if (st.kind === "draw") {
            const blue = st.node.getAttribute("class") === "blue";
            const g = groups.indexOf(st.node.parentNode);
            const p = panAt(st.node);
            // Squeak on every other longer line, so it stays charming, not shrill.
            const squeak = st.dur >= 0.2 && long++ % 2 === 0;
            add(st.at, "stroke", { dur: st.dur, blue, p, squeak, f: 1900 + rnd() * 700 });
            if (g === 0 && blue && rays++ === 0) add(st.at, "ding", {});
            if (g === 1 && blue) add(st.at + st.dur * 0.6, "check", { f: hz([84, 88, 91][ticks++ % 3]), p });
          } else {
            const user = svg.querySelector(`[clip-path="url(#${st.node.parentNode.id})"]`);
            const p = panAt(user);
            if (user && user.classList.contains("marker")) add(st.at, "swipe", { dur: st.dur, p });
            else {
              // Handwriting: a run of tiny strokes across the word.
              const n = Math.max(2, Math.round(st.dur * 11));
              for (let k = 0; k < n; k++) add(st.at + (k / n) * st.dur + rnd() * 0.02, "scribble", { dur: 0.04 + rnd() * 0.05, f: 2200 + rnd() * 1400, p });
            }
          }
        });
        // Eraser wipe at the end of the loop (same numbers as the timeline).
        add(LOOP - 1.1, "erase", { dur: 0.8 });

        // Music: strummed ukulele, a soft bass, light claps and a shaker.
        const strum = [[0, 1], [2, 1], [3, -1], [5, -1], [6, 1], [7, -1]];
        CHORDS.forEach((notes, bar) => {
          const t0 = bar * 4 * BEAT;
          strum.forEach(([e, dir], k) => {
            const nextE = k + 1 < strum.length ? strum[k + 1][0] : 8;
            add(t0 + (e * BEAT) / 2, "strum", { notes, dir, v: dir > 0 ? (e === 0 ? 1 : 0.8) : 0.55, hold: ((nextE - e) * BEAT) / 2 }, true);
          });
          add(t0, "bass", { f: hz(ROOTS[bar]), dur: BEAT * 1.2 }, true);
          add(t0 + 2 * BEAT, "bass", { f: hz(ROOTS[bar] + 7), dur: BEAT * 0.8 }, true);
          add(t0 + 3.5 * BEAT, "bass", { f: hz(ROOTS[bar] + 12), dur: BEAT * 0.4 }, true);
          for (let b = 0; b < 4; b++) {
            if (b % 2) add(t0 + b * BEAT, "clap", {}, true);
            for (let q = 0; q < 2; q++) add(t0 + (b + q / 2) * BEAT, "shaker", { v: q ? 0.7 : 0.3 }, true);
          }
        });
        return list.sort((a, b) => a.t - b.t);
      }
      let events = plan();

      // Audio graph: effects and music buses, a small reverb, a compressor before the speakers.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);

        // Reverb impulse: stereo noise that fades out.
        const len = Math.floor(ctx.sampleRate * 1.4);
        impulse = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = impulse.getChannelData(ch);
          for (let s = 0; s < len; s++) d[s] = (Math.random() * 2 - 1) * Math.pow(1 - s / len, 3.5);
        }

        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const nd = noiseBuf.getChannelData(0);
        for (let s = 0; s < nd.length; s++) nd[s] = Math.random() * 2 - 1;

        // Plucked nylon strings (Karplus-Strong), made once in code.
        strings = new Map();
        const sr = ctx.sampleRate;
        for (const m of new Set(CHORDS.flat())) {
          const f = hz(m), period = Math.max(2, Math.floor(sr / f - 0.5));
          const n = Math.floor(sr * 1.1), buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
          const line = new Float32Array(period);
          let lp = 0;
          for (let i = 0; i < period; i++) line[i] = lp += 0.4 * ((Math.random() * 2 - 1) - lp);
          let idx = 0, peak = 0;
          for (let i = 0; i < n; i++) {
            const cur = line[idx], next = line[(idx + 1) % period];
            line[idx] = 0.994 * 0.5 * (cur + next);
            d[i] = cur;
            peak = Math.max(peak, Math.abs(cur));
            idx = (idx + 1) % period;
          }
          for (let i = 0; i < n; i++) d[i] /= peak || 1;
          strings.set(m, { buf, rate: sr / f / (period + 0.5) });
        }
      }

      // Each time sound is turned on it gets fresh buses, so sounds queued before a
      // stop can never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.05);
        session.connect(master);
        fxBus = ctx.createGain();
        fxBus.connect(session);
        musicBus = ctx.createGain();
        musicBus.gain.value = wantMusic ? MUSIC : 0;
        musicBus.connect(session);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const tone = ctx.createBiquadFilter();
        tone.type = "lowpass";
        tone.frequency.value = 4000;
        const verbOut = ctx.createGain();
        verbOut.gain.value = 0.3;
        verbSend = ctx.createGain();
        verbSend.connect(verb).connect(tone).connect(verbOut).connect(session);
        // Ukulele body: a little warmth, a soft top end and a touch of room.
        uke = ctx.createGain();
        const body = filter("peaking", 400, 1);
        body.gain.value = 3;
        const top = filter("lowpass", 5500, 0.5);
        uke.connect(body).connect(top).connect(musicBus);
        send(uke, 0.25);
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.disconnect(), 250);
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function send(node, amount) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(verbSend);
      }
      // A gain that follows a list of [time offset, level] points with straight ramps.
      function shape(when, points, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, when);
        for (const [dt, v] of points) g.gain.linearRampToValueAtTime(v, when + dt);
        g.connect(out);
        return g;
      }

      // One function per sound.
      const voices = {
        stroke(when, e) {
          // Marker on a whiteboard: a dry felt hiss that follows the line, with a squeak on some lines.
          const d = Math.max(0.04, e.dur);
          const out = pan(e.p, fxBus);
          const v = e.blue ? 0.16 : 0.14;
          const g = shape(when, [[Math.min(0.02, d * 0.3), v], [d * 0.5, v * 1.1], [d, v * 0.7], [d + 0.03, 0]], out);
          const bp = filter("bandpass", e.blue ? 2600 : 2200, 1.3);
          bp.frequency.setValueAtTime(bp.frequency.value * 0.9, when);
          bp.frequency.linearRampToValueAtTime(bp.frequency.value * 1.15, when + d);
          noise(when, d + 0.05).connect(filter("highpass", 500)).connect(bp).connect(g);
          noise(when, d + 0.05).connect(filter("lowpass", 1100)).connect(amp(when, 0.35, 0.01, d, g));
          if (e.squeak) {
            const o = osc("sine", e.f, when, d);
            o.frequency.linearRampToValueAtTime(e.f * 1.08, when + d * 0.6);
            o.frequency.linearRampToValueAtTime(e.f * 0.97, when + d);
            const vib = osc("sine", 13, when, d);
            const depth = ctx.createGain();
            depth.gain.value = e.f * 0.012;
            vib.connect(depth).connect(o.frequency);
            const sg = shape(when, [[d * 0.25, 0.05], [d * 0.7, 0.04], [d, 0]], out);
            o.connect(filter("bandpass", e.f, 3)).connect(sg);
          }
        },
        scribble(when, e) {
          // One tiny handwriting stroke.
          const g = amp(when, 0.09, 0.006, e.dur, pan(e.p, fxBus));
          const bp = filter("bandpass", e.f, 1.6);
          bp.frequency.linearRampToValueAtTime(e.f * 0.8, when + e.dur);
          noise(when, e.dur + 0.02).connect(bp).connect(g);
        },
        swipe(when, e) {
          // Highlighter: a broad, soft swipe from the chisel tip.
          const d = e.dur;
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(e.p - 0.2, when);
          p.pan.linearRampToValueAtTime(e.p + 0.2, when + d);
          p.connect(fxBus);
          const g = shape(when, [[0.03, 0.2], [d * 0.7, 0.17], [d + 0.05, 0]], p);
          const bp = filter("bandpass", 900, 0.8);
          bp.frequency.setValueAtTime(900, when);
          bp.frequency.exponentialRampToValueAtTime(1700, when + d);
          noise(when, d + 0.08).connect(bp).connect(g);
          noise(when, d + 0.08).connect(filter("bandpass", 4200, 1.5)).connect(amp(when, 0.25, 0.02, d, g));
        },
        ding(when) {
          // The idea moment: a soft bell with a little sparkle on top.
          const out = pan(-0.1, fxBus);
          const g = amp(when, 0.26, 0.003, 1.4, out);
          osc("sine", hz(84), when, 1.5).connect(g);
          osc("sine", hz(96), when, 0.7).connect(amp(when, 0.06, 0.002, 0.5, out));
          osc("sine", hz(91), when + 0.07, 1.1).connect(amp(when + 0.07, 0.1, 0.004, 1, out));
          [100, 103, 108].forEach((m, k) => {
            const t = when + 0.12 + k * 0.06;
            osc("sine", hz(m), t, 0.3).connect(amp(t, 0.025, 0.002, 0.25, out));
          });
          send(g, 0.6);
        },
        check(when, e) {
          // A bright little tick as each box gets its check.
          const g = amp(when, 0.12, 0.002, 0.18, pan(e.p, fxBus));
          osc("triangle", e.f, when, 0.2).connect(g);
          osc("sine", e.f * 2, when, 0.1).connect(amp(when, 0.04, 0.001, 0.06, g));
          noise(when, 0.02).connect(filter("highpass", 5000)).connect(amp(when, 0.05, 0.001, 0.012, g));
          send(g, 0.4);
        },
        erase(when, e) {
          // Eraser rubbing across the board, left to right.
          const d = e.dur;
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(-0.5, when);
          p.pan.linearRampToValueAtTime(0.5, when + d);
          p.connect(fxBus);
          const g = shape(when, [[d * 0.2, 0.12], [d * 0.5, 0.2], [d * 0.8, 0.12], [d + 0.05, 0]], p);
          const rub = ctx.createGain();
          rub.gain.value = 0.6;
          const lfo = osc("sine", 8, when, d + 0.05);
          const depth = ctx.createGain();
          depth.gain.value = 0.4;
          lfo.connect(depth).connect(rub.gain);
          const bp = filter("bandpass", 750, 0.9);
          noise(when, d + 0.05).connect(bp).connect(rub).connect(g);
          noise(when, d + 0.05).connect(filter("lowpass", 300)).connect(amp(when, 0.6, d * 0.4, d * 0.6, g));
        },
        strum(when, e) {
          // Strummed ukulele: each string starts a little after the last one.
          const notes = e.dir > 0 ? e.notes : e.notes.slice().reverse();
          const end = when + e.hold + 0.05;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.32 * e.v, when);
          g.gain.setValueAtTime(0.32 * e.v, end - 0.04);
          g.gain.exponentialRampToValueAtTime(0.001, end + 0.12);
          g.connect(uke);
          notes.forEach((m, k) => {
            const s = strings.get(m);
            const src = ctx.createBufferSource();
            src.buffer = s.buf;
            src.playbackRate.value = s.rate;
            const sg = ctx.createGain();
            sg.gain.value = (e.dir > 0 ? 1 : 0.8) * (0.7 + 0.3 * Math.random());
            src.connect(sg).connect(g);
            src.start(when + k * 0.014, Math.random() * 0.002);
            src.stop(end + 0.15);
          });
        },
        bass(when, e) {
          // Soft plucked bass.
          const g = amp(when, 0.34, 0.006, e.dur, musicBus);
          const lp = filter("lowpass", 600, 1);
          lp.frequency.setValueAtTime(600, when);
          lp.frequency.exponentialRampToValueAtTime(200, when + e.dur);
          lp.connect(g);
          osc("triangle", e.f, when, e.dur + 0.02).connect(lp);
        },
        clap(when) {
          // Soft clap: a few quick bursts, like several hands.
          const g = ctx.createGain();
          g.gain.value = 1;
          g.connect(musicBus);
          const bp = filter("bandpass", 1300, 1.2);
          bp.connect(g);
          [0, 0.011, 0.022].forEach((dt, k) => noise(when + dt, 0.12).connect(amp(when + dt, k === 2 ? 0.16 : 0.1, 0.002, k === 2 ? 0.1 : 0.012, bp)));
          send(g, 0.7);
        },
        shaker(when, e) {
          noise(when, 0.06).connect(filter("highpass", 6500)).connect(amp(when, 0.08 * e.v, 0.006, 0.04, musicBus));
        },
      };

      // Look-ahead scheduler: every 25 ms, schedule sounds due in the next 100 ms.
      // Animation time is mapped to audio time by an anchor that is re-set after any jump
      // (a pause, a hidden tab, a restart), so missed sounds never pile up.
      function tick() {
        const now = playing && ctx.state === "running" && !document.hidden && !reduce.matches ? clock() : null;
        if (now === null) { anchor = null; return; }
        const loopLen = loopLength();
        const at = ctx.currentTime;
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.08) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          doneUpTo = now; // start fresh: nothing piles up
        }
        const cur = anchor.tl + (at - anchor.audio);
        const from = Math.max(doneUpTo, cur - 0.05); // after a stall, skip what is already late
        const to = cur + 0.1;
        if (to <= from) return;
        for (let k = Math.floor(from / loopLen); k <= Math.floor(to / loopLen); k++) {
          for (const e of events) {
            const t = k * loopLen + e.t;
            if (t < from || t >= to) continue;
            if (e.music && !wantMusic) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl)), e);
          }
        }
        doneUpTo = to;
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && !reduce.matches;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            openSession();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
          const t = ctx.currentTime;
          musicBus.gain.cancelScheduledValues(t);
          musicBus.gain.setTargetAtTime(wantMusic ? MUSIC : 0, t, 0.03);
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend(), 200);
        }
      }
      reduce.addEventListener("change", update);

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);

      addEventListener("message", (event) => {
        if (event.origin !== location.origin) return;
        const data = event.data;
        if (!data || data.type !== "motionprompt-sound") return;
        if (typeof data.on === "boolean") wantOn = data.on;
        if (typeof data.music === "boolean") wantMusic = data.music;
        update();
      });

      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantOn = true;
        wantMusic = fromUrl === "1";
        update();
      }
      return { replan() { events = plan(); } };
    })();

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(build, 150);
    });

    // Wait briefly for the font so text is measured in the right face.
    Promise.race([
      document.fonts.load("700 1em Caveat"),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(build);
  </script>
</body>
</html>
