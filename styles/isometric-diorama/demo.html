<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isometric diorama demo</title>
  <style>
    /* Colours can be set from the URL: ?text=...&bg=ffffff&ink=263238&accent=1fb5a8 */
    :root {
      --bg: #ffffff;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" role="img" aria-label="A 3D isometric diorama: a laptop, a folder of invoices, a calculator, coins, a pencil and a percent tag pop onto a round stage"></canvas>

  <script type="module">
    import * as THREE from "three";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const colors = { bg: hex("bg", "ffffff"), ink: hex("ink", "263238"), accent: hex("accent", "1fb5a8") };
    document.documentElement.style.setProperty("--bg", `#${colors.bg}`);
    const title = (params.get("text") || "Invoices").trim().slice(0, 24);

    const TEAL = `#${colors.accent}`;
    const SLATE = `#${colors.ink}`;
    // Tints of the two brand colours, mixed with white, for lighter details.
    const tint = (c, amount) => `#${new THREE.Color(c).lerp(new THREE.Color("#ffffff"), amount).getHexString()}`;
    const TEAL_LIGHT = tint(TEAL, 0.55);
    const TEAL_PALE = tint(TEAL, 0.82);
    const SLATE_SOFT = tint(SLATE, 0.25);
    const TEAL_DARK = `#${new THREE.Color(TEAL).lerp(new THREE.Color(SLATE), 0.3).getHexString()}`;
    const GREY = "#b8c2c8";
    const DISC = "#e4e9ec";

    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);

    // Toon shading: a tiny gradient with four flat bands.
    const bands = new Uint8Array([110, 150, 205, 255]);
    const gradientMap = new THREE.DataTexture(bands, bands.length, 1, THREE.RedFormat);
    gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;
    const materials = new Map();
    const toon = (color) => {
      if (!materials.has(color)) materials.set(color, new THREE.MeshToonMaterial({ color, gradientMap }));
      return materials.get(color);
    };

    // Lights: soft sky light plus one sun that casts the shadows.
    scene.add(new THREE.HemisphereLight(0xffffff, 0xd5dde1, 1.35));
    const sun = new THREE.DirectionalLight(0xffffff, 1.8);
    sun.position.set(-4, 12, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -8;
    sun.shadow.camera.right = sun.shadow.camera.top = 8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 30;
    sun.shadow.radius = 3;
    sun.shadow.intensity = 0.55;
    sun.shadow.bias = -0.0008;
    sun.shadow.normalBias = 0.02;
    scene.add(sun);

    function mesh(geometry, color, parent, x = 0, y = 0, z = 0) {
      const m = new THREE.Mesh(geometry, typeof color === "string" ? toon(color) : color);
      m.position.set(x, y, z);
      m.castShadow = m.receiveShadow = true;
      parent.add(m);
      return m;
    }
    const rbox = (w, h, d, r = 0.06, seg = 2) => new RoundedBoxGeometry(w, h, d, seg, r);

    // A soft round blob under each prop, so they feel grounded even where the sun misses.
    const blobTexture = (() => {
      const c = document.createElement("canvas");
      c.width = c.height = 128;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, "rgba(38,50,56,0.35)");
      grad.addColorStop(0.55, "rgba(38,50,56,0.14)");
      grad.addColorStop(1, "rgba(38,50,56,0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    const blobMaterial = new THREE.MeshBasicMaterial({ map: blobTexture, transparent: true, depthWrite: false });
    const blobGeometry = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
    function blob(parent, w, d, x = 0, z = 0) {
      const b = new THREE.Mesh(blobGeometry, blobMaterial);
      b.scale.set(w, 1, d);
      b.position.set(x, 0.012, z);
      b.renderOrder = 1;
      parent.add(b);
      return b;
    }

    // The stage: a light grey disc.
    const R = 6;
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 0.4, 72), [toon("#dde3e6"), toon(DISC), toon(DISC)]);
    disc.position.y = -0.2;
    disc.receiveShadow = true;
    scene.add(disc);

    // Screen positions on the disc: "left" and "front" as the camera sees them at rest.
    const L = new THREE.Vector3(-Math.SQRT1_2, 0, Math.SQRT1_2);
    const F = new THREE.Vector3(Math.SQRT1_2, 0, Math.SQRT1_2);
    const spot = (left, front) => L.clone().multiplyScalar(left).addScaledVector(F, front);

    // Each prop: a pivot at its base that pops in, plus an inner group that idles.
    const props = [];
    function prop(name, at, turn, start) {
      const pivot = new THREE.Group();
      pivot.position.copy(at);
      pivot.rotation.y = turn;
      const body = new THREE.Group();
      pivot.add(body);
      scene.add(pivot);
      const p = { name, pivot, body, start, base: new THREE.Vector3() };
      props.push(p);
      return p;
    }

    // ---- Laptop, with an app UI drawn on a canvas ----
    const screenCanvas = document.createElement("canvas");
    screenCanvas.width = 640;
    screenCanvas.height = 400;
    const screenTexture = new THREE.CanvasTexture(screenCanvas);
    screenTexture.colorSpace = THREE.SRGBColorSpace;
    screenTexture.anisotropy = 4;

    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);

    function roundRect(g, x, y, w, h, r) {
      g.beginPath();
      g.roundRect(x, y, w, h, r);
      g.fill();
    }

    // Build progress b (0 to 1) grows the UI in; the new row highlight h slides in during the close up.
    let screenKey = "";
    function drawScreen(b, h) {
      const key = `${b.toFixed(3)}|${h.toFixed(3)}`;
      if (key === screenKey) return;
      screenKey = key;
      const g = screenCanvas.getContext("2d");
      const W = 640, H = 400;
      g.fillStyle = "#f4f7f8";
      g.fillRect(0, 0, W, H);
      // Sidebar
      const side = easeOut(b / 0.25);
      g.fillStyle = SLATE;
      g.fillRect(0, 0, 110 * side, H);
      g.globalAlpha = side;
      g.fillStyle = TEAL;
      roundRect(g, 26, 24, 58, 58, 16);
      g.fillStyle = "#ffffff";
      g.beginPath();
      g.arc(55, 53, 12, 0, Math.PI * 2);
      g.fill();
      for (let i = 0; i < 5; i++) {
        g.fillStyle = i === 1 ? TEAL : "rgba(255,255,255,0.35)";
        roundRect(g, 30, 118 + i * 46, 50, 12, 6);
      }
      g.globalAlpha = 1;
      // Header bar with the title
      const head = easeOut((b - 0.12) / 0.25);
      g.fillStyle = TEAL;
      g.fillRect(110, 0, (W - 110) * head, 64);
      if (head > 0.6) {
        g.globalAlpha = (head - 0.6) / 0.4;
        g.fillStyle = "#ffffff";
        g.font = "700 30px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
        g.textBaseline = "middle";
        g.fillText(title, 136, 33, 330);
        g.beginPath();
        g.arc(W - 40, 32, 16, 0, Math.PI * 2);
        g.fill();
        g.globalAlpha = 1;
      }
      // Three stat cards
      for (let i = 0; i < 3; i++) {
        const k = easeOut((b - 0.25 - i * 0.08) / 0.25);
        if (k <= 0) continue;
        const x = 132 + i * 164, y = 84 + (1 - k) * 20;
        g.globalAlpha = k;
        g.fillStyle = "#ffffff";
        roundRect(g, x, y, 148, 82, 12);
        g.fillStyle = i === 0 ? TEAL : SLATE;
        roundRect(g, x + 16, y + 18, 50, 12, 6);
        g.fillStyle = "#cfd8dc";
        roundRect(g, x + 16, y + 44, 100, 18, 9);
        g.globalAlpha = 1;
      }
      // Bar chart
      const chart = clamp01((b - 0.45) / 0.45);
      g.fillStyle = "#ffffff";
      roundRect(g, 132, 184, 232, 196, 12);
      const heights = [0.45, 0.62, 0.5, 0.78, 0.66, 0.92];
      heights.forEach((v, i) => {
        const k = easeOut(chart * 1.6 - i * 0.12);
        const bh = 140 * v * k + (i === 5 ? 18 * easeOut(h) : 0);
        g.fillStyle = i === 5 ? TEAL : "#b0bec5";
        roundRect(g, 150 + i * 35, 360 - bh, 22, Math.max(0, bh), 6);
      });
      // Invoice rows
      for (let i = 0; i < 4; i++) {
        const k = easeOut((b - 0.5 - i * 0.08) / 0.3);
        if (k <= 0) continue;
        const y = 184 + i * 50;
        g.globalAlpha = k;
        g.fillStyle = "#ffffff";
        roundRect(g, 380 + (1 - k) * 30, y, 236, 40, 10);
        g.fillStyle = "#cfd8dc";
        roundRect(g, 396, y + 14, 90, 12, 6);
        g.fillStyle = i % 2 ? SLATE : TEAL;
        roundRect(g, 546, y + 12, 52, 16, 8);
        g.globalAlpha = 1;
      }
      // A new row highlight sweeps in
      if (h > 0) {
        const k = easeOut(h);
        g.globalAlpha = Math.min(1, h * 3);
        g.fillStyle = TEAL;
        roundRect(g, 380, 184, 236 * k, 40, 10);
        g.fillStyle = "#ffffff";
        roundRect(g, 396, 198, 90 * k, 12, 6);
        g.globalAlpha = 1;
      }
      screenTexture.needsUpdate = true;
    }

    const laptop = prop("laptop", spot(0.3, -1.4), Math.PI / 4 - 0.12, 0.35);
    {
      const b = laptop.body;
      blob(b, 5.6, 4.0, 0, 0.1);
      mesh(rbox(4.4, 0.2, 2.9, 0.08), GREY, b, 0, 0.1, 0);
      // Keyboard deck and trackpad
      const keys = document.createElement("canvas");
      keys.width = 256;
      keys.height = 96;
      const kg = keys.getContext("2d");
      kg.fillStyle = SLATE_SOFT;
      kg.fillRect(0, 0, 256, 96);
      kg.fillStyle = "#90a4ae";
      for (let r = 0; r < 4; r++) for (let c = 0; c < 12; c++) kg.fillRect(6 + c * 20.5, 6 + r * 22, 16, 17);
      const keyTexture = new THREE.CanvasTexture(keys);
      keyTexture.colorSpace = THREE.SRGBColorSpace;
      const deck = mesh(new THREE.PlaneGeometry(3.7, 1.35).rotateX(-Math.PI / 2), new THREE.MeshToonMaterial({ map: keyTexture, gradientMap }), b, 0, 0.205, -0.45);
      deck.castShadow = false;
      mesh(rbox(1.2, 0.02, 0.7, 0.01, 1), "#cfd8dc", b, 0, 0.205, 0.85).castShadow = false;
      // Lid, hinged at the back edge
      const hinge = new THREE.Group();
      hinge.position.set(0, 0.18, -1.38);
      hinge.rotation.x = -0.2;
      b.add(hinge);
      laptop.hinge = hinge;
      mesh(rbox(4.4, 2.85, 0.16, 0.08), SLATE, hinge, 0, 1.42, 0);
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(4.08, 2.55), new THREE.MeshBasicMaterial({ map: screenTexture }));
      screen.position.set(0, 1.44, 0.085);
      hinge.add(screen);
    }

    // ---- Folder of invoices ----
    const invoiceTexture = (() => {
      const c = document.createElement("canvas");
      c.width = 192;
      c.height = 256;
      const g = c.getContext("2d");
      g.fillStyle = "#ffffff";
      g.fillRect(0, 0, 192, 256);
      g.fillStyle = TEAL;
      g.fillRect(18, 18, 60, 14);
      g.fillStyle = "#cfd8dc";
      for (let i = 0; i < 5; i++) g.fillRect(18, 52 + i * 18, i % 2 ? 120 : 150, 8);
      g.fillStyle = SLATE;
      g.fillRect(104, 150, 70, 12);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();
    const paperMaterial = new THREE.MeshToonMaterial({ color: "#ffffff", map: invoiceTexture, gradientMap });

    const folder = prop("folder", spot(3.5, 0.5), Math.PI / 4 + 0.2, 0.75);
    {
      const b = folder.body;
      blob(b, 3.4, 1.6, 0, 0);
      const lean = new THREE.Group();
      lean.rotation.x = -0.14;
      b.add(lean);
      mesh(rbox(2.4, 2.5, 0.1, 0.05), TEAL_DARK, lean, 0, 1.25, -0.12);
      mesh(rbox(0.95, 0.4, 0.1, 0.05), TEAL_DARK, lean, -0.62, 2.55, -0.12);
      // Papers sticking out of the top
      folder.papers = [];
      [[-0.1, 0.06, -0.05], [0.12, -0.08, 0.0]].forEach(([x, rz, z], i) => {
        const paper = mesh(new THREE.BoxGeometry(1.9, 2.4, 0.02), [toon("#ffffff"), toon("#ffffff"), toon("#ffffff"), toon("#ffffff"), paperMaterial, toon("#ffffff")], lean, x, 1.2, z - 0.02 + i * 0.03);
        paper.rotation.z = rz;
        folder.papers.push({ mesh: paper, y: 1.55 + i * 0.12, delay: 0.35 + i * 0.12 });
      });
      const front = mesh(rbox(2.4, 1.95, 0.1, 0.05), TEAL, lean, 0, 0.98, 0.1);
      front.rotation.x = 0.05;
    }

    // ---- Calculator ----
    const calculator = prop("calculator", spot(-3.3, 1.5), Math.PI / 4 - 0.25, 1.05);
    {
      const b = calculator.body;
      b.scale.setScalar(1.2);
      blob(b, 2.6, 3.2, 0, 0);
      const tilt = new THREE.Group();
      tilt.position.y = 0.16;
      tilt.rotation.x = 0.1;
      b.add(tilt);
      mesh(rbox(1.7, 0.3, 2.3, 0.1), SLATE, tilt, 0, 0, 0);
      mesh(rbox(1.35, 0.08, 0.5, 0.03, 1), TEAL_PALE, tilt, 0, 0.17, -0.75);
      const key = rbox(0.26, 0.1, 0.26, 0.04, 1);
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          mesh(key, c === 3 ? TEAL : "#ffffff", tilt, -0.5 + c * 0.335, 0.18, -0.2 + r * 0.33).castShadow = false;
        }
      }
    }

    // ---- Coin stacks, each coin drops in on its own ----
    const coinGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.17, 28);
    const coinFace = new THREE.CylinderGeometry(0.34, 0.34, 0.02, 28);
    const coins = prop("coins", spot(-3.2, -1.6), 0, 1.35);
    coins.list = [];
    coins.shades = [];
    {
      const b = coins.body;
      const stacks = [[0, 0, 5], [1.15, 0.2, 3], [0.45, 1.05, 4]];
      stacks.forEach(([x, z, n], s) => {
        const shade = new THREE.Group();
        shade.position.set(x, 0, z);
        blob(shade, 1.7, 1.7);
        b.add(shade);
        coins.shades.push({ group: shade, delay: s * 0.14 });
        for (let i = 0; i < n; i++) {
          const coin = new THREE.Group();
          coin.position.set(x + Math.sin(i * 2.1 + s) * 0.04, 0.085 + i * 0.175, z + Math.cos(i * 1.7 + s) * 0.04);
          mesh(coinGeometry, TEAL, coin);
          if (i === n - 1) mesh(coinFace, TEAL_LIGHT, coin, 0, 0.09, 0);
          b.add(coin);
          coins.list.push({ group: coin, delay: s * 0.14 + i * 0.07, y: coin.position.y });
        }
      });
    }

    // ---- Giant pencil lying on the disc ----
    const pencil = prop("pencil", spot(0.2, 3.3), -Math.PI / 4 + 0.35, 1.8);
    {
      const b = pencil.body;
      blob(b, 5.6, 1.1, 0, 0);
      const r = 0.34;
      const lie = new THREE.Group();
      lie.rotation.z = Math.PI / 2;
      lie.position.y = r * 0.866;
      b.add(lie);
      mesh(new THREE.CylinderGeometry(r, r, 3.4, 6), TEAL, lie, 0, 0, 0);
      mesh(new THREE.CylinderGeometry(0.08, r, 0.8, 6), "#f5f5f0", lie, 0, -2.1, 0);
      mesh(new THREE.CylinderGeometry(0.001, 0.08, 0.2, 6), SLATE, lie, 0, -2.6, 0);
      mesh(new THREE.CylinderGeometry(r * 1.02, r * 1.02, 0.35, 12), GREY, lie, 0, 1.87, 0);
      mesh(new THREE.CylinderGeometry(r * 0.98, r * 0.98, 0.4, 12), SLATE, lie, 0, 2.24, 0);
      // Shift so the pencil is centred on its pivot
      lie.position.x = -0.13;
    }

    // ---- Floating % tag ----
    const tag = prop("tag", spot(-2.9, -2.7), Math.PI / 4 - 0.1, 2.15);
    {
      const b = tag.body;
      const shade = new THREE.Group();
      b.add(shade);
      tag.shadowBlob = blob(shade, 2.4, 1.3, 0, 0);
      const s = new THREE.Shape();
      s.moveTo(-1.05, 0);
      s.lineTo(-0.55, 0.62);
      s.lineTo(0.95, 0.62);
      s.quadraticCurveTo(1.15, 0.62, 1.15, 0.42);
      s.lineTo(1.15, -0.42);
      s.quadraticCurveTo(1.15, -0.62, 0.95, -0.62);
      s.lineTo(-0.55, -0.62);
      s.lineTo(-1.05, 0);
      const hole = new THREE.Path();
      hole.absarc(-0.55, 0, 0.13, 0, Math.PI * 2, true);
      s.holes.push(hole);
      const geo = new THREE.ExtrudeGeometry(s, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 2, curveSegments: 10 });
      geo.translate(0, 0, -0.08);
      const float = new THREE.Group();
      float.position.y = 3.3;
      b.add(float);
      tag.float = float;
      // The tag pops in where it floats, not from the ground.
      tag.parts = [float, shade];
      mesh(geo, TEAL, float);
      // The % sign from two rings and a slash
      const ring = new THREE.TorusGeometry(0.15, 0.055, 8, 24);
      mesh(ring, "#ffffff", float, 0.1, 0.22, 0.14);
      mesh(ring, "#ffffff", float, 0.68, -0.22, 0.14);
      const slash = mesh(new THREE.BoxGeometry(0.1, 0.95, 0.06), "#ffffff", float, 0.39, 0, 0.14);
      slash.rotation.z = -0.62;
    }

    // Points that must stay in frame: the disc rim plus each prop's bounding box.
    function boxCorners(object, out, pad = 0.15) {
      const box = new THREE.Box3().setFromObject(object).expandByScalar(pad);
      for (let i = 0; i < 8; i++) {
        out.push(new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z));
      }
      return out;
    }
    scene.updateMatrixWorld(true);
    const widePoints = [];
    for (let i = 0; i < 48; i++) {
      const a = (i / 48) * Math.PI * 2;
      widePoints.push(new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R), new THREE.Vector3(Math.cos(a) * R, -0.4, Math.sin(a) * R));
    }
    props.forEach((p) => boxCorners(p.pivot, widePoints, 0.3));
    const laptopPoints = boxCorners(laptop.pivot, [], 0.05);

    // Fit a set of points into the window from the current camera angle.
    const tmp = new THREE.Vector3();
    function fitBox(points, margin) {
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of points) {
        tmp.copy(p).applyMatrix4(camera.matrixWorldInverse);
        x0 = Math.min(x0, tmp.x); x1 = Math.max(x1, tmp.x);
        y0 = Math.min(y0, tmp.y); y1 = Math.max(y1, tmp.y);
      }
      let hw = (x1 - x0) / 2 * margin, hh = (y1 - y0) / 2 * margin;
      if (hw / hh < aspect) hw = hh * aspect;
      else hh = hw / aspect;
      return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, hw, hh };
    }

    // Timing, in seconds. Everything is periodic over LOOP, so it repeats without a seam.
    const LOOP = 12;
    const TAU = Math.PI * 2;
    const wave = (t, k, phase = 0) => Math.sin((TAU * k * t) / LOOP + phase);
    const smooth = (a, b, t) => {
      const x = clamp01((t - a) / (b - a));
      return x * x * (3 - 2 * x);
    };
    // Scale with a springy overshoot on the way in, a little puff on the way out.
    const backOut = (u) => {
      const s = 2.2, v = clamp01(u) - 1;
      return 1 + (s + 1) * v * v * v + s * v * v;
    };
    const backIn = (u) => {
      const s = 1.8, v = clamp01(u);
      return (s + 1) * v * v * v - s * v * v;
    };
    const POP = 0.6;
    const OUT_START = 10.9;
    const popScale = (t, start, order) => {
      const outAt = OUT_START + order * 0.07;
      if (t >= outAt) return 1 - backIn((t - outAt) / 0.32);
      return t < start ? 0 : backOut((t - start) / POP);
    };

    function setScale(object, s) {
      object.visible = s > 0.001;
      object.scale.setScalar(Math.max(s, 0.001));
    }

    let aspect = 1;
    function pose(t) {
      // Props pop in one by one and idle gently
      props.forEach((p, i) => {
        const order = props.length - 1 - i;
        if (p === coins) {
          p.pivot.visible = true;
          for (const c of coins.list) {
            const s = popScale(t, p.start + c.delay, order);
            const drop = t < OUT_START ? (1 - easeOut((t - p.start - c.delay) / 0.35)) * 0.8 : 0;
            setScale(c.group, s);
            c.group.position.y = c.y + Math.max(0, drop);
          }
          for (const c of coins.shades) setScale(c.group, popScale(t, p.start + c.delay, order));
          return;
        }
        const s = popScale(t, p.start, order);
        if (p.parts) p.parts.forEach((part) => setScale(part, s));
        else setScale(p.pivot, s);
      });

      laptop.hinge.rotation.x = -0.2 + wave(t, 2) * 0.02;
      laptop.body.rotation.y = wave(t, 1, 0.5) * 0.03;
      folder.body.rotation.z = wave(t, 3, 1) * 0.035;
      for (const paper of folder.papers) {
        const k = backOut((t - folder.start - paper.delay) / 0.5);
        paper.mesh.position.y = 1.2 + (paper.y - 1.2) * k + wave(t, 4, paper.delay * 9) * 0.03;
      }
      calculator.body.position.y = Math.max(0, wave(t, 4, 2)) * 0.08;
      calculator.body.rotation.x = wave(t, 4, 2) * 0.03;
      pencil.body.rotation.y = wave(t, 2, 0.3) * 0.06;
      tag.float.position.y = 3.3 + wave(t, 3) * 0.18;
      tag.float.rotation.y = wave(t, 2, 1) * 0.35;
      tag.float.rotation.z = wave(t, 3, 2) * 0.08;
      const lift = (tag.float.position.y - 3.12) / 0.36;
      tag.shadowBlob.scale.set(2.4 - lift * 0.3, 1, 1.3 - lift * 0.15);

      // Screen UI builds after the laptop lands, a new row slides in during the close up.
      drawScreen(clamp01((t - 0.8) / 1.8), smooth(5.0, 6.2, t) * (1 - smooth(9.6, 10.3, t)));

      // Camera: a slow orbit that eases between a wide shot and a close up on the laptop.
      const az = Math.PI / 4 + wave(t, 1, -Math.PI / 2) * 0.32 + wave(t, 2) * 0.05;
      const el = 0.6 + wave(t, 1) * 0.05;
      camera.position.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).multiplyScalar(30);
      camera.lookAt(0, 0.6, 0);
      camera.updateMatrixWorld();
      const wide = fitBox(widePoints, 1.08);
      const close = fitBox(laptopPoints, 1.04);
      const zoom = smooth(3.5, 5.0, t) * (1 - smooth(7.6, 9.2, t));
      const breathe = 1 + wave(t, 2, 1.2) * 0.015;
      const lerp = (a, b) => a + (b - a) * zoom;
      const cx = lerp(wide.cx, close.cx), cy = lerp(wide.cy, close.cy);
      const hw = lerp(wide.hw, close.hw) * breathe, hh = lerp(wide.hh, close.hh) * breathe;
      camera.left = cx - hw;
      camera.right = cx + hw;
      camera.top = cy + hh;
      camera.bottom = cy - hh;
      camera.updateProjectionMatrix();
    }

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      aspect = w / h;
    }

    // setAnimationLoop passes the time in milliseconds.
    function loop(ms) {
      pose((ms / 1000) % LOOP);
      renderer.render(scene, camera);
    }

    // Reduced motion: one wide still frame with every prop in place.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function still() {
      renderer.setAnimationLoop(null);
      pose(3.2);
      drawScreen(1, 0);
      renderer.render(scene, camera);
    }
    function apply() {
      if (reduce.matches) still();
      else renderer.setAnimationLoop(loop);
    }

    window.addEventListener("resize", () => {
      resize();
      if (reduce.matches) still();
    });
    reduce.addEventListener("change", apply);

    resize();
    apply();
  </script>
</body>
</html>
