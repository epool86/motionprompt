<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat story demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@5.3.0/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-sans@5.3.0/700.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=f6eee6&ink=1f1c2c&accent=5b3df5&accent2=ff7a59 */
    :root {
      --bg: #f6eee6;
      --ink: #1f1c2c;
      --accent: #5b3df5;
      --accent2: #ff7a59;
      --muted: color-mix(in srgb, var(--ink) 48%, white);
      --wall: color-mix(in srgb, var(--bg) 70%, white);
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    /* Soft backdrop with two coloured glows */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(50% 45% at 80% 18%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%),
        radial-gradient(50% 45% at 15% 88%, color-mix(in srgb, var(--accent2) 26%, transparent), transparent 70%),
        var(--bg);
    }

    /* Everything inside the phone is sized in em, so it scales with one font size */
    .phone {
      position: absolute;
      left: 0;
      top: 0;
      padding: 0.5em;
      border-radius: 2.8em;
      background: #17161d;
      box-shadow:
        0 0 0 0.12em #2d2b36 inset,
        0 2.4em 3.5em -1em rgb(30 20 60 / 0.35),
        0 0.8em 1.4em -0.6em rgb(30 20 60 / 0.3);
    }
    .phone.bleed {
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      background: none;
    }
    .screen {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 2.3em;
      background: var(--wall);
    }
    .bleed .screen { border-radius: 0; }

    .status {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
      height: 1.7em;
      padding: 0 1.4em;
      background: #fff;
      font-size: 1em;
    }
    .status b { font-size: 0.6em; font-weight: 700; }
    .status svg { height: 0.55em; }
    .island {
      position: absolute;
      left: 50%;
      top: 0.35em;
      width: 4.4em;
      height: 1.15em;
      margin-left: -2.2em;
      border-radius: 1em;
      background: #17161d;
    }
    .bleed .island { display: none; }

    .header {
      display: flex;
      align-items: center;
      gap: 0.55em;
      flex: none;
      height: 2.9em;
      padding: 0 0.8em 0 0.55em;
      background: #fff;
      box-shadow: 0 0.05em 0 rgb(0 0 0 / 0.07);
      position: relative;
      z-index: 2;
    }
    .header .back { width: 0.8em; color: var(--accent); }
    .avatar {
      display: grid;
      place-items: center;
      flex: none;
      width: 2em;
      height: 2em;
      border-radius: 50%;
      background: linear-gradient(140deg, color-mix(in srgb, var(--accent2) 80%, white), var(--accent2));
      color: #fff;
      font-size: 1em;
      position: relative;
    }
    .avatar span { font-size: 0.72em; font-weight: 700; letter-spacing: 0.02em; }
    .avatar::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0.05em;
      width: 0.5em;
      height: 0.5em;
      border-radius: 50%;
      background: #2fc27a;
      box-shadow: 0 0 0 0.12em #fff;
    }
    .who { flex: 1; min-width: 0; line-height: 1.2; }
    .who b { display: block; font-size: 0.8em; font-weight: 700; white-space: nowrap; }
    .who small { position: relative; display: block; height: 1.25em; font-size: 0.6em; }
    .who small span { position: absolute; left: 0; top: 0; white-space: nowrap; }
    .who .online { color: var(--muted); }
    .who .typing { color: var(--accent); font-weight: 700; opacity: 0; }
    .header .icons { display: flex; gap: 0.8em; color: var(--accent); }
    .header .icons svg { width: 1em; height: 1em; }

    /* Chat area with a faint dotted wallpaper */
    .chat {
      position: relative;
      flex: 1;
      overflow: hidden;
      background-image: radial-gradient(circle, color-mix(in srgb, var(--ink) 9%, transparent) 0.06em, transparent 0.08em);
      background-size: 1.1em 1.1em;
    }
    .list {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      padding: 0.7em 0.75em;
    }
    .day {
      display: table;
      margin: 0 auto 0.3em;
      padding: 0.3em 0.8em;
      border-radius: 1em;
      background: rgb(255 255 255 / 0.85);
      color: var(--muted);
      font-size: 0.56em;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .msg {
      display: flex;
      margin-top: 0.4em;
    }
    .msg.out { justify-content: flex-end; }
    .msg.gap { margin-top: 0.15em; }
    .msg.reacted { margin-bottom: 0.75em; }
    .bubble {
      position: relative;
      max-width: 80%;
      padding: 0.45em 0.65em 0.4em;
      border-radius: 1em;
      font-size: 1em;
      line-height: 1.25;
      box-shadow: 0 0.06em 0.12em rgb(30 20 60 / 0.1);
    }
    .in .bubble {
      background: #fff;
      border-bottom-left-radius: 0.25em;
      transform-origin: 0 100%;
    }
    .out .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 0.25em;
      transform-origin: 100% 100%;
    }
    .bubble p { margin: 0; font-size: 0.8em; font-weight: 500; }
    .meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.25em;
      margin-top: 0.1em;
      font-size: 0.5em;
      opacity: 0.65;
    }
    .out .meta { opacity: 0.85; }
    .ticks { width: 1.5em; height: 0.9em; }
    .ticks path { stroke: currentColor; }
    .ticks.read { color: #9ff0ff; }

    /* Heart reaction that hangs off the bubble corner */
    .react {
      position: absolute;
      left: 0.5em;
      bottom: -0.8em;
      display: flex;
      align-items: center;
      gap: 0.2em;
      padding: 0.18em 0.35em;
      border-radius: 1em;
      background: #fff;
      box-shadow: 0 0.08em 0.25em rgb(30 20 60 / 0.2);
      font-size: 1.05em;
      opacity: 0;
    }
    .react svg { width: 0.75em; height: 0.75em; color: var(--accent2); }
    .react b { font-size: 0.55em; color: var(--muted); }

    /* Voice note */
    .voice { display: flex; align-items: center; gap: 0.5em; width: 72%; max-width: none; }
    .voice .play {
      display: grid;
      place-items: center;
      flex: none;
      width: 1.7em;
      height: 1.7em;
      border-radius: 50%;
      background: #fff;
      color: var(--accent);
    }
    .voice .play svg { width: 0.7em; height: 0.7em; }
    .voice .body { flex: 1; }
    .wave {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.12em;
      height: 1.3em;
    }
    .wave i {
      flex: 1;
      border-radius: 0.1em;
      background: rgb(255 255 255 / 0.45);
    }
    .wave i.on { background: #fff; }
    .wave .head {
      position: absolute;
      top: 50%;
      left: 0;
      width: 0.5em;
      height: 0.5em;
      margin: -0.25em 0 0 -0.25em;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 0.12em color-mix(in srgb, var(--accent) 60%, white);
    }
    .voice .meta { justify-content: space-between; }

    /* Typing bubble with three bouncing dots */
    .typing-bubble {
      position: absolute;
      left: 0.75em;
      display: flex;
      gap: 0.22em;
      padding: 0.6em 0.7em;
      border-radius: 1em;
      border-bottom-left-radius: 0.25em;
      background: #fff;
      box-shadow: 0 0.06em 0.12em rgb(30 20 60 / 0.1);
      transform-origin: 0 100%;
      opacity: 0;
    }
    .typing-bubble i {
      width: 0.36em;
      height: 0.36em;
      border-radius: 50%;
      background: var(--muted);
    }

    /* Message bar */
    .composer {
      display: flex;
      align-items: center;
      gap: 0.5em;
      flex: none;
      height: 3em;
      padding: 0 0.7em 0.3em;
      background: #fff;
      box-shadow: 0 -0.05em 0 rgb(0 0 0 / 0.07);
    }
    .composer .plus { width: 1.1em; color: var(--accent); flex: none; }
    .field {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 1.9em;
      border-radius: 1em;
      background: color-mix(in srgb, var(--ink) 6%, white);
      overflow: hidden;
    }
    .field span {
      position: absolute;
      left: 0.85em;
      right: 0.6em;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.72em;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
    }
    .field .hint { color: var(--muted); }
    .field .rec { display: flex; align-items: center; gap: 0.45em; color: var(--ink); }
    .field .rec i { width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--accent2); }
    .caret { display: inline-block; width: 0.08em; height: 1em; margin-left: 0.05em; vertical-align: -0.12em; background: var(--accent); }
    .send {
      display: grid;
      place-items: center;
      flex: none;
      width: 1.9em;
      height: 1.9em;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
    }
    .send svg { width: 0.85em; height: 0.85em; }
  </style>
</head>
<body>
  <div class="stage" id="stage" role="img">
    <div class="phone" id="phone">
      <div class="screen" id="screen">
        <div class="status">
          <b>9:41</b>
          <span class="island"></span>
          <svg viewBox="0 0 44 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0.5" width="3" height="11.5" rx="1"/><rect x="23" y="1" width="18" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="25" y="3" width="11" height="6" rx="1.5"/><rect x="42" y="4" width="2" height="4" rx="1"/></svg>
        </div>
        <div class="header">
          <svg class="back" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>
          <div class="avatar"><span id="initials"></span></div>
          <div class="who">
            <b id="name"></b>
            <small><span class="online" id="online">online</span><span class="typing" id="typing">typing...</span></small>
          </div>
          <div class="icons">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="m15.5 10.5 6-3.5v10l-6-3.5z"/></svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3.5h3.5l2 5-2.5 1.5a11 11 0 0 0 6 6l1.5-2.5 5 2V19a2 2 0 0 1-2 2A17 17 0 0 1 3 5.5a2 2 0 0 1 2-2z"/></svg>
          </div>
        </div>
        <div class="chat" id="chat">
          <div class="list" id="list">
            <div class="day">TODAY</div>
          </div>
        </div>
        <div class="composer">
          <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <div class="field" id="field"></div>
          <div class="send" id="send"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const root = document.documentElement;
    for (const key of ["bg", "ink", "accent", "accent2"]) {
      const value = params.get(key);
      if (/^[0-9a-f]{6}$/i.test(value ?? "")) root.style.setProperty(`--${key}`, `#${value}`);
    }
    const first = (params.get("text") || "Hi! Do you deliver to Penang?").trim().slice(0, 60);
    const $ = (id) => document.getElementById(id);
    const stage = $("stage"), phone = $("phone"), screen = $("screen"), chat = $("chat"), list = $("list");
    const field = $("field"), send = $("send"), online = $("online"), typingLabel = $("typing");

    $("name").textContent = "Sunny Florist";
    $("initials").textContent = "SF";
    stage.setAttribute("aria-label", `A phone chat with a flower shop. The customer asks "${first}" and the shop replies "Yes! Free delivery this week", with typing dots, a heart reaction and a voice note.`);

    const L = 12; // loop length in seconds

    // The script: who says what, and when it lands. Typing windows show the dots first.
    const script = [
      { out: true, text: first, type: [0.35, 1.25], at: 1.4, read: 1.85 },
      { text: "Yes! Free delivery this week", dots: [1.95, 3.0], at: 3.0, react: 4.35 },
      { text: "Order by 6pm, ships today", at: 3.6, gap: true },
      { out: true, voice: true, rec: [4.75, 5.65], at: 5.75, read: 6.15, play: [6.1, 7.7] },
      { text: "Saturday works, booked!", dots: [6.45, 7.55], at: 7.55 },
      { out: true, text: "Amazing, thank you!", type: [8.15, 8.9], at: 9.05, read: 9.45 },
      { text: "Anytime! Have a lovely day", dots: [9.55, 10.35], at: 10.35 },
    ];

    const icon = {
      ticks: `<svg class="ticks" viewBox="0 0 18 11" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m1 6 3 3 6-7M8 8.5l.5.5 6-7"/></svg>`,
      heart: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8.5-5.3-8.5-11.3A4.7 4.7 0 0 1 12 6.8a4.7 4.7 0 0 1 8.5 2.9C20.5 15.7 12 21 12 21z"/></svg>`,
      play: `<svg viewBox="0 0 10 10" fill="currentColor"><path d="M2 1v8l7-4z"/></svg>`,
      pause: `<svg viewBox="0 0 10 10" fill="currentColor"><rect x="1.5" y="1" width="2.5" height="8" rx="0.6"/><rect x="6" y="1" width="2.5" height="8" rx="0.6"/></svg>`,
      mic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="currentColor" stroke="none"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`,
      send: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 20.5 21 12 3.5 3.5v6.7L15 12 3.5 13.8z"/></svg>`,
    };

    // Build the bubbles. Voice note bars get a fixed, speech like shape.
    const BARS = 26;
    const barHeights = Array.from({ length: BARS }, (_, i) => 0.25 + 0.75 * Math.abs(Math.sin(i * 1.7) * Math.sin(i * 0.53 + 1)));
    const clock = ["10:24", "10:25", "10:25", "10:26", "10:27", "10:27", "10:28"];
    script.forEach((m, i) => {
      const row = document.createElement("div");
      row.className = `msg ${m.out ? "out" : "in"}${m.gap ? " gap" : ""}${m.react ? " reacted" : ""}`;
      const meta = `<div class="meta">${m.voice ? "<span class=\"dur\">0:04</span>" : ""}<span>${clock[i]}${m.out ? " " + icon.ticks : ""}</span></div>`;
      if (m.voice) {
        row.innerHTML = `<div class="bubble voice"><span class="play">${icon.play}</span><div class="body"><div class="wave">${
          barHeights.map((h) => `<i style="height:${(h * 100).toFixed(0)}%"></i>`).join("")}<span class="head"></span></div>${meta}</div></div>`;
      } else {
        row.innerHTML = `<div class="bubble"><p></p>${meta}${m.react ? `<span class="react">${icon.heart}<b>1</b></span>` : ""}</div>`;
        row.querySelector("p").textContent = m.text;
      }
      list.append(row);
      m.row = row;
      m.bubble = row.querySelector(".bubble");
      m.ticks = row.querySelector(".ticks");
    });
    const typingBubble = document.createElement("div");
    typingBubble.className = "typing-bubble";
    typingBubble.innerHTML = "<i></i><i></i><i></i>";
    list.append(typingBubble);
    const dots = [...typingBubble.children];
    const voice = script.find((m) => m.voice);
    const bars = [...voice.row.querySelectorAll(".wave i")];
    const head = voice.row.querySelector(".head");
    const playBtn = voice.row.querySelector(".play");
    const dur = voice.row.querySelector(".dur");

    // Tall windows show the chat full screen. Other shapes show a floating phone.
    let bleed = false;
    function layout() {
      const W = innerWidth, H = innerHeight;
      bleed = W / H < 0.64;
      phone.classList.toggle("bleed", bleed);
      let em, sw, sh, x, y;
      if (bleed) {
        em = Math.min(W / 15.5, H / 24);
        sw = W; sh = H;
        x = 0; y = 0;
      } else {
        const aspect = Math.min(0.6, Math.max(0.5, (W / H) * 0.62)); // screen width / height
        const outW = 15.5 + 1, outH = 15.5 / aspect + 1;
        em = Math.min((W * 0.9) / outW, (H * 0.9) / outH);
        sw = 15.5 * em; sh = (15.5 / aspect) * em;
        x = (W - outW * em) / 2; y = (H - outH * em) / 2;
      }
      phone.style.fontSize = `${em}px`;
      screen.style.width = `${sw}px`;
      screen.style.height = `${sh}px`;
      phone.style.left = `${x}px`;
      phone.style.top = `${y}px`;
      return em;
    }

    // Small state that is a pure function of time: the message bar, header status, dots and playback.
    let last = {};
    function paint(t) {
      let kind = "hint", typed = "", secs = 0;
      for (const m of script) {
        if (m.type && t >= m.type[0] && t < m.at) {
          kind = "type";
          typed = m.text.slice(0, Math.round(Math.min(1, (t - m.type[0]) / (m.type[1] - m.type[0])) * m.text.length));
        }
        if (m.rec && t >= m.rec[0] && t < m.at) {
          kind = "rec";
          secs = Math.min(4, Math.floor(((t - m.rec[0]) / (m.rec[1] - m.rec[0])) * 4));
        }
      }
      const mode = kind === "rec" ? "rec" : typed ? "send" : "mic";
      const key = `${kind}|${typed}|${secs}`;
      if (key !== last.field) {
        if (kind === "rec") field.innerHTML = `<span class="rec"><i></i>Recording 0:0${secs}</span>`;
        else if (kind === "type") {
          field.innerHTML = `<span></span>`;
          field.firstChild.textContent = typed;
          field.firstChild.insertAdjacentHTML("beforeend", `<i class="caret"></i>`);
        } else field.innerHTML = `<span class="hint">Message</span>`;
        last.field = key;
      }
      if (mode !== last.mode) {
        send.innerHTML = mode === "send" ? icon.send : icon.mic;
        last.mode = mode;
      }
      // Recording dot blinks.
      const recDot = field.querySelector(".rec i");
      if (recDot) recDot.style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.cos(t * 9));
      const caret = field.querySelector(".caret");
      if (caret) caret.style.opacity = (t * 2.5) % 1 < 0.6 ? 1 : 0;

      // Header says typing while the shop types.
      const typing = script.some((m) => m.dots && t >= m.dots[0] && t < m.at);
      if (typing !== last.typing) {
        online.style.opacity = typing ? 0 : 1;
        typingLabel.style.opacity = typing ? 1 : 0;
        last.typing = typing;
      }
      dots.forEach((d, i) => {
        const b = Math.max(0, Math.sin(t * Math.PI * 3.2 - i * 0.9));
        d.style.transform = `translateY(${-b * 0.28}em)`;
        d.style.opacity = 0.45 + 0.55 * b;
      });

      // Read ticks turn bright once the shop has seen the message.
      for (const m of script) {
        if (m.ticks) m.ticks.classList.toggle("read", t >= m.read);
      }

      // Voice note playback.
      const p = gsap.utils.clamp(0, 1, (t - voice.play[0]) / (voice.play[1] - voice.play[0]));
      const playing = p > 0 && p < 1;
      const on = Math.round(p * BARS);
      if (on !== last.on) {
        bars.forEach((b, i) => b.classList.toggle("on", i < on));
        last.on = on;
      }
      head.style.left = `${p * 100}%`;
      if (playing !== last.playing) {
        playBtn.innerHTML = playing ? icon.pause : icon.play;
        last.playing = playing;
      }
      dur.textContent = `0:0${playing ? Math.floor(p * 4) : 4}`;
    }

    let tl;
    function build(time = 0) {
      if (tl) tl.kill();
      last = {};
      gsap.set([list, phone], { clearProps: "transform,opacity,visibility" });
      const em = layout();
      const viewH = chat.clientHeight;
      const pad = 0.7 * em;
      // Where the list must sit so a given bottom edge stays in view.
      const scrollFor = (bottom) => Math.min(0, viewH - bottom - pad);
      const bottomOf = (m) => m.row.offsetTop + m.row.offsetHeight + (m.react ? 0.75 * em : 0);

      tl = gsap.timeline({ repeat: -1, onUpdate: () => paint(tl.time()) });
      // Each step applies its start values only when it begins, not when it is created.
      const fromTo = (targets, from, to, at) => tl.fromTo(targets, from, { ...to, immediateRender: false }, at);

      gsap.set(script.map((m) => m.bubble), { autoAlpha: 0 });
      gsap.set(".react", { autoAlpha: 0, scale: 0 });
      gsap.set(typingBubble, { autoAlpha: 0 });

      // The floating phone bobs gently. Full screen chat stays still.
      if (!bleed) {
        tl.fromTo(phone, { y: 0 }, { y: -0.5 * em, duration: L / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
        tl.fromTo(phone, { rotation: -1.2 }, { rotation: 1.2, duration: L / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      }

      let y = 0;
      script.forEach((m) => {
        if (m.dots) {
          const top = m.row.offsetTop;
          const bottom = top + typingBubble.offsetHeight;
          typingBubble.style.top = `${top}px`;
          fromTo(typingBubble, { autoAlpha: 0, scale: 0.4, top }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, m.dots[0]);
          tl.to(typingBubble, { autoAlpha: 0, scale: 0.6, duration: 0.12, ease: "power1.in" }, m.at - 0.1);
          const ty = scrollFor(bottom);
          if (ty < y) { tl.to(list, { y: ty, duration: 0.5, ease: "power3.out" }, m.dots[0]); y = ty; }
        }
        const ty = scrollFor(bottomOf(m));
        if (ty < y) { tl.to(list, { y: ty, duration: 0.55, ease: "power3.out" }, m.at); y = ty; }
        // Springy pop from the bubble tail.
        fromTo(m.bubble, { autoAlpha: 0, scale: 0.3, y: 0.6 * em }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(2)" }, m.at);
        if (m.react) {
          const react = m.row.querySelector(".react");
          fromTo(react, { autoAlpha: 0, scale: 0, rotation: -25 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.8, ease: "elastic.out(1.1, 0.45)" }, m.react);
          fromTo(m.bubble, { scale: 1 }, { scale: 1.05, duration: 0.14, yoyo: true, repeat: 1, ease: "power1.inOut" }, m.react - 0.05);
        }
        // The send button dips when a message goes, and the mic swells while it records.
        if (m.type) fromTo(send, { scale: 1 }, { scale: 0.82, duration: 0.1, yoyo: true, repeat: 1, ease: "power1.inOut" }, m.at - 0.12);
        if (m.rec) {
          fromTo(send, { scale: 1 }, { scale: 1.2, duration: 0.3, ease: "back.out(3)" }, m.rec[0]);
          fromTo(send, { scale: 1.2 }, { scale: 1, duration: 0.2, ease: "power2.out" }, m.at - 0.1);
        }
      });

      // Clear the chat and scroll back to the top, ready to loop.
      tl.to(list, { autoAlpha: 0, y: y - 2 * em, duration: 0.45, ease: "power2.in" }, L - 0.8)
        .set(script.map((m) => m.bubble), { autoAlpha: 0 }, L - 0.34)
        .set(".react", { autoAlpha: 0 }, L - 0.34)
        .set(list, { y: 0 }, L - 0.34)
        .to(list, { autoAlpha: 1, duration: 0.3, ease: "power1.out" }, L - 0.32)
        .set({}, {}, L);

      applyMotion(time);
    }

    // Reduced motion: a still frame with the whole story on screen.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function applyMotion(time = tl.time()) {
      if (reduce.matches) tl.pause(7.95);
      else tl.play(time);
      paint(tl.time());
    }
    reduce.addEventListener("change", () => applyMotion());

    // Sound: every sound is made with the Web Audio API. It is off until the
    // parent page (or ?sound=1 / ?sound=effects) turns it on, and it follows the
    // GSAP timeline clock, so taps, pops and ticks land on the chat. All the tones
    // here are our own, not any real app's alert sounds.
    const sound = (() => {
      const LEVEL = 1.45, MUSIC = 0.1;
      const BEAT = L / 16; // 80 bpm: four bars fill one 12 s loop exactly
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      const clock = () => (tl && !tl.paused() ? tl.totalTime() : null);
      const loopLength = () => tl.duration();
      let crackle = null;
      let ctx = null, master, impulse, noiseBuf, session = null, fxBus, musicBus, verbSend;
      let wantOn = false, wantMusic = true, playing = false;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0;

      // The list of sounds for one loop, worked out from the same script as the timeline.
      function plan() {
        const list = [];
        const add = (t, type, extra = {}, music = false) => list.push({ t, type, music, ...extra });
        let s = 5;
        const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
        script.forEach((m) => {
          if (m.type) {
            // One key tap for each letter that appears in the message bar (thinned if very fast).
            const n = m.text.length, span = m.type[1] - m.type[0];
            let lastTap = -1;
            for (let k = 1; k <= n; k++) {
              const t = m.type[0] + ((k - 0.5) / n) * span;
              if (t - lastTap < 0.045) continue;
              lastTap = t;
              add(t, "key", { space: m.text[k - 1] === " ", f: 2600 + rnd() * 1200, v: 0.7 + rnd() * 0.3 });
            }
          }
          if (m.rec) add(m.rec[0], "rec", {});
          if (m.out) {
            add(m.at - 0.12, "whoosh", {});
            add(m.at, "popOut", {});
            add(m.read, "read", {});
          } else add(m.at, "popIn", {});
          if (m.dots) {
            add(m.dots[0], "dotsIn", {});
            // A soft blip as each typing dot reaches the top of its bounce (same wave as paint()).
            for (let k = 0; k < 20; k++) {
              for (let i = 0; i < 3; i++) {
                const t = (Math.PI / 2 + 0.9 * i + 2 * Math.PI * k) / (Math.PI * 3.2);
                if (t > m.dots[0] + 0.15 && t < m.at - 0.1) add(t, "dot", { i });
              }
            }
          }
          if (m.react) add(m.react, "heart", {});
          if (m.play) {
            add(m.play[0], "play", { on: true });
            add(m.play[1], "play", { on: false });
          }
        });
        // The chat clears at the end of the loop.
        add(L - 0.8, "clear", {});

        // Music: lo-fi. Soft electric piano chords, a round bass, dusty drums and vinyl crackle.
        // Fmaj7  Em7  Dm7  Cmaj7, one chord per bar.
        const chords = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]];
        const roots = [41, 40, 38, 36];
        const swing = BEAT * 0.58; // late off-beats for a lazy feel
        chords.forEach((notes, bar) => {
          const t0 = bar * 4 * BEAT;
          add(t0, "keys", { notes: notes.map(hz), dur: BEAT * 2.3, v: 1 }, true);
          add(t0 + 2 * BEAT + swing, "keys", { notes: notes.map(hz), dur: BEAT * 1.2, v: 0.6 }, true);
          add(t0, "bass", { f: hz(roots[bar]), dur: BEAT * 1.7 }, true);
          add(t0 + 2 * BEAT + swing, "bass", { f: hz(roots[bar] + (bar === 3 ? 7 : 0)), dur: BEAT * 1.2 }, true);
          add(t0, "kick", {}, true);
          add(t0 + 2 * BEAT + swing, "kick", { v: 0.7 }, true);
          add(t0 + BEAT, "snare", {}, true);
          add(t0 + 3 * BEAT, "snare", {}, true);
          for (let b = 0; b < 4; b++) {
            add(t0 + b * BEAT, "hat", { v: 0.7 }, true);
            add(t0 + b * BEAT + swing, "hat", { v: 0.4 }, true);
          }
          add(t0, "crackle", { dur: 4 * BEAT }, true);
        });
        return list.sort((a, b) => a.t - b.t);
      }
      let events = plan();

      // Audio graph: effects and music buses, a small reverb, a compressor before the speakers.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);

        // Reverb impulse: stereo noise that fades out.
        const len = Math.floor(ctx.sampleRate * 1.4);
        impulse = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = impulse.getChannelData(ch);
          for (let s = 0; s < len; s++) d[s] = (Math.random() * 2 - 1) * Math.pow(1 - s / len, 3.5);
        }

        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const nd = noiseBuf.getChannelData(0);
        for (let s = 0; s < nd.length; s++) nd[s] = Math.random() * 2 - 1;

        // Vinyl crackle: sparse little clicks over a faint hiss, made once in code.
        const sr = ctx.sampleRate;
        crackle = ctx.createBuffer(1, sr * 3, sr);
        const cd = crackle.getChannelData(0);
        for (let i = 0; i < cd.length; i++) {
          cd[i] = (Math.random() * 2 - 1) * 0.02;
          if (Math.random() < 0.0004) cd[i] += (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.7);
        }
      }

      // Each time sound is turned on it gets fresh buses, so sounds queued before a
      // stop can never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.05);
        session.connect(master);
        fxBus = ctx.createGain();
        fxBus.connect(session);
        musicBus = ctx.createGain();
        musicBus.gain.value = wantMusic ? MUSIC : 0;
        musicBus.connect(session);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const tone = ctx.createBiquadFilter();
        tone.type = "lowpass";
        tone.frequency.value = 4000;
        const verbOut = ctx.createGain();
        verbOut.gain.value = 0.3;
        verbSend = ctx.createGain();
        verbSend.connect(verb).connect(tone).connect(verbOut).connect(session);
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.disconnect(), 250);
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function send(node, amount) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(verbSend);
      }
      // A gain that follows a list of [time offset, level] points with straight ramps.
      function shape(when, points, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, when);
        for (const [dt, v] of points) g.gain.linearRampToValueAtTime(v, when + dt);
        g.connect(out);
        return g;
      }

      // One function per sound.
      const voices = {
        key(when, e) {
          // A soft screen keyboard tap: a tiny click with a little body.
          const g = amp(when, 0.11 * e.v, 0.001, 0.03, pan(0.15, fxBus));
          noise(when, 0.03).connect(filter("bandpass", e.space ? 1500 : e.f, 1.5)).connect(g);
          osc("sine", e.space ? 150 : 210, when, 0.04).connect(amp(when, 0.12 * e.v, 0.002, 0.03, fxBus));
        },
        whoosh(when) {
          // Sending: a quick upward whoosh.
          const bp = filter("bandpass", 700, 1.3);
          bp.frequency.setValueAtTime(700, when);
          bp.frequency.exponentialRampToValueAtTime(4200, when + 0.18);
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(0, when);
          p.pan.linearRampToValueAtTime(0.35, when + 0.2);
          p.connect(fxBus);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.16, when + 0.1);
          g.gain.exponentialRampToValueAtTime(0.0001, when + 0.22);
          noise(when, 0.25).connect(bp).connect(g).connect(p);
        },
        popOut(when) {
          // Our message lands on the right: a bright bloop that bends up.
          const g = amp(when, 0.26, 0.004, 0.16, pan(0.3, fxBus));
          const o = osc("sine", hz(76), when, 0.2);
          o.frequency.exponentialRampToValueAtTime(hz(83), when + 0.06);
          o.connect(g);
          osc("triangle", hz(88), when, 0.08).connect(amp(when, 0.03, 0.002, 0.05, g));
          send(g, 0.25);
        },
        popIn(when) {
          // A reply lands on the left: a lower, rounder two note pop.
          const out = pan(-0.3, fxBus);
          const g = amp(when, 0.26, 0.004, 0.2, out);
          const o = osc("sine", hz(64) * 0.8, when, 0.24);
          o.frequency.exponentialRampToValueAtTime(hz(64), when + 0.04);
          o.connect(g);
          const t2 = when + 0.07;
          const g2 = amp(t2, 0.18, 0.004, 0.22, out);
          osc("sine", hz(69), t2, 0.26).connect(g2);
          osc("triangle", hz(81), t2, 0.08).connect(amp(t2, 0.02, 0.002, 0.05, g2));
          send(g2, 0.3);
        },
        read(when) {
          // Two tiny clicks as the ticks turn read.
          [0, 0.045].forEach((dt, k) => {
            const t = when + dt;
            const g = amp(t, 0.07, 0.001, 0.02, pan(0.35, fxBus));
            noise(t, 0.02).connect(filter("bandpass", 5200 + k * 700, 2)).connect(g);
            osc("sine", 2400 + k * 300, t, 0.03).connect(amp(t, 0.03, 0.001, 0.02, g));
          });
        },
        dotsIn(when) {
          const g = amp(when, 0.08, 0.004, 0.1, pan(-0.3, fxBus));
          const o = osc("sine", hz(72) * 0.7, when, 0.12);
          o.frequency.exponentialRampToValueAtTime(hz(72), when + 0.05);
          o.connect(g);
        },
        dot(when, e) {
          // Typing dots: very soft blips, one per dot.
          const f = hz([79, 81, 84][e.i]);
          osc("sine", f, when, 0.08).connect(amp(when, 0.03, 0.008, 0.06, pan(-0.3, fxBus)));
        },
        heart(when) {
          // Heart reaction: a springy pop with a little sparkle.
          const out = pan(-0.2, fxBus);
          const g = amp(when, 0.24, 0.004, 0.22, out);
          const o = osc("sine", hz(72), when, 0.3);
          o.frequency.exponentialRampToValueAtTime(hz(84), when + 0.08);
          o.frequency.exponentialRampToValueAtTime(hz(81), when + 0.2);
          o.connect(g);
          [88, 91, 96].forEach((m, k) => {
            const t = when + 0.08 + k * 0.05;
            osc("sine", hz(m), t, 0.25).connect(amp(t, 0.05, 0.002, 0.2, out));
          });
          send(g, 0.5);
        },
        rec(when) {
          // Mic starts recording: two soft rising notes.
          [0, 0.07].forEach((dt, k) => {
            const t = when + dt;
            osc("sine", hz(67 + k * 5), t, 0.12).connect(amp(t, 0.1, 0.004, 0.1, pan(0.3, fxBus)));
          });
        },
        play(when, e) {
          // Voice note play (a small up blip) and stop (a small down blip).
          const g = amp(when, e.on ? 0.16 : 0.1, 0.002, 0.08, pan(0.3, fxBus));
          const o = osc("triangle", e.on ? hz(74) : hz(79), when, 0.1);
          o.frequency.exponentialRampToValueAtTime(e.on ? hz(79) : hz(74), when + 0.05);
          o.connect(filter("lowpass", 3000)).connect(g);
          noise(when, 0.02).connect(filter("highpass", 3000)).connect(amp(when, 0.05, 0.001, 0.01, g));
        },
        clear(when) {
          // The chat slides away: a soft downward swoosh.
          const bp = filter("bandpass", 2400, 1);
          bp.frequency.setValueAtTime(2400, when);
          bp.frequency.exponentialRampToValueAtTime(500, when + 0.45);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.1, when + 0.2);
          g.gain.exponentialRampToValueAtTime(0.0001, when + 0.5);
          noise(when, 0.5).connect(bp).connect(g).connect(fxBus);
          send(g, 0.3);
        },
        keys(when, e) {
          // Soft electric piano: a sine bell tone with a little wobble, slightly out of time for a human feel.
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.09 * e.v, when + 0.02);
          g.gain.exponentialRampToValueAtTime(0.04 * e.v, when + 0.4);
          g.gain.exponentialRampToValueAtTime(0.0001, when + e.dur);
          const trem = ctx.createGain();
          trem.gain.value = 0.85;
          const lfo = osc("sine", 4.5, when, e.dur);
          const depth = ctx.createGain();
          depth.gain.value = 0.15;
          lfo.connect(depth).connect(trem.gain);
          const lp = filter("lowpass", 2200);
          g.connect(trem).connect(lp).connect(musicBus);
          e.notes.forEach((f, k) => {
            const t = when + k * 0.012;
            const c = osc("sine", f, t, e.dur);
            const mod = osc("sine", f, t, e.dur);
            const idx = ctx.createGain();
            idx.gain.setValueAtTime(f * 1.2, t);
            idx.gain.exponentialRampToValueAtTime(f * 0.1, t + 0.5);
            mod.connect(idx).connect(c.frequency);
            c.connect(g);
          });
          send(g, 0.5);
        },
        bass(when, e) {
          const g = amp(when, 0.36, 0.01, e.dur, musicBus);
          osc("sine", e.f, when, e.dur + 0.02).connect(g);
          osc("triangle", e.f, when, e.dur + 0.02).connect(filter("lowpass", 300)).connect(amp(when, 0.3, 0.01, e.dur * 0.6, g));
        },
        kick(when, e) {
          const o = osc("sine", 100, when, 0.3);
          o.frequency.exponentialRampToValueAtTime(42, when + 0.12);
          o.connect(amp(when, 0.5 * (e.v || 1), 0.004, 0.24, musicBus));
        },
        snare(when) {
          // Dusty, soft snare: filtered noise with a short body.
          const g = amp(when, 0.14, 0.003, 0.14, musicBus);
          noise(when, 0.18).connect(filter("bandpass", 1600, 0.8)).connect(filter("lowpass", 3500)).connect(g);
          osc("triangle", 180, when, 0.08).connect(amp(when, 0.08, 0.002, 0.06, musicBus));
          send(g, 0.5);
        },
        hat(when, e) {
          noise(when, 0.05).connect(filter("bandpass", 7000, 0.9)).connect(amp(when, 0.07 * e.v, 0.002, 0.035, musicBus));
        },
        crackle(when, e) {
          const src = ctx.createBufferSource();
          src.buffer = crackle;
          src.loop = true;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(0.18, when + 0.05);
          g.gain.setValueAtTime(0.18, when + e.dur - 0.05);
          g.gain.linearRampToValueAtTime(0.0001, when + e.dur + 0.02);
          src.connect(filter("bandpass", 2500, 0.6)).connect(g).connect(musicBus);
          src.start(when, Math.random() * 2);
          src.stop(when + e.dur + 0.05);
        },
      };

      // Look-ahead scheduler: every 25 ms, schedule sounds due in the next 100 ms.
      // Animation time is mapped to audio time by an anchor that is re-set after any jump
      // (a pause, a hidden tab, a restart), so missed sounds never pile up.
      function tick() {
        const now = playing && ctx.state === "running" && !document.hidden && !reduce.matches ? clock() : null;
        if (now === null) { anchor = null; return; }
        const loopLen = loopLength();
        const at = ctx.currentTime;
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.08) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          doneUpTo = now; // start fresh: nothing piles up
        }
        const cur = anchor.tl + (at - anchor.audio);
        const from = Math.max(doneUpTo, cur - 0.05); // after a stall, skip what is already late
        const to = cur + 0.1;
        if (to <= from) return;
        for (let k = Math.floor(from / loopLen); k <= Math.floor(to / loopLen); k++) {
          for (const e of events) {
            const t = k * loopLen + e.t;
            if (t < from || t >= to) continue;
            if (e.music && !wantMusic) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl)), e);
          }
        }
        doneUpTo = to;
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && !reduce.matches;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            openSession();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
          const t = ctx.currentTime;
          musicBus.gain.cancelScheduledValues(t);
          musicBus.gain.setTargetAtTime(wantMusic ? MUSIC : 0, t, 0.03);
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend(), 200);
        }
      }
      reduce.addEventListener("change", update);

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);

      addEventListener("message", (event) => {
        if (event.origin !== location.origin) return;
        const data = event.data;
        if (!data || data.type !== "motionprompt-sound") return;
        if (typeof data.on === "boolean") wantOn = data.on;
        if (typeof data.music === "boolean") wantMusic = data.music;
        update();
      });

      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantOn = true;
        wantMusic = fromUrl === "1";
        update();
      }
      return { replan() { events = plan(); } };
    })();

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => build(tl ? tl.time() : 0), 120);
    });

    // Wait briefly for the font so bubbles are measured in the right face.
    Promise.race([
      Promise.all(["500", "700"].map((w) => document.fonts.load(`${w} 1em "DM Sans"`))),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => build(0));
  </script>
</body>
</html>
