<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pasar malam demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lilita-one@5.3.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/permanent-marker@5.3.0/400.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=141a3c&ink=2a1f3d&accent=d8392f&accent2=ffcf6e */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #141a3c;
    }

    svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .banner {
      font-family: "Lilita One", "Arial Black", sans-serif;
    }

    .marker {
      font-family: "Permanent Marker", "Comic Sans MS", cursive;
    }
  </style>
</head>
<body>
  <svg id="scene" role="img" xmlns="http://www.w3.org/2000/svg"></svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => "#" + (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const C = {
      night: hex("bg", "141a3c"),
      ink: hex("ink", "2a1f3d"),
      red: hex("accent", "d8392f"),
      bulb: hex("accent2", "ffcf6e"),
      dusk: ["#3b3f86", "#a2598f", "#f39a62", "#ffd08a"],
      cream: "#fff3d6",
      metal: "#2c2c33",
      ember: "#ff7a1f",
      meat: "#a9532a",
      char: "#6a2d12",
      stick: "#e9cf98",
      crust: "#d98f37",
      peanut: "#c99a5c",
      corn: "#f6d046",
      tarps: [["#d8392f", "#fff4e4"], ["#2f63c9", "#f4f6ff"], ["#f2b230", "#fff7e0"], ["#27966a", "#f0fff6"], ["#ec7a2c", "#fff3e6"], ["#7a4fc0", "#f7f0ff"]],
      goods: ["#ffb347", "#f25c54", "#ffe066", "#8bd17c", "#ff8fab", "#f4a259", "#fff1c1"],
    };
    document.body.style.background = C.night;
    const title = (params.get("text") || "Jom pasar malam!").trim().slice(0, 40);

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("scene");
    svg.setAttribute("aria-label", `A Malaysian night market lighting up at dusk: striped stalls, satay on the grill, apam balik and drinks in bags, with a banner that reads "${title}"`);

    function el(name, attrs, parent) {
      const node = document.createElementNS(NS, name);
      for (const key in attrs) node.setAttribute(key, attrs[key]);
      if (parent) parent.append(node);
      return node;
    }
    const n = (v) => +v.toFixed(2);
    const P = (x, y) => `${n(x)} ${n(y)}`;
    const TAU = Math.PI * 2;
    const LOOP = 12, STILL = 6;
    // A wave that repeats a whole number of times per loop, so the loop is seamless.
    const wave = (t, cycles, phase = 0) => Math.sin(TAU * ((t * cycles) / LOOP + phase));
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
    const frac = (v) => v - Math.floor(v);
    // Blend two hex colours.
    const mix = (a, b, t) => {
      const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
      return "#" + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, "0")).join("");
    };

    // Seeded random, so the market looks the same after a resize.
    let seed = 3;
    const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

    let W, H, u, k, L, S, R, tl;
    const A = 1.9, Z0 = 2.4, TD = 3, TW = 3, ROWS = 9;
    // Heights in metres from the eye: valance top and bottom, roof peak, ground, table top.
    const YV0 = -1.15, YV1 = -0.8, YPK = -1.8, YG = 1.6, YT = 0.7;

    function layout() {
      const a = W / H;
      const o = {};
      o.tall = a < 0.9;
      o.counterY = H * (a < 0.7 ? 0.86 : a < 0.9 ? 0.84 : 0.8);
      o.vp = [W / 2, H * (a < 0.9 ? 0.55 : a < 1.3 ? 0.52 : 0.5)];
      // The nearest aisle edge sits at this share of the half width.
      const edge = a < 0.9 ? 1.1 : a < 1.3 ? 0.7 : 0.42;
      o.F = Math.min((edge * W * 0.5 * Z0) / A, ((o.vp[1] - H * 0.16) * (Z0 + TD / 2)) / -YPK);
      o.k = Math.min(W * 0.32, H * 0.3);
      o.slots = a < 1.3 ? [W * 0.18, W * 0.5, W * 0.82] : [W * 0.24, W * 0.5, W * 0.76];
      o.stringY = H * 0.035;
      return o;
    }
    const proj = (X, Y, Z) => [L.vp[0] + (X / Z) * L.F, L.vp[1] + (Y / Z) * L.F];
    const poly = (pts) => "M" + pts.map((p) => P(p[0], p[1])).join(" L") + " Z";

    // ---------- Foreground food, drawn in units of k, sitting on the counter at 0 0 ----------

    function drawSatay(g) {
      // Legs and trough
      el("path", { d: "M-0.44 0 L-0.4 -0.12 M0.44 0 L0.4 -0.12", stroke: "#1a1a1f", "stroke-width": 0.04 }, g);
      el("path", { d: "M-0.52 -0.36 L0.52 -0.36 L0.47 -0.1 L-0.47 -0.1 Z", fill: "url(#pm-metal)" }, g);
      // Ember bed seen from the front and above
      el("path", { d: "M-0.5 -0.36 L-0.44 -0.46 L0.44 -0.46 L0.5 -0.36 Z", fill: "url(#pm-ember)" }, g);
      const glow = el("path", { d: "M-0.5 -0.36 L-0.44 -0.46 L0.44 -0.46 L0.5 -0.36 Z", fill: "#ffd27a" }, g);
      for (let i = 0; i < 16; i++) el("circle", { cx: -0.44 + rand() * 0.88, cy: -0.44 + rand() * 0.07, r: 0.015 + rand() * 0.02, fill: rand() > 0.5 ? "#ffb347" : "#7a1d0a", opacity: 0.9 }, g);
      el("path", { d: "M-0.53 -0.36 L0.53 -0.36", stroke: "#55555e", "stroke-width": 0.03, "stroke-linecap": "round" }, g);
      // Satay sticks across the grill, handles towards us
      for (let i = 0; i < 7; i++) {
        const x = -0.38 + i * 0.127;
        el("path", { d: `M${P(x - 0.02, -0.25)} L${P(x + 0.03, -0.5)}`, stroke: C.stick, "stroke-width": 0.02, "stroke-linecap": "round" }, g);
        for (let j = 0; j < 4; j++) {
          const f = 0.35 + j * 0.16, mx = x - 0.02 + 0.05 * f, my = -0.25 - 0.25 * f;
          el("ellipse", { cx: mx, cy: my, rx: 0.04, ry: 0.03, fill: j % 2 ? C.meat : "#b8612f", stroke: C.char, "stroke-width": 0.012 }, g);
        }
        el("ellipse", { cx: x + 0.005, cy: -0.39, rx: 0.018, ry: 0.01, fill: "#ffcf8a", opacity: 0.7 }, g);
      }
      return { glow };
    }

    function drawApam(g) {
      // Round iron griddle on a little stove, with batter bubbling, peanuts and corn on top
      el("path", { d: "M-0.2 -0.12 L-0.16 0 M0.44 -0.12 L0.4 0", stroke: "#1a1a1f", "stroke-width": 0.04 }, g);
      el("path", { d: "M-0.24 -0.2 L0.48 -0.2 L0.46 -0.1 L-0.22 -0.1 Z", fill: "url(#pm-metal)" }, g);
      el("ellipse", { cx: 0.12, cy: -0.23, rx: 0.43, ry: 0.14, fill: "#141317" }, g);
      el("ellipse", { cx: 0.12, cy: -0.26, rx: 0.42, ry: 0.13, fill: "#2c2a30" }, g);
      el("ellipse", { cx: 0.12, cy: -0.27, rx: 0.38, ry: 0.11, fill: "#d9953f" }, g);
      el("ellipse", { cx: 0.12, cy: -0.275, rx: 0.33, ry: 0.09, fill: "#ecbc6a" }, g);
      const holes = [];
      for (let i = 0; i < 14; i++) {
        const a = rand() * TAU, r = Math.sqrt(rand());
        holes.push({ c: el("ellipse", { cx: n(0.12 + Math.cos(a) * r * 0.29), cy: n(-0.275 + Math.sin(a) * r * 0.075), fill: "#a8661f" }, g), ph: rand() });
      }
      for (let i = 0; i < 26; i++) {
        const a = rand() * TAU, r = Math.sqrt(rand()) * 0.8;
        el("circle", { cx: n(0.12 + Math.cos(a) * r * 0.3), cy: n(-0.275 + Math.sin(a) * r * 0.075), r: 0.011, fill: i % 3 ? "#f7e2b0" : C.corn }, g);
      }
      // A folded half moon apam balik on paper, the filling peeking out of the curved edge
      el("path", { d: "M-0.58 0 L-0.5 -0.1 L0.14 -0.1 L0.08 0 Z", fill: "#f4ead2" }, g);
      el("path", { d: "M-0.5 -0.04 A0.3 0.3 0 0 1 0.1 -0.04 Z", fill: "#b86f24" }, g);
      el("path", { d: "M-0.47 -0.05 A0.27 0.27 0 0 1 0.07 -0.05 Z", fill: C.crust }, g);
      el("path", { d: "M-0.47 -0.05 A0.27 0.27 0 0 1 0.07 -0.05", fill: "none", stroke: C.peanut, "stroke-width": 0.035 }, g);
      el("path", { d: "M-0.44 -0.07 A0.24 0.24 0 0 1 0.04 -0.07 Z", fill: "#e6a247" }, g);
      for (let i = 0; i < 12; i++) {
        const a = Math.PI * (0.1 + rand() * 0.8), r = 0.05 + rand() * 0.15;
        el("ellipse", { cx: n(-0.2 + Math.cos(a) * r), cy: n(-0.07 - Math.sin(a) * r), rx: 0.016, ry: 0.012, fill: "#b8742b" }, g);
      }
      for (let i = 0; i < 7; i++) {
        const a = Math.PI * (0.08 + i * 0.14);
        el("circle", { cx: n(-0.2 - Math.cos(a) * 0.285), cy: n(-0.04 - Math.sin(a) * 0.285), r: 0.016, fill: i % 2 ? C.corn : "#f7e2b0" }, g);
      }
      return { holes };
    }

    function drawDrinks(g) {
      // A little rack; the bags hang from the bar by their string loops.
      el("path", { d: "M-0.46 0 L-0.46 -0.84 M0.46 0 L0.46 -0.84", stroke: "#b9b3c4", "stroke-width": 0.025 }, g);
      el("path", { d: "M-0.5 -0.82 L0.5 -0.82", stroke: "#d8d2e0", "stroke-width": 0.03, "stroke-linecap": "round" }, g);
      el("path", { d: "M-0.5 -0.02 L0.5 -0.02", stroke: "#b9b3c4", "stroke-width": 0.03, "stroke-linecap": "round" }, g);
      const bags = [];
      [["#f27ca3", -0.27], ["#c98a4f", 0], ["#9fd65a", 0.27]].forEach(([col, x], i) => {
        const b = el("g", {}, g);
        // Loop and knot
        el("path", { d: "M-0.035 0.13 C-0.08 0.02 -0.03 -0.03 0 0 C0.03 -0.03 0.08 0.02 0.035 0.13", fill: "none", stroke: "#f2e6c8", "stroke-width": 0.016 }, b);
        el("ellipse", { cx: 0, cy: 0.14, rx: 0.045, ry: 0.022, fill: "#f2e6c8" }, b);
        // Clear crinkled plastic above the drink, then the drink with ice inside
        el("path", { d: "M-0.03 0.15 L0.03 0.15 C0.1 0.22 0.14 0.3 0.15 0.36 L-0.15 0.36 C-0.14 0.3 -0.1 0.22 -0.03 0.15 Z", fill: "#ffffff", opacity: 0.22 }, b);
        // Creases and the drink level are thin filled shapes (hairline strokes glitch when scaled)
        el("path", { d: "M-0.02 0.17 L-0.07 0.34 L-0.06 0.34 Z M0.02 0.17 L0.05 0.34 L0.06 0.34 Z", fill: "#ffffff", opacity: 0.5 }, b);
        el("path", { d: "M-0.15 0.36 L0.15 0.36 C0.17 0.46 0.17 0.56 0.14 0.63 Q0.1 0.71 0 0.71 Q-0.1 0.71 -0.14 0.63 C-0.17 0.56 -0.17 0.46 -0.15 0.36 Z", fill: col, opacity: 0.92 }, b);
        el("rect", { x: -0.15, y: 0.355, width: 0.3, height: 0.012, fill: "#ffffff", opacity: 0.6 }, b);
        el("rect", { x: -0.08, y: 0.4, width: 0.065, height: 0.06, fill: "#ffffff", opacity: 0.4, transform: "rotate(14 -0.05 0.43)" }, b);
        el("rect", { x: 0.02, y: 0.5, width: 0.06, height: 0.055, fill: "#ffffff", opacity: 0.35, transform: "rotate(-12 0.05 0.53)" }, b);
        el("path", { d: "M-0.12 0.6 C-0.14 0.52 -0.14 0.44 -0.12 0.39", fill: "none", stroke: "#ffffff", "stroke-width": 0.02, opacity: 0.6, "stroke-linecap": "round" }, b);
        // Striped straw poking out of the neck
        el("path", { d: "M0.0 0.5 L0.1 0.05", stroke: "#ffffff", "stroke-width": 0.026, "stroke-linecap": "round" }, b);
        // Stripes as short segments (tiny dash patterns render badly when scaled up)
        let sd = "";
        for (let j = 0; j < 8; j++) {
          const f0 = 0.04 + j * 0.12, f1 = f0 + 0.06;
          sd += `M${P(0.1 * f0, 0.05 + 0.45 * (1 - f0))} L${P(0.1 * f1, 0.05 + 0.45 * (1 - f1))}`;
        }
        el("path", { d: sd, stroke: i === 1 ? "#2f63c9" : "#d8392f", "stroke-width": 0.026 }, b);
        bags.push({ b, x, ph: i * 0.3 });
      });
      return { bags };
    }

    // A hand painted price card on a stick.
    function drawSign(parent, lines, fill, ink) {
      const g = el("g", {}, parent);
      const inner = el("g", {}, g);
      el("path", { d: "M-0.01 0 L0.01 0 L0.012 0.5 L-0.012 0.5 Z", fill: "#9b7446" }, inner);
      const w = 0.62, h = lines.length > 1 ? 0.4 : 0.3;
      el("path", { d: `M${-w / 2} ${-h} L${w / 2 + 0.01} ${-h + 0.01} L${w / 2} 0.01 L${-w / 2 - 0.01} 0 Z`, fill, stroke: "#00000033", "stroke-width": 0.01 }, inner);
      if (lines.length > 1) {
        const t1 = el("text", { class: "marker", x: 0, y: -h + 0.12, "font-size": 0.1, "text-anchor": "middle", fill: "#2a1f1a" }, inner);
        t1.textContent = lines[0];
      }
      const big = lines.at(-1);
      const t2 = el("text", { class: "marker", x: 0, y: -0.07, "font-size": 1, "text-anchor": "middle", fill: ink }, inner);
      t2.textContent = big;
      // Shrink the price to fit the card.
      t2.setAttribute("font-size", n(Math.min(0.2, (w * 0.86) / Math.max(0.1, t2.getComputedTextLength())) * 100) / 100);
      if (lines.length > 1) {
        const t1 = inner.querySelector("text");
        t1.setAttribute("font-size", n(Math.min(0.1, (w * 0.86) / Math.max(0.1, t1.getComputedTextLength() * 10)) * 100) / 100);
      }
      return { g, inner };
    }

    // ---------- Build the scene ----------
    function build() {
      W = innerWidth;
      H = innerHeight;
      u = Math.min(W, H);
      seed = 3;
      svg.replaceChildren();
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      L = layout();
      k = L.k;
      const defs = el("defs", {}, svg);
      const grad = (tag, id, attrs, stops) => {
        const g = el(tag, { id, ...attrs }, defs);
        stops.forEach(([o, c, a = 1]) => el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, g));
        return g;
      };
      const hz = L.vp[1] / H;
      grad("linearGradient", "pm-dusk", { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, C.dusk[0]], [hz * 0.55, C.dusk[1]], [hz * 0.9, C.dusk[2]], [hz, C.dusk[3]], [1, C.dusk[3]]]);
      grad("linearGradient", "pm-night", { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, mix(C.night, "#000000", 0.3)], [hz * 0.7, C.night], [hz, "#4a2f5e"], [1, "#4a2f5e"]]);
      grad("linearGradient", "pm-ground", { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, "#3a2f45"], [1, "#1a1622"]]);
      grad("linearGradient", "pm-metal", { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, "#4a4a52"], [1, "#1c1c21"]]);
      grad("linearGradient", "pm-ember", { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, "#ff9a3a"], [1, "#c53a12"]]);
      grad("linearGradient", "pm-counter", { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, "#1f5f8f"], [1, "#153e62"]]);
      // One soft glow gradient per light colour.
      const glows = {};
      const glowFor = (c, strong = 0.9) => {
        const id = `pm-g${c.slice(1)}${strong === 0.9 ? "" : "b"}`;
        if (!glows[id]) glows[id] = grad("radialGradient", id, {}, strong === 0.9 ? [[0, c, 0.9], [0.25, c, 0.45], [1, c, 0]] : [[0, c, 0.55], [0.75, c, 0.4], [0.92, c, 0.25], [1, c, 0]]);
        return `url(#${id})`;
      };
      grad("radialGradient", "pm-pool", {}, [[0, "#ffc56b", 0.55], [1, "#ffc56b", 0]]);
      grad("radialGradient", "pm-smoke", {}, [[0, "#e8dfe6", 0.7], [1, "#e8dfe6", 0]]);
      grad("radialGradient", "pm-vignette", { r: 0.75 }, [[0.55, "#0a0718", 0], [1, "#0a0718", 0.5]]);
      grad("radialGradient", "pm-emberglow", {}, [[0, "#ff8a2a", 0.6], [1, "#ff8a2a", 0]]);

      // Sky: dusk underneath, night fades in over it
      el("rect", { width: W, height: H, fill: "url(#pm-dusk)" }, svg);
      const nightSky = el("rect", { width: W, height: H, fill: "url(#pm-night)" }, svg);
      const stars = el("g", {}, svg);
      const starList = [];
      for (let i = 0; i < 40; i++) {
        const c = el("circle", { cx: n(rand() * W), cy: n(rand() * L.vp[1] * 0.75), r: n(u * (0.0018 + rand() * 0.0028)), fill: "#fff8e6" }, stars);
        starList.push({ c, ph: rand() });
      }
      // Crescent moon
      const mx = W * (L.tall ? 0.78 : 0.86), my = L.tall ? H * 0.34 : L.vp[1] * 0.4, mr = u * 0.045;
      const moon = el("path", { d: `M${P(mx, my - mr)} A${mr} ${mr} 0 1 0 ${P(mx, my + mr)} A${mr * 1.3} ${mr * 1.3} 0 0 1 ${P(mx, my - mr)} Z`, fill: "#fff1c4" }, svg);

      // Distant flats on the horizon with a few lit windows
      const city = el("g", {}, svg);
      const windows = el("g", { fill: "#ffd98a" }, svg);
      let cx = L.vp[0] - L.F * 0.9;
      while (cx < L.vp[0] + L.F * 0.9) {
        const bw = L.F * (0.08 + rand() * 0.1), bh = L.F * (0.05 + rand() * 0.14);
        el("rect", { x: n(cx), y: n(L.vp[1] - bh), width: n(bw), height: n(bh + 2), fill: "#3a2d55" }, city);
        for (let wy = L.vp[1] - bh + bh * 0.15; wy < L.vp[1] - bh * 0.1; wy += bh * 0.18)
          for (let wx = cx + bw * 0.12; wx < cx + bw * 0.85; wx += bw * 0.2)
            if (rand() > 0.55) el("rect", { x: n(wx), y: n(wy), width: n(bw * 0.08), height: n(bh * 0.06), opacity: n(0.5 + rand() * 0.5) }, windows);
        cx += bw + L.F * 0.01;
      }

      // Ground with painted lines running to the horizon
      el("rect", { x: 0, y: L.vp[1], width: W, height: H - L.vp[1], fill: "url(#pm-ground)" }, svg);
      const lineZ = [2, 60];
      [-0.9, 0.9].forEach((X) => {
        const a = proj(X, YG, lineZ[0]), b = proj(X, YG, lineZ[1]);
        el("path", { d: `M${P(...a)} L${P(...b)}`, stroke: "#e6c35a", "stroke-width": Math.max(1, u * 0.006), opacity: 0.35, "stroke-dasharray": `${n(u * 0.04)} ${n(u * 0.03)}` }, svg);
      });

      // Stalls, far to near. Bulbs and light pools go in their own layers on top.
      const stalls = el("g", {}, svg);
      const nightShade = el("rect", { width: W, height: H, fill: "#120c2a" }, svg);
      const pools = el("g", {}, svg);
      const bulbLayer = el("g", {}, svg);
      const bulbs = [];
      const addBulb = (x, y, r, z, color, cord) => {
        const g = el("g", {}, bulbLayer);
        if (cord) el("path", { d: `M${P(x, cord)} L${P(x, y)}`, stroke: "#1a1422", "stroke-width": Math.max(0.5, r * 0.25) }, g);
        const glow = el("circle", { cx: n(x), cy: n(y), r: n(r * 5), fill: glowFor(color), opacity: 0 }, g);
        const core = el("circle", { cx: n(x), cy: n(y), r: n(r), fill: "#5a4a3a" }, g);
        bulbs.push({ glow, core, color, z, on: 0, ph: rand(), tw: rand() > 0.6 });
        return bulbs.at(-1);
      };
      const people = [];
      const walkers = [
        { X: -0.4, z: 5.2, h: 1.0, c: "#2b2140" }, { X: 0.55, z: 7.5, h: 0.95, c: "#241b36" },
        { X: -0.9, z: 10, h: 1.02, c: "#2e2444" }, { X: 0.2, z: 13.5, h: 0.9, c: "#2b2140" },
        { X: 1.1, z: 4.2, h: 1.0, c: "#211a33" }, { X: -1.2, z: 16, h: 1.0, c: "#2b2140" },
      ];
      const drawPerson = (p) => {
        const g = el("g", {}, stalls);
        // A simple silhouette: head, shoulders and body, 1.7 m tall
        el("path", { d: "M-0.22 0 L-0.24 -0.9 Q-0.24 -1.35 0 -1.38 Q0.24 -1.35 0.24 -0.9 L0.22 0 Z", fill: p.c }, g);
        el("circle", { cx: 0, cy: -1.55, r: 0.14, fill: p.c }, g);
        people.push({ g, ...p, ph: rand() });
      };
      for (let i = ROWS - 1; i >= 0; i--) {
        const z0 = Z0 + i * TD, z1 = z0 + TD;
        const fog = clamp((z0 - Z0) / (TD * ROWS));
        const tint = (c) => mix(c, "#6b4f7a", fog * 0.75);
        // People standing in the aisle at this depth
        walkers.filter((p) => p.z >= z0 && p.z < z1).forEach(drawPerson);
        [-1, 1].forEach((s) => {
          const [main, white] = C.tarps[(i * 2 + (s > 0 ? 3 : 0)) % C.tarps.length];
          const X0 = s * A, X1 = s * (A + TW);
          const g = el("g", {}, stalls);
          // Inside the stall, the underside of the canopy and the table of goods
          el("path", { d: poly([proj(X0, YV1, z0), proj(X1, YV1, z0), proj(X1, YG, z0), proj(X0, YG, z0)]), fill: tint("#2a2236") }, g);
          el("path", { d: poly([proj(X0, YV1, z0), proj(X0, YV1, z1), proj(X0 + s * 0.3, YG, z1), proj(X0 + s * 0.3, YG, z0)]), fill: tint("#3a2d48") }, g);
          el("path", { d: poly([proj(X0, YV1, z0), proj(X1, YV1, z0), proj(X1, YV1, z1), proj(X0, YV1, z1)]), fill: tint(mix(main, "#000000", 0.35)) }, g);
          const tx = X0 + s * 0.15;
          el("path", { d: poly([proj(tx, YT, z0 + 0.2), proj(tx, YT, z1 - 0.2), proj(tx, YG, z1 - 0.2), proj(tx, YG, z0 + 0.2)]), fill: tint(mix(C.tarps[(i + (s > 0 ? 2 : 5)) % C.tarps.length][0], "#2a2236", 0.45)) }, g);
          el("path", { d: poly([proj(tx, YT, z0 + 0.2), proj(tx + s * 0.9, YT, z0 + 0.2), proj(tx + s * 0.9, YT, z1 - 0.2), proj(tx, YT, z1 - 0.2)]), fill: tint("#e8d8b8") }, g);
          // Goods on the table
          for (let j = 0; j < 6; j++) {
            const gz = z0 + 0.45 + j * 0.38, [gx, gy] = proj(tx + s * (0.2 + rand() * 0.4), YT - 0.05, gz);
            el("ellipse", { cx: n(gx), cy: n(gy), rx: n((0.16 * L.F) / gz), ry: n((0.1 * L.F) / gz), fill: tint(C.goods[Math.floor(rand() * C.goods.length)]) }, g);
          }
          // Front post
          const pa = proj(X0, YV1, z0), pb = proj(X0, YG, z0);
          el("path", { d: `M${P(...pa)} L${P(...pb)}`, stroke: tint("#b9b3c4"), "stroke-width": n(Math.max(0.6, (0.05 * L.F) / z0)) }, g);
          // Canopy roof peak, side valance and front valance, all striped
          const peak = proj((X0 + X1) / 2, YPK, (z0 + z1) / 2);
          el("path", { d: poly([proj(X0, YV0, z0), proj(X1, YV0, z0), peak]), fill: tint(main) }, g);
          const sideStripes = 6;
          for (let j = 0; j < sideStripes; j++) {
            const za = z0 + (TD * j) / sideStripes, zb = z0 + (TD * (j + 1)) / sideStripes;
            el("path", { d: poly([proj(X0, YV0, za), proj(X0, YV0, zb), proj(X0, YV1, zb), proj(X0, YV1, za)]), fill: tint(j % 2 ? white : main) }, g);
          }
          const frontStripes = 6;
          for (let j = 0; j < frontStripes; j++) {
            const xa = X0 + ((X1 - X0) * j) / frontStripes, xb = X0 + ((X1 - X0) * (j + 1)) / frontStripes;
            const [ax, ay] = proj(xa, YV0, z0), [bx] = proj(xb, YV0, z0), [, by] = proj(xa, YV1, z0);
            const sc = (by - ay) * 0.35;
            el("path", { d: `M${P(ax, ay)} L${P(bx, ay)} L${P(bx, by)} Q${P((ax + bx) / 2, by + sc)} ${P(ax, by)} Z`, fill: tint(j % 2 ? white : main) }, g);
          }
          // Bare bulb under the canopy and a warm pool of light on the table
          const [bx, by] = proj(X0 + s * 0.8, YV1 + 0.22, z0 + 1.2), [, cordTop] = proj(X0 + s * 0.8, YV1, z0 + 1.2);
          const pool = proj(tx + s * 0.4, YT, z0 + 1.5);
          const pl = el("ellipse", { cx: n(pool[0]), cy: n(pool[1]), rx: n((1.6 * L.F) / z0), ry: n((0.9 * L.F) / z0), fill: "url(#pm-pool)", opacity: 0 }, pools);
          const b = addBulb(bx, by, Math.max(0.6, (0.06 * L.F) / z0), z0, C.bulb, cordTop);
          b.pool = pl;
        });
        // String of lights across the aisle at the front of every other row
        if (i % 2 === 0 && i < 7) {
          const pts = [];
          for (let j = 0; j <= 10; j++) {
            const X = -A + (2 * A * j) / 10, sag = 0.32 * (1 - ((j - 5) / 5) ** 2);
            pts.push(proj(X, YV0 + 0.05 + sag, z0));
          }
          el("path", { d: "M" + pts.map((p) => P(...p)).join(" L"), fill: "none", stroke: "#1a1422", "stroke-width": n(Math.max(0.5, (0.02 * L.F) / z0)) }, bulbLayer);
          const cols = [C.bulb, "#ff7a6b", C.bulb, "#7fd6a0", C.bulb, "#8fb4ff"];
          pts.slice(1, -1).forEach((p, j) => addBulb(p[0], p[1] + (0.05 * L.F) / z0, Math.max(0.6, (0.045 * L.F) / z0), z0, cols[(j + i) % cols.length]));
        }
      }

      // Soft bokeh lights floating in front of the market
      const bokeh = el("g", {}, svg);
      const bokehList = Array.from({ length: 14 }, () => ({
        c: el("circle", { r: n(u * (0.02 + rand() * 0.045)), fill: glowFor([C.bulb, "#ff9a7a", "#ffd9a0", "#9fd6ff"][Math.floor(rand() * 4)], 0.5) }, bokeh),
        x: rand(), y: 0.15 + rand() * 0.55, ph: rand(), a: 0.3 + rand() * 0.3,
      }));

      // Festoon string along the top with the title banner hanging from it
      const top = el("g", {}, svg);
      const sy = L.stringY, sag = H * 0.035;
      const stringAt = (x) => sy + sag * (1 - ((x - W / 2) / (W / 2)) ** 2);
      let sd = "";
      for (let j = 0; j <= 20; j++) sd += (j ? "L" : "M") + P((W * j) / 20, stringAt((W * j) / 20));
      el("path", { d: sd, fill: "none", stroke: "#1a1422", "stroke-width": Math.max(1, u * 0.004) }, top);
      const topBulbs = [];
      const nb = Math.max(7, Math.round(W / (u * 0.09)));
      for (let j = 0; j < nb; j++) {
        const x = (W * (j + 0.5)) / nb;
        const b = addBulb(x, stringAt(x) + u * 0.014, u * 0.009, 1, [C.bulb, "#ff7a6b", C.bulb, "#7fd6a0", C.bulb, "#8fb4ff"][j % 6]);
        top.append(b.glow.parentNode);
        topBulbs.push(b);
      }
      // Banner size fits the title
      const bannerG = el("g", {}, top);
      const probe = el("text", { class: "banner", "font-size": 100 }, svg);
      const measure = (str) => { probe.textContent = str; return probe.getComputedTextLength() / 100; };
      const maxW = W * (L.tall ? 0.86 : 0.7), fsMax = Math.min(u * 0.11, H * 0.075);
      // One line if it fits well, otherwise split into two lines where it balances best.
      const fitFs = (lines) => Math.min(fsMax * (lines.length > 1 ? 0.85 : 1), (maxW - u * 0.08) / Math.max(...lines.map(measure)));
      let lines = [title], fs = fitFs(lines);
      const words = title.split(/\s+/);
      if (fs < fsMax * 0.7 && words.length > 1) {
        for (let i = 1; i < words.length; i++) {
          const two = [words.slice(0, i).join(" "), words.slice(i).join(" ")], f2 = fitFs(two);
          if (f2 > fs) { lines = two; fs = f2; }
        }
      }
      const tw = Math.max(...lines.map(measure));
      probe.remove();
      const bw = tw * fs + fs * 1.4, bh = fs * (1.55 + (lines.length - 1) * 1.05), by0 = stringAt(W / 2) + (L.tall ? H * 0.08 : u * 0.01);
      const bannerInner = el("g", {}, bannerG);
      const notch = bh * 0.3;
      el("path", { d: `M${P(-bw / 2 - notch, 0)} L${P(bw / 2 + notch, 0)} L${P(bw / 2, bh / 2)} L${P(bw / 2 + notch, bh)} L${P(-bw / 2 - notch, bh)} L${P(-bw / 2, bh / 2)} Z`, fill: C.red }, bannerInner);
      el("path", { d: `M${P(-bw / 2 - notch * 0.4, bh * 0.1)} L${P(bw / 2 + notch * 0.4, bh * 0.1)} M${P(-bw / 2 - notch * 0.4, bh * 0.9)} L${P(bw / 2 + notch * 0.4, bh * 0.9)}`, stroke: "#ffcf4a", "stroke-width": Math.max(1, fs * 0.05), "stroke-dasharray": `${n(fs * 0.2)} ${n(fs * 0.12)}` }, bannerInner);
      lines.forEach((line, i) => {
        const tt = el("text", { class: "banner", x: 0, y: n(bh * 0.5 + fs * (0.36 + (i - (lines.length - 1) / 2) * 1.05)), "font-size": n(fs), "text-anchor": "middle", fill: "#fff3d0" }, bannerInner);
        tt.textContent = line;
      });
      el("path", { d: `M${P(-bw * 0.42, -by0 + stringAt(W / 2 - bw * 0.42))} L${P(-bw * 0.42, 0)} M${P(bw * 0.42, -by0 + stringAt(W / 2 + bw * 0.42))} L${P(bw * 0.42, 0)}`, stroke: "#1a1422", "stroke-width": Math.max(1, u * 0.003) }, bannerG);

      // The front counter: our stall
      const front = el("g", {}, svg);
      const cy = L.counterY;
      el("rect", { x: 0, y: cy, width: W, height: H - cy, fill: "url(#pm-counter)" }, front);
      for (let x = 0; x < W; x += u * 0.08) el("rect", { x: n(x), y: cy, width: n(u * 0.04), height: H - cy, fill: "#e8eefc", opacity: 0.16 }, front);
      el("rect", { x: 0, y: cy, width: W, height: u * 0.05, fill: "#000000", opacity: 0.25 }, front);
      el("rect", { x: 0, y: cy - u * 0.012, width: W, height: u * 0.022, fill: "#8a5a36" }, front);
      el("rect", { x: 0, y: cy - u * 0.012, width: W, height: u * 0.006, fill: "#b07a4d" }, front);
      const warm = el("ellipse", { cx: W / 2, cy, rx: W * 0.6, ry: u * 0.2, fill: "url(#pm-pool)", opacity: 0 }, front);
      const emberGlow = el("ellipse", { cx: L.slots[0], cy: cy - k * 0.4, rx: k * 0.9, ry: k * 0.55, fill: "url(#pm-emberglow)" }, front);

      const item = (x, draw) => {
        const g = el("g", { transform: `translate(${n(x)} ${n(cy)}) scale(${n(k)})` }, front);
        return { g, ...draw(g) };
      };
      const satay = item(L.slots[0], drawSatay);
      const apam = item(L.slots[1], drawApam);
      const drinks = item(L.slots[2], drawDrinks);

      // Smoke and sparks from the grill
      const smoke = Array.from({ length: 9 }, (_, i) => ({ c: el("circle", { fill: "url(#pm-smoke)" }, front), ph: i / 9, dx: rand() - 0.5 }));
      const sparks = Array.from({ length: 6 }, (_, i) => ({ c: el("circle", { fill: "#ffb347" }, front), ph: rand(), dx: rand() - 0.5 }));
      // Steam from the griddle
      const steam = Array.from({ length: 4 }, (_, i) => ({ c: el("circle", { fill: "url(#pm-smoke)" }, front), ph: i / 4, dx: rand() - 0.5 }));

      // Price signs pop up above each item
      const signsG = el("g", {}, svg);
      const signs = [
        { at: [L.slots[0] + k * 0.22, cy - k * 0.62], lines: ["Satay", "RM1.20"], fill: "#fff6dc", ink: C.red, rot: -6 },
        { at: [L.slots[1] - k * 0.2, cy - k * 0.5], lines: ["Apam balik", "RM5"], fill: "#ffd84a", ink: "#c02a22", rot: 5 },
        { at: [L.slots[2] + k * 0.02, cy - k * 0.82], lines: ["Air", "3 for RM10"], fill: "#ffffff", ink: "#1f4fb0", rot: -4 },
      ].map((sg) => ({ ...sg, ...drawSign(signsG, sg.lines, sg.fill, sg.ink) }));

      el("rect", { width: W, height: H, fill: "url(#pm-vignette)", "pointer-events": "none" }, svg);

      // Each bulb switches on at its own moment: near the camera first, then down the aisle.
      bulbs.forEach((b) => {
        b.onAt = 0.7 + Math.min(2.2, (b.z - 1) * 0.09) + rand() * 0.25;
        b.offAt = 10.5 + Math.min(1, (18 - Math.min(18, b.z)) * 0.05) + rand() * 0.2;
      });

      S = { night: { v: 0 }, banner: { s: 0 }, signs: signs.map(() => ({ v: 0 })) };
      R = { nightSky, stars, starList, moon, windows, nightShade, bulbs, people, bokehList, bannerG, bannerInner, by0, bh, warm, emberGlow, satay, apam, drinks, smoke, sparks, steam, signs, cy };

      tl = gsap.timeline({ repeat: -1, onUpdate: update });
      tl.set({}, {}, LOOP);
      tl.fromTo(S.night, { v: 0 }, { v: 1, duration: 3, ease: "sine.inOut" }, 0.2)
        .to(S.night, { v: 0, duration: 1.3, ease: "sine.inOut" }, 10.6)
        .fromTo(S.banner, { s: 0 }, { s: 1, duration: 0.9, ease: "back.out(1.6)" }, 1.4)
        .to(S.banner, { s: 0, duration: 0.45, ease: "power2.in" }, 10.7);
      S.signs.forEach((sg, i) => {
        tl.fromTo(sg, { v: 0 }, { v: 1, duration: 0.6, ease: "back.out(2.4)" }, 2.6 + i * 0.35)
          .to(sg, { v: 0, duration: 0.35, ease: "back.in(2)" }, 10.2 + i * 0.12);
      });
    }

    // Per-frame work: sky, bulbs, smoke, sways and pops.
    const cache = new Map();
    const set = (node, key, val) => {
      let m = cache.get(node);
      if (!m) cache.set(node, (m = {}));
      if (m[key] !== val) { m[key] = val; node.setAttribute(key, val); }
    };
    function update() {
      const t = tl.time();
      const nv = S.night.v;
      set(R.nightSky, "opacity", n(nv));
      set(R.stars, "opacity", n(nv));
      set(R.moon, "opacity", n(0.4 + 0.6 * nv));
      set(R.windows, "opacity", n(0.3 + 0.7 * nv));
      set(R.nightShade, "opacity", n(nv * 0.42));
      R.starList.forEach((s, i) => { if (i % 3 === 0) set(s.c, "opacity", n(0.55 + 0.45 * wave(t, 6, s.ph))); });

      // Bulbs: flicker on, twinkle gently, switch off at the end.
      let lit = 0;
      R.bulbs.forEach((b) => {
        const on = t < b.onAt ? 0 : t < b.onAt + 0.25 ? (Math.floor((t - b.onAt) * 24) % 2 ? 0.4 : 1) : t < b.offAt ? 1 : clamp(1 - (t - b.offAt) / 0.3);
        const tw = b.tw ? 0.82 + 0.18 * wave(t, 12, b.ph) : 1;
        const v = n(on * tw);
        set(b.glow, "opacity", v);
        set(b.core, "fill", on > 0.5 ? mix(b.color, "#ffffff", 0.45) : "#5a4a3a");
        if (b.pool) set(b.pool, "opacity", n(on * 0.85));
        lit += on;
      });
      set(R.warm, "opacity", n(0.35 * lit / R.bulbs.length));

      // People sway a little as they browse.
      R.people.forEach((p) => {
        const [x, y] = proj(p.X + 0.08 * wave(t, 2, p.ph), YG, p.z);
        const s = (L.F / p.z) * p.h;
        set(p.g, "transform", `translate(${n(x)} ${n(y + Math.abs(wave(t, 8, p.ph)) * s * -0.02)}) scale(${n(s)})`);
      });

      // Bokeh drifts slowly.
      R.bokehList.forEach((b) => {
        set(b.c, "cx", n((b.x + 0.03 * wave(t, 1, b.ph)) * W));
        set(b.c, "cy", n((b.y + 0.02 * wave(t, 2, b.ph + 0.3)) * H));
        set(b.c, "opacity", n(b.a * nv * (0.7 + 0.3 * wave(t, 3, b.ph))));
      });

      // Banner drops in, then swings gently.
      const bs = S.banner.s;
      R.bannerG.style.display = bs < 0.01 ? "none" : "";
      set(R.bannerG, "transform", `translate(${n(W / 2)} ${n(R.by0)}) rotate(${n(1.2 * wave(t, 3))})`);
      set(R.bannerInner, "transform", `scale(${n(0.6 + 0.4 * bs)} ${n(Math.max(0.01, bs))})`);

      // Grill: embers flicker, smoke and sparks rise.
      const fl = 0.35 + 0.25 * wave(t, 37) + 0.15 * wave(t, 23, 0.3);
      set(R.satay.glow, "opacity", n(clamp(fl)));
      set(R.emberGlow, "opacity", n(0.55 + 0.35 * fl));
      const gx = L.slots[0], gy = R.cy - k * 0.45;
      R.smoke.forEach((s) => {
        const q = frac(t / 2.4 + s.ph);
        set(s.c, "cx", n(gx + (s.dx * 0.6 + q * 0.25) * k + wave(t, 5, s.ph) * k * 0.05));
        set(s.c, "cy", n(gy - q * k * 1.5));
        set(s.c, "r", n(k * (0.12 + q * 0.3)));
        set(s.c, "opacity", n(Math.sin(Math.PI * q) * 0.5));
      });
      R.sparks.forEach((s) => {
        const q = frac(t / 1.5 + s.ph);
        set(s.c, "cx", n(gx + s.dx * k * 0.8 + q * k * 0.1));
        set(s.c, "cy", n(gy - q * k * 0.9));
        set(s.c, "r", n(k * 0.012 * (1 - q)));
        set(s.c, "opacity", n(1 - q));
      });
      const ax = L.slots[1] + k * 0.12, ay = R.cy - k * 0.32;
      R.steam.forEach((s) => {
        const q = frac(t / 2 + s.ph);
        set(s.c, "cx", n(ax + s.dx * k * 0.4 + q * k * 0.05));
        set(s.c, "cy", n(ay - q * k * 0.9));
        set(s.c, "r", n(k * (0.07 + q * 0.16)));
        set(s.c, "opacity", n(Math.sin(Math.PI * q) * 0.3));
      });
      // Bubbles open up on the apam balik batter, then close again each loop.
      R.apam.holes.forEach((h, i) => {
        const q = clamp(frac(t / 6 + h.ph) * 3 - 0.5);
        set(h.c, "rx", n(0.022 * Math.sin(Math.PI * q)));
        set(h.c, "ry", n(0.009 * Math.sin(Math.PI * q)));
      });
      // Drinks jiggle on the counter.
      R.drinks.bags.forEach((b) => set(b.b, "transform", `translate(${b.x} -0.82) rotate(${n(5 * wave(t, 4, b.ph))})`));

      // Signs pop up with a bounce and a small wobble.
      R.signs.forEach((sg, i) => {
        const v = S.signs[i].v;
        sg.g.style.display = v < 0.01 ? "none" : "";
        const wob = sg.rot + 2 * wave(t, 2, i * 0.3);
        set(sg.g, "transform", `translate(${n(sg.at[0])} ${n(sg.at[1] + (1 - v) * k * 0.4)}) rotate(${n(wob)}) scale(${n(k * Math.max(0.01, v))})`);
      });
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    // Reduced motion: one still frame at night with every light on.
    function apply() {
      if (reduce.matches) tl.pause(STILL);
      else tl.play();
      update();
    }
    reduce.addEventListener("change", apply);

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const at = tl.time();
        tl.kill();
        cache.clear();
        build();
        tl.time(at);
        apply();
      }, 150);
    });

    // Wait briefly for the fonts so the banner is measured in the right face.
    Promise.race([
      Promise.all([document.fonts.load("1em 'Lilita One'"), document.fonts.load("1em 'Permanent Marker'")]),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => { build(); apply(); });
  </script>
</body>
</html>
