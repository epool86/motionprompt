<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map journey demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/outfit@5.3.0/800.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.3.0/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.3.0/800.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=cfe7ee&ink=1d2b44&accent=ff5a4e&accent2=2fae86 */
    :root {
      --bg: #cfe7ee;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="map" role="img"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => "#" + (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const c = { bg: hex("bg", "cfe7ee"), ink: hex("ink", "1d2b44"), accent: hex("accent", "ff5a4e"), accent2: hex("accent2", "2fae86") };
    document.documentElement.style.setProperty("--bg", c.bg);

    // Mix two hex colours.
    const mix = (a, b, t) => "#" + [1, 3, 5].map((i) => {
      const v = Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t);
      return v.toString(16).padStart(2, "0");
    }).join("");
    const rgba = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;
    const col = {
      grid: mix(c.bg, c.ink, 0.07),
      shallow: mix(c.bg, "#ffffff", 0.4),
      land: "#f5f1e8",
      landEdge: mix(c.bg, c.ink, 0.28),
      home: mix(c.accent2, "#ffffff", 0.62),
      homeEdge: mix(c.accent2, c.ink, 0.25),
      muted: mix(c.ink, c.bg, 0.45),
      label: mix(c.ink, c.bg, 0.55),
    };

    const title = (params.get("text") || "Our Malaysia trip").trim().slice(0, 40);
    const subtitle = "8 days, 5 stops";
    const canvas = document.getElementById("map");
    canvas.setAttribute("aria-label", `Animated travel map: ${title}. A route draws across Malaysia from Melaka to Kuala Lumpur, Penang, Langkawi and Kota Kinabalu, with a pin and a day card at each stop.`);
    const ctx = canvas.getContext("2d");

    // The trip. Each hop goes by car, ferry or plane; bend sets how much the route curves.
    const stops = [
      { name: "Melaka", day: "Day 1", lon: 102.25, lat: 2.19, icon: "house" },
      { name: "Kuala Lumpur", day: "Day 2", lon: 101.69, lat: 3.14, icon: "towers" },
      { name: "Penang", day: "Day 4", lon: 100.33, lat: 5.41, icon: "bowl" },
      { name: "Langkawi", day: "Day 6", lon: 99.8, lat: 6.34, icon: "palm" },
      { name: "Kota Kinabalu", day: "Day 8", lon: 116.07, lat: 5.98, icon: "mountain" },
    ];
    const hops = [
      { by: "car", bend: 0.28, dur: 0.95 },
      { by: "car", bend: -0.2, dur: 1.05 },
      { by: "ferry", bend: -0.32, dur: 0.95 },
      { by: "plane", bend: 0.2, dur: 1.45 },
    ];
    const MY = "458"; // Malaysia in world-atlas

    // Timing (seconds). Pin j drops at drop[j], its route leaves 1.3 s later.
    const LOOP = 14;
    const drop = [0.25];
    hops.forEach((h, j) => { h.start = drop[j] + 1.3; drop.push(h.start + h.dur); });
    const OVER = { move: 10.9, arrive: 11.8, fade: 12.55, back: 13.9 };

    // World coordinates: Mercator, 1000 units per radian, centred near Malaysia.
    const S = 1000, RAD = Math.PI / 180, LON0 = 109, LAT0 = 4;
    const merc = (lat) => Math.log(Math.tan(Math.PI / 4 + (lat * RAD) / 2));
    const toWorld = (lon, lat) => [S * (lon - LON0) * RAD, -S * (merc(lat) - merc(LAT0))];
    const deg = S * RAD; // world units per degree of longitude
    stops.forEach((s) => ([s.x, s.y] = toWorld(s.lon, s.lat)));

    // Each hop is a gentle curve, sampled once with its running length.
    hops.forEach((h, j) => {
      const a = stops[j], b = stops[j + 1];
      const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
      const cx = (a.x + b.x) / 2 - dy * h.bend, cy = (a.y + b.y) / 2 + dx * h.bend;
      h.pts = [];
      h.frac = [0];
      let total = 0;
      for (let i = 0; i <= 64; i++) {
        const t = i / 64, m = 1 - t;
        const p = [m * m * a.x + 2 * m * t * cx + t * t * b.x, m * m * a.y + 2 * m * t * cy + t * t * b.y];
        if (i) total += Math.hypot(p[0] - h.pts[i - 1][0], p[1] - h.pts[i - 1][1]);
        if (i) h.frac.push(total);
        h.pts.push(p);
      }
      h.frac = h.frac.map((v) => v / total);
      h.len = len;
    });

    // Region we draw land for (anything wider is never on screen).
    const REGION = { lon0: 86, lon1: 126, lat0: -28, lat1: 42 };
    const [rx0, ry1] = toWorld(REGION.lon0, REGION.lat0);
    const [rx1, ry0] = toWorld(REGION.lon1, REGION.lat1);

    // Graticule every 2 degrees, straight lines in Mercator.
    const grid = new Path2D();
    for (let lon = REGION.lon0; lon <= REGION.lon1; lon += 2) {
      const x = toWorld(lon, 0)[0];
      grid.moveTo(x, ry0);
      grid.lineTo(x, ry1);
    }
    for (let lat = REGION.lat0; lat <= REGION.lat1; lat += 2) {
      const y = toWorld(0, lat)[1];
      grid.moveTo(rx0, y);
      grid.lineTo(rx1, y);
    }

    // ---- Map data: projected once into world units, fine and coarse detail ----
    let land = null, mapAt = 0;
    // Records projected outlines: one path for filling, plus each ring on its own with
    // its bounds, so coastlines off screen are skipped. Points closer than eps are dropped.
    function recorder(eps) {
      const fill = new Path2D(), rings = [];
      let lx = 0, ly = 0, ring = null;
      return {
        fill,
        rings,
        moveTo(x, y) {
          fill.moveTo(x, y);
          ring = { p: new Path2D(), b: [x, y, x, y] };
          ring.p.moveTo(x, y);
          rings.push(ring);
          lx = x; ly = y;
        },
        lineTo(x, y) {
          if (Math.abs(x - lx) + Math.abs(y - ly) < eps) return;
          fill.lineTo(x, y);
          ring.p.lineTo(x, y);
          const b = ring.b;
          if (x < b[0]) b[0] = x; if (x > b[2]) b[2] = x;
          if (y < b[1]) b[1] = y; if (y > b[3]) b[3] = y;
          lx = x; ly = y;
        },
        closePath() { fill.closePath(); ring.p.closePath(); },
        arc() {},
      };
    }
    async function loadMap() {
      try {
        if (!window.d3 || !d3.geoMercator || !window.topojson) return;
        const res = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json");
        if (!res.ok) return;
        const topo = await res.json();
        const features = topojson.feature(topo, topo.objects.countries).features;
        const projection = d3.geoMercator()
          .scale(S)
          .translate([-S * LON0 * RAD, S * merc(LAT0)])
          .clipExtent([[rx0, ry0], [rx1, ry1]]);
        const make = (eps, keep) => {
          const r = recorder(eps);
          const path = d3.geoPath(projection, r);
          features.filter(keep).forEach((f) => path(f));
          return r;
        };
        const home = (f) => String(f.id) === MY;
        const rest = (f) => String(f.id) !== MY;
        land = [0.05, 0.7, 1.6].map((eps) => ({ home: make(eps, home), rest: make(eps, rest) }));
        mapAt = performance.now();
        cache.ok = false;
        if (reduce.matches) still();
      } catch (e) {
        land = null; // plain sea, pins and route still show
      }
    }

    // ---- Easing ----
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const prog = (t, at, dur) => clamp01((t - at) / dur);
    const inOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
    const outCubic = (p) => 1 - Math.pow(1 - p, 3);
    const outBack = (p) => 1 + 2.4 * Math.pow(p - 1, 3) + 1.4 * Math.pow(p - 1, 2);
    function outBounce(p) {
      const n = 7.5625, d = 2.75;
      if (p < 1 / d) return n * p * p;
      if (p < 2 / d) return n * (p -= 1.5 / d) * p + 0.75;
      if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + 0.9375;
      return n * (p -= 2.625 / d) * p + 0.984375;
    }

    // Smooth zoom and pan between two views (van Wijk and Nuij), views are [x, y, width].
    function zoomBetween(a, b) {
      const rho = 1.3, rho2 = rho * rho, rho4 = rho2 * rho2;
      const [ux0, uy0, w0] = a, [ux1, uy1, w1] = b;
      const dx = ux1 - ux0, dy = uy1 - uy0, d2 = dx * dx + dy * dy;
      if (d2 < 1e-9) {
        const s = Math.log(w1 / w0);
        return (t) => [ux0, uy0, w0 * Math.exp(s * t)];
      }
      const d1 = Math.sqrt(d2);
      const b0 = (w1 * w1 - w0 * w0 + rho4 * d2) / (2 * w0 * rho2 * d1);
      const b1 = (w1 * w1 - w0 * w0 - rho4 * d2) / (2 * w1 * rho2 * d1);
      const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0);
      const r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
      const S1 = (r1 - r0) / rho;
      return (t) => {
        const s = t * S1, ch = Math.cosh(r0);
        const u = (w0 / (rho2 * d1)) * (ch * Math.tanh(rho * s + r0) - Math.sinh(r0));
        return [ux0 + u * dx, uy0 + u * dy, (w0 * ch) / Math.cosh(rho * s + r0)];
      };
    }

    // ---- Small drawings ----
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Vehicles, drawn in a 24 unit box around 0,0. The plane points right.
    const plane = new Path2D("M12 0C12-1.4 10.2-1.9 8.2-1.9L-9-1.6Q-11.6-1.4-11.6 0Q-11.6 1.4-9 1.6L8.2 1.9C10.2 1.9 12 1.4 12 0Z M3.2-1.5L-2.4-10.8L-4.8-10.8L-3.4-1.5Z M3.2 1.5L-2.4 10.8L-4.8 10.8L-3.4 1.5Z M-6.4-1.3L-9.4-5.4L-11.2-5.4L-10.4-1.2Z M-6.4 1.3L-9.4 5.4L-11.2 5.4L-10.4 1.2Z");
    const car = new Path2D("M-10 3.2L-10-0.6Q-10-2.8-7.8-3L-5.4-3.2L-2.6-7L4.2-7L7.4-3.2L8.8-3Q10.6-2.6 10.6-0.6L10.6 3.2Z");
    const carGlass = new Path2D("M-4.2-3.4L-1.9-6.1L0.6-6.1L0.6-3.4Z M1.7-3.4L1.7-6.1L3.8-6.1L6-3.4Z");
    const ferry = new Path2D("M-11 1.5L11 1.5L7.8 6.5L-8.4 6.5Z M-7 1.5L-7-2.8L6-2.8L6 1.5Z M-3.6-2.8L-3.6-6.6L2.8-6.6L2.8-2.8Z");
    const ferryGlass = new Path2D("M-5.4-1.6h2.2v1.8h-2.2Z M-1.6-1.6h2.2v1.8h-2.2Z M2.2-1.6h2.2v1.8h-2.2Z");

    // Tiny stop icons in white, drawn in a box of size s around 0,0.
    function icon(kind, s) {
      ctx.save();
      ctx.scale(s, s);
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 0.075;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      if (kind === "towers") {
        for (const x of [-0.19, 0.19]) {
          ctx.moveTo(x - 0.1, 0.4);
          ctx.lineTo(x - 0.1, -0.12);
          ctx.lineTo(x - 0.05, -0.26);
          ctx.lineTo(x, -0.46);
          ctx.lineTo(x + 0.05, -0.26);
          ctx.lineTo(x + 0.1, -0.12);
          ctx.lineTo(x + 0.1, 0.4);
          ctx.closePath();
        }
        ctx.rect(-0.1, 0.02, 0.2, 0.06);
        ctx.fill();
      } else if (kind === "house") {
        ctx.moveTo(-0.42, -0.02);
        ctx.lineTo(0, -0.38);
        ctx.lineTo(0.42, -0.02);
        ctx.closePath();
        ctx.rect(-0.32, -0.04, 0.64, 0.42);
        ctx.fill();
        ctx.fillStyle = c.accent2;
        ctx.beginPath();
        ctx.rect(-0.08, 0.14, 0.16, 0.24);
        ctx.arc(0, -0.15, 0.07, 0, Math.PI * 2);
        ctx.fill();
      } else if (kind === "bowl") {
        ctx.arc(0, 0.02, 0.38, 0, Math.PI);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0.08, -0.04);
        ctx.lineTo(0.42, -0.4);
        ctx.moveTo(0.18, -0.02);
        ctx.lineTo(0.46, -0.3);
        for (const x of [-0.22, -0.04]) {
          ctx.moveTo(x, -0.1);
          ctx.bezierCurveTo(x - 0.1, -0.2, x + 0.1, -0.26, x, -0.38);
        }
        ctx.stroke();
      } else if (kind === "palm") {
        ctx.lineWidth = 0.09;
        ctx.moveTo(0.1, 0.4);
        ctx.quadraticCurveTo(0.12, 0, -0.04, -0.2);
        ctx.stroke();
        ctx.beginPath();
        const leaf = (ang) => {
          const ex = -0.04 + Math.cos(ang) * 0.4, ey = -0.2 + Math.sin(ang) * 0.4;
          const mx = -0.04 + Math.cos(ang - 0.35) * 0.3, my = -0.2 + Math.sin(ang - 0.35) * 0.3 - 0.08;
          const nx = -0.04 + Math.cos(ang + 0.35) * 0.22, ny = -0.2 + Math.sin(ang + 0.35) * 0.22 - 0.02;
          ctx.moveTo(-0.04, -0.2);
          ctx.quadraticCurveTo(mx, my, ex, ey);
          ctx.quadraticCurveTo(nx, ny, -0.04, -0.2);
        };
        [-2.9, -2.1, -1.1, -0.25].forEach(leaf);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-0.42, 0.42);
        ctx.quadraticCurveTo(0, 0.28, 0.42, 0.42);
        ctx.stroke();
      } else {
        ctx.moveTo(-0.46, 0.36);
        ctx.lineTo(-0.16, -0.14);
        ctx.lineTo(-0.02, 0.02);
        ctx.lineTo(0.14, -0.36);
        ctx.lineTo(0.46, 0.36);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = c.accent2;
        ctx.beginPath();
        ctx.moveTo(0.14, -0.2);
        ctx.lineTo(0.06, -0.08);
        ctx.lineTo(0.14, -0.12);
        ctx.lineTo(0.22, -0.06);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // ---- Fonts ----
    const TITLE = (px) => `800 ${px}px Outfit, system-ui, sans-serif`;
    const SANS = (weight, px) => `${weight} ${px}px Nunito, system-ui, sans-serif`;
    function spaced(px) {
      if ("letterSpacing" in ctx) ctx.letterSpacing = px + "px";
    }

    // ---- Layout, rebuilt on resize ----
    let W = 0, H = 0, dpr = 1, L = null;

    function build() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth;
      H = innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      cache.ok = false;
      const u = Math.min(W, H);
      const pad = Math.max(10, u * 0.065);

      // Title sized to the width, subtitle under it.
      let titleSize = Math.max(14, u * 0.092);
      ctx.font = TITLE(titleSize);
      const tw = ctx.measureText(title).width;
      if (tw > W - pad * 2) titleSize *= (W - pad * 2) / tw;
      const titleRight = pad + Math.min(tw, W - pad * 2) + pad * 0.5;
      const subSize = Math.max(8, titleSize * 0.4);
      const titleY = pad + titleSize * 0.8;
      const subY = titleY + subSize * 1.55;
      const titleBottom = subY + subSize * 0.4;

      // Pins and cards stay the same size on screen.
      const pinR = Math.max(5, u * 0.028);
      const pinH = pinR * 2.5;
      const nameSize = Math.max(9, u * 0.05);
      const daySize = Math.max(6.5, u * 0.032);
      const cardPad = Math.max(4, u * 0.022);
      const iconD = nameSize + daySize + cardPad * 0.6;
      const cardH = iconD + cardPad * 2;
      const tail = Math.max(3, u * 0.014);
      const cards = stops.map((s) => {
        ctx.font = SANS(800, nameSize);
        const nw = ctx.measureText(s.name).width;
        ctx.font = SANS(800, daySize);
        const dw = ctx.measureText(s.day.toUpperCase()).width + daySize * 0.1 * s.day.length;
        return { w: cardPad * 2.6 + iconD + Math.max(nw, dw) };
      });

      // Where stops may land on screen: below the title with room for a card above each pin.
      const gap = pad * 0.35;
      const side = pad + u * 0.07;
      const safeCard = { x0: side, x1: W - side, y0: titleBottom + gap + cardH + tail + pinH + pinR, y1: H - pad * 1.2 };
      const safeAll = { x0: side, x1: W - side, y0: titleBottom + gap + pinH + pinR * 1.5, y1: H - pad * 1.2 };

      // Fit a set of stops into a safe box. Returns a view [x, y, width] with the world
      // point at the centre of the screen and the world width the screen shows.
      function fit(list, box, minSpan) {
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        for (const s of list) {
          x0 = Math.min(x0, s.x); x1 = Math.max(x1, s.x);
          y0 = Math.min(y0, s.y); y1 = Math.max(y1, s.y);
        }
        const bw = Math.max(x1 - x0, minSpan), bh = Math.max(y1 - y0, minSpan * 0.7);
        const sw = Math.max(20, box.x1 - box.x0), sh = Math.max(20, box.y1 - box.y0);
        const k = Math.min(sw / bw, sh / bh);
        const fx = (box.x0 + box.x1) / 2, fy = (box.y0 + box.y1) / 2;
        const cx = (x0 + x1) / 2 + (W / 2 - fx) / k;
        const cy = (y0 + y1) / 2 + (H / 2 - fy) / k;
        return [cx, cy, W / k];
      }
      const span = 3.6 * deg;
      const views = [fit([stops[0]], safeCard, span)];
      hops.forEach((h, j) => views.push(fit([stops[j], stops[j + 1]], safeCard, span)));
      const all = fit(stops, safeAll, 0);

      // Camera keys: hold, then move, around each pin drop.
      const keys = [[0, views[0]]];
      hops.forEach((h, j) => {
        keys.push([drop[j] + 0.45, views[j]]);
        keys.push([drop[j] + (h.by === "plane" ? 1.5 : 1.3), views[j + 1]]);
      });
      keys.push([OVER.move, views[views.length - 1]], [OVER.arrive, all], [OVER.fade, all], [OVER.back, views[0]], [LOOP, views[0]]);
      const moves = keys.slice(0, -1).map((k0, i) => ({ t0: k0[0], t1: keys[i + 1][0], f: zoomBetween(k0[1], keys[i + 1][1]) }));

      L = { u, pad, titleSize, titleRight, subSize, titleY, subY, titleBottom, pinR, pinH, nameSize, daySize, cardPad, iconD, cardH, tail, cards, moves };
    }

    function camera(t) {
      const m = L.moves.find((mv) => t < mv.t1) || L.moves[L.moves.length - 1];
      const p = inOut(prog(t, m.t0, m.t1 - m.t0));
      const [x, y, w] = m.f(p);
      return { x, y, k: W / w };
    }

    // ---- Drawing ----
    // The map is painted into a cached image a bit larger than the screen, and only
    // repainted when the camera zooms or pans too far from it. Most frames just copy it.
    const cache = { canvas: document.createElement("canvas"), k: 0, x: 0, y: 0, ok: false };
    function paintLand(g, k, ox, oy, gridOnly) {
      g.setTransform(dpr * k, 0, 0, dpr * k, -ox * k * dpr, -oy * k * dpr);
      g.lineJoin = "round";
      g.strokeStyle = col.grid;
      g.lineWidth = 1 / k;
      g.stroke(grid);
      if (!land || gridOnly) return;
      // Less detail when zoomed out.
      const level = k * dpr >= 4 ? 0 : k * dpr >= 2.2 ? 1 : 2;
      const lod = land[level], soft = land[Math.min(2, level + 1)];
      const halo = (L.u * 0.02) / k;
      const box = [ox - halo, oy - halo, ox + (g.canvas.width / dpr) / k + halo, oy + (g.canvas.height / dpr) / k + halo];
      const strokeRings = (rings) => {
        for (const r of rings) {
          if (r.b[2] < box[0] || r.b[0] > box[2] || r.b[3] < box[1] || r.b[1] > box[3]) continue;
          g.stroke(r.p);
        }
      };
      // Shallow water glow along the coasts, then land, then thin coastlines.
      g.strokeStyle = col.shallow;
      g.lineWidth = halo;
      strokeRings(soft.rest.rings);
      strokeRings(soft.home.rings);
      g.fillStyle = col.land;
      g.fill(lod.rest.fill);
      g.fillStyle = col.home;
      g.fill(lod.home.fill);
      g.lineWidth = Math.max(0.6, L.u * 0.0022) / k;
      g.strokeStyle = col.landEdge;
      strokeRings(lod.rest.rings);
      g.lineWidth = Math.max(0.8, L.u * 0.003) / k;
      g.strokeStyle = col.homeEdge;
      strokeRings(lod.home.rings);
    }
    function drawMap(cam) {
      const k = cam.k;
      const vx0 = cam.x - W / 2 / k, vy0 = cam.y - H / 2 / k;
      if (!land) {
        paintLand(ctx, k, vx0, vy0, true);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return;
      }
      let r = k / cache.k;
      const inside = vx0 >= cache.x && vy0 >= cache.y &&
        vx0 + W / k <= cache.x + cache.w / cache.k && vy0 + H / k <= cache.y + cache.h / cache.k;
      if (!cache.ok || r < 0.7 || r > 1.15 || !inside) {
        // Margin around the view, smaller on big screens to save memory.
        const m = W * H * dpr * dpr > 4e6 ? 0.12 : 0.25;
        cache.k = k;
        cache.w = W * (1 + m * 2);
        cache.h = H * (1 + m * 2);
        cache.x = vx0 - (W * m) / k;
        cache.y = vy0 - (H * m) / k;
        const cw = Math.round(cache.w * dpr), ch = Math.round(cache.h * dpr);
        if (cache.canvas.width !== cw || cache.canvas.height !== ch) {
          cache.canvas.width = cw;
          cache.canvas.height = ch;
        }
        // A CPU backed canvas draws long paths much faster than a GPU one.
        const g = cache.canvas.getContext("2d", { willReadFrequently: true });
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = c.bg;
        g.fillRect(0, 0, cw, ch);
        paintLand(g, k, cache.x, cache.y);
        cache.ok = true;
        r = 1;
      }
      const a = reduce.matches ? 1 : clamp01((performance.now() - mapAt) / 600);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (a < 1) {
        paintLand(ctx, k, vx0, vy0, true);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      ctx.globalAlpha = a;
      ctx.drawImage(cache.canvas, (cache.x - vx0) * k, (cache.y - vy0) * k, cache.w * r, cache.h * r);
      ctx.globalAlpha = 1;
    }

    // Faint place names that only show in the wide views.
    const areas = [
      { text: "SOUTH CHINA SEA", lon: 111.8, lat: 9.2, sea: true },
      { text: "THAILAND", lon: 101.4, lat: 15.4 },
      { text: "VIETNAM", lon: 106.4, lat: 13.2 },
      { text: "INDONESIA", lon: 113.4, lat: 0.1 },
      { text: "SUMATRA", lon: 101.2, lat: 0.3 },
    ];
    areas.forEach((a) => ([a.x, a.y] = toWorld(a.lon, a.lat)));
    const overlaps = (b, list) => list.some((o) => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
    function drawAreas(cam, fade, avoid) {
      const degsWide = W / cam.k / deg;
      const a = clamp01((degsWide - 9) / 5) * fade * (land ? 1 : 0);
      if (a <= 0) return;
      const size = Math.max(6.5, L.u * 0.026);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      spaced(size * 0.28);
      for (const ar of areas) {
        ctx.font = ar.sea ? `italic ${SANS(700, size)}` : SANS(800, size);
        const x = W / 2 + (ar.x - cam.x) * cam.k, y = H / 2 + (ar.y - cam.y) * cam.k;
        const hw = ctx.measureText(ar.text).width / 2 + 2;
        const b = [x - hw, y - size * 0.6, x + hw, y + size * 0.6];
        if (b[0] < 0 || b[2] > W || b[3] > H || overlaps(b, avoid)) continue;
        ctx.fillStyle = rgba(ar.sea ? mix(c.bg, c.ink, 0.45) : col.label, 0.8 * a);
        ctx.fillText(ar.text, x, y);
      }
      spaced(0);
    }

    function drawRoute(h, pts, p, alpha) {
      const n = h.frac.findIndex((f) => f >= p);
      const i = n < 0 ? pts.length - 1 : Math.max(1, n);
      const f0 = h.frac[i - 1], f1 = h.frac[i];
      const q = f1 > f0 ? clamp01((p - f0) / (f1 - f0)) : 1;
      const end = [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * q, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * q];
      const u = L.u;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let j = 1; j < i; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      ctx.lineTo(end[0], end[1]);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.globalAlpha = alpha;
      // Road and ferry in a solid line, flights dashed.
      const lw = Math.max(1.6, u * 0.009);
      if (h.by === "plane" || h.by === "ferry") {
        ctx.setLineDash([lw * 0.01, lw * 2.4]);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = lw * 2.1;
        ctx.stroke();
        ctx.strokeStyle = c.ink;
        ctx.lineWidth = lw * 1.25;
        ctx.stroke();
        ctx.setLineDash([]);
      } else {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = lw * 2.2;
        ctx.stroke();
        ctx.strokeStyle = c.ink;
        ctx.lineWidth = lw;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      return { end, i };
    }

    function drawTraveller(h, pts, at, i, alpha, pop) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i)];
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
      const u = L.u;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(at[0], at[1]);
      if (h.by === "plane") {
        const sc = Math.max(0.55, u * 0.0034) * pop;
        ctx.fillStyle = rgba(c.ink, 0.16);
        ctx.save();
        ctx.translate(u * 0.012, u * 0.02);
        ctx.rotate(ang);
        ctx.scale(sc * 0.9, sc * 0.9);
        ctx.fill(plane);
        ctx.restore();
        ctx.rotate(ang);
        ctx.scale(sc, sc);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.2;
        ctx.lineJoin = "round";
        ctx.stroke(plane);
        ctx.fillStyle = c.ink;
        ctx.fill(plane);
      } else {
        const r = Math.max(7, u * 0.04) * pop;
        ctx.fillStyle = rgba(c.ink, 0.18);
        ctx.beginPath();
        ctx.arc(0, r * 0.14, r * 1.04, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        const sc = (r * 1.25) / 24;
        ctx.scale(Math.cos(ang) < 0 ? -sc : sc, sc);
        ctx.fillStyle = c.ink;
        if (h.by === "car") {
          ctx.fill(car);
          ctx.fillStyle = "#ffffff";
          ctx.fill(carGlass);
          for (const x of [-5.2, 6]) {
            ctx.fillStyle = c.ink;
            ctx.beginPath();
            ctx.arc(x, 3.4, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(x, 3.4, 0.9, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          ctx.translate(0, -0.8);
          ctx.fill(ferry);
          ctx.fillStyle = "#ffffff";
          ctx.fill(ferryGlass);
        }
      }
      ctx.restore();
    }

    function drawPin(x, y, i, t0, t, alpha) {
      const { pinR: r, pinH: h, u } = L;
      const p = prog(t, t0, 0.7);
      const lift = (1 - outBounce(p)) * u * 0.22;
      // Ripples on the ground where the pin lands.
      for (const d of [0, 0.28]) {
        const q = prog(t, t0 + 0.26 + d, 0.95);
        if (q <= 0 || q >= 1) continue;
        ctx.strokeStyle = rgba(c.accent, (1 - q) * 0.75 * alpha);
        ctx.lineWidth = Math.max(1.2, u * 0.006) * (1 - q * 0.5);
        ctx.beginPath();
        ctx.ellipse(x, y, r * 0.6 + outCubic(q) * u * 0.08, (r * 0.6 + outCubic(q) * u * 0.08) * 0.55, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      // Shadow grows as the pin comes down.
      const sh = 1 - lift / (u * 0.22);
      ctx.fillStyle = rgba(c.ink, 0.22 * sh * alpha);
      ctx.beginPath();
      ctx.ellipse(x, y, r * 0.75 * (0.5 + sh * 0.5), r * 0.28 * (0.5 + sh * 0.5), 0, 0, Math.PI * 2);
      ctx.fill();
      // Teardrop pin, tip on the spot.
      const ty = y - lift;
      const cy = ty - h;
      const phi = Math.acos(r / h);
      ctx.globalAlpha = alpha * clamp01(p * 6);
      ctx.fillStyle = c.accent;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(1, u * 0.004);
      ctx.beginPath();
      ctx.moveTo(x, ty);
      ctx.arc(x, cy, r, Math.PI / 2 + phi, Math.PI / 2 - phi + Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x, cy, r * 0.64, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = c.accent;
      ctx.font = SANS(800, r * 0.95);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(i + 1), x, cy + r * 0.05);
      ctx.globalAlpha = 1;
    }

    function drawCard(i, x, y, p) {
      const s = stops[i], { cardPad: cp, iconD, cardH, tail, nameSize, daySize, pinH, pinR, pad } = L;
      const w = L.cards[i].w;
      const tipY = y - pinH - pinR - tail * 0.6;
      let left = Math.max(pad * 0.5, Math.min(W - pad * 0.5 - w, x - w / 2));
      const top = tipY - tail - cardH;
      const tx = Math.max(left + cp * 1.6, Math.min(left + w - cp * 1.6, x));
      const sc = 0.55 + 0.45 * outBack(p);
      ctx.save();
      ctx.globalAlpha = clamp01(p * 2.5);
      ctx.translate(tx, tipY);
      ctx.scale(sc, sc);
      ctx.translate(-tx, -tipY);
      // Soft shadow from two offset layers (cheaper than a blur).
      const rad = Math.min(cardH * 0.32, L.u * 0.03);
      const sh = Math.max(1.5, L.u * 0.007);
      for (const [grow, a] of [[sh * 1.6, 0.05], [sh * 0.6, 0.08]]) {
        ctx.fillStyle = rgba(c.ink, a);
        roundRect(left - grow * 0.5, top + sh * 0.9 - grow * 0.3, w + grow, cardH + grow, rad + grow * 0.5);
        ctx.fill();
      }
      ctx.fillStyle = "#ffffff";
      roundRect(left, top, w, cardH, rad);
      ctx.moveTo(tx - tail, top + cardH - 0.5);
      ctx.lineTo(tx, tipY);
      ctx.lineTo(tx + tail, top + cardH - 0.5);
      ctx.fill();
      // Icon disc, then day and name.
      const ix = left + cp + iconD / 2, iy = top + cardH / 2;
      ctx.fillStyle = c.accent2;
      ctx.beginPath();
      ctx.arc(ix, iy, iconD / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.translate(ix, iy);
      icon(s.icon, iconD * 0.62);
      ctx.restore();
      const tx0 = left + cp * 1.6 + iconD;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = c.accent;
      ctx.font = SANS(800, daySize);
      spaced(daySize * 0.1);
      ctx.fillText(s.day.toUpperCase(), tx0, iy - cardH * 0.06);
      spaced(0);
      ctx.fillStyle = c.ink;
      ctx.font = SANS(800, nameSize);
      ctx.fillText(s.name, tx0, iy + nameSize * 0.86);
      ctx.restore();
    }

    // Stop names next to the pins in the wide view, skipped if they would overlap.
    const nameSize = () => Math.max(7.5, L.u * 0.034);
    function placeNames(screen) {
      const size = nameSize();
      const { pinR: r, pinH: h, pad } = L;
      ctx.font = SANS(800, size);
      const boxes = screen.map(([x, y]) => [x - r, y - h - r, x + r, y]);
      const names = [];
      screen.forEach(([x, y], i) => {
        const tw = ctx.measureText(stops[i].name).width;
        const cy = y - h;
        for (const side of [1, -1]) {
          const x0 = side > 0 ? x + r * 1.4 : x - r * 1.4 - tw;
          const b = [x0 - 2, cy - size * 0.6, x0 + tw + 2, cy + size * 0.6];
          if (b[0] < pad * 0.4 || b[2] > W - pad * 0.4 || b[1] < L.titleBottom || overlaps(b, boxes)) continue;
          boxes.push(b);
          names.push({ text: stops[i].name, x: x0, y: cy });
          break;
        }
      });
      return { names, boxes };
    }
    function drawNames(names, a) {
      if (a <= 0) return;
      ctx.font = SANS(800, nameSize());
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.lineWidth = Math.max(2.5, nameSize() * 0.35);
      ctx.lineJoin = "round";
      ctx.globalAlpha = a;
      for (const n of names) {
        ctx.strokeStyle = "#ffffff";
        ctx.strokeText(n.text, n.x, n.y);
        ctx.fillStyle = c.ink;
        ctx.fillText(n.text, n.x, n.y);
      }
      ctx.globalAlpha = 1;
    }

    function render(t) {
      const cam = camera(t);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = c.bg;
      ctx.fillRect(0, 0, W, H);
      drawMap(cam);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const fade = 1 - prog(t, OVER.fade, 0.45);
      const toScreen = ([x, y]) => [W / 2 + (x - cam.x) * cam.k, H / 2 + (y - cam.y) * cam.k];
      const screen = stops.map((s) => toScreen([s.x, s.y]));
      const placed = placeNames(screen);
      drawAreas(cam, fade, [...placed.boxes, [0, 0, W, L.titleBottom + L.pad * 0.5]]);

      // Routes, then the traveller on the one being drawn.
      let traveller = null;
      hops.forEach((h, j) => {
        if (t < h.start || fade <= 0) return;
        const raw = prog(t, h.start, h.dur);
        const p = inOut(raw);
        const pts = h.pts.map(toScreen);
        const { end, i } = drawRoute(h, pts, Math.max(p, 0.001), fade);
        const out = prog(t, h.start + h.dur - 0.05, 0.25);
        if (out < 1) traveller = [h, pts, end, i, (1 - out) * fade, outBack(prog(t, h.start, 0.35))];
      });

      // Pins, in order so later stops sit on top.
      stops.forEach((s, i) => {
        if (t < drop[i] || fade <= 0) return;
        drawPin(screen[i][0], screen[i][1], i, drop[i], t, fade);
      });
      if (traveller) drawTraveller(...traveller);

      // One card at a time, popping up over the newest pin.
      stops.forEach((s, i) => {
        const on = drop[i] + 0.25;
        const off = i < hops.length ? hops[i].start - 0.2 : OVER.move + 0.2;
        if (t < on || t > off + 0.25) return;
        const p = Math.min(prog(t, on, 0.5), 1 - prog(t, off, 0.25));
        drawCard(i, screen[i][0], screen[i][1], p);
      });

      drawNames(placed.names, prog(t, OVER.arrive - 0.3, 0.5) * fade);

      // Title on a soft wash so it reads over the map.
      const wash = ctx.createLinearGradient(0, 0, 0, L.titleBottom + L.pad * 1.2);
      wash.addColorStop(0, rgba(c.bg, 0.95));
      wash.addColorStop(0.65, rgba(c.bg, 0.75));
      wash.addColorStop(1, rgba(c.bg, 0));
      ctx.fillStyle = wash;
      ctx.fillRect(0, 0, W, L.titleBottom + L.pad * 1.2);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = c.ink;
      ctx.font = TITLE(L.titleSize);
      spaced(-L.titleSize * 0.01);
      ctx.fillText(title, L.pad, L.titleY);
      spaced(0);
      ctx.fillStyle = col.muted;
      ctx.font = SANS(700, L.subSize);
      ctx.fillText(subtitle, L.pad + L.titleSize * 0.03, L.subY);
    }

    // ---- Run ----
    let frame = 0, start = 0;
    function loop(now) {
      if (!start) start = now;
      render(((now - start) / 1000) % LOOP);
      frame = requestAnimationFrame(loop);
    }

    // Reduced motion: the whole trip in the wide view, every pin and route drawn.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    const still = () => L && render(OVER.fade - 0.2);
    function apply() {
      cancelAnimationFrame(frame);
      frame = 0;
      if (reduce.matches) still();
      else {
        start = 0;
        frame = requestAnimationFrame(loop);
      }
    }

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        build();
        if (reduce.matches) still();
      }, 100);
    });
    reduce.addEventListener("change", apply);

    // Start once the fonts are in (or after a short wait); the map fades in when it arrives.
    loadMap();
    Promise.race([
      Promise.all([document.fonts.load(TITLE(40)), document.fonts.load(SANS(800, 20)), document.fonts.load(SANS(700, 20))]),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => {
      build();
      apply();
    });
  </script>
</body>
</html>
