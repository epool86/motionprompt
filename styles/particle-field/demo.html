<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle field demo</title>
  <style>
    /* Colours can be set from the URL: ?text=...&bg=0a0d1a&ink=f6f3ea&accent=ff5a4e&accent2=4fb3ff */
    :root {
      --bg: #0a0d1a;
      --ink: #f6f3ea;
      --accent: #ff5a4e;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .caption {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14%;
      margin: 0;
      text-align: center;
      padding: 0 6%;
      color: var(--ink);
      font: 600 min(8vw, 5.5vh) / 1.15 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.02em;
      text-shadow: 0 0 24px color-mix(in srgb, var(--accent) 60%, transparent);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <canvas id="field" role="img" aria-label="Glowing particles drifting along soft currents"></canvas>
  <p class="caption" id="caption">Make it move</p>

  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const rgb = (h) => [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)).join(", ");
    const colors = { bg: hex("bg", "0a0d1a"), ink: hex("ink", "f6f3ea"), accent: hex("accent", "ff5a4e"), accent2: hex("accent2", "4fb3ff") };
    const root = document.documentElement;
    for (const key of ["bg", "ink", "accent"]) root.style.setProperty(`--${key}`, `#${colors[key]}`);
    document.getElementById("caption").textContent = (params.get("text") || "Make it move").trim().slice(0, 80);

    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    const background = rgb(colors.bg); // used for fading trails
    // Glow adds light, which only shows on a dark background. On a light one, paint normally.
    const lightBg = rgb(colors.bg).split(", ").reduce((sum, v, i) => sum + v * [0.3, 0.59, 0.11][i], 0) > 150;
    const blend = lightBg ? "source-over" : "lighter";
    // Particle colours: mostly the two accents, with a few in the text colour for sparkle.
    // Without custom colours, amber joins in as a third particle colour.
    const amber = params.has("accent2") ? colors.accent2 : "ffb35c";
    const tints = [colors.accent, colors.accent, amber, colors.accent2, colors.ink].map(rgb);

    let width = 0, height = 0, particles = [], time = 0, frame = 0;

    // A cheap, smooth "current": the angle each particle follows at a point.
    function angleAt(x, y, t) {
      const s = 0.0035 * (600 / Math.min(width, height));
      return (
        Math.sin(x * s + t * 0.4) +
        Math.cos(y * s * 1.3 - t * 0.3) +
        Math.sin((x + y) * s * 0.5 + t * 0.2)
      ) * Math.PI * 0.6;
    }

    function spawn(p = {}) {
      p.x = Math.random() * width;
      p.y = Math.random() * height;
      p.life = 80 + Math.random() * 220;
      p.speed = 0.6 + Math.random() * 1.4;
      p.tint = tints[Math.floor(Math.random() * tints.length)];
      p.size = Math.random() < 0.08 ? 2.2 : 1.1;
      return p;
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = `rgb(${background})`;
      ctx.fillRect(0, 0, width, height);
      const count = Math.min(2600, Math.round((width * height) / 260));
      particles = Array.from({ length: count }, () => spawn());
    }

    function step() {
      time += 1 / 60;
      // Paint a see-through layer of background so old positions fade into trails.
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = `rgba(${background}, 0.08)`;
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = blend;
      for (const p of particles) {
        const a = angleAt(p.x, p.y, time);
        p.x += Math.cos(a) * p.speed;
        p.y += Math.sin(a) * p.speed - 0.15; // slight upward drift, like warm air
        p.life -= 1;
        if (p.life <= 0 || p.x < -10 || p.x > width + 10 || p.y < -10 || p.y > height + 10) {
          spawn(p);
          continue;
        }
        const fade = Math.min(1, p.life / 40);
        ctx.fillStyle = `rgba(${p.tint}, ${0.55 * fade})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }

    function loop() {
      step();
      frame = requestAnimationFrame(loop);
    }

    // Reduced motion: run the simulation for a moment off screen, then keep that still frame.
    function still() {
      cancelAnimationFrame(frame);
      frame = 0;
      for (let i = 0; i < 180; i++) step();
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function start() {
      resize();
      if (reduce.matches) still();
      else if (!frame) loop();
    }

    reduce.addEventListener("change", () => {
      if (reduce.matches) still();
      else if (!frame) loop();
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(start, 150);
    });

    start();
  </script>
</body>
</html>
