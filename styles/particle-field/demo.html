<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle field demo</title>
  <style>
    /* Colours can be set from the URL: ?text=...&bg=0a0d1a&ink=f6f3ea&accent=ff5a4e&accent2=4fb3ff */
    :root {
      --bg: #0a0d1a;
      --ink: #f6f3ea;
      --accent: #ff5a4e;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .caption {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14%;
      margin: 0;
      text-align: center;
      padding: 0 6%;
      color: var(--ink);
      font: 600 min(8vw, 5.5vh) / 1.15 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.02em;
      text-shadow: 0 0 24px color-mix(in srgb, var(--accent) 60%, transparent);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <canvas id="field" role="img" aria-label="Glowing particles drifting along soft currents"></canvas>
  <p class="caption" id="caption">Make it move</p>

  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const rgb = (h) => [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)).join(", ");
    const colors = { bg: hex("bg", "0a0d1a"), ink: hex("ink", "f6f3ea"), accent: hex("accent", "ff5a4e"), accent2: hex("accent2", "4fb3ff") };
    const root = document.documentElement;
    for (const key of ["bg", "ink", "accent"]) root.style.setProperty(`--${key}`, `#${colors[key]}`);
    document.getElementById("caption").textContent = (params.get("text") || "Make it move").trim().slice(0, 80);

    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    const background = rgb(colors.bg); // used for fading trails
    // Glow adds light, which only shows on a dark background. On a light one, paint normally.
    const lightBg = rgb(colors.bg).split(", ").reduce((sum, v, i) => sum + v * [0.3, 0.59, 0.11][i], 0) > 150;
    const blend = lightBg ? "source-over" : "lighter";
    // Particle colours: mostly the two accents, with a few in the text colour for sparkle.
    // Without custom colours, amber joins in as a third particle colour.
    const amber = params.has("accent2") ? colors.accent2 : "ffb35c";
    const tints = [colors.accent, colors.accent, amber, colors.accent2, colors.ink].map(rgb);

    let width = 0, height = 0, particles = [], time = 0, frame = 0, lastFrame = -Infinity;

    // A cheap, smooth "current": the angle each particle follows at a point.
    function angleAt(x, y, t) {
      const s = 0.0035 * (600 / Math.min(width, height));
      return (
        Math.sin(x * s + t * 0.4) +
        Math.cos(y * s * 1.3 - t * 0.3) +
        Math.sin((x + y) * s * 0.5 + t * 0.2)
      ) * Math.PI * 0.6;
    }

    function spawn(p = {}) {
      p.x = Math.random() * width;
      p.y = Math.random() * height;
      p.life = 80 + Math.random() * 220;
      p.speed = 0.6 + Math.random() * 1.4;
      p.tint = tints[Math.floor(Math.random() * tints.length)];
      p.size = Math.random() < 0.08 ? 2.2 : 1.1;
      return p;
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = `rgb(${background})`;
      ctx.fillRect(0, 0, width, height);
      const count = Math.min(2600, Math.round((width * height) / 260));
      particles = Array.from({ length: count }, () => spawn());
    }

    function step() {
      time += 1 / 60;
      // Paint a see-through layer of background so old positions fade into trails.
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = `rgba(${background}, 0.08)`;
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = blend;
      for (const p of particles) {
        const a = angleAt(p.x, p.y, time);
        p.x += Math.cos(a) * p.speed;
        p.y += Math.sin(a) * p.speed - 0.15; // slight upward drift, like warm air
        p.life -= 1;
        if (p.life <= 0 || p.x < -10 || p.x > width + 10 || p.y < -10 || p.y > height + 10) {
          spawn(p);
          continue;
        }
        const fade = Math.min(1, p.life / 40);
        ctx.fillStyle = `rgba(${p.tint}, ${0.55 * fade})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }

    // Run the simulation in fixed 1/60 s steps from real elapsed time, so it moves at the
    // same speed on 60 Hz and 120 Hz screens (and the sound, which follows "time", keeps tempo).
    let carry = 0, prevNow = 0;
    function loop(now = performance.now()) {
      carry += Math.min(0.1, prevNow ? (now - prevNow) / 1000 : 1 / 60);
      prevNow = now;
      let steps = 0;
      while (carry >= 1 / 60 && steps < 4) { step(); carry -= 1 / 60; steps++; }
      if (steps === 4) carry = 0;
      lastFrame = performance.now();
      frame = requestAnimationFrame(loop);
    }

    // Reduced motion: run the simulation for a moment off screen, then keep that still frame.
    function still() {
      cancelAnimationFrame(frame);
      frame = 0;
      for (let i = 0; i < 180; i++) step();
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function start() {
      resize();
      if (reduce.matches) still();
      else if (!frame) loop();
    }

    reduce.addEventListener("change", () => {
      if (reduce.matches) still();
      else if (!frame) loop();
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(start, 150);
    });

    // ---- Sound ----
    // Every sound is made with the Web Audio API, nothing is loaded. It stays off until the parent
    // page (or ?sound=1 / ?sound=effects) turns it on. The field has no timeline, so the sound runs
    // on the demo's own clock ("time", which moves 1/60 s per frame): a 12 s musical loop, plus soft
    // wind that follows the same currents as the particles.
    const sound = (() => {
      // Its own copy of the media query, read only when it changes (reading it every tick can swallow the change event).
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      let reduced = reduce.matches;
      const LOOP = 12; // 60 bpm: three bars of four beats
      const LEVEL = 0.6, FX = 3, MUSIC = 0.18, ECHO = 0.75;
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      let ctx = null, master, impulse, pink, session = null, gates = [], beds = null;
      let fxBus, fxVerb, fxEcho, musBus, musVerb, musEcho;
      let wantOn = false, wantMusic = true, playing = false, fresh = true;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0, catchUp = false, ticks = 0;
      let rate = 1, samples = [];

      // Demo time in seconds, or null while frames are not running.
      function clock() {
        if (!frame || performance.now() - lastFrame > 250) return null;
        return time;
      }

      // One loop of sounds, in loop seconds.
      const events = (() => {
        const list = [];
        const add = (t, type, extra = {}, music = false) =>
          list.push({ t: ((t % LOOP) + LOOP) % LOOP, type, music, ...extra });
        let seed = 11;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

        // The text is there from the first frame: a warm glow swell opens every loop.
        add(0, "glow", { notes: [62, 69, 74, 77] });

        // Faint granular sparkles, scattered but the same every loop.
        const sparkle = [74, 77, 79, 81, 84, 86, 89, 91];
        for (let i = 0; i < 14; i++) {
          const t = 0.6 + (i * 11) / 14 + rnd() * 0.5;
          add(t, "grain", { m: sparkle[Math.floor(rnd() * sparkle.length)], p: rnd() * 1.6 - 0.8, v: 0.5 + rnd() * 0.5 });
        }

        // Music: slow chords over a low drone (the drone runs all the time, see beds), and soft bells.
        // Dm9, Bbmaj9, C6/9, back to Dm at the loop seam.
        const chords = [
          { at: 0, notes: [57, 60, 62, 65, 69], bells: [[0, 74], [1.5, 81], [3, 77]] },
          { at: 4, notes: [58, 62, 65, 69, 72], bells: [[0, 77], [2, 74], [3, 70]] },
          { at: 8, notes: [55, 60, 64, 67, 69], bells: [[0, 76], [1.5, 72], [2.5, 74]] },
        ];
        for (const c of chords) {
          add(c.at, "pad", { notes: c.notes, dur: 4 }, true);
          for (const [b, m] of c.bells) add(c.at + b, "bell", { m, p: (m % 5) / 5 - 0.4 }, true);
        }
        return list.sort((a, b) => a.t - b.t);
      })();

      // Audio graph: master gain into a gentle compressor, so nothing clips.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const sr = ctx.sampleRate;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16;
        comp.knee.value = 10;
        comp.ratio.value = 3;
        comp.attack.value = 0.01;
        comp.release.value = 0.25;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);

        // Pink noise for wind and air.
        pink = ctx.createBuffer(1, sr * 4, sr);
        const p = pink.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < p.length; i++) {
          const x = Math.random() * 2 - 1;
          b0 = 0.99765 * b0 + x * 0.099046;
          b1 = 0.963 * b1 + x * 0.2965164;
          b2 = 0.57 * b2 + x * 1.0526913;
          p[i] = (b0 + b1 + b2 + x * 0.1848) * 0.2;
        }

        // A long soft hall: stereo noise that fades and darkens over four seconds.
        const len = Math.floor(sr * 4);
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          let y = 0;
          for (let i = 0; i < len; i++) {
            const k = i / len;
            y += (0.75 - 0.65 * k) * ((Math.random() * 2 - 1) - y);
            d[i] = y * Math.pow(1 - k, 2.2) * 0.45;
          }
        }
      }

      // Each switch on gets fresh buses, so sounds booked before a switch off never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.08);
        session.connect(master);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        verb.connect(session);
        // A slow soft echo that feeds a little into the hall.
        const delay = ctx.createDelay(2);
        delay.delayTime.value = ECHO;
        const fb = ctx.createGain();
        fb.gain.value = 0.4;
        const tone = filter("lowpass", 2400);
        delay.connect(tone).connect(fb).connect(delay);
        tone.connect(session);
        tone.connect(verb);
        // Effects sit clearly above the music.
        [fxBus, fxVerb, fxEcho] = [session, verb, delay].map((to) => {
          const g = ctx.createGain();
          g.gain.value = FX;
          g.connect(to);
          return g;
        });
        // Music goes through gates, so music:false silences it and its reverb and echo too.
        musBus = ctx.createGain();
        musVerb = ctx.createGain();
        musEcho = ctx.createGain();
        gates = [[musBus, session], [musVerb, verb], [musEcho, delay]].map(([from, to]) => {
          const g = ctx.createGain();
          g.gain.value = wantMusic ? MUSIC : 0;
          from.connect(g).connect(to);
          return g;
        });
        beds = makeBeds(t);
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        for (const s of beds.sources) s.stop(t + 0.2);
        beds = null;
        setTimeout(() => old.disconnect(), 300);
      }
      function setGates() {
        const t = ctx.currentTime;
        for (const g of gates) {
          g.gain.cancelScheduledValues(t);
          g.gain.setValueAtTime(g.gain.value, t);
          g.gain.linearRampToValueAtTime(wantMusic ? MUSIC : 0, t + 0.12);
        }
      }

      // Continuous layers: two bands of wind (left and right) and the low drone.
      // Their levels are steered from the current, so they stay silent until the field runs.
      function makeBeds(t) {
        const sources = [];
        const wind = [-0.7, 0.7].map((side, i) => {
          const src = ctx.createBufferSource();
          src.buffer = pink;
          src.loop = true;
          src.start(t, i * 1.7);
          sources.push(src);
          const bp = filter("bandpass", 500, 1.2);
          const g = ctx.createGain();
          g.gain.value = 0;
          src.connect(bp).connect(g).connect(pan(side, fxBus));
          wet(g, 0.35);
          return { bp, g };
        });
        // A thin high air hiss that grows with the flow.
        const src = ctx.createBufferSource();
        src.buffer = pink;
        src.loop = true;
        src.start(t, 2.9);
        sources.push(src);
        const hp = filter("highpass", 5000, 0.5);
        const air = ctx.createGain();
        air.gain.value = 0;
        src.connect(hp).connect(air).connect(fxBus);
        wet(air, 0.5);
        // The drone: D and A, each a slowly beating pair, through a soft low pass.
        const drone = ctx.createGain();
        drone.gain.value = 0;
        const lp = filter("lowpass", 420, 0.5);
        lp.connect(drone).connect(musBus);
        wet(drone, 0.4, true);
        for (const [m, v] of [[38, 1], [45, 0.6], [50, 0.35]]) {
          for (const side of [-1, 1]) {
            const o = ctx.createOscillator();
            o.type = "sine";
            o.frequency.value = hz(m);
            o.detune.value = side * 4;
            const g = ctx.createGain();
            g.gain.value = 0.09 * v;
            o.connect(g).connect(pan(side * 0.4, lp));
            o.start(t);
            sources.push(o);
          }
        }
        return { wind, air, drone, sources, awake: false };
      }

      // Steer the layers from the same current the particles follow (angleAt at a few points).
      function steerBeds(now, at) {
        if (!beds) return;
        const tc = 0.5;
        beds.wind.forEach((w, i) => {
          const x = width * (i ? 0.75 : 0.25), y = height * 0.5;
          const a = angleAt(x, y, now);
          const gust = 0.5 + 0.5 * Math.sin(a + now * 0.25 + i * 2);
          w.g.gain.setTargetAtTime(0.04 + 0.08 * gust, at, tc);
          w.bp.frequency.setTargetAtTime(320 + 520 * gust, at, tc);
        });
        const flow = 0.5 + 0.5 * Math.sin(now * 0.4) * Math.cos(now * 0.3);
        beds.air.gain.setTargetAtTime(0.01 + 0.025 * flow, at, tc);
        beds.drone.gain.setTargetAtTime(0.8 + 0.2 * Math.sin((now / LOOP) * Math.PI * 2), at, tc);
        beds.awake = true;
      }
      function hushBeds(at) {
        if (!beds || !beds.awake) return;
        for (const w of beds.wind) w.g.gain.setTargetAtTime(0, at, 0.08);
        beds.air.gain.setTargetAtTime(0, at, 0.08);
        beds.drone.gain.setTargetAtTime(0, at, 0.08);
        beds.awake = false;
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      // A slow swell: rise, hold, fall (linear, so it breathes).
      function swellGain(when, peak, rise, hold, fall, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, when);
        g.gain.linearRampToValueAtTime(peak, when + rise);
        g.gain.setValueAtTime(peak, when + rise + hold);
        g.gain.linearRampToValueAtTime(0, when + rise + hold + fall);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(buf, when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = buf;
        s.loop = true;
        s.start(when, Math.random() * 3);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function wet(node, amount, music) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(music ? musVerb : fxVerb);
      }
      function echo(node, amount, music) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(music ? musEcho : fxEcho);
      }

      // One function per sound. "span" turns demo seconds into audio seconds.
      const span = (s) => s / rate;
      const voices = {
        // A warm glow that swells up under the text, then settles.
        glow(when, e) {
          const g = swellGain(when, 0.035, 1.4, 0.4, 3.2, fxBus);
          wet(g, 0.8);
          const lp = filter("lowpass", 500, 0.6);
          lp.frequency.setValueAtTime(500, when);
          lp.frequency.linearRampToValueAtTime(2200, when + 1.6);
          lp.frequency.linearRampToValueAtTime(700, when + 5);
          lp.connect(g);
          e.notes.forEach((m, i) => {
            for (const side of [-1, 1]) {
              const o = osc("triangle", hz(m), when, 5);
              o.detune.value = side * (4 + i);
              o.connect(pan(side * 0.5, lp));
            }
          });
          const n = noise(pink, when, 5);
          const bp = filter("bandpass", 900, 0.8);
          n.connect(bp).connect(swellGain(when, 0.12, 1.4, 0.4, 3.2, g));
        },
        // A tiny soft grain of light: a short high sine with a breath of noise.
        grain(when, e) {
          const p = pan(e.p, fxBus);
          osc("sine", hz(e.m), when, 0.5).connect(amp(when, 0.03 * e.v, 0.01, 0.45, p));
          const n = noise(pink, when, 0.08);
          n.connect(filter("bandpass", hz(e.m) * 2, 4)).connect(amp(when, 0.05 * e.v, 0.005, 0.06, p));
          wet(p, 1);
          echo(p, 0.6);
        },
        // Music: slow chord pad, two soft detuned voices per note.
        pad(when, e) {
          const d = span(e.dur), a = e.late ? 0.6 : Math.min(1.6, d * 0.4), hold = Math.max(0, d - a), rel = 2.6;
          const g = swellGain(when, 0.04, a, hold, rel, musBus);
          wet(g, 0.8, true);
          const lp = filter("lowpass", 600, 0.5);
          lp.frequency.setValueAtTime(600, when);
          lp.frequency.linearRampToValueAtTime(1300, when + (a + hold) * 0.6);
          lp.frequency.linearRampToValueAtTime(650, when + a + hold + rel);
          lp.connect(g);
          e.notes.forEach((m, i) => {
            for (const side of [-1, 1]) {
              const o = osc("triangle", hz(m), when, a + hold + rel);
              o.detune.value = side * (5 + i);
              o.connect(pan(side * 0.6, lp));
            }
          });
        },
        // Music: a soft bell (a sine with two quiet bell partials) into the echo and hall.
        bell(when, e) {
          const f = hz(e.m), p = pan(e.p, musBus);
          osc("sine", f, when, 3.6).connect(amp(when, 0.08, 0.006, 3.5, p));
          osc("sine", f * 2.76, when, 1.2).connect(amp(when, 0.018, 0.003, 1.1, p));
          osc("sine", f * 5.4, when, 0.5).connect(amp(when, 0.006, 0.002, 0.4, p));
          wet(p, 0.7, true);
          echo(p, 0.45, true);
        },
      };

      // Look-ahead scheduler: every 25 ms, book the sounds due in the next 100 ms.
      // Demo time maps to audio time through an anchor and a measured rate (the demo clock
      // moves one step per frame, so it runs at the screen's frame rate).
      function tick() {
        const ok = playing && ctx.state === "running" && !document.hidden && !reduced;
        const now = ok ? clock() : null;
        const at = ctx.currentTime;
        if (now === null) {
          anchor = null;
          samples = [];
          if (playing) hushBeds(at);
          return;
        }
        measureRate(now, at);
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio) * rate);
          if (Math.abs(err) > 0.1) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          // After a switch on or a real gap, start from now (nothing piles up). After a small
          // hiccup, carry on from where booking stopped, so nothing plays twice or goes missing.
          if (fresh || now - doneUpTo > 0.3 || now < doneUpTo - 0.3) {
            doneUpTo = now;
            catchUp = true;
          }
          fresh = false;
        }
        if (catchUp) {
          if (wantMusic) resumeHeld(now, at);
          catchUp = false;
        }
        if (ticks++ % 8 === 0) steerBeds(now, at);
        const from = doneUpTo, to = anchor.tl + (at - anchor.audio) * rate + 0.1 * rate;
        if (to <= from) return;
        for (let k = Math.floor(from / LOOP); k <= Math.floor(to / LOOP); k++) {
          for (const e of events) {
            const t = k * LOOP + e.t;
            if (t < from || t >= to || (e.music && !wantMusic)) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl) / rate), e);
          }
        }
        doneUpTo = to;
      }
      // Frame rate check: demo seconds per audio second over the last second or so.
      function measureRate(now, at) {
        samples.push([at, now]);
        if (samples.length > 48) samples.shift();
        const [a0, n0] = samples[0];
        if (at - a0 < 0.6) return;
        const r = Math.min(3, Math.max(0.2, (now - n0) / (at - a0)));
        if (Math.abs(r - rate) > 0.02) {
          if (anchor) anchor = { tl: anchor.tl + (at - anchor.audio) * rate, audio: at };
          rate += (r - rate) * 0.3;
        }
      }
      // Bring in long music notes that are already under way, so the bed does not wait for the next chord.
      function resumeHeld(now, at) {
        const lt = ((now % LOOP) + LOOP) % LOOP;
        for (const e of events) {
          if (!e.music || !e.dur) continue;
          for (const s of [e.t, e.t - LOOP]) {
            const left = s + e.dur - lt;
            if (lt > s && left > 0.4) voices[e.type](at + 0.02, { ...e, dur: left, late: true });
          }
        }
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && !reduced;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            fresh = true;
            openSession();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend().catch(() => {}), 200);
        }
      }
      function setMusic(on) {
        if (on === wantMusic) return;
        wantMusic = on;
        if (playing) {
          setGates();
          if (on) catchUp = true;
        }
      }

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);
      reduce.addEventListener("change", () => {
        reduced = reduce.matches;
        update();
      });

      addEventListener("message", (event) => {
        const d = event.data;
        if (event.origin !== location.origin || !d || d.type !== "motionprompt-sound") return;
        if (typeof d.music === "boolean") setMusic(d.music);
        if (typeof d.on === "boolean") wantOn = d.on;
        update();
      });
      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantMusic = fromUrl === "1";
        wantOn = true;
        update();
      }
      return { update };
    })();

    start();
  </script>
</body>
