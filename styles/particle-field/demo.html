<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Particle field demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0a0d1a;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .caption {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 14%;
      margin: 0;
      text-align: center;
      color: #f6f3ea;
      font: 600 min(9vw, 5.5vh) / 1.1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.02em;
      text-shadow: 0 0 24px rgba(255, 90, 78, 0.6);
    }
  </style>
</head>
<body>
  <canvas id="field" role="img" aria-label="Glowing particles drifting along soft currents"></canvas>
  <p class="caption">Make it move</p>

  <script>
    const canvas = document.getElementById("field");
    const ctx = canvas.getContext("2d");
    const background = "10, 13, 26"; // rgb of the page background, used for fading trails
    const hues = [8, 28, 200]; // coral, amber, cool blue

    let width = 0, height = 0, particles = [], time = 0, frame = 0;

    // A cheap, smooth "current": the angle each particle follows at a point.
    function angleAt(x, y, t) {
      const s = 0.0035 * (600 / Math.min(width, height));
      return (
        Math.sin(x * s + t * 0.4) +
        Math.cos(y * s * 1.3 - t * 0.3) +
        Math.sin((x + y) * s * 0.5 + t * 0.2)
      ) * Math.PI * 0.6;
    }

    function spawn(p = {}) {
      p.x = Math.random() * width;
      p.y = Math.random() * height;
      p.life = 80 + Math.random() * 220;
      p.speed = 0.6 + Math.random() * 1.4;
      p.hue = hues[Math.floor(Math.random() * hues.length)] + Math.random() * 16;
      p.size = Math.random() < 0.08 ? 2.2 : 1.1;
      return p;
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = `rgb(${background})`;
      ctx.fillRect(0, 0, width, height);
      const count = Math.min(2600, Math.round((width * height) / 260));
      particles = Array.from({ length: count }, () => spawn());
    }

    function step() {
      time += 1 / 60;
      // Paint a see-through layer of background so old positions fade into trails.
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = `rgba(${background}, 0.08)`;
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = "lighter";
      for (const p of particles) {
        const a = angleAt(p.x, p.y, time);
        p.x += Math.cos(a) * p.speed;
        p.y += Math.sin(a) * p.speed - 0.15; // slight upward drift, like warm air
        p.life -= 1;
        if (p.life <= 0 || p.x < -10 || p.x > width + 10 || p.y < -10 || p.y > height + 10) {
          spawn(p);
          continue;
        }
        const fade = Math.min(1, p.life / 40);
        ctx.fillStyle = `hsla(${p.hue}, 95%, 62%, ${0.55 * fade})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }

    function loop() {
      step();
      frame = requestAnimationFrame(loop);
    }

    // Reduced motion: run the simulation for a moment off screen, then keep that still frame.
    function still() {
      cancelAnimationFrame(frame);
      frame = 0;
      for (let i = 0; i < 180; i++) step();
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function start() {
      resize();
      if (reduce.matches) still();
      else if (!frame) loop();
    }

    reduce.addEventListener("change", () => {
      if (reduce.matches) still();
      else if (!frame) loop();
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(start, 150);
    });

    start();
  </script>
</body>
</html>
