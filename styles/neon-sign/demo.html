<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon sign demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/yellowtail@5.3.0/index.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=2a1512&ink=fff4f8&accent=ff4f9a&accent2=ffb13b */
    :root {
      --bg: #2a1512;
      --ink: #fff4f8;
      --accent: #ff4f9a;
      --accent2: #ffb13b;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0d0707;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #wall {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Light from the tubes spilling onto the bricks */
    .spill {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
    }

    /* Dark edges, like a wall lit only by the sign */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 35%, rgba(5, 2, 2, 0.8) 100%);
      pointer-events: none;
    }

    .sign {
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%) rotate(-4deg);
      font-family: "Yellowtail", "Brush Script MT", cursive;
      line-height: 1.12;
      white-space: nowrap;
    }

    .icon {
      position: relative;
      width: 0.95em;
      height: 0.95em;
      margin-bottom: 0.08em;
    }

    .icon svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Unlit glass tube, with a small shadow on the wall */
    .icon .off {
      stroke: color-mix(in srgb, var(--accent2) 30%, #3a2a2a);
      filter: drop-shadow(0.02em 0.03em 0.02em rgba(0, 0, 0, 0.6));
    }

    .icon .on {
      stroke: color-mix(in srgb, var(--accent2) 45%, white);
      filter:
        drop-shadow(0 0 0.02em var(--accent2))
        drop-shadow(0 0 0.06em var(--accent2))
        drop-shadow(0 0 0.16em var(--accent2));
      opacity: 0;
    }

    .line { padding: 0 0.12em; }

    .ch {
      position: relative;
      display: inline-block;
    }

    .ch .tube {
      color: color-mix(in srgb, var(--accent) 28%, #3b2b2e);
      text-shadow: 0.03em 0.05em 0.03em rgba(0, 0, 0, 0.55);
    }

    .ch .lit {
      position: absolute;
      left: 0;
      top: 0;
      color: var(--ink);
      text-shadow:
        0 0 0.02em var(--ink),
        0 0 0.05em var(--accent),
        0 0 0.1em var(--accent),
        0 0 0.22em var(--accent),
        0 0 0.45em color-mix(in srgb, var(--accent) 60%, transparent);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" role="img">
    <canvas id="wall"></canvas>
    <canvas class="spill" id="spillText"></canvas>
    <canvas class="spill" id="spillIcon"></canvas>
    <div class="vignette"></div>
    <div class="sign" id="sign">
      <div class="icon" id="icon">
        <!-- A coffee cup with steam, drawn as one neon tube -->
        <svg class="off" viewBox="0 0 100 100" aria-hidden="true"><use href="#cup"></use></svg>
        <svg class="on" id="iconOn" viewBox="0 0 100 100" aria-hidden="true"><use href="#cup"></use></svg>
      </div>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cup" viewBox="0 0 100 100">
      <path d="M20 46 H72 V62 C72 78 62 88 46 88 C30 88 20 78 20 62 Z" />
      <path d="M72 52 C86 50 88 68 72 72" />
      <path d="M36 36 C30 28 42 22 36 12 M50 36 C44 28 56 22 50 12 M64 36 C58 28 70 22 64 12" />
    </symbol>
  </svg>

  <script>
    const params = new URLSearchParams(location.search);
    const root = document.documentElement;
    for (const key of ["bg", "ink", "accent", "accent2"]) {
      const value = params.get(key);
      if (/^[0-9a-f]{6}$/i.test(value ?? "")) root.style.setProperty(`--${key}`, `#${value}`);
    }
    const text = (params.get("text") || "Open late").trim().slice(0, 40);
    const words = text.split(/\s+/).filter(Boolean);

    const stage = document.getElementById("stage");
    const sign = document.getElementById("sign");
    const iconOn = document.getElementById("iconOn");
    const spillText = document.getElementById("spillText");
    const spillIcon = document.getElementById("spillIcon");
    stage.setAttribute("aria-label", `A neon sign on a brick wall that reads: ${text}`);

    const LOOP = 10; // seconds

    // Small seeded random numbers, so every loop flickers the same way.
    function rand(seed) {
      let s = seed * 9301 + 49297;
      return () => ((s = (s * 9301 + 49297) % 233280) / 233280);
    }

    // ---- Brick wall, drawn once per size ----
    const wall = document.getElementById("wall");
    function drawWall(w, h) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      wall.width = Math.round(w * dpr);
      wall.height = Math.round(h * dpr);
      const g = wall.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const base = getComputedStyle(root).getPropertyValue("--bg").trim();
      g.fillStyle = "#120a09"; // mortar
      g.fillRect(0, 0, w, h);
      const bh = Math.max(7, Math.min(w, h) / 13);
      const bw = bh * 2.6;
      const gap = Math.max(1, bh * 0.11);
      const r = rand(7);
      for (let row = 0, y = -bh * 0.3; y < h; row++, y += bh) {
        const shift = row % 2 ? -bw / 2 : 0;
        for (let x = shift - bw * r(); x < w; x += bw) {
          // Each brick gets a slightly different shade of the wall colour.
          const shade = 0.7 + r() * 0.45;
          g.fillStyle = base;
          g.globalAlpha = 1;
          g.fillRect(x + gap / 2, y + gap / 2, bw - gap, bh - gap);
          g.fillStyle = shade > 1 ? "#ffffff" : "#000000";
          g.globalAlpha = Math.abs(1 - shade) * 0.5;
          g.fillRect(x + gap / 2, y + gap / 2, bw - gap, bh - gap);
          // Worn speckles and a soft top edge catch a little light.
          g.globalAlpha = 0.08;
          g.fillStyle = "#ffffff";
          g.fillRect(x + gap / 2, y + gap / 2, bw - gap, Math.max(1, gap * 0.6));
          g.fillStyle = "#000000";
          for (let i = 0; i < 6; i++) {
            const s = 0.6 + r() * bh * 0.08;
            g.globalAlpha = 0.15 + r() * 0.2;
            g.fillRect(x + gap + r() * (bw - gap * 3), y + gap + r() * (bh - gap * 3), s * 2, s);
          }
        }
      }
      g.globalAlpha = 1;
    }

    // ---- Sign text: one span per letter, with a dark tube and a lit copy on top ----
    const letters = [];
    let lineEls = [];
    function buildLines(lines) {
      lineEls.forEach((el) => el.remove());
      letters.length = 0;
      lineEls = lines.map((line) => {
        const el = document.createElement("div");
        el.className = "line";
        for (const ch of line) {
          const span = document.createElement("span");
          span.className = "ch";
          const tube = document.createElement("span");
          tube.className = "tube";
          tube.textContent = ch === " " ? " " : ch;
          span.append(tube);
          if (ch !== " ") {
            const lit = document.createElement("span");
            lit.className = "lit";
            lit.textContent = ch;
            span.append(lit);
            letters.push(lit);
          }
          el.append(span);
        }
        sign.append(el);
        return el;
      });
      makeTimings();
    }

    // Try one, two or three lines and keep whichever lets the sign be biggest.
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font:100px Yellowtail, cursive";
    document.body.append(probe);
    const widthOf = (s) => ((probe.textContent = s), probe.getBoundingClientRect().width / 100 + 0.24);

    function layouts() {
      const out = [[words.join(" ")]];
      for (let a = 1; a < words.length; a++) {
        out.push([words.slice(0, a).join(" "), words.slice(a).join(" ")]);
        for (let b = a + 1; b < words.length; b++) {
          out.push([words.slice(0, a).join(" "), words.slice(a, b).join(" "), words.slice(b).join(" ")]);
        }
      }
      return out;
    }

    let current = "";
    function fit() {
      const w = innerWidth, h = innerHeight;
      drawWall(w, h);
      let best = null;
      for (const lines of layouts()) {
        const ew = Math.max(0.95, ...lines.map(widthOf));
        const eh = 0.95 + 0.08 + lines.length * 1.12;
        // The sign is tilted a little, so leave room at the corners.
        const size = Math.min((w * 0.8) / ew, (h * 0.78) / eh);
        if (!best || size > best.size * 1.04) best = { lines, size, eh };
      }
      const key = best.lines.join("|");
      if (key !== current) {
        current = key;
        buildLines(best.lines);
      }
      sign.style.fontSize = `${best.size}px`;
      // Aim each light spill at its tube.
      const top = h / 2 - (best.eh * best.size) / 2;
      const tw = Math.max(...best.lines.map(widthOf)) * best.size;
      const css = getComputedStyle(root);
      drawSpill(spillText, w, h, top + best.size * (1.03 + best.lines.length * 0.56),
        tw * 0.75, best.size * (0.6 + best.lines.length * 0.7), css.getPropertyValue("--accent").trim(), [0.6, 0.22]);
      drawSpill(spillIcon, w, h, top + best.size * 0.5, best.size * 1.1, best.size * 1.1,
        css.getPropertyValue("--accent2").trim(), [0.5, 0.15]);
    }

    // A soft oval of coloured light, drawn at low resolution (it is blurry anyway).
    function drawSpill(canvas, w, h, cy, rx, ry, color, [a0, a1]) {
      const k = 0.25;
      canvas.width = Math.max(1, Math.round(w * k));
      canvas.height = Math.max(1, Math.round(h * k));
      const g = canvas.getContext("2d");
      g.setTransform(k, 0, 0, k * (ry / rx), 0, 0);
      const y = cy * (rx / ry);
      // Paint the fade as alpha first, then tint it: strong in the middle, gone at the edge.
      const fade = g.createRadialGradient(w / 2, y, 0, w / 2, y, rx);
      fade.addColorStop(0, `rgba(0,0,0,${a0})`);
      fade.addColorStop(0.5, `rgba(0,0,0,${a1})`);
      fade.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = fade;
      g.fillRect(0, 0, w, h * (rx / ry));
      g.globalCompositeOperation = "source-in";
      g.fillStyle = color;
      g.fillRect(0, 0, w, h * (rx / ry));
    }

    // ---- Flicker timings ----
    // Each tube gets a short stutter: a list of [time, level] steps. Levels hold until the next step.
    let timings = [];
    let iconSteps = [];
    function stutter(start, seed, kick = 1) {
      const r = rand(seed);
      const steps = [[0, 0], [start, 0.55 + r() * 0.3]];
      let t = start + 0.06 + r() * 0.05;
      const blinks = 2 + Math.floor(r() * 2);
      for (let i = 0; i < blinks; i++) {
        steps.push([t, 0.08 * kick]);
        t += 0.07 + r() * 0.1;
        steps.push([t, 0.5 + r() * 0.4]);
        t += 0.08 + r() * 0.12;
      }
      steps.push([t, 1]);
      return steps;
    }

    function makeTimings() {
      const n = letters.length;
      const span = Math.min(2.6, 0.28 * n); // the whole word lights up in under 3 seconds
      timings = letters.map((_, i) => stutter(0.5 + (i / Math.max(1, n - 1)) * span, i * 13 + 5));
      // One tube briefly drops out mid loop.
      const weak = timings[Math.max(0, n - 2)];
      weak.push([6.6, 0.1], [6.68, 0.9], [6.76, 0.15], [6.95, 1]);
      iconSteps = stutter(0.7 + span + 0.4, 99, 0);
      iconSteps.push([8.1, 0.35], [8.2, 1]);
      sound.replan();
    }

    function levelAt(steps, t) {
      let v = 0;
      for (const [at, level] of steps) {
        if (t >= at) v = level;
        else break;
      }
      // Soft fade out at the end of the loop, so it starts again from dark.
      if (t > 9.2) v *= Math.max(0, 1 - (t - 9.2) / 0.35);
      return v;
    }

    // ---- Render ----
    let frame = 0, start = 0, glowText = 0, glowIcon = 0, last = 0;
    const shown = new Map();
    function set(el, value) {
      const v = Math.round(value * 100) / 100;
      if (shown.get(el) !== v) {
        shown.set(el, v);
        el.style.opacity = v;
      }
    }

    function render(t, dt) {
      let sum = 0;
      letters.forEach((el, i) => {
        // A faint steady hum once the tube is lit.
        const hum = 0.96 + 0.04 * Math.sin(t * 2 * Math.PI * 1.1 + i);
        const v = levelAt(timings[i], t) * hum;
        sum += v;
        set(el, v);
      });
      const vi = levelAt(iconSteps, t);
      set(iconOn, vi);
      // The wall light follows the tubes slowly, so it never flashes.
      const ease = dt ? 1 - Math.exp(-dt / 0.3) : 1;
      glowText += (sum / Math.max(1, letters.length) - glowText) * ease;
      glowIcon += (vi - glowIcon) * ease;
      set(spillText, glowText * 0.85);
      set(spillIcon, glowIcon * 0.7);
    }

    function loop(now) {
      if (!start) start = now;
      const t = ((now - start) / 1000) % LOOP;
      render(t, last ? Math.min(0.1, (now - last) / 1000) : 0);
      last = now;
      frame = requestAnimationFrame(loop);
    }

    // Reduced motion: every tube fully lit, no flicker, no hum.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function still() {
      cancelAnimationFrame(frame);
      frame = 0;
      letters.forEach((el) => set(el, 1));
      set(iconOn, 1);
      set(spillText, 0.85);
      set(spillIcon, 0.7);
    }
    function apply() {
      if (reduce.matches) still();
      else if (!frame) {
        start = 0;
        last = 0;
        frame = requestAnimationFrame(loop);
      }
    }

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        fit();
        if (reduce.matches) still();
      }, 100);
    });
    reduce.addEventListener("change", apply);

    // ---- Sound: off until the page asks for it. Every sound is made here with Web Audio, no files. ----
    // o.clock() gives { t, p }: animation seconds t (not wrapped) that were true at performance time p (ms),
    // or null while the animation is stopped. o.plan() lists one loop of { t, type, music, dur, long }.
    // o.voices[type](when, e, A, skip) makes one sound. o.setup(A) can add extra nodes to each session
    // and set A.stop to end them.
    function makeSound(o) {
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      const LOOK = 0.1;
      let ctx = null, A = null, impulse = null, noiseBuf = null, master = null;
      let events = [], loopLen = 1;
      let wantOn = false, wantMusic = true, timer = 0, sleepTimer = 0;
      let animOff = null, outOff = null, done = null, longs = [];

      function build() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const sr = ctx.sampleRate;
        // Compressor last, so nothing clips.
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = o.level;
        master.connect(comp).connect(ctx.destination);
        // White noise, and a reverb impulse made of stereo noise that fades away.
        noiseBuf = ctx.createBuffer(1, sr * 2, sr);
        const n = noiseBuf.getChannelData(0);
        for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;
        const len = Math.floor(sr * (o.verbTime || 1.6));
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5);
        }
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        if (out) g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const s = ctx.createOscillator();
        s.type = type;
        s.frequency.setValueAtTime(freq, when);
        s.start(when);
        s.stop(when + dur + 0.05);
        return s;
      }
      function noise(when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

      // Each switch on gets fresh buses, so sounds booked before a switch off never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        const out = ctx.createGain();
        out.gain.setValueAtTime(0, t);
        out.gain.linearRampToValueAtTime(1, t + 0.05);
        out.connect(master);
        const fx = ctx.createGain();
        fx.connect(out);
        // Music gate: music:false fades this to zero, with the music's own reverb.
        const gate = ctx.createGain();
        gate.gain.value = wantMusic ? o.music : 0;
        gate.connect(out);
        const mus = ctx.createGain();
        mus.connect(gate);
        const verb = (dest) => {
          const c = ctx.createConvolver();
          c.buffer = impulse;
          const tone = filter("lowpass", 4000);
          const input = ctx.createGain();
          input.connect(c).connect(tone).connect(dest);
          return input;
        };
        const fxVerb = verb(fx), musVerb = verb(mus);
        longs = [];
        A = {
          ctx, out, fx, mus, gate, fxVerb, musVerb, amp, osc, noise, filter, pan, hz,
          // Reverb sends, one for effects and one for music.
          send(node, amount) { const g = ctx.createGain(); g.gain.value = amount; node.connect(g).connect(fxVerb); },
          msend(node, amount) { const g = ctx.createGain(); g.gain.value = amount; node.connect(g).connect(musVerb); },
        };
        if (o.setup) o.setup(A);
      }
      function closeSession() {
        const S = A, old = A.out, t = ctx.currentTime;
        A = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => {
          old.disconnect();
          if (S.stop) S.stop(); // stop any steady sources the session started (like an LFO)
        }, 300);
      }

      // AudioContext time for a performance time (seconds), using the output clock when there is one.
      function outputOffset() {
        const pnow = performance.now();
        const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
        let raw;
        if (ts && ts.contextTime > 0 && ts.performanceTime > 0 && Math.abs(pnow - ts.performanceTime) < 1000) {
          raw = ts.contextTime - ts.performanceTime / 1000;
        } else {
          raw = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0) - pnow / 1000;
        }
        if (outOff === null || Math.abs(raw - outOff) > 0.04) outOff = raw;
        else outOff += (raw - outOff) * 0.1;
        return outOff;
      }

      function play(e, when, skip = 0) {
        if (e.music && !wantMusic) return;
        if (!e.long) return o.voices[e.type](when, e, A, skip);
        // Long sounds get their own faders, so a resync can fade them out before starting them again.
        const f = ctx.createGain(), fs = ctx.createGain();
        f.connect(e.music ? A.mus : A.fx);
        fs.connect(e.music ? A.musVerb : A.fxVerb);
        const view = Object.create(A);
        view.fx = view.mus = f;
        view.send = view.msend = (node, amount) => { const g = ctx.createGain(); g.gain.value = amount; node.connect(g).connect(fs); };
        o.voices[e.type](when, e, view, skip);
        longs = longs.filter((x) => x.end > ctx.currentTime);
        longs.push({ faders: [f, fs], end: when + e.dur - skip + 1, music: !!e.music });
      }
      function fadeLongs(musicOnly) {
        const t = ctx.currentTime;
        for (const x of longs) {
          if (musicOnly && !x.music) continue;
          for (const g of x.faders) {
            g.gain.setValueAtTime(1, t);
            g.gain.linearRampToValueAtTime(0, t + 0.08);
          }
        }
        longs = longs.filter((x) => musicOnly && !x.music);
      }

      // Long sounds already under way (a hum, a pad) start part way through, so they do not wait a loop.
      function catchUp(now, musicOnly) {
        const lt = ((now % loopLen) + loopLen) % loopLen;
        for (const e of events) {
          if (!e.long || (musicOnly && !e.music)) continue;
          if (lt > e.t + 0.02 && lt < e.t + e.dur - 0.15) play(e, ctx.currentTime + 0.02, lt - e.t);
        }
      }

      // Look-ahead scheduler: every 25 ms, book the sounds due in the next 100 ms of animation time.
      function tick() {
        const c = A && ctx.state === "running" && !document.hidden && !reduce.matches ? o.clock() : null;
        if (!c) { done = null; return; }
        const raw = c.p / 1000 - c.t;
        if (animOff === null || Math.abs(raw - animOff) > 0.08) { animOff = raw; done = null; }
        else animOff += (raw - animOff) * 0.05;
        const off = outputOffset();
        const now = performance.now() / 1000 - animOff;
        if (done === null) {
          // Start or resume: pick up from now, skip anything missed (no burst).
          done = now;
          fadeLongs(false);
          catchUp(now, false);
        }
        const to = now + LOOK;
        if (to <= done) return;
        for (let k = Math.floor(done / loopLen); k * loopLen < to; k++) {
          for (const e of events) {
            const at = k * loopLen + e.t;
            if (at >= done && at < to) play(e, Math.max(ctx.currentTime, at + animOff + off));
          }
        }
        done = to;
      }

      function update() {
        const on = wantOn && !reduce.matches;
        if (on) {
          if (!ctx) build();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!A) {
            openSession();
            done = null;
            animOff = null;
            outOff = null;
          }
          if (!timer) timer = setInterval(tick, 25);
          tick();
        } else if (ctx) {
          clearInterval(timer);
          timer = 0;
          done = null;
          if (A) closeSession();
          clearTimeout(sleepTimer);
          sleepTimer = setTimeout(() => {
            if (!(wantOn && !reduce.matches)) ctx.suspend().catch(() => {});
          }, 220);
        }
      }

      function setMusic(on) {
        if (on === wantMusic) return;
        wantMusic = on;
        if (!A) return;
        const g = A.gate.gain, t = ctx.currentTime;
        g.cancelScheduledValues(t);
        g.setValueAtTime(g.value, t);
        g.linearRampToValueAtTime(on ? o.music : 0, t + 0.12);
        if (on && done !== null) {
          fadeLongs(true);
          catchUp(done - LOOK, true);
        }
      }

      // Call again whenever the animation is rebuilt (new size, new text).
      function replan() {
        loopLen = o.loopLen();
        events = o.plan().sort((a, b) => a.t - b.t);
        done = null;
      }

      // Browsers may block audio until a click or key press: resume then.
      const unlock = () => {
        if (ctx && wantOn && !reduce.matches && ctx.state !== "running") ctx.resume().catch(() => {});
      };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);
      reduce.addEventListener("change", update);
      addEventListener("message", (event) => {
        const d = event.data;
        if (event.origin !== location.origin || !d || d.type !== "motionprompt-sound") return;
        if (typeof d.music === "boolean") setMusic(d.music);
        if (typeof d.on === "boolean") wantOn = d.on;
        update();
      });
      const fromUrl = new URLSearchParams(location.search).get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantOn = true;
        wantMusic = fromUrl === "1";
      }

      return { replan, start: update };
    }

    // The sound follows the same clock as the flicker: loop time = (frame time - start) / 1000.
    const BEAT = LOOP / 16; // 96 bpm: 16 beats (4 bars) fill one 10 s loop exactly
    const sound = makeSound({
      level: 0.7,
      music: 0.26,
      clock: () => (frame && last && performance.now() - last < 250 ? { t: (last - start) / 1000, p: last } : null),
      loopLen: () => LOOP,
      plan() {
        const list = [];
        const n = letters.length;
        // Every time a tube brightens it crackles and buzzes until the next step; every drop is a tiny tick.
        const steps = (arr, pan, seed, first, other) => {
          for (let k = 1; k < arr.length; k++) {
            const [t, v] = arr[k];
            const prev = arr[k - 1][1];
            if (t >= 9.2) continue;
            const next = k + 1 < arr.length ? arr[k + 1][0] : t + 0.25;
            if (v > prev) {
              const type = k === 1 ? first : v >= 1 ? "catch" : other;
              list.push({ t, type, v, dur: Math.min(0.14, next - t), pan, seed: seed + k });
            } else list.push({ t, type: "drop", v: prev - v, pan });
          }
        };
        timings.forEach((arr, i) => steps(arr, n > 1 ? (i / (n - 1) - 0.5) * 0.8 : 0, i * 31, "crackle", "crackle"));
        steps(iconSteps, 0, 777, "zap", "izap");
        // Steady hum that follows how much of the sign is lit, then fades with it.
        const times = new Set();
        for (const arr of timings.concat([iconSteps])) for (const [t] of arr) if (t > 0 && t < 9.2) times.add(t);
        const sorted = [...times].sort((a, b) => a - b);
        const first = sorted[0] || 0.5;
        const env = sorted.map((t) => {
          let sum = levelAt(iconSteps, t);
          for (const arr of timings) sum += levelAt(arr, t);
          return [t - first, sum / (timings.length + 1)];
        });
        list.push({ t: first, type: "hum", dur: 9.6 - first, long: true, env, fadeAt: 9.2 - first });
        list.push({ t: 9.2, type: "down" });

        // Music: late night lo-fi. Soft electric piano, a round bass, brushes and a soft kick, swung.
        // Gm9, C13, Fmaj9, Dm9, one bar each.
        const bars = [
          [43, [58, 62, 65, 69], 50, 35],
          [36, [58, 64, 69, 74], 43, 40],
          [41, [57, 60, 64, 67], 48, 37],
          [38, [53, 57, 60, 64], 45, 42],
        ];
        bars.forEach(([root, chord, fifth, approach], b) => {
          const t0 = b * 4 * BEAT;
          list.push({ t: t0, type: "keys", notes: chord, v: 0.16, dur: 1.6 * BEAT, music: true });
          list.push({ t: t0 + 2.67 * BEAT, type: "keys", notes: chord.slice(1), v: 0.1, dur: 1 * BEAT, music: true });
          list.push({ t: t0, type: "bass", m: root, dur: 1.7 * BEAT, music: true });
          list.push({ t: t0 + 2 * BEAT, type: "bass", m: fifth, dur: 1.2 * BEAT, music: true });
          list.push({ t: t0 + 3.67 * BEAT, type: "bass", m: approach, dur: 0.3 * BEAT, music: true });
          list.push({ t: t0, type: "kick", music: true });
          list.push({ t: t0 + 2.67 * BEAT, type: "kick", v: 0.6, music: true });
          list.push({ t: t0 + BEAT, type: "brush", music: true });
          list.push({ t: t0 + 3 * BEAT, type: "brush", music: true });
          for (let k = 0; k < 4; k++) {
            list.push({ t: t0 + k * BEAT, type: "swish", v: 0.6, music: true });
            list.push({ t: t0 + (k + 0.67) * BEAT, type: "swish", v: 0.35, music: true });
          }
        });
        return list;
      },
      voices: {
        // Transformer buzz while the tube is on, with a few random crackles on top.
        crackle(when, e, A, skip, tone = 1100, tail = 0.012, size = 1) {
          const { ctx } = A;
          const d = Math.max(0.03, e.dur);
          const out = A.pan(e.pan, A.fx);
          const g = ctx.createGain();
          const peak = 0.09 * e.v * size;
          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(peak, when + 0.004);
          g.gain.setValueAtTime(peak, when + d - 0.004);
          g.gain.exponentialRampToValueAtTime(0.0001, when + d + tail);
          g.connect(out);
          const buzz = A.osc("sawtooth", 120, when, d + tail);
          buzz.connect(A.filter("bandpass", tone, 0.9)).connect(g);
          const r = rand(e.seed || 1);
          const clicks = [0];
          for (let i = 1 + Math.floor(r() * 3); i > 0; i--) clicks.push(r() * d * 0.9);
          clicks.sort((a, b) => a - b);
          const cg = ctx.createGain();
          cg.gain.setValueAtTime(0, when);
          for (const c of clicks) {
            cg.gain.setValueAtTime((0.1 + r() * 0.14) * size, when + c);
            cg.gain.setTargetAtTime(0, when + c + 0.001, 0.004);
          }
          A.noise(when, d).connect(A.filter("highpass", 2800)).connect(cg).connect(out);
          A.send(g, 0.15);
        },
        // The tube settles to full brightness: a slightly longer buzz that melts into the hum.
        catch(when, e, A) {
          this.crackle(when, e, A, 0, 900, 0.22);
        },
        drop(when, e, A) {
          const n = A.noise(when, 0.01);
          n.connect(A.filter("highpass", 2200)).connect(A.amp(when, 0.05 + 0.06 * e.v, 0.001, 0.006, A.pan(e.pan, A.fx)));
        },
        // Icon buzzes on: a small bright zap, then its own higher buzz.
        zap(when, e, A) {
          const out = A.pan(0, A.fx);
          const s = A.osc("sawtooth", 3200, when, 0.08);
          s.frequency.exponentialRampToValueAtTime(380, when + 0.07);
          const g = A.amp(when, 0.14, 0.002, 0.07, out);
          s.connect(A.filter("bandpass", 1800, 1.4)).connect(g);
          A.noise(when, 0.05).connect(A.filter("highpass", 4000)).connect(A.amp(when, 0.22, 0.001, 0.04, out));
          A.send(g, 0.35);
          this.crackle(when, e, A, 0, 1700, 0.015, 1.1);
        },
        izap(when, e, A) {
          this.crackle(when, e, A, 0, 1700, e.v >= 1 ? 0.2 : 0.012, 1.1);
        },
        // Low steady neon hum that follows how much of the sign is lit.
        hum(when, e, A, skip = 0) {
          const { ctx } = A;
          const end = when + e.dur - skip;
          const g = ctx.createGain();
          const lvl = (v) => 0.0001 + v * 0.06;
          let cur = 0;
          for (const [t, v] of e.env) if (t <= skip) cur = v;
          g.gain.setValueAtTime(lvl(cur), when);
          for (const [t, v] of e.env) if (t > skip) g.gain.setTargetAtTime(lvl(v), when + t - skip, 0.015);
          g.gain.setTargetAtTime(0.0001, Math.max(when, when + e.fadeAt - skip), 0.09);
          g.connect(A.fx);
          const lp = A.filter("lowpass", 380, 1.5);
          lp.connect(g);
          A.osc("sawtooth", 120, when, end - when).connect(lp);
          const sub = ctx.createGain();
          sub.gain.value = 0.6;
          A.osc("sine", 60, when, end - when).connect(sub).connect(g);
          const fizz = ctx.createGain();
          fizz.gain.value = 0.05;
          A.osc("square", 120, when, end - when).connect(A.filter("bandpass", 3000, 3)).connect(fizz).connect(g);
        },
        // Soft power down as the sign fades off.
        down(when, e, A) {
          const s = A.osc("sawtooth", 120, when, 0.5);
          s.frequency.exponentialRampToValueAtTime(42, when + 0.45);
          const lp = A.filter("lowpass", 900);
          lp.frequency.exponentialRampToValueAtTime(140, when + 0.45);
          const g = A.amp(when, 0.1, 0.01, 0.42, A.fx);
          s.connect(lp).connect(g);
          const th = A.osc("sine", 85, when, 0.6);
          th.frequency.exponentialRampToValueAtTime(38, when + 0.5);
          th.connect(A.amp(when, 0.16, 0.01, 0.5, A.fx));
          A.send(g, 0.4);
        },
        // Electric piano: soft sine tines with a short bell-like attack.
        keys(when, e, A) {
          const { ctx } = A;
          const out = ctx.createGain();
          out.gain.setValueAtTime(0.0001, when);
          out.gain.exponentialRampToValueAtTime(e.v, when + 0.01);
          out.gain.exponentialRampToValueAtTime(e.v * 0.35, when + 0.5);
          out.gain.setValueAtTime(e.v * 0.35, when + e.dur);
          out.gain.exponentialRampToValueAtTime(0.0001, when + e.dur + 0.35);
          const lp = A.filter("lowpass", 2200);
          lp.connect(out).connect(A.mus);
          e.notes.forEach((m, i) => {
            const f = A.hz(m) * (1 + (i - 1.5) * 0.0012);
            const c = A.osc("sine", f, when, e.dur + 0.4);
            const mod = A.osc("sine", f, when, e.dur + 0.4);
            const depth = ctx.createGain();
            depth.gain.setValueAtTime(f * 1.1, when);
            depth.gain.exponentialRampToValueAtTime(f * 0.08, when + 0.3);
            mod.connect(depth).connect(c.frequency);
            const v = ctx.createGain();
            v.gain.value = 0.3;
            c.connect(v).connect(A.pan((i - 1.5) * 0.2, lp));
          });
          A.msend(out, 0.45);
        },
        bass(when, e, A) {
          const f = A.hz(e.m);
          const out = A.amp(when, 0.34, 0.012, e.dur + 0.1, null);
          out.connect(A.filter("lowpass", 520)).connect(A.mus);
          A.osc("triangle", f, when, e.dur + 0.15).connect(out);
          A.osc("sine", f, when, e.dur + 0.15).connect(out);
        },
        kick(when, e, A) {
          const s = A.osc("sine", 110, when, 0.3);
          s.frequency.exponentialRampToValueAtTime(46, when + 0.12);
          s.connect(A.amp(when, 0.42 * (e.v || 1), 0.004, 0.26, A.mus));
        },
        brush(when, e, A) {
          const g = A.amp(when, 0.14, 0.018, 0.22, A.mus);
          A.noise(when, 0.3).connect(A.filter("bandpass", 2600, 0.6)).connect(g);
          A.msend(g, 0.3);
        },
        swish(when, e, A) {
          A.noise(when, 0.1).connect(A.filter("highpass", 5500)).connect(A.amp(when, 0.05 * e.v, 0.012, 0.07, A.pan(0.3, A.mus)));
        },
      },
    });

    // Wait briefly for the font so the letters are measured in the right face.
    Promise.race([
      document.fonts.load("100px Yellowtail"),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => {
      fit();
      apply();
      sound.start();
    });
  </script>
</body>
</html>
