<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid gradient demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight@5.3.0/index.css">
  <style>
    /* Colours can be set from the URL: ?text=First+line|Second+line&bg=120d33&ink=fff8f0&accent=ff5fa2&accent2=3fc8ff */
    :root {
      --bg: #120d33;
      --ink: #fff8f0;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      /* Shown only if WebGL is missing */
      background:
        radial-gradient(60% 50% at 25% 30%, #6c4bff 0%, transparent 70%),
        radial-gradient(55% 45% at 75% 70%, #ff5fa2 0%, transparent 70%),
        var(--bg);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .line {
      grid-area: 1 / 1;
      position: relative;
      margin: 0;
      text-align: center;
      color: var(--ink);
      font-family: "Inter Tight Variable", "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -0.035em;
      text-wrap: balance;
      text-shadow: 0 0.04em 0.4em rgba(0, 0, 0, 0.18);
      opacity: 0;
      will-change: opacity, filter, transform;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" role="img">
    <canvas id="glow"></canvas>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const colors = { bg: hex("bg", "120d33"), ink: hex("ink", "fff8f0"), accent: hex("accent", "ff5fa2"), accent2: hex("accent2", "3fc8ff") };
    const root = document.documentElement;
    root.style.setProperty("--bg", `#${colors.bg}`);
    root.style.setProperty("--ink", `#${colors.ink}`);

    // Two lines: split the text on "|", or use the defaults.
    const text = (params.get("text") || "Make it move|Beautifully simple").slice(0, 120);
    const lines = text.split("|").map((s) => s.trim()).filter(Boolean).slice(0, 2);
    if (lines.length === 1) lines.push(lines[0]);

    const stage = document.getElementById("stage");
    stage.setAttribute("aria-label", `Soft colour blobs flowing behind the words: ${lines.join(", ")}`);
    const lineEls = lines.map((s) => {
      const el = document.createElement("h1");
      el.className = "line";
      el.textContent = s;
      stage.append(el);
      return el;
    });

    // Blob colours: four soft tones. Custom accents replace the defaults.
    const toVec = (h) => [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
    const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
    const a1 = toVec(colors.accent), a2 = toVec(colors.accent2), ink = toVec(colors.ink);
    const custom = params.has("accent") || params.has("accent2");
    const blobs = custom
      ? [a1, a2, mix(a1, a2, 0.5), mix(a1, ink, 0.35)]
      : [toVec("6c4bff"), a1, toVec("ff9a62"), a2];

    const LOOP = 10; // seconds

    // The shader: a few soft blobs that orbit and melt into each other, plus film grain.
    const canvas = document.getElementById("glow");
    const gl = canvas.getContext("webgl", { antialias: false, premultipliedAlpha: false });
    let draw = () => {};
    if (gl) {
      const vert = `attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
      const frag = `
        precision highp float;
        uniform vec2 res;
        uniform float phase;   // 0 to 1 over one loop
        uniform float seed;    // changes every frame for the grain
        uniform vec3 base;
        uniform vec3 c[4];

        float hash(vec2 q) { return fract(sin(dot(q, vec2(12.9898, 78.233)) + seed) * 43758.5453); }

        void main() {
          float m = min(res.x, res.y);
          vec2 ext = res / m * 0.5;                 // half size of the frame in short-side units
          vec2 p = (gl_FragCoord.xy - 0.5 * res) / m;
          float a = phase * 6.2831853;

          // Gentle warp so the edges feel liquid, not round.
          p += 0.07 * vec2(sin(p.y * 3.1 + a), cos(p.x * 2.7 - a));

          vec2 o[4];
          o[0] = ext * vec2(-0.55 + 0.25 * cos(a), 0.45 + 0.2 * sin(a));
          o[1] = ext * vec2(0.55 + 0.2 * sin(a + 1.3), 0.35 + 0.25 * cos(a + 0.4));
          o[2] = ext * vec2(0.45 + 0.25 * cos(a + 2.4), -0.5 + 0.2 * sin(2.0 * a));
          o[3] = ext * vec2(-0.5 + 0.2 * sin(a + 4.0), -0.4 + 0.25 * cos(a + 3.1));

          // Paint the blobs one over another, so colours stay rich where they meet.
          float r = 0.3 + 0.2 * max(ext.x, ext.y);
          vec3 col = base;
          for (int i = 0; i < 4; i++) {
            vec2 d = p - o[i];
            col = mix(col, c[i], 0.92 * exp(-dot(d, d) / (r * r)));
          }

          // Soft darkening at the edges, then grain.
          vec2 uv = gl_FragCoord.xy / res - 0.5;
          col *= 1.0 - 0.35 * dot(uv, uv);
          col += (hash(gl_FragCoord.xy) - 0.5) * 0.07;
          gl_FragColor = vec4(col, 1.0);
        }`;
      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const u = (name) => gl.getUniformLocation(prog, name);
      gl.uniform3fv(u("base"), toVec(colors.bg));
      gl.uniform3fv(u("c"), blobs.flat());
      const uRes = u("res"), uPhase = u("phase"), uSeed = u("seed");
      draw = (t) => {
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uPhase, t / LOOP);
        gl.uniform1f(uSeed, (t * 7.31) % 10);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(innerWidth * dpr);
      canvas.height = Math.round(innerHeight * dpr);
      if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
      fit();
    }

    // Largest size that keeps each line inside the frame (it may wrap onto two rows).
    function fit() {
      const w = innerWidth, h = innerHeight;
      for (const el of lineEls) {
        el.style.width = `${w * 0.84}px`;
        let size = Math.min(w, h) * 0.19;
        el.style.fontSize = `${size}px`;
        while (size > 8 && (el.scrollWidth > w * 0.84 + 1 || el.scrollHeight > h * 0.7)) {
          size *= 0.93;
          el.style.fontSize = `${size}px`;
        }
      }
    }

    const ease = (x) => x * x * (3 - 2 * x);
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    // Each line: blur in, hold, blur out. Times in seconds within the loop.
    const windows = [[0.3, 4.6], [5.2, 9.6]];

    function paintText(t) {
      const unit = Math.min(innerWidth, innerHeight);
      lineEls.forEach((el, i) => {
        const [start, end] = windows[i];
        const inP = ease(clamp01((t - start) / 1.4));
        const outP = ease(clamp01((t - (end - 0.9)) / 0.9));
        const show = inP * (1 - outP);
        const blur = (1 - inP) * unit * 0.045 + outP * unit * 0.03;
        const rise = (1 - inP) * 0.12 - outP * 0.06;
        el.style.opacity = show.toFixed(3);
        el.style.filter = blur > 0.2 ? `blur(${blur.toFixed(1)}px)` : "none";
        el.style.transform = `translateY(${(rise * 1).toFixed(3)}em) scale(${(1.04 - 0.04 * inP + 0.02 * outP).toFixed(4)})`;
        el.style.letterSpacing = `${(-0.035 + (1 - inP) * 0.05).toFixed(4)}em`;
      });
    }

    let frame = 0, startAt = performance.now();
    function loop(now) {
      const t = (((now - startAt) / 1000) % LOOP + LOOP) % LOOP;
      draw(t);
      paintText(t);
      frame = requestAnimationFrame(loop);
    }

    // Reduced motion: one calm still frame with the first line in place.
    const STILL = 3;
    function still() {
      cancelAnimationFrame(frame);
      frame = 0;
      draw(STILL);
      paintText(STILL);
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function apply() {
      if (reduce.matches) still();
      else if (!frame) frame = requestAnimationFrame(loop);
    }
    reduce.addEventListener("change", apply);
    window.addEventListener("resize", () => {
      resize();
      if (reduce.matches) still();
    });

    // Wait briefly for the font so the text is measured in the right face.
    Promise.race([
      document.fonts.load("600 1em 'Inter Tight Variable'"),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => {
      resize();
      startAt = performance.now();
      apply();
    });
    resize();
  </script>
</body>
</html>
