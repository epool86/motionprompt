<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro synthwave demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/orbitron@5.3.0/900.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=12042b&ink=e9fbff&accent=ff2bd6&accent2=2de2ff */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #12042b;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Fine scanlines and dark corners, like an old CRT */
    .crt {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse 80% 75% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }
  </style>
</head>
<body>
  <canvas id="scene" role="img"></canvas>
  <div class="crt"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => "#" + (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const colors = { bg: hex("bg", "12042b"), ink: hex("ink", "e9fbff"), accent: hex("accent", "ff2bd6"), accent2: hex("accent2", "2de2ff") };
    const text = (params.get("text") || "Night drive").trim().slice(0, 40).toUpperCase();
    const words = text.split(/\s+/).filter(Boolean);

    const canvas = document.getElementById("scene");
    canvas.setAttribute("aria-label", `An 80s synthwave scene with a neon grid, a setting sun and the words: ${text}`);
    const ctx = canvas.getContext("2d");

    const LOOP = 10; // seconds
    const FONT = '900 100px Orbitron, "Arial Black", sans-serif';

    function rand(seed) {
      let s = seed;
      return () => ((s = (s * 16807) % 2147483647) / 2147483647);
    }

    // Mix a hex colour with another, t from 0 to 1.
    function mix(a, b, t) {
      const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
      const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
      return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * t)).join(",")})`;
    }

    let w = 0, h = 0, dpr = 1, horizon = 0, sun = null, layers = null, stars = [], head = null;

    function makeCanvas(cw, ch) {
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(cw * dpr));
      c.height = Math.max(1, Math.round(ch * dpr));
      const g = c.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      return [c, g];
    }

    // ---- Layout and the parts that never change, drawn once per size ----
    function build() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth;
      h = innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      const m = Math.min(w, h);
      horizon = h * 0.62;
      const r = Math.min(w * 0.36, h * 0.27);
      sun = { x: w / 2, y: horizon - r * 0.28, r };

      // Sky with a haze near the horizon and a big soft sun glow.
      const [sky, gs] = makeCanvas(w, h);
      const skyGrad = gs.createLinearGradient(0, 0, 0, horizon);
      skyGrad.addColorStop(0, mix(colors.bg, "#000000", 0.45));
      skyGrad.addColorStop(0.55, colors.bg);
      skyGrad.addColorStop(1, mix(colors.bg, colors.accent, 0.45));
      gs.fillStyle = skyGrad;
      gs.fillRect(0, 0, w, horizon + 1);
      const glow = gs.createRadialGradient(sun.x, sun.y, r * 0.6, sun.x, sun.y, r * 2.2);
      glow.addColorStop(0, "rgba(255, 110, 90, 0.35)");
      glow.addColorStop(1, "rgba(255, 60, 140, 0)");
      gs.fillStyle = glow;
      gs.fillRect(0, 0, w, horizon);

      // The sun: yellow at the top, hot pink at the bottom.
      const [sunC, gsun] = makeCanvas(w, h);
      const sg = gsun.createLinearGradient(0, sun.y - r, 0, sun.y + r);
      sg.addColorStop(0, "#fff36b");
      sg.addColorStop(0.35, "#ffab3d");
      sg.addColorStop(0.75, "#ff4f8b");
      sg.addColorStop(1, colors.accent);
      gsun.fillStyle = sg;
      gsun.beginPath();
      gsun.arc(sun.x, sun.y, r, 0, Math.PI * 2);
      gsun.fill();

      // Wireframe mountains on both sides of the sun, a far row and a near row.
      const [mtn, gm] = makeCanvas(w, h);
      drawMountains(gm, m, 11, 0.16, 0.55, mix(colors.bg, "#000000", 0.2), colors.accent, 0.55);
      drawMountains(gm, m, 23, 0.1, 1, mix(colors.bg, "#000000", 0.5), colors.accent2, 0.85);

      // Stars in the upper sky.
      const rs = rand(5);
      const count = Math.round(Math.min(160, (w * horizon) / 1800));
      stars = Array.from({ length: count }, () => ({
        x: rs() * w,
        y: rs() * horizon * 0.85,
        s: (rs() < 0.15 ? 1.6 : 1) * Math.max(0.8, m / 400),
        speed: 1 + Math.floor(rs() * 4), // whole twinkles per loop, so it loops cleanly
        phase: rs() * Math.PI * 2,
      }));

      layers = { sky, skyGrad, sunC, mtn };
      head = buildHeadline(m);
    }

    function drawMountains(g, m, seed, height, spread, fill, line, alpha) {
      const r = rand(seed);
      const pts = [];
      const step = m * 0.07;
      const n = Math.ceil(w / step) + 2;
      for (let i = 0; i <= n; i++) {
        const x = i * step - step / 2;
        // Low near the middle so the sun shows, higher towards the edges.
        const edge = Math.min(1, Math.abs(x - w / 2) / (w * 0.5));
        const lift = Math.pow(edge, 1.3) * spread + 0.08;
        const peak = (i % 2 ? 0.55 + r() * 0.45 : 0.15 + r() * 0.3) * lift;
        pts.push([x, horizon - peak * m * height * 3]);
      }
      g.beginPath();
      g.moveTo(pts[0][0], horizon);
      for (const [x, y] of pts) g.lineTo(x, y);
      g.lineTo(pts[pts.length - 1][0], horizon);
      g.closePath();
      const fg = g.createLinearGradient(0, horizon - m * height * 2, 0, horizon);
      fg.addColorStop(0, fill);
      fg.addColorStop(1, mix(colors.bg, "#000000", 0.7));
      g.fillStyle = fg;
      g.fill();
      // Triangle wireframe: ridge line plus struts down to the base.
      g.lineWidth = Math.max(0.7, m / 700);
      g.strokeStyle = line;
      g.globalAlpha = alpha * 0.35;
      g.beginPath();
      pts.forEach(([x, y], i) => {
        const bx = x + (i % 2 ? step / 2 : -step / 2);
        g.moveTo(x, y);
        g.lineTo(bx, horizon);
        g.moveTo(x, y);
        g.lineTo((x + bx) / 2, (y + horizon) / 2);
      });
      g.stroke();
      g.globalAlpha = alpha;
      g.beginPath();
      pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
      g.stroke();
      g.globalAlpha = 1;
    }

    // ---- The chrome headline, drawn once into its own canvas ----
    function buildHeadline(m) {
      ctx.font = FONT;
      const widthOf = (s) => ctx.measureText(s).width / 100;
      // One, two or three lines: keep whichever lets the words be biggest.
      const options = [[words.join(" ")]];
      for (let a = 1; a < words.length; a++) {
        options.push([words.slice(0, a).join(" "), words.slice(a).join(" ")]);
        for (let b = a + 1; b < words.length; b++) {
          options.push([words.slice(0, a).join(" "), words.slice(a, b).join(" "), words.slice(b).join(" ")]);
        }
      }
      const maxH = sun.y - sun.r * 0.35 - h * 0.06; // from near the top down to the upper sun
      let best = null;
      for (const lines of options) {
        const ew = Math.max(...lines.map(widthOf)) * 1.12 + 0.3;
        const size = Math.min((w * 0.86) / ew, maxH / (lines.length * 1.1), m * 0.17);
        if (!best || size > best.size * 1.05) best = { lines, size };
      }
      const { lines, size } = best;
      const lh = size * 1.1;
      const pad = size * 0.5;
      const bw = Math.max(...lines.map(widthOf)) * size * 1.12 + pad * 2;
      const bh = lines.length * lh + pad * 2;
      const [c, g] = makeCanvas(bw, bh);
      g.font = FONT.replace("100px", `${size}px`);
      g.textAlign = "center";
      g.textBaseline = "middle";
      const skew = -0.2; // lean forward like 80s chrome logos
      const eachLine = (fn) => lines.forEach((line, i) => {
        g.save();
        g.translate(bw / 2, pad + lh * (i + 0.5));
        g.transform(1, 0, skew, 1, 0, 0);
        fn(line, i);
        g.restore();
      });
      // Soft pink outer glow, then a deep extruded shadow.
      const depth = Math.max(2, Math.round(size * 0.08));
      eachLine((line) => {
        g.shadowColor = colors.accent;
        g.shadowBlur = size * 0.3;
        g.globalAlpha = 0.6;
        g.fillStyle = mix(colors.accent, "#000000", 0.4);
        g.fillText(line, depth * 0.3, depth * 0.5);
        g.shadowBlur = 0;
        g.globalAlpha = 1;
        g.fillStyle = mix(colors.accent, "#000000", 0.6);
        for (let d = depth; d > 0; d--) g.fillText(line, d * 0.6, d);
      });
      // Chrome: bright sky on top, a dark horizon line through the middle, warm light below.
      eachLine((line) => {
        const cg = g.createLinearGradient(0, -size * 0.42, 0, size * 0.42);
        cg.addColorStop(0, colors.ink);
        cg.addColorStop(0.46, mix(colors.accent2, "#3a6bff", 0.35));
        cg.addColorStop(0.5, mix(colors.bg, "#000000", 0.3));
        cg.addColorStop(0.56, "#6a2c8a");
        cg.addColorStop(0.8, "#ff9ad5");
        cg.addColorStop(1, "#fff2e0");
        g.fillStyle = cg;
        g.fillText(line, 0, 0);
        g.lineWidth = Math.max(1, size * 0.025);
        g.strokeStyle = "rgba(255, 255, 255, 0.85)";
        g.strokeText(line, 0, 0);
      });
      // Tinted copies for the VHS colour bleed.
      const tint = (color) => {
        const [tc, tg] = makeCanvas(bw, bh);
        tg.setTransform(1, 0, 0, 1, 0, 0);
        tg.drawImage(c, 0, 0);
        tg.globalCompositeOperation = "source-in";
        tg.fillStyle = color;
        tg.fillRect(0, 0, tc.width, tc.height);
        return tc;
      };
      // Sit the words just over the top of the sun, but never too close to the top edge.
      const textH = lines.length * lh;
      const y = Math.max(h * 0.06 + textH / 2, sun.y - sun.r * 0.7 - textH / 2);
      return { c, red: tint("#ff2a55"), cyan: tint(colors.accent2), w: bw, h: bh, x: w / 2 - bw / 2, y: y - bh / 2, size };
    }

    // ---- One frame at time t (seconds) ----
    function draw(t, calm) {
      const m = Math.min(w, h);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(layers.sky, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Stars twinkle a whole number of times per loop.
      ctx.fillStyle = colors.ink;
      for (const s of stars) {
        ctx.globalAlpha = calm ? 0.7 : 0.35 + 0.65 * (0.5 + 0.5 * Math.sin((t / LOOP) * Math.PI * 2 * s.speed + s.phase));
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }
      ctx.globalAlpha = 1;

      // Sun, with stripes that slide down and grow thicker towards the bottom.
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(layers.sunC, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.save();
      ctx.beginPath();
      ctx.arc(sun.x, sun.y, sun.r + 1, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = layers.skyGrad;
      const bands = 8;
      const drift = (t / LOOP) % 1;
      for (let i = -1; i < bands; i++) {
        const k = (i + drift) / bands; // 0 at the sun middle, 1 at the bottom
        if (k < 0) continue;
        const y = sun.y - sun.r * 0.4 + k * sun.r * 1.4;
        const thick = sun.r * (0.012 + 0.1 * k);
        ctx.fillRect(sun.x - sun.r - 1, y, sun.r * 2 + 2, thick);
      }
      ctx.restore();

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(layers.mtn, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      drawFloor(t, m);
      drawHeadline(t, calm);
      if (!calm) drawTracking(t, m);
    }

    function drawFloor(t, m) {
      const floorH = h - horizon;
      const fg = ctx.createLinearGradient(0, horizon, 0, h);
      fg.addColorStop(0, mix(colors.bg, colors.accent, 0.2));
      fg.addColorStop(0.3, mix(colors.bg, "#000000", 0.4));
      fg.addColorStop(1, mix(colors.bg, "#000000", 0.75));
      ctx.fillStyle = fg;
      ctx.fillRect(0, horizon, w, floorH);

      // Rows come towards us: depth z maps to y = horizon + floorH / z.
      const phase = ((t / LOOP) * 20) % 1; // 20 rows pass per loop
      const spacing = 0.35;
      ctx.beginPath();
      for (let k = 0; k < 60; k++) {
        const z = 0.9 + (k + 1 - phase) * spacing;
        const y = horizon + floorH / z;
        if (y - horizon < 1.5) break;
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
      }
      // Columns fan out from the vanishing point.
      const gap = m * 0.16;
      const reach = Math.ceil(w / 2 / (gap * 0.12));
      for (let i = -reach; i <= reach; i++) {
        ctx.moveTo(w / 2, horizon);
        ctx.lineTo(w / 2 + i * gap * 1.6, h + floorH * 0.6);
      }
      const lw = Math.max(0.8, m / 420);
      ctx.strokeStyle = colors.accent;
      ctx.globalAlpha = 0.25;
      ctx.lineWidth = lw * 3.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.lineWidth = lw;
      ctx.strokeStyle = mix(colors.accent, "#ffffff", 0.35);
      ctx.stroke();

      // Haze over the far grid so it melts into the horizon.
      const haze = ctx.createLinearGradient(0, horizon, 0, horizon + floorH * 0.45);
      haze.addColorStop(0, mix(colors.bg, colors.accent, 0.35));
      haze.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = haze;
      ctx.fillRect(0, horizon, w, floorH * 0.45);
      // A bright line where the floor meets the sky.
      ctx.fillStyle = mix(colors.accent, "#ffffff", 0.5);
      ctx.fillRect(0, horizon - lw / 2, w, lw);
    }

    function drawHeadline(t, calm) {
      const { c, red, cyan, x, y, w: bw, h: bh, size } = head;
      // Slight VHS colour bleed: red to the left, cyan to the right.
      let bleed = size * 0.035;
      let jitter = 0;
      if (!calm) {
        const band = trackingY(t);
        if (band !== null && Math.abs(band - (y + bh / 2)) < bh * 0.7) {
          jitter = size * 0.05 * Math.sin(t * 90);
          bleed *= 2;
        }
      }
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.45;
      ctx.drawImage(red, x - bleed + jitter, y, bw, bh);
      ctx.drawImage(cyan, x + bleed + jitter, y, bw, bh);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.drawImage(c, x + jitter, y, bw, bh);
    }

    // A tape tracking band rolls down the frame once per loop.
    function trackingY(t) {
      const start = 6.2, length = 1.6;
      if (t < start || t > start + length) return null;
      return ((t - start) / length) * (h * 1.2) - h * 0.1;
    }

    function drawTracking(t, m) {
      const y = trackingY(t);
      if (y === null) return;
      const bandH = Math.max(6, m * 0.05);
      const r = rand(Math.floor(t * 30) + 1);
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = colors.ink;
      ctx.fillRect(0, y, w, bandH);
      ctx.globalAlpha = 0.35;
      for (let i = 0; i < 14; i++) {
        ctx.fillRect(r() * w, y + r() * bandH, r() * w * 0.25, 1);
      }
      ctx.globalAlpha = 1;
    }

    // ---- Run ----
    let frame = 0, start = 0, last = 0;
    function loop(now) {
      if (!start) start = now;
      draw(((now - start) / 1000) % LOOP, false);
      last = now; // the sound reads this frame time
      frame = requestAnimationFrame(loop);
    }

    // Reduced motion: one still frame, no tape wobble.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function apply() {
      cancelAnimationFrame(frame);
      frame = 0;
      if (reduce.matches) draw(2, true);
      else {
        start = 0;
        frame = requestAnimationFrame(loop);
      }
    }

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        build();
        if (reduce.matches) draw(2, true);
      }, 100);
    });
    reduce.addEventListener("change", apply);

    // ---- Sound: off until the page asks for it. Every sound is made here with Web Audio, no files. ----
    // o.clock() gives { t, p }: animation seconds t (not wrapped) that were true at performance time p (ms),
    // or null while the animation is stopped. o.plan() lists one loop of { t, type, music, dur, long }.
    // o.voices[type](when, e, A, skip) makes one sound. o.setup(A) can add extra nodes to each session
    // and set A.stop to end them.
    function makeSound(o) {
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      const LOOK = 0.1;
      let ctx = null, A = null, impulse = null, noiseBuf = null, master = null;
      let events = [], loopLen = 1;
      let wantOn = false, wantMusic = true, timer = 0, sleepTimer = 0;
      let animOff = null, outOff = null, done = null, longs = [];

      function build() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const sr = ctx.sampleRate;
        // Compressor last, so nothing clips.
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = o.level;
        master.connect(comp).connect(ctx.destination);
        // White noise, and a reverb impulse made of stereo noise that fades away.
        noiseBuf = ctx.createBuffer(1, sr * 2, sr);
        const n = noiseBuf.getChannelData(0);
        for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;
        const len = Math.floor(sr * (o.verbTime || 1.6));
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5);
        }
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        if (out) g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const s = ctx.createOscillator();
        s.type = type;
        s.frequency.setValueAtTime(freq, when);
        s.start(when);
        s.stop(when + dur + 0.05);
        return s;
      }
      function noise(when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

      // Each switch on gets fresh buses, so sounds booked before a switch off never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        const out = ctx.createGain();
        out.gain.setValueAtTime(0, t);
        out.gain.linearRampToValueAtTime(1, t + 0.05);
        out.connect(master);
        const fx = ctx.createGain();
        fx.connect(out);
        // Music gate: music:false fades this to zero, with the music's own reverb.
        const gate = ctx.createGain();
        gate.gain.value = wantMusic ? o.music : 0;
        gate.connect(out);
        const mus = ctx.createGain();
        mus.connect(gate);
        const verb = (dest) => {
          const c = ctx.createConvolver();
          c.buffer = impulse;
          const tone = filter("lowpass", 4000);
          const input = ctx.createGain();
          input.connect(c).connect(tone).connect(dest);
          return input;
        };
        const fxVerb = verb(fx), musVerb = verb(mus);
        longs = [];
        A = {
          ctx, out, fx, mus, gate, fxVerb, musVerb, amp, osc, noise, filter, pan, hz,
          // Reverb sends, one for effects and one for music.
          send(node, amount) { const g = ctx.createGain(); g.gain.value = amount; node.connect(g).connect(fxVerb); },
          msend(node, amount) { const g = ctx.createGain(); g.gain.value = amount; node.connect(g).connect(musVerb); },
        };
        if (o.setup) o.setup(A);
      }
      function closeSession() {
        const S = A, old = A.out, t = ctx.currentTime;
        A = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => {
          old.disconnect();
          if (S.stop) S.stop(); // stop any steady sources the session started (like an LFO)
        }, 300);
      }

      // AudioContext time for a performance time (seconds), using the output clock when there is one.
      function outputOffset() {
        const pnow = performance.now();
        const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
        let raw;
        if (ts && ts.contextTime > 0 && ts.performanceTime > 0 && Math.abs(pnow - ts.performanceTime) < 1000) {
          raw = ts.contextTime - ts.performanceTime / 1000;
        } else {
          raw = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0) - pnow / 1000;
        }
        if (outOff === null || Math.abs(raw - outOff) > 0.04) outOff = raw;
        else outOff += (raw - outOff) * 0.1;
        return outOff;
      }

      function play(e, when, skip = 0) {
        if (e.music && !wantMusic) return;
        if (!e.long) return o.voices[e.type](when, e, A, skip);
        // Long sounds get their own faders, so a resync can fade them out before starting them again.
        const f = ctx.createGain(), fs = ctx.createGain();
        f.connect(e.music ? A.mus : A.fx);
        fs.connect(e.music ? A.musVerb : A.fxVerb);
        const view = Object.create(A);
        view.fx = view.mus = f;
        view.send = view.msend = (node, amount) => { const g = ctx.createGain(); g.gain.value = amount; node.connect(g).connect(fs); };
        o.voices[e.type](when, e, view, skip);
        longs = longs.filter((x) => x.end > ctx.currentTime);
        longs.push({ faders: [f, fs], end: when + e.dur - skip + 1, music: !!e.music });
      }
      function fadeLongs(musicOnly) {
        const t = ctx.currentTime;
        for (const x of longs) {
          if (musicOnly && !x.music) continue;
          for (const g of x.faders) {
            g.gain.setValueAtTime(1, t);
            g.gain.linearRampToValueAtTime(0, t + 0.08);
          }
        }
        longs = longs.filter((x) => musicOnly && !x.music);
      }

      // Long sounds already under way (a hum, a pad) start part way through, so they do not wait a loop.
      function catchUp(now, musicOnly) {
        const lt = ((now % loopLen) + loopLen) % loopLen;
        for (const e of events) {
          if (!e.long || (musicOnly && !e.music)) continue;
          if (lt > e.t + 0.02 && lt < e.t + e.dur - 0.15) play(e, ctx.currentTime + 0.02, lt - e.t);
        }
      }

      // Look-ahead scheduler: every 25 ms, book the sounds due in the next 100 ms of animation time.
      function tick() {
        const c = A && ctx.state === "running" && !document.hidden && !reduce.matches ? o.clock() : null;
        if (!c) { done = null; return; }
        const raw = c.p / 1000 - c.t;
        if (animOff === null || Math.abs(raw - animOff) > 0.08) { animOff = raw; done = null; }
        else animOff += (raw - animOff) * 0.05;
        const off = outputOffset();
        const now = performance.now() / 1000 - animOff;
        if (done === null) {
          // Start or resume: pick up from now, skip anything missed (no burst).
          done = now;
          fadeLongs(false);
          catchUp(now, false);
        }
        const to = now + LOOK;
        if (to <= done) return;
        for (let k = Math.floor(done / loopLen); k * loopLen < to; k++) {
          for (const e of events) {
            const at = k * loopLen + e.t;
            if (at >= done && at < to) play(e, Math.max(ctx.currentTime, at + animOff + off));
          }
        }
        done = to;
      }

      function update() {
        const on = wantOn && !reduce.matches;
        if (on) {
          if (!ctx) build();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!A) {
            openSession();
            done = null;
            animOff = null;
            outOff = null;
          }
          if (!timer) timer = setInterval(tick, 25);
          tick();
        } else if (ctx) {
          clearInterval(timer);
          timer = 0;
          done = null;
          if (A) closeSession();
          clearTimeout(sleepTimer);
          sleepTimer = setTimeout(() => {
            if (!(wantOn && !reduce.matches)) ctx.suspend().catch(() => {});
          }, 220);
        }
      }

      function setMusic(on) {
        if (on === wantMusic) return;
        wantMusic = on;
        if (!A) return;
        const g = A.gate.gain, t = ctx.currentTime;
        g.cancelScheduledValues(t);
        g.setValueAtTime(g.value, t);
        g.linearRampToValueAtTime(on ? o.music : 0, t + 0.12);
        if (on && done !== null) {
          fadeLongs(true);
          catchUp(done - LOOK, true);
        }
      }

      // Call again whenever the animation is rebuilt (new size, new text).
      function replan() {
        loopLen = o.loopLen();
        events = o.plan().sort((a, b) => a.t - b.t);
        done = null;
      }

      // Browsers may block audio until a click or key press: resume then.
      const unlock = () => {
        if (ctx && wantOn && !reduce.matches && ctx.state !== "running") ctx.resume().catch(() => {});
      };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);
      reduce.addEventListener("change", update);
      addEventListener("message", (event) => {
        const d = event.data;
        if (event.origin !== location.origin || !d || d.type !== "motionprompt-sound") return;
        if (typeof d.music === "boolean") setMusic(d.music);
        if (typeof d.on === "boolean") wantOn = d.on;
        update();
      });
      const fromUrl = new URLSearchParams(location.search).get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantOn = true;
        wantMusic = fromUrl === "1";
      }

      return { replan, start: update };
    }

    // The sound follows the same clock as the picture: loop time = (frame time - start) / 1000.
    // 120 bpm: one beat for every grid row that passes (20 rows, 20 beats, 5 bars per 10 s loop).
    const BEAT = LOOP / 20;
    const sound = makeSound({
      level: 1,
      music: 0.15,
      clock: () => (frame && last && performance.now() - last < 250 ? { t: (last - start) / 1000, p: last } : null),
      loopLen: () => LOOP,
      setup(A) {
        const { ctx } = A;
        // Tape: the music runs through a tiny delay line whose time can wobble (pitch warble),
        // and a gain that can flutter, both still until the tracking band rolls by.
        const tape = ctx.createDelay(0.05);
        tape.delayTime.value = 0.003;
        const flut = ctx.createGain();
        A.mus.disconnect();
        A.mus.connect(tape).connect(flut).connect(A.gate);
        const lfo = ctx.createOscillator();
        lfo.frequency.value = 5.5;
        A.wow = ctx.createGain();
        A.wow.gain.value = 0;
        lfo.connect(A.wow).connect(tape.delayTime);
        const fl = ctx.createOscillator();
        fl.frequency.value = 90 / (2 * Math.PI); // same speed as the headline wobble
        A.flutter = ctx.createGain();
        A.flutter.gain.value = 0;
        fl.connect(A.flutter).connect(flut.gain);
        lfo.start();
        fl.start();
        // Dotted eighth echo for the arpeggio.
        A.echo = ctx.createGain();
        const d = ctx.createDelay(1);
        d.delayTime.value = BEAT * 0.75;
        const fb = ctx.createGain();
        fb.gain.value = 0.35;
        const tone = A.filter("lowpass", 2600);
        A.echo.connect(d).connect(tone).connect(fb).connect(d);
        const wet = ctx.createGain();
        wet.gain.value = 0.5;
        tone.connect(wet).connect(A.mus);
        // Gated reverb for the 80s snare: the tail is cut short on each hit.
        A.gverb = ctx.createGain();
        const cv = ctx.createConvolver();
        const len = Math.floor(ctx.sampleRate * 0.5);
        const ir = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let c = 0; c < 2; c++) {
          const x = ir.getChannelData(c);
          for (let i = 0; i < len; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / len);
        }
        cv.buffer = ir;
        A.gate80 = ctx.createGain();
        A.gate80.gain.value = 0;
        A.gverb.connect(cv).connect(A.gate80).connect(A.mus);
        A.stop = () => { lfo.stop(); fl.stop(); };
      },
      plan() {
        const list = [];
        // Deep road rush: swells as each grid row sweeps under the camera (a row leaves the
        // bottom of the frame about 0.36 s into its 0.5 s cycle).
        list.push({ t: 0.46, type: "rush", dur: LOOP, long: true });
        // Bright synth sting on the chrome title at the top of each loop.
        list.push({ t: 0, type: "sting" });
        // Tape tracking warble while the band rolls down (6.2 s to 7.8 s).
        list.push({ t: 6.2, type: "warble", dur: 1.6 });

        // Music: Am F C G E, one bar each.
        const bars = [
          [33, [57, 60, 64], [69, 72, 76]],
          [29, [57, 60, 65], [69, 72, 77]],
          [36, [55, 60, 64], [67, 72, 76]],
          [31, [55, 59, 62], [67, 71, 74]],
          [28, [56, 59, 64], [68, 71, 76]],
        ];
        const arp = [0, 1, 2, 1, 0, 1, 2, 3];
        bars.forEach(([root, pad, tones], b) => {
          const t0 = b * 4 * BEAT;
          list.push({ t: t0, type: "pad", notes: pad, dur: 4 * BEAT, long: true, music: true });
          for (let k = 0; k < 4; k++) {
            const tb = t0 + k * BEAT;
            if (k % 2 === 0) list.push({ t: tb, type: "kick", music: true });
            else list.push({ t: tb, type: "snare", music: true });
            for (let s = 0; s < 4; s++) {
              list.push({ t: tb + (s * BEAT) / 4, type: "bass", m: root + (s === 2 ? 12 : 0), v: s === 0 ? 1 : 0.75, music: true });
              list.push({ t: tb + (s * BEAT) / 4, type: "hat", v: s === 2 ? 1 : s === 0 ? 0.35 : 0.5, music: true });
            }
          }
          for (let s = 0; s < 8; s++) {
            const i = arp[s];
            const m = i === 3 ? tones[0] + 12 : tones[i];
            list.push({ t: t0 + (s * BEAT) / 2, type: "arp", m, music: true });
          }
        });
        return list;
      },
      voices: {
        rush(when, e, A, skip = 0) {
          const { ctx } = A;
          const end = when + e.dur - skip;
          const g = ctx.createGain();
          const lp = A.filter("lowpass", 200, 0.9);
          const base = 0.07, top = 0.26;
          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(base, when + 0.03);
          lp.frequency.setValueAtTime(200, when);
          // Starts at a low point (0.46 s into a row cycle) and peaks 0.4 s later, as the row passes.
          for (let k = 0; k < 20; k++) {
            const up = k * BEAT + 0.4, down = (k + 1) * BEAT;
            if (up > skip + 0.03) {
              g.gain.linearRampToValueAtTime(top, when + up - skip);
              lp.frequency.linearRampToValueAtTime(520, when + up - skip);
            }
            if (down > skip + 0.03) {
              g.gain.linearRampToValueAtTime(base, when + down - skip);
              lp.frequency.linearRampToValueAtTime(200, when + down - skip);
            }
          }
          g.gain.setValueAtTime(base, end);
          g.gain.linearRampToValueAtTime(0.0001, end + 0.03);
          const n = A.noise(when, end - when + 0.03);
          n.connect(lp).connect(g).connect(A.fx);
          // A little air on top.
          const air = ctx.createGain();
          air.gain.value = 0.18;
          n.connect(A.filter("bandpass", 900, 0.8)).connect(air).connect(g);
        },
        sting(when, e, A) {
          const { ctx } = A;
          const out = ctx.createGain();
          out.gain.setValueAtTime(0.0001, when);
          out.gain.exponentialRampToValueAtTime(0.28, when + 0.012);
          out.gain.exponentialRampToValueAtTime(0.1, when + 0.35);
          out.gain.exponentialRampToValueAtTime(0.0001, when + 1.5);
          const lp = A.filter("lowpass", 900, 2);
          lp.frequency.setValueAtTime(900, when);
          lp.frequency.exponentialRampToValueAtTime(7000, when + 0.06);
          lp.frequency.exponentialRampToValueAtTime(1800, when + 0.8);
          lp.connect(out).connect(A.fx);
          [64, 69, 72, 76, 81, 83].forEach((m, i) => {
            for (const det of [-9, 9]) {
              const s = A.osc("sawtooth", A.hz(m), when, 1.5);
              s.detune.value = det;
              const v = ctx.createGain();
              v.gain.value = 0.12;
              s.connect(v).connect(A.pan((det > 0 ? 0.35 : -0.35) * (i % 2 ? 1 : 0.6), lp));
            }
          });
          // A glassy bell on top for the chrome shine.
          const bell = A.osc("triangle", A.hz(93), when, 1.2);
          bell.connect(A.amp(when, 0.08, 0.004, 1.1, A.fx));
          A.send(out, 0.6);
        },
        warble(when, e, A) {
          const { ctx } = A;
          const end = when + e.dur;
          // Music pitch wobbles and flutters like a stretched tape.
          A.wow.gain.setValueAtTime(0, when);
          A.wow.gain.linearRampToValueAtTime(0.00045, when + 0.25);
          A.wow.gain.setValueAtTime(0.00045, end - 0.3);
          A.wow.gain.linearRampToValueAtTime(0, end);
          A.flutter.gain.setValueAtTime(0, when);
          A.flutter.gain.linearRampToValueAtTime(0.25, when + 0.2);
          A.flutter.gain.setValueAtTime(0.25, end - 0.25);
          A.flutter.gain.linearRampToValueAtTime(0, end);
          // Tape hiss with a crackly edge, strongest while the band crosses the middle.
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(0.06, when + 0.3);
          g.gain.linearRampToValueAtTime(0.09, when + e.dur * 0.5);
          g.gain.linearRampToValueAtTime(0.0001, end);
          const r = rand(41);
          const chop = ctx.createGain();
          for (let x = 0; x < e.dur; x += 0.035) chop.gain.setValueAtTime(0.35 + r() * 0.65, when + x);
          const bp = A.filter("bandpass", 2600, 0.7);
          bp.frequency.setValueAtTime(1600, when);
          bp.frequency.linearRampToValueAtTime(4200, end);
          A.noise(when, e.dur).connect(bp).connect(chop).connect(g).connect(A.pan(0, A.fx));
          // A low tape chirp as the band starts and as it leaves.
          for (const [at, f0, f1] of [[when, 900, 300], [end - 0.2, 300, 1100]]) {
            const s = A.osc("sine", f0, at, 0.2);
            s.frequency.exponentialRampToValueAtTime(f1, at + 0.18);
            s.connect(A.amp(at, 0.05, 0.02, 0.16, A.fx));
          }
        },
        kick(when, e, A) {
          const s = A.osc("sine", 150, when, 0.4);
          s.frequency.exponentialRampToValueAtTime(44, when + 0.1);
          s.connect(A.amp(when, 0.85, 0.002, 0.34, A.mus));
          A.noise(when, 0.02).connect(A.filter("highpass", 3000)).connect(A.amp(when, 0.12, 0.001, 0.012, A.mus));
        },
        snare(when, e, A) {
          const body = A.amp(when, 0.42, 0.002, 0.16, A.mus);
          A.noise(when, 0.2).connect(A.filter("bandpass", 1900, 0.7)).connect(body);
          A.osc("triangle", 190, when, 0.1).connect(A.amp(when, 0.25, 0.002, 0.08, A.mus));
          // Big gated reverb: open on the hit, slam shut 0.3 s later.
          const s = A.ctx.createGain();
          s.gain.value = 1.4;
          body.connect(s).connect(A.gverb);
          A.gate80.gain.setValueAtTime(1, when);
          A.gate80.gain.setValueAtTime(1, when + 0.26);
          A.gate80.gain.linearRampToValueAtTime(0, when + 0.3);
        },
        hat(when, e, A) {
          A.noise(when, 0.05).connect(A.filter("highpass", 8000)).connect(A.amp(when, 0.1 * e.v, 0.001, 0.035, A.pan(0.25, A.mus)));
        },
        bass(when, e, A) {
          const f = A.hz(e.m);
          const lp = A.filter("lowpass", 1400, 4);
          lp.frequency.setValueAtTime(1400, when);
          lp.frequency.exponentialRampToValueAtTime(260, when + 0.1);
          lp.connect(A.amp(when, 0.3 * e.v, 0.003, 0.11, A.mus));
          A.osc("sawtooth", f, when, 0.12).connect(lp);
          const s2 = A.osc("sawtooth", f, when, 0.12);
          s2.detune.value = 7;
          s2.connect(lp);
        },
        pad(when, e, A, skip = 0) {
          const { ctx } = A;
          const dur = e.dur - skip;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(0.09, when + Math.min(0.35, dur / 3));
          g.gain.setValueAtTime(0.09, when + dur - 0.15);
          g.gain.linearRampToValueAtTime(0.0001, when + dur + 0.1);
          const lp = A.filter("lowpass", 1500);
          lp.connect(g).connect(A.mus);
          e.notes.forEach((m, i) => {
            for (const det of [-11, 11]) {
              const s = A.osc("sawtooth", A.hz(m), when, dur + 0.1);
              s.detune.value = det + i;
              s.connect(A.pan(det > 0 ? 0.5 : -0.5, lp));
            }
          });
          A.msend(g, 0.5);
        },
        arp(when, e, A) {
          const out = A.amp(when, 0.07, 0.003, 0.2, null);
          out.connect(A.filter("lowpass", 3000)).connect(A.pan(-0.15, A.mus));
          A.osc("square", A.hz(e.m), when, 0.22).connect(out);
          out.connect(A.echo);
        },
      },
    });

    // Wait briefly for the font so the headline is drawn in the right face.
    Promise.race([
      document.fonts.load(FONT),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => {
      build();
      apply();
      sound.replan();
      sound.start();
    });
  </script>
</body>
</html>
