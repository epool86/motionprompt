<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watercolour ink demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/kaushan-script@5.3.0/latin-400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.3.0/latin-500-italic.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.3.0/latin-600.css">
  <style>
    /* Colours can be set from the URL: ?text=Headline|Small+line&bg=f3ede0&ink=26314d&accent=c67b86&accent2=cda45e */
    :root {
      --paper: #f3ede0;
      --ink: #26314d;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--paper);
    }

    canvas.layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Ink sits in the paper, so it multiplies with the washes below it. */
    #ink,
    .title {
      mix-blend-mode: multiply;
    }

    .title {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--ink);
    }

    .title h1 {
      margin: 0;
      font-family: "Kaushan Script", "Brush Script MT", cursive;
      font-weight: 400;
      line-height: 1.2;
      text-wrap: balance;
    }

    .word {
      display: inline-block;
      white-space: nowrap;
    }

    /* Each letter is painted in with a soft moving mask. Padding keeps the swashes inside the mask. */
    .letter {
      display: inline-block;
      padding: 0.12em 0.14em;
      margin: -0.12em -0.14em;
      -webkit-mask-image: linear-gradient(100deg, #000 40%, transparent 60%);
      mask-image: linear-gradient(100deg, #000 40%, transparent 60%);
      -webkit-mask-size: 250% 100%;
      mask-size: 250% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    .seal {
      display: inline-block;
      width: 0.52em;
      height: 0.52em;
      margin-left: 0.22em;
      vertical-align: 0.1em;
    }

    .sub {
      margin: 0.35em 0 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.2;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" role="img">
    <canvas class="layer" id="wash"></canvas>
    <canvas class="layer" id="ink"></canvas>
    <div class="title" id="title">
      <h1 id="headline"></h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const colors = { paper: hex("bg", "f3ede0"), ink: hex("ink", "26314d"), rose: hex("accent", "c67b86"), ochre: hex("accent2", "cda45e") };
    const root = document.documentElement;
    root.style.setProperty("--paper", `#${colors.paper}`);
    root.style.setProperty("--ink", `#${colors.ink}`);

    // Headline and small line: split the text on "|", or use the defaults.
    const text = (params.get("text") || "Let it bloom|Ink, water and a little time").slice(0, 90);
    const [headText, subText = ""] = text.split("|").map((s) => s.trim());

    const stage = document.getElementById("stage");
    stage.setAttribute("aria-label", `Watercolour washes bloom on paper and an ink plum branch paints itself beside the words: ${headText}`);

    const LOOP = 12; // seconds
    const toVec = (h) => [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
    const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
    const clamp01 = (x) => Math.min(1, Math.max(0, x));
    const ease = (x) => x * x * (3 - 2 * x);
    const easeOut = (x) => 1 - Math.pow(1 - x, 3);

    const paper = toVec(colors.paper), inkV = toVec(colors.ink);
    const rose = toVec(colors.rose), ochre = toVec(colors.ochre);
    const indigo = params.has("ink") ? mix(inkV, [1, 1, 1], 0.3) : toVec("6377ad");
    const inkRgb = inkV.map((v) => Math.round(v * 255 * 0.8)).join(",");
    const roseRgb = rose.map((v) => Math.round(v * 255)).join(",");

    // Small seeded random numbers, so every loop paints the same strokes.
    function rng(seed) {
      return () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }
    const hash1 = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
    const noise1 = (x) => { const i = Math.floor(x), f = x - i; return hash1(i) + (hash1(i + 1) - hash1(i)) * f * f * (3 - 2 * f); };

    // ---------- Layout ----------
    // Portrait and square: branch across the top, words below. Wide: branch on the right, words on the left.
    let W = 0, H = 0, L = null;
    function layout() {
      W = innerWidth; H = innerHeight;
      const wide = W / H > 1.25;
      if (wide) {
        const S = Math.min(H * 1.12, W * 0.6);
        L = { wide, S, bx: W - S * 1.02, by: -S * 0.02, title: { x: W * 0.05, y: H * 0.14, w: W * 0.55, h: H * 0.72 } };
      } else {
        const S = Math.min(W * 1.22, H * 0.9);
        const top = Math.max(S * 0.46, H * 0.36);
        L = { wide, S, bx: W - S * 1.0, by: -S * 0.01, title: { x: W * 0.07, y: top, w: W * 0.86, h: (H - top) * 0.9 } };
      }
    }

    // ---------- Paper and washes (WebGL) ----------
    const washCanvas = document.getElementById("wash");
    const gl = washCanvas.getContext("webgl", { antialias: false });
    let drawWash = () => {};
    let setWashes = () => {};
    if (gl) {
      const vert = `attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
      const frag = `
        precision highp float;
        uniform vec2 res;
        uniform float t;       // seconds into the loop
        uniform float fade;    // 1 while painted, 0 when the page is clean
        uniform vec3 paper;
        uniform vec4 W[6];     // centre xy, size, start time
        uniform vec4 S[6];     // angle, stretch, strength, seed
        uniform vec3 C[6];     // pigment colour
        uniform vec4 keep;     // soft area kept lighter behind the words: centre xy, radius xy

        float hash(vec2 q) { q = fract(q * vec2(123.34, 456.21)); q += dot(q, q + 45.32); return fract(q.x * q.y); }
        float noise(vec2 x) {
          vec2 i = floor(x), f = fract(x);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        float fbm(vec2 x) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 4; i++) { v += a * noise(x); x = mat2(0.8, 0.6, -0.6, 0.8) * x * 2.03 + 17.1; a *= 0.5; }
          return v;
        }
        float tooth(vec2 p) { return 0.6 * noise(p * 70.0) + 0.4 * noise(p * 170.0 + 3.0); }

        void main() {
          float m = min(res.x, res.y);
          vec2 p = (gl_FragCoord.xy - 0.5 * res) / m;

          // Cold press paper: small bumps lit from the top left.
          float h = tooth(p);
          float h2 = tooth(p + vec2(0.003, -0.003));
          vec3 col = paper * (1.0 + (h - h2) * 0.075 + (h - 0.5) * 0.018);

          // Shared soft noise that makes every wash edge wander like water.
          float n1 = fbm(p * 2.3), n2 = fbm(p * 2.3 + vec2(5.2, 1.3));
          vec2 warp = vec2(n1, n2) - 0.5;
          float fine = noise(p * 13.0);
          vec2 kq = (p - keep.xy) / keep.zw;
          float reserve = mix(0.3, 1.0, smoothstep(0.5, 1.3, length(kq)));

          for (int i = 0; i < 6; i++) {
            float age = t - W[i].w;
            if (age <= 0.0) continue;
            float R = W[i].z;
            // Blooms fast while wet, then creeps and dries.
            float grow = 1.0 - exp(-age * 1.15);
            float r = R * (0.1 + 0.9 * grow + 0.01 * age);
            vec2 q = p - W[i].xy + warp * R * 0.7;
            float ca = cos(S[i].x), sa = sin(S[i].x);
            q = mat2(ca, sa, -sa, ca) * q;
            q.x /= S[i].y;
            float lump = noise(p * 4.5 / R * 0.35 + S[i].w * 7.0);
            float d = length(q) - r + R * 0.3 * (lump - 0.5) + R * 0.07 * (fine - 0.5);
            float dry = smoothstep(0.0, 4.0, age);
            float soft = R * mix(0.16, 0.012, dry) + 0.002;
            float inside = smoothstep(soft, -soft, d);
            // Pigment gathers at the drying edge.
            float ring = exp(-pow(max(-d, 0.0) / (R * 0.07 + 0.004), 2.0)) * inside;
            float body = mix(n1, n2, fract(S[i].w * 3.7));
            float dens = inside * (0.42 + 0.55 * (body - 0.3)) + ring * 0.5 * dry;
            // Granulation: pigment settles in the dips of the paper.
            dens *= 1.0 + 0.6 * (0.5 - h) + 0.12 * (noise(gl_FragCoord.xy * 0.45) - 0.5);
            dens *= S[i].z * fade * reserve;
            col *= mix(vec3(1.0), C[i], clamp(dens, 0.0, 1.0));
          }

          vec2 uv = gl_FragCoord.xy / res - 0.5;
          col *= 1.0 - 0.12 * dot(uv, uv);
          gl_FragColor = vec4(col, 1.0);
        }`;
      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const u = (name) => gl.getUniformLocation(prog, name);
      gl.uniform3fv(u("paper"), paper);
      const uRes = u("res"), uT = u("t"), uFade = u("fade"), uW = u("W"), uS = u("S"), uC = u("C"), uKeep = u("keep");

      // Washes placed by screen fraction (x, y from the top left), size in short side units.
      setWashes = () => {
        const m = Math.min(W, H);
        const ex = W / m, ey = H / m;
        const list = [
          // x, y, size, start, angle, stretch, strength, colour
          [0.14, 0.78, 0.34, 0.2, -0.35, 1.5, 0.55, ochre],
          [0.9, 0.52, 0.27, 0.7, 0.5, 1.2, 0.55, rose],
          [0.06, 0.16, 0.24, 1.2, 0.3, 1.3, 0.42, indigo],
          [0.42, 1.02, 0.22, 1.8, 0.1, 1.8, 0.5, rose],
          [0.95, 0.96, 0.24, 2.4, -0.6, 1.1, 0.5, indigo],
          [0.66, 0.24, 0.17, 2.9, 0.9, 1.2, 0.42, ochre],
        ];
        const wv = [], sv = [], cv = [];
        list.forEach(([x, y, size, start, angle, stretch, strength, c], i) => {
          wv.push((x - 0.5) * ex, (0.5 - y) * ey, size, start);
          sv.push(angle, stretch, strength, i * 0.137 + 0.21);
          cv.push(...c);
        });
        gl.uniform4fv(uW, wv);
        gl.uniform4fv(uS, sv);
        gl.uniform3fv(uC, cv);
        const tb = L.title;
        gl.uniform4f(uKeep, (tb.x + tb.w / 2 - W / 2) / m, (H / 2 - (tb.y + tb.h / 2)) / m, (tb.w / 2) / m, (tb.h / 2.4) / m);
      };

      drawWash = (t, fade) => {
        gl.uniform2f(uRes, washCanvas.width, washCanvas.height);
        gl.uniform1f(uT, t);
        gl.uniform1f(uFade, fade);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
    } else {
      stage.style.background = `radial-gradient(50% 40% at 20% 75%, #${colors.ochre}55, transparent 70%), radial-gradient(40% 35% at 85% 50%, #${colors.rose}55, transparent 70%), var(--paper)`;
    }

    // ---------- Ink branch (Canvas 2D) ----------
    const inkCanvas = document.getElementById("ink");
    const ictx = inkCanvas.getContext("2d");
    const branchLayer = document.createElement("canvas");
    const bctx = branchLayer.getContext("2d");
    let dpr = 1;

    // A plum branch in box units (the box is S wide, anchored at the top right).
    const BRANCHES = [
      { nodes: [[1.12, 0.05], [0.9, 0.13], [0.74, 0.12], [0.56, 0.23], [0.4, 0.26], [0.22, 0.37]], w: 0.06, start: 1.9, dur: 2.2 },
      { nodes: [[0.74, 0.12], [0.63, 0.07], [0.5, 0.075]], w: 0.02, start: 3.2, dur: 0.9 },
      { nodes: [[0.56, 0.23], [0.54, 0.32], [0.47, 0.4]], w: 0.019, start: 3.6, dur: 0.8 },
      { nodes: [[0.9, 0.13], [0.87, 0.24], [0.79, 0.31]], w: 0.021, start: 2.9, dur: 0.9 },
      { nodes: [[0.4, 0.26], [0.33, 0.2], [0.27, 0.19]], w: 0.012, start: 4.1, dur: 0.6 },
    ];
    // Blossoms: x, y, size, open time. Size 0 is a closed bud.
    const BLOSSOMS = [
      [0.62, 0.075, 0.05, 4.5], [0.47, 0.4, 0.045, 4.8], [0.36, 0.26, 0.055, 5.0],
      [0.79, 0.31, 0.048, 4.3], [0.86, 0.19, 0.036, 5.3], [0.51, 0.075, 0.03, 5.5],
      [0.23, 0.37, 0, 5.4], [0.27, 0.19, 0, 5.6], [0.55, 0.3, 0, 5.2],
    ];

    // Moss dots: small dark touches along the branch, as in ink painting.
    const DOTS = [[0.95, 0.085, 4.0], [0.8, 0.105, 4.2], [0.66, 0.155, 4.4], [0.49, 0.225, 4.6], [0.3, 0.295, 4.8], [0.88, 0.2, 4.5]];

    // Turn node lists into brush steps: position, direction, width and progress.
    let strokes = [];
    function buildStrokes() {
      const S = L.S, bx = L.bx, by = L.by;
      strokes = BRANCHES.map((b, bi) => {
        const pts = b.nodes.map(([x, y]) => [bx + x * S, by + y * S]);
        // Catmull-Rom through the nodes.
        const dense = [];
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
          for (let k = 0; k < 24; k++) {
            const s = k / 24, s2 = s * s, s3 = s2 * s;
            dense.push([0, 1].map((j) => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * s + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * s2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * s3)));
          }
        }
        dense.push(pts[pts.length - 1]);
        const len = [0];
        for (let i = 1; i < dense.length; i++) len.push(len[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]));
        const total = len[len.length - 1];
        const width = b.w * S;
        const steps = [];
        let j = 0;
        for (let d = 0; d <= total; ) {
          while (j < dense.length - 2 && len[j + 1] < d) j++;
          const f = (d - len[j]) / Math.max(1e-6, len[j + 1] - len[j]);
          const x = dense[j][0] + (dense[j + 1][0] - dense[j][0]) * f;
          const y = dense[j][1] + (dense[j + 1][1] - dense[j][1]) * f;
          const dx = dense[j + 1][0] - dense[j][0], dy = dense[j + 1][1] - dense[j][1];
          const dl = Math.hypot(dx, dy) || 1;
          const u = d / total;
          // Pressure: a firm press at the start, a thin lifted tail, small knots along the way.
          const press = Math.min(1, u / 0.05) * (1 - 0.62 * Math.pow(u, 1.3)) * (0.82 + 0.36 * noise1(u * 11 + bi * 5));
          const w = Math.max(0.8, width * press);
          steps.push({ x, y, nx: -dy / dl, ny: dx / dl, w, u });
          d += Math.max(0.7, w * 0.1);
        }
        // Bristles: offsets across the brush and how much ink each one holds.
        const r = rng(bi * 991 + 7);
        const bristles = Array.from({ length: 18 }, (_, k) => ({ o: ((k / 17) * 2 - 1) * 0.92 + (r() - 0.5) * 0.06, ink: 0.6 + r() * 0.7, size: 0.7 + r() * 0.7, seed: r() * 100 }));
        return { steps, bristles, start: b.start, dur: b.dur, drawn: 0 };
      });
    }

    function dab(ctx, x, y, r) {
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, Math.PI * 2);
    }

    // Paint brush steps from where we stopped up to the target.
    function paintStroke(st, upto) {
      const c = bctx;
      if (upto <= st.drawn) return;
      // Soft wet halo and a pale body under the bristles.
      for (let i = st.drawn; i < upto; i++) {
        const s = st.steps[i];
        c.fillStyle = `rgba(${inkRgb},0.01)`;
        c.beginPath(); dab(c, s.x, s.y, s.w * 0.66); c.fill();
        c.fillStyle = `rgba(${inkRgb},${(0.09 * (1 - 0.8 * s.u)).toFixed(3)})`;
        c.beginPath(); dab(c, s.x, s.y, s.w * 0.4); c.fill();
      }
      // Bristle streaks in short runs, so the width can follow the brush pressure.
      c.lineCap = "butt";
      c.lineJoin = "round";
      const from = Math.max(0, st.drawn - 1);
      for (let a = from; a < upto - 1; a += 6) {
        const b0 = Math.min(upto - 1, a + 6);
        const mid = st.steps[(a + b0) >> 1];
        for (const b of st.bristles) {
          c.lineWidth = mid.w * 0.1 * b.size + 0.4;
          c.strokeStyle = `rgba(${inkRgb},${(0.62 * Math.min(1, b.ink)).toFixed(3)})`;
          c.beginPath();
          let pen = false;
          for (let i = a; i <= b0; i++) {
            const s = st.steps[i];
            // Each bristle runs dry at its own pace, which leaves pale streaks.
            if (noise1(s.u * 6 + b.seed) > b.ink - s.u * 0.75) { pen = false; continue; }
            const off = (b.o + 0.07 * (noise1(s.u * 25 + b.seed * 3) - 0.5)) * s.w * 0.5;
            const x = s.x + s.nx * off, y = s.y + s.ny * off;
            pen ? c.lineTo(x, y) : c.moveTo(x, y);
            pen = true;
          }
          c.stroke();
        }
      }
      st.drawn = upto;
    }

    let paintedUpTo = -1;
    function clearBranch() {
      bctx.setTransform(1, 0, 0, 1, 0, 0);
      bctx.clearRect(0, 0, branchLayer.width, branchLayer.height);
      bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (const st of strokes) st.drawn = 0;
      paintedUpTo = -1;
    }

    function updateBranch(t) {
      if (t < paintedUpTo) clearBranch();
      for (const st of strokes) {
        const p = clamp01((t - st.start) / st.dur);
        paintStroke(st, Math.floor(ease(p) * st.steps.length));
      }
      paintedUpTo = t;
    }

    // One blossom: five soft petals with wet edges, then stamens.
    function blossom(ctx, x, y, r, open, seed) {
      if (open <= 0) return;
      const R = r * (0.35 + 0.65 * easeOut(open));
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(seed * 1.7);
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2;
        const px = Math.cos(a) * R * 0.52, py = Math.sin(a) * R * 0.52;
        const pr = R * (0.5 + 0.06 * Math.sin(seed * 3 + k));
        const g = ctx.createRadialGradient(px, py, 0, px, py, pr);
        g.addColorStop(0, `rgba(${roseRgb},${(0.3 * open).toFixed(3)})`);
        g.addColorStop(0.82, `rgba(${roseRgb},${(0.55 * open).toFixed(3)})`);
        g.addColorStop(1, `rgba(${roseRgb},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); dab(ctx, px, py, pr); ctx.fill();
      }
      if (open > 0.5) {
        const a = (open - 0.5) * 2;
        const ochreRgb = ochre.map((v) => Math.round(v * 200)).join(",");
        ctx.fillStyle = `rgba(${ochreRgb},${(0.8 * a).toFixed(3)})`;
        ctx.beginPath(); dab(ctx, 0, 0, R * 0.13); ctx.fill();
        ctx.strokeStyle = `rgba(${inkRgb},${(0.45 * a).toFixed(3)})`;
        ctx.fillStyle = `rgba(${inkRgb},${(0.8 * a).toFixed(3)})`;
        ctx.lineWidth = Math.max(0.4, R * 0.025);
        const tips = [];
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
          const ang = (k / 8) * Math.PI * 2 + 0.3 + 0.2 * Math.sin(k * 5 + seed);
          const len = R * (0.32 + 0.1 * Math.sin(k * 3.3 + seed * 2));
          const tip = [Math.cos(ang) * len, Math.sin(ang) * len];
          ctx.moveTo(Math.cos(ang) * R * 0.12, Math.sin(ang) * R * 0.12);
          ctx.quadraticCurveTo(tip[0] * 0.6 + tip[1] * 0.1, tip[1] * 0.6 - tip[0] * 0.1, tip[0], tip[1]);
          tips.push(tip);
        }
        ctx.stroke();
        ctx.beginPath();
        for (const [x, y] of tips) dab(ctx, x, y, Math.max(0.5, R * 0.045));
        ctx.fill();
      }
      ctx.restore();
    }

    function bud(ctx, x, y, r, open) {
      if (open <= 0) return;
      ctx.fillStyle = `rgba(${roseRgb},${(0.85 * open).toFixed(3)})`;
      ctx.beginPath(); dab(ctx, x, y, r * easeOut(open)); ctx.fill();
      ctx.fillStyle = `rgba(${inkRgb},${(0.7 * open).toFixed(3)})`;
      ctx.beginPath(); dab(ctx, x + r * 0.5, y + r * 0.35, r * 0.45 * easeOut(open)); ctx.fill();
    }

    // A falling petal: a small teardrop that sways and flips.
    function petal(ctx, x, y, size, rot, flip, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.scale(1, flip);
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.bezierCurveTo(size * 0.9, -size * 0.6, size * 0.7, size * 0.7, 0, size * 0.8);
      ctx.bezierCurveTo(-size * 0.7, size * 0.7, -size * 0.9, -size * 0.6, 0, -size);
      ctx.fillStyle = `rgba(${roseRgb},${(0.6 * alpha).toFixed(3)})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(${roseRgb},${(0.7 * alpha).toFixed(3)})`;
      ctx.lineWidth = Math.max(0.5, size * 0.12);
      ctx.stroke();
      ctx.restore();
    }

    const PETALS = [
      { from: [0.62, 0.1], start: 5.4, life: 5.2, drift: -0.5, fall: 0.95 },
      { from: [0.36, 0.3], start: 6.3, life: 4.8, drift: -0.35, fall: 0.8 },
      { from: [0.79, 0.34], start: 7.0, life: 4.4, drift: -0.6, fall: 0.85 },
      { from: [0.47, 0.42], start: 8.0, life: 3.6, drift: 0.2, fall: 0.6 },
    ];

    function drawInk(t, fade) {
      updateBranch(t);
      ictx.setTransform(1, 0, 0, 1, 0, 0);
      ictx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
      ictx.globalAlpha = fade;
      ictx.drawImage(branchLayer, 0, 0);
      ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const S = L.S, bx = L.bx, by = L.by;
      ictx.fillStyle = `rgba(${inkRgb},0.8)`;
      for (const [x, y, at] of DOTS) {
        const o = clamp01((t - at) / 0.25);
        if (o <= 0) continue;
        ictx.beginPath();
        dab(ictx, bx + x * S, by + y * S, S * 0.007 * easeOut(o) + 0.3);
        dab(ictx, bx + (x + 0.012) * S, by + (y - 0.006) * S, S * 0.004 * easeOut(o) + 0.2);
        ictx.fill();
      }
      BLOSSOMS.forEach(([x, y, size, at], i) => {
        const open = clamp01((t - at) / 0.9);
        if (size > 0) blossom(ictx, bx + x * S, by + y * S, size * S, open, i + 1);
        else bud(ictx, bx + x * S, by + y * S, 0.012 * S, open);
      });
      for (const [i, p] of PETALS.entries()) {
        const age = t - p.start;
        if (age <= 0 || age >= p.life) continue;
        const a = age / p.life;
        const alpha = clamp01(age / 0.5) * clamp01((p.life - age) / 0.9);
        const x = bx + p.from[0] * S + p.drift * S * a + Math.sin(age * 1.5 + i) * S * 0.04;
        const y = by + p.from[1] * S + p.fall * Math.max(H, S * 0.6) * a * (0.6 + 0.4 * a);
        petal(ictx, x, y, S * 0.026, age * 0.8 + i * 1.3, Math.cos(age * 2 + i), alpha);
      }
      ictx.globalAlpha = 1;
    }

    // ---------- Words ----------
    const titleEl = document.getElementById("title");
    const headEl = document.getElementById("headline");
    const subEl = document.getElementById("sub");
    const letters = [];
    headText.split(/\s+/).filter(Boolean).forEach((word, wi, all) => {
      const w = document.createElement("span");
      w.className = "word";
      for (const ch of word) {
        const s = document.createElement("span");
        s.className = "letter";
        s.textContent = ch;
        w.append(s);
        letters.push(s);
      }
      headEl.append(w);
      if (wi < all.length - 1) headEl.append(" ");
    });
    const sealBox = document.createElement("canvas");
    sealBox.className = "seal";
    headEl.lastChild?.append(sealBox);
    subEl.textContent = subText;
    if (!subText) subEl.remove();

    // The red seal: a slightly uneven square with a carved letter and worn specks.
    function drawSeal() {
      const size = Math.max(8, sealBox.getBoundingClientRect().width);
      const px = Math.round(size * dpr);
      sealBox.width = sealBox.height = px;
      const c = sealBox.getContext("2d");
      const r = rng(42);
      c.clearRect(0, 0, px, px);
      c.fillStyle = "#b4382c";
      c.beginPath();
      const pad = px * 0.04;
      const corners = [[pad, pad], [px - pad, pad], [px - pad, px - pad], [pad, px - pad]];
      corners.forEach(([x, y], i) => {
        const jx = (r() - 0.5) * px * 0.04, jy = (r() - 0.5) * px * 0.04;
        i ? c.lineTo(x + jx, y + jy) : c.moveTo(x + jx, y + jy);
      });
      c.closePath();
      c.fill();
      c.globalCompositeOperation = "destination-out";
      c.strokeStyle = "#000";
      c.lineWidth = px * 0.05;
      c.strokeRect(px * 0.15, px * 0.15, px * 0.7, px * 0.7);
      const initial = ([...headText].find((ch) => /[\p{L}\p{N}]/u.test(ch)) ?? "M").toUpperCase();
      c.font = `600 ${px * 0.56}px "Cormorant Garamond", Georgia, serif`;
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText(initial, px / 2, px * 0.54);
      for (let i = 0; i < 40; i++) {
        c.globalAlpha = 0.3 + r() * 0.6;
        c.beginPath();
        dab(c, r() * px, r() * px, px * (0.008 + r() * 0.02));
        c.fill();
      }
      c.globalAlpha = 1;
      c.globalCompositeOperation = "source-over";
    }

    // Largest size that keeps the words inside their box.
    function fitTitle() {
      const tb = L.title;
      Object.assign(titleEl.style, { left: `${tb.x}px`, top: `${tb.y}px`, width: `${tb.w}px`, height: `${tb.h}px` });
      let size = Math.min(tb.w * 0.3, tb.h * 0.42, Math.min(W, H) * 0.24);
      const set = () => {
        headEl.style.fontSize = `${size}px`;
        subEl.style.fontSize = `${Math.max(7, size * 0.3)}px`;
      };
      set();
      while (size > 8 && (headEl.scrollWidth > tb.w + 1 || headEl.offsetHeight + (subEl.isConnected ? subEl.offsetHeight + size * 0.35 : 0) > tb.h)) {
        size *= 0.94;
        set();
      }
    }

    function paintWords(t, fade) {
      letters.forEach((el, i) => {
        const p = clamp01((t - 5.0 - i * 0.1) / 0.6);
        const pos = (1 - easeOut(p)) * 100;
        el.style.webkitMaskPosition = `${pos}% 0`;
        el.style.maskPosition = `${pos}% 0`;
        el.style.opacity = p > 0 ? (0.3 + 0.7 * p).toFixed(3) : "0";
      });
      const done = 5.0 + letters.length * 0.1 + 0.3;
      const sp = clamp01((t - done) / 0.9);
      subEl.style.opacity = ease(sp).toFixed(3);
      subEl.style.transform = `translateY(${((1 - ease(sp)) * 0.3).toFixed(3)}em)`;
      // The seal presses down after the words.
      const st = clamp01((t - done - 0.7) / 0.35);
      sealBox.style.opacity = st > 0 ? (0.92 * Math.min(1, st * 2)).toFixed(3) : "0";
      sealBox.style.transform = `scale(${(1 + 0.35 * Math.pow(1 - st, 2)).toFixed(3)}) rotate(-4deg)`;
      titleEl.style.opacity = fade.toFixed(3);
    }

    // ---------- Frame ----------
    function frameAt(t) {
      // Everything fades back to clean paper at the end of the loop.
      const fade = 1 - ease(clamp01((t - 10.4) / 1.4));
      drawWash(t, fade);
      drawInk(t, fade);
      paintWords(t, fade);
    }

    function resize() {
      layout();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const gdpr = Math.min(dpr, 1.5);
      washCanvas.width = Math.round(W * gdpr);
      washCanvas.height = Math.round(H * gdpr);
      if (gl) gl.viewport(0, 0, washCanvas.width, washCanvas.height);
      inkCanvas.width = branchLayer.width = Math.round(W * dpr);
      inkCanvas.height = branchLayer.height = Math.round(H * dpr);
      buildStrokes();
      clearBranch();
      setWashes();
      fitTitle();
      drawSeal();
    }

    // ?t=seconds freezes one moment (handy for thumbnails).
    const frozen = params.has("t") ? ((Number(params.get("t")) % LOOP) + LOOP) % LOOP : null;
    let raf = 0, startAt = performance.now(), lastFrame = -Infinity, clockReady = false;
    function loop(now) {
      frameAt((((now - startAt) / 1000) % LOOP + LOOP) % LOOP);
      lastFrame = now;
      raf = requestAnimationFrame(loop);
    }

    // Reduced motion: one calm still frame with everything painted.
    const STILL = 9.2;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function apply() {
      if (reduce.matches || frozen !== null) {
        cancelAnimationFrame(raf);
        raf = 0;
        frameAt(frozen ?? STILL);
      } else if (!raf) {
        raf = requestAnimationFrame(loop);
      }
    }
    reduce.addEventListener("change", apply);
    window.addEventListener("resize", () => {
      resize();
      if (!raf) frameAt(frozen ?? STILL);
    });

    // ---- Sound ----
    // Every sound is made with the Web Audio API, nothing is loaded. It stays off until the parent
    // page (or ?sound=1 / ?sound=effects) turns it on. The scheduler reads the same clock as the
    // animation, so each sound lands with the frame it belongs to.
    const sound = (() => {
      // Its own copy of the media query, read only when it changes (reading it every tick can swallow the change event).
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      let reduced = reduce.matches;
      const LEVEL = 0.6, FX = 2.4, MUSIC = 0.4, ECHO = 0.5625;
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      const toPan = (x) => Math.max(-0.8, Math.min(0.8, (x - 0.5) * 1.4));
      let ctx = null, master, impulse, white, pink, plucks = new Map(), session = null, gates = [];
      let fxBus, fxVerb, fxEcho, musBus, musVerb, musEcho;
      let wantOn = false, wantMusic = true, playing = false, fresh = true;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0, catchUp = false;

      // Animation time in seconds (it keeps counting across loops), or null while frames are not running.
      function clock() {
        const nowMs = performance.now();
        if (!clockReady || !raf || nowMs - lastFrame > 250) return null;
        return (nowMs - startAt) / 1000;
      }

      // One loop of sounds, in loop seconds, worked out from the same numbers as the drawing code.
      const events = (() => {
        const list = [];
        const add = (t, type, extra = {}, music = false) =>
          list.push({ t: ((t % LOOP) + LOOP) % LOOP, type, music, ...extra });

        // Washes: a wet touch and a water bloom as each one starts to spread (same list as setWashes).
        [[0.14, 0.34, 0.2], [0.9, 0.27, 0.7], [0.06, 0.24, 1.2], [0.42, 0.22, 1.8], [0.95, 0.24, 2.4], [0.66, 0.17, 2.9]]
          .forEach(([x, size, start]) => add(start, "wash", { p: toPan(x), size }));
        // Branch strokes: a soft bristle drag for each one, shaped by its brush speed.
        BRANCHES.forEach((b) => add(b.start, "brush", { dur: b.dur, w: b.w, x0: b.nodes[0][0], x1: b.nodes[b.nodes.length - 1][0] }));
        // Moss dots: tiny ink dabs.
        DOTS.forEach(([x, , at]) => add(at, "dab", { x }));
        // Petals: a delicate chime and a whisper of air as each one lets go.
        const petalNotes = [[93, 90], [88, 86], [90, 85], [86, 81]];
        PETALS.forEach((p, i) => add(p.start, "petal", { x: p.from[0], life: p.life, notes: petalNotes[i] }));
        // Headline: a quick wet brush stroke per letter, the small line, then the seal (same maths as paintWords).
        const n = letters.length;
        letters.forEach((el, i) => add(5.0 + i * 0.1, "letter", { i, n }));
        const done = 5.0 + n * 0.1 + 0.3;
        if (subText) add(done, "subline");
        add(done + 0.7, "seal");
        // Everything fades back to clean paper.
        add(10.4, "rinse");

        // Music: 80 bpm, four bars of four beats fill the 12 s loop exactly. D major pentatonic:
        // soft zither plucks, a breathy flute and a quiet low drone. D, Bm, Em, A.
        const BEAT = LOOP / 16;
        const bars = [
          { root: 38, fifth: 45, plucks: [[0, 69], [1, 74], [2, 78], [2.5, 76], [3, 74]], flute: [[0, 78, 2.5], [2.5, 76, 1.5]] },
          { root: 35, fifth: 42, plucks: [[0, 66], [1, 71], [2, 74], [3, 69]], flute: [[0, 74, 3]] },
          { root: 40, fifth: 47, plucks: [[0, 71], [1, 76], [1.5, 74], [2, 71], [3, 69]], flute: [[0, 76, 1.5], [1.5, 78, 0.5], [2, 81, 2]] },
          { root: 33, fifth: 40, plucks: [[0, 64], [1, 69], [2, 71], [2.5, 74, 1], [3, 76]], flute: [[0, 78, 2], [2, 76, 1.5]] },
        ];
        bars.forEach((bar, k) => {
          const t0 = k * 4 * BEAT;
          add(t0, "drone", { notes: [bar.root + 12, bar.fifth + 12], dur: 4 * BEAT }, true);
          add(t0, "pluck", { m: bar.root + 12, v: 0.9, p: -0.2 }, true);
          add(t0 + 2 * BEAT, "pluck", { m: bar.fifth + 12, v: 0.55, p: -0.2 }, true);
          for (const [b, m, bend] of bar.plucks) add(t0 + b * BEAT, "pluck", { m, v: b ? 0.6 : 0.75, p: ((m % 7) / 7) * 0.8 - 0.3, bend: !!bend }, true);
          for (const [b, m, len] of bar.flute) add(t0 + b * BEAT, "flute", { m, len: len * BEAT }, true);
        });
        return list.sort((a, b) => a.t - b.t);
      })();

      // Audio graph: master gain into a gentle compressor, so nothing clips.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const sr = ctx.sampleRate;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16;
        comp.knee.value = 10;
        comp.ratio.value = 3;
        comp.attack.value = 0.008;
        comp.release.value = 0.25;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);

        // White and pink noise.
        white = ctx.createBuffer(1, sr * 2, sr);
        pink = ctx.createBuffer(1, sr * 2, sr);
        const w = white.getChannelData(0), p = pink.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < w.length; i++) {
          const x = Math.random() * 2 - 1;
          w[i] = x;
          b0 = 0.99765 * b0 + x * 0.099046;
          b1 = 0.963 * b1 + x * 0.2965164;
          b2 = 0.57 * b2 + x * 1.0526913;
          p[i] = (b0 + b1 + b2 + x * 0.1848) * 0.2;
        }

        // A soft room: stereo noise that fades and darkens over two and a half seconds.
        const len = Math.floor(sr * 2.6);
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          let y = 0;
          for (let i = 0; i < len; i++) {
            const k = i / len;
            y += (0.8 - 0.7 * k) * ((Math.random() * 2 - 1) - y);
            d[i] = y * Math.pow(1 - k, 2.6) * 0.5;
          }
        }

        // Plucked strings, made once per note with a simple string model (a noise burst in a
        // short feedback loop that softens each pass).
        for (const e of events) {
          if (e.type !== "pluck" || plucks.has(e.m)) continue;
          const f = hz(e.m), N = Math.max(2, Math.round(sr / f - 0.5));
          const size = Math.floor(sr * (e.m < 55 ? 3 : 2.2));
          const buf = ctx.createBuffer(1, size, sr);
          const y = buf.getChannelData(0);
          const loss = e.m < 55 ? 0.998 : 0.9965;
          let s = 0;
          for (let i = 0; i < size; i++) {
            let x = 0;
            if (i < N) {
              s += 0.5 * ((Math.random() * 2 - 1) - s); // a softer, rounder pluck
              x = s;
            }
            const a = i >= N ? y[i - N] : 0, b = i > N ? y[i - N - 1] : 0;
            y[i] = x + loss * 0.5 * (a + b);
          }
          let peak = 0;
          for (let i = 0; i < size; i++) peak = Math.max(peak, Math.abs(y[i]));
          const tail = Math.floor(sr * 0.3);
          for (let i = 0; i < size; i++) y[i] = (y[i] / peak) * 0.6 * Math.min(1, (size - i) / tail);
          plucks.set(e.m, { buf, rate: (f * (N + 0.5)) / sr });
        }
      }

      // Each switch on gets fresh buses, so sounds booked before a switch off never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.08);
        session.connect(master);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        verb.connect(session);
        // A soft echo that feeds a little into the room.
        const delay = ctx.createDelay(2);
        delay.delayTime.value = ECHO;
        const fb = ctx.createGain();
        fb.gain.value = 0.32;
        const tone = filter("lowpass", 2600);
        delay.connect(tone).connect(fb).connect(delay);
        tone.connect(session);
        tone.connect(verb);
        // Effects sit clearly above the music.
        [fxBus, fxVerb, fxEcho] = [session, verb, delay].map((to) => {
          const g = ctx.createGain();
          g.gain.value = FX;
          g.connect(to);
          return g;
        });
        // Music goes through gates, so music:false silences it and its reverb and echo too.
        musBus = ctx.createGain();
        musVerb = ctx.createGain();
        musEcho = ctx.createGain();
        gates = [[musBus, session], [musVerb, verb], [musEcho, delay]].map(([from, to]) => {
          const g = ctx.createGain();
          g.gain.value = wantMusic ? MUSIC : 0;
          from.connect(g).connect(to);
          return g;
        });
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.disconnect(), 300);
      }
      function setGates() {
        const t = ctx.currentTime;
        for (const g of gates) {
          g.gain.cancelScheduledValues(t);
          g.gain.setValueAtTime(g.gain.value, t);
          g.gain.linearRampToValueAtTime(wantMusic ? MUSIC : 0, t + 0.12);
        }
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      // A slow swell: rise, hold, fall (linear, so it breathes).
      function swellGain(when, peak, rise, hold, fall, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, when);
        g.gain.linearRampToValueAtTime(peak, when + rise);
        g.gain.setValueAtTime(peak, when + rise + hold);
        g.gain.linearRampToValueAtTime(0, when + rise + hold + fall);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(buf, when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = buf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function wet(node, amount, music) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(music ? musVerb : fxVerb);
      }
      function echo(node, amount, music) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(music ? musEcho : fxEcho);
      }
      // A tiny water bubble: a sine that slides up quickly.
      function bubble(when, f, peak, out) {
        const o = osc("sine", f, when, 0.06);
        o.frequency.exponentialRampToValueAtTime(f * 1.9, when + 0.04);
        o.connect(amp(when, peak, 0.004, 0.035, out));
      }
      // Screen x of a point on the branch (box units), turned into a pan.
      const branchPan = (x) => (L ? toPan((L.bx + x * L.S) / W) : 0);

      // One function per sound.
      const voices = {
        // Brush touches wet paper, the water blooms outward and settles.
        wash(when, e) {
          const p = pan(e.p, fxBus), big = e.size / 0.34;
          const n = noise(pink, when, 2.2);
          const lp = filter("lowpass", 2400, 0.9);
          lp.frequency.setValueAtTime(2400, when);
          lp.frequency.exponentialRampToValueAtTime(380, when + 2);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.16 * big, when + 0.12);
          g.gain.exponentialRampToValueAtTime(0.0001, when + 2.1);
          n.connect(lp).connect(g).connect(p);
          // A soft wet touch, then a few small bubbles as the water spreads.
          const touch = osc("sine", 420, when, 0.12);
          touch.frequency.exponentialRampToValueAtTime(190, when + 0.1);
          touch.connect(amp(when, 0.06, 0.004, 0.1, p));
          [0.09, 0.22, 0.4, 0.63].forEach((dt, k) => bubble(when + dt * (1 + big * 0.3), 700 + ((k * 331 + e.size * 1000) % 500), 0.02, p));
          wet(p, 0.4);
        },
        // Bristles dragging across the paper, loudest where the brush moves fastest.
        brush(when, e) {
          const d = e.dur, thick = e.w / 0.06;
          const n = noise(white, when, d + 0.1);
          const bp = filter("bandpass", 1500 + 1600 * (1 - thick), 0.7);
          const shelf = filter("lowpass", 5200, 0.5);
          const g = ctx.createGain();
          // Speed of an ease in-out stroke: 6 p (1 - p), with a soft start and end.
          const curve = new Float32Array(33);
          for (let i = 0; i < 33; i++) {
            const u = i / 32;
            curve[i] = (0.02 + 0.2 * (0.35 + 0.65 * thick) * 1.5 * u * (1 - u) * 4 * (1 - 0.4 * u)) * Math.min(1, u * 12);
          }
          curve[32] = 0;
          g.gain.setValueCurveAtTime(curve, when, d);
          // Rough texture: the level shivers a little, like hairs catching the paper grain.
          const rough = ctx.createGain();
          rough.gain.value = 0.75;
          const mod = noise(white, when, d + 0.1);
          const modLp = filter("lowpass", 35);
          const modAmt = ctx.createGain();
          modAmt.gain.value = 2.2;
          mod.connect(modLp).connect(modAmt).connect(rough.gain);
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(branchPan(e.x0), when);
          p.pan.linearRampToValueAtTime(branchPan(e.x1), when + d);
          p.connect(fxBus);
          n.connect(bp).connect(shelf).connect(g).connect(rough).connect(p);
          wet(rough, 0.2);
        },
        // A tiny soft dab of ink.
        dab(when, e) {
          const p = pan(branchPan(e.x), fxBus);
          noise(pink, when, 0.05).connect(filter("bandpass", 1300, 1.2)).connect(amp(when, 0.08, 0.003, 0.045, p));
          osc("sine", 300, when, 0.06).connect(amp(when, 0.03, 0.003, 0.05, p));
        },
        // A petal lets go: a delicate two note chime and a faint flutter of air.
        petal(when, e) {
          const p = pan(branchPan(e.x) * 0.8, fxBus);
          e.notes.forEach((m, k) => {
            const t = when + k * 0.55;
            osc("sine", hz(m), t, 1.6).connect(amp(t, 0.026, 0.006, 1.5, p));
          });
          const n = noise(pink, when, 2.4);
          const bp = filter("bandpass", 2600, 1.6);
          const g = swellGain(when, 0.035, 0.8, 0.2, 1.4, p);
          const sway = osc("sine", 1.6, when, 2.4);
          const depth = ctx.createGain();
          depth.gain.value = 0.012;
          sway.connect(depth).connect(g.gain);
          n.connect(bp).connect(g);
          wet(p, 0.8);
          echo(p, 0.35);
        },
        // Each letter: a quick soft wet brush flick, moving across the headline.
        letter(when, e) {
          const tb = L ? L.title : { x: 0, w: W };
          const x = (tb.x + tb.w * (0.15 + (0.7 * e.i) / Math.max(1, e.n - 1))) / W;
          const p = pan(toPan(x), fxBus);
          const n = noise(white, when, 0.32);
          const bp = filter("bandpass", 1400, 0.9);
          bp.frequency.setValueAtTime(1400, when);
          bp.frequency.exponentialRampToValueAtTime(2800, when + 0.28);
          n.connect(bp).connect(amp(when, 0.07, 0.05, 0.26, p));
          wet(p, 0.25);
        },
        // The small line eases in: one long, light brush sweep.
        subline(when) {
          const n = noise(white, when, 0.9);
          const bp = filter("bandpass", 1800, 0.8);
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(-0.3, when);
          p.pan.linearRampToValueAtTime(0.3, when + 0.85);
          p.connect(fxBus);
          n.connect(bp).connect(swellGain(when, 0.035, 0.3, 0.1, 0.5, p));
          wet(p, 0.3);
        },
        // The red seal: a short lift, then a soft wooden press into the paper when it lands.
        seal(when) {
          const land = when + 0.35;
          const air = noise(pink, when, 0.36);
          const bp = filter("bandpass", 900, 0.8);
          bp.frequency.setValueAtTime(600, when);
          bp.frequency.exponentialRampToValueAtTime(1400, when + 0.33);
          air.connect(bp).connect(swellGain(when, 0.03, 0.3, 0, 0.05, fxBus));
          const body = osc("sine", 170, land, 0.2);
          body.frequency.exponentialRampToValueAtTime(92, land + 0.12);
          body.connect(amp(land, 0.2, 0.003, 0.17, fxBus));
          for (const [f, v, d] of [[430, 0.06, 0.07], [1150, 0.025, 0.04]]) {
            osc("triangle", f, land, d + 0.02).connect(amp(land, v, 0.002, d, fxBus));
          }
          const knock = noise(pink, land, 0.08);
          const kb = filter("bandpass", 720, 2.5);
          const kg = amp(land, 0.14, 0.002, 0.06, fxBus);
          knock.connect(kb).connect(kg);
          wet(kg, 0.35);
        },
        // Everything washes back to clean paper: a slow soft rinse of water.
        rinse(when) {
          const n = noise(pink, when, 2.2);
          const lp = filter("lowpass", 1800, 0.8);
          lp.frequency.setValueAtTime(1800, when);
          lp.frequency.exponentialRampToValueAtTime(280, when + 2);
          const g = swellGain(when, 0.12, 0.6, 0.2, 1.3, fxBus);
          n.connect(lp).connect(g);
          [0.3, 0.55, 0.9, 1.2].forEach((dt, k) => bubble(when + dt, 560 + k * 140, 0.012, fxBus));
          wet(g, 0.5);
        },
        // Music: a plucked zither string. Some notes slide up into pitch, zither style.
        pluck(when, e) {
          const s = plucks.get(e.m);
          const src = ctx.createBufferSource();
          src.buffer = s.buf;
          src.playbackRate.value = s.rate;
          if (e.bend) {
            src.detune.setValueAtTime(-200, when);
            src.detune.setTargetAtTime(0, when + 0.05, 0.06);
          }
          const lp = filter("lowpass", 3800, 0.5);
          const g = ctx.createGain();
          g.gain.value = 0.5 * e.v;
          const p = pan(e.p, musBus);
          src.connect(lp).connect(g).connect(p);
          src.start(when);
          wet(p, 0.4, true);
          echo(p, 0.18, true);
        },
        // Music: a soft breathy flute with a gentle late vibrato.
        flute(when, e) {
          const f = hz(e.m), d = e.len;
          const g = swellGain(when, 0.07, 0.14, Math.max(0, d - 0.3), 0.3, pan(0.15, musBus));
          const vib = osc("sine", 4.8, when, d + 0.3);
          const depth = ctx.createGain();
          depth.gain.setValueAtTime(0, when);
          depth.gain.linearRampToValueAtTime(f * 0.004, when + Math.min(0.8, d));
          vib.connect(depth);
          for (const [k, v] of [[1, 1], [2, 0.12], [3, 0.04]]) {
            const o = osc("sine", f * k, when, d + 0.3);
            depth.connect(o.frequency);
            const og = ctx.createGain();
            og.gain.value = v;
            o.connect(og).connect(g);
          }
          const n = noise(pink, when, d + 0.3);
          const bp = filter("bandpass", f * 2, 3);
          n.connect(bp).connect(swellGain(when, 0.25, 0.06, Math.max(0, d - 0.3), 0.3, g));
          wet(g, 0.6, true);
          echo(g, 0.25, true);
        },
        // Music: a quiet low drone (root and fifth) under each bar.
        drone(when, e) {
          const a = e.late ? 0.4 : 1.0, hold = Math.max(0, e.dur - a), rel = 1.4;
          const g = swellGain(when, 0.05, a, hold, rel, musBus);
          wet(g, 0.5, true);
          const lp = filter("lowpass", 700, 0.5);
          lp.connect(g);
          e.notes.forEach((m, i) => {
            const o = osc("triangle", hz(m), when, a + hold + rel);
            o.detune.value = i ? 3 : -3;
            o.connect(lp);
          });
        },
      };

      // Look-ahead scheduler: every 25 ms, book the sounds due in the next 100 ms.
      // Animation time maps to audio time through an anchor that is reset after any jump or pause.
      function tick() {
        const ok = playing && ctx.state === "running" && !document.hidden && !reduced;
        const now = ok ? clock() : null;
        if (now === null) { anchor = null; return; }
        const at = ctx.currentTime;
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.08) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          // After a switch on or a real gap, start from now (nothing piles up). After a small
          // hiccup, carry on from where booking stopped, so nothing plays twice or goes missing.
          if (fresh || now - doneUpTo > 0.3 || now < doneUpTo - 0.3) {
            doneUpTo = now;
            catchUp = true;
          }
          fresh = false;
        }
        if (catchUp) {
          if (wantMusic) resumeHeld(now, at);
          catchUp = false;
        }
        const from = doneUpTo, to = anchor.tl + (at - anchor.audio) + 0.1;
        if (to <= from) return;
        for (let k = Math.floor(from / LOOP); k <= Math.floor(to / LOOP); k++) {
          for (const e of events) {
            const t = k * LOOP + e.t;
            if (t < from || t >= to || (e.music && !wantMusic)) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl)), e);
          }
        }
        doneUpTo = to;
      }
      // Bring in long music notes that are already under way, so the bed does not wait for the next bar.
      function resumeHeld(now, at) {
        const lt = ((now % LOOP) + LOOP) % LOOP;
        for (const e of events) {
          if (!e.music || !e.dur) continue;
          for (const s of [e.t, e.t - LOOP]) {
            const left = s + e.dur - lt;
            if (lt > s && left > 0.4) voices[e.type](at + 0.02, { ...e, dur: left, late: true });
          }
        }
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && !reduced;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            fresh = true;
            openSession();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend().catch(() => {}), 200);
        }
      }
      function setMusic(on) {
        if (on === wantMusic) return;
        wantMusic = on;
        if (playing) {
          setGates();
          if (on) catchUp = true;
        }
      }

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);
      reduce.addEventListener("change", () => {
        reduced = reduce.matches;
        update();
      });

      addEventListener("message", (event) => {
        const d = event.data;
        if (event.origin !== location.origin || !d || d.type !== "motionprompt-sound") return;
        if (typeof d.music === "boolean") setMusic(d.music);
        if (typeof d.on === "boolean") wantOn = d.on;
        update();
      });
      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantMusic = fromUrl === "1";
        wantOn = true;
        update();
      }
      return { update };
    })();

    // Wait briefly for the fonts so the words are measured in the right face.
    Promise.race([
      Promise.all([document.fonts.load("1em 'Kaushan Script'"), document.fonts.load("italic 500 1em 'Cormorant Garamond'"), document.fonts.load("600 1em 'Cormorant Garamond'")]),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => {
      resize();
      startAt = performance.now();
      clockReady = true;
      apply();
    });
    resize();
  </script>
</body>
</html>
