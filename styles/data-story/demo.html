<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data story demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/index.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=f7f5f0&ink=16181d&accent=3b5bff&accent2=ff6a3d */
    :root {
      --bg: #f7f5f0;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      font-family: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <svg id="stage" role="img"></svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => "#" + (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const c = { bg: hex("bg", "f7f5f0"), ink: hex("ink", "16181d"), accent: hex("accent", "3b5bff"), accent2: hex("accent2", "ff6a3d") };
    document.documentElement.style.setProperty("--bg", c.bg);
    const custom = params.has("accent") || params.has("accent2");
    const mint = custom ? c.accent : "#16a37a";

    // Mix two hex colours, used for the quiet greys (grid lines, small labels).
    const mix = (a, b, t) => "#" + [1, 3, 5].map((i) => {
      const v = Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t);
      return v.toString(16).padStart(2, "0");
    }).join("");
    const muted = mix(c.ink, c.bg, 0.45);
    const grid = mix(c.ink, c.bg, 0.87);

    const title = (params.get("text") || "Our year in numbers").trim().slice(0, 60);
    const svg = document.getElementById("stage");
    svg.setAttribute("aria-label", `Animated infographic: ${title}. A number counts up, bars grow, a line draws and a donut fills.`);

    // Three cards of sample stats, each with the chart that suits it.
    const cards = [
      { value: 12480, prefix: "", suffix: "", caption: "new customers", chart: "bars", color: c.accent,
        bars: [2140, 2860, 3310, 4170], labels: ["Q1", "Q2", "Q3", "Q4"] },
      { value: 38, prefix: "+", suffix: "%", caption: "growth since last year", chart: "line", color: mint,
        points: [100, 104, 101, 109, 113, 110, 118, 124, 121, 129, 133, 138], labels: ["Jan", "Jun", "Dec"] },
      { value: 72, prefix: "", suffix: "%", caption: "would recommend us", chart: "donut", color: c.accent2,
        share: 0.72, center: "7 in 10" },
    ];
    const CARD = 3.6; // seconds per card

    const NS = "http://www.w3.org/2000/svg";
    function el(name, attrs, parent) {
      const node = document.createElementNS(NS, name);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      parent.append(node);
      return node;
    }
    function text(str, attrs, parent) {
      const node = el("text", attrs, parent);
      node.textContent = str;
      return node;
    }
    // Shrink a text node until it fits a width.
    function fitWidth(node, maxW) {
      let size = parseFloat(node.getAttribute("font-size"));
      while (size > 6 && node.getComputedTextLength() > maxW) {
        size *= 0.94;
        node.setAttribute("font-size", size);
      }
      return size;
    }
    const format = (card, v) => card.prefix + Math.round(v).toLocaleString("en-US") + card.suffix;

    let tl = null;

    function build() {
      const saved = tl ? tl.time() : 0;
      if (tl) tl.kill();
      svg.replaceChildren();

      const W = innerWidth, H = innerHeight, u = Math.min(W, H);
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      const pad = Math.max(12, u * 0.08);
      const small = Math.max(7, u * 0.034);
      const radius = Math.max(2, u * 0.01); // rounded bar tops

      // Header: the title, fixed through the whole loop.
      const titleEl = text(title, { x: pad, y: pad + u * 0.045, "font-size": u * 0.056, "font-weight": 650, fill: c.ink, "letter-spacing": "-0.01em" }, svg);
      const titleSize = fitWidth(titleEl, W - pad * 2);

      // Story style progress bars at the bottom, one per card.
      const progY = H - pad * 0.75;
      const gapP = u * 0.015;
      const segW = (W - pad * 2 - gapP * (cards.length - 1)) / cards.length;
      const segH = Math.max(2, u * 0.008);
      const fills = cards.map((_, i) => {
        const x = pad + i * (segW + gapP);
        el("rect", { x, y: progY, width: segW, height: segH, rx: segH / 2, fill: grid }, svg);
        return el("rect", { x, y: progY, width: segW, height: segH, rx: segH / 2, fill: c.ink }, svg);
      });

      // Content area, split into a stat block and a chart block.
      const top = pad + u * 0.045 + titleSize * 0.3 + u * 0.07;
      const bottom = progY - u * 0.07;
      const cw = W - pad * 2, ch = bottom - top;
      const wide = W / H > 1.2;
      const stat = wide
        ? { x: pad, y: top, w: cw * 0.4, h: ch }
        : { x: pad, y: top, w: cw, h: Math.min(ch * 0.34, u * 0.34) };
      const chart = wide
        ? { x: pad + cw * 0.46, y: top, w: cw * 0.54, h: ch }
        : { x: pad, y: top + stat.h + u * 0.05, w: cw, h: ch - stat.h - u * 0.05 };

      tl = gsap.timeline({ repeat: -1, defaults: { ease: "power3.out" } });

      cards.forEach((card, i) => {
        const at = i * CARD;
        const g = el("g", {}, svg);

        // Big number and caption.
        const numSize = Math.min(stat.h * (wide ? 0.34 : 0.62), u * 0.24);
        const numY = wide ? stat.y + stat.h / 2 - numSize * 0.05 : stat.y + numSize * 0.78;
        const num = text(format(card, card.value), { x: stat.x - numSize * 0.04, y: numY, "font-size": numSize, "font-weight": 750, fill: c.ink, "letter-spacing": "-0.035em" }, g);
        fitWidth(num, stat.w);
        const cap = text(card.caption, { x: stat.x, y: numY + Math.max(small * 1.9, numSize * 0.36), "font-size": Math.max(small * 1.15, numSize * 0.2), "font-weight": 500, fill: muted }, g);
        fitWidth(cap, stat.w);
        // A short colour key above the number links it to its chart.
        const key = el("rect", { x: stat.x, y: numY - numSize * 0.98, width: u * 0.06, height: Math.max(2, u * 0.012), rx: u * 0.006, fill: card.color }, g);

        tl.fromTo(g, { autoAlpha: 0, y: u * 0.03 }, { autoAlpha: 1, y: 0, duration: 0.5 }, at);
        tl.fromTo(key, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6 }, at + 0.1);
        const counter = { v: 0 };
        tl.fromTo(counter, { v: 0 }, { v: card.value, duration: 1.5, ease: "power2.out", onUpdate: () => (num.textContent = format(card, counter.v)) }, at + 0.1);
        tl.fromTo(cap, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, at + 0.45);

        const b = { x: chart.x, y: chart.y, w: chart.w, h: chart.h };
        if (card.chart === "bars") {
          // Columns grow from one baseline, value on each cap.
          const plotTop = b.y + small * 1.8, base = b.y + b.h - small * 1.9;
          el("line", { x1: b.x, x2: b.x + b.w, y1: base, y2: base, stroke: grid, "stroke-width": 1 }, g);
          const max = Math.max(...card.bars);
          const slot = b.w / card.bars.length;
          const bw = Math.min(slot * 0.56, u * 0.14);
          card.bars.forEach((v, j) => {
            const h = ((base - plotTop) * v) / max;
            const x = b.x + slot * j + (slot - bw) / 2;
            const r = Math.min(radius, bw / 2);
            const bar = el("path", {
              d: `M${x},${base} V${base - h + r} Q${x},${base - h} ${x + r},${base - h} H${x + bw - r} Q${x + bw},${base - h} ${x + bw},${base - h + r} V${base} Z`,
              fill: card.color,
            }, g);
            const val = text(v.toLocaleString("en-US"), { x: x + bw / 2, y: base - h - small * 0.6, "font-size": small, "font-weight": 600, fill: c.ink, "text-anchor": "middle" }, g);
            const lab = text(card.labels[j], { x: x + bw / 2, y: base + small * 1.45, "font-size": small, fill: muted, "text-anchor": "middle" }, g);
            tl.fromTo(bar, { scaleY: 0, svgOrigin: `${x + bw / 2} ${base}` }, { scaleY: 1, duration: 0.8 }, at + 0.35 + j * 0.13);
            tl.fromTo(val, { autoAlpha: 0, y: small * 0.5 }, { autoAlpha: 1, y: 0, duration: 0.4 }, at + 0.85 + j * 0.13);
            tl.fromTo(lab, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, at + 0.3 + j * 0.08);
          });
        } else if (card.chart === "line") {
          // A line that draws itself, with a light wash under it and a dot at the end.
          const plotTop = b.y + small, base = b.y + b.h - small * 1.9;
          const lo = 90, hi = 140;
          for (let k = 0; k < 3; k++) {
            const y = base - ((base - plotTop) * k) / 2;
            const line = el("line", { x1: b.x, x2: b.x + b.w, y1: y, y2: y, stroke: grid, "stroke-width": 1 }, g);
            tl.fromTo(line, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6 }, at + 0.2 + k * 0.08);
          }
          const dotR = Math.max(4, u * 0.014);
          const pts = card.points.map((v, k) => [
            b.x + dotR + ((b.w - dotR * 2) * k) / (card.points.length - 1),
            base - ((base - plotTop) * (v - lo)) / (hi - lo),
          ]);
          // Smooth curve through the points.
          let d = `M${pts[0][0]},${pts[0][1]}`;
          for (let k = 0; k < pts.length - 1; k++) {
            const p0 = pts[k - 1] || pts[k], p1 = pts[k], p2 = pts[k + 1], p3 = pts[k + 2] || p2;
            d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
          }
          const last = pts[pts.length - 1];
          const area = el("path", { d: `${d} L${last[0]},${base} L${pts[0][0]},${base} Z`, fill: card.color, "fill-opacity": 0.12 }, g);
          const path = el("path", { d, fill: "none", stroke: card.color, "stroke-width": Math.max(2, u * 0.009), "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
          const len = path.getTotalLength();
          path.style.strokeDasharray = len;
          const dot = el("circle", { cx: last[0], cy: last[1], r: dotR, fill: card.color, stroke: c.bg, "stroke-width": 2 }, g);
          const xl = [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
          card.labels.forEach((l, k) => {
            const lab = text(l, { x: pts[xl[k]][0], y: base + small * 1.45, "font-size": small, fill: muted, "text-anchor": k === 0 ? "start" : k === 2 ? "end" : "middle" }, g);
            tl.fromTo(lab, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, at + 0.3 + k * 0.1);
          });
          tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.5, ease: "power2.inOut" }, at + 0.35);
          tl.fromTo(area, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.8 }, at + 1.2);
          tl.fromTo(dot, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, at + 1.75);
        } else {
          // A donut that fills to the share, with a short note in the middle.
          const r = Math.min(b.w, b.h) * 0.41;
          const sw = r * 0.3;
          const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
          const circ = 2 * Math.PI * r;
          el("circle", { cx, cy, r, fill: "none", stroke: grid, "stroke-width": sw }, g);
          const arc = el("circle", { cx, cy, r, fill: "none", stroke: card.color, "stroke-width": sw, transform: `rotate(-90 ${cx} ${cy})` }, g);
          arc.style.strokeDasharray = circ;
          const mid = text(card.center, { x: cx, y: cy + r * 0.11, "font-size": r * 0.34, "font-weight": 700, fill: c.ink, "text-anchor": "middle", "letter-spacing": "-0.02em" }, g);
          fitWidth(mid, (r - sw / 2) * 1.6);
          tl.fromTo(arc, { strokeDashoffset: circ }, { strokeDashoffset: circ * (1 - card.share), duration: 1.5, ease: "power2.inOut" }, at + 0.3);
          tl.fromTo(mid, { autoAlpha: 0, scale: 0.8, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, at + 1.2);
        }

        // Progress fill for this card, then the card clears for the next one.
        tl.fromTo(fills[i], { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: CARD, ease: "none" }, at);
        tl.to(g, { autoAlpha: 0, y: -u * 0.03, duration: 0.4, ease: "power2.in" }, at + CARD - 0.45);
      });
      // Empty the progress bars together at the end of the loop.
      tl.to(fills, { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, cards.length * CARD - 0.3);
      tl.set(fills, { autoAlpha: 1, scaleX: 0 }, cards.length * CARD);

      tl.time(saved);
      apply();
    }

    // Reduced motion: hold the first card, fully drawn, as a still frame.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function apply() {
      if (reduce.matches) tl.pause().time(2.6, false);
      else tl.play();
    }
    reduce.addEventListener("change", apply);

    // Sound: every sound is made with the Web Audio API. It is off until the
    // parent page (or ?sound=1 / ?sound=effects) turns it on, and it follows the
    // GSAP timeline clock so ticks, pops and sweeps land on the charts.
    const sound = (() => {
      const beat = CARD / 8; // 133 bpm: two bars per card, six bars per loop
      const LEVEL = 0.7, MUSIC = 0.22;
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      let events = [];
      let ctx = null, master, impulse, noiseBuf, session = null, fxBus, musicBus, verbSend;
      let wantOn = false, wantMusic = true, playing = false;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0;

      // The list of sounds for one loop, worked out from the same numbers as the timeline.
      function plan() {
        const list = [];
        const add = (t, type, extra = {}, music = false) => list.push({ t, type, music, ...extra });
        const dings = [79, 81, 84]; // G, A, C: a brighter ding on each card
        cards.forEach((card, i) => {
          const at = i * CARD;
          // Count up: one soft tick per equal step of the number, so the ticks follow the
          // counting speed (power2.out: fast at first, slowing down), then a ding on the final value.
          const steps = Math.min(22, Math.max(8, Math.round(card.value)));
          let last = -1;
          for (let k = 1; k < steps; k++) {
            const t = at + 0.1 + 1.5 * (1 - Math.sqrt(1 - k / steps));
            if (t - last < 0.035) continue;
            last = t;
            add(t, "tick", { f: 2300 + 900 * (k / steps), v: 0.05 + 0.04 * (k / steps), p: -0.2 + 0.1 * (k % 2) });
          }
          add(at + 1.6, "ding", { f: hz(dings[i]) });
          add(at, "swoosh", { dir: 1 });
          add(at + CARD - 0.45, "swoosh", { dir: -1 });
          if (card.chart === "bars") {
            const notes = [67, 69, 72, 74];
            card.bars.forEach((v, j) => add(at + 0.35 + j * 0.13, "pop", { f: hz(notes[j % 4]), p: -0.45 + (0.9 * j) / Math.max(1, card.bars.length - 1), v: 0.3 }));
          } else if (card.chart === "line") {
            add(at + 0.35, "pen", { dur: 1.5 });
            add(at + 1.75, "pop", { f: hz(79), p: 0.4, v: 0.26 });
          } else {
            add(at + 0.3, "swell", { dur: 1.5, notes: [60, 64, 67, 71].map(hz) });
            add(at + 1.2, "pop", { f: hz(72), p: 0, v: 0.2 });
          }
        });

        // Music: light plucks and a soft pulse. C  G  Am  F  C  G, one chord per bar.
        const bars = [
          [[60, 64, 67, 72], 36], [[59, 62, 67, 71], 43], [[57, 60, 64, 69], 45],
          [[57, 60, 65, 69], 41], [[60, 64, 67, 72], 36], [[59, 62, 67, 74], 43],
        ];
        const arp = [0, 2, 1, 3, 2, 1, 3, 2];
        const accent = [1, 0.5, 0.75, 0.55, 0.9, 0.5, 0.75, 0.6];
        bars.forEach(([notes, root], b) => {
          const t0 = b * 4 * beat;
          add(t0, "pad", { dur: 4 * beat, notes: notes.slice(0, 3).map((m) => hz(m - 12)) }, true);
          for (let s = 0; s < 8; s++) {
            const t = t0 + (s * beat) / 2;
            add(t, "pluck", { f: hz(notes[arp[s]] + 12), v: accent[s] }, true);
            add(t, "bass", { f: hz(root), v: s % 2 ? 0.55 : 1 }, true);
            add(t, "shaker", { v: s % 2 ? 0.8 : 0.35 }, true);
            add(t + beat / 4, "shaker", { v: 0.2 }, true);
          }
          add(t0, "thump", {}, true);
          add(t0 + 2 * beat, "thump", {}, true);
        });
        return list.sort((a, b) => a.t - b.t);
      }
      events = plan();

      // Audio graph: effects and music buses, a small reverb, a compressor before the speakers.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);

        // Reverb impulse: stereo noise that fades out.
        const len = Math.floor(ctx.sampleRate * 1.4);
        impulse = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = impulse.getChannelData(ch);
          for (let s = 0; s < len; s++) d[s] = (Math.random() * 2 - 1) * Math.pow(1 - s / len, 3.5);
        }

        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const nd = noiseBuf.getChannelData(0);
        for (let s = 0; s < nd.length; s++) nd[s] = Math.random() * 2 - 1;
      }

      // Each time sound is turned on it gets fresh buses, so sounds queued before a
      // stop can never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.05);
        session.connect(master);
        fxBus = ctx.createGain();
        fxBus.connect(session);
        musicBus = ctx.createGain();
        musicBus.gain.value = wantMusic ? MUSIC : 0;
        musicBus.connect(session);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const tone = ctx.createBiquadFilter();
        tone.type = "lowpass";
        tone.frequency.value = 4000;
        const verbOut = ctx.createGain();
        verbOut.gain.value = 0.3;
        verbSend = ctx.createGain();
        verbSend.connect(verb).connect(tone).connect(verbOut).connect(session);
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.disconnect(), 250);
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function send(node, amount) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(verbSend);
      }

      // One function per sound.
      const voices = {
        tick(when, e) {
          // A tiny soft tick: a short sine blip with a breath of click on top.
          const g = amp(when, e.v, 0.001, 0.028, pan(e.p, fxBus));
          osc("sine", e.f, when, 0.04).connect(g);
          noise(when, 0.02).connect(filter("bandpass", 5200, 1.2)).connect(amp(when, e.v * 0.5, 0.001, 0.012, g));
        },
        ding(when, e) {
          // A clear little bell: the note, its octave and a soft fifth, with a long tail.
          const out = pan(0.1, fxBus);
          const g = amp(when, 0.34, 0.003, 1.3, out);
          osc("sine", e.f, when, 1.4).connect(g);
          osc("sine", e.f * 2, when, 0.8).connect(amp(when, 0.08, 0.002, 0.6, out));
          osc("sine", e.f * 1.5, when + 0.06, 1.0).connect(amp(when + 0.06, 0.12, 0.004, 0.9, out));
          osc("triangle", e.f * 4.02, when, 0.2).connect(amp(when, 0.03, 0.001, 0.12, out));
          send(g, 0.5);
        },
        pop(when, e) {
          // A soft bubbly pop that bends up a little.
          const g = amp(when, e.v, 0.004, 0.16, pan(e.p, fxBus));
          const o = osc("sine", e.f * 0.62, when, 0.2);
          o.frequency.exponentialRampToValueAtTime(e.f, when + 0.045);
          o.connect(g);
          const o2 = osc("triangle", e.f * 2, when, 0.1);
          o2.connect(amp(when, e.v * 0.12, 0.003, 0.07, g));
          send(g, 0.25);
        },
        pen(when, e) {
          // A smooth pen sweep that rises and pans left to right with the line.
          const d = e.dur;
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(-0.45, when);
          p.pan.linearRampToValueAtTime(0.45, when + d);
          p.connect(fxBus);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(0.16, when + d * 0.45);
          g.gain.linearRampToValueAtTime(0.12, when + d * 0.7);
          g.gain.linearRampToValueAtTime(0.0001, when + d + 0.05);
          g.connect(p);
          const bp = filter("bandpass", 900, 1.3);
          bp.frequency.setValueAtTime(900, when);
          bp.frequency.exponentialRampToValueAtTime(4200, when + d);
          noise(when, d + 0.1).connect(filter("highpass", 500)).connect(bp).connect(g);
          const o = osc("sine", hz(67), when, d + 0.1);
          o.frequency.exponentialRampToValueAtTime(hz(79), when + d);
          const tg = ctx.createGain();
          tg.gain.value = 0.35;
          o.connect(tg).connect(g);
          send(g, 0.3);
        },
        swell(when, e) {
          // A soft chord that opens up as the donut fills, then settles.
          const d = e.dur;
          const lp = filter("lowpass", 350, 1.5);
          lp.frequency.setValueAtTime(350, when);
          lp.frequency.exponentialRampToValueAtTime(2600, when + d);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.12, when + d * 0.85);
          g.gain.exponentialRampToValueAtTime(0.0001, when + d + 0.9);
          lp.connect(g).connect(pan(0.05, fxBus));
          e.notes.forEach((f, k) => {
            const o = osc("triangle", f, when, d + 1);
            o.detune.value = (k - 1.5) * 4;
            o.connect(lp);
          });
          const air = noise(when, d);
          const bp = filter("bandpass", 600, 0.9);
          bp.frequency.exponentialRampToValueAtTime(3000, when + d);
          air.connect(bp).connect(amp(when, 0.05, d * 0.8, d * 0.4, fxBus));
          send(g, 0.5);
        },
        swoosh(when, e) {
          // Card in (dir 1) or out (dir -1): a short airy swoosh.
          const f0 = e.dir > 0 ? 700 : 2400, f1 = e.dir > 0 ? 2600 : 600;
          const bp = filter("bandpass", f0, 1.1);
          bp.frequency.setValueAtTime(f0, when);
          bp.frequency.exponentialRampToValueAtTime(f1, when + 0.4);
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(-0.3 * e.dir, when);
          p.pan.linearRampToValueAtTime(0.3 * e.dir, when + 0.45);
          p.connect(fxBus);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.13, when + 0.16);
          g.gain.exponentialRampToValueAtTime(0.0001, when + 0.48);
          noise(when, 0.5).connect(bp).connect(g).connect(p);
          send(g, 0.2);
        },
        pluck(when, e) {
          const g = amp(when, 0.1 * e.v, 0.003, 0.3, musicBus);
          const lp = filter("lowpass", 3200, 1);
          lp.frequency.setValueAtTime(3200, when);
          lp.frequency.exponentialRampToValueAtTime(700, when + 0.2);
          lp.connect(g);
          osc("triangle", e.f, when, 0.34).connect(lp);
          osc("sine", e.f * 2, when, 0.2).connect(amp(when, 0.03 * e.v, 0.002, 0.12, g));
          send(g, 0.4);
        },
        bass(when, e) {
          const g = amp(when, 0.3 * e.v, 0.006, 0.18, musicBus);
          const lp = filter("lowpass", 500, 1);
          lp.connect(g);
          osc("triangle", e.f, when, 0.22).connect(lp);
          osc("sine", e.f, when, 0.22).connect(g);
        },
        pad(when, e) {
          const d = e.dur;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(0.05, when + 0.25);
          g.gain.setValueAtTime(0.05, when + d - 0.2);
          g.gain.linearRampToValueAtTime(0.0001, when + d + 0.05);
          const lp = filter("lowpass", 900);
          lp.connect(g).connect(musicBus);
          for (const f of e.notes) osc("sawtooth", f, when, d + 0.1).connect(lp);
          send(g, 0.4);
        },
        thump(when) {
          const o = osc("sine", 120, when, 0.3);
          o.frequency.exponentialRampToValueAtTime(48, when + 0.12);
          o.connect(amp(when, 0.45, 0.003, 0.25, musicBus));
        },
        shaker(when, e) {
          noise(when, 0.06).connect(filter("highpass", 7000)).connect(amp(when, 0.12 * e.v, 0.004, 0.04, musicBus));
        },
      };

      // Look-ahead scheduler: every 25 ms, schedule sounds due in the next 100 ms.
      // Timeline time is mapped to audio time by an anchor that is re-set after any jump
      // (a pause, a hidden tab, or the timeline being rebuilt on resize).
      function tick() {
        if (!playing || !tl || ctx.state !== "running") { anchor = null; return; }
        if (document.hidden || tl.paused() || reduce.matches) { anchor = null; return; }
        const loopLen = tl.duration();
        const now = tl.totalTime();
        const at = ctx.currentTime;
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.08) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          doneUpTo = now; // start fresh: nothing piles up
        }
        const cur = anchor.tl + (at - anchor.audio);
        const from = Math.max(doneUpTo, cur - 0.05); // after a stall, skip what is already late
        const to = cur + 0.1;
        if (to <= from) return;
        for (let k = Math.floor(from / loopLen); k <= Math.floor(to / loopLen); k++) {
          for (const e of events) {
            const t = k * loopLen + e.t;
            if (t < from || t >= to) continue;
            if (e.music && !wantMusic) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl)), e);
          }
        }
        doneUpTo = to;
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && !reduce.matches;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            openSession();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
          const t = ctx.currentTime;
          musicBus.gain.cancelScheduledValues(t);
          musicBus.gain.setTargetAtTime(wantMusic ? MUSIC : 0, t, 0.03);
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend(), 200);
        }
      }
      reduce.addEventListener("change", update);

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);

      addEventListener("message", (event) => {
        if (event.origin !== location.origin) return;
        const data = event.data;
        if (!data || data.type !== "motionprompt-sound") return;
        if (typeof data.on === "boolean") wantOn = data.on;
        if (typeof data.music === "boolean") wantMusic = data.music;
        update();
      });

      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantOn = true;
        wantMusic = fromUrl === "1";
        update();
      }
      return {};
    })();

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(build, 120);
    });

    // Wait briefly for the font so text is measured in the right face.
    Promise.race([
      document.fonts.load("700 1em 'Inter Variable'"),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(build);
  </script>
</body>
</html>
