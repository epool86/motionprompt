<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vintage archive demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.3.0/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/special-elite@5.3.0/400.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=ecdfc4&ink=3a2718&accent=8e2b22&accent2=a8864f */
    :root {
      --bg: #ecdfc4;
      --ink: #3a2718;
      --accent: #8e2b22;
      --accent2: #a8864f;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #2b1d12;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
    }

    /* Everything on the film moves together for a tiny projector weave */
    .film {
      position: absolute;
      inset: 0;
      will-change: transform;
    }
    .film > * { position: absolute; }
    .paper { inset: 0; width: 100%; height: 100%; }

    .head { text-align: center; }
    .land .head { text-align: left; }
    .kicker {
      font: 400 var(--kicker) / 1.2 "Special Elite", "Courier New", monospace;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      white-space: nowrap;
      margin-bottom: 0.35em;
    }
    .kicker .rest, .caption .rest { visibility: hidden; }
    h1 {
      margin: 0;
      font: 700 var(--title) / 1.04 "Playfair Display", Georgia, serif;
      letter-spacing: -0.005em;
      text-shadow: 0 0 0.02em rgb(58 39 24 / 0.35);
    }
    h1 .line { display: block; white-space: nowrap; }
    h1 .ch { display: inline-block; }
    /* A small printer's rule with a diamond under the title */
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(var(--kicker) * 0.5);
      margin-top: calc(var(--kicker) * 0.5);
      color: var(--accent2);
    }
    .land .ornament { justify-content: flex-start; transform-origin: 0 50%; }
    .ornament i {
      display: block;
      width: calc(var(--title) * 1.3);
      height: max(1px, calc(var(--title) * 0.03));
      background: currentColor;
    }
    .ornament b {
      width: calc(var(--kicker) * 0.5);
      height: calc(var(--kicker) * 0.5);
      background: currentColor;
      transform: rotate(45deg);
    }

    .print { position: absolute; }
    .print canvas.mount, .print canvas.top { position: absolute; pointer-events: none; }
    .print .win { position: absolute; overflow: hidden; background: #3b2c20; }
    .print .win canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    .caption {
      position: absolute;
      inset: 0;
      margin: 0;
      font: 400 var(--cap) / 1.4 "Special Elite", "Courier New", monospace;
      text-align: center;
      opacity: 0;
    }
    .land .caption { text-align: left; }
    /* Typewriter caret: an empty inline span, so it never changes where lines wrap */
    .caret { position: relative; }
    .caret::after {
      content: "";
      position: absolute;
      left: 0.06em;
      top: 0;
      width: 0.09em;
      height: 1.05em;
      background: currentColor;
      animation: blink 1s steps(1) infinite;
    }
    .typing .caret::after { animation: none; }
    @keyframes blink { 50% { opacity: 0; } }

    .tl { inset: 0; width: 100%; height: 100%; overflow: visible; }
    .tl path { fill: none; stroke: var(--ink); stroke-linecap: round; }
    .stamp {
      position: absolute;
      color: var(--accent);
      mix-blend-mode: multiply;
    }
    .stamp svg { display: block; width: 100%; height: 100%; overflow: visible; }

    .vignette {
      inset: 0;
      background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 55%, rgb(52 30 12 / 0.42) 100%);
      pointer-events: none;
    }
    .fx { inset: 0; width: 100%; height: 100%; pointer-events: none; }
    /* Warm light that blooms like film burning at the end of the reel */
    .burn {
      position: absolute;
      inset: -12%;
      visibility: hidden;
      background:
        radial-gradient(circle at 70% 40%, #fffaf0 0%, #fff0c8 12%, rgb(255 204 118) 28%, rgb(236 126 46) 50%, rgb(170 58 20) 74%, rgb(96 26 10) 100%);
    }
    /* A softer light leak from one side between chapters */
    .leak {
      position: absolute;
      inset: 0;
      visibility: hidden;
      background:
        radial-gradient(ellipse 45% 80% at 0% 45%, rgb(255 196 120 / 0.9), rgb(240 120 50 / 0.45) 45%, rgb(240 120 50 / 0) 75%);
    }
    .leak.right { transform: scaleX(-1); }

    @media (prefers-reduced-motion: reduce) {
      .caret::after { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" role="img">
    <div class="film" id="film">
      <canvas class="paper" id="paper"></canvas>
      <div id="prints"></div>
      <svg class="tl" id="tl" xmlns="http://www.w3.org/2000/svg">
        <path id="line1"></path>
        <path id="line2"></path>
        <path class="tick"></path>
        <path class="tick"></path>
        <path class="tick"></path>
        <path id="tip"></path>
      </svg>
      <div id="stamps"></div>
      <div class="head" id="head">
        <div class="kicker" id="kicker"></div>
        <h1 id="title"></h1>
        <div class="ornament" id="ornament"><i></i><b></b><i></i></div>
      </div>
      <div id="captions"></div>
    </div>
    <div class="vignette"></div>
    <canvas class="fx" id="fx"></canvas>
    <div class="leak" id="leak"></div>
    <div class="leak right" id="leak2"></div>
    <div class="burn" id="burn"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const root = document.documentElement;
    for (const key of ["bg", "ink", "accent", "accent2"]) {
      const value = params.get(key);
      if (/^[0-9a-f]{6}$/i.test(value ?? "")) root.style.setProperty(`--${key}`, `#${value}`);
    }
    const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
    const rgbOf = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));

    const title = (params.get("text") || "Our story").trim().slice(0, 40);
    const YEARS = ["1957", "1963", "1990"];
    const KICKER = "Since 1957";
    const CAPTIONS = [
      "1957. A small shop opens on a busy street.",
      "1963. Our goods travel the country by rail.",
      "1990. The next generation takes over.",
    ];
    const $ = (id) => document.getElementById(id);
    const stage = $("stage");
    stage.setAttribute("aria-label", `An old film history reel titled ${title}: sepia photos drop onto the page, typewriter captions type on, and a timeline stamps the years ${YEARS.join(", ")}.`);

    // Seeded random numbers, so the photos and paper look the same on every load.
    function rng(seed) {
      return () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const canvas = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });
    const gv = (v, a = 1) => {
      const c = Math.round(Math.max(0, Math.min(1, v)) * 255);
      return `rgba(${c},${c},${c},${a})`;
    };
    function poly(g, pts, fill) {
      g.beginPath();
      pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
      g.closePath();
      g.fillStyle = typeof fill === "number" ? gv(fill) : fill;
      g.fill();
    }
    function blob(g, x, y, rx, ry, fill) {
      g.beginPath();
      g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      g.fillStyle = typeof fill === "number" ? gv(fill) : fill;
      g.fill();
    }
    // A soft round puff with a feathered edge, cheaper than a blur filter
    function puff(g, x, y, r, v, a) {
      const rg = g.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, gv(v, a));
      rg.addColorStop(0.55, gv(v, a * 0.85));
      rg.addColorStop(1, gv(v, 0));
      g.fillStyle = rg;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    function vgrad(g, y0, y1, a, b) {
      const lg = g.createLinearGradient(0, y0, 0, y1);
      lg.addColorStop(0, gv(a));
      lg.addColorStop(1, gv(b));
      return lg;
    }

    // ---------- The three old photos, drawn in grey and then toned ----------

    // Photo 1: a street of old shophouses, drawn in real perspective.
    function street(g, w, h, rand) {
      const f = w * 0.56, cx = w * 0.6, cy = h * 0.5, eye = 1.6, SKY = 0.9;
      const P = (X, Y, Z) => [cx + (f * X) / Z, cy - (f * (Y - eye)) / Z];
      const hz = (v, Z) => v + (SKY - v) * (1 - Math.exp(-Z / 42));
      g.fillStyle = vgrad(g, 0, cy, 0.64, 0.9);
      g.fillRect(0, 0, w, cy + 2);
      for (let i = 0; i < 9; i++) {
        const x = rand() * w, y = rand() * cy * 0.6, r = w * (0.07 + rand() * 0.1);
        g.save();
        g.translate(x, y);
        g.scale(1, 0.3);
        puff(g, 0, 0, r, 0.97, 0.5);
        g.restore();
      }
      // Hazy buildings at the far end of the street
      for (let X = -8; X < 9; X += 1.6 + rand()) {
        const Hb = 5 + rand() * 9;
        poly(g, [P(X, 0, 95), P(X + 2.2, 0, 95), P(X + 2.2, Hb, 95), P(X, Hb, 95)], hz(0.45 + rand() * 0.1, 95));
      }
      // Road, ruts and the shade from the right hand buildings
      const road = g.createLinearGradient(0, cy, 0, h);
      road.addColorStop(0, gv(0.8));
      road.addColorStop(1, gv(0.5));
      poly(g, [P(-4.5, 0, 1), P(5.5, 0, 1), P(5.5, 0, 200), P(-4.5, 0, 200)], road);
      g.lineWidth = w * 0.002;
      for (const X of [-1.4, -0.4, 1.5, 2.6]) {
        g.strokeStyle = gv(0.4, 0.3);
        g.beginPath(); g.moveTo(...P(X, 0, 1.4)); g.lineTo(...P(X, 0, 200)); g.stroke();
      }
      poly(g, [P(5.5, 0, 1.5), P(2.4, 0, 1.5), P(3.8, 0, 200), P(5.5, 0, 200)], "rgba(0,0,0,0.2)");
      poly(g, [P(-4.5, 0, 1), P(-3.6, 0, 1), P(-3.6, 0, 200), P(-4.5, 0, 200)], gv(0.72));

      const rect = (X, Z0, Z1, Y0, Y1, v) => poly(g, [P(X, Y0, Z0), P(X, Y0, Z1), P(X, Y1, Z1), P(X, Y1, Z0)], v);
      function unit(X, Z0, Z1, lit) {
        const Zm = (Z0 + Z1) / 2, base = lit ? 0.64 + rand() * 0.1 : 0.4 + rand() * 0.08;
        const floors = rand() < 0.3 ? 3 : 2, top = floors === 3 ? 10.6 : 7.3 + rand() * 0.6;
        const t = (v) => hz(v, Zm);
        rect(X, Z0, Z1, 0, top, t(base));
        rect(X, Z0 + 0.4, Z1 - 0.4, top, top + 0.8, t(base - 0.04));
        rect(X, Z0, Z1, top - 0.45, top - 0.2, t(base + 0.14));
        // Arches of the covered walkway
        const aw = (Z1 - Z0 - 0.45 * 3) / 2;
        for (let j = 0; j < 2; j++) {
          const za = Z0 + 0.45 + j * (aw + 0.45), zb = za + aw, pts = [P(X, 0, za)];
          for (let s = 0; s <= 1.001; s += 0.1) pts.push(P(X, 2.3 + Math.sin(s * Math.PI) * 0.6, za + (zb - za) * s));
          pts.push(P(X, 0, zb));
          poly(g, pts, t(0.14));
          if (rand() < 0.4) rect(X, za, zb, 1.9, 2.5, t(lit ? 0.78 : 0.55));
        }
        // Shop sign across the front, with a few pale strokes for lettering
        rect(X, Z0 + 0.2, Z1 - 0.2, 3.0, 3.7, t(0.24));
        for (let k = 0; k < 4; k++) {
          const z = Z0 + 0.7 + k * ((Z1 - Z0 - 1.4) / 4);
          rect(X, z, z + (Z1 - Z0) * 0.12, 3.18, 3.52, t(0.82));
        }
        // Windows with open shutters
        for (let fl = 1; fl < floors; fl++) {
          const y0 = 4.1 + (fl - 1) * 3.1;
          for (let k = 0; k < 2; k++) {
            const z = Z0 + (Z1 - Z0) * (0.28 + k * 0.44) - 0.4;
            rect(X, z, z + 0.8, y0, y0 + 1.9, t(0.2));
            rect(X, z - 0.36, z - 0.04, y0, y0 + 1.9, t(base - 0.14));
            rect(X, z + 0.84, z + 1.16, y0, y0 + 1.9, t(base - 0.14));
            rect(X, z - 0.1, z + 0.9, y0 + 2.0, y0 + 2.15, t(base + 0.12));
          }
        }
        rect(X, Z0, Z0 + 0.14, 0, top, t(base - 0.16));
      }
      for (let Z = 70; Z - 4.2 > 1.3; Z -= 4.2) unit(5.5, Z - 4.2, Z, false);
      for (let Z = 72; Z - 4.4 > 1.2; Z -= 4.4) {
        unit(-4.5, Z - 4.4, Z, true);
        // Hanging vertical signboards
        if (Math.round(Z) % 3 === 0) {
          const Zs = Z - 4.4, v = hz(0.2, Zs);
          poly(g, [P(-4.5, 4.2, Zs), P(-3.7, 4.2, Zs), P(-3.7, 6.9, Zs), P(-4.5, 6.9, Zs)], v);
          for (let k = 0; k < 3; k++) poly(g, [P(-4.3, 4.5 + k * 0.8, Zs), P(-3.9, 4.5 + k * 0.8, Zs), P(-3.9, 5 + k * 0.8, Zs), P(-4.3, 5 + k * 0.8, Zs)], hz(0.8, Zs));
        }
      }
      // Telegraph poles and sagging wires
      const poles = [5, 12, 19, 27, 37, 50, 68];
      const arm = (X, Z) => P(X, 8.1, Z);
      g.lineCap = "round";
      poles.forEach((Z) => {
        g.strokeStyle = gv(hz(0.16, Z));
        g.lineWidth = (f * 0.2) / Z;
        g.beginPath(); g.moveTo(...P(4.1, 0, Z)); g.lineTo(...P(4.1, 8.6, Z)); g.stroke();
        g.lineWidth = (f * 0.1) / Z;
        g.beginPath(); g.moveTo(...arm(3.4, Z)); g.lineTo(...arm(4.8, Z)); g.stroke();
      });
      g.lineWidth = Math.max(1, w * 0.0014);
      g.strokeStyle = gv(0.2, 0.75);
      const wire = (a, b) => {
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2 + Math.hypot(b[0] - a[0], b[1] - a[1]) * 0.08;
        g.beginPath(); g.moveTo(...a); g.quadraticCurveTo(mx, my, ...b); g.stroke();
      };
      for (let i = 0; i < poles.length - 1; i++) {
        for (const X of [3.5, 4.1, 4.7]) wire(arm(X, poles[i]), arm(X, poles[i + 1]));
      }
      for (const X of [3.5, 4.7]) wire(P(X, 8.1, 2), arm(X, 5));
      wire(P(-4.5, 7, 11), arm(3.5, 12));
      wire(P(-4.5, 7.4, 25), arm(3.5, 27));
      // People, far first. Some wear hats, one holds a parasol.
      const people = [[1.2, 30, 0], [-2.2, 24, 1], [2.6, 16, 0], [0.4, 12, 2], [-3.0, 8.5, 1], [3.2, 6.5, 0]];
      people.forEach(([X, Z, kind]) => {
        const s = f / Z, [bx, by] = P(X, 0, Z), v = hz(0.16, Z);
        const fill = gv(v);
        poly(g, [[bx - 0.16 * s, by], [bx - 0.05 * s, by], [bx - 0.02 * s, by - 0.9 * s], [bx - 0.15 * s, by - 0.9 * s]], fill);
        poly(g, [[bx + 0.04 * s, by], [bx + 0.15 * s, by], [bx + 0.14 * s, by - 0.9 * s], [bx + 0.01 * s, by - 0.9 * s]], fill);
        poly(g, [[bx - 0.19 * s, by - 0.85 * s], [bx + 0.19 * s, by - 0.85 * s], [bx + 0.23 * s, by - 1.45 * s], [bx - 0.23 * s, by - 1.45 * s]], kind === 1 ? gv(v + 0.35) : fill);
        blob(g, bx, by - 1.58 * s, 0.11 * s, 0.12 * s, fill);
        if (kind === 1) {
          blob(g, bx, by - 1.68 * s, 0.2 * s, 0.04 * s, fill);
          poly(g, [[bx - 0.1 * s, by - 1.68 * s], [bx + 0.1 * s, by - 1.68 * s], [bx + 0.08 * s, by - 1.8 * s], [bx - 0.08 * s, by - 1.8 * s]], fill);
        }
        if (kind === 2) {
          g.beginPath();
          g.ellipse(bx, by - 1.9 * s, 0.45 * s, 0.22 * s, 0, Math.PI, 0);
          g.fillStyle = gv(v + 0.12);
          g.fill();
        }
      });
    }

    // Photo 2: a steam train crossing open country with a big plume of smoke.
    function train(g, w, h, rand) {
      g.save();
      g.scale(w / 800, h / 600);
      g.fillStyle = vgrad(g, 0, 380, 0.6, 0.88);
      g.fillRect(0, 0, 800, 390);
      // Hills, trees, fields
      const ridge = (y, amp, fr, v) => {
        const pts = [[0, 600]];
        for (let x = 0; x <= 800; x += 10) pts.push([x, y - Math.sin(x * fr + y) * amp - Math.sin(x * fr * 2.7) * amp * 0.4]);
        pts.push([800, 600]);
        poly(g, pts, v);
      };
      ridge(330, 26, 0.008, 0.74);
      ridge(365, 14, 0.013, 0.62);
      for (let x = -10; x < 810; x += 12 + rand() * 14) blob(g, x, 384 - rand() * 8, 14 + rand() * 14, 12 + rand() * 10, 0.42 + rand() * 0.08);
      g.fillStyle = vgrad(g, 385, 600, 0.6, 0.38);
      g.fillRect(0, 385, 800, 215);
      // Telegraph poles along the line
      g.strokeStyle = gv(0.35);
      g.lineWidth = 3;
      for (const x of [40, 290, 540, 790]) { g.beginPath(); g.moveTo(x, 430); g.lineTo(x, 318); g.moveTo(x - 12, 326); g.lineTo(x + 12, 326); g.stroke(); }
      g.lineWidth = 1;
      g.strokeStyle = gv(0.3, 0.8);
      for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(40, 326); g.quadraticCurveTo(165, 345, 290, 326); g.quadraticCurveTo(415, 345, 540, 326); g.quadraticCurveTo(665, 345, 790, 326); g.stroke(); }
      // Embankment and track
      poly(g, [[0, 440], [800, 440], [800, 470], [0, 470]], 0.66);
      poly(g, [[0, 470], [800, 470], [800, 600], [0, 600]], vgrad(g, 470, 600, 0.44, 0.3));
      g.strokeStyle = gv(0.55, 0.5);
      g.lineWidth = 1.5;
      for (let i = 0; i < 260; i++) {
        const x = rand() * 800, y = 475 + rand() * 125;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rand() - 0.5) * 6, y - 6 - rand() * 8); g.stroke();
      }
      for (let x = 0; x < 800; x += 13) poly(g, [[x, 452], [x + 7, 452], [x + 9, 459], [x - 2, 459]], 0.3);
      g.fillStyle = gv(0.18);
      g.fillRect(0, 448, 800, 4);
      g.fillStyle = gv(0.72);
      g.fillRect(0, 448, 800, 1.2);

      // Smoke: round puffs from the chimney, drifting up and back, lit from above
      for (let i = 26; i >= 0; i--) {
        const t = i / 26;
        const x = 180 + t * 600 + Math.sin(t * 7) * 22, y = 232 - Math.pow(t, 0.65) * 185 + Math.sin(t * 4) * 16;
        const r = 16 + t * 66, v = 0.26 + t * 0.52;
        for (let k = 0; k < 3; k++) {
          const px = x + (rand() - 0.5) * r * 1.2, py = y + (rand() - 0.5) * r * 0.7, pr = r * (0.7 + rand() * 0.4);
          puff(g, px, py, pr, v, 0.9);
          puff(g, px - pr * 0.2, py - pr * 0.25, pr * 0.7, v + 0.2, 0.5);
        }
      }

      // Wheels with spokes
      function wheel(x, y, r) {
        blob(g, x, y, r, r, 0.08);
        blob(g, x, y, r * 0.84, r * 0.84, 0.2);
        g.strokeStyle = gv(0.42);
        g.lineWidth = r * 0.08;
        for (let k = 0; k < 12; k++) {
          const a = (k / 12) * Math.PI * 2;
          g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r * 0.84, y + Math.sin(a) * r * 0.84); g.stroke();
        }
        blob(g, x, y, r * 0.2, r * 0.2, 0.38);
        g.strokeStyle = gv(0.5, 0.8);
        g.lineWidth = r * 0.06;
        g.beginPath(); g.arc(x, y, r * 0.95, Math.PI * 1.1, Math.PI * 1.6); g.stroke();
      }
      // Carriages trailing off to the right
      for (let c = 0; c < 2; c++) {
        const x0 = 612 + c * 170;
        poly(g, [[x0, 322], [x0 + 162, 322], [x0 + 162, 420], [x0, 420]], 0.3);
        g.beginPath(); g.ellipse(x0 + 81, 322, 84, 14, 0, Math.PI, 0); g.fillStyle = gv(0.2); g.fill();
        for (let k = 0; k < 5; k++) poly(g, [[x0 + 12 + k * 30, 338], [x0 + 32 + k * 30, 338], [x0 + 32 + k * 30, 368], [x0 + 12 + k * 30, 368]], 0.72);
        poly(g, [[x0, 390], [x0 + 162, 390], [x0 + 162, 394], [x0, 394]], 0.5);
        wheel(x0 + 30, 436, 14); wheel(x0 + 62, 436, 14); wheel(x0 + 102, 436, 14); wheel(x0 + 134, 436, 14);
      }
      // Tender full of coal
      poly(g, [[470, 330], [600, 330], [600, 422], [470, 422]], 0.2);

    // Paper outline of a print: straight, or deckled with small scallops.
    function outline(g, kind, x, y, w, h, rand) {
      g.beginPath();

      const edge = (x0, y0, x1, y1, count, nx, ny) => {
        for (let i = 0; i < count; i++) {

      edge(x + w, y, x + w, y + h, m, 1, 0);
      edge(x + w, y + h, x, y + h, n, 0, 1);

    function tape(g, cx, cy, tw, th, rot, rand) {
      g.save();

    // Draw one print's mount and top layer at its current size.

      g.restore();
      // Yellowed paper with a few specks
      outline(g, p.kind, 0, 0, w, h, rng(p.seed));
      g.save();
      g.clip();
      const lg = g.createLinearGradient(0, 0, w, h);
      lg.addColorStop(0, "rgba(160,110,50,0.05)");
      lg.addColorStop(1, "rgba(150,100,40,0.22)");
      g.fillStyle = lg;
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 30; i++) blob(g, rand() * w, rand() * h, w * 0.003, w * 0.003, "rgba(120,80,40,0.25)");
      if (p.kind === "cabinet") {
        // A thin gilt rule and a studio mark on the card
        g.strokeStyle = "rgba(140,104,52,0.8)";
        g.lineWidth = Math.max(0.6, w * 0.006);
        g.strokeRect(b * 0.45, b * 0.45, w - b * 0.9, ph + b * 1.1);
        g.fillStyle = "rgba(120,86,44,0.75)";
        g.fillRect(w * 0.3, ph + b + bb * 0.42, w * 0.4, Math.max(0.8, w * 0.01));
        g.fillRect(w * 0.38, ph + b + bb * 0.62, w * 0.24, Math.max(0.6, w * 0.006));
      }
      g.restore();
      // Top layer: photo corners or tape
      g = p.top.getContext("2d");
      g.setTransform(k, 0, 0, k, m * k, m * k);
      if (p.kind === "corners") {
        const L = w * 0.13, e = w * 0.012;
        [[0, 0, 1, 1], [w, 0, -1, 1], [w, h, -1, -1], [0, h, 1, -1]].forEach(([x, y, sx, sy]) => {
          g.save();
          g.shadowColor = "rgba(0,0,0,0.35)";
          g.shadowBlur = w * 0.012;
          g.shadowOffsetY = w * 0.004;
          poly(g, [[x - sx * e, y - sy * e], [x + sx * L, y - sy * e], [x - sx * e, y + sy * L]], "#2a1f17");
          g.restore();
          g.strokeStyle = "rgba(255,240,210,0.22)";
          g.lineWidth = Math.max(0.6, w * 0.004);
          g.beginPath(); g.moveTo(x + sx * L * 0.92, y); g.lineTo(x, y + sy * L * 0.92); g.stroke();
        });
      } else if (p.kind === "deckle") {
        tape(g, w * 0.06, h * 0.02, w * 0.3, w * 0.075, -0.75, rand);
        tape(g, w * 0.94, h * 0.02, w * 0.3, w * 0.075, 0.72, rand);
      } else {
        tape(g, w * 0.5, 0, w * 0.42, w * 0.1, -0.05, rand);
      }
      return { w, h };
    }

    function layout() {
      W = innerWidth;
      H = innerHeight;
      u = Math.min(W, H);
      land = W / H >= 1.15;
      stage.classList.toggle("land", land);
      drawPaper();
      const k = Math.min(devicePixelRatio || 1, 2), pad = Math.max(8, u * 0.06);
      measure.font = '700 100px "Playfair Display", Georgia, serif';
      const widest = Math.max(...lines.map((l) => measure.measureText(l).width)) / 100;

      // Timeline along the bottom, full width
      const x0 = pad * 1.1, x1 = W - pad * 1.1;
      const sd = Math.min(land ? H * 0.19 : u * 0.2, (x1 - x0) * 0.24, land ? H * 0.16 : H * 0.13);
      const lineY = H - pad - sd * 0.08;
      const tlTop = lineY - sd * 1.18;

      let region, headBox, capBox, titleFS, capFS, capLines;
      if (land) {
        const colX = W * 0.575, colW = W - pad - colX;
        region = { x: pad, y: pad, w: W * 0.535 - pad, h: tlTop - pad * 1.2 };
        titleFS = Math.min(H * 0.17, (colW * 0.98) / widest);
        capFS = Math.min(H * 0.048, colW / 17);
        capLines = 3;
        const kFS = Math.max(6, titleFS * 0.24);
        const headH = kFS * 1.6 + titleFS * 1.04 * lines.length + kFS * 1.1;
        const capH = capFS * 1.4 * capLines, total = headH + capFS * 1.2 + capH;
        const top = pad + Math.max(0, (region.h - total) / 2);
        headBox = { x: colX, y: top, w: colW, kFS };
        capBox = { x: colX, y: top + headH + capFS * 1.2, w: colW, h: capH };
      } else {
        titleFS = Math.min(W * 0.16, H * 0.1, ((W - 2 * pad) * 0.98) / widest);
        capFS = Math.min(u * 0.046, W / 21, H * 0.04);
        capLines = 2;
        const kFS = Math.max(6, Math.min(u * 0.036, titleFS * 0.3));
        const headH = kFS * 1.6 + titleFS * 1.04 * lines.length + kFS * 1.1;
        const capH = capFS * 1.4 * capLines;
        headBox = { x: pad, y: pad, w: W - 2 * pad, kFS };
        capBox = { x: pad, y: tlTop - capH - pad * 0.5, w: W - 2 * pad, h: capH };
        const ry = pad + headH + pad * 0.6;
        region = { x: pad, y: ry, w: W - 2 * pad, h: capBox.y - pad * 0.5 - ry };
      }
      stage.style.setProperty("--title", `${titleFS}px`);
      stage.style.setProperty("--kicker", `${headBox.kFS}px`);
      stage.style.setProperty("--cap", `${capFS}px`);
      Object.assign($("head").style, { left: `${headBox.x}px`, top: `${headBox.y}px`, width: `${headBox.w}px` });
      Object.assign($("captions").style, { left: `${capBox.x}px`, top: `${capBox.y}px`, width: `${capBox.w}px`, height: `${capBox.h}px` });

      // Prints: size them so the little stack fits the region, then spread them apart.
      const R = region;
      const pw0 = Math.min(R.w / 1.3, R.h / 1.06);
      const specs = [
        { pw: pw0, ph: pw0 * 0.75, b: pw0 * 0.055, bb: pw0 * 0.055 },
        { pw: pw0 * 0.96, ph: pw0 * 0.72, b: pw0 * 0.06, bb: pw0 * 0.06 },
        { pw: pw0 * 0.62, ph: pw0 * 0.775, b: pw0 * 0.065, bb: pw0 * 0.17 },
      ];
      const sizes = prints.map((p, i) => mountPrint(p, specs[i].pw, specs[i].ph, specs[i].b, specs[i].bb, k));
      const cx = R.x + R.w / 2, cy = R.y + R.h / 2;
      const spots = [[-0.8, -0.85], [0.85, 0.7], [0.05, 0.1]];
      sizes.forEach((s, i) => {
        const ox = Math.max(0, (R.w - s.w) / 2 - s.h * 0.06) * 0.95, oy = Math.max(0, (R.h - s.h) / 2 - s.w * 0.06) * 0.95;
        const [fx, fy] = spots[i];
        Object.assign(prints[i].el.style, { left: `${cx + fx * ox - s.w / 2}px`, top: `${cy + fy * oy - s.h / 2}px` });
      });

      // Timeline: a slightly wobbly ink line, a thin second rule, ticks and stamps.
      const rand = rng(9), pts = [], pts2 = [];
      for (let x = x0; x <= x1 + 0.1; x += Math.max(4, u * 0.012)) {
        pts.push(`${x.toFixed(1)} ${(lineY + (rand() - 0.5) * u * 0.003).toFixed(1)}`);
        pts2.push(`${x.toFixed(1)} ${(lineY + u * 0.012 + (rand() - 0.5) * u * 0.002).toFixed(1)}`);
      }
      $("tl").setAttribute("viewBox", `0 0 ${W} ${H}`);
      const l1 = $("line1"), l2 = $("line2");
      l1.setAttribute("d", `M${pts.join(" L")}`);
      l2.setAttribute("d", `M${pts2.join(" L")}`);
      for (const [el, sw, op] of [[l1, Math.max(1.2, u * 0.007), 1], [l2, Math.max(0.6, u * 0.0025), 0.55]]) {
        el.setAttribute("pathLength", "1");
        el.setAttribute("stroke-dasharray", "1 2");
        el.style.strokeWidth = sw;
        el.style.opacity = op;
      }
      const tick = sd * 0.16;
      document.querySelectorAll(".tick").forEach((el, i) => {
        const x = x0 + (x1 - x0) * MARKS[i];
        el.setAttribute("d", `M${x} ${lineY - tick} L${x} ${lineY + tick * 0.9}`);
        el.style.strokeWidth = Math.max(1, u * 0.005);
      });
      const tip = u * 0.014;
      $("tip").setAttribute("d", `M${x1 - tip * 1.4} ${lineY - tip} L${x1} ${lineY} L${x1 - tip * 1.4} ${lineY + tip}`);
      $("tip").style.strokeWidth = Math.max(1.2, u * 0.006);
      stamps.forEach((el, i) => {
        const x = x0 + (x1 - x0) * MARKS[i];
        Object.assign(el.style, { width: `${sd}px`, height: `${sd}px`, left: `${x - sd / 2}px`, top: `${lineY - tick - sd * 1.02}px` });
      });

      fx.width = Math.round(W);
      fx.height = Math.round(H);
      fxLast = -1;
      if (still) drawFx(0, STILL, true);
    }
    const MARKS = [0.16, 0.5, 0.84];

    // ---------- Film effects: grain, flicker, dust, a scratch and weave ----------

    let fxLast = -1;
    const film = $("film");
    function drawFx(frame, t, still) {
      const r = rng(frame * 7919 + 1);
      fg.setTransform(1, 0, 0, 1, 0, 0);
      fg.clearRect(0, 0, fx.width, fx.height);
      fg.save();
      fg.translate(-r() * 180, -r() * 180);
      fg.fillStyle = grains[frame % 3];
      fg.fillRect(0, 0, fx.width + 180, fx.height + 180);
      fg.restore();
      if (still) { film.style.transform = ""; return; }
      // Flicker: the light dips and lifts a little from frame to frame
      const dip = 0.02 + r() * 0.05;
      fg.fillStyle = `rgba(30,16,4,${dip.toFixed(3)})`;
      fg.fillRect(0, 0, fx.width, fx.height);
      if (r() < 0.12) {
        fg.fillStyle = "rgba(255,244,220,0.06)";
        fg.fillRect(0, 0, fx.width, fx.height);
      }
      // Dust specks and the odd hair, each for a single frame
      const s = u / 400;
      if (r() < 0.45) {
        for (let i = 0, n = 1 + Math.floor(r() * 3); i < n; i++) {
          const x = r() * W, y = r() * H;
          if (r() < 0.25) {
            fg.strokeStyle = "rgba(25,14,6,0.55)";
            fg.lineWidth = Math.max(0.7, s);
            fg.beginPath(); fg.moveTo(x, y);
            fg.bezierCurveTo(x + (r() - 0.5) * 30 * s, y + (r() - 0.5) * 30 * s, x + (r() - 0.5) * 30 * s, y + (r() - 0.5) * 30 * s, x + (r() - 0.5) * 40 * s, y + (r() - 0.5) * 40 * s);
            fg.stroke();
          } else {
            blob(fg, x, y, (0.8 + r() * 2.2) * s, (0.6 + r() * 1.8) * s, r() < 0.7 ? "rgba(25,14,6,0.6)" : "rgba(255,248,230,0.7)");
          }
        }
      }
      // A vertical scratch that wanders during parts of the reel
      for (const [a, b, x0] of [[1.6, 3.4, 0.72], [6.2, 7.3, 0.3], [9.6, 10.8, 0.62]]) {
        if (t < a || t > b) continue;
        const x = W * (x0 + (t - a) * 0.02) + (r() - 0.5) * u * 0.006;
        fg.fillStyle = `rgba(255,248,228,${(0.35 + r() * 0.3).toFixed(2)})`;
        fg.fillRect(x, 0, Math.max(1, u * 0.0025), H);
        fg.fillStyle = "rgba(40,24,10,0.18)";
        fg.fillRect(x + Math.max(1, u * 0.0025), 0, Math.max(1, u * 0.002), H);
      }
      // Gate weave: the whole picture shifts by a hair
      const wy = r() < 0.3 ? (r() - 0.5) * u * 0.004 : 0;
      film.style.transform = wy ? `translate(0px, ${wy.toFixed(2)}px)` : "";
    }

    // ---------- Typed text follows the timeline clock ----------

    const KICK = { at: 0.95, dur: 0.6 };
    const CAP = [{ at: 1.75, out: 3.62 }, { at: 5.0, out: 7.55 }, { at: 8.95, out: 99 }];
    function typeTo(tp, count, active) {
      if (tp.n === count && tp.active === active) return;
      tp.n = count;
      tp.active = active;
      tp.typed.textContent = tp.text.slice(0, count);
      tp.rest.textContent = tp.text.slice(count);
      tp.el.classList.toggle("typing", active);
    }
    const countAt = (tp, p) => (p <= 0 ? 0 : p >= 1 ? tp.text.length : tp.times.findIndex((x) => x > p));
    function sync(t) {
      typeTo(kicker, countAt(kicker, (t - KICK.at) / KICK.dur), false);
      caps.forEach((tp, i) => {
        const { at, out } = CAP[i], dur = tp.text.length * 0.042, p = (t - at) / dur;
        typeTo(tp, countAt(tp, p), p > 0 && p < 1);
        const o = t < at ? 0 : t < out ? 1 : Math.max(0, 1 - (t - out) / 0.3);
        if (tp.o !== o) tp.el.style.opacity = tp.o = o;
      });
    }

    // ---------- The 12 second reel ----------

    const L = 12;
    // Start values. A step rewound past its start returns to these.
    gsap.set(["#title .ch", "#ornament", ".print", ".stamp", ".tick", "#tip", ".leak"], { autoAlpha: 0 });
    gsap.set("#ornament", { scaleX: 0 });
    gsap.set(["#line1", "#line2"], { attr: { "stroke-dashoffset": 1 } });
    const tl = gsap.timeline({ repeat: -1, paused: true });
    // Each step applies its start values only when it begins.
    const fromTo = tl.fromTo.bind(tl);
    tl.fromTo = (targets, from, to, at) => fromTo(targets, from, { ...to, immediateRender: false }, at);

    // Burn fades out at the start (it peaked at the end of the last loop)
    tl.fromTo("#burn", { autoAlpha: 1, scale: 1, xPercent: 0 }, { autoAlpha: 0, scale: 1.08, xPercent: -4, duration: 0.75, ease: "power2.out" }, 0);
    // Title letters come up like ink soaking into paper
    tl.fromTo("#title .ch", { autoAlpha: 0, yPercent: 22, filter: "blur(6px)" }, { autoAlpha: 1, yPercent: 0, filter: "blur(0px)", duration: 0.8, stagger: 0.05, ease: "power2.out" }, 0.3);
    tl.fromTo("#ornament", { scaleX: 0, autoAlpha: 0 }, { scaleX: 1, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 0.9);

    const lines12 = ["#line1", "#line2"];
    tl.fromTo(lines12, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 1 - MARKS[0] }, duration: 0.8, ease: "power2.inOut" }, 0.5);
    const S = [0.7, 4.0, 8.0];
    prints.forEach((p, i) => {
      const at = S[i] + (i ? 0.15 : 0);
      tl.fromTo(p.el, { autoAlpha: 0, scale: 1.35, rotation: p.rot + 9, yPercent: -10 }, { autoAlpha: 1, scale: 1, rotation: p.rot, yPercent: 0, duration: 0.75, ease: "power3.out" }, at);
      // Ken Burns: a slow push in with a small drift
      const dir = i % 2 ? 1 : -1;
      tl.fromTo(p.img, { scale: 1.08, xPercent: -2 * dir, yPercent: 1 }, { scale: 1.2, xPercent: 2 * dir, yPercent: -1, duration: L - at, ease: "none" }, at);
      // The print underneath gets nudged as the new one lands
      if (i) tl.to(prints[i - 1].el, { rotation: prints[i - 1].rot - 1.5 * (i % 2 ? 1 : -1), xPercent: -2, duration: 0.5, ease: "power2.out" }, at + 0.35);
    });
    stamps.forEach((el, i) => {
      const at = i ? S[i] + 0.8 : 1.3, r = [-8, 6, -4][i];
      if (i) tl.fromTo(lines12, { attr: { "stroke-dashoffset": 1 - MARKS[i - 1] } }, { attr: { "stroke-dashoffset": 1 - MARKS[i] }, duration: 0.75, ease: "power2.inOut" }, S[i]);
      tl.fromTo(el, { autoAlpha: 0, scale: 2.3, rotation: r - 14 }, { autoAlpha: 1, scale: 1, rotation: r, duration: 0.24, ease: "power3.in" }, at)
        .fromTo(el, { scale: 1 }, { scale: 1.07, duration: 0.07, ease: "power1.out", yoyo: true, repeat: 1 }, at + 0.24)
        .fromTo(document.querySelectorAll(".tick")[i], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, at + 0.2);
    });
    tl.fromTo(lines12, { attr: { "stroke-dashoffset": 1 - MARKS[2] } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.out" }, 8.8);
    tl.fromTo("#tip", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 9.3);

    // Soft light leaks between chapters, then the film burns out at the end of the reel
    tl.fromTo("#leak", { autoAlpha: 0 }, { autoAlpha: 0.7, duration: 0.3, ease: "sine.out" }, 3.75)
      .to("#leak", { autoAlpha: 0, duration: 0.8, ease: "sine.in" }, 4.05)
      .fromTo("#leak2", { autoAlpha: 0 }, { autoAlpha: 0.6, duration: 0.3, ease: "sine.out" }, 7.75)
      .to("#leak2", { autoAlpha: 0, duration: 0.8, ease: "sine.in" }, 8.05);
    tl.to(["#head", "#prints", "#tl", "#stamps", "#captions"], { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 11.62);
    tl.fromTo("#burn", { autoAlpha: 0, scale: 1.25, xPercent: 6 }, { autoAlpha: 1, scale: 1, xPercent: 0, duration: 0.6, ease: "power2.in" }, L - 0.6);
    // Record every start value once, then rest at the start.
    tl.time(L - 0.001).time(0);

    // The ticker reads a flag, not the media query: reading .matches every frame
    // can swallow the change event in Chrome.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    const STILL = 10.9;
    let ready = false, still = false, lastFrame = -Infinity;
    gsap.ticker.add(() => {
      lastFrame = performance.now();
      if (!ready) return;
      sync(tl.time());
      if (still) return;
      const frame = Math.floor(performance.now() / 62.5);
      if (frame !== fxLast) {
        fxLast = frame;
        drawFx(frame, tl.time(), false);
      }
    });
    // Reduced motion: one still frame with everything in place, still grain, no flicker.
    function apply() {
      still = reduce.matches;
      if (still) {
        tl.pause(STILL);
        sync(STILL);
        drawFx(0, STILL, true);
      } else {
        tl.play();
      }
    }

    // ---- Sound ----
    // Every sound is made with the Web Audio API, nothing is loaded. It stays off until the parent
    // page (or ?sound=1 / ?sound=effects) turns it on, and it follows the GSAP timeline clock so the
    // typewriter, stamps and photos land with the frames they belong to.
    const sound = (() => {
      // Its own copy of the media query, read only when it changes (reading it every tick can swallow the change event).
      const motion = matchMedia("(prefers-reduced-motion: reduce)");
      let reduced = motion.matches;
      const LEVEL = 0.6, FX = 2.4, MUSIC = 0.8;
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      const toPan = (x) => Math.max(-0.8, Math.min(0.8, (x - 0.5) * 1.4));
      let ctx = null, master, impulse, white, pink, projector, crackle, session = null, gates = [], beds = null;
      let fxBus, fxVerb, musBus, musVerb, musTone;
      let wantOn = false, wantMusic = true, playing = false, fresh = true;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0;

      // Timeline time in seconds (it keeps counting across loops), or null while it is not running.
      function clock() {
        if (!ready || still || tl.paused() || performance.now() - lastFrame > 250) return null;
        return tl.totalTime();
      }

      // One loop of sounds, in loop seconds, worked out from the same numbers as the timeline.
      const events = (() => {
        const list = [];
        const add = (t, type, extra = {}, music = false) =>
          list.push({ t: ((t % L) + L) % L, type, music, ...extra });
        // Typewriter: one key per typed letter (same maths as sync), a bell and a return at each caption end.
        const keys = (tp, at, dur, pan0, pan1) => {
          [...tp.text].forEach((ch, i) => {
            const p = pan0 + (pan1 - pan0) * (i / Math.max(1, tp.text.length - 1));
            add(at + tp.times[i] * dur, ch === " " ? "space" : "key", { k: i * 7 + tp.text.length, p });
          });
        };
        keys(kicker, KICK.at, KICK.dur, -0.2, 0.2);
        caps.forEach((tp, i) => {
          const at = CAP[i].at, dur = tp.text.length * 0.042;
          keys(tp, at, dur, -0.35, 0.35);
          add(at + dur + 0.1, "bell", {});
          add(at + dur + 0.3, "carriage", {});
        });
        // Photos drop onto the page; the print below gets nudged.
        S.forEach((s, i) => {
          const at = s + (i ? 0.15 : 0);
          add(at, "photo", { p: [0.15, -0.15, 0.1][i] });
          if (i) add(at + 0.35, "nudge", {});
        });
        // The ink line draws to each mark, then a stamp thunks down on each year.
        add(0.5, "pen", { dur: 0.8, p0: -0.8, p1: toPan(MARKS[0]) });
        stamps.forEach((el, i) => {
          const at = i ? S[i] + 0.8 : 1.3;
          if (i) add(S[i], "pen", { dur: 0.75, p0: toPan(MARKS[i - 1]), p1: toPan(MARKS[i]) });
          add(at + 0.24, "stamp", { p: toPan(MARKS[i]) });
        });
        add(8.8, "pen", { dur: 0.6, p0: toPan(MARKS[2]), p1: 0.8 });
        // Warm light leaks, and the gentle burn out at the end of the reel.
        add(3.75, "leak", { p: -0.6 });
        add(7.75, "leak", { p: 0.6 });
        add(L - 0.6, "burn", {});

        // Music: an old-time waltz on a warm piano, 90 bpm in three, six bars fill the 12 s loop.
        // F, Dm, Bb, C7, F, C7. It plays through a gramophone-like tone with a light crackle (see beds).
        const BEAT = L / 18;
        const bars = [
          { bass: 41, chord: [57, 60, 65], tune: [[0, 69, 2], [2, 72, 1]] },
          { bass: 38, chord: [57, 62, 65], tune: [[0, 74, 2], [2, 72, 1]] },
          { bass: 34, chord: [58, 62, 65], tune: [[0, 70, 1], [1, 69, 1], [2, 67, 1]] },
          { bass: 36, chord: [58, 64, 67], tune: [[0, 67, 3]] },
          { bass: 41, chord: [57, 60, 65], tune: [[0, 69, 1], [1, 72, 1], [2, 77, 1]] },
          { bass: 36, chord: [55, 58, 64], tune: [[0, 76, 2], [2, 72, 1]] },
        ];
        bars.forEach((bar, k) => {
          const t0 = k * 3 * BEAT;
          add(t0, "piano", { notes: [bar.bass, bar.bass + 12], v: 0.8, len: 1.4 }, true);
          add(t0 + BEAT, "piano", { notes: bar.chord, v: 0.45, len: 0.5 }, true);
          add(t0 + 2 * BEAT, "piano", { notes: bar.chord, v: 0.4, len: 0.5 }, true);
          for (const [b, m, len] of bar.tune) add(t0 + b * BEAT, "piano", { notes: [m], v: 0.75, len: len * BEAT, tune: 1 }, true);
        });
        return list.sort((a, b) => a.t - b.t);
      })();

      // Audio graph: master gain into a gentle compressor, so nothing clips.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const sr = ctx.sampleRate;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16;
        comp.knee.value = 10;
        comp.ratio.value = 3;
        comp.attack.value = 0.004;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);
        const rand = rng(5);

        // White and pink noise.
        white = ctx.createBuffer(1, sr * 2, sr);
        pink = ctx.createBuffer(1, sr * 2, sr);
        const w = white.getChannelData(0), p = pink.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < w.length; i++) {
          const x = rand() * 2 - 1;
          w[i] = x;
          b0 = 0.99765 * b0 + x * 0.099046;
          b1 = 0.963 * b1 + x * 0.2965164;
          b2 = 0.57 * b2 + x * 1.0526913;
          p[i] = (b0 + b1 + b2 + x * 0.1848) * 0.2;
        }

        // A small warm room.
        const len = Math.floor(sr * 1.4);
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          let y = 0;
          for (let i = 0; i < len; i++) {
            y += 0.5 * ((rand() * 2 - 1) - y);
            d[i] = y * Math.pow(1 - i / len, 3) * 0.6;
          }
        }

        // The projector: one second that loops, 16 sprocket clicks with a softer shutter tick
        // between them, a whirr that pulses with the clicks and a low motor hum.
        projector = ctx.createBuffer(1, sr, sr);
        const pr = projector.getChannelData(0);
        let lp = 0;
        for (let i = 0; i < sr; i++) {
          const ph = (i / sr) * 16 % 1;
          lp += 0.08 * ((rand() * 2 - 1) - lp);
          pr[i] = lp * (0.35 + 0.65 * Math.pow(Math.sin(Math.PI * ph), 2)) * 0.5
            + 0.22 * Math.sin((2 * Math.PI * 48 * i) / sr) + 0.08 * Math.sin((2 * Math.PI * 96 * i) / sr);
        }
        for (let k = 0; k < 32; k++) {
          const at = Math.round((k * sr) / 32), big = k % 2 === 0, v = (big ? 1 : 0.45) * (0.8 + rand() * 0.4);
          for (let j = 0; j < sr * 0.006; j++) pr[(at + j) % sr] += (rand() * 2 - 1) * v * Math.exp(-j / (sr * 0.0012));
        }

        // Vinyl crackle: three seconds of sparse pops and a faint hiss.
        crackle = ctx.createBuffer(1, sr * 3, sr);
        const cr = crackle.getChannelData(0);
        for (let i = 0; i < cr.length; i++) cr[i] = (rand() * 2 - 1) * 0.02;
        for (let k = 0; k < 40; k++) {
          const at = Math.floor(rand() * cr.length), v = 0.15 + Math.pow(rand(), 3) * 0.85;
          for (let j = 0; j < sr * 0.002; j++) cr[(at + j) % cr.length] += (rand() * 2 - 1) * v * Math.exp(-j / (sr * 0.0004));
        }
      }

      // Each switch on gets fresh buses, so sounds booked before a switch off never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.08);
        session.connect(master);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        verb.connect(session);
        // Effects sit clearly above the music.
        [fxBus, fxVerb] = [session, verb].map((to) => {
          const g = ctx.createGain();
          g.gain.value = FX;
          g.connect(to);
          return g;
        });
        // Music goes through gates, so music:false silences it and its reverb too.
        musBus = ctx.createGain();
        musVerb = ctx.createGain();
        gates = [[musBus, session], [musVerb, verb]].map(([from, to]) => {
          const g = ctx.createGain();
          g.gain.value = wantMusic ? MUSIC : 0;
          from.connect(g).connect(to);
          return g;
        });
        // A gramophone tone for the piano: no deep lows, soft highs, a little warmth in the middle.
        musTone = filter("highpass", 140, 0.6);
        const mid = filter("peaking", 1100, 0.8);
        mid.gain.value = 3;
        musTone.connect(mid).connect(filter("lowpass", 3600, 0.6)).connect(musBus);
        beds = makeBeds(t);
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        for (const s of beds.sources) s.stop(t + 0.2);
        beds = null;
        setTimeout(() => old.disconnect(), 300);
      }
      function setGates() {
        const t = ctx.currentTime;
        for (const g of gates) {
          g.gain.cancelScheduledValues(t);
          g.gain.setValueAtTime(g.gain.value, t);
          g.gain.linearRampToValueAtTime(wantMusic ? MUSIC : 0, t + 0.12);
        }
      }

      // Continuous layers: the projector (an effect) and the record crackle (part of the music).
      // They stay silent until the reel runs, and hush when it stops.
      function makeBeds(t) {
        const loopSrc = (buf) => {
          const s = ctx.createBufferSource();
          s.buffer = buf;
          s.loop = true;
          s.start(t);
          return s;
        };
        const proj = ctx.createGain();
        proj.gain.value = 0;
        const ps = loopSrc(projector);
        ps.connect(filter("highpass", 90)).connect(filter("lowpass", 4200)).connect(proj).connect(pan(0.25, fxBus));
        const crack = ctx.createGain();
        crack.gain.value = 0;
        const cs = loopSrc(crackle);
        cs.connect(filter("highpass", 700)).connect(crack).connect(musBus);
        return { proj, crack, sources: [ps, cs], awake: false };
      }
      function wakeBeds(at) {
        if (!beds || beds.awake) return;
        beds.proj.gain.setTargetAtTime(0.06, at, 0.15);
        beds.crack.gain.setTargetAtTime(0.35, at, 0.15);
        beds.awake = true;
      }
      function hushBeds(at) {
        if (!beds || !beds.awake) return;
        beds.proj.gain.setTargetAtTime(0, at, 0.06);
        beds.crack.gain.setTargetAtTime(0, at, 0.06);
        beds.awake = false;
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      function swellGain(when, peak, rise, hold, fall, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, when);
        g.gain.linearRampToValueAtTime(peak, when + rise);
        g.gain.setValueAtTime(peak, when + rise + hold);
        g.gain.linearRampToValueAtTime(0, when + rise + hold + fall);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(buf, when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = buf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function wet(node, amount, music) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(music ? musVerb : fxVerb);
      }
      // Paper and pen texture: the level wobbles quickly and unevenly.
      function rough(when, dur, rate, depth) {
        const g = ctx.createGain();
        g.gain.value = 1 - depth * 0.5;
        const lp = filter("lowpass", rate);
        const amt = ctx.createGain();
        amt.gain.value = depth * 3;
        noise(white, when, dur).connect(lp).connect(amt).connect(g.gain);
        return g;
      }

      // One function per sound.
      const voices = {
        // A typewriter key: a sharp type bar strike, a small metal ring and the platen thud.
        key(when, e) {
          const v = 0.8 + ((e.k * 37) % 10) / 25, tone = 1 + (((e.k * 53) % 9) - 4) * 0.03;
          const p = pan(e.p, fxBus);
          noise(white, when, 0.02).connect(filter("bandpass", 3200 * tone, 1.2)).connect(amp(when, 0.22 * v, 0.001, 0.016, p));
          osc("triangle", 2150 * tone, when, 0.04).connect(amp(when, 0.035 * v, 0.001, 0.035, p));
          const thud = osc("sine", 190, when, 0.05);
          thud.frequency.exponentialRampToValueAtTime(110, when + 0.03);
          thud.connect(amp(when, 0.14 * v, 0.001, 0.035, p));
          wet(p, 0.12);
        },
        // The space bar: a duller, lower knock.
        space(when, e) {
          const p = pan(e.p, fxBus);
          noise(pink, when, 0.03).connect(filter("bandpass", 1100, 1.2)).connect(amp(when, 0.14, 0.001, 0.025, p));
          osc("sine", 150, when, 0.05).connect(amp(when, 0.12, 0.001, 0.04, p));
        },
        // The carriage bell at the end of a line.
        bell(when) {
          const p = pan(0.45, fxBus);
          for (const [k, v, d] of [[1, 0.09, 1.1], [2.41, 0.035, 0.6], [3.93, 0.015, 0.3]]) {
            osc("sine", 2250 * k, when, d + 0.02).connect(amp(when, v, 0.002, d, p));
          }
          wet(p, 0.4);
        },
        // The carriage returns: a quick ratchet run and a slide.
        carriage(when) {
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(0.45, when);
          p.pan.linearRampToValueAtTime(-0.35, when + 0.32);
          p.connect(fxBus);
          for (let i = 0; i < 9; i++) {
            const t = when + 0.3 * Math.pow(i / 9, 0.8);
            noise(white, t, 0.01).connect(filter("bandpass", 2600, 2)).connect(amp(t, 0.07, 0.001, 0.008, p));
          }
          noise(pink, when, 0.36).connect(filter("bandpass", 900, 0.9)).connect(swellGain(when, 0.05, 0.05, 0.2, 0.1, p));
          const stop = when + 0.34;
          osc("sine", 170, stop, 0.06).connect(amp(stop, 0.12, 0.002, 0.05, p));
        },
        // A photo drops onto the page: a soft rush of air, then it settles flat.
        photo(when, e) {
          const p = pan(e.p, fxBus);
          const n = noise(pink, when, 0.35);
          const bp = filter("bandpass", 1500, 0.7);
          bp.frequency.setValueAtTime(1500, when);
          bp.frequency.exponentialRampToValueAtTime(450, when + 0.32);
          n.connect(bp).connect(swellGain(when, 0.1, 0.12, 0, 0.2, p));
          const land = when + 0.3;
          noise(pink, land, 0.08).connect(filter("lowpass", 800)).connect(amp(land, 0.26, 0.003, 0.07, p));
          osc("sine", 125, land, 0.08).connect(amp(land, 0.12, 0.003, 0.07, p));
          wet(p, 0.2);
        },
        // The print below shifts a little: a tiny paper slide.
        nudge(when) {
          const n = noise(white, when, 0.2);
          n.connect(filter("bandpass", 2400, 0.8)).connect(rough(when, 0.2, 80, 0.6)).connect(swellGain(when, 0.03, 0.06, 0, 0.14, fxBus));
        },
        // A dip pen scratches the ink line across the page.
        pen(when, e) {
          const d = e.dur;
          const n = noise(white, when, d);
          const g = ctx.createGain();
          const curve = new Float32Array(17);
          for (let i = 0; i < 17; i++) {
            const u = i / 16;
            curve[i] = 0.05 * Math.sin(Math.PI * u) * (i ? 1 : 0);
          }
          g.gain.setValueCurveAtTime(curve, when, d);
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(e.p0, when);
          p.pan.linearRampToValueAtTime(e.p1, when + d);
          p.connect(fxBus);
          n.connect(filter("bandpass", 3800, 1.4)).connect(rough(when, d, 120, 0.9)).connect(g).connect(p);
        },
        // A rubber stamp thunks down on the year.
        stamp(when, e) {
          const p = pan(e.p, fxBus);
          const body = osc("sine", 120, when, 0.16);
          body.frequency.exponentialRampToValueAtTime(68, when + 0.1);
          body.connect(amp(when, 0.34, 0.002, 0.14, p));
          noise(pink, when, 0.07).connect(filter("bandpass", 420, 1.2)).connect(amp(when, 0.3, 0.002, 0.06, p));
          noise(white, when, 0.02).connect(filter("highpass", 2500)).connect(amp(when, 0.06, 0.001, 0.015, p));
          wet(p, 0.25);
        },
        // A warm light leak: a soft low swell of air from the side it comes from.
        leak(when, e) {
          const n = noise(pink, when, 1.2);
          const lp = filter("lowpass", 500, 0.7);
          lp.frequency.setValueAtTime(400, when);
          lp.frequency.linearRampToValueAtTime(1100, when + 0.3);
          lp.frequency.linearRampToValueAtTime(350, when + 1.1);
          n.connect(lp).connect(swellGain(when, 0.07, 0.3, 0, 0.8, pan(e.p, fxBus)));
        },
        // The film burns out: a gentle rising whoosh with a soft fizz, fading as the reel restarts.
        burn(when) {
          const n = noise(pink, when, 1.45);
          const bp = filter("bandpass", 350, 0.7);
          bp.frequency.setValueAtTime(350, when);
          bp.frequency.exponentialRampToValueAtTime(1800, when + 0.6);
          bp.frequency.exponentialRampToValueAtTime(500, when + 1.35);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.16, when + 0.6);
          g.gain.exponentialRampToValueAtTime(0.0001, when + 1.4);
          n.connect(bp).connect(g).connect(fxBus);
          wet(g, 0.4);
          const fizz = noise(white, when + 0.2, 1);
          fizz.connect(filter("highpass", 4000)).connect(rough(when + 0.2, 1, 300, 1.2)).connect(swellGain(when + 0.2, 0.03, 0.4, 0, 0.6, fxBus));
        },
        // Music: a warm piano note or chord (a few soft partials that fade, and a felt hammer).
        piano(when, e) {
          e.notes.forEach((m, i) => {
            const f = hz(m), t = when + i * 0.008, low = m < 48;
            const out = pan(Math.max(-0.5, Math.min(0.5, (m - 60) / 30)), musTone);
            const d = (low ? 2.4 : 1.6) * (e.tune ? 1.3 : 1);
            [[1, 1], [2, 0.42], [3, 0.16], [4, 0.07]].forEach(([k, v]) => {
              const o = osc(k === 1 ? "triangle" : "sine", f * k * (1 + 0.0004 * k * k), t, d / k + 0.1);
              o.connect(amp(t, 0.1 * e.v * v, 0.004, d / k, out));
            });
            noise(pink, t, 0.02).connect(filter("lowpass", 1500)).connect(amp(t, 0.03 * e.v, 0.001, 0.015, out));
            wet(out, 0.35, true);
          });
        },
      };

      // Look-ahead scheduler: every 25 ms, book the sounds due in the next 100 ms.
      // Timeline time maps to audio time through an anchor that is reset after any jump or pause.
      function pump() {
        const ok = playing && ctx.state === "running" && !document.hidden && !reduced;
        const now = ok ? clock() : null;
        const at = ctx.currentTime;
        if (now === null) {
          anchor = null;
          if (playing) hushBeds(at);
          return;
        }
        wakeBeds(at);
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.08) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          // After a switch on or a real gap, start from now (nothing piles up). After a small
          // hiccup, carry on from where booking stopped, so nothing plays twice or goes missing.
          if (fresh || now - doneUpTo > 0.3 || now < doneUpTo - 0.3) doneUpTo = now;
          fresh = false;
        }
        const from = doneUpTo, to = anchor.tl + (at - anchor.audio) + 0.1;
        if (to <= from) return;
        for (let k = Math.floor(from / L); k <= Math.floor(to / L); k++) {
          for (const e of events) {
            const t = k * L + e.t;
            if (t < from || t >= to || (e.music && !wantMusic)) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl)), e);
          }
        }
        doneUpTo = to;
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && !reduced;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            fresh = true;
            openSession();
            clearInterval(timer);
            timer = setInterval(pump, 25);
          }
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend().catch(() => {}), 200);
        }
      }
      function setMusic(on) {
        if (on === wantMusic) return;
        wantMusic = on;
        if (playing) setGates();
      }

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);
      motion.addEventListener("change", () => {
        reduced = motion.matches;
        update();
      });

      addEventListener("message", (event) => {
        const d = event.data;
        if (event.origin !== location.origin || !d || d.type !== "motionprompt-sound") return;
        if (typeof d.music === "boolean") setMusic(d.music);
        if (typeof d.on === "boolean") wantOn = d.on;
        update();
      });
      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantMusic = fromUrl === "1";
        wantOn = true;
        update();
      }
      return { update };
    })();

    let timer;
    addEventListener("resize", () => {
      clearTimeout(timer);
      timer = setTimeout(layout, 150);
    });

    // Wait briefly for the fonts so the title is measured in the right face.
    Promise.race([
      Promise.all([document.fonts.load('700 1em "Playfair Display"'), document.fonts.load('400 1em "Special Elite"')]),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => {
      reduce.addEventListener("change", apply);
      ready = true;
      layout();
      // Begin just after the peak of the burn, so the page does not open on a flash.
      tl.time(0.35);
      apply();
    });
  </script>
</body>
</html>
