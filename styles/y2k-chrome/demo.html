<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y2K chrome demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5.3.0/900.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=dcd6ff&ink=2b2f5c&accent=ff9ad8&accent2=8fd8ff */
    :root {
      --bg: #dcd6ff;
      --accent: #ff9ad8;
      --accent2: #8fd8ff;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      /* Pastel sky melting into silver */
      background: linear-gradient(172deg,
        color-mix(in srgb, var(--accent2) 45%, white) 0%,
        var(--bg) 34%,
        color-mix(in srgb, var(--accent) 38%, white) 58%,
        #eef0f6 80%,
        #c3c8d4 100%);
    }

    .stage {
      position: fixed;
      inset: 0;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" role="img">
    <canvas id="back" aria-hidden="true"></canvas>
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="front" aria-hidden="true"></canvas>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js";

    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => "#" + (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const colors = { bg: hex("bg", "dcd6ff"), ink: hex("ink", "2b2f5c"), accent: hex("accent", "ff9ad8"), accent2: hex("accent2", "8fd8ff") };
    for (const key of ["bg", "accent", "accent2"]) document.documentElement.style.setProperty(`--${key}`, colors[key]);
    const text = (params.get("text") || "Stay shiny").trim().slice(0, 40).toUpperCase();
    document.getElementById("stage").setAttribute("aria-label", `Y2K liquid chrome: a shiny morphing chrome blob with a chrome star, bubbles, holographic stickers, sparkles and the words ${text}`);

    const LOOP = 10; // seconds
    const TAU = Math.PI * 2;
    const FONT = '900 100px Unbounded, "Arial Black", sans-serif';

    const back = document.getElementById("back"), bctx = back.getContext("2d");
    const front = document.getElementById("front"), fctx = front.getContext("2d");
    const glCanvas = document.getElementById("gl");

    // ---- Three.js: renderer, camera and a pastel studio to reflect ----
    const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0, 10);

    // A sky dome with a sharp bright horizon and a dark floor: the classic chrome look,
    // plus soft coloured bands and a few bright panels for crisp highlights.
    function makeEnvironment() {
      const env = new THREE.Scene();
      const c = (h) => new THREE.Color(h);
      const sky = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
          top: { value: c(colors.bg) }, low: { value: c(colors.accent) }, cool: { value: c(colors.accent2) },
          dark: { value: c(colors.ink) }, floor: { value: c(colors.bg) },
        },
        vertexShader: "varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
        fragmentShader: `
          uniform vec3 top, low, cool, dark, floor;
          varying vec3 vDir;
          void main() {
            float y = vDir.y;
            float az = atan(vDir.z, vDir.x);
            // Sky: pastel near the horizon, bright white higher up.
            vec3 band = mix(low, cool, 0.5 + 0.5 * sin(az * 2.0 + 0.6));
            vec3 skyCol = mix(band * 1.1, vec3(1.3), smoothstep(0.2, 0.9, y));
            // Big soft dark patches in the sky give chrome its contrast.
            float patches = smoothstep(0.5, 0.95, 0.5 + 0.5 * sin(az * 2.0 - 1.2)) * smoothstep(0.08, 0.3, y) * smoothstep(0.9, 0.55, y);
            skyCol = mix(skyCol, dark * 0.25, patches);
            // Floor: a deep band under the horizon, then a soft pastel floor.
            vec3 ground = mix(dark * 0.08, mix(floor, band, 0.45) * 0.85, smoothstep(-0.2, -0.75, y));
            vec3 col = y > 0.0 ? skyCol : ground;
            col += vec3(1.6) * smoothstep(0.03, 0.0, abs(y - 0.02));
            gl_FragColor = vec4(col, 1.0);
          }`,
      });
      env.add(new THREE.Mesh(new THREE.SphereGeometry(40, 64, 32), sky));
      const panel = (w, h, color, strength, pos) => {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c(color).multiplyScalar(strength), side: THREE.DoubleSide }));
        m.position.set(...pos);
        m.lookAt(0, 0, 0);
        env.add(m);
      };
      panel(26, 3, "#ffffff", 5, [0, 15, 12]);
      panel(3, 20, "#ffffff", 4, [-16, 4, 10]);
      panel(2, 12, "#ffffff", 3, [12, 8, 12]);
      panel(8, 14, colors.accent, 2.4, [16, 2, 6]);
      panel(10, 6, colors.accent2, 2.4, [4, -3, 18]);
      const pmrem = new THREE.PMREMGenerator(renderer);
      const target = pmrem.fromScene(env, 0.02);
      pmrem.dispose();
      return target.texture;
    }
    scene.environment = makeEnvironment();

    // Chrome with a thin film of rainbow on top, for the holographic sheen.
    const chrome = (tint, rough = 0.06) => new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(tint), metalness: 1, roughness: rough,
      iridescence: 1, iridescenceIOR: 1.6, iridescenceThicknessRange: [220, 680],
    });

    // ---- The liquid blob: a sphere pushed around by looping 3D noise on the GPU ----
    const blobUniforms = { uPhase: { value: 0 }, uAmp: { value: 0.3 } };
    const blobMat = chrome("#f4f0ff", 0.025);
    blobMat.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, blobUniforms);
      shader.vertexShader = shader.vertexShader
        .replace("#include <common>", `#include <common>
          uniform float uPhase;
          uniform float uAmp;
          vec3 blobPos;
          vec4 permute(vec4 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
          vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
          float snoise(vec3 v) {
            const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + 2.0 * C.xxx;
            vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
            i = mod(i, 289.0);
            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 1.0 / 7.0;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0) * 2.0 + 1.0;
            vec4 s1 = floor(b1) * 2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
          }
          // The noise travels round a circle, so the shape comes back to the start every loop.
          vec3 displaced(vec3 n) {
            vec3 o1 = vec3(cos(uPhase), sin(uPhase), 0.0) * 0.6;
            vec3 o2 = vec3(0.0, cos(uPhase * 2.0), sin(uPhase * 2.0)) * 0.35;
            float d = snoise(n * 0.6 + o1) * 0.7 + snoise(n * 0.9 + o2 + 4.0) * 0.3;
            return n * (1.0 + uAmp * d);
          }`)
        .replace("#include <beginnormal_vertex>", `
          vec3 n0 = normalize(position);
          vec3 tng = normalize(cross(n0, abs(n0.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
          vec3 btg = cross(n0, tng);
          blobPos = displaced(n0);
          vec3 pa = displaced(normalize(n0 + tng * 0.01));
          vec3 pb = displaced(normalize(n0 + btg * 0.01));
          vec3 objectNormal = normalize(cross(pa - blobPos, pb - blobPos));`)
        .replace("#include <begin_vertex>", "vec3 transformed = blobPos;");
    };
    let blobGeo = null;
    const blob = new THREE.Mesh(new THREE.BufferGeometry(), blobMat);
    scene.add(blob);

    // A chunky chrome star.
    function starShape(r, inner) {
      const s = new THREE.Shape();
      for (let i = 0; i < 10; i++) {
        const a = Math.PI / 2 + (i / 10) * TAU;
        const k = i % 2 ? r * inner : r;
        i ? s.lineTo(Math.cos(a) * k, Math.sin(a) * k) : s.moveTo(Math.cos(a) * k, Math.sin(a) * k);
      }
      return s;
    }
    const starGeo = new THREE.ExtrudeGeometry(starShape(1, 0.48), { depth: 0.28, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.14, bevelSegments: 6, curveSegments: 4 });
    starGeo.center();
    const star3d = new THREE.Mesh(starGeo, chrome("#e8eeff", 0.08));
    scene.add(star3d);

    // A pink chrome ring that orbits the blob, and a few bubbles.
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.36, 32, 72), chrome(colors.accent, 0.1));
    scene.add(ring);
    const bubbleGeo = new THREE.SphereGeometry(1, 48, 32);
    const bubbles = [colors.accent2, "#ffffff", colors.bg].map((c) => {
      const m = new THREE.Mesh(bubbleGeo, chrome(c, 0.05));
      scene.add(m);
      return m;
    });

    // ---- Layout: everything is placed in pixels, then turned into world units ----
    let W = 0, H = 0, U = 0, dpr = 1, ppu = 1, L = null, head = null;

    const toWorld = (x, y) => [(x - W / 2) / ppu, -(y - H / 2) / ppu];
    const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

    function layout() {
      W = innerWidth; H = innerHeight; U = Math.min(W, H);
      dpr = Math.min(devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(W, H, false);
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      ppu = H / (2 * 10 * Math.tan(THREE.MathUtils.degToRad(15)));
      for (const c of [back, front]) {
        c.width = Math.round(W * dpr);
        c.height = Math.round(H * dpr);
      }

      const a = W / H;
      const rb = a < 0.8 ? Math.min(W * 0.36, H * 0.24) : Math.min(W * 0.34, H * (a > 1.3 ? 0.3 : 0.25));
      const cx = W / 2, cy = a < 0.8 ? H * 0.41 : H * 0.4;
      const m = U * 0.06;
      L = { cx, cy, rb, a };

      // Blob mesh detail follows the size on screen.
      const seg = rb * dpr > 220 ? 150 : 96;
      if (!blobGeo || blobGeo.userData.seg !== seg) {
        if (blobGeo) blobGeo.dispose();
        blobGeo = new THREE.SphereGeometry(1, seg, Math.round(seg * 0.75));
        blobGeo.userData.seg = seg;
        blob.geometry = blobGeo;
      }

      // Supporting shapes around the blob, kept inside the frame.
      const sr = rb * 0.3;
      L.star = { x: clamp(cx + rb * 1.3, sr * 1.4 + m, W - sr * 1.4 - m), y: clamp(cy - rb * 0.95, sr * 1.4 + m, H), r: sr };
      L.ringR = rb * 0.17;
      L.bubbles = [
        { x: cx - rb * 1.25, y: cy + rb * 0.15, r: rb * 0.15 },
        { x: cx + rb * 1.12, y: cy + rb * 0.05, r: rb * 0.09 },
        { x: cx - rb * 0.7, y: cy - rb * 1.12, r: rb * 0.07 },
      ].map((b) => ({ ...b, x: clamp(b.x, b.r + m * 0.5, W - b.r - m * 0.5), y: clamp(b.y, b.r + m * 0.5, H - b.r - m * 0.5) }));

      head = buildHeadline();

      // Stickers: a butterfly up top and a star down below.
      const bs = Math.max(14, rb * 0.36);
      L.butterfly = { x: clamp(cx - rb * 1.25, bs * 1.2 + m * 0.5, W - bs * 1.2), y: clamp(cy - rb * 0.9, bs + m * 0.5, H), s: bs };
      const ss = Math.max(12, rb * 0.26);
      const below = head.bottom + ss * 1.4;
      L.sticker = a < 0.8 && below < H - ss - m * 0.5
        ? { x: cx + rb * 0.85, y: below, s: ss }
        : { x: clamp(cx + rb * 1.55, ss + m, W - ss - m * 0.5), y: clamp(cy + rb * 0.75, ss, H - ss - m * 0.5), s: ss };

      drawBack();
    }

    // ---- Background: soft glow, a perspective grid and the blob's shadow ----
    function drawBack() {
      const g = bctx;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      const { cx, cy, rb } = L;
      const glow = g.createRadialGradient(cx, cy, rb * 0.2, cx, cy, rb * 2.2);
      glow.addColorStop(0, "rgba(255, 255, 255, 0.85)");
      glow.addColorStop(1, "rgba(255, 255, 255, 0)");
      g.fillStyle = glow;
      g.fillRect(0, 0, W, H);

      const horizon = Math.min(H * 0.8, cy + rb * 0.55);
      const floorH = H - horizon;
      g.save();
      g.beginPath();
      g.rect(0, horizon, W, floorH);
      g.clip();
      g.lineWidth = Math.max(0.7, U / 450);
      const fade = g.createLinearGradient(0, horizon, 0, H);
      fade.addColorStop(0, "rgba(255, 255, 255, 0)");
      fade.addColorStop(1, "rgba(255, 255, 255, 0.95)");
      g.strokeStyle = fade;
      g.beginPath();
      for (let k = 1; k < 30; k++) {
        const y = horizon + floorH / (k * 0.45);
        if (y < horizon + 1) break;
        g.moveTo(0, y);
        g.lineTo(W, y);
      }
      const gap = U * 0.14;
      for (let i = -24; i <= 24; i++) {
        g.moveTo(W / 2 + i * gap * 0.25, horizon);
        g.lineTo(W / 2 + i * gap * 1.8, H + floorH);
      }
      g.stroke();
      g.restore();

      const shadow = g.createRadialGradient(cx, 0, 0, cx, 0, rb * 1.1);
      shadow.addColorStop(0, "rgba(60, 50, 110, 0.28)");
      shadow.addColorStop(1, "rgba(60, 50, 110, 0)");
      g.save();
      g.translate(0, cy + rb * 1.28);
      g.scale(1, 0.16);
      g.fillStyle = shadow;
      g.fillRect(cx - rb * 1.2, -rb * 1.2, rb * 2.4, rb * 2.4);
      g.restore();
    }

    function makeCanvas(w, h) {
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(w * dpr));
      c.height = Math.max(1, Math.round(h * dpr));
      const g = c.getContext("2d");
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      return [c, g];
    }

    // ---- The chrome headline, drawn once per size ----
    function buildHeadline() {
      const { cx, cy, rb, a } = L;
      fctx.font = FONT;
      const widthOf = (s) => fctx.measureText(s).width / 100;
      const words = text.split(/\s+/).filter(Boolean);
      const options = [[words.join(" ")]];
      for (let i = 1; i < words.length; i++) options.push([words.slice(0, i).join(" "), words.slice(i).join(" ")]);
      const maxW = W * 0.88;
      const top = cy + rb * (a > 1.3 ? 0.45 : 0.62);
      const maxH = Math.min(H * 0.94 - top, rb * (a < 0.8 ? 1.45 : 1.25));
      let best = null;
      for (const lines of options) {
        const size = Math.min(maxW / (Math.max(...lines.map(widthOf)) * 1.04), maxH / (lines.length * 1.08), U * 0.2);
        if (!best || size > best.size * 1.05) best = { lines, size };
      }
      const { lines, size } = best;
      const lh = size * 1.08;
      const pad = size * 0.35;
      const bw = Math.max(...lines.map(widthOf)) * size * 1.04 + pad * 2;
      const bh = lines.length * lh + pad * 2;
      const [c, g] = makeCanvas(bw, bh);
      const [mask, gm] = makeCanvas(bw, bh);
      const font = FONT.replace("100px", `${size}px`);
      for (const ctx of [g, gm]) {
        ctx.font = font;
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
      }
      const cap = g.measureText("H").actualBoundingBoxAscent;
      const base = (i) => pad + lh * i + (lh + cap) / 2;
      const each = (fn) => lines.forEach((line, i) => fn(line, base(i)));

      // Soft coloured shadow and a short extrusion for depth.
      const depth = Math.max(2, Math.round(size * 0.07));
      each((line, y) => {
        g.save();
        g.shadowColor = "rgba(70, 50, 140, 0.45)";
        g.shadowBlur = size * 0.25;
        g.shadowOffsetY = size * 0.1;
        g.fillStyle = colors.ink;
        g.fillText(line, bw / 2, y + depth);
        g.restore();
        for (let d = depth; d > 0; d--) {
          g.fillStyle = d > depth / 2 ? colors.ink : "#6d6aa8";
          g.fillText(line, bw / 2, y + d);
        }
      });
      // Dark outline, then a bright silver rim, then the mirror fill.
      each((line, y) => {
        g.lineJoin = "round";
        g.lineWidth = size * 0.12;
        g.strokeStyle = colors.ink;
        g.strokeText(line, bw / 2, y);
        const rim = g.createLinearGradient(0, y - cap, 0, y);
        rim.addColorStop(0, "#ffffff");
        rim.addColorStop(0.5, "#aab3cc");
        rim.addColorStop(1, "#ffffff");
        g.lineWidth = size * 0.07;
        g.strokeStyle = rim;
        g.strokeText(line, bw / 2, y);
        const fill = g.createLinearGradient(0, y - cap, 0, y);
        fill.addColorStop(0, "#ffffff");
        fill.addColorStop(0.25, "#e4ecff");
        fill.addColorStop(0.47, colors.accent2);
        fill.addColorStop(0.5, colors.ink);
        fill.addColorStop(0.56, "#7a64b8");
        fill.addColorStop(0.78, colors.accent);
        fill.addColorStop(1, "#fff6fb");
        g.fillStyle = fill;
        g.fillText(line, bw / 2, y);
        gm.fillText(line, bw / 2, y);
      });
      // Faint rainbow film over the letters.
      const [film, gf] = makeCanvas(bw, bh);
      const rainbow = gf.createLinearGradient(0, 0, bw, 0);
      ["#ffb3e6", "#c9b6ff", "#9fe7ff", "#b8ffd9", "#fff3a8", "#ffb3e6"].forEach((col, i, arr) => rainbow.addColorStop(i / (arr.length - 1), col));
      gf.fillStyle = rainbow;
      gf.fillRect(0, 0, bw, bh);
      gf.globalCompositeOperation = "destination-in";
      gf.setTransform(1, 0, 0, 1, 0, 0);
      gf.drawImage(mask, 0, 0);
      g.save();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalAlpha = 0.28;
      g.globalCompositeOperation = "overlay";
      g.drawImage(film, 0, 0);
      g.restore();

      const [sweep, gs] = makeCanvas(bw, bh);
      const textTop = base(0) - cap, textBottom = base(lines.length - 1);
      return { c, mask, sweep, gs, w: bw, h: bh, x: cx - bw / 2, y: top - pad, bottom: top + lines.length * lh, size, cap, textTop, textBottom, lines };
    }

    // ---- Small 2D pieces: glints and holographic stickers ----
    function glint(g, x, y, s, spin) {
      g.save();
      g.translate(x, y);
      g.rotate(spin);
      const halo = g.createRadialGradient(0, 0, 0, 0, 0, s * 0.9);
      halo.addColorStop(0, "rgba(255, 255, 255, 0.9)");
      halo.addColorStop(1, "rgba(255, 255, 255, 0)");
      g.fillStyle = halo;
      g.beginPath();
      g.arc(0, 0, s * 0.9, 0, TAU);
      g.fill();
      g.fillStyle = "#ffffff";
      g.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TAU;
        const r = i % 2 ? s * 0.12 : s * (i % 4 ? 0.7 : 1.25);
        g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      g.closePath();
      g.fill();
      g.restore();
    }

    function holo(g, s, t) {
      const a = t * TAU * 0.1;
      const grad = g.createLinearGradient(-Math.cos(a) * s, -Math.sin(a) * s, Math.cos(a) * s, Math.sin(a) * s);
      ["#ffb3e6", "#c9b6ff", "#9fe7ff", "#b8ffd9", "#fff3a8", "#ffb3e6"].forEach((col, i, arr) => grad.addColorStop(i / (arr.length - 1), col));
      return grad;
    }

    // Draw a sticker: a white die-cut border with a soft shadow, a holographic face and a gloss.
    function sticker(g, s, t, path) {
      g.lineJoin = "round";
      g.save();
      g.shadowColor = "rgba(60, 40, 120, 0.3)";
      g.shadowBlur = s * 0.25;
      g.shadowOffsetY = s * 0.08;
      path();
      g.lineWidth = s * 0.22;
      g.strokeStyle = "#ffffff";
      g.stroke();
      g.restore();
      path();
      g.lineWidth = s * 0.22;
      g.strokeStyle = "#ffffff";
      g.stroke();
      g.fillStyle = holo(g, s, t);
      g.fill();
      g.lineWidth = Math.max(1, s * 0.04);
      g.strokeStyle = colors.ink;
      g.globalAlpha = 0.55;
      g.stroke();
      g.globalAlpha = 1;
    }

    function butterfly(g, x, y, s, t, phase) {
      const flap = 0.72 + 0.28 * Math.cos(phase * 6);
      g.save();
      g.translate(x, y + Math.sin(phase * 2) * s * 0.12);
      g.rotate(-0.25 + Math.sin(phase) * 0.08);
      const wings = () => {
        g.beginPath();
        for (const side of [1, -1]) {
          const k = side * flap * s;
          g.moveTo(0, -0.05 * s);
          g.bezierCurveTo(0.25 * k, -0.95 * s, 1.05 * k, -1.0 * s, 0.98 * k, -0.4 * s);
          g.bezierCurveTo(0.95 * k, -0.08 * s, 0.5 * k, 0.02 * s, 0.1 * k, 0.04 * s);
          g.bezierCurveTo(0.6 * k, 0.1 * s, 0.85 * k, 0.45 * s, 0.62 * k, 0.72 * s);
          g.bezierCurveTo(0.42 * k, 0.95 * s, 0.1 * k, 0.6 * s, 0, 0.12 * s);
          g.closePath();
        }
      };
      sticker(g, s, t, wings);
      g.fillStyle = colors.ink;
      g.beginPath();
      g.ellipse(0, 0.08 * s, 0.07 * s, 0.46 * s, 0, 0, TAU);
      g.fill();
      g.lineWidth = Math.max(1, s * 0.045);
      g.strokeStyle = colors.ink;
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(-0.02 * s, -0.34 * s);
      g.quadraticCurveTo(-0.12 * s, -0.62 * s, -0.26 * s, -0.66 * s);
      g.moveTo(0.02 * s, -0.34 * s);
      g.quadraticCurveTo(0.12 * s, -0.62 * s, 0.26 * s, -0.66 * s);
      g.stroke();
      g.restore();
    }

    function starSticker(g, x, y, s, t, phase) {
      g.save();
      g.translate(x, y);
      g.rotate(0.2 + Math.sin(phase) * 0.12);
      sticker(g, s, t + 3, () => {
        g.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = -Math.PI / 2 + (i / 10) * TAU;
          const r = i % 2 ? s * 0.48 : s;
          g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        g.closePath();
      });
      g.restore();
    }

    // When and where the star glints appear (times in seconds, spots around the blob and words).
    const glints = [
      { t: 0.6, spot: () => [L.cx - L.rb * 0.42, L.cy - L.rb * 0.5], k: 0.34 },
      { t: 2.1, spot: () => [head.x + head.w * 0.84, head.y + head.textTop], k: 0.3 },
      { t: 3.4, spot: () => [L.star.x + L.star.r * 0.5, L.star.y - L.star.r * 0.6], k: 0.26 },
      { t: 5.2, spot: () => [L.cx + L.rb * 0.5, L.cy - L.rb * 0.62], k: 0.3 },
      { t: 6.9, spot: () => [head.x + head.w * 0.15, head.y + head.textTop], k: 0.26 },
      { t: 8.3, spot: () => [L.bubbles[0].x - L.bubbles[0].r * 0.3, L.bubbles[0].y - L.bubbles[0].r * 0.4], k: 0.22 },
    ];

    // ---- One frame at time t (seconds, 0 to LOOP) ----
    function render(t) {
      const phase = (t / LOOP) * TAU;
      const { cx, cy, rb } = L;
      const bob = Math.sin(phase * 2) * rb * 0.04;

      // Blob: slow full turn, a squishy morph and a gentle bob.
      blobUniforms.uPhase.value = phase;
      blobUniforms.uAmp.value = 0.3 + 0.06 * Math.sin(phase * 2);
      const [bx, by] = toWorld(cx, cy + bob);
      blob.position.set(bx, by, 0);
      blob.scale.setScalar(rb / ppu);
      blob.rotation.set(0.25 * Math.sin(phase), phase, 0);

      const [sx, sy] = toWorld(L.star.x, L.star.y + Math.sin(phase * 2 + 1) * L.star.r * 0.15);
      star3d.position.set(sx, sy, 0);
      star3d.scale.setScalar(L.star.r / ppu);
      star3d.rotation.set(0.35 + Math.sin(phase * 2) * 0.15, Math.sin(phase) * 0.75, 0.15 + Math.sin(phase + 1) * 0.2);

      // Ring orbits once per loop, passing behind the blob.
      const o = phase + 0.8;
      const [rx, ry] = toWorld(cx + Math.cos(o) * rb * 1.42, cy - Math.sin(o) * rb * 0.35 + bob);
      ring.position.set(rx, ry, (Math.sin(o) * rb * 1.2) / ppu);
      ring.scale.setScalar(L.ringR / ppu);
      ring.rotation.set(1.1 + Math.sin(phase) * 0.3, phase * 2, 0.4);

      bubbles.forEach((m, i) => {
        const b = L.bubbles[i];
        const [x, y] = toWorld(b.x, b.y + Math.sin(phase * (i + 1) + i * 2) * b.r * 0.6);
        m.position.set(x, y, 0);
        m.scale.setScalar(b.r / ppu);
      });
      renderer.render(scene, camera);

      // Front layer: stickers, headline with a shine sweep, glints.
      const g = fctx;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      butterfly(g, L.butterfly.x, L.butterfly.y, L.butterfly.s, t, phase);
      starSticker(g, L.sticker.x, L.sticker.y, L.sticker.s, t, phase);

      const hy = head.y + Math.sin(phase * 2 + 0.6) * head.size * 0.04;
      g.drawImage(head.c, head.x, hy, head.w, head.h);
      // A bright band sweeps across the letters twice per loop.
      const p = ((t % 5) / 1.4);
      if (p < 1) {
        const gs = head.gs;
        gs.setTransform(dpr, 0, 0, dpr, 0, 0);
        gs.globalCompositeOperation = "source-over";
        gs.clearRect(0, 0, head.w, head.h);
        const band = head.w * 0.18;
        const x = -band * 2 + (head.w + band * 4) * p;
        const lg = gs.createLinearGradient(x - band, 0, x + band, head.h * 0.3);
        lg.addColorStop(0, "rgba(255, 255, 255, 0)");
        lg.addColorStop(0.5, "rgba(255, 255, 255, 0.95)");
        lg.addColorStop(1, "rgba(255, 255, 255, 0)");
        gs.fillStyle = lg;
        gs.fillRect(0, 0, head.w, head.h);
        gs.globalCompositeOperation = "destination-in";
        gs.setTransform(1, 0, 0, 1, 0, 0);
        gs.drawImage(head.mask, 0, 0);
        g.globalCompositeOperation = "screen";
        g.drawImage(head.sweep, head.x, hy, head.w, head.h);
        g.globalCompositeOperation = "source-over";
      }

      for (const gl of glints) {
        let d = t - gl.t;
        if (d < 0) d += LOOP;
        if (d > 1.1) continue;
        const k = Math.sin((d / 1.1) * Math.PI);
        const [x, y] = gl.spot();
        glint(g, x, y, rb * gl.k * k, d * 1.2);
      }
    }

    // ---- Run ----
    let start = 0, animating = false, lastFrame = -Infinity; // read by the sound clock
    function frame(now) {
      lastFrame = performance.now();
      if (!start) start = now;
      render(((now - start) / 1000) % LOOP);
    }

    // Reduced motion: one still frame with a glint on the blob.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    function apply() {
      animating = !reduce.matches;
      if (reduce.matches) {
        renderer.setAnimationLoop(null);
        render(5.75);
      } else {
        start = 0;
        renderer.setAnimationLoop(frame);
      }
    }

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        layout();
        if (reduce.matches) render(5.75);
      }, 100);
    });
    reduce.addEventListener("change", apply);

    // ---------- Sound ----------
    // Every sound is made here with the Web Audio API, no audio files. It stays off until the parent
    // page (or ?sound=1 / ?sound=effects) turns it on. It reads the same clock as the animation
    // (seconds since the first frame) and books each sound a little ahead at the matching audio time.
    (() => {
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      const LEVEL = 1.25, MUSIC_LEVEL = 0.2, LOOK_AHEAD = 0.2;
      const BEAT = LOOP / 16; // 96 bpm: 4 bars of 4 beats fill one 10 s loop exactly

      // Animation time in seconds, or null while the animation is not running.
      const clock = () => (animating && start && !document.hidden && performance.now() - lastFrame < 250 ? (performance.now() - start) / 1000 : null);
      // Left or right for a spot on screen.
      const panX = (x) => Math.max(-0.75, Math.min(0.75, (x / W - 0.5) * 1.4));

      // One loop of sounds, from the same numbers as render().
      const events = [];
      const fx = (t, kind, o = {}) => events.push({ t, kind, ...o });
      const mu = (t, kind, o = {}) => events.push({ t, kind, music: true, ...o });
      // The liquid shimmer runs all loop; soft gloops bubble up on the off-beats while the morph swells.
      fx(0, "liquid", { dur: LOOP });
      const morph = (t) => Math.sin((t / LOOP) * TAU * 2); // same shape as uAmp in render()
      for (let b = 0; b < 16; b++) {
        const t = (b + 0.5) * BEAT, m = (morph(t) + 1) / 2;
        if (m > 0.3) fx(t, "gloop", { v: 0.5 + 0.5 * m, f: hz([55, 58, 60, 62, 57][b % 5]) });
      }
      // Bubbles pop (a glassy blip) at the top of each bob: bubble i bobs i + 1 times per loop.
      [0, 1, 2].forEach((i) => {
        for (let n = -3; n < 6; n++) {
          const t = ((1.5 * Math.PI + TAU * n - i * 2) / (i + 1) / TAU) * LOOP;
          if (t >= 0 && t < LOOP) fx(t, "pop", { i, f: hz([84, 88, 91][i]) });
        }
      });
      // Star glints: a sparkle that peaks with the glint (0.55 s after it starts).
      glints.forEach((gl, i) => fx(gl.t, "sparkle", { i }));
      // The butterfly's wings close six times a loop: a soft flutter on each close.
      for (let n = 0; n < 6; n++) fx((n * LOOP) / 6, "flutter");
      // The chrome shine sweeps across the title at 0 s and 5 s (1.4 s each).
      fx(0, "shine", { dur: 1.4 });
      fx(5, "shine", { dur: 1.4 });

      // Music in A: Amaj7, F#m9, Dmaj7, E6. Glossy detuned chords, a bubbly pluck arpeggio,
      // round bass and a crisp, lightly swung beat.
      const bars = [
        [[61, 64, 68, 71], 45, [76, 80, 83, 85]],
        [[61, 64, 66, 69], 42, [73, 76, 80, 81]],
        [[62, 66, 69, 73], 38, [74, 78, 81, 85]],
        [[61, 64, 66, 68], 40, [76, 80, 83, 88]],
      ];
      const swing = (s) => s * BEAT / 4 + (s % 2 ? BEAT * 0.04 : 0);
      bars.forEach(([chord, root, arp], b) => {
        const s0 = b * 16;
        const f = chord.map(hz);
        mu(swing(s0), "chord", { notes: f, dur: BEAT * 1.4 });
        mu(swing(s0 + 6), "chord", { notes: f, dur: BEAT * 0.6, v: 0.6 });
        mu(swing(s0 + 10), "chord", { notes: f, dur: BEAT * 1.2, v: 0.8 });
        for (const [s, dur] of [[0, 1.3], [6, 0.4], [10, 0.9], [14, 0.4]]) mu(swing(s0 + s), "bass", { f: hz(root + (s === 14 ? 12 : 0)), dur: dur * BEAT });
        [0, 3, 5, 8, 11, 13].forEach((s, k) => mu(swing(s0 + s), "pluck", { f: hz(arp[k % 4]), v: k % 2 ? 0.7 : 1 }));
        for (const s of [0, 7, 10]) mu(swing(s0 + s), "kick", { v: s ? 0.8 : 1 });
        for (const s of [4, 12]) mu(swing(s0 + s), "snare");
        for (let s = 0; s < 16; s++) if (s % 2 || s % 4 === 2) mu(swing(s0 + s), "hat", { v: s % 4 === 2 ? 1 : 0.55 });
      });
      events.sort((a, b) => a.t - b.t);

      let ctx = null, master = null, noiseBuf = null, impulse = null, bus = null;
      let wanted = false, musicOn = true, catchUp = false;
      let timer = 0, sleepTimer = 0, cursor = null, offset = null;

      function build() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const sr = ctx.sampleRate;
        // Compressor last, so nothing clips.
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp);
        comp.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, sr * 2, sr);
        const n = noiseBuf.getChannelData(0);
        for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;
        // A bright, glossy room: stereo noise that fades away, used as the reverb impulse.
        const len = Math.floor(sr * 1.8);
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5);
        }
      }

      // A fresh set of nodes each time sound is turned on, so nothing booked before a stop leaks out later.
      function openBus() {
        const t = ctx.currentTime;
        const out = ctx.createGain();
        out.gain.setValueAtTime(0, t);
        out.gain.linearRampToValueAtTime(1, t + 0.08);
        out.connect(master);
        const fxIn = ctx.createGain();
        fxIn.connect(out);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const verbTone = filter("lowpass", 7000);
        verb.connect(verbTone);
        verbTone.connect(out);
        // Music gate: music:false fades this to zero, with its reverb and echo.
        const mus = ctx.createGain();
        mus.gain.value = musicOn ? MUSIC_LEVEL : 0;
        mus.connect(out);
        const musVerb = ctx.createGain();
        musVerb.gain.value = 0.3;
        mus.connect(musVerb);
        musVerb.connect(verb);
        // Plucks go through a bouncy dotted-eighth echo.
        const pluck = ctx.createGain();
        pluck.connect(mus);
        const echo = ctx.createDelay(1);
        echo.delayTime.value = BEAT * 0.75;
        const feedback = ctx.createGain();
        feedback.gain.value = 0.3;
        const echoTone = filter("lowpass", 3500);
        const echoOut = ctx.createGain();
        echoOut.gain.value = 0.35;
        pluck.connect(echo);
        echo.connect(echoTone);
        echoTone.connect(feedback);
        feedback.connect(echo);
        echoTone.connect(echoOut);
        echoOut.connect(mus);
        return { out, fx: fxIn, verb, mus, pluck };
      }

      function closeBus() {
        if (!bus) return;
        const old = bus, t = ctx.currentTime;
        bus = null;
        old.out.gain.cancelScheduledValues(t);
        old.out.gain.setValueAtTime(old.out.gain.value, t);
        old.out.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.out.disconnect(), 300);
      }

      // Small building blocks
      function filter(type, f, q = 0.7) {
        const b = ctx.createBiquadFilter();
        b.type = type;
        b.frequency.value = f;
        b.Q.value = q;
        return b;
      }
      function env(t, attack, peak, decay) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(peak, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
        return g;
      }
      function tone(type, f, t, out, stopAt) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        o.connect(out);
        o.start(t);
        o.stop(stopAt);
        return o;
      }
      function noiseAt(t, dur, out) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.connect(out);
        s.start(t, Math.random() * 1.5);
        s.stop(t + dur);
        return s;
      }
      // Send an effect to the mix, panned, with some reverb.
      function toFx(node, pan, send) {
        const p = ctx.createStereoPanner();
        p.pan.value = pan;
        node.connect(p);
        p.connect(bus.fx);
        if (send > 0) {
          const s = ctx.createGain();
          s.gain.value = send;
          p.connect(s);
          s.connect(bus.verb);
        }
        return p;
      }
      // An audio param that follows a smooth curve over [t, t + dur].
      const curve = (param, t, dur, shape, n = 97) => param.setValueCurveAtTime(Float32Array.from({ length: n }, (_, i) => shape(i / (n - 1))), t, dur);

      // Effects
      function liquid(t, e) {
        // A soft liquid-chrome shimmer: close pairs of high tones that beat and swell with the morph.
        // It runs 0.3 s past its end, crossfading into the next loop's shimmer.
        const d = e.dur + 0.3, t0 = e.from || 0;
        const g = ctx.createGain();
        g.gain.value = 0;
        curve(g.gain, t, d, (x) => {
          const u = x * d, fade = Math.min(1, u / 0.3, (d - u) / 0.3);
          return 0.014 * fade * (0.6 + 0.4 * (morph(t0 + u) + 1) / 2);
        });
        for (const [m, beat] of [[81, 2.3], [88, 3.7], [93, 5.1]]) {
          const f = hz(m);
          tone("sine", f, t, g, t + d + 0.05);
          tone("sine", f + beat, t, g, t + d + 0.05);
        }
        const p = ctx.createStereoPanner();
        curve(p.pan, t, d, (x) => 0.3 * Math.sin(TAU * (t0 + x * d) / LOOP));
        g.connect(p);
        p.connect(bus.fx);
        const s = ctx.createGain();
        s.gain.value = 0.5;
        p.connect(s);
        s.connect(bus.verb);
      }
      function gloop(t, e) {
        // A soft liquid "bloop": a sine that bends up through a round filter, with a smaller echo bloop.
        const pan = panX(L.cx) + (Math.random() - 0.5) * 0.3;
        for (const [dt, k] of [[0, 1], [0.07, 0.45]]) {
          const at = t + dt;
          const g = env(at, 0.006, 0.16 * e.v * k, 0.12);
          const o = tone("sine", e.f * (dt ? 1.4 : 1), at, g, at + 0.18);
          o.frequency.exponentialRampToValueAtTime(e.f * (dt ? 2.6 : 2.1), at + 0.07);
          const lp = filter("lowpass", 1400, 4);
          g.connect(lp);
          toFx(lp, pan, 0.25);
        }
      }
      function pop(t, e) {
        // A glassy bubble pop: a quick rising blip, a tiny click and a short glass ring.
        const b = L.bubbles[e.i], pan = panX(b.x);
        const g = env(t, 0.002, 0.14, 0.05);
        tone("sine", e.f * 0.5, t, g, t + 0.08).frequency.exponentialRampToValueAtTime(e.f * 1.2, t + 0.03);
        toFx(g, pan, 0.2);
        const c = env(t + 0.03, 0.0005, 0.07, 0.01);
        const hp = filter("highpass", 5000);
        noiseAt(t + 0.03, 0.02, hp);
        hp.connect(c);
        toFx(c, pan, 0.1);
        for (const [m, a, d] of [[1.2, 1, 0.35], [3.3, 0.3, 0.15]]) {
          const r = env(t + 0.03, 0.002, 0.045 * a, d);
          tone("sine", e.f * m, t + 0.03, r, t + 0.03 + d + 0.05);
          toFx(r, pan, 0.4);
        }
      }
      function sparkle(t, e) {
        // A twinkle for the four point star glint: bright little notes that peak with the glint.
        const [x] = glints[e.i].spot();
        const pan = panX(x);
        const notes = [[0.3, 96, 0.5], [0.42, 100, 0.8], [0.55, 103, 1], [0.7, 108, 0.5]];
        for (const [dt, m, v] of notes) {
          const at = t + dt;
          const g = env(at, 0.002, 0.05 * v, 0.35);
          tone("sine", hz(m - (e.i % 2) * 2), at, g, at + 0.4);
          toFx(g, pan, 0.55);
        }
        const hp = filter("highpass", 8000);
        const n = ctx.createGain();
        n.gain.value = 0;
        curve(n.gain, t, 1.1, (x) => 0.05 * Math.pow(Math.sin(Math.PI * x), 3));
        noiseAt(t, 1.15, hp);
        hp.connect(n);
        toFx(n, pan, 0.4);
      }
      function flutter(t) {
        // A soft papery flutter as the butterfly's wings close.
        const pan = panX(L.butterfly.x);
        const d = 0.45;
        const bp = filter("bandpass", 1800, 0.9);
        const g = ctx.createGain();
        g.gain.value = 0;
        curve(g.gain, t, d, (x) => 0.1 * Math.sin(Math.PI * x) * (0.4 + 0.6 * Math.pow(Math.abs(Math.sin(Math.PI * x * 8)), 2)));
        noiseAt(t, d + 0.02, bp);
        bp.connect(g);
        toFx(g, pan, 0.2);
      }
      function shine(t, e) {
        // The chrome shine: a bright, metallic swoosh that crosses the title left to right with the band.
        const d = e.dur;
        const bp = filter("bandpass", 1500, 5);
        curve(bp.frequency, t, d, (x) => 1500 * Math.pow(6, x));
        const g = ctx.createGain();
        g.gain.value = 0;
        curve(g.gain, t, d, (x) => 0.3 * Math.pow(Math.sin(Math.PI * x), 2));
        const p = ctx.createStereoPanner();
        curve(p.pan, t, d, (x) => -0.7 + 1.4 * x);
        noiseAt(t, d + 0.05, bp);
        bp.connect(g);
        g.connect(p);
        p.connect(bus.fx);
        const s = ctx.createGain();
        s.gain.value = 0.35;
        p.connect(s);
        s.connect(bus.verb);
        const ring = ctx.createGain();
        ring.gain.value = 0;
        curve(ring.gain, t, d, (x) => 0.018 * Math.pow(Math.sin(Math.PI * x), 3));
        for (const m of [88, 95, 100]) {
          tone("sine", hz(m), t, ring, t + d + 0.05);
          tone("sine", hz(m) * 1.004, t, ring, t + d + 0.05);
        }
        ring.connect(p);
      }

      // Music
      function chord(t, e) {
        // Glossy chord: detuned saws and a square an octave up, through a bright low-pass.
        const lp = filter("lowpass", 2600, 1.2);
        lp.frequency.setValueAtTime(3400, t);
        lp.frequency.exponentialRampToValueAtTime(1400, t + e.dur + 0.2);
        const v = e.v || 1;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.022 * v, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.012 * v, t + e.dur);
        g.gain.exponentialRampToValueAtTime(0.0001, t + e.dur + 0.25);
        e.notes.forEach((f, i) => {
          for (const cents of [-9, 9]) tone("sawtooth", f, t, lp, t + e.dur + 0.3).detune.value = cents;
          if (i === e.notes.length - 1) tone("square", f * 2, t, lp, t + e.dur + 0.3);
        });
        lp.connect(g);
        g.connect(bus.mus);
      }
      function pluck(t, e) {
        // A bubbly pluck with a tiny upward blip.
        const g = env(t, 0.002, 0.09 * e.v, 0.2);
        tone("triangle", e.f * 0.98, t, g, t + 0.25).frequency.exponentialRampToValueAtTime(e.f, t + 0.02);
        const h = env(t, 0.001, 0.03 * e.v, 0.06);
        tone("sine", e.f * 2, t, h, t + 0.1);
        g.connect(bus.pluck);
        h.connect(bus.pluck);
      }
      function bass(t, e) {
        const g = env(t, 0.008, 0.3, e.dur);
        tone("sine", e.f, t, g, t + e.dur + 0.05);
        const lp = filter("lowpass", 600, 2);
        const h = env(t, 0.005, 0.07, e.dur * 0.5);
        tone("square", e.f, t, h, t + e.dur + 0.05);
        h.connect(lp);
        g.connect(bus.mus);
        lp.connect(bus.mus);
      }
      function kick(t, e) {
        const g = env(t, 0.002, 0.55 * e.v, 0.24);
        tone("sine", 160, t, g, t + 0.3).frequency.exponentialRampToValueAtTime(50, t + 0.09);
        g.connect(bus.mus);
        const c = env(t, 0.0005, 0.08 * e.v, 0.008);
        const hp = filter("highpass", 3500);
        noiseAt(t, 0.02, hp);
        hp.connect(c);
        c.connect(bus.mus);
      }
      function snare(t) {
        // Crisp snare: a bright noise burst over a short tone.
        const bp = filter("bandpass", 3200, 0.8);
        const n = env(t, 0.001, 0.22, 0.14);
        noiseAt(t, 0.18, bp);
        bp.connect(n);
        n.connect(bus.mus);
        const b = env(t, 0.001, 0.12, 0.07);
        tone("triangle", 230, t, b, t + 0.1).frequency.exponentialRampToValueAtTime(170, t + 0.05);
        b.connect(bus.mus);
      }
      function hat(t, e) {
        const g = env(t, 0.001, 0.06 * e.v, 0.03);
        const hp = filter("highpass", 8500);
        noiseAt(t, 0.05, hp);
        hp.connect(g);
        const p = ctx.createStereoPanner();
        p.pan.value = 0.25;
        g.connect(p);
        p.connect(bus.mus);
      }
      const voices = { liquid, gloop, pop, sparkle, flutter, shine, chord, pluck, bass, kick, snare, hat };

      function play(e, t, at) {
        if (window.__soundLog) window.__soundLog.push({ kind: e.kind, t: at, when: t }); // test hook
        voices[e.kind](t, e);
      }

      // Audio time being heard right now. Uses the output clock when the browser gives one.
      function heardNow() {
        const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
        const p = performance.now();
        if (ts && ts.contextTime > 0 && ts.performanceTime > 0 && Math.abs(p - ts.performanceTime) < 1000) {
          return ts.contextTime + (p - ts.performanceTime) / 1000;
        }
        return ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
      }

      // Look-ahead scheduler: every 25 ms, book the sounds that fall in the next 200 ms of animation time
      // (enough to ride out a slow frame on a busy page).
      function pump() {
        const now = bus && ctx.state === "running" ? clock() : null;
        // Paused or hidden: book nothing. The cursor stays, so a short stall does not book anything twice.
        if (now === null) return;
        // Audio time = animation time + offset, smoothed so small jitter does not move sounds.
        const raw = heardNow() - now;
        if (offset === null || Math.abs(raw - offset) > 0.05) offset = raw;
        else offset += (raw - offset) * 0.1;
        if (cursor === null || now - cursor > 0.3 || cursor - now > LOOK_AHEAD + 0.3) {
          // Start, a long pause or a jump: pick up from now and skip anything missed, so nothing piles up.
          cursor = now;
          catchUp = true;
        }
        if (catchUp) {
          // Bring in the liquid shimmer already under way, so it does not wait for the next loop.
          const lt = ((now % LOOP) + LOOP) % LOOP;
          if (lt > 0.05 && lt < LOOP - 0.3) liquid(ctx.currentTime + 0.02, { dur: LOOP - lt, from: lt });
        }
        catchUp = false;
        const end = now + LOOK_AHEAD;
        for (let k = Math.floor(cursor / LOOP); k * LOOP < end; k++) {
          for (const e of events) {
            const at = k * LOOP + e.t;
            // Each sound plays once: its time must fall in [cursor, end). Ones more than 80 ms late are skipped.
            if (at < cursor || at >= end || at < now - 0.08 || (e.music && !musicOn)) continue;
            play(e, Math.max(ctx.currentTime, at + offset), at);
          }
        }
        cursor = end;
      }

      function update() {
        const on = wanted && !reduce.matches;
        if (on) {
          if (!ctx) build();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!bus) {
            bus = openBus();
            cursor = null;
            offset = null;
          }
          if (!timer) timer = setInterval(pump, 25);
          pump();
        } else if (ctx) {
          clearInterval(timer);
          timer = 0;
          cursor = null;
          closeBus();
          clearTimeout(sleepTimer);
          sleepTimer = setTimeout(() => {
            if (!(wanted && !reduce.matches)) ctx.suspend().catch(() => {});
          }, 220);
        }
      }

      function setMusic(on) {
        if (on === musicOn) return;
        musicOn = on;
        if (bus) {
          const g = bus.mus.gain, t = ctx.currentTime;
          g.cancelScheduledValues(t);
          g.setValueAtTime(g.value, t);
          g.linearRampToValueAtTime(on ? MUSIC_LEVEL : 0, t + 0.12);
        }
      }

      // Browsers may block audio until a click or key press: resume then.
      const unlock = () => {
        if (ctx && wanted && !reduce.matches && ctx.state !== "running") ctx.resume().catch(() => {});
      };
      window.addEventListener("pointerdown", unlock);
      window.addEventListener("keydown", unlock);
      reduce.addEventListener("change", update);

      window.addEventListener("message", (event) => {
        const d = event.data;
        if (event.origin !== location.origin || !d || d.type !== "motionprompt-sound") return;
        if (typeof d.music === "boolean") setMusic(d.music);
        if (typeof d.on === "boolean") wanted = d.on;
        update();
      });
      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wanted = true;
        setMusic(fromUrl === "1");
        update();
      }
    })();

    // Wait briefly for the font so the headline is drawn in the right face.
    Promise.race([
      document.fonts.load(FONT),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => {
      layout();
      apply();
    });
  </script>
</body>
</html>
