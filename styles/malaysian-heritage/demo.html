<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malaysian heritage demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel@5.3.0/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.3.0/700.css">
  <style>
    /* Colours can be set from the URL: ?text=Title|Small line&bg=f8d894&ink=fbeccb&accent=d9a53a&accent2=6e1129 */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1c0b06;
    }

    svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .title {
      font-family: "Cinzel", Georgia, serif;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .sub {
      font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <svg id="scene" role="img" xmlns="http://www.w3.org/2000/svg"></svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => "#" + (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const C = {
      sky: hex("bg", "f8d894"),
      ink: hex("ink", "fbeccb"),
      gold: hex("accent", "d9a53a"),
      maroon: hex("accent2", "6e1129"),
      blue: "#1f3f8f",
      emerald: "#0f6b4a",
      turmeric: "#f2b431",
      red: "#c42a3e",
      wax: "#fdf1d6",
      night: "#1c0b06",
      shadow: "#2a0f08",
    };

    // ?text=Title|Small line. The default is a Malay greeting with an English line under it.
    const raw = (params.get("text") || "").trim();
    const [title, subtitle] = raw
      ? [raw.split("|")[0].trim().slice(0, 40), (raw.split("|")[1] || "").trim().slice(0, 50)]
      : ["Selamat Datang", "Welcome to Malaysia"];

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("scene");
    svg.setAttribute("aria-label", `Malaysian heritage animation: a wayang kulit shadow screen opens onto wau bulan kites, batik flowers and a kampung sky, then the title ${title} in a gold songket frame`);

    function el(name, attrs, parent) {
      const node = document.createElementNS(NS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (parent) parent.append(node);
      return node;
    }

    // Small geometry helpers. Shapes are drawn in local units and scaled into place.
    const TAU = Math.PI * 2;
    const rad = (d) => (d * Math.PI) / 180;
    const n3 = (v) => +v.toFixed(4);
    const P = (p) => `${n3(p[0])} ${n3(p[1])}`;
    const polar = (r, deg, c = [0, 0]) => [c[0] + r * Math.cos(rad(deg)), c[1] + r * Math.sin(rad(deg))];

    // A smooth line through points. A repeated point makes a sharp corner.
    function smooth(pts, close) {
      const n = pts.length, at = (i) => pts[close ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];
      let d = `M${P(pts[0])}`;
      for (let i = 0; i < (close ? n : n - 1); i++) {
        const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
        d += `C${P([p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6])} ${P([p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6])} ${P(p2)}`;
      }
      return d + (close ? "Z" : "");
    }
    // Right half from the top centre to the bottom centre, mirrored into a closed outline.
    const mirror = (right) => right.concat(right.slice(1, -1).reverse().map(([x, y]) => [-x, y]));
    const cubicPts = (a, b, c, d, n = 10) => Array.from({ length: n + 1 }, (_, i) => {
      const t = i / n, s = 1 - t;
      return [0, 1].map((k) => s * s * s * a[k] + 3 * s * s * t * b[k] + 3 * s * t * t * c[k] + t * t * t * d[k]);
    });
    // A curl at the end of a line: heading in degrees, cw = 1 turns right, -1 turns left.
    function curl(end, heading, r0, turns, cw = 1) {
      const c = polar(r0, heading + cw * 90, end), a0 = heading + cw * 90 + 180, out = [];
      for (let i = 1; i <= 18; i++) {
        const k = i / 18;
        out.push(polar(r0 * (1 - 0.72 * k), a0 + cw * k * turns * 360, c));
      }
      return out;
    }
    const drop = (x, y, len, deg, w = 0.35) =>
      `M${P([x, y])}` + [[0.3, -w], [0.8, -w * 0.6], [1, 0], [0.8, w * 0.6], [0.3, w], [0, 0]]
        .map((q, i, a) => (i % 3 === 0 ? "C" : "") + P(polar(Math.hypot(q[0], q[1]) * len, deg + (Math.atan2(q[1], q[0]) * 180) / Math.PI, [x, y])) + " ")
        .join("") + "Z";
    const circle = (x, y, r) => `M${P([x - r, y])}a${n3(r)} ${n3(r)} 0 1 0 ${n3(r * 2)} 0a${n3(r)} ${n3(r)} 0 1 0 ${n3(-r * 2)} 0Z`;

    // A loop is 12 seconds; every sway repeats a whole number of times per loop.
    const LOOP = 12, STILL = 9.6;
    const wave = (t, cycles, phase = 0) => Math.sin(TAU * (t * cycles) / LOOP + phase);

    let W, H, u, tl, S, R, defs;

    function layout() {
      const r = W / H, L = {};
      if (r < 0.9) {
        L.horizon = H * 0.63;
        L.panel = { x: W / 2, y: H * 0.575, w: W * 0.9, h: Math.min(W * 0.6, H * 0.34) };
        const k0 = Math.min(W * 0.3, H * 0.2), k1 = Math.min(W * 0.17, H * 0.12);
        L.kitesA = [{ x: W * 0.36, y: H * 0.29, s: k0 }, { x: W * 0.78, y: Math.max(H * 0.15, H * 0.05 + k1), s: k1 }];
        L.flowers = [{ x: W * 0.17, y: H * 0.9, s: W * 0.15, flip: 1 }, { x: W * 0.85, y: H * 0.935, s: W * 0.11, flip: -1 }];
      } else if (r < 1.3) {
        L.horizon = H * 0.64;
        L.panel = { x: W / 2, y: H * 0.56, w: W * 0.82, h: H * 0.32 };
        L.kitesA = [{ x: W * 0.35, y: H * 0.3, s: u * 0.24 }, { x: W * 0.77, y: H * 0.19, s: u * 0.15 }];
        L.flowers = [{ x: W * 0.13, y: H * 0.88, s: u * 0.11, flip: 1 }, { x: W * 0.88, y: H * 0.905, s: u * 0.085, flip: -1 }];
      } else {
        L.horizon = H * 0.66;
        L.panel = { x: W / 2, y: H * 0.5, w: Math.min(W * 0.56, H * 1.3), h: H * 0.52 };
        L.kitesA = [{ x: W * 0.3, y: H * 0.36, s: H * 0.28 }, { x: W * 0.72, y: H * 0.26, s: H * 0.18 }];
        L.flowers = [{ x: W * 0.09, y: H * 0.81, s: H * 0.14, flip: 1 }, { x: W * 0.915, y: H * 0.85, s: H * 0.11, flip: -1 }];
      }
      // Where the kites fly while the title is on screen.
      const p = L.panel, top = p.y - p.h / 2;
      if (r < 1.3) {
        const r0 = H * 0.04, rh = top - H * 0.03 - r0, s = Math.min(W * 0.24, rh * 0.46);
        L.kitesB = [{ x: W * 0.3, y: r0 + rh * 0.55, s }, { x: W * 0.76, y: r0 + rh * 0.42, s: s * 0.66 }];
      } else {
        const side = (W - p.w) / 2, s = Math.min(side * 0.46, H * 0.26);
        L.kitesB = [{ x: side / 2, y: H * 0.38, s }, { x: W - side / 2, y: H * 0.3, s: s * 0.8 }];
      }
      return L;
    }

    // ---------- Wau bulan ----------
    function kitePath() {
      const segs = [
        [[0.05, -0.79], [0.11, -0.68], [0.1, -0.62]],
        [[0.09, -0.57], [0.06, -0.56], [0.06, -0.53]],
        [[0.4, -0.62], [0.78, -0.66], [1, -0.53]],
        [[0.92, -0.34], [0.68, -0.14], [0.42, -0.11]],
        [[0.22, -0.09], [0.1, -0.07], [0.09, 0.04]],
        [[0.09, 0.3], [0.5, 0.45], [0.77, 0.15]],
        [[0.82, 0.52], [0.46, 0.86], [0, 0.86]],
      ];
      const start = [0, -0.8], ends = [start, ...segs.map((s) => s[2])];
      let d = `M${P(start)}`;
      for (const [a, b, c] of segs) d += `C${P(a)} ${P(b)} ${P(c)}`;
      for (let i = segs.length - 1; i >= 0; i--) {
        const [a, b] = segs[i], m = ([x, y]) => [-x, y];
        d += `C${P(m(b))} ${P(m(a))} ${P(m(ends[i]))}`;
      }
      return d + "Z";
    }

    function buildKite(parent, pal, id) {
      const g = el("g", {}, parent);
      const d = kitePath();
      // The busur (bow) sits behind the head.
      el("path", { d: "M-0.86 -0.6Q0 -1.1 0.86 -0.6", fill: "none", stroke: "#4a2616", "stroke-width": 0.035, "stroke-linecap": "round" }, g);
      el("path", { d: "M-0.86 -0.6L0.86 -0.6", stroke: "#fff4d8", "stroke-width": 0.012, opacity: 0.7 }, g);
      const clip = el("clipPath", { id: `${id}-clip` }, defs);
      el("path", { d }, clip);
      const body = el("g", { "clip-path": `url(#${id}-clip)` }, g);
      // Layered coloured paper: an outer band, an inner band, then the centre colour.
      el("path", { d, fill: pal[2] }, body);
      el("path", { d, fill: "none", stroke: pal[1], "stroke-width": 0.26 }, body);
      el("path", { d, fill: "none", stroke: pal[0], "stroke-width": 0.12 }, body);
      // Cut-work: a floral vine on each side, mirrored along the spine.
      for (const side of [1, -1]) {
        const m = el("g", { transform: `scale(${side} 1)` }, body);
        const vine = cubicPts([0.08, -0.4], [0.28, -0.52], [0.5, -0.3], [0.64, -0.41]);
        el("path", { d: smooth(vine.concat(curl([0.64, -0.41], -38, 0.055, 1.1, -1))), fill: "none", stroke: pal[3], "stroke-width": 0.03, "stroke-linecap": "round" }, m);
        el("path", { d: drop(0.27, -0.47, 0.13, -95) + drop(0.44, -0.36, 0.12, 80) + drop(0.53, -0.37, 0.1, -60), fill: pal[3] }, m);
        el("path", { d: circle(0.36, -0.42, 0.025) + circle(0.2, -0.39, 0.02), fill: pal[4] }, m);
        const tail = cubicPts([0.03, 0.66], [0.24, 0.72], [0.44, 0.6], [0.52, 0.44]);
        el("path", { d: smooth(tail.concat(curl([0.52, 0.44], -60, 0.05, 1.1, -1))), fill: "none", stroke: pal[3], "stroke-width": 0.03, "stroke-linecap": "round" }, m);
        el("path", { d: drop(0.28, 0.68, 0.12, 60) + drop(0.4, 0.55, 0.1, -130), fill: pal[3] }, m);
        el("path", { d: drop(0.12, -0.2, 0.12, 40) + circle(0.66, -0.52, 0.02), fill: pal[3] }, m);
      }
      // A flower on the spine and a diamond at the waist.
      let rosette = "";
      for (let i = 0; i < 8; i++) rosette += drop(0, -0.3, 0.11, i * 45, 0.42);
      el("path", { d: rosette, fill: pal[3] }, body);
      el("path", { d: circle(0, -0.3, 0.035) + "M0 0.03L0.05 0.13L0 0.23L-0.05 0.13Z" + circle(0, 0.76, 0.03), fill: pal[4] }, body);
      el("path", { d: "M0 -0.8V0.86", stroke: "rgba(40,16,8,0.35)", "stroke-width": 0.014 }, body);
      el("path", { d, fill: "none", stroke: "#3a1a10", "stroke-width": 0.016, "stroke-linejoin": "round" }, g);
      // Streamer tassels (rambu) on the ends of the bow.
      const tassels = [-1, 1].map((side) => {
        const t = el("g", {}, g);
        [C.red, C.turmeric, C.blue].forEach((c, i) => {
          el("path", { d: "M-0.014 0Q-0.05 0.22 -0.012 0.44L0.012 0.44Q-0.014 0.22 0.014 0Z", fill: c, transform: `rotate(${(i - 1) * 16})` }, t);
        });
        return { g: t, side };
      });
      return { g, tassels };
    }

    // ---------- Batik ----------
    // Every batik line is drawn like wax from a canting, then the colour dyes in.
    const wax = [], dyes = [], fills = [];
    function waxLine(parent, d, attrs, order) {
      const p = el("path", { d, stroke: C.wax, "stroke-linecap": "round", "stroke-linejoin": "round", ...attrs }, parent);
      wax.push({ p, order });
      return p;
    }

    function buildFlower(parent, F) {
      const g = el("g", { transform: `translate(${F.x} ${F.y}) scale(${F.s * F.flip} ${F.s})` }, parent);
      const sw = 0.035;
      // Awan larat tendrils: a dye band with a wax line on top.
      const tendrils = [
        cubicPts([0.35, -0.55], [0.7, -0.95], [1.05, -1.05], [1.3, -0.92]).concat(curl([1.3, -0.92], 20, 0.2, 1.3, 1)),
        cubicPts([-0.55, -0.62], [-0.8, -0.9], [-0.7, -1.2], [-0.45, -1.3]).concat(curl([-0.45, -1.3], 10, 0.16, 1.3, 1)),
        cubicPts([0.85, 0.2], [1.2, 0.2], [1.4, -0.05], [1.45, -0.3]).concat(curl([1.45, -0.3], -80, 0.13, 1.2, -1)),
      ];
      tendrils.forEach((pts, i) => {
        const d = smooth(pts);
        const dye = el("path", { d, fill: "none", stroke: C.blue, "stroke-width": 0, "stroke-linecap": "round" }, g);
        dyes.push({ p: dye, w: 0.1, order: i * 0.1 });
        waxLine(g, d, { fill: "none", "stroke-width": sw }, i * 0.12);
      });
      // Leaves with veins.
      const leaves = [[0.15, -0.55, 1.25, -72], [0.6, -0.15, 1.05, -22], [-0.45, -0.35, 0.85, -128]];
      leaves.forEach(([x, y, len, deg], i) => {
        const p = waxLine(g, drop(x, y, len, deg, 0.34), { fill: "url(#mh-leaf)", "fill-opacity": 0, "stroke-width": sw }, 0.2 + i * 0.12);
        fills.push({ p, order: 0.1 + i * 0.1 });
        let veins = `M${P([x, y])}L${P(polar(len * 0.92, deg, [x, y]))}`;
        for (let k = 1; k <= 3; k++) {
          const a = polar(len * k * 0.22, deg, [x, y]);
          veins += `M${P(a)}L${P(polar(len * 0.2, deg - 38, a))}M${P(a)}L${P(polar(len * 0.2, deg + 38, a))}`;
        }
        waxLine(g, veins, { fill: "none", "stroke-width": sw * 0.6 }, 0.4 + i * 0.12);
      });
      // Bunga raya: five ruffled petals.
      for (let i = 0; i < 5; i++) {
        const a = -100 + i * 72;
        const pts = [[0, 0], [0, 0], polar(0.45, a - 40), polar(0.9, a - 33), polar(1, a - 18), polar(0.93, a - 5),
          polar(1.02, a + 9), polar(0.96, a + 23), polar(0.88, a + 34), polar(0.45, a + 40)];
        const p = waxLine(g, smooth(pts, true), { fill: "url(#mh-petal)", "fill-opacity": 0, "stroke-width": sw }, 0.45 + i * 0.08);
        fills.push({ p, order: 0.35 + i * 0.06 });
        let veins = "";
        for (const k of [-14, 0, 14]) veins += `M${P(polar(0.22, a + k * 0.5))}L${P(polar(0.72, a + k))}`;
        waxLine(g, veins, { fill: "none", "stroke-width": sw * 0.6 }, 0.8 + i * 0.05);
      }
      fills.push({ p: waxLine(g, circle(0, 0, 0.15), { fill: C.maroon, "fill-opacity": 0, "stroke-width": sw }, 0.9), order: 0.6 });
      // The long stamen with pollen and stigma dots.
      const tip = polar(1.3, -58);
      const stem = `M0 0Q${P(polar(0.75, -80))} ${P(tip)}`;
      const st = el("path", { d: stem, fill: "none", stroke: C.turmeric, "stroke-width": 0, "stroke-linecap": "round" }, g);
      dyes.push({ p: st, w: 0.07, order: 0.5 });
      waxLine(g, stem, { fill: "none", "stroke-width": sw * 0.8 }, 1);
      let dots = "";
      for (let i = 0; i < 6; i++) {
        const t = 0.62 + i * 0.06, q = polar(0.75, -80);
        const x = 2 * (1 - t) * t * q[0] + t * t * tip[0], y = 2 * (1 - t) * t * q[1] + t * t * tip[1];
        dots += circle(x + (i % 2 ? 0.07 : -0.07), y, 0.045);
      }
      const pol = waxLine(g, dots, { fill: C.turmeric, "fill-opacity": 0, "stroke-width": sw * 0.6 }, 1.05);
      fills.push({ p: pol, order: 0.7 });
      let stig = "";
      for (let i = 0; i < 5; i++) stig += circle(...polar(0.1, -150 + i * 30, tip), 0.05);
      const sg = waxLine(g, stig, { fill: C.red, "fill-opacity": 0, "stroke-width": sw * 0.6 }, 1.1);
      fills.push({ p: sg, order: 0.75 });
      // A few isen dots around the motif, like batik filler.
      let isen = "";
      [[-0.95, -0.9], [0.95, -0.55], [-1.05, 0.1], [0.2, -1.35], [1.15, 0.45]].forEach(([x, y]) => (isen += circle(x, y, 0.04)));
      const dotsP = el("path", { d: isen, fill: C.wax, "fill-opacity": 0 }, g);
      fills.push({ p: dotsP, order: 0.8 });
    }

    function buildCloud(parent, x, y, s) {
      const g = el("g", { transform: `translate(${x} ${y}) scale(${s})` }, parent);
      const d = "M-1.25 0.28A0.4 0.4 0 0 1 -0.6 -0.12A0.52 0.52 0 0 1 0.3 -0.34A0.44 0.44 0 0 1 1.02 -0.04A0.26 0.26 0 0 1 1.3 0.28Q0.9 0.22 0.6 0.3Q0.2 0.2 -0.2 0.3Q-0.7 0.22 -1.25 0.28Z";
      const body = waxLine(g, d, { fill: "#fff5dc", "fill-opacity": 0, stroke: "#b8612a", "stroke-width": 0.045 }, 0);
      fills.push({ p: body, order: 0, max: 0.92 });
      [[-0.86, 0.12, 0.22, 0], [-0.1, -0.02, 0.3, 0.1], [0.66, 0.1, 0.22, 0.2]].forEach(([cx, cy, r, o]) => {
        const pts = [];
        for (let i = 0; i <= 26; i++) {
          const k = i / 26;
          pts.push(polar(r * (1 - 0.8 * k), 200 + k * 520, [cx, cy]));
        }
        waxLine(g, smooth(pts), { fill: "none", stroke: "#b8612a", "stroke-width": 0.035 }, 0.2 + o);
      });
    }

    // ---------- Kampung horizon ----------
    function buildHorizon(parent, L) {
      const hz = L.horizon;
      // Distant trees
      const tree = [];
      for (let i = -1; i <= 21; i++) {
        const x = (i / 20) * W;
        tree.push([x, hz - u * (0.03 + 0.018 * Math.abs(Math.sin(i * 1.7)) + 0.012 * Math.sin(i * 0.6))]);
      }
      el("path", { d: smooth(tree) + `L${W * 1.06} ${hz + u * 0.05}L${-W * 0.06} ${hz + u * 0.05}Z`, fill: "#3b6e45" }, parent);
      const dark = "#1d4632";
      // Coconut palms
      const palm = (x, h, lean) => {
        const b = [x, hz + u * 0.01], top = [x + lean * h * 0.3, hz - h];
        el("path", { d: `M${P(b)}Q${P([x + lean * h * 0.02, hz - h * 0.5])} ${P(top)}`, fill: "none", stroke: dark, "stroke-width": h * 0.035, "stroke-linecap": "round" }, parent);
        let fr = "";
        for (let i = 0; i < 8; i++) {
          const a = -170 + i * 23 + (i > 3 ? 12 : 0), len = h * (0.42 + 0.08 * Math.cos(i * 1.9));
          const tip = polar(len, a, top), mid = polar(len * 0.55, a, top);
          const droop = [tip[0], tip[1] + len * 0.45];
          const c1 = [mid[0], mid[1] - len * 0.12], c2 = [mid[0], mid[1] + len * 0.05];
          fr += `M${P(top)}Q${P(c1)} ${P(droop)}Q${P(c2)} ${P(top)}Z`;
        }
        el("path", { d: fr, fill: dark }, parent);
      };
      const ph = u * 0.2;
      palm(W * 0.1, ph, -0.4);
      palm(W * 0.2, ph * 0.78, 0.3);
      palm(W * 0.93, ph * 0.9, 0.35);
      // A rumah kampung on stilts, with crossed silang gunting at the roof peak.
      const hs = u * 0.17, hx = W * 0.66, by = hz + u * 0.012;
      const wood = "#4a1c18";
      const hg = el("g", {}, parent);
      let stilts = "";
      for (const k of [-0.36, -0.12, 0.12, 0.36, 0.62]) stilts += `M${P([hx + hs * k, by - hs * 0.3])}V${n3(by)}`;
      el("path", { d: stilts, stroke: wood, "stroke-width": hs * 0.035 }, hg);
      el("path", { d: `M${P([hx + hs * 0.36, by - hs * 0.52])}L${P([hx + hs * 0.8, by - hs * 0.6])}L${P([hx + hs * 0.84, by - hs * 0.46])}L${P([hx + hs * 0.36, by - hs * 0.4])}Z`, fill: "#5c2620" }, hg);

      el("path", { d: `M${P([hx - hs * 0.1, by - hs * 0.98])}L${P([hx + hs * 0.08, by - hs * 1.18])}M${P([hx + hs * 0.1, by - hs * 0.98])}L${P([hx - hs * 0.08, by - hs * 1.18])}`, stroke: wood, "stroke-width": hs * 0.035, "stroke-linecap": "round" }, hg);

    // ---------- Wayang kulit ----------
    // Puppets are shadow shapes with punched holes. Each hole is a sub-path cut out with the even-odd rule.
    const cut = (parent, d) => el("path", { d, fill: C.shadow, "fill-rule": "evenodd" }, parent);

    function gunungan(g) {
      const right = [[0, -1], [0, -1], [0.1, -0.82], [0.26, -0.56], [0.44, -0.28], [0.56, 0], [0.58, 0.24], [0.5, 0.46], [0.36, 0.62], [0.3, 0.68], [0.3, 0.68],
        [0.36, 0.7], [0.36, 0.7], [0.36, 0.82], [0.36, 0.82], [0, 0.82]];
      // Leaf shaped frame: a border of punched dots, a row of teardrops, an open field inside.
      let d = smooth(mirror(right), true);
      const ring = right.slice(1, 10), along = (i, t, sx, sy) => {
        const a = ring[i], b = ring[i + 1];
        return [(a[0] + (b[0] - a[0]) * t) * sx, 0.03 + (a[1] + (b[1] - a[1]) * t - 0.03) * sy];

            const [x, y] = along(i, k / 3, 0.91, 0.92);

          for (let k = 0; k < 2; k++) {

      d += "M-0.06 0.815V0.76A0.06 0.06 0 0 1 0.06 0.76V0.815Z" + circle(-0.19, 0.77, 0.022) + circle(0.19, 0.77, 0.022) + circle(-0.13, 0.66, 0.015) + circle(0.13, 0.66, 0.015)
        + "M-0.22 0.695H-0.1V0.705H-0.22ZM0.1 0.695H0.22V0.705H0.1Z";

      let branches = "", leaves = "M-0.05 0.64C-0.02 0.2 -0.03 -0.3 -0.012 -0.66L0.012 -0.66C0.03 -0.3 0.02 0.2 0.05 0.64Z" + drop(0, -0.64, 0.2, -90, 0.35);

        for (const s of [1, -1]) {
          const pts = cubicPts([0, y], [len * 0.35, y - up * 0.05], [len * 0.75, y - up * 0.3], [len, y - up], 8).concat(curl([len, y - up], -60, 0.06, 1.25, 1));

            + drop(len * 0.66 * s, y - up * 0.5, 0.09, s > 0 ? -50 : -130, 0.4) + drop(len * 0.8 * s, y - up * 0.72, 0.07, s > 0 ? 40 : 140, 0.4);
          const fc = polar(0.055, s > 0 ? 50 : 130, [len * s, y - up]);

      el("path", { d: leaves, fill: C.shadow }, g);
    }

    function figure(g) {

        [0.1, -0.455], [0.1, -0.455], [0.105, -0.435], [0.085, -0.425], [0.09, -0.405], [0.09, -0.405], [0.05, -0.38], [0.045, -0.35],
        [0.11, -0.31], [0.15, -0.24], [0.14, -0.14], [0.07, -0.03], [0.07, -0.03], [0.1, 0], [0.1, 0], [0.1, 0.05], [0.1, 0.05],
        [0.17, 0.2], [0.24, 0.42], [0.24, 0.42], [0.16, 0.42], [0.16, 0.42],

        [0, 0.46], [0, 0.46], [-0.06, 0.62], [-0.14, 0.86], [-0.12, 0.94], [-0.04, 0.98], [-0.04, 0.98], [-0.25, 0.99], [-0.25, 0.99], [-0.22, 0.9], [-0.16, 0.62], [-0.14, 0.42], [-0.14, 0.42],
        [-0.27, 0.42], [-0.27, 0.42], [-0.2, 0.2], [-0.12, 0.05], [-0.12, 0.05], [-0.09, -0.03], [-0.13, -0.18], [-0.13, -0.3],

        [0, -1], [0, -1], [0.035, -0.86], [0.04, -0.77], [0.04, -0.77], [0.065, -0.75], [0.06, -0.68], [0.06, -0.68], [0.085, -0.66], [0.07, -0.58], [0.07, -0.58]];

    function buildKelir(parent, L) {
      const m = u * 0.045, K = { x: m, y: m, w: W - 2 * m, h: H - 2 * m }, box = { x: m, y: m, width: K.w, height: K.h };
      const g = el("g", {}, parent);
      el("rect", { x: -W, y: -H, width: W * 3, height: H * 3, fill: C.night }, g);
      const glow = el("radialGradient", { id: "mh-kelir", gradientUnits: "userSpaceOnUse", cx: W / 2, cy: K.y + K.h * 0.58, r: Math.max(K.w, K.h) * 0.72 }, defs);
      [[0, "#ffe9b0"], [0.4, "#f7bd5e"], [0.78, "#c0602a"], [1, "#6a2812"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, glow));
      el("rect", { ...box, fill: "url(#mh-kelir)" }, g);
      const hot = el("radialGradient", { id: "mh-hot", gradientUnits: "userSpaceOnUse", cx: W / 2, cy: K.y + K.h * 0.55, r: Math.max(K.w, K.h) * 0.5 }, defs);
      [[0, "#fff8e0", 1], [1, "#fff8e0", 0]].forEach(([o, c, a]) => el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, hot));
      const hotRect = el("rect", { ...box, fill: "url(#mh-hot)" }, g);
      el("rect", { x: m * 0.45, y: m * 0.45, width: W - m * 0.9, height: H - m * 0.9, fill: "none", stroke: C.maroon, "stroke-width": m * 0.5 }, g);
      el("rect", { x: m * 0.82, y: m * 0.82, width: W - m * 1.64, height: H - m * 1.64, fill: "none", stroke: C.gold, "stroke-width": Math.max(0.8, m * 0.06), opacity: 0.8 }, g);
      const clip = el("clipPath", { id: "mh-kclip" }, defs);
      el("rect", box, clip);
      const stage = el("g", { "clip-path": "url(#mh-kclip)" }, g);

      // Sizes: the tree of life in the middle, two puppets beside it.
      const sg = Math.min((K.h * 0.8) / 1.82, (K.w * 0.6) / 1.24), sf = sg * 0.62;
      const base = Math.min(K.y + K.h * 0.95, H / 2 + sg * 0.9);

      const gw = el("g", {}, stage);

      gunungan(gi);

      const gun = { wrap: gw, inner: gi, blur: blur("mh-gblur"), x: W / 2, base, s: sg, drop: K.y + K.h - base + sg * 1.95 };

      const figs = [1, -1].map((side, i) => {
        const x = W / 2 - side * Math.max(sg * 0.62 + sf * 0.3, 0) ;

        const wrap = el("g", {}, stage);
        const rods = el("path", { fill: "none", stroke: C.shadow, "stroke-width": Math.max(0.8, sf * 0.012) }, wrap);

        const fore = "M-0.02 0L0.02 0L0.011 0.33L-0.011 0.33Z" + circle(0, 0, 0.022) + "M-0.012 0.32Q-0.04 0.38 0.01 0.43Q0.03 0.38 0.012 0.32Z";

        for (const a of [foreBack, foreFront]) el("path", { d: fore, fill: C.shadow }, a);

      });
      return { g, hotRect, gun, figs, K };
    }

    // ---------- Songket title panel ----------
    function buildPanel(parent, L) {
      const p = L.panel, x0 = p.x - p.w / 2, y0 = p.y - p.h / 2, h = p.h;
      const g = el("g", {}, parent);
      const inner = el("g", { filter: "url(#mh-drop)" }, g);
      const f = el("filter", { id: "mh-drop", x: "-10%", y: "-10%", width: "120%", height: "130%" }, defs);
      el("feDropShadow", { dx: 0, dy: h * 0.03, stdDeviation: h * 0.035, "flood-color": "#2a0a06", "flood-opacity": 0.45 }, f);
      el("rect", { x: x0, y: y0, width: p.w, height: h, rx: h * 0.02, fill: C.maroon }, inner);
      // Scattered bunga tabur, the small gold motifs woven through songket cloth.
      const ps = h * 0.16;
      const pat = el("pattern", { id: "mh-tabur", width: ps, height: ps, patternUnits: "userSpaceOnUse", x: x0, y: y0 }, defs);
      el("path", { d: `M${ps / 2} ${ps * 0.3}L${ps * 0.6} ${ps / 2}L${ps / 2} ${ps * 0.7}L${ps * 0.4} ${ps / 2}Z` + circle(0, 0, ps * 0.04) + circle(ps, 0, ps * 0.04) + circle(0, ps, ps * 0.04) + circle(ps, ps, ps * 0.04), fill: C.gold, opacity: 0.35 }, pat);
      el("rect", { x: x0, y: y0, width: p.w, height: h, rx: h * 0.02, fill: "url(#mh-tabur)" }, inner);
      const i1 = h * 0.04, i2 = h * 0.085;
      el("rect", { x: x0 + i1, y: y0 + i1, width: p.w - 2 * i1, height: h - 2 * i1, fill: "none", stroke: "url(#mh-gold)", "stroke-width": h * 0.018 }, inner);
      el("rect", { x: x0 + i2, y: y0 + i2, width: p.w - 2 * i2, height: h - 2 * i2, fill: "none", stroke: "url(#mh-gold)", "stroke-width": h * 0.007 }, inner);
      // Pucuk rebung: rows of bamboo shoot triangles along the top and bottom.
      const th = h * 0.13, bw = p.w - 2 * i2 - h * 0.04, n = Math.max(5, Math.round(bw / (th * 0.72))), tw = bw / n;
      const tris = [];
      for (const dir of [1, -1]) {
        const yb = dir > 0 ? y0 + i2 + h * 0.02 : y0 + h - i2 - h * 0.02;
        for (let i = 0; i < n; i++) {
          const xl = x0 + i2 + h * 0.02 + i * tw, cx = xl + tw / 2;
          const tg = el("g", {}, inner);
          const tri = (k, fill) => el("path", { d: `M${P([cx - (tw / 2) * k, yb + dir * th * (1 - k) * 0.1])}L${P([cx + (tw / 2) * k, yb + dir * th * (1 - k) * 0.1])}L${P([cx, yb + dir * th * (1 - (1 - k) * 0.35)])}Z`, fill }, tg);
          tri(0.92, "url(#mh-gold)");
          tri(0.6, C.maroon);
          tri(0.3, "url(#mh-gold)");
          el("path", { d: circle(xl, yb + dir * th * 0.2, h * 0.012), fill: "url(#mh-gold)" }, tg);
          tris.push({ g: tg, dir, cx, yb, i, n });
        }
      }
      // Title and small line
      const aw = p.w - 2 * i2 - h * 0.16, ah = h - 2 * (i2 + th + h * 0.05);
      const probe = el("text", { class: "title", "font-size": 100 }, svg);
      const measure = (s, cls = "title") => { probe.setAttribute("class", cls); probe.textContent = s; return probe.getComputedTextLength(); };
      const words = title.split(/\s+/);
      const options = [[title]];
      for (let i = 1; i < words.length; i++) options.push([words.slice(0, i).join(" "), words.slice(i).join(" ")]);
      const subW = subtitle ? measure(subtitle, "sub") : 0;
      let best = null;
      for (const lines of options) {
        const wMax = Math.max(...lines.map((s) => measure(s)));
        const fs = Math.min((aw * 100) / wMax, ah / (lines.length * 1.08 + (subtitle ? 0.72 : 0)));
        if (!best || fs > best.fs * 1.12) best = { lines, fs };
      }
      probe.remove();
      const fs = best.fs, lines = best.lines;
      const sfs = subtitle ? Math.min(fs * 0.3, (aw * 100) / subW, h * 0.075) : 0;
      const blockH = lines.length * fs * 1.08 + (subtitle ? sfs * 2.2 : 0);
      let y = p.y - blockH / 2 + fs * 0.54;
      const lineEls = lines.map((s) => {
        const t = el("text", { class: "title", x: p.x, y: y + fs * 0.02, "font-size": fs, fill: "url(#mh-gold)" }, g);
        t.textContent = s;
        y += fs * 1.08;
        return t;
      });
      let subEls = [];
      if (subtitle) {
        const dy = y - fs * 0.54 + sfs * 0.45;
        const dv = el("path", { d: `M${P([p.x - aw * 0.22, dy])}H${n3(p.x - sfs * 0.6)}M${P([p.x + sfs * 0.6, dy])}H${n3(p.x + aw * 0.22)}M${P([p.x, dy - sfs * 0.35])}l${n3(sfs * 0.35)} ${n3(sfs * 0.35)}l${n3(-sfs * 0.35)} ${n3(sfs * 0.35)}l${n3(-sfs * 0.35)} ${n3(-sfs * 0.35)}Z`, stroke: "url(#mh-gold)", "stroke-width": Math.max(0.6, h * 0.006), fill: "url(#mh-gold)" }, g);
        const st = el("text", { class: "sub", x: p.x, y: dy + sfs * 1.35, "font-size": sfs, fill: C.ink }, g);
        st.textContent = subtitle;
        subEls = [dv, st];
      }
      return { g, tris, lineEls, subEls, fs };
    }

    // ---------- Build the whole scene and its timeline ----------
    function build() {
      W = innerWidth;
      H = innerHeight;
      u = Math.min(W, H);
      wax.length = dyes.length = fills.length = 0;
      svg.replaceChildren();
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      defs = el("defs", {}, svg);
      const L = layout();

      const sky = el("linearGradient", { id: "mh-sky", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      [[0, "#f3b25c"], [0.45, C.sky], [1, "#fbe9c0"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, sky));

      [[0, "#fffaf0", 1], [0.35, "#fff1c4", 1], [0.42, "#ffe29a", 0.55], [1, "#ffd27a", 0]].forEach(([o, c, a]) => el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, sun));
      const petal = el("radialGradient", { id: "mh-petal", gradientUnits: "userSpaceOnUse", cx: 0, cy: 0, r: 1 }, defs);
      [[0, "#5e0b20"], [0.3, "#a3182f"], [0.75, C.red], [1, "#e8634f"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, petal));
      const leaf = el("linearGradient", { id: "mh-leaf", x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
      [[0, "#1c8a5a"], [1, "#0b5238"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, leaf));
      // Gold with a travelling glint for the songket.
      const p = L.panel;
      const gold = el("linearGradient", { id: "mh-gold", gradientUnits: "userSpaceOnUse", x1: p.x - p.w / 2, y1: p.y - p.h / 2, x2: p.x + p.w / 2, y2: p.y + p.h / 2 }, defs);
      [[0, "#c39033"], [0.38, C.gold], [0.5, "#fff4cc"], [0.62, C.gold], [1, "#c39033"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, gold));

      // Sky world
      const world = el("g", {}, svg);
      el("rect", { width: W, height: H, fill: "url(#mh-sky)" }, world);
      const sunG = el("g", {}, world);
      el("circle", { cx: W * 0.6, cy: L.horizon - u * 0.1, r: u * 0.3, fill: "url(#mh-sun)" }, sunG);
      const clouds = el("g", {}, world);
      buildCloud(clouds, W * 0.2, L.horizon * 0.14, u * 0.09);
      buildCloud(clouds, W * 0.84, L.horizon * 0.5, u * 0.075);
      const land = el("g", {}, world);
      buildHorizon(land, L);
      const strings = el("g", { fill: "none", stroke: "#5b3a24", "stroke-width": Math.max(0.7, u * 0.0024), opacity: 0.6 }, world);
      const kites = [
        buildKite(world, [C.blue, C.turmeric, C.maroon, "#fbe7b0", C.turmeric], "mh-k0"),
        buildKite(world, [C.emerald, C.red, C.turmeric, C.maroon, C.emerald], "mh-k1"),
      ];
      kites.forEach((k, i) => (k.str = el("path", {}, strings)));
      const batik = el("g", {}, world);
      L.flowers.forEach((F) => buildFlower(batik, F));
      const panel = buildPanel(world, L);
      const kel = buildKelir(svg, L);

      // Wax lines get a dash so they can draw themselves.
      for (const w of wax) {
        const len = w.p.getTotalLength();
        w.p.setAttribute("stroke-dasharray", `${n3(len)} ${n3(len)}`);
        w.p.setAttribute("stroke-dashoffset", n3(len));
        w.len = len;
      }

      // Animated values, read by update() on every frame.
      S = {
        kel: { o: 1, s: 1, glow: 0.1 },
        gun: { y: 1, blur: 5, sx: 1, o: 1 },
        figs: [{ dx: 1, blur: 6, o: 0 }, { dx: 1, blur: 6, o: 0 }],
        kites: L.kitesA.map((a, i) => ({ x: a.x - (i ? -1 : 1) * W * 0.12, y: H + a.s * 1.3, s: a.s })),
        panel: { sy: 0, o: 0 },
        land: { y: u * 0.06 },
      };
      R = { L, kel, kites, panel, land, sunG, world };

      tl = gsap.timeline({ repeat: -1, onUpdate: update });
      tl.set({}, {}, LOOP);
      // 1. Wayang kulit: lamp comes up, the tree of life is planted, two puppets step in.
      tl.fromTo(S.kel, { glow: 0.1 }, { glow: 0.45, duration: 0.8, ease: "sine.out" }, 0)
        .fromTo(S.gun, { y: 1, blur: 5 }, { y: 0, blur: 0, duration: 1.1, ease: "power3.out" }, 0.05)
        .fromTo(S.figs, { dx: 1, blur: 7, o: 0 }, { dx: 0, blur: 0, o: 1, duration: 0.8, ease: "power2.out", stagger: 0.15 }, 0.9)
        .fromTo(S.gun, { sx: 1 }, { sx: -1, duration: 0.3, ease: "power1.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.0)
        .fromTo(S.kel, { glow: 0.45 }, { glow: 1, duration: 0.6, ease: "sine.in", immediateRender: false }, 2.6)
        .fromTo([S.gun, ...S.figs], { o: 1 }, { o: 0, duration: 0.5, ease: "sine.in", immediateRender: false }, 2.75)
        .fromTo(S.kel, { o: 1, s: 1 }, { o: 0, s: 1.18, duration: 0.7, ease: "power2.in", immediateRender: false }, 2.95);
      // 2. The sky: land settles, kites rise, batik draws itself and dyes in.
      tl.fromTo(S.land, { y: u * 0.06 }, { y: 0, duration: 1.2, ease: "power2.out" }, 3.0);
      S.kites.forEach((k, i) => {
        const a = L.kitesA[i], b = L.kitesB[i];
        tl.fromTo(k, { x: a.x - (i ? -1 : 1) * W * 0.12, y: H + a.s * 1.3, s: a.s }, { x: a.x, y: a.y, duration: 1.7, ease: "power2.out" }, 3.2 + i * 0.35)
          .to(k, { x: b.x, y: b.y, s: b.s, duration: 1.3, ease: "power2.inOut" }, 6.5 + i * 0.1);
      });
      const batikAt = 4.1;
      for (const w of wax) {
        const inCloud = w.p.closest("g").parentNode === clouds;
        tl.fromTo(w.p, { attr: { "stroke-dashoffset": w.len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "sine.inOut" }, (inCloud ? 3.5 : batikAt) + w.order);
      }
      for (const fl of fills) {
        const inCloud = fl.p.closest("g").parentNode === clouds;
        tl.fromTo(fl.p, { attr: { "fill-opacity": 0 } }, { attr: { "fill-opacity": fl.max ?? 1 }, duration: 0.7, ease: "sine.out" }, (inCloud ? 4.2 : batikAt + 1.1) + fl.order);
      }
      for (const d of dyes) tl.fromTo(d.p, { attr: { "stroke-width": 0 } }, { attr: { "stroke-width": d.w }, duration: 0.6, ease: "sine.out" }, batikAt + 1 + d.order);
      // 3. Songket frame unrolls, triangles rise, the title appears.
      tl.fromTo(S.panel, { sy: 0.02, o: 0 }, { sy: 1, o: 1, duration: 0.7, ease: "power3.out" }, 6.8);
      panel.tris.forEach((t) => {
        const from = Math.abs(t.i - (t.n - 1) / 2);
        tl.fromTo(t.g, { scaleY: 0, svgOrigin: `${t.cx} ${t.yb}` }, { scaleY: 1, duration: 0.35, ease: "back.out(2)" }, 7.15 + from * 0.05);
      });
      tl.fromTo(panel.lineEls, { opacity: 0, y: panel.fs * 0.35 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", stagger: 0.15 }, 7.4);
      if (panel.subEls.length) tl.fromTo(panel.subEls, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.out" }, 8.05);
      // 4. Everything folds back into the dark screen, ready to loop.
      tl.to(S.panel, { sy: 0.02, o: 0, duration: 0.5, ease: "power2.in" }, 10.7)
        .set(S.gun, { y: 1, blur: 5, o: 1, sx: 1 }, 11)
        .fromTo(S.kel, { o: 0, s: 1.18, glow: 0.1 }, { o: 1, s: 1, duration: 1, ease: "power2.out", immediateRender: false }, 11);
    }

    // Per-frame work: sways, flicker, puppet arms, kite strings and the gold glint.
    function update() {
      const t = tl.time();
      const { L, kel, kites, panel, land, sunG } = R;

      kel.g.setAttribute("opacity", n3(S.kel.o));
      R.world.style.display = S.kel.o > 0.999 && S.kel.s < 1.001 ? "none" : "";
      kel.g.style.display = S.kel.o < 0.005 ? "none" : "";
      kel.g.setAttribute("transform", `translate(${W / 2} ${H / 2}) scale(${n3(S.kel.s)}) translate(${-W / 2} ${-H / 2})`);
      const flicker = 0.07 * wave(t, 23) + 0.05 * wave(t, 37, 1) + 0.03 * wave(t, 61, 2);
      kel.hotRect.setAttribute("opacity", n3(Math.max(0, Math.min(1, S.kel.glow + flicker))));

      const setBlur = (wrap, node, b, id) => {
        if (b > 0.05) { node.setAttribute("stdDeviation", n3(b * u * 0.004)); wrap.setAttribute("filter", `url(#${id})`); }
        else wrap.removeAttribute("filter");
      };
      const G = kel.gun;
      const gsway = 3 * wave(t, 6);
      G.wrap.setAttribute("opacity", n3(S.gun.o));
      setBlur(G.wrap, G.blur, S.gun.blur, "mh-gblur");
      G.inner.setAttribute("transform", `translate(${n3(G.x)} ${n3(G.base + S.gun.y * G.drop)}) rotate(${n3(gsway)}) scale(${n3(G.s * S.gun.sx)} ${n3(G.s)}) translate(0 -0.82)`);

      kel.figs.forEach((F, i) => {
        const st = S.figs[i];
        F.wrap.setAttribute("opacity", n3(st.o));
        if (st.o < 0.005) return;
        setBlur(F.wrap, F.blur, st.blur, `mh-fblur${i}`);
        const fx = F.x - F.side * st.dx * F.s * 0.5, bob = F.s * 0.015 * wave(t, 8, F.phase);
        F.inner.setAttribute("transform", `translate(${n3(fx)} ${n3(F.base + bob)}) scale(${n3(F.side * F.s)} ${n3(F.s)}) translate(0 -1)`);
        // Arms: angles from straight down, positive is forward.
        const dir = (a) => [Math.sin(rad(a)), Math.cos(rad(a))];
        const pose = (sh, a1, a2, up, fo) => {
          const e = [sh[0] + dir(a1)[0] * 0.36, sh[1] + dir(a1)[1] * 0.36];
          up.setAttribute("transform", `translate(${P(sh)}) rotate(${n3(-a1)})`);
          fo.setAttribute("transform", `translate(${P(e)}) rotate(${n3(-a2)})`);
          return [e[0] + dir(a2)[0] * 0.4, e[1] + dir(a2)[1] * 0.4];
        };
        const w1 = wave(t, 9, F.phase), w2 = wave(t, 9, F.phase + 1.2);
        const hf = pose([0.02, -0.29], 30 + 22 * w1, 95 + 30 * w2, F.armFront, F.foreFront);
        const hb = pose([-0.05, -0.28], -8 + 6 * w2, 25 + 10 * w1, F.armBack, F.foreBack);
        const toPx = ([x, y]) => [fx + F.side * F.s * x, F.base + bob + F.s * (y - 1)];
        const foot = toPx([0.04, 0.5]);
        let d = `M${P(foot)}L${P([foot[0] - F.side * F.s * 0.05, kel.K.y + kel.K.h + 4])}`;
        for (const h of [hf, hb]) {
          const a = toPx(h);
          d += `M${P(a)}L${P([a[0] - F.side * F.s * 0.12, kel.K.y + kel.K.h + 4])}`;
        }
        F.rods.setAttribute("d", d);
      });

      land.setAttribute("transform", `translate(0 ${n3(S.land.y)})`);
      sunG.setAttribute("transform", `translate(0 ${n3(S.land.y * 1.6)})`);

      kites.forEach((k, i) => {
        const st = S.kites[i];
        const rot = 5 * wave(t, 3, i * 2) + 2 * wave(t, 8, i);
        const x = st.x + st.s * 0.08 * wave(t, 2, i * 3), y = st.y + st.s * 0.06 * wave(t, 4, i);
        k.g.setAttribute("transform", `translate(${n3(x)} ${n3(y)}) rotate(${n3(rot)}) scale(${n3(st.s)})`);
        k.tassels.forEach((tas, j) => tas.g.setAttribute("transform", `translate(${tas.side * 0.86} -0.6) rotate(${n3(-rot * 0.8 + 14 * wave(t, 20, i + j * 2) + tas.side * 8)})`));
        const b = polar(st.s * 0.08, 90 + rot, [x, y]);
        const side = i ? 1 : -1, a = [st.x + side * W * 0.18, H + u * 0.05];
        const c = [(b[0] + a[0]) / 2 - side * u * 0.06, (b[1] + a[1]) / 2 + u * 0.02];
        k.str.setAttribute("d", `M${P(b)}Q${P(c)} ${P(a)}`);
      });

      const pg = panel.g, p = L.panel;
      pg.setAttribute("opacity", n3(S.panel.o));
      pg.style.display = S.panel.o < 0.005 ? "none" : "";
      pg.setAttribute("transform", `translate(0 ${n3(p.y)}) scale(1 ${n3(Math.max(0.001, S.panel.sy))}) translate(0 ${n3(-p.y)})`);
      const glint = ((t % 3) / 3) * 2.6 - 1.3;
      document.getElementById("mh-gold").setAttribute("gradientTransform", `translate(${n3(glint * p.w)} ${n3(glint * p.h)})`);
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    // Reduced motion: one still frame with the title, kites and batik in place.
    function apply() {
      if (reduce.matches) tl.pause(STILL);
      else tl.play();
      update();
    }
    reduce.addEventListener("change", apply);

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const at = tl.time();
        tl.kill();
        build();
        tl.time(at);
        apply();
      }, 150);
    });

    // Wait briefly for the fonts so the title is measured in the right face.
    Promise.race([
      Promise.all([document.fonts.load("700 1em Cinzel"), document.fonts.load("700 1em Nunito")]),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => { build(); apply(); });

    // ---------- Sound: off until the page asks for it ----------
    // Every sound is made here with the Web Audio API (no audio files) and is
    // scheduled against the timeline clock, so it stays in step with the picture.
    (() => {
      const q = params.get("sound");
      let want = q === "1" || q === "effects";
      let music = q !== "effects";
      const MASTER = 0.7, MUSIC = 0.24;
      let ctx = null, master, fx, mus, verb, echo, noiseBuf, timer = 0, offTimer = 0;
      const plucks = new Map();

      // Timeline clock, sampled on every animation frame.
      let lastT = 0, lastPerf = 0, wraps = 0, synced = false, offset = 0, until = 0;
      gsap.ticker.add(() => {
        if (!tl) return;
        const t = tl.time();
        if (t < lastT - LOOP / 2) wraps++;
        lastT = t;
        lastPerf = performance.now() / 1000;
      });

      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      const rnd = (a, b) => a + Math.random() * (b - a);

      function init() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 12;
        comp.ratio.value = 4;
        comp.attack.value = 0.005;
        comp.release.value = 0.25;
        comp.connect(ctx.destination);
        master = ctx.createGain();
        master.gain.value = 0;
        master.connect(comp);
        fx = ctx.createGain();
        fx.connect(master);
        mus = ctx.createGain();
        mus.gain.value = music ? MUSIC : 0;
        mus.connect(master);

        // White noise, shared by wind, brushes, drums and swishes.
        const sr = ctx.sampleRate;
        noiseBuf = ctx.createBuffer(1, sr * 2, sr);
        const nd = noiseBuf.getChannelData(0);
        for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

        // Warm room reverb from a generated, softened impulse.
        verb = ctx.createConvolver();
        const len = Math.floor(sr * 2.6), ir = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = ir.getChannelData(c);
          let lp = 0;
          for (let i = 0; i < len; i++) {
            lp += 0.35 * (Math.random() * 2 - 1 - lp);
            d[i] = lp * Math.pow(1 - i / len, 3.2) * (i < sr * 0.012 ? i / (sr * 0.012) : 1);
          }
        }
        verb.buffer = ir;
        const vOut = ctx.createGain();
        vOut.gain.value = 0.55;
        verb.connect(vOut).connect(master);

        // A soft echo for the music only.
        echo = ctx.createDelay(1);
        echo.delayTime.value = 0.5625;
        const fb = ctx.createGain(), eLp = ctx.createBiquadFilter(), eOut = ctx.createGain();
        fb.gain.value = 0.28;
        eLp.type = "lowpass";
        eLp.frequency.value = 2200;
        eOut.gain.value = 0.5;
        echo.connect(eLp).connect(fb).connect(echo);
        eLp.connect(eOut).connect(mus);

        // Low drone on D and A, breathing slowly. It runs all the time under the music bus.
        const dLp = ctx.createBiquadFilter(), dG = ctx.createGain(), breath = ctx.createOscillator(), bG = ctx.createGain();
        dLp.type = "lowpass";
        dLp.frequency.value = 520;
        dG.gain.value = 0.1;
        dLp.connect(dG).connect(mus);
        [[hz(38), "sine", 1], [hz(38) * 1.003, "sine", 0.6], [hz(45), "triangle", 0.35], [hz(50), "sine", 0.22]].forEach(([f, type, v]) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = type;
          o.frequency.value = f;
          g.gain.value = v;
          o.connect(g).connect(dLp);
          o.start();
        });
        breath.frequency.value = 1 / 6;
        bG.gain.value = 0.03;
        breath.connect(bG).connect(dG.gain);
        breath.start();
      }

      // ---- Small building blocks ----
      // A voice output: dry to a bus, some of it to the reverb, optional pan.
      function route(bus, wet, pan = 0) {
        const g = ctx.createGain();
        let head = g;
        if (pan) {
          const p = ctx.createStereoPanner();
          p.pan.value = pan;
          g.connect(p);
          head = p;
        }
        head.connect(bus);
        if (wet) {
          const w = ctx.createGain();
          w.gain.value = wet;
          head.connect(w).connect(verb);
        }
        return g;
      }
      function osc(type, f, at, end, dest) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = f;
        o.frequency.setValueAtTime(f, at);
        o.connect(dest);
        o.start(at);
        o.stop(end);
        return o;
      }
      function amp(dest, v = 0) {
        const g = ctx.createGain();
        g.gain.value = v;
        g.connect(dest);
        return g;
      }
      function filter(type, f, Q, dest) {
        const b = ctx.createBiquadFilter();
        b.type = type;
        b.frequency.value = f;
        b.Q.value = Q;
        b.connect(dest);
        return b;
      }
      function noise(at, dur, dest) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.connect(dest);
        s.start(at, rnd(0, 1.5));
        s.stop(at + dur);
        return s;
      }
      // Hit: quick rise then an exponential fall.
      function hit(g, at, peak, att, dec) {
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(peak, at + att);
        g.gain.exponentialRampToValueAtTime(0.0001, at + att + dec);
      }
      // Swell: rise to a peak at `pk` (0 to 1 of the length), then fall away.
      function swell(g, at, dur, peak, pk = 0.5) {
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(peak, at + dur * pk);
        g.gain.linearRampToValueAtTime(0, at + dur);
      }

      // ---- Instruments ----
      // Tetawak-like gong: low, warm, slightly beating, soft mallet.
      function gong(at, f, level, pan = 0) {
        const lp = filter("lowpass", 1800, 0.5, route(fx, 0.45, pan));
        [[1, 1, 5.5], [1.0045, 0.55, 5], [0.5, 0.28, 3.5], [2.01, 0.3, 2.4], [2.76, 0.13, 1.3], [4.13, 0.05, 0.7]].forEach(([r, v, d]) => {
          const g = amp(lp), o = osc("sine", f * r * 1.015, at, at + d + 0.1, g);
          o.frequency.exponentialRampToValueAtTime(f * r, at + 0.3);
          hit(g, at, v * level * 0.26, 0.02, d);
        });
        const th = amp(filter("lowpass", 320, 0.7, lp));
        noise(at, 0.2, th);
        hit(th, at, level * 0.5, 0.004, 0.12);
      }
      // Gendang / rebana taps. "dung" is the open low stroke, "tak" the dry slap.
      function drum(at, kind, level, pan = 0, bus = fx) {
        const out = route(bus, 0.16, pan);
        if (kind === "dung") {
          const g = amp(out), o = osc("sine", 165, at, at + 0.6, g);
          o.frequency.exponentialRampToValueAtTime(92, at + 0.12);
          hit(g, at, level, 0.004, 0.42);
          const c = amp(filter("bandpass", 1100, 1, out));
          noise(at, 0.06, c);
          hit(c, at, level * 0.12, 0.002, 0.03);
        } else {
          const n = amp(filter("bandpass", 2300, 1.3, out));
          noise(at, 0.12, n);
          hit(n, at, level * 0.55, 0.002, 0.07);
          const g = amp(out), o = osc("triangle", 540, at, at + 0.2, g);
          o.frequency.exponentialRampToValueAtTime(430, at + 0.06);
          hit(g, at, level * 0.3, 0.002, 0.09);
        }
      }
      // Band-passed noise that moves between two pitches: puppet swish, cloth, air.
      function swish(at, dur, f0, f1, level, pk = 0.5, Q = 0.9, pan = 0, wet = 0.3) {
        const b = filter("bandpass", f0, Q, route(fx, wet, pan));
        b.frequency.setValueAtTime(f0, at);
        b.frequency.exponentialRampToValueAtTime(f1, at + dur);
        const g = ctx.createGain();
        g.connect(b);
        noise(at, dur + 0.05, g);
        swell(g, at, dur, level, pk);
      }
      // Airy wind swell, two layers.
      function wind(at, dur, level, pk = 0.45) {
        const lp = filter("lowpass", 1400, 0.3, route(fx, 0.4));
        const b = filter("bandpass", 380, 0.6, lp);
        b.frequency.setValueAtTime(380, at);
        b.frequency.exponentialRampToValueAtTime(1100, at + dur * pk);
        b.frequency.exponentialRampToValueAtTime(480, at + dur);
        const g = ctx.createGain();
        g.connect(b);
        noise(at, dur + 0.05, g);
        swell(g, at, dur, level, pk);
        const hp = filter("highpass", 3200, 0.5, route(fx, 0.3, 0.2));
        const g2 = ctx.createGain();
        g2.connect(hp);
        noise(at, dur + 0.05, g2);
        swell(g2, at, dur, level * 0.18, pk + 0.1);
      }
      // The busur hum of a wau bulan: a buzzy drone that rises with the kite and wavers in the wind.
      function hum(at, dur, f, level, pan) {
        const out = route(fx, 0.35, pan);
        const env = amp(out);
        env.gain.setValueAtTime(0, at);
        env.gain.linearRampToValueAtTime(level, at + 0.9);
        env.gain.setValueAtTime(level, at + dur - 1.4);
        env.gain.linearRampToValueAtTime(0, at + dur);
        const trem = amp(env, 0.75);
        const l1 = osc("sine", rnd(4.6, 5.6), at, at + dur, amp(trem.gain, 0.2));
        const l2 = osc("sine", rnd(0.6, 0.9), at, at + dur, amp(trem.gain, 0.12));
        const lp = filter("lowpass", 1900, 0.4, trem);
        const bp = filter("bandpass", f * 3, 1.4, lp);
        const vib = ctx.createGain();
        vib.gain.value = f * 0.012;
        const wob = osc("sine", 0.35, at, at + dur, vib);
        [1, 1.007].forEach((r) => {
          const o = osc("sawtooth", f * r * 0.93, at, at + dur, bp);
          o.frequency.exponentialRampToValueAtTime(f * r, at + 1.7);
          vib.connect(o.frequency);
        });
        return [l1, l2, wob];
      }
      // Paper flutter: noise chopped by a fast wobble.
      function flutter(at, dur, level, pan) {
        const env = amp(filter("bandpass", 1600, 0.8, route(fx, 0.25, pan)));
        swell(env, at, dur, level, 0.35);
        const chop = amp(env, 0.5);
        osc("triangle", rnd(11, 14), at, at + dur, amp(chop.gain, 0.5));
        noise(at, dur, chop);
      }
      // Canting stroke: a soft hiss of wax on cloth.
      function brush(at, dur, level, f, pan) {
        const b = filter("bandpass", f, 0.9, route(fx, 0.2, pan));
        b.frequency.setValueAtTime(f * 0.8, at);
        b.frequency.linearRampToValueAtTime(f * 1.15, at + dur);
        const g = amp(filter("highpass", 900, 0.5, b));
        noise(at, dur + 0.05, g);
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(level, at + 0.1);
        g.gain.linearRampToValueAtTime(level * 0.7, at + dur * 0.7);
        g.gain.linearRampToValueAtTime(0, at + dur);
      }
      // Small bell, bonang-like: used for the dye shimmer and the gold glint.
      function chime(at, f, level, dur = 1.6, pan = 0, wet = 0.55) {
        const out = route(fx, wet, pan);
        [[1, 1, dur], [2.01, 0.22, dur * 0.5], [3.93, 0.07, dur * 0.25]].forEach(([r, v, d]) => {
          const g = amp(out);
          osc("sine", f * r, at, at + d + 0.05, g);
          hit(g, at, level * v, 0.004, d);
        });
      }
      // Metallic shimmer: a high airy sweep with a few tiny bells on top.
      function shimmer(at, dur, level) {
        const b = filter("bandpass", 4200, 2.5, route(fx, 0.6));
        b.frequency.setValueAtTime(4200, at);
        b.frequency.exponentialRampToValueAtTime(9000, at + dur);
        const g = ctx.createGain();
        g.connect(b);
        noise(at, dur + 0.05, g);
        swell(g, at, dur, level, 0.5);
        [86, 90, 93, 95, 98].forEach((m, i) => chime(at + i * dur * 0.16, hz(m), level * 0.45, 1.1, -0.5 + i * 0.25, 0.7));
      }
      // Bamboo flute: soft sine with a breath and a slow vibrato.
      function flute(at, m, dur, level) {
        const f = hz(m), end = at + dur;
        const out = route(mus, 0.35, 0.12);
        const e = ctx.createGain();
        e.connect(out);
        e.connect(echo);
        const env = amp(filter("lowpass", 2600, 0.5, e));
        env.gain.setValueAtTime(0, at);
        env.gain.linearRampToValueAtTime(level, at + 0.09);
        env.gain.setValueAtTime(level, end - 0.05);
        env.gain.exponentialRampToValueAtTime(0.0001, end + 0.35);
        const vib = ctx.createGain();
        vib.gain.setValueAtTime(0, at);
        vib.gain.linearRampToValueAtTime(f * 0.007, at + Math.min(0.5, dur));
        osc("sine", 5.2, at, end + 0.4, vib);
        [["sine", 1, 1], ["triangle", 2, 0.08], ["sine", 3, 0.04]].forEach(([type, r, v]) => {
          const o = osc(type, f * r * 0.975, at, end + 0.4, amp(env, v));
          o.frequency.exponentialRampToValueAtTime(f * r, at + 0.07);
          vib.connect(o.frequency);
        });
        const br = amp(filter("bandpass", f * 2, 1.5, e));
        noise(at, dur + 0.3, br);
        br.gain.setValueAtTime(0, at);
        br.gain.linearRampToValueAtTime(level * 0.3, at + 0.05);
        br.gain.linearRampToValueAtTime(level * 0.08, at + 0.25);
        br.gain.linearRampToValueAtTime(0, end + 0.3);
      }
      // Plucked string (Karplus-Strong), rendered once per note and cached.
      function pluckBuf(m) {
        if (plucks.has(m)) return plucks.get(m);
        const sr = ctx.sampleRate, n = Math.floor(sr * 1.8), N = Math.round(sr / hz(m));
        const b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
        let lp = 0;
        for (let i = 0; i < N; i++) { lp += 0.5 * (Math.random() * 2 - 1 - lp); d[i] = lp; }
        for (let i = N; i < n; i++) d[i] = 0.4985 * (d[i - N] + d[i - N + 1]);
        plucks.set(m, b);
        return b;
      }
      function pluck(at, m, level, pan) {
        const s = ctx.createBufferSource();
        s.buffer = pluckBuf(m);
        const g = amp(filter("lowpass", 2400, 0.6, route(mus, 0.3, pan)), level);
        s.connect(g);
        s.start(at);
      }

      // ---- What plays when (loop seconds). Effects follow the picture. ----
      const FX = [
        // Wayang kulit: the lamp comes up with a gong, the tree rises, puppets step in on the drum.
        [0, (a) => gong(a, hz(38), 1)],
        [0.05, (a) => swish(a, 1.0, 220, 700, 0.05, 0.3, 0.8, 0, 0.3)],
        [0.9, (a) => drum(a, "dung", 0.5, -0.3)],
        [1.05, (a) => drum(a, "dung", 0.42, 0.3)],
        [1.2, (a) => drum(a, "tak", 0.4, -0.2)],
        [1.35, (a) => drum(a, "tak", 0.34, 0.2)],
        [1.65, (a) => drum(a, "dung", 0.3, 0)],
        // The tree of life turns over and back: two leather swishes.
        [2.0, (a) => swish(a, 0.32, 700, 1500, 0.1, 0.55, 1.1, -0.2)],
        [2.3, (a) => swish(a, 0.32, 1500, 650, 0.09, 0.45, 1.1, 0.2)],
        // The light floods out into the sky: wind.
        [2.6, (a) => wind(a, 2.6, 0.17, 0.4)],
        // Wau bulan rise: busur hum and a paper flutter each.
        [3.2, (a) => { hum(a, 4.8, hz(50), 0.03, -0.35); flutter(a, 1.8, 0.035, -0.35); }],
        [3.55, (a) => { hum(a, 4.3, hz(57), 0.022, 0.4); flutter(a, 1.6, 0.028, 0.4); }],
        // Batik: canting strokes on the clouds, then the flowers.
        [3.5, (a) => brush(a, 0.7, 0.05, 2600, -0.3)],
        [3.72, (a) => brush(a, 0.6, 0.035, 3200, 0.4)],
        [4.1, (a) => brush(a, 0.7, 0.06, 2400, -0.5)],
        [4.32, (a) => brush(a, 0.7, 0.05, 2900, 0.5)],
        [4.55, (a) => brush(a, 0.75, 0.055, 2200, -0.4)],
        [4.9, (a) => brush(a, 0.7, 0.045, 3100, 0.45)],
        [5.1, (a) => brush(a, 0.6, 0.04, 2700, -0.2)],
        // Dye soaks in: a watery swell and a rising pentatonic shimmer.
        [5.1, (a) => swish(a, 1.5, 300, 1300, 0.05, 0.5, 0.6, 0, 0.5)],
        [5.15, (a) => chime(a, hz(81), 0.05, 1.6, -0.4)],
        [5.35, (a) => chime(a, hz(83), 0.045, 1.6, 0.3)],
        [5.55, (a) => chime(a, hz(86), 0.045, 1.6, -0.2)],
        [5.8, (a) => chime(a, hz(88), 0.04, 1.6, 0.4)],
        [6.05, (a) => chime(a, hz(90), 0.035, 1.8, 0)],
        // Kites glide up to make room for the title.
        [6.4, (a) => wind(a, 1.5, 0.08, 0.5)],
        // Songket unrolls, the pucuk rebung rise with a gold chime sweep, the title lands on a gong.
        [6.8, (a) => { swish(a, 0.7, 380, 2400, 0.16, 0.22, 0.9, 0, 0.3); drum(a + 0.1, "dung", 0.18, 0); }],
        [7.15, (a) => {
          const steps = [...new Set(R.panel.tris.map((t) => Math.abs(t.i - (t.n - 1) / 2)))].sort((x, y) => x - y);
          steps.forEach((s, i) => chime(a + s * 0.05, hz([86, 88, 90, 93, 95, 98, 100, 102][Math.min(i, 7)]), 0.03, 0.9, 0, 0.6));
        }],
        [7.45, (a) => gong(a, hz(45), 0.6)],
        [8.05, (a) => R.panel.subEls.length && chime(a, hz(86), 0.035, 1.8, 0, 0.7)],
        // The second gold glint crosses the cloth.
        [10.05, (a) => shimmer(a, 0.9, 0.035)],
        // The songket folds away and the shadow screen returns.
        [10.7, (a) => { swish(a, 0.5, 2200, 320, 0.13, 0.8, 0.9, 0, 0.3); drum(a + 0.48, "dung", 0.14, 0); }],
        [11.0, (a) => swish(a, 1.0, 250, 800, 0.06, 0.85, 0.6, 0, 0.4)],
      ];

      // Music: 80 bpm, 16 beats = one 12 s loop. D major pentatonic.
      const B = 0.75, MU = [];
      [[0, 69, 1.5], [1.5, 71, 0.5], [2, 69, 1], [3, 66, 1], [4, 64, 1], [5, 66, 0.5], [5.5, 69, 0.5], [6, 62, 2],
        [8, 66, 1], [9, 69, 1], [10, 71, 1], [11, 74, 0.5], [11.5, 71, 0.5], [12, 69, 2], [14, 66, 1], [15, 64, 1]]
        .forEach(([b, m, d]) => MU.push([b * B, (a) => flute(a, m, d * B - 0.04, 0.16)]));
      [[50, 57, 62, 57, 54], [45, 52, 57, 52, 50], [47, 54, 59, 54, 50], [45, 52, 57, 54, 52]].forEach((notes, bar) => {
        [0, 1, 1.5, 2.5, 3].forEach((b, i) => MU.push([(bar * 4 + b) * B, (a) => pluck(a, notes[i], i ? 0.28 : 0.36, i % 2 ? 0.25 : -0.25)]));
      });
      // Gendang on an eighth-note grid. The first bar stays light for the wayang drum.
      for (let bar = 0; bar < 4; bar++) {
        const pat = bar ? ["dung", 0, "tak", 0, "dung", "dung", "tak", bar === 3 ? "tak" : 0] : [0, 0, 0, 0, 0, 0, "tak", 0];
        pat.forEach((k, i) => k && MU.push([(bar * 8 + i) * B / 2, (a) => drum(a, k, k === "dung" ? 0.26 : 0.2, 0, mus)]));
      }

      // ---- Scheduler: every 25 ms, queue what falls in the next ~100 ms ----
      function tick() {
        if (!ctx || ctx.state !== "running") return;
        const now = performance.now() / 1000;
        if (!tl || tl.paused() || reduce.matches || document.hidden || now - lastPerf > 0.2) { synced = false; return; }
        const o = wraps * LOOP + lastT - lastPerf;
        if (!synced || Math.abs(o - offset) > 0.06) { offset = o; until = o + now; synced = true; }
        else offset += (o - offset) * 0.1;
        let ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : {};
        if (!ts.performanceTime) ts = { contextTime: ctx.currentTime, performanceTime: performance.now() };
        const lag = Math.max(0, ctx.currentTime - ts.contextTime);
        const from = Math.max(until, offset + now - 0.02), to = offset + now + 0.1 + lag;
        if (to <= from) return;
        const at = (u) => Math.max(ctx.currentTime, ts.contextTime + (u - offset) - ts.performanceTime / 1000);
        for (let n = Math.floor(from / LOOP); n <= Math.floor(to / LOOP); n++) {
          for (const list of music ? [FX, MU] : [FX]) {
            for (const [t, fn] of list) {
              const u = n * LOOP + t;
              if (u > from && u <= to) fn(at(u));
            }
          }
        }
        until = to;
      }

      function fade(v, time) {
        const g = master.gain, t = ctx.currentTime;
        g.cancelScheduledValues(t);
        g.setValueAtTime(g.value, t);
        g.linearRampToValueAtTime(v, t + time);
      }
      function update() {
        const active = want && !reduce.matches && !document.hidden;
        if (active) {
          if (!ctx) init();
          clearTimeout(offTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          fade(MASTER, 0.3);
          if (!timer) timer = setInterval(tick, 25);
        } else if (ctx) {
          fade(0, 0.15);
          clearTimeout(offTimer);
          offTimer = setTimeout(() => {
            clearInterval(timer);
            timer = 0;
            synced = false;
            ctx.suspend().catch(() => {});
          }, 180);
        }
        if (ctx) mus.gain.setTargetAtTime(music ? MUSIC : 0, ctx.currentTime, 0.05);
      }

      addEventListener("message", (e) => {
        const d = e.data;
        if (e.origin !== location.origin || !d || d.type !== "motionprompt-sound") return;
        if (typeof d.music === "boolean") music = d.music;
        want = !!d.on;
        update();
      });
      reduce.addEventListener("change", update);
      document.addEventListener("visibilitychange", update);
      // Browsers may hold audio until a click or key press.
      const unlock = () => { if (ctx && ctx.state === "suspended" && want && !reduce.matches && !document.hidden) ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);
      if (want) update();
    })();
  </script>
</body>
</html>
