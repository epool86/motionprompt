<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic typography demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/anton@5.3.0/index.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=10131f&ink=f6f3ea&accent=ff5a4e&accent2=ffd23f */
    :root {
      --bg: #10131f;
      --ink: #f6f3ea;
      --accent: #ff5a4e;
      --accent2: #ffd23f;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Anton", "Arial Narrow", Impact, sans-serif;
      text-transform: uppercase;
      overflow: hidden;
    }

    .word,
    .final {
      grid-area: 1 / 1;
      visibility: hidden;
    }

    .word {
      line-height: 1;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .word span,
    .final span { display: inline-block; }

    .final {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.92;
      white-space: nowrap;
    }

    .wipe {
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: scaleY(0);
      transform-origin: 50% 100%;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" role="img">
    <div class="final" id="final"></div>
    <div class="wipe" id="wipe"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const root = document.documentElement;
    for (const key of ["bg", "ink", "accent", "accent2"]) {
      const value = params.get(key);
      if (/^[0-9a-f]{6}$/i.test(value ?? "")) root.style.setProperty(`--${key}`, `#${value}`);
    }
    const text = (params.get("text") || "Make it move").trim().slice(0, 80);
    const words = text.split(/\s+/).filter(Boolean).slice(0, 8);

    const css = getComputedStyle(root);
    const color = (name) => css.getPropertyValue(name).trim();
    const bg = color("--bg"), ink = color("--ink"), accent = color("--accent"), accent2 = color("--accent2");

    const stage = document.getElementById("stage");
    const final = document.getElementById("final");
    const wipe = document.getElementById("wipe");
    stage.setAttribute("aria-label", `Animated words: ${text}`);

    // One element per word, plus the stacked final line.
    const wordEls = words.map((w) => {
      const node = document.createElement("div");
      node.className = "word";
      node.textContent = w;
      stage.insertBefore(node, final);
      return node;
    });
    const lineColors = [ink, accent, accent2];
    const lineEls = words.map((w, i) => {
      const span = document.createElement("span");
      span.textContent = w;
      span.style.color = lineColors[i % lineColors.length];
      final.append(span);
      return span;
    });

    // Size the words so the longest one always fits the frame.
    function fit() {
      const w = innerWidth, h = innerHeight;
      const charW = 0.5; // Anton capitals are about half an em wide
      for (const node of wordEls) {
        const len = Math.max(2, node.textContent.length);
        node.style.fontSize = `${Math.min((w * 0.86) / (len * charW), h * 0.34)}px`;
      }
      const longest = Math.max(2, ...words.map((x) => x.length));
      final.style.fontSize = `${Math.min((w * 0.84) / (longest * charW), (h * 0.8) / (words.length * 0.92))}px`;
    }
    fit();
    addEventListener("resize", fit);

    // Wrap each letter in a span so letters can move on their own.
    function splitLetters(node) {
      const letters = [...node.textContent.trim()].map((ch) => {
        const span = document.createElement("span");
        span.textContent = ch;
        return span;
      });
      node.replaceChildren(...letters);
      return letters;
    }

    function build() {
      const beat = 0.45; // about 133 beats per minute
      const tl = gsap.timeline({ repeat: -1, defaults: { ease: "expo.out" } });
      // Background cuts between the palette colours; text flips to stay readable.
      const looks = [
        { backgroundColor: bg, color: ink },
        { backgroundColor: accent, color: bg },
        { backgroundColor: accent2, color: bg },
      ];

      wordEls.forEach((node, i) => {
        const at = i * beat * 2;
        const look = looks[i % looks.length];
        if (i > 0) tl.set(wordEls[i - 1], { autoAlpha: 0 }, at);
        tl.set(stage, look, at).set(node, { autoAlpha: 1 }, at);
        const kind = i % 3;
        if (kind === 0) {
          // Punch in from big and rotated
          tl.fromTo(node, { scale: 2.6, rotation: -12 }, { scale: 1, rotation: -3, duration: 0.35 }, at);
        } else if (kind === 1) {
          // Letters spin in one by one
          tl.fromTo(splitLetters(node), { scale: 0, rotation: 25 },
            { scale: 1, rotation: 0, duration: 0.4, stagger: 0.06, ease: "back.out(2.5)" }, at);
        } else {
          // Letters drop from above
          tl.fromTo(splitLetters(node), { yPercent: -160, rotation: (j) => (j % 2 ? 14 : -14) },
            { yPercent: 0, rotation: 0, duration: 0.45, stagger: 0.05, ease: "back.out(1.6)" }, at);
        }
      });

      // The full line slides in from alternating sides, holds, then a wipe restarts the loop.
      const end = wordEls.length * beat * 2;
      tl.set(wordEls[wordEls.length - 1], { autoAlpha: 0 }, end)
        .set(stage, looks[0], end)
        .set(final, { autoAlpha: 1 }, end)
        .fromTo(lineEls, { xPercent: (i) => (i % 2 ? 140 : -140), autoAlpha: 0 },
          { xPercent: 0, autoAlpha: 1, duration: 0.5, stagger: beat / 2 }, end)
        .addLabel("hold")
        .to(wipe, { scaleY: 1, duration: 0.35, ease: "power3.in" }, `hold+=${beat * 3}`)
        .set(final, { autoAlpha: 0 })
        .set(wipe, { transformOrigin: "50% 0%" })
        .to(wipe, { scaleY: 0, duration: 0.35, ease: "power3.out" })
        .set(wipe, { transformOrigin: "50% 100%" });

      // Reduced motion: show the finished line as a still frame.
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      const apply = () => (reduce.matches ? tl.pause("hold+=1") : tl.play());
      apply();
      reduce.addEventListener("change", apply);
      sound.attach(tl);
    }

    // Sound: every sound is made with the Web Audio API. It is off until the
    // parent page (or ?sound=1 / ?sound=effects) turns it on, and it follows the
    // GSAP timeline clock so hits land on the words.
    const sound = (() => {
      const beat = 0.45;
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      const LEVEL = 0.4, MUSIC = 0.3;
      let tl = null, events = [], loopLen = 0;
      let ctx = null, master, impulse, noiseBuf, session = null, fxBus, musicBus, verbSend;
      let wantOn = false, wantMusic = true, playing = false;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0, frameAt = 0;

      // The list of sounds for one loop, worked out from the same numbers as the timeline.
      function plan() {
        const list = [];
        const n = words.length;
        const add = (t, type, extra = {}, music = false) => list.push({ t, type, music, ...extra });
        words.forEach((w, i) => {
          const at = i * beat * 2;
          add(at, "punch", { i });
          if (i > 0) add(at, "cut", { i });
          const letters = [...w].length;
          const kind = i % 3;
          for (let j = 0; j < letters; j++) {
            if (kind === 1) add(at + j * 0.06, "spin", { j });
            if (kind === 2) add(at + j * 0.05 + 0.17, "drop", { j });
          }
        });
        const end = n * beat * 2;
        if ((n - 1) % 3 !== 0) add(end, "cut", { i: n });
        add(Math.max(0, end - beat * 2), "riser", { dur: Math.min(end, beat * 2) });
        add(end, "boom");
        words.forEach((w, i) => add(end + i * beat / 2 + 0.04, "swish", { side: i % 2 ? 1 : -1 }));
        const wipeAt = tl.labels.hold + beat * 3;
        add(wipeAt, "whoosh");

        // Music: kick on the beat, hats on the off-beat, a bass line and soft chord stabs.
        // It drops out for the colour wipe, then comes back in with the next word.
        const roots = [55, 43.65, 65.41, 49]; // A, F, C, G
        const chords = [[220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]];
        const wordBeats = new Set(words.map((w, i) => i * 2).concat(n * 2));
        for (let k = 0; k * beat < wipeAt - 0.02; k++) {
          const t = k * beat, bar = Math.floor(k / 4) % 4;
          if (!wordBeats.has(k)) add(t, "kick", {}, true);
          if (t + beat / 2 < wipeAt - 0.02) {
            add(t + beat / 2, "hat", { accent: 1 }, true);
            add(t + beat / 2, "bass", { f: roots[bar] * (k % 4 === 3 ? 2 : 1) }, true);
          }
          if (t + beat * 0.75 < wipeAt - 0.02) add(t + beat * 0.75, "hat", { accent: 0.4 }, true);
          if (k % 4 === 0) add(t, "stab", { notes: chords[bar] }, true);
        }
        return list.sort((a, b) => a.t - b.t);
      }

      function attach(timeline) {
        tl = timeline;
        loopLen = tl.duration();
        // Note when GSAP last drew a frame, so the timeline can be read between frames.
        frameAt = performance.now();
        gsap.ticker.add(() => { frameAt = performance.now(); });
        events = plan();
        reduce.addEventListener("change", update);
        update();
      }

      // Audio graph: effects and music buses, a small reverb, a compressor before the speakers.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.18;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);

        // Reverb impulse: stereo noise that fades out.
        const len = Math.floor(ctx.sampleRate * 1.3);
        impulse = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          for (let s = 0; s < len; s++) d[s] = (Math.random() * 2 - 1) * Math.pow(1 - s / len, 3.2);
        }

        noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const nd = noiseBuf.getChannelData(0);
        for (let s = 0; s < nd.length; s++) nd[s] = Math.random() * 2 - 1;
      }

      // Each time sound is turned on it gets fresh buses, so sounds queued before a
      // stop can never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.05);
        session.connect(master);
        fxBus = ctx.createGain();
        fxBus.connect(session);
        musicBus = ctx.createGain();
        musicBus.gain.value = wantMusic ? MUSIC : 0;
        musicBus.connect(session);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const verbOut = ctx.createGain();
        verbOut.gain.value = 0.3;
        verbSend = ctx.createGain();
        verbSend.connect(verb).connect(verbOut).connect(session);
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.disconnect(), 250);
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.start(when, Math.random() * 0.8);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function send(node, amount) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(verbSend);
      }

      function kick(when, peak, out) {
        const o = osc("sine", 160, when, 0.4);
        o.frequency.exponentialRampToValueAtTime(46, when + 0.11);
        o.connect(amp(when, peak, 0.002, 0.36, out));
        const click = noise(when, 0.02);
        click.connect(filter("highpass", 2500)).connect(amp(when, peak * 0.25, 0.001, 0.012, out));
      }

      // One function per sound.
      const voices = {
        punch(when, e) {
          kick(when, 0.95, fxBus);
          const n = noise(when, 0.16);
          const bp = filter("bandpass", 1900, 0.9);
          const g = amp(when, 0.5, 0.002, 0.13, pan(e.i % 2 ? 0.15 : -0.15, fxBus));
          n.connect(bp).connect(g);
          send(g, 0.35);
        },
        cut(when) {
          const n = noise(when, 0.06);
          n.connect(filter("highpass", 4200)).connect(amp(when, 0.32, 0.001, 0.045, fxBus));
          const o = osc("square", 1500, when, 0.05);
          o.frequency.exponentialRampToValueAtTime(620, when + 0.035);
          const g = amp(when, 0.07, 0.001, 0.04, fxBus);
          o.connect(filter("lowpass", 3000)).connect(g);
          send(g, 0.4);
        },
        spin(when, e) {
          const f = 1100 * Math.pow(2, (e.j * 2) / 12);
          const o = osc("triangle", f, when, 0.08);
          o.frequency.exponentialRampToValueAtTime(f * 1.5, when + 0.05);
          const g = amp(when, 0.16, 0.002, 0.06, pan(e.j % 2 ? 0.45 : -0.45, fxBus));
          o.connect(g);
          const n = noise(when, 0.06);
          const bp = filter("bandpass", 3000, 2);
          bp.frequency.exponentialRampToValueAtTime(7000, when + 0.05);
          n.connect(bp).connect(amp(when, 0.12, 0.004, 0.05, g));
          send(g, 0.25);
        },
        drop(when, e) {
          const f = 950 * Math.pow(2, -e.j / 12);
          const o = osc("sine", f, when, 0.12);
          o.frequency.exponentialRampToValueAtTime(f * 0.45, when + 0.06);
          const g = amp(when, 0.3, 0.001, 0.09, pan(e.j % 2 ? 0.35 : -0.35, fxBus));
          o.connect(g);
          const n = noise(when, 0.03);
          n.connect(filter("bandpass", 2400, 1.2)).connect(amp(when, 0.14, 0.001, 0.02, g));
          send(g, 0.2);
        },
        riser(when, e) {
          const d = e.dur;
          const n = noise(when, d);
          const bp = filter("bandpass", 350, 1.1);
          bp.frequency.setValueAtTime(350, when);
          bp.frequency.exponentialRampToValueAtTime(7000, when + d);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.45, when + d - 0.01);
          g.gain.linearRampToValueAtTime(0.0001, when + d + 0.01);
          g.connect(fxBus);
          n.connect(bp).connect(g);
          send(g, 0.3);
        },
        boom(when) {
          const o = osc("sine", 90, when, 1.4);
          o.frequency.exponentialRampToValueAtTime(34, when + 0.9);
          o.connect(amp(when, 0.95, 0.004, 1.3, fxBus));
          const n = noise(when, 0.5);
          const g = amp(when, 0.45, 0.002, 0.4, fxBus);
          n.connect(filter("lowpass", 700)).connect(g);
          send(g, 0.8);
        },
        swish(when, e) {
          const n = noise(when, 0.2);
          const bp = filter("bandpass", 2600, 1.4);
          bp.frequency.exponentialRampToValueAtTime(700, when + 0.18);
          const g = amp(when, 0.14, 0.03, 0.15, pan(e.side * 0.6, fxBus));
          n.connect(bp).connect(g);
        },
        whoosh(when) {
          // Rises as the wipe covers the screen, falls as it clears.
          const n = noise(when, 0.75);
          const bp = filter("bandpass", 300, 0.8);
          bp.frequency.setValueAtTime(300, when);
          bp.frequency.exponentialRampToValueAtTime(3200, when + 0.35);
          bp.frequency.exponentialRampToValueAtTime(350, when + 0.72);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(1, when + 0.34);
          g.gain.exponentialRampToValueAtTime(0.0001, when + 0.75);
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(-0.5, when);
          p.pan.linearRampToValueAtTime(0.5, when + 0.7);
          p.connect(fxBus);
          n.connect(bp).connect(g).connect(p);
          send(g, 0.35);
        },
        kick(when) {
          kick(when, 0.8, musicBus);
        },
        hat(when, e) {
          const n = noise(when, 0.05);
          n.connect(filter("highpass", 7500)).connect(amp(when, 0.22 * e.accent, 0.001, 0.035, musicBus));
        },
        bass(when, e) {
          const out = amp(when, 0.34, 0.005, 0.2, musicBus);
          const lp = filter("lowpass", 900, 3);
          lp.frequency.setValueAtTime(900, when);
          lp.frequency.exponentialRampToValueAtTime(160, when + 0.18);
          lp.connect(out);
          osc("sawtooth", e.f, when, 0.22).connect(lp);
          const o2 = osc("sawtooth", e.f * 1.006, when, 0.22);
          o2.connect(lp);
          osc("sine", e.f, when, 0.22).connect(out);
        },
        stab(when, e) {
          const out = amp(when, 0.1, 0.01, 0.4, musicBus);
          const lp = filter("lowpass", 1400);
          lp.connect(out);
          for (const f of e.notes) osc("triangle", f, when, 0.45).connect(lp);
          send(out, 0.6);
        },
      };

      // The audio time being heard right now, from the output clock when the browser gives one.
      function heardNow() {
        const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
        const pnow = performance.now();
        if (ts && ts.contextTime > 0 && ts.performanceTime > 0 && Math.abs(pnow - ts.performanceTime) < 1000) {
          return ts.contextTime + (pnow - ts.performanceTime) / 1000;
        }
        return ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
      }

      // Look-ahead scheduler: every 25 ms, schedule sounds due in the next 100 ms.
      // Timeline time is mapped to heard audio time by an anchor that is re-set after any jump.
      function tick() {
        if (!playing || !tl || ctx.state !== "running") { anchor = null; return; }
        if (document.hidden || tl.paused() || reduce.matches) { anchor = null; return; }
        const now = tl.totalTime() + Math.min(0.1, (performance.now() - frameAt) / 1000);
        const at = heardNow();
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.08) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          // Start fresh so nothing piles up, but never book the same stretch twice.
          doneUpTo = now > doneUpTo - 0.5 && now < doneUpTo ? doneUpTo : now;
        }
        const from = doneUpTo;
        const to = anchor.tl + (at - anchor.audio) + 0.1 + Math.max(0, ctx.currentTime - at);
        if (to <= from) return;
        for (let k = Math.floor(from / loopLen); k <= Math.floor(to / loopLen); k++) {
          for (const e of events) {
            const t = k * loopLen + e.t;
            if (t < from || t >= to) continue;
            if (e.music && !wantMusic) continue;
            voices[e.type](Math.max(ctx.currentTime, anchor.audio + (t - anchor.tl)), e);
          }
        }
        doneUpTo = to;
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && tl && !reduce.matches;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            openSession();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
          const t = ctx.currentTime;
          musicBus.gain.cancelScheduledValues(t);
          musicBus.gain.setTargetAtTime(wantMusic ? MUSIC : 0, t, 0.03);
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend(), 200);
        }
      }

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);

      addEventListener("message", (event) => {
        if (event.origin !== location.origin) return;
        const data = event.data;
        if (!data || data.type !== "motionprompt-sound") return;
        if (typeof data.on === "boolean") wantOn = data.on;
        if (typeof data.music === "boolean") wantMusic = data.music;
        update();
      });

      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantOn = true;
        wantMusic = fromUrl === "1";
      }

      return { attach };
    })();

    // Wait briefly for the font so the first frame is not in a fallback face.
    Promise.race([
      document.fonts.load("1em Anton"),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(build);
  </script>
</body>
</html>
