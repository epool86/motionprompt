<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kinetic typography demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/anton@5.3.0/index.css">
  <style>
    :root {
      --navy: #10131f;
      --ink: #f6f3ea;
      --coral: #ff5a4e;
      --sun: #ffd23f;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--navy);
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: var(--ink);
      font-family: "Anton", "Arial Narrow", Impact, sans-serif;
      text-transform: uppercase;
      overflow: hidden;
    }

    .word,
    .final {
      grid-area: 1 / 1;
      visibility: hidden;
    }

    .word {
      font-size: min(38vw, 32vh);
      line-height: 1;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .word span,
    .final span { display: inline-block; }

    .final {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: min(32vw, 19vh);
      line-height: 0.92;
    }

    .final .l2 { color: var(--coral); }
    .final .l3 { color: var(--sun); }

    .wipe {
      position: absolute;
      inset: 0;
      background: var(--coral);
      transform: scaleY(0);
      transform-origin: 50% 100%;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" role="img" aria-label="Animated words: Make it move">
    <div class="word" id="w1">Make</div>
    <div class="word" id="w2">it</div>
    <div class="word" id="w3">move</div>
    <div class="final" id="final">
      <span class="l1">Make</span>
      <span class="l2">it</span>
      <span class="l3">move</span>
    </div>
    <div class="wipe" id="wipe"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const css = getComputedStyle(document.documentElement);
    const color = (name) => css.getPropertyValue(name).trim();
    const navy = color("--navy"), ink = color("--ink"), coral = color("--coral"), sun = color("--sun");

    // Wrap each letter in a span so letters can move on their own.
    function splitLetters(node) {
      const letters = [...node.textContent.trim()].map((ch) => {
        const span = document.createElement("span");
        span.textContent = ch;
        return span;
      });
      node.replaceChildren(...letters);
      return letters;
    }

    function build() {
      const stage = document.getElementById("stage");
      const [w1, w2, w3] = ["w1", "w2", "w3"].map((id) => document.getElementById(id));
      const lines = document.querySelectorAll("#final span");
      const final = document.getElementById("final");
      const wipe = document.getElementById("wipe");
      const itLetters = splitLetters(w2);
      const moveLetters = splitLetters(w3);

      const beat = 0.45; // about 133 beats per minute
      const tl = gsap.timeline({ repeat: -1, defaults: { ease: "expo.out" } });

      // Beat 1: MAKE punches in from big
      tl.set(stage, { backgroundColor: navy, color: ink })
        .fromTo(w1, { autoAlpha: 0, scale: 2.6, rotation: -12 },
          { autoAlpha: 1, scale: 1, rotation: -3, duration: 0.35 })

      // Beat 3: hard cut to coral, IT spins in letter by letter
        .set(w1, { autoAlpha: 0 }, beat * 2)
        .set(stage, { backgroundColor: coral, color: navy }, beat * 2)
        .set(w2, { autoAlpha: 1 }, beat * 2)
        .fromTo(itLetters, { scale: 0, rotation: 25 },
          { scale: 1, rotation: 0, duration: 0.4, stagger: 0.06, ease: "back.out(2.5)" }, beat * 2)

      // Beat 5: cut to yellow, MOVE drops from above
        .set(w2, { autoAlpha: 0 }, beat * 4)
        .set(stage, { backgroundColor: sun, color: navy }, beat * 4)
        .set(w3, { autoAlpha: 1 }, beat * 4)
        .fromTo(moveLetters, { yPercent: -160, rotation: (i) => (i % 2 ? 14 : -14) },
          { yPercent: 0, rotation: 0, duration: 0.45, stagger: 0.05, ease: "back.out(1.6)" }, beat * 4)

      // Beat 7: back to navy, the full line slides in from alternating sides
        .set(w3, { autoAlpha: 0 }, beat * 6)
        .set(stage, { backgroundColor: navy, color: ink }, beat * 6)
        .set(final, { autoAlpha: 1 }, beat * 6)
        .fromTo(lines, { xPercent: (i) => (i % 2 ? 140 : -140), autoAlpha: 0 },
          { xPercent: 0, autoAlpha: 1, duration: 0.5, stagger: beat / 2 }, beat * 6)
        .addLabel("hold")

      // Hold, then a colour wipe clears the screen so the loop restarts cleanly
        .to(wipe, { scaleY: 1, duration: 0.35, ease: "power3.in" }, `hold+=${beat * 3}`)
        .set(final, { autoAlpha: 0 })
        .set(wipe, { transformOrigin: "50% 0%" })
        .to(wipe, { scaleY: 0, duration: 0.35, ease: "power3.out" });

      // Reduced motion: show the finished line as a still frame.
      const reduce = matchMedia("(prefers-reduced-motion: reduce)");
      const apply = () => (reduce.matches ? tl.pause("hold") : tl.play());
      apply();
      reduce.addEventListener("change", apply);
    }

    // Wait briefly for the font so the first frame is not in a fallback face.
    Promise.race([
      document.fonts.load("1em Anton"),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(build);
  </script>
</body>
</html>
