<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glitch demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.3.0/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.3.0/800.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=0b0c0f&ink=eef2f0&accent=c6ff00 */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0c0f;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Faint scanlines and dark corners */
    .screen {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse 85% 80% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.5) 100%);
    }
  </style>
</head>
<body>
  <canvas id="screen" role="img"></canvas>
  <div class="screen"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => "#" + (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const colors = { bg: hex("bg", "0b0c0f"), ink: hex("ink", "eef2f0"), accent: hex("accent", "c6ff00") };
    const text = (params.get("text") || "System online").trim().slice(0, 40).toUpperCase();
    const words = text.split(/\s+/).filter(Boolean);

    const canvas = document.getElementById("screen");
    canvas.setAttribute("aria-label", `Glitching digital text that reads: ${text}`);
    const ctx = canvas.getContext("2d");
    // Everything is drawn here first, then copied to the screen in slices when it glitches.
    const scene = document.createElement("canvas");
    const sg = scene.getContext("2d");

    const LOOP = 10; // seconds
    const HEAD = (px) => `800 ${px}px "JetBrains Mono", ui-monospace, monospace`;
    const MONO = (px) => `500 ${px}px "JetBrains Mono", ui-monospace, monospace`;

    // Seeded random numbers, so the same moment always glitches the same way.
    function rand(seed) {
      let s = (seed * 2654435761) % 2147483647 || 1;
      return () => ((s = (s * 16807) % 2147483647) / 2147483647);
    }

    // Split a colour into its red part and its green plus blue part, for the channel split.
    function channels(c) {
      const [r, g, b] = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
      return [`rgb(${r},0,0)`, `rgb(0,${g},${b})`];
    }
    const inkCh = channels(colors.ink);
    const accentCh = channels(colors.accent);

    // ---- The timeline: a hard cut to each word, then the whole line, then a short standby ----
    const shown = words.slice(0, 4);
    const wordTime = Math.min(1.4, 4 / shown.length);
    const shots = shown.map((wd, i) => ({ lines: [wd], from: i * wordTime, to: (i + 1) * wordTime, label: "decoding" }));
    const phraseFrom = shown.length * wordTime;
    shots.push({ lines: null, from: phraseFrom, to: 8.9, label: "signal locked" });
    shots.push({ lines: [], from: 8.9, to: LOOP, label: "standby" });

    // Glitch strength over time: short bursts at every cut, one big burst mid line.
    const bursts = [
      ...shots.map((s) => [s.from, 0.14, 0.7]),
      [phraseFrom + 1.4, 0.08, 0.35],
      [phraseFrom + 3.1, 0.3, 1],
    ];
    function glitchAt(t) {
      let g = 0;
      for (const [at, len, power] of bursts) {
        if (t >= at && t < at + len) g = Math.max(g, power);
      }
      return g;
    }

    let w = 0, h = 0, dpr = 1, layout = null;

    function fitLines(options, maxW, maxH) {
      let best = null;
      for (const lines of options) {
        sg.font = HEAD(100);
        const ew = Math.max(...lines.map((l) => sg.measureText(l).width / 100));
        const size = Math.min(maxW / ew, maxH / (lines.length * 1.05));
        if (!best || size > best.size * 1.05) best = { lines, size };
      }
      return best;
    }

    function build() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth;
      h = innerHeight;
      for (const c of [canvas, scene]) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
      }
      const m = Math.min(w, h);
      const cap = Math.max(8, Math.round(m * 0.04));
      const margin = Math.max(8, m * 0.06);
      const maxW = w - margin * 2.4;
      const maxH = h - (margin + cap * 2.6) * 2;
      // The whole line may wrap onto two or three lines on tall screens.
      const options = [[words.join(" ")]];
      for (let a = 1; a < words.length; a++) {
        options.push([words.slice(0, a).join(" "), words.slice(a).join(" ")]);
        for (let b = a + 1; b < words.length; b++) {
          options.push([words.slice(0, a).join(" "), words.slice(a, b).join(" "), words.slice(b).join(" ")]);
        }
      }
      const phrase = fitLines(options, maxW, maxH);
      phrase.size = Math.min(phrase.size, m * 0.22);
      const single = shown.map((wd) => fitLines([[wd]], maxW, Math.min(maxH, m * 0.3)));
      layout = { m, cap, margin, phrase, single };
    }

    // ---- Drawing the scene ----
    function drawText(lines, size, split, jolt, accentLast) {
      sg.font = HEAD(size);
      sg.textAlign = "center";
      sg.textBaseline = "middle";
      sg.globalCompositeOperation = "lighter";
      const lh = size * 1.05;
      lines.forEach((line, i) => {
        const y = h / 2 + (i - (lines.length - 1) / 2) * lh;
        const [red, rest] = accentLast && i === lines.length - 1 && lines.length > 1 ? accentCh : inkCh;
        const shift = jolt ? jolt(i) : 0;
        sg.fillStyle = red;
        sg.fillText(line, w / 2 - split + shift, y);
        sg.fillStyle = rest;
        sg.fillText(line, w / 2 + split + shift, y);
      });
      sg.globalCompositeOperation = "source-over";
    }

    function drawCaptions(t, shot, calm) {
      const { cap, margin } = layout;
      sg.font = MONO(cap);
      sg.textBaseline = "alphabetic";
      // Top: a channel tag and a running timecode.
      sg.fillStyle = colors.accent;
      sg.textAlign = "left";
      sg.fillRect(margin, margin, cap * 0.6, cap * 0.6);
      sg.fillStyle = colors.ink;
      sg.globalAlpha = 0.7;
      sg.fillText("CH_04 LIVE", margin + cap * 1.1, margin + cap * 0.62);
      sg.textAlign = "right";
      const frames = Math.floor(t * 24);
      const pad = (n) => String(n).padStart(2, "0");
      sg.fillText(`00:00:${pad(Math.floor(frames / 24))}:${pad(frames % 24)}`, w - margin, margin + cap * 0.62);
      // Bottom: a prompt that types out, with a blinking block cursor.
      sg.textAlign = "left";
      const line = `> ${shot.label}`;
      const typed = calm ? line : line.slice(0, Math.floor((t - shot.from) * 28) + 2);
      const y = h - margin;
      sg.globalAlpha = 0.85;
      sg.fillText(typed, margin, y);
      sg.globalAlpha = 1;
      const on = calm || Math.floor(t * 2) % 2 === 0; // one blink per second
      if (on) {
        sg.fillStyle = colors.accent;
        sg.fillRect(margin + sg.measureText(typed).width + cap * 0.2, y - cap * 0.78, cap * 0.55, cap * 0.95);
      }
    }

    function render(t, calm) {
      const { m, phrase, single } = layout;
      const shot = shots.find((s) => t >= s.from && t < s.to) ?? shots[shots.length - 1];
      const g = calm ? 0 : glitchAt(t);
      const r = rand(Math.floor(t * 20) + 7); // new noise 20 times a second, only during bursts

      sg.setTransform(dpr, 0, 0, dpr, 0, 0);
      sg.fillStyle = colors.bg;
      sg.fillRect(0, 0, w, h);

      // Calm: a small steady channel split. Bursts: a wide one that jumps around.
      const split = m * 0.004 + g * m * 0.03 * (r() - 0.3);
      const jolt = g ? () => (r() - 0.5) * g * m * 0.08 : null;
      const i = shots.indexOf(shot);
      if (shot.lines === null) drawText(phrase.lines, phrase.size, split, jolt, true);
      else if (shot.lines.length) drawText(shot.lines, single[i].size, split, jolt, false);
      drawCaptions(t, shot, calm);

      // Copy to the screen, in shifted slices when glitching.
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (!g) {
        ctx.drawImage(scene, 0, 0);
        return;
      }
      const W = canvas.width, H = canvas.height;
      const roll = g > 0.9 ? Math.round((r() - 0.5) * H * 0.08) : 0; // big bursts jump the whole frame
      let y = 0;
      while (y < H) {
        const sh = Math.max(2, Math.round(H * (0.01 + r() * 0.08)));
        const dx = r() < 0.45 * g ? Math.round((r() - 0.5) * W * 0.18 * g) : 0;
        ctx.drawImage(scene, 0, y, W, sh, dx, y + roll, W, sh);
        y += sh;
      }
      // Block noise: a few stray blocks copied from elsewhere, and a few in the accent colour.
      const blocks = Math.round(3 + g * 10);
      for (let k = 0; k < blocks; k++) {
        const bw = W * (0.03 + r() * 0.2), bh = H * (0.01 + r() * 0.04);
        const bx = r() * W, by = r() * H;
        if (r() < 0.6) {
          ctx.drawImage(scene, r() * (W - bw), r() * (H - bh), bw, bh, bx, by, bw, bh);
        } else {
          ctx.globalAlpha = 0.25 + r() * 0.4;
          ctx.fillStyle = r() < 0.7 ? colors.accent : colors.ink;
          ctx.fillRect(bx, by, bw * 0.5, Math.max(1, bh * 0.4));
          ctx.globalAlpha = 1;
        }
      }
    }

    // ---- Run ----
    let frame = 0, start = 0;
    function loop(now) {
      if (!start) start = now;
      render(((now - start) / 1000) % LOOP, false);
      frame = requestAnimationFrame(loop);
    }

    // Reduced motion: the whole line as a clean still frame. No glitches, no blinking.
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    const still = () => render(phraseFrom + 2, true);
    function apply() {
      cancelAnimationFrame(frame);
      frame = 0;
      if (reduce.matches) still();
      else {
        start = 0;
        frame = requestAnimationFrame(loop);
      }
    }

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        build();
        if (reduce.matches) still();
      }, 100);
    });
    reduce.addEventListener("change", apply);

    // Wait briefly for the fonts so the text is measured in the right face.
    Promise.race([
      Promise.all([document.fonts.load(HEAD(100)), document.fonts.load(MONO(20))]),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => {
      build();
      apply();
    });
  </script>
</body>
</html>
