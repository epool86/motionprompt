          for (const [bt, n] of tune) add((half + bt) * BEAT, "gambus", { m: n + (half && n < 72 ? 12 : 0), lv: 0.34 }, true);
        }
        return list.map((e) => ({ ...e, t: ((e.t % LOOP) + LOOP) % LOOP })).sort((a, b) => a.t - b.t);
      }

      function attach(timeline) {
        tl = timeline;
        loopLen = tl.duration();
        events = plan();
        reduce.addEventListener("change", update);
        document.addEventListener("visibilitychange", () => { anchor = null; });
        update();
      }

      // Audio graph: effects and music buses, a small reverb, a compressor before the speakers.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 10;
        comp.ratio.value = 4;
        comp.attack.value = 0.004;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);
        const sr = ctx.sampleRate, len = Math.floor(sr * 1.8);
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          let lp = 0;
          for (let s = 0; s < len; s++) {
            lp += 0.4 * (Math.random() * 2 - 1 - lp);
            d[s] = lp * Math.pow(1 - s / len, 3) * (s < sr * 0.01 ? s / (sr * 0.01) : 1);
          }
        }
        noiseBuf = ctx.createBuffer(1, sr * 2, sr);
        const nd = noiseBuf.getChannelData(0);
        for (let s = 0; s < nd.length; s++) nd[s] = Math.random() * 2 - 1;
      }

      // Each time sound is turned on it gets fresh buses, so sounds queued before a
      // stop can never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.05);
        session.connect(master);
        fxBus = ctx.createGain();
        fxBus.connect(session);
        musicBus = ctx.createGain();
        musicBus.gain.value = wantMusic ? MUSIC : 0;
        musicBus.connect(session);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const verbOut = ctx.createGain();
        verbOut.gain.value = 0.32;
        verbSend = ctx.createGain();
        verbSend.connect(verb).connect(verbOut).connect(session);
        // A soft dotted echo for the plucked melody.
        const echo = ctx.createDelay(1);
        echo.delayTime.value = BEAT * 0.75;
        const fb = ctx.createGain(), lp = ctx.createBiquadFilter();
        fb.gain.value = 0.3;
        lp.type = "lowpass";
        lp.frequency.value = 2400;
        echoIn = ctx.createGain();
        echoIn.gain.value = 0.35;
        echoIn.connect(echo);
        echo.connect(lp).connect(fb).connect(echo);
        lp.connect(musicBus);
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.disconnect(), 250);
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      function env(when, dur, peak, pk, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, when);
        g.gain.linearRampToValueAtTime(peak, when + dur * pk);
        g.gain.linearRampToValueAtTime(0, when + dur);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(when, dur, off = 0.3) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.start(when, off);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function send(node, amount) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(verbSend);
      }
      // Band-passed noise that sweeps between two pitches and pans across.
      function swish(when, dur, f0, f1, level, pk, q, p0, p1, wet = 0.3) {
        const n = noise(when, dur);
        const bp = filter("bandpass", f0, q);
        bp.frequency.setValueAtTime(f0, when);
        bp.frequency.exponentialRampToValueAtTime(f1, when + dur);
        const pn = ctx.createStereoPanner();
        pn.pan.setValueAtTime(p0, when);
        pn.pan.linearRampToValueAtTime(p1, when + dur);
        pn.connect(fxBus);
        const g = env(when, dur, level, pk, pn);
        n.connect(bp).connect(g);
        send(g, wet);
        return g;
      }
      function bell(when, f, level, dur, p = 0, wet = 0.5, bus = fxBus) {
        const out = pan(p, bus);
        for (const [r, v, d] of [[1, 1, dur], [2.76, 0.18, dur * 0.4], [5.4, 0.06, dur * 0.2]]) {
          const g = amp(when, level * v, 0.004, d, out);
          osc("sine", f * r, when, d + 0.05).connect(g);
          send(g, wet);
        }
      }
      function drum(when, kind, level, out) {
        if (kind === "dung") {
          const o = osc("sine", 190, when, 0.5);
          o.frequency.exponentialRampToValueAtTime(96, when + 0.1);
          o.connect(amp(when, level, 0.003, 0.34, out));
          noise(when, 0.05).connect(filter("bandpass", 900, 1)).connect(amp(when, level * 0.25, 0.002, 0.03, out));
        } else {
          const g = amp(when, level * 0.7, 0.002, 0.08, out);
          noise(when, 0.12).connect(filter("bandpass", 2600, 1.4)).connect(g);
          const o = osc("triangle", 620, when, 0.12);
          o.frequency.exponentialRampToValueAtTime(470, when + 0.05);
          o.connect(amp(when, level * 0.3, 0.002, 0.07, out));
        }
      }
      // Plucked string (Karplus-Strong), rendered once per note and cached.
      function pluckBuf(m) {
        if (plucks.has(m)) return plucks.get(m);
        const sr = ctx.sampleRate, n = Math.floor(sr * 1.4), N = Math.round(sr / hz(m));
        const b = ctx.createBuffer(1, n, sr), d = b.getChannelData(0);
        let lp = 0;
        for (let i = 0; i < N; i++) {
          lp += 0.7 * (Math.random() * 2 - 1 - lp);
          d[i] = lp;
        }
        for (let i = N; i < n; i++) d[i] = 0.497 * (d[i - N] + d[i - N + 1]);
        plucks.set(m, b);
        return b;
      }

      // One function per sound.
      const voices = {
        chime(when, e) {
          bell(when, hz(e.m), e.lv, 1.4, e.pan, 0.55);
        },
        bloomSwell(when) {
          // Rising air and a low bloom into full cover.
          swish(when, 0.55, 250, 2600, 0.38, 0.92, 0.8, 0, 0, 0.3);
          const o = osc("sine", 55, when, 0.6);
          o.frequency.exponentialRampToValueAtTime(98, when + 0.5);
          o.connect(env(when, 0.6, 0.35, 0.85, fxBus));
          const sh = filter("highpass", 5000, 0.5);
          noise(when, 0.55).connect(sh).connect(env(when, 0.55, 0.08, 0.9, fxBus));
        },
        bloomPop(when) {
          const o = osc("sine", 120, when, 0.4);
          o.frequency.exponentialRampToValueAtTime(52, when + 0.25);
          o.connect(amp(when, 0.42, 0.004, 0.35, fxBus));
          [74, 77, 81, 86].forEach((m, i) => bell(when + i * 0.018, hz(m), 0.09, 1.6, -0.3 + i * 0.2, 0.6));
        },
        petal(when, e) {
          // A quick fluttering swish per petal.
          const n = noise(when, 0.3, 0.2 + e.i * 0.1);
          const bp = filter("bandpass", 1500 + e.i * 250, 1.1);
          bp.frequency.exponentialRampToValueAtTime(700, when + 0.28);
          const g = env(when, 0.3, 0.3, 0.25, pan([-0.7, 0.5, -0.3, 0.7, 0][e.i], fxBus));
          const trem = ctx.createGain();
          trem.gain.value = 0.5;
          const lfo = osc("square", 26 + e.i * 3, when, 0.3);
          const depth = ctx.createGain();
          depth.gain.value = 0.5;
          lfo.connect(depth).connect(trem.gain);
          n.connect(bp).connect(trem).connect(g);
          send(g, 0.25);
        },
        waxZip(when) {
          // A fast zip that races across with the canting.
          const n = noise(when, 0.5);
          const bp = filter("bandpass", 900, 2.2);
          bp.frequency.setValueAtTime(900, when);
          bp.frequency.exponentialRampToValueAtTime(5200, when + 0.48);
          const trem = ctx.createGain();
          trem.gain.value = 0.55;
          const lfo = osc("sawtooth", 38, when, 0.5);
          lfo.frequency.linearRampToValueAtTime(70, when + 0.45);
          const depth = ctx.createGain();
          depth.gain.value = 0.45;
          lfo.connect(depth).connect(trem.gain);
          const pn = ctx.createStereoPanner();
          pn.pan.setValueAtTime(-0.8, when);
          pn.pan.linearRampToValueAtTime(0.8, when + 0.5);
          pn.connect(fxBus);
          const g = env(when, 0.5, 0.42, 0.6, pn);
          n.connect(bp).connect(trem).connect(g);
          send(g, 0.2);
          const s = osc("sine", 1400, when, 0.5);
          s.frequency.exponentialRampToValueAtTime(2800, when + 0.48);
          s.connect(env(when, 0.5, 0.03, 0.7, pn));
        },
        dyeRush(when) {
          // Liquid rush: low filtered noise that bubbles.
          const n = noise(when, 0.9, 0.9);
          const lp = filter("lowpass", 500, 1.5);
          lp.frequency.setValueAtTime(400, when);
          lp.frequency.exponentialRampToValueAtTime(1600, when + 0.45);
          lp.frequency.exponentialRampToValueAtTime(600, when + 0.9);
          const trem = ctx.createGain();
          trem.gain.value = 0.6;
          const lfo = osc("sine", 9, when, 0.9);
          const depth = ctx.createGain();
          depth.gain.value = 0.35;
          lfo.connect(depth).connect(trem.gain);
          const g = env(when, 0.9, 0.55, 0.35, fxBus);
          n.connect(lp).connect(trem).connect(g);
          send(g, 0.35);
        },
        drip(when, e) {
          const o = osc("sine", e.f, when, 0.12);
          o.frequency.exponentialRampToValueAtTime(e.f * 2.1, when + 0.05);
          const g = amp(when, e.lv, 0.002, 0.08, pan(e.pan, fxBus));
          o.connect(g);
          send(g, 0.4);
        },
        clothSweep(when) {
          // A big diagonal whoosh with a fabric flap.
          const n = noise(when, 1.05, 0.5);
          const bp = filter("bandpass", 300, 0.8);
          bp.frequency.setValueAtTime(300, when);
          bp.frequency.exponentialRampToValueAtTime(2200, when + 0.5);
          bp.frequency.exponentialRampToValueAtTime(420, when + 1.0);
          const trem = ctx.createGain();
          trem.gain.value = 0.7;
          const lfo = osc("triangle", 15, when, 1.05);
          lfo.frequency.linearRampToValueAtTime(6, when + 1.0);
          const depth = ctx.createGain();
          depth.gain.value = 0.3;
          lfo.connect(depth).connect(trem.gain);
          const pn = ctx.createStereoPanner();
          pn.pan.setValueAtTime(-0.7, when);
          pn.pan.linearRampToValueAtTime(0.7, when + 1.0);
          pn.connect(fxBus);
          const g = env(when, 1.05, 0.75, 0.45, pn);
          n.connect(bp).connect(trem).connect(g);
          send(g, 0.3);
          const body = noise(when, 1.0, 1.1);
          body.connect(filter("lowpass", 260, 0.7)).connect(env(when, 1.0, 0.5, 0.5, fxBus));
        },
        clothSnap(when) {
          noise(when, 0.1, 0.4).connect(filter("bandpass", 1300, 1.2)).connect(amp(when, 0.35, 0.002, 0.07, fxBus));
          const o = osc("sine", 140, when, 0.2);
          o.frequency.exponentialRampToValueAtTime(70, when + 0.1);
          o.connect(amp(when, 0.3, 0.003, 0.14, fxBus));
        },
        irisSpin(when) {
          // Shimmer that spins around the stereo field as the iris closes.
          const n = noise(when, 0.5, 1.2);
          const bp = filter("bandpass", 3000, 2);
          bp.frequency.setValueAtTime(3000, when);
          bp.frequency.exponentialRampToValueAtTime(8500, when + 0.5);
          const pn = ctx.createStereoPanner();
          const lfo = osc("sine", 5, when, 0.5);
          lfo.frequency.linearRampToValueAtTime(11, when + 0.5);
          const depth = ctx.createGain();
          depth.gain.value = 0.8;
          lfo.connect(depth).connect(pn.pan);
          pn.connect(fxBus);
          const g = env(when, 0.5, 0.2, 0.9, pn);
          n.connect(bp).connect(g);
          send(g, 0.5);
          [74, 77, 81, 84, 86, 89, 93].forEach((m, i) => bell(when + i * 0.06, hz(m), 0.05, 0.6, i % 2 ? 0.6 : -0.6, 0.5));
        },
        irisClose(when) {
          const o = osc("sine", 110, when, 0.6);
          o.frequency.exponentialRampToValueAtTime(48, when + 0.35);
          o.connect(amp(when, 0.48, 0.006, 0.5, fxBus));
          bell(when, hz(62), 0.12, 1.8, 0, 0.6);
          bell(when, hz(69), 0.06, 1.6, 0, 0.6);
        },
        irisOpen(when) {
          swish(when, 0.5, 5000, 900, 0.18, 0.15, 1.2, 0.3, -0.3, 0.4);
          [93, 89, 86, 81, 77].forEach((m, i) => bell(when + 0.05 + i * 0.07, hz(m), 0.04, 0.8, i % 2 ? -0.5 : 0.5, 0.6));
        },
        rebana(when, e) {
          drum(when, e.kind, e.lv, fxBus);
        },
        drop(when, e) {
          // A water drop: a sine that quickly rises in pitch, plus a soft tick.
          const o = osc("sine", e.f, when, 0.15);
          o.frequency.exponentialRampToValueAtTime(e.f * 2.4, when + 0.06);
          const g = amp(when, 0.34, 0.002, 0.11, pan(e.pan, fxBus));
          o.connect(g);
          send(g, 0.45);
          noise(when, 0.02).connect(filter("highpass", 3000)).connect(amp(when, 0.05, 0.001, 0.015, g));
        },
        wetSpread(when) {
          const n = noise(when, 0.85, 1.4);
          n.connect(filter("lowpass", 900, 0.8)).connect(env(when, 0.85, 0.28, 0.4, fxBus));
          swish(when, 0.85, 1200, 3500, 0.06, 0.5, 0.7, -0.3, 0.3, 0.4);
        },
        // Music voices.
        pad(when, e) {
          const dur = 4 * BEAT;
          const out = ctx.createGain();
          out.gain.setValueAtTime(0, when);
          out.gain.linearRampToValueAtTime(0.1, when + 0.25);
          out.gain.setValueAtTime(0.1, when + dur - 0.1);
          out.gain.linearRampToValueAtTime(0, when + dur + 0.35);
          const lp = filter("lowpass", 1100, 0.5);
          lp.connect(out).connect(musicBus);
          send(out, 0.5);
          e.notes.forEach((m, i) => {
            for (const det of [-4, 4]) {
              const o = osc(i % 2 ? "triangle" : "sawtooth", hz(m), when, dur + 0.4);
              o.detune.value = det;
              const g = ctx.createGain();
              g.gain.value = i % 2 ? 0.5 : 0.22;
              o.connect(g).connect(lp);
            }
          });
        },
        bass(when, e) {
          const out = amp(when, e.lv, 0.005, 0.32, musicBus);
          osc("sine", hz(e.m), when, 0.36).connect(out);
          const o2 = osc("triangle", hz(e.m) * 2, when, 0.2);
          o2.connect(amp(when, e.lv * 0.15, 0.004, 0.12, musicBus));
        },
        rebanaM(when, e) {
          drum(when, e.kind, e.lv, musicBus);
        },
        shaker(when, e) {
          noise(when, 0.05, 0.7).connect(filter("highpass", 7000)).connect(amp(when, e.lv, 0.004, 0.035, musicBus));
        },
        gambus(when, e) {
          const s = ctx.createBufferSource();
          s.buffer = pluckBuf(e.m);
          const body = filter("peaking", 320, 1);
          body.gain.value = 5;
          const lp = filter("lowpass", 3200, 0.6);
          const g = ctx.createGain();
          g.gain.value = e.lv;
          const p = pan(0.15, musicBus);
          s.connect(body).connect(lp).connect(g).connect(p);
          g.connect(echoIn);
          send(g, 0.25);
          s.start(when);
          s.stop(when + 1.4);
        },
      };

      // Look-ahead scheduler: every 25 ms, schedule sounds due in the next 100 ms.
      // Timeline time is mapped to audio time by an anchor that is re-set after any jump.
      function tick() {
        if (!playing || !tl || ctx.state !== "running") { anchor = null; return; }
        if (document.hidden || tl.paused() || reduce.matches) { anchor = null; return; }
        const now = tl.totalTime();
        const at = ctx.currentTime;
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.08) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          // Start fresh so nothing piles up, but never book the same stretch twice.
          doneUpTo = now > doneUpTo - 0.5 && now < doneUpTo ? doneUpTo : now;
        }
        // Book sounds a little early so they are heard in step with the picture.
        const lat = Math.min(0.2, ctx.outputLatency || ctx.baseLatency || 0);
        const from = doneUpTo;
        const to = anchor.tl + (at - anchor.audio) + 0.1 + lat;
        if (to <= from) return;
        for (let k = Math.floor(from / loopLen); k <= Math.floor(to / loopLen); k++) {
          for (const e of events) {
            const t = k * loopLen + e.t;
            if (t < from || t >= to) continue;
            if (e.music && !wantMusic) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl) - lat), e);
          }
        }
        doneUpTo = to;
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && tl && !reduce.matches;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            openSession();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
          const t = ctx.currentTime;
          musicBus.gain.cancelScheduledValues(t);
          musicBus.gain.setTargetAtTime(wantMusic ? MUSIC : 0, t, 0.03);
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend(), 200);
        }
      }

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);

      addEventListener("message", (event) => {
        if (event.origin !== location.origin) return;
        const data = event.data;
        if (!data || data.type !== "motionprompt-sound") return;
        if (typeof data.on === "boolean") wantOn = data.on;
        if (typeof data.music === "boolean") wantMusic = data.music;
        update();
      });

      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantOn = true;
        wantMusic = fromUrl === "1";
      }

      return { attach };
    })();

    // Wait briefly for the fonts (so text is measured in the right face) and the photos.
    Promise.all([
      Promise.race([
        Promise.all([
          document.fonts.load('italic 400 1em "Playfair Display"'),
          document.fonts.load('700 1em "Playfair Display"'),
          document.fonts.load("500 1em Jost"),
        ]),
        new Promise((resolve) => setTimeout(resolve, 1500)),
      ]),
      loadPhotos(),
    ]).finally(start);
  </script>
</body>
</html>
