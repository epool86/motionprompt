<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food menu demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/caveat@5.3.0/latin-700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-serif-display@5.3.0/latin-400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito@5.3.0/latin-800.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=c48a58&ink=3b2418&accent=d8452b&accent2=3f8a3c */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #c48a58;
    }

    svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hand { font-family: "Caveat", "Segoe Print", "Comic Sans MS", cursive; font-weight: 700; }
    .serif { font-family: "DM Serif Display", Georgia, serif; }
    .sans { font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif; font-weight: 800; }
  </style>
</head>
<body>
  <svg id="scene" role="img" xmlns="http://www.w3.org/2000/svg"></svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => "#" + (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const C = {
      table: hex("bg", "c48a58"),
      ink: hex("ink", "3b2418"),
      accent: hex("accent", "d8452b"),
      leaf: hex("accent2", "3f8a3c"),
      card: "#fff7ea",
      label: "#fffaf0",
    };
    document.body.style.background = C.table;
    const dish = (params.get("text") || "Nasi Lemak").trim().slice(0, 32);
    const price = "8.90";

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("scene");
    svg.setAttribute("aria-label", `A top-down food flat lay: ${dish} is plated ingredient by ingredient, with hand-lettered labels and a menu card showing the price`);

    function el(name, attrs, parent) {
      const node = document.createElementNS(NS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (parent) parent.append(node);
      return node;
    }

    // Mix a colour towards white (amt > 0) or black (amt < 0).
    function shade(color, amt) {
      const n = parseInt(color.slice(1), 16);
      const mix = (c) => Math.round(amt > 0 ? c + (255 - c) * amt : c * (1 + amt));
      const r = mix(n >> 16), g = mix((n >> 8) & 255), b = mix(n & 255);
      return `#${((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1)}`;
    }

    // Seeded random, so the table looks the same after a resize.
    let seed = 1;
    const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const rr = (a, b) => a + rand() * (b - a);
    const f = (v) => v.toFixed(1);

    // A smooth closed blob through points around a circle.
    function blobPath(radius, n, wobble) {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2, r = radius * (1 + rr(-wobble, wobble));
        pts.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      let d = "";
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        const m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
        d += i === 0 ? `M${f((pts[n - 1][0] + p[0]) / 2)} ${f((pts[n - 1][1] + p[1]) / 2)}` : "";
        d += ` Q${f(p[0])} ${f(p[1])} ${f(m[0])} ${f(m[1])}`;
      }
      return d + "Z";
    }

    const LOOP = 11;
    let tl = null, W, H, u;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");

    function build() {
      const keep = tl ? tl.time() : 0;
      if (tl) tl.kill();
      W = innerWidth;
      H = innerHeight;
      u = Math.min(W, H);
      seed = 5;
      svg.replaceChildren();
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

      // ---- Filters and gradients ----
      const defs = el("defs", {}, svg);
      const shadow = (id, dy, blur, op) => {
        const fl = el("filter", { id, x: "-30%", y: "-30%", width: "160%", height: "170%" }, defs);
        el("feDropShadow", { dx: dy * 0.4, dy, stdDeviation: blur, "flood-color": "#2a1206", "flood-opacity": op }, fl);
      };
      shadow("fm-plate", u * 0.018, u * 0.02, 0.4);
      shadow("fm-food", u * 0.005, u * 0.004, 0.35);
      shadow("fm-card", u * 0.012, u * 0.014, 0.35);
      shadow("fm-label", u * 0.002, u * 0.003, 0.55);
      const blur = el("filter", { id: "fm-steam", x: "-50%", y: "-50%", width: "200%", height: "200%" }, defs);
      el("feGaussianBlur", { stdDeviation: u * 0.006 }, blur);
      const radial = (id, stops, cx = "40%", cy = "38%") => {
        const g = el("radialGradient", { id, cx, cy, r: "65%" }, defs);
        stops.forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, g));
      };
      radial("fm-rice", [[0, "#ffffff"], [0.6, "#f8f4ec"], [1, "#e6dccb"]]);
      radial("fm-sambal", [[0, "#c1331d"], [0.7, "#a1231a"], [1, "#781a10"]]);
      radial("fm-leaf", [[0, shade(C.leaf, 0.25)], [1, shade(C.leaf, -0.2)]], "50%", "50%");
      radial("fm-vignette", [[0.55, "rgba(40,18,4,0)"], [1, "rgba(40,18,4,0.38)"]], "50%", "50%");

      // ---- Wooden table: planks with grain lines and a few knots ----
      const table = el("g", {}, svg);
      const plankH = u * 0.2;
      for (let y = -rand() * plankH, k = 0; y < H; y += plankH, k++) {
        el("rect", { x: 0, y: f(y), width: W, height: f(plankH), fill: shade(C.table, rr(-0.08, 0.08)) }, table);
        for (let i = 0; i < 7; i++) {
          // Long, gently wavy grain lines.
          const gy = y + rr(0.1, 0.9) * plankH, amp = plankH * rr(0.015, 0.04);
          const k1 = rr(1, 3) / W, k2 = rr(4, 7) / W, p1 = rr(0, 6), p2 = rr(0, 6);
          let d = "";
          for (let x = -10; x <= W + 20; x += 16) d += `${x < 0 ? "M" : " L"}${f(x)} ${f(gy + amp * Math.sin(x * k1 * 6.28 + p1) + amp * 0.2 * Math.sin(x * k2 * 6.28 + p2))}`;
          el("path", { d, fill: "none", stroke: shade(C.table, -0.35), "stroke-width": f(u * rr(0.002, 0.005)), opacity: rr(0.12, 0.3) }, table);
        }
        if (k % 2 === 1) {
          const kx = rr(0.1, 0.9) * W, ky = y + plankH * rr(0.35, 0.65);
          for (let r = 1; r <= 3; r++) el("ellipse", { cx: f(kx), cy: f(ky), rx: f(u * 0.012 * r * 1.8), ry: f(u * 0.006 * r), fill: "none", stroke: shade(C.table, -0.35), "stroke-width": f(u * 0.003), opacity: 0.3 }, table);
        }
        el("rect", { x: 0, y: f(y - u * 0.002), width: W, height: f(u * 0.004), fill: shade(C.table, -0.45), opacity: 0.6 }, table);
        el("rect", { x: 0, y: f(y + u * 0.002), width: W, height: f(u * 0.002), fill: shade(C.table, 0.3), opacity: 0.35 }, table);
      }
      el("rect", { width: W, height: H, fill: "url(#fm-vignette)" }, table);

      // ---- Layout: card on the right when wide, along the bottom when tall ----
      const wide = W / H >= 1.15;
      let cx, cy, r, cw, ch, cardX, cardY, labelBottom;
      const pad = u * 0.04;
      if (wide) {
        cw = Math.min(W * 0.3, H * 0.6);
        ch = Math.min(cw * 1.12, H * 0.8);
        cardX = W - cw / 2 - W * 0.05;
        cardY = H / 2;
        const region = W - cw - W * 0.08;
        r = Math.min(H * 0.33, region * 0.3);
        cx = region / 2 + W * 0.01;
        cy = H * 0.52;
        labelBottom = H - pad;
      } else {
        cw = Math.min(W * 0.8, H * 0.52);
        ch = cw * 0.44;
        cardX = W / 2;
        cardY = H - ch / 2 - H * 0.045;
        const region = cardY - ch / 2 - pad;
        r = Math.min(W * 0.33, region * 0.36);
        cx = W / 2;
        cy = region * 0.52 + pad * 0.3;
        labelBottom = cardY - ch / 2 - pad * 0.5;
      }

      // ---- Little extras on the table: a lime half and two chillies ----
      const extras = el("g", {}, svg);
      {
        const ex = wide ? cx + r * 1.25 : W - pad - r * 0.2, ey = wide ? H - r * 0.3 : cy + r * 1.05;
        const lime = el("g", { transform: `translate(${f(ex)} ${f(ey)})`, filter: "url(#fm-food)" }, extras);
        const lr = r * 0.13;
        el("circle", { r: f(lr), fill: "#5f9e2f" }, lime);
        el("circle", { r: f(lr * 0.86), fill: "#d7ec9c" }, lime);
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          el("path", { d: `M0 0 L${f(Math.cos(a - 0.3) * lr * 0.78)} ${f(Math.sin(a - 0.3) * lr * 0.78)} A${f(lr * 0.78)} ${f(lr * 0.78)} 0 0 1 ${f(Math.cos(a + 0.3) * lr * 0.78)} ${f(Math.sin(a + 0.3) * lr * 0.78)}Z`, fill: "#b9dc6a" }, lime);
        }
        const chilliAt = wide ? [cx - r * 1.35, cy + r * 1.0] : [pad + r * 0.25, cy + r * 1.1];
        [0, 1].forEach((i) => {
          const g = el("g", { transform: `translate(${f(chilliAt[0] + i * r * 0.1)} ${f(chilliAt[1] + i * r * 0.08)}) rotate(${-40 + i * 25})`, filter: "url(#fm-food)" }, extras);
          const L = r * 0.32, w = r * 0.045;
          el("path", { d: `M${f(-L / 2)} 0 C${f(-L / 4)} ${f(-w * 1.4)} ${f(L / 4)} ${f(-w)} ${f(L / 2)} ${f(w * 0.3)} C${f(L / 4)} ${f(w * 1.1)} ${f(-L / 4)} ${f(w * 1.2)} ${f(-L / 2)} 0Z`, fill: "#d52c1c" }, g);
          el("path", { d: `M${f(-L * 0.35)} ${f(-w * 0.4)} Q0 ${f(-w * 0.9)} ${f(L * 0.3)} ${f(-w * 0.2)}`, stroke: "#ff8a70", "stroke-width": f(w * 0.3), fill: "none", "stroke-linecap": "round", opacity: 0.7 }, g);
          el("path", { d: `M${f(-L / 2)} 0 q${f(-w)} ${f(-w * 0.4)} ${f(-w * 1.8)} ${f(-w * 1.4)}`, stroke: "#4c7a2a", "stroke-width": f(w * 0.5), fill: "none", "stroke-linecap": "round" }, g);
        });
      }

      // ---- Plate with a round of banana leaf ----
      const plate = el("g", { transform: `translate(${f(cx)} ${f(cy)})` }, svg);
      el("circle", { r: f(r), fill: "#fbf8f2", filter: "url(#fm-plate)" }, plate);
      el("circle", { r: f(r * 0.96), fill: "none", stroke: "#ece3d4", "stroke-width": f(r * 0.02) }, plate);
      el("circle", { r: f(r * 0.82), fill: "#f1eadf" }, plate);
      const clip = el("clipPath", { id: "fm-leafclip" }, defs);
      el("circle", { r: f(r * 0.79) }, clip);
      const leaf = el("g", { "clip-path": "url(#fm-leafclip)" }, plate);
      el("circle", { r: f(r * 0.79), fill: "url(#fm-leaf)" }, leaf);
      const veins = el("g", { transform: "rotate(-35)" }, leaf);
      for (let x = -r; x <= r; x += r * 0.055) {
        el("line", { x1: f(x), y1: f(-r), x2: f(x + r * 0.08), y2: f(r), stroke: shade(C.leaf, 0.35), "stroke-width": f(r * 0.006), opacity: 0.45 }, veins);
      }
      el("line", { x1: f(-r * 0.35), y1: f(-r), x2: f(-r * 0.25), y2: f(r), stroke: shade(C.leaf, 0.45), "stroke-width": f(r * 0.03), opacity: 0.6 }, veins);

      // Each ingredient: an outer group at its spot, an inner group that drops in.
      const food = el("g", { filter: "url(#fm-food)" }, plate);
      const place = (x, y, rot = 0) => {
        const outer = el("g", { transform: `translate(${f(x * r)} ${f(y * r)}) rotate(${rot})` }, food);
        return el("g", {}, outer);
      };

      // Rice: a white dome with little grains.
      const rice = place(-0.14, -0.18);
      {
        const R = r * 0.31;
        el("path", { d: blobPath(R, 12, 0.04), fill: "url(#fm-rice)" }, rice);
        for (let i = 0; i < 70; i++) {
          const a = rand() * Math.PI * 2, d = Math.sqrt(rand()) * R * 0.9;
          el("ellipse", {
            cx: f(Math.cos(a) * d), cy: f(Math.sin(a) * d), rx: f(r * 0.026), ry: f(r * 0.01),
            transform: `rotate(${f(rand() * 180)} ${f(Math.cos(a) * d)} ${f(Math.sin(a) * d)})`,
            fill: rand() > 0.5 ? "#ffffff" : "none", stroke: "#d8cfbe", "stroke-width": f(r * 0.004), opacity: 0.8,
          }, rice);
        }
      }

      // Sambal: a chunky chilli paste with a ring of red oil and onion slivers.
      const sambal = place(0.34, -0.3);
      {
        const R = r * 0.19;
        el("path", { d: blobPath(R * 1.22, 12, 0.1), fill: "#e04a1c", opacity: 0.4 }, sambal);
        el("path", { d: blobPath(R, 11, 0.14), fill: "url(#fm-sambal)" }, sambal);
        for (let i = 0; i < 7; i++) {
          const a = rand() * Math.PI * 2, d = rand() * R * 0.55;
          el("path", { d: blobPath(R * rr(0.18, 0.3), 7, 0.25), transform: `translate(${f(Math.cos(a) * d)} ${f(Math.sin(a) * d)})`, fill: rand() > 0.5 ? "#8c1d12" : "#c9361f", opacity: 0.9 }, sambal);
        }
        for (let i = 0; i < 5; i++) {
          const a = rand() * Math.PI * 2, d = rand() * R * 0.6;
          el("path", { d: `M${f(Math.cos(a) * d)} ${f(Math.sin(a) * d)} a${f(R * 0.22)} ${f(R * 0.22)} 0 0 1 ${f(R * 0.3)} ${f(R * 0.1)}`, fill: "none", stroke: "#f0b3a0", "stroke-width": f(r * 0.011), "stroke-linecap": "round", opacity: 0.9 }, sambal);
        }
        [[-0.3, -0.45, 0.09], [0.35, -0.2, 0.06], [-0.1, 0.4, 0.05]].forEach(([x, y, s]) => {
          el("ellipse", { cx: f(x * R), cy: f(y * R), rx: f(s * R), ry: f(s * R * 0.55), fill: "#ffe6d8", opacity: 0.7, transform: `rotate(-30 ${f(x * R)} ${f(y * R)})` }, sambal);
        });
      }

      // Egg: two boiled halves.
      const eggs = [[-0.02, 0.12, 25], [0.06, 0.24, -20]].map(([x, y, rot], i) => {
        const g = place(0.36 + x, 0.04 + y, rot);
        el("ellipse", { rx: f(r * 0.14), ry: f(r * 0.105), fill: "#fffdf6", stroke: "#eadfca", "stroke-width": f(r * 0.008) }, g);
        el("circle", { cx: f(r * 0.01), r: f(r * 0.068), fill: "#f7c34a" }, g);
        el("circle", { cx: f(r * 0.01), r: f(r * 0.042), fill: "#f5b02a" }, g);
        el("ellipse", { cx: f(-r * 0.06), cy: f(-r * 0.05), rx: f(r * 0.03), ry: f(r * 0.015), fill: "#ffffff", opacity: 0.9 }, g);
        return g;
      });

      // Cucumber: three slices.
      const cucumbers = [[-0.14, 0.44], [0.02, 0.5], [0.17, 0.46]].map(([x, y]) => {
        const g = place(x, y, rr(0, 90));
        el("circle", { r: f(r * 0.095), fill: "#3c7a33" }, g);
        el("circle", { r: f(r * 0.083), fill: "#cde7ad" }, g);
        el("circle", { r: f(r * 0.05), fill: "#e8f5d5" }, g);
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          el("ellipse", { cx: f(Math.cos(a) * r * 0.028), cy: f(Math.sin(a) * r * 0.028), rx: f(r * 0.012), ry: f(r * 0.007), fill: "#f9fdf0", stroke: "#b9d99a", "stroke-width": f(r * 0.003), transform: `rotate(${(a * 180) / Math.PI} ${f(Math.cos(a) * r * 0.028)} ${f(Math.sin(a) * r * 0.028)})` }, g);
        }
        return g;
      });

      // Peanuts and crispy anchovies in a little heap.
      const heap = [-0.44, 0.2];
      const peanuts = [];
      for (let i = 0; i < 12; i++) {
        const a = rand() * Math.PI * 2, d = Math.sqrt(rand()) * 0.15;
        const g = place(heap[0] + 0.03 + Math.cos(a) * d, heap[1] + 0.06 + Math.sin(a) * d, rr(0, 180));
        const light = rand() > 0.6;
        el("ellipse", { rx: f(r * 0.04), ry: f(r * 0.028), fill: light ? "#e6be86" : "#b8733a" }, g);
        el("ellipse", { cx: f(-r * 0.008), cy: f(-r * 0.007), rx: f(r * 0.016), ry: f(r * 0.008), fill: "#ffffff", opacity: 0.3 }, g);
        el("line", { x1: 0, y1: f(-r * 0.02), x2: 0, y2: f(r * 0.02), stroke: "#7d4a22", "stroke-width": f(r * 0.004), opacity: 0.6 }, g);
        peanuts.push(g);
      }
      const anchovies = [];
      for (let i = 0; i < 9; i++) {
        const a = rand() * Math.PI * 2, d = Math.sqrt(rand()) * 0.16;
        const g = place(heap[0] - 0.02 + Math.cos(a) * d * 0.9, heap[1] - 0.07 + Math.sin(a) * d * 0.9, rr(0, 360));
        const L = r * 0.13, w = r * 0.022;
        el("path", {
          d: `M${f(-L / 2)} 0 C${f(-L / 4)} ${f(-w)} ${f(L / 4)} ${f(-w)} ${f(L * 0.4)} 0 C${f(L / 4)} ${f(w)} ${f(-L / 4)} ${f(w)} ${f(-L / 2)} 0Z M${f(L * 0.36)} 0 L${f(L * 0.54)} ${f(-w * 0.9)} L${f(L * 0.5)} 0 L${f(L * 0.54)} ${f(w * 0.9)}Z`,
          fill: "#dca44a", stroke: "#a86b22", "stroke-width": f(r * 0.003),
        }, g);
        el("circle", { cx: f(-L * 0.36), cy: f(-w * 0.1), r: f(w * 0.2), fill: C.ink }, g);
        anchovies.push(g);
      }

      // Steam: soft wisps curling up from the rice.
      const steam = [-0.08, 0.02, 0.12].map((x, i) => {
        const g = el("g", { transform: `translate(${f(x * r - 0.14 * r)} ${f(-0.3 * r)})` }, plate);
        const h = r * 0.6, w = r * 0.12 * (i % 2 ? -1 : 1);
        return el("path", {
          d: `M0 0 C${f(w)} ${f(-h / 3)} ${f(-w)} ${f((-2 * h) / 3)} ${f(w * 0.3)} ${f(-h)}`,
          fill: "none", stroke: "#ffffff", "stroke-width": f(r * 0.045), "stroke-linecap": "round", filter: "url(#fm-steam)", opacity: 0,
        }, g);
      });

      // ---- Hand-lettered labels with little arrows ----
      const fl = Math.max(9, u * 0.052);
      const labelLayer = el("g", { filter: "url(#fm-label)" }, svg);
      const spots = [
        { lines: ["coconut rice"], at: [-0.14, -0.18], size: 0.24, ang: wide ? -140 : -120 },
        { lines: ["sambal"], at: [0.34, -0.3], size: 0.16, ang: wide ? -40 : -55 },
        { lines: ["boiled egg"], at: [0.4, 0.2], size: 0.14, ang: wide ? 25 : 40 },
        { lines: ["cucumber"], at: [0.02, 0.48], size: 0.08, ang: wide ? 100 : 105 },
        { lines: ["peanuts &", "anchovies"], at: [-0.44, 0.2], size: 0.14, ang: wide ? 170 : 150 },
      ];
      const labels = spots.map((s) => {
        const g = el("g", {}, labelLayer);
        const txt = el("text", { class: "hand", "font-size": f(fl), fill: C.label, "text-anchor": "middle" }, g);
        s.lines.forEach((line, i) => {
          const span = el("tspan", { x: 0, y: f((i - (s.lines.length - 1) / 2) * fl * 0.95 + fl * 0.32) }, txt);
          span.textContent = line;
        });
        const bw = txt.getBBox().width, bh = fl * 0.95 * s.lines.length;
        const a = (s.ang * Math.PI) / 180;
        const tx = cx + s.at[0] * r, ty = cy + s.at[1] * r;
        let lx = cx + Math.cos(a) * r * 1.22 + Math.cos(a) * bw * 0.35, ly = cy + Math.sin(a) * r * 1.2;
        lx = Math.min(W - pad - bw / 2, Math.max(pad + bw / 2, lx));
        ly = Math.min(labelBottom - bh / 2, Math.max(pad + bh / 2, ly));
        g.setAttribute("transform", `translate(${f(lx)} ${f(ly)}) rotate(${f(rr(-5, 5))})`);
        // Arrow from the label edge to the ingredient, bowed a little, with a small head.
        const dx = tx - lx, dy = ty - ly;
        const vertical = Math.abs(dy) > Math.abs(dx) * 0.7;
        const sx = vertical ? lx : lx + Math.sign(dx) * (bw / 2 + fl * 0.2);
        const sy = vertical ? ly + Math.sign(dy) * (bh / 2 + fl * 0.15) : ly;
        const len = Math.hypot(tx - sx, ty - sy);
        const ex = tx - ((tx - sx) / len) * r * s.size, ey = ty - ((ty - sy) / len) * r * s.size;
        const bend = (dx > 0 ? 1 : -1) * 0.25;
        const qx = (sx + ex) / 2 - (ey - sy) * bend, qy = (sy + ey) / 2 + (ex - sx) * bend;
        const ha = Math.atan2(ey - qy, ex - qx), hl = Math.max(4, u * 0.02);
        const head = (k) => `${f(ex - Math.cos(ha + k) * hl)} ${f(ey - Math.sin(ha + k) * hl)}`;
        const arrow = el("path", {
          d: `M${f(sx)} ${f(sy)} Q${f(qx)} ${f(qy)} ${f(ex)} ${f(ey)} M${head(0.5)} L${f(ex)} ${f(ey)} L${head(-0.5)}`,
          fill: "none", stroke: C.label, "stroke-width": f(Math.max(1.2, u * 0.0045)), "stroke-linecap": "round", "stroke-linejoin": "round",
          pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1,
        }, labelLayer);
        return { g, arrow };
      });

      // ---- Menu card ----
      const cardOuter = el("g", { transform: `translate(${f(cardX)} ${f(cardY)})` }, svg);
      const card = el("g", {}, cardOuter);
      el("rect", { x: f(-cw / 2), y: f(-ch / 2), width: f(cw), height: f(ch), rx: f(u * 0.012), fill: C.card, filter: "url(#fm-card)" }, card);
      const inset = Math.min(cw, ch) * 0.05;
      el("rect", { x: f(-cw / 2 + inset), y: f(-ch / 2 + inset), width: f(cw - inset * 2), height: f(ch - inset * 2), rx: f(u * 0.006), fill: "none", stroke: C.accent, "stroke-width": f(Math.max(0.8, u * 0.003)), opacity: 0.55 }, card);
      // Write a line of text, shrunk to fit a width.
      const write = (str, cls, size, x, y, maxW, fill, extra = {}) => {
        const t = el("text", { class: cls, "font-size": f(size), x: f(x), y: f(y), fill, ...extra }, card);
        t.textContent = str;
        const w = t.getComputedTextLength();
        if (w > maxW) t.setAttribute("font-size", f((size * maxW) / w));
        return t;
      };
      const badgeR = wide ? cw * 0.17 : ch * 0.32;
      let badgeX, badgeY;
      if (wide) {
        write("TODAY'S SPECIAL", "sans", cw * 0.062, 0, -ch * 0.24, cw * 0.8, C.accent, { "text-anchor": "middle", "letter-spacing": "0.12em" });
        write(dish, "serif", cw * 0.16, 0, -ch * 0.05, cw * 0.82, C.ink, { "text-anchor": "middle" });
        el("path", { d: `M${f(-cw * 0.18)} ${f(ch * 0.04)} q${f(cw * 0.045)} ${f(-ch * 0.02)} ${f(cw * 0.09)} 0 t${f(cw * 0.09)} 0 t${f(cw * 0.09)} 0 t${f(cw * 0.09)} 0`, fill: "none", stroke: C.accent, "stroke-width": f(Math.max(1, u * 0.004)), "stroke-linecap": "round" }, card);
        write("coconut rice, sambal, egg,", "sans", cw * 0.055, 0, ch * 0.14, cw * 0.8, C.ink, { "text-anchor": "middle", opacity: 0.7 });
        write("peanuts and cucumber", "sans", cw * 0.055, 0, ch * 0.22, cw * 0.8, C.ink, { "text-anchor": "middle", opacity: 0.7 });
        badgeX = cw * 0.36;
        badgeY = ch * 0.44;
      } else {
        const left = -cw / 2 + inset * 2.4, textW = cw * 0.62;
        write("TODAY'S SPECIAL", "sans", ch * 0.12, left, -ch * 0.2, textW, C.accent, { "letter-spacing": "0.12em" });
        write(dish, "serif", ch * 0.3, left, ch * 0.1, textW, C.ink);
        write("coconut rice, sambal, egg, peanuts", "sans", ch * 0.1, left, ch * 0.3, textW, C.ink, { opacity: 0.7 });
        badgeX = cw * 0.34;
        badgeY = 0;
      }
      // Price badge, stamped on at the end.
      const badgeOuter = el("g", { transform: `translate(${f(badgeX)} ${f(badgeY)})` }, card);
      const badge = el("g", {}, badgeOuter);
      el("circle", { r: f(badgeR), fill: C.accent, filter: "url(#fm-food)" }, badge);
      el("circle", { r: f(badgeR * 0.86), fill: "none", stroke: "#ffffff", "stroke-width": f(Math.max(0.8, badgeR * 0.03)), "stroke-dasharray": `${f(badgeR * 0.08)} ${f(badgeR * 0.06)}`, opacity: 0.8 }, badge);
      const rm = el("text", { class: "sans", "font-size": f(badgeR * 0.3), y: f(-badgeR * 0.2), fill: "#ffffff", "text-anchor": "middle" }, badge);
      rm.textContent = "RM";
      const pr = el("text", { class: "serif", "font-size": f(badgeR * 0.62), y: f(badgeR * 0.38), fill: "#ffffff", "text-anchor": "middle" }, badge);
      pr.textContent = price;

      // ---- Timeline: plate, drop the food, steam, labels, card, then clear ----
      tl = gsap.timeline({ repeat: -1, paused: true });
      const drop = (items, at, stagger = 0) => {
        items.forEach((g, i) => {
          const t = at + i * stagger;
          tl.fromTo(g, { scale: 1.8, opacity: 0, rotation: rr(-25, 25), transformOrigin: "50% 50%" },
            { scale: 0.9, opacity: 1, rotation: 0, duration: 0.28, ease: "power2.in", immediateRender: true }, t)
            .to(g, { scale: 1, duration: 0.45, ease: "elastic.out(1.1, 0.45)" }, t + 0.28);
        });
      };
      drop([rice], 0.5);
      drop([sambal], 1.05);
      drop(eggs, 1.55, 0.15);
      drop(cucumbers, 2.05, 0.12);
      drop(peanuts, 2.55, 0.035);
      drop(anchovies, 2.95, 0.045);

      // Steam puffs rise and fade in overlapping cycles.
      steam.forEach((p, i) => {
        for (let k = 0; k < 3; k++) {
          const t = 3.2 + i * 0.6 + k * 2;
          tl.fromTo(p, { opacity: 0, y: 0, scaleX: 1, transformOrigin: "50% 100%" },
            { keyframes: [{ opacity: 0.75, duration: 0.6, ease: "sine.out" }, { opacity: 0, duration: 1.2, ease: "sine.in" }], y: -r * 0.35, scaleX: 1.6, duration: 1.8, ease: "none", immediateRender: false }, t);
        }
      });

      labels.forEach((l, i) => {
        const t = 3.7 + i * 0.32;
        tl.fromTo(l.g, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)", immediateRender: true }, t)
          .to(l.arrow, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out" }, t + 0.15)
          .to([l.g, l.arrow], { opacity: 0, duration: 0.3 }, 9.1 + i * 0.05);
      });

      const from = wide ? { x: W * 0.55, rotation: 14 } : { y: H * 0.5, rotation: 10 };
      tl.fromTo(card, { ...from, opacity: 1 }, { x: 0, y: 0, rotation: -3, duration: 0.8, ease: "back.out(1.3)", immediateRender: true }, 5.3)
        .fromTo(badge, { scale: 0, rotation: -60, transformOrigin: "50% 50%" }, { scale: 1, rotation: 10, duration: 0.5, ease: "back.out(3)", immediateRender: true }, 6.1)
        .to(badge, { rotation: -4, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 7.6)
        .to(card, { ...from, rotation: -10, duration: 0.6, ease: "back.in(1.4)" }, 9.3);

      // Food lifts off the plate in reverse order, leaving it empty for the loop.
      const all = [rice, sambal, ...eggs, ...cucumbers, ...peanuts, ...anchovies];
      tl.to(all.slice().reverse(), { scale: 1.4, opacity: 0, duration: 0.35, ease: "power2.in", stagger: 0.02 }, 9.7);
      tl.set({}, {}, LOOP);

      if (reduce.matches) tl.pause(8.2);
      else tl.time(keep).play();
    }

    // Reduced motion: hold one finished frame.
    reduce.addEventListener("change", () => {
      if (!tl) return;
      if (reduce.matches) tl.pause(8.2);
      else tl.play();
    });

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(build, 150);
    });

    // ---- Sound: off until the page asks for it. Every sound is made here with Web Audio, no files. ----
    // Sounds follow the GSAP timeline clock (tl.totalTime) and are booked a little ahead at the
    // matching AudioContext time, so they stay locked to the picture.
    const sound = (() => {
      const LEVEL = 1.2, MUSIC = 0.42;
      const BEAT = LOOP / 16; // about 87 bpm: four bars of 4/4 fill one 11 s loop exactly
      let ctx = null, master = null, impulse = null, noiseBuf = null, bus = null;
      let wantOn = false, wantMusic = true, playing = false, musicCatch = false;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0, planned = null, planSize = "", events = [];

      // Seeded random, so every loop sounds the same.
      let rs = 1;
      const rnd = () => ((rs = (rs * 16807) % 2147483647) - 1) / 2147483646;
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const panX = (x) => clamp((x / W - 0.5) * 1.2, -0.7, 0.7);
      const panOf = (node) => {
        const b = node.getBoundingClientRect();
        return b.width || b.height ? panX(b.left + b.width / 2) : 0;
      };

      // The list of sounds for one loop, read from the timeline itself so it follows any rebuild.
      function plan() {
        rs = 17;
        const list = [];
        const add = (t, type, extra = {}) => list.push({ t: ((t % LOOP) + LOOP) % LOOP, type, ...extra });
        const kids = tl.getChildren(false, true, false).filter((c) => c.duration() > 0);

        // Ingredients land where the drop tween hits the plate (scale 1.8 down to 0.9), in the order they are dropped.
        const lands = kids.filter((c) => c.vars.scale === 0.9);
        const kinds = ["rice", "sambal", "egg", "egg", "cucumber", "cucumber", "cucumber"];
        lands.forEach((tw, i) => {
          const kind = kinds[i] || (i < kinds.length + 12 ? "peanut" : "anchovy");
          add(tw.startTime() + tw.duration(), kind, { pan: panOf(tw.targets()[0]), v: 0.8 + rnd() * 0.2, n: 1 + Math.floor(rnd() * 3), f: rnd() });
        });

        // Steam: a soft hiss for each puff, shaped like its fade in and out.
        kids.filter((c) => c.vars.keyframes).forEach((tw) => add(tw.startTime(), "steam", { dur: tw.duration(), pan: panOf(tw.targets()[0]) }));

        // Labels: marker squeaks as each label pops in, and a longer stroke as its arrow draws.
        kids.filter((c) => c.targets()[0] instanceof Element && c.targets()[0].querySelector && c.targets()[0].querySelector("text.hand") && c.vars.scale === 1).forEach((tw, i) => {
          const pan = panOf(tw.targets()[0]);
          add(tw.startTime(), "marker", { dur: 0.16, f: 2100 + i * 90, pan });
          add(tw.startTime() + 0.19, "marker", { dur: 0.12, f: 2300 + i * 90, pan });
        });
        kids.filter((c) => c.vars.attr && c.vars.attr["stroke-dashoffset"] === 0).forEach((tw, i) => add(tw.startTime(), "marker", { dur: tw.duration() * 0.8, f: 1900 + i * 80, pan: panOf(tw.targets()[0]), glide: true }));

        // The menu card slides in and settles, the price is stamped on, and the card slides away.
        const cardIn = kids.find((c) => c.vars.rotation === -3), cardOut = kids.find((c) => c.vars.rotation === -10);
        if (cardIn) {
          const pan = panOf(cardIn.targets()[0]);
          add(cardIn.startTime(), "slide", { dur: cardIn.duration() * 0.5, pan, v: 1 });
          add(cardIn.startTime() + cardIn.duration() * 0.435, "settle", { pan });
        }
        if (cardOut) add(cardOut.startTime() + cardOut.duration() * 0.3, "slide", { dur: cardOut.duration() * 0.7, pan: panOf(cardOut.targets()[0]), v: 0.8 });
        const stamp = kids.find((c) => c.vars.scale === 1 && c.vars.rotation === 10);
        if (stamp) add(stamp.startTime() + stamp.duration() * 0.25, "stamp", { pan: panOf(stamp.targets()[0]) });

        // Food lifts off at the end: one soft rising swish.
        const lift = kids.find((c) => c.vars.scale === 1.4);
        if (lift) add(lift.startTime(), "liftoff", { dur: lift.duration() + 0.02 * (lift.targets().length - 1) });

        // Music: a cheerful cooking show bed. Ukulele strums, a round bass, soft kick, clap and shaker,
        // and a little glockenspiel tune. C, Am, F, G.
        const chords = [[67, 60, 64, 72], [69, 60, 64, 69], [69, 60, 65, 69], [67, 62, 67, 71]];
        const roots = [48, 45, 41, 43];
        chords.forEach((notes, b) => {
          const t0 = b * 4 * BEAT;
          [[0, 1, 1], [1, 1, 0.8], [1.5, -1, 0.55], [2.5, -1, 0.55], [3, 1, 0.8], [3.5, -1, 0.55]].forEach(([beat, dir, v]) =>
            add(t0 + beat * BEAT, "uke", { notes: notes.map(hz), dir, v, music: true }));
          add(t0, "bass", { f: hz(roots[b]), music: true });
          add(t0 + 2 * BEAT, "bass", { f: hz(roots[b] + 7), music: true, v: 0.7 });
          add(t0 + 3.5 * BEAT, "bass", { f: hz(roots[b] + 12), music: true, v: 0.5 });
          [0, 2].forEach((beat) => add(t0 + beat * BEAT, "kick", { music: true }));
          [1, 3].forEach((beat) => add(t0 + beat * BEAT, "clap", { music: true }));
          for (let s = 0; s < 8; s++) add(t0 + (s * BEAT) / 2, "shaker", { v: s % 2 ? 0.5 : 1, music: true });
        });
        [[0, 76], [0.5, 79], [1, 81], [2, 79], [3, 76], [8, 77], [8.5, 81], [9, 84], [10, 81], [11, 79], [13.5, 74], [14, 79], [15, 71]]
          .forEach(([beat, m]) => add(beat * BEAT, "glock", { f: hz(m + 12), music: true }));
        return list.sort((a, b) => a.t - b.t);
      }

      // Audio graph: one compressor before the speakers so nothing clips.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const sr = ctx.sampleRate;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);
        // A small warm room: stereo noise that fades out, used as the reverb impulse.
        const len = Math.floor(sr * 1.1);
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5);
        }
        noiseBuf = ctx.createBuffer(1, sr * 2, sr);
        const nd = noiseBuf.getChannelData(0);
        for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      }

      // Fresh buses every time sound is switched on, so nothing booked before a stop can leak out later.
      function openBus() {
        const t = ctx.currentTime;
        const out = ctx.createGain();
        out.gain.setValueAtTime(0, t);
        out.gain.linearRampToValueAtTime(1, t + 0.08);
        out.connect(master);
        const fx = ctx.createGain();
        fx.connect(out);
        const mus = ctx.createGain();
        mus.gain.value = wantMusic ? MUSIC : 0;
        mus.connect(out);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const verbOut = ctx.createGain();
        verbOut.gain.value = 0.35;
        verb.connect(verbOut).connect(out);
        const musVerb = ctx.createGain();
        musVerb.gain.value = 0.5;
        musVerb.connect(verb);
        return { out, fx, mus, verb, musVerb };
      }
      function closeBus() {
        if (!bus) return;
        const old = bus, t = ctx.currentTime;
        bus = null;
        old.out.gain.cancelScheduledValues(t);
        old.out.gain.setValueAtTime(old.out.gain.value, t);
        old.out.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.out.disconnect(), 300);
      }

      // Small building blocks.
      function env(when, peak, attack, decay) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        return g;
      }
      function osc(type, f, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(f, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(when, dur, buf = noiseBuf) {
        const s = ctx.createBufferSource();
        s.buffer = buf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, f, q = 0.7) {
        const b = ctx.createBiquadFilter();
        b.type = type;
        b.frequency.value = f;
        b.Q.value = q;
        return b;
      }
      // Send a sound to the effects bus, panned, with some room.
      function out(node, pan, room, dest = bus.fx) {
        const p = ctx.createStereoPanner();
        p.pan.value = pan;
        node.connect(p).connect(dest);
        if (room > 0) {
          const s = ctx.createGain();
          s.gain.value = room;
          p.connect(s).connect(bus.verb);
        }
        return p;
      }
      // Apply a value curve, never starting in the past (the browser refuses overlapping automation).
      function setCurve(param, curve, when, len) {
        const start = Math.max(when, ctx.currentTime + 0.005);
        param.setValueCurveAtTime(curve, start, Math.max(0.01, len - (start - when)));
      }
      function thud(when, f, v, pan) {
        const g = env(when, v, 0.002, 0.12);
        const o = osc("sine", f, when, 0.16);
        o.frequency.exponentialRampToValueAtTime(f * 0.6, when + 0.08);
        o.connect(g);
        out(g, pan, 0.1);
      }


      const voices = {
        rice(when, e) {
          // A soft, muffled thud as the rice dome lands.
          thud(when, 120, 0.3, e.pan);
          const g = env(when, 0.18, 0.003, 0.09);
          noise(when, 0.12).connect(filter("lowpass", 900, 0.6)).connect(g);
          out(g, e.pan, 0.1);
        },
        sambal(when, e) {
          // A wet little splat.
          thud(when, 160, 0.35, e.pan);
          const g = env(when, 0.16, 0.002, 0.07);
          const bp = filter("bandpass", 1100, 1.2);
          bp.frequency.setValueAtTime(1400, when);
          bp.frequency.exponentialRampToValueAtTime(500, when + 0.07);
          noise(when, 0.1).connect(bp).connect(g);
          out(g, e.pan, 0.15);
        },
        egg(when, e) {
          // A soft round plop.
          const g = env(when, 0.3 * e.v, 0.002, 0.1);
          const o = osc("sine", 320, when, 0.14);
          o.frequency.exponentialRampToValueAtTime(170, when + 0.09);
          o.connect(g);
          out(g, e.pan, 0.2);
          const s = env(when, 0.06, 0.001, 0.02);
          noise(when, 0.03).connect(filter("bandpass", 1800, 1)).connect(s);
          out(s, e.pan, 0.1);
        },
        cucumber(when, e) {
          // A light, crisp tap.
          const g = env(when, 0.2 * e.v, 0.001, 0.05);
          const o = osc("sine", 820 + e.f * 120, when, 0.07);
          o.frequency.exponentialRampToValueAtTime(560, when + 0.04);
          o.connect(g);
          out(g, e.pan, 0.2);
          const c = env(when, 0.08, 0.001, 0.015);
          noise(when, 0.03).connect(filter("bandpass", 3200, 1.2)).connect(c);
          out(c, e.pan, 0.1);
        },
        peanut(when, e) {
          // Little pebbles: a tick and a couple of smaller bounces.
          for (let i = 0; i <= e.n; i++) {
            const t = when + i * (0.045 + e.f * 0.02) * (1 - i * 0.2);
            const g = env(t, 0.14 * e.v * Math.pow(0.45, i), 0.0005, 0.018);
            noise(t, 0.03).connect(filter("bandpass", 2600 + e.f * 1600, 2.5)).connect(g);
            out(g, e.pan + (e.f - 0.5) * 0.2, 0.15);
          }
        },
        anchovy(when, e) {
          // Dry and crispy: a tiny high rustle.
          const g = env(when, 0.08 * e.v, 0.001, 0.025);
          noise(when, 0.04).connect(filter("bandpass", 4500 + e.f * 2000, 1.5)).connect(g);
          out(g, e.pan, 0.1);
        },
        steam(when, e) {
          // A soft hiss that swells and fades with the puff.
          const d = e.dur, steps = Math.ceil(d * 40), curve = new Float32Array(steps + 1);
          for (let i = 0; i <= steps; i++) {
            const tau = (d * i) / steps;
            curve[i] = 0.035 * (tau < 0.6 ? Math.sin((Math.PI / 2) * (tau / 0.6)) : Math.cos((Math.PI / 2) * Math.min(1, (tau - 0.6) / 1.2)));
          }
          const g = ctx.createGain();
          g.gain.value = 0;
          setCurve(g.gain, curve, when, d);
          noise(when, d).connect(filter("highpass", 2800, 0.5)).connect(filter("lowpass", 8000, 0.5)).connect(g);
          out(g, e.pan, 0.2);
        },
        marker(when, e) {
          // A felt tip on card: a squeaky tone with a scratchy edge.
          const d = e.dur;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.03, when + 0.02);
          g.gain.setValueAtTime(0.03, when + d * 0.7);
          g.gain.exponentialRampToValueAtTime(0.0001, when + d);
          const o = osc("sine", e.f, when, d);
          o.frequency.linearRampToValueAtTime(e.f * (e.glide ? 1.25 : 0.92), when + d);
          const vib = osc("sine", 29, when, d);
          const depth = ctx.createGain();
          depth.gain.value = e.f * 0.02;
          vib.connect(depth).connect(o.frequency);
          o.connect(g);
          const s = ctx.createGain();
          s.gain.value = 0.9;
          noise(when, d).connect(filter("bandpass", 3000, 1.6)).connect(s).connect(g);
          out(g, e.pan, 0.15);
        },
        slide(when, e) {
          // Card sliding over the wood: a paper swish that fades out.
          const d = e.dur;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.22 * e.v, when + d * 0.3);
          g.gain.exponentialRampToValueAtTime(0.0001, when + d);
          const bp = filter("bandpass", 2400, 0.7);
          bp.frequency.setValueAtTime(2600, when);
          bp.frequency.exponentialRampToValueAtTime(1200, when + d);
          noise(when, d).connect(bp).connect(g);
          out(g, e.pan, 0.15);
        },
        settle(when, e) {
          const g = env(when, 0.1, 0.002, 0.05);
          noise(when, 0.07).connect(filter("bandpass", 900, 1)).connect(g);
          out(g, e.pan, 0.15);
        },
        stamp(when, e) {
          // A rubber stamp: a deep thunk with a firm press.
          thud(when, 95, 0.4, e.pan);
          const g = env(when, 0.22, 0.002, 0.08);
          noise(when, 0.1).connect(filter("lowpass", 1100, 0.8)).connect(g);
          out(g, e.pan, 0.25);
          const c = env(when, 0.1, 0.0005, 0.012);
          noise(when, 0.02).connect(filter("bandpass", 2500, 1.2)).connect(c);
          out(c, e.pan, 0.1);
        },
        liftoff(when, e) {
          // A soft rising swish as the food lifts away.
          const d = e.dur;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.12, when + d * 0.7);
          g.gain.exponentialRampToValueAtTime(0.0001, when + d + 0.1);
          const bp = filter("bandpass", 600, 1);
          bp.frequency.setValueAtTime(600, when);
          bp.frequency.exponentialRampToValueAtTime(3200, when + d);
          noise(when, d + 0.1).connect(bp).connect(g);
          out(g, 0, 0.3);
        },
        uke(when, e) {
          // A ukulele strum: four bright nylon plucks, spread a little in time.
          const order = e.dir > 0 ? e.notes : e.notes.slice().reverse();
          order.forEach((f, i) => {
            const t = when + i * 0.012;
            const g = env(t, 0.07 * e.v, 0.002, 0.38);
            const lp = filter("lowpass", 5000, 0.7);
            lp.frequency.setValueAtTime(5000, t);
            lp.frequency.exponentialRampToValueAtTime(f * 1.5, t + 0.2);
            osc("sawtooth", f, t, 0.42).connect(lp);
            lp.connect(g);
            out(g, 0.2, 0, bus.mus).connect(bus.musVerb);
          });
        },
        bass(when, e) {
          const g = env(when, 0.26 * (e.v || 1), 0.005, 0.35);
          osc("sine", e.f, when, 0.4).connect(g);
          const h = env(when, 0.06 * (e.v || 1), 0.005, 0.15);
          osc("triangle", e.f * 2, when, 0.2).connect(h);
          g.connect(bus.mus);
          h.connect(bus.mus);
        },
        kick(when) {
          const g = env(when, 0.32, 0.002, 0.18);
          const o = osc("sine", 130, when, 0.22);
          o.frequency.exponentialRampToValueAtTime(52, when + 0.1);
          o.connect(g);
          g.connect(bus.mus);
        },
        clap(when) {
          // A soft finger snap and clap.
          const g = env(when, 0.1, 0.002, 0.08);
          noise(when, 0.1).connect(filter("bandpass", 1500, 1)).connect(g);
          out(g, -0.1, 0, bus.mus).connect(bus.musVerb);
        },
        shaker(when, e) {
          const g = env(when, 0.035 * e.v, 0.006, 0.04);
          noise(when, 0.07).connect(filter("bandpass", 7000, 0.9)).connect(g);
          out(g, 0.3, 0, bus.mus);
        },
        glock(when, e) {
          // A small glockenspiel note.
          const g = env(when, 0.05, 0.001, 0.7);
          osc("sine", e.f, when, 0.8).connect(g);
          const h = env(when, 0.012, 0.001, 0.2);
          osc("sine", e.f * 2.76, when, 0.25).connect(h);
          h.connect(g);
          out(g, -0.25, 0, bus.mus).connect(bus.musVerb);
        },
      };

      let lastTick = performance.now(), lastAudio = 0, hard = true;
      gsap.ticker.add(() => { lastTick = performance.now(); });

      // Look-ahead scheduler: every 25 ms, book the sounds due in the next 100 ms of timeline time.
      // Timeline time maps to audio time through an anchor that is reset after any jump or pause.
      function tick() {
        if (!playing || !tl || ctx.state !== "running") { anchor = null; return; }
        if (document.hidden || tl.paused() || reduce.matches) { anchor = null; return; }
        if (planned !== tl) {
          // A rebuilt timeline (after a resize): swap to fresh buses so nothing from the old plan lingers.
          if (planned) {
            closeBus();
            bus = openBus();
          }
          planned = tl;
          planSize = `${W}x${H}`;
          events = plan();
          anchor = null;
          hard = true;
        }
        if (planSize !== `${W}x${H}`) {
          // Same timeline, new window size: re-read positions and counts, and carry on.
          planSize = `${W}x${H}`;
          events = plan();
        }
        const len = tl.duration();
        // Timeline time right now: its last rendered time plus the time since that GSAP tick.
        const now = tl.totalTime() + Math.min(0.5, (performance.now() - lastTick) / 1000), at = ctx.currentTime;
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.08) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        let fresh = false;
        if (!anchor) {
          anchor = { tl: now, audio: at };
          // A small slip in a running clock keeps going from where booking stopped, so nothing plays twice.
          // After a pause, a seek or a switch on, start from now: nothing missed piles up.
          const slip = !hard && at - lastAudio < 0.6 && Math.abs(doneUpTo - now) < 0.5;
          doneUpTo = slip ? Math.max(now, doneUpTo) : now;
          fresh = !slip;
          hard = false;
        }
        lastAudio = at;
        // Long sounds already under way (fan, pour, pads) are picked up part way through.
        if (fresh || musicCatch) {
          const k0 = Math.floor(now / len);
          for (let k = k0 - 1; k <= k0; k++) {
            for (const e of events) {
              if (!e.hold || (e.music && !wantMusic) || (!fresh && !e.music)) continue;
              const t = k * len + e.t;
              if (t < now && t + e.dur > now + 0.2) voices[e.type](at + 0.03, e, now - t + 0.03);
            }
          }
          musicCatch = false;
        }
        const from = doneUpTo, to = anchor.tl + (at - anchor.audio) + 0.1;
        if (to <= from) return;
        for (let k = Math.floor(from / len); k <= Math.floor(to / len); k++) {
          for (const e of events) {
            const t = k * len + e.t;
            if (t < from || t >= to) continue;
            if (e.music && !wantMusic) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl)), e, 0);
          }
        }
        doneUpTo = to;
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && !reduce.matches;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            hard = true;
            bus = openBus();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
          const t = ctx.currentTime, g = bus.mus.gain;
          g.cancelScheduledValues(t);
          g.setValueAtTime(g.value, t);
          g.linearRampToValueAtTime(wantMusic ? MUSIC : 0, t + 0.12);
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeBus();
          sleepTimer = setTimeout(() => { if (!playing) ctx.suspend().catch(() => {}); }, 220);
        }
      }

      function set(on, music) {
        if (music && !wantMusic) musicCatch = true;
        wantOn = on;
        wantMusic = music;
        update();
      }

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);
      reduce.addEventListener("change", update);
      return { set };
    })();

    addEventListener("message", (event) => {
      const d = event.data;
      if (event.origin !== location.origin || !d || d.type !== "motionprompt-sound") return;
      sound.set(!!d.on, d.music !== false);
    });
    const soundParam = params.get("sound");
    if (soundParam === "1" || soundParam === "effects") sound.set(true, soundParam === "1");

    // Wait briefly for the fonts so text is measured in the right face.
    Promise.race([
      Promise.all(['700 1em "Caveat"', '1em "DM Serif Display"', '800 1em "Nunito"'].map((x) => document.fonts.load(x))),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(build);
  </script>
</body>
</html>
