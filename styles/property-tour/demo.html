<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property tour demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.3.0/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5.3.0/800.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=f3f1ec&ink=1f2a30&accent=0f7b6c */
    :root {
      --bg: #f3f1ec;
      --ink: #1f2a30;
      --accent: #0f7b6c;
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(120% 90% at 55% 50%, #ffffff 0%, var(--bg) 75%);
      color: var(--ink);
      font-family: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    /* Project name, top left */
    .head {
      position: absolute;
      left: 5vmin;
      top: 5vmin;
    }

    .eyebrow {
      font-weight: 800;
      font-size: 2.4vmin;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .name {
      font-weight: 800;
      font-size: 5.4vmin;
      line-height: 1.05;
      margin-top: 1vmin;
      max-width: 62vmin;
    }

    .wide .name {
      max-width: 42vmin;
    }

    .meta {
      font-weight: 600;
      font-size: 2.8vmin;
      margin-top: 1.2vmin;
      opacity: 0.7;
    }

    /* Price card, bottom left */
    .card {
      position: absolute;
      left: 5vmin;
      bottom: 5vmin;
      padding: 2.8vmin 3.8vmin 3.2vmin;
      border-radius: 2.6vmin;
      background: #ffffff;
      box-shadow: 0 1.6vmin 4.5vmin rgba(31, 42, 48, 0.16);
      opacity: 0;
    }

    .card small {
      display: block;
      font-weight: 800;
      font-size: 2.2vmin;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .price {
      font-weight: 800;
      font-size: 8vmin;
      line-height: 1;
      margin-top: 0.9vmin;
      white-space: nowrap;
    }

    .chips {
      display: flex;
      gap: 1.2vmin;
      margin-top: 1.8vmin;
    }

    .chip {
      font-weight: 800;
      font-size: 2.5vmin;
      padding: 0.8vmin 1.9vmin;
      border-radius: 99px;
      background: var(--accent);
      color: #ffffff;
      white-space: nowrap;
    }

    .chip.soft {
      background: color-mix(in srgb, var(--accent) 13%, #ffffff);
      color: var(--accent);
    }

    /* Square frames: a smaller title and a one row price card, so the plan gets more room */
    .compact .head {
      top: 4vmin;
      left: 4vmin;
    }

    .compact .name {
      font-size: 4.6vmin;
    }

    .compact .card {
      left: 4vmin;
      bottom: 4vmin;
      display: flex;
      align-items: flex-end;
      gap: 2.4vmin;
      padding: 2.2vmin 3vmin 2.4vmin;
    }

    .compact .price {
      font-size: 6.4vmin;
    }

    .compact .chips {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.8vmin;
      margin: 0;
    }

    /* Room tags, placed over the 3D rooms */
    .tag {
      position: absolute;
      left: 0;
      top: 0;
      padding: 0.8vmin 1.5vmin 0.9vmin;
      border-left: 0.7vmin solid var(--accent);
      border-radius: 1.3vmin;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0.8vmin 2.2vmin rgba(31, 42, 48, 0.16);
      font-size: 2.7vmin;
      line-height: 1.2;
      white-space: nowrap;
      opacity: 0;
    }

    .tag b {
      display: block;
      font-weight: 800;
    }

    .tag span {
      display: block;
      font-weight: 600;
      font-size: 0.88em;
      opacity: 0.6;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" role="img"></canvas>
  <div class="ui" aria-hidden="true">
    <div class="head">
      <div class="eyebrow">New launch</div>
      <div class="name" id="name"></div>
      <div class="meta">3 bed · 2 bath · 1,250 sq ft</div>
    </div>
    <div class="card" id="card">
      <div><small>Selling from</small><div class="price">RM 650,000</div></div>
      <div class="chips"><span class="chip">Freehold</span><span class="chip soft">Type B</span></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const colors = { bg: hex("bg", "f3f1ec"), ink: hex("ink", "1f2a30"), accent: hex("accent", "0f7b6c") };
    const root = document.documentElement.style;
    root.setProperty("--bg", `#${colors.bg}`);
    root.setProperty("--ink", `#${colors.ink}`);
    root.setProperty("--accent", `#${colors.accent}`);
    const title = (params.get("text") || "Seri Indah Residences").trim().slice(0, 40);
    document.getElementById("name").textContent = title;

    const canvas = document.getElementById("scene");
    canvas.setAttribute("aria-label", `A 3D floor plan of a 3 bedroom, 2 bathroom home builds itself room by room, furniture pops in, rooms are labelled with their sizes and a price card reads RM 650,000, Freehold. ${title}`);

    const ACCENT = `#${colors.accent}`;
    const INK = `#${colors.ink}`;
    const tint = (c, amount) => `#${new THREE.Color(c).lerp(new THREE.Color("#ffffff"), amount).getHexString()}`;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 200);

    // Soft daylight: sky light plus one sun for the shadows.
    scene.add(new THREE.HemisphereLight(0xffffff, 0xe6dfd4, 1.9));
    const sun = new THREE.DirectionalLight(0xfff3e2, 2.1);
    sun.position.set(-7, 16, 9);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -11;
    sun.shadow.camera.right = sun.shadow.camera.top = 11;
    sun.shadow.camera.near = 2;
    sun.shadow.camera.far = 40;
    sun.shadow.radius = 4;
    sun.shadow.intensity = 0.5;
    sun.shadow.bias = -0.0006;
    sun.shadow.normalBias = 0.03;
    scene.add(sun);

    const materials = new Map();
    const mat = (color) => {
      if (!materials.has(color)) materials.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0 }));
      return materials.get(color);
    };
    const rb = (w, h, d, r = 0.04) => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2, h / 2, d / 2) * 0.999);
    const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    function mesh(geometry, material, parent, x = 0, y = 0, z = 0) {
      const m = new THREE.Mesh(geometry, typeof material === "string" ? mat(material) : material);
      m.position.set(x, y, z);
      m.castShadow = m.receiveShadow = true;
      parent.add(m);
      return m;
    }

    // ---- Textures drawn on canvases ----
    function canvasTexture(size, draw, repeatX = 1, repeatY = 1) {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      draw(c.getContext("2d"), size);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(repeatX, repeatY);
      t.anisotropy = 4;
      return t;
    }
    // Light oak planks: the texture covers 2 by 2 metres.
    const wood = canvasTexture(512, (g, s) => {
      const tones = ["#dcc09a", "#d6b88f", "#e0c6a2", "#d2b187", "#dabd96"];
      const rows = 8, rh = s / rows;
      for (let r = 0; r < rows; r++) {
        let x = -((r * 173) % 300);
        let i = r;
        while (x < s) {
          const len = 220 + ((i * 97) % 140);
          g.fillStyle = tones[(i * 3 + r) % tones.length];
          g.fillRect(x, r * rh, len, rh);
          g.fillStyle = "rgba(120, 84, 48, 0.07)";
          for (let k = 0; k < 4; k++) g.fillRect(x + 10, r * rh + 8 + k * 14 + (i % 3) * 3, len - 20, 1.5);
          g.fillStyle = "rgba(110, 78, 45, 0.35)";
          g.fillRect(x, r * rh, 2, rh);
          x += len;
          i++;
        }
        g.fillStyle = "rgba(110, 78, 45, 0.3)";
        g.fillRect(0, r * rh, s, 2);
      }
    }, 7, 5);
    // Pale stone tiles: 60 cm squares.
    const tileTexture = (w, d) => canvasTexture(256, (g, s) => {
      g.fillStyle = "#e4e2dd";
      g.fillRect(0, 0, s, s);
      g.fillStyle = "#cfcbc3";
      g.fillRect(0, 0, s, 4);
      g.fillRect(0, 0, 4, s);
    }, w / 0.6, d / 0.6);

    // ---- The plan, in metres. x runs left to right, z from back (-5) to front (+5). ----
    const H = 1.7; // walls are cut at this height so the rooms stay visible
    const SILL = 0.7;
    const rooms = [
      { id: "living", name: "Living & dining", size: "23 x 16 ft", x: [-7, 0], z: [0, 5], at: [-3.4, 2.1], color: "#ffd9a8" },
      { id: "kitchen", name: "Kitchen", size: "11 x 16 ft", x: [-7, -3.5], z: [-5, 0], at: [-5.3, -2.7], color: "#bfe8d2", tiles: true },
      { id: "bath2", x: [-3.5, -1.5], z: [-5, -1.5], tiles: true },
      { id: "bed3", name: "Bedroom 3", size: "13 x 11 ft", x: [-1.5, 2.5], z: [-5, -1.5], at: [0.6, -3.0], color: "#cfe0ff" },
      { id: "bed2", name: "Bedroom 2", size: "15 x 15 ft", x: [2.5, 7], z: [-5, -0.5], at: [4.2, -2.6], color: "#e2d6fb" },
      { id: "master", name: "Master bedroom", size: "15 x 18 ft", x: [2.5, 7], z: [-0.5, 5], at: [4.3, 2.2], color: "#ffd3cc" },
      { id: "bath1", x: [0, 2.5], z: [2, 5], tiles: true },
    ];
    const roomById = Object.fromEntries(rooms.map((r) => [r.id, r]));

    // Walls: [room that raises it, axis, fixed coordinate, from, to, thickness, openings].
    // Openings: window { c, w } or door { c, w, door: true, side } where side is the way it swings.
    const EXT = 0.22, INT = 0.12;
    const wallList = [
      ["living", "x", 5, -7, 0, EXT, [{ c: -5.9, w: 1.3 }, { c: -2.0, w: 1.9 }]],
      ["living", "z", -7, 0, 5, EXT, [{ c: 2.5, w: 1.8 }]],
      ["kitchen", "x", -5, -7, -3.5, EXT, [{ c: -5.4, w: 1.6 }]],
      ["kitchen", "z", -7, -5, 0, EXT, [{ c: -2.6, w: 1.4 }]],
      ["kitchen", "x", 0, -7, -6.3, INT, []],
      ["bath2", "x", -5, -3.5, -1.5, EXT, [{ c: -2.5, w: 0.7 }]],
      ["bath2", "z", -3.5, -5, -1.5, INT, []],
      ["bath2", "x", -1.5, -3.5, -1.5, INT, [{ c: -2.6, w: 0.8, door: true, side: -1 }]],
      ["bed3", "x", -5, -1.5, 2.5, EXT, [{ c: 0.5, w: 1.7 }]],
      ["bed3", "z", -1.5, -5, -1.5, INT, []],
      ["bed3", "x", -1.5, -1.5, 2.5, INT, [{ c: 0.6, w: 0.9, door: true, side: -1 }]],
      ["bed2", "x", -5, 2.5, 7, EXT, [{ c: 4.75, w: 1.8 }]],
      ["bed2", "z", 7, -5, -0.5, EXT, [{ c: -2.6, w: 1.6 }]],
      ["bed2", "z", 2.5, -5, -0.5, INT, [{ c: -1.0, w: 0.9, door: true, side: 1 }]],
      ["master", "x", 5, 2.5, 7, EXT, [{ c: 4.75, w: 2.1 }]],
      ["master", "z", 7, -0.5, 5, EXT, [{ c: 2.2, w: 2.0 }]],
      ["master", "x", -0.5, 2.5, 7, INT, []],
      ["master", "z", 2.5, -0.5, 5, INT, [{ c: 1.0, w: 0.9, door: true, side: 1 }]],
      ["bath1", "x", 5, 0, 2.5, EXT, [{ c: 1.25, w: 0.7 }]],
      ["bath1", "z", 0, 2, 5, INT, []],
      ["bath1", "x", 2, 0, 2.5, INT, [{ c: 1.25, w: 0.8, door: true, side: 1 }]],
    ];

    // Wall sides are white, the cut tops are dark, like an architect's plan.
    const wallSide = new THREE.MeshStandardMaterial({ color: "#fbfaf7", roughness: 0.9 });
    const wallTop = new THREE.MeshStandardMaterial({ color: INK, roughness: 0.9 });
    const wallMats = [wallSide, wallSide, wallTop, wallSide, wallSide, wallSide];

    // Floor slab, wood floor, tiles and the soft room colours, all in one group that grows in.
    const slab = new THREE.Group();
    scene.add(slab);
    const catcher = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ color: INK, opacity: 0.12 }));
    catcher.position.y = -0.36;
    catcher.receiveShadow = true;
    scene.add(catcher);
    mesh(rb(14.7, 0.34, 10.7, 0.08), "#ebe8e2", slab, 0, -0.17, 0);
    const floorMat = new THREE.MeshStandardMaterial({ map: wood, roughness: 0.95 });
    const floor = mesh(new THREE.PlaneGeometry(14, 10).rotateX(-Math.PI / 2), floorMat, slab, 0, 0.002, 0);
    floor.castShadow = false;
    for (const r of rooms) {
      const w = r.x[1] - r.x[0], d = r.z[1] - r.z[0];
      const cx = (r.x[0] + r.x[1]) / 2, cz = (r.z[0] + r.z[1]) / 2;
      if (r.tiles) {
        const tiles = mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: tileTexture(w, d), roughness: 0.6 }), slab, cx, 0.006, cz);
        tiles.castShadow = false;
      }
      if (r.color) {
        r.glowMat = new THREE.MeshBasicMaterial({ color: r.color, transparent: true, opacity: 0, depthWrite: false });
        const glow = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), r.glowMat);
        glow.position.set(cx, 0.012, cz);
        glow.renderOrder = 1;
        slab.add(glow);
      }
    }

    // Build the walls, grouped by room so each room rises on its own.
    const glassBase = new THREE.MeshStandardMaterial({ color: "#bfe2ee", roughness: 0.15, transparent: true, opacity: 0 });
    const doorMat = mat("#d2b187");
    const cuts = [];
    for (const r of rooms) {
      r.walls = new THREE.Group();
      scene.add(r.walls);
    }
    for (const [roomId, axis, fixed, a, b, thick, openings] of wallList) {
      const parent = roomById[roomId].walls;
      // Place a box along the wall: u runs along the wall, y is height.
      const piece = (u0, u1, y0, y1, material = wallMats, depth = thick) => {
        const len = u1 - u0, u = (u0 + u1) / 2, y = (y0 + y1) / 2;
        const geo = axis === "x" ? box(len, y1 - y0, depth) : box(depth, y1 - y0, len);
        return axis === "x" ? mesh(geo, material, parent, u, y, fixed) : mesh(geo, material, parent, fixed, y, u);
      };
      const ext = thick / 2;
      let u = a - ext;
      const sorted = [...openings].sort((p, q) => p.c - q.c);
      for (const o of sorted) {
        const o0 = o.c - o.w / 2, o1 = o.c + o.w / 2;
        piece(u, o0, 0, H);
        u = o1;
        const cut = { at: 0, o };
        if (o.door) {
          // A plug fills the doorway until it is cut, then the door swings open.
          cut.plug = piece(o0, o1, 0, H);
          const hinge = new THREE.Group();
          if (axis === "x") hinge.position.set(o0 + 0.03, 0, fixed);
          else hinge.position.set(fixed, 0, o0 + 0.03);
          parent.add(hinge);
          const leafLen = o.w - 0.06;
          const leaf = axis === "x" ? box(leafLen, H - 0.08, 0.05) : box(0.05, H - 0.08, leafLen);
          const m = mesh(leaf, doorMat, hinge, axis === "x" ? leafLen / 2 : 0, (H - 0.08) / 2, axis === "x" ? 0 : leafLen / 2);
          m.castShadow = true;
          cut.hinge = hinge;
          cut.sign = axis === "x" ? -o.side : o.side;
        } else {
          piece(o0, o1, 0, SILL);
          cut.plug = piece(o0, o1, SILL, H);
          cut.glassMat = glassBase.clone();
          const glass = piece(o0 + 0.02, o1 - 0.02, SILL, H - 0.06, cut.glassMat, 0.03);
          glass.castShadow = false;
        }
        cuts.push(cut);
      }
      piece(u, b + ext, 0, H);
    }
    // Cut the openings in order around the plan.
    cuts.forEach((c, i) => { c.at = 3.35 + i * 0.045; });

    // ---- Furniture ----
    const WOOD = "#c99d6e", WOOD_DARK = "#8a6446", WHITE = "#f7f5f1", FABRIC = "#c3c8cb", FABRIC_DARK = "#aab1b5", STONE = "#6c7176", LEAF = "#5d9b6d", LEAF_DARK = "#467f56", POT = "#e7e1d8";
    const ACCENT_SOFT = tint(ACCENT, 0.35);
    const items = [];
    function item(roomId, x, z, rot = 0) {
      const pivot = new THREE.Group();
      pivot.position.set(x, 0, z);
      pivot.rotation.y = rot;
      pivot.visible = false;
      scene.add(pivot);
      const it = { pivot, room: roomId, start: 0 };
      items.push(it);
      return pivot;
    }
    const legs = (g, w, d, h, color = WOOD_DARK, inset = 0.06) => {
      const geo = new THREE.CylinderGeometry(0.022, 0.022, h, 8);
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) mesh(geo, color, g, sx * (w / 2 - inset), h / 2, sz * (d / 2 - inset));
    };

    // Facing +z by default.
    function sofa(g, len) {
      mesh(rb(len, 0.3, 0.85, 0.06), FABRIC_DARK, g, 0, 0.22, 0);
      mesh(rb(len, 0.5, 0.22, 0.08), FABRIC, g, 0, 0.5, -0.32);
      for (const s of [-1, 1]) mesh(rb(0.2, 0.5, 0.85, 0.07), FABRIC, g, s * (len / 2 - 0.1), 0.32, 0);
      const n = len > 1.4 ? 3 : 1, cw = (len - 0.4) / n;
      for (let i = 0; i < n; i++) mesh(rb(cw - 0.04, 0.13, 0.6, 0.05), FABRIC, g, -len / 2 + 0.2 + cw * (i + 0.5), 0.43, 0.06);
      if (len > 1.4) for (const s of [-1, 1]) {
        const p = mesh(rb(0.36, 0.32, 0.1, 0.05), ACCENT, g, s * (len / 2 - 0.42), 0.62, -0.17);
        p.rotation.x = -0.25;
        p.rotation.z = s * 0.12;
      }
    }
    function table(g, w, d, h, color = WOOD) {
      mesh(rb(w, 0.05, d, 0.02), color, g, 0, h, 0);
      legs(g, w, d, h);
    }
    function chair(g) {
      mesh(rb(0.44, 0.06, 0.42, 0.03), WHITE, g, 0, 0.46, 0);
      mesh(rb(0.44, 0.4, 0.05, 0.03), WHITE, g, 0, 0.7, -0.19);
      legs(g, 0.42, 0.4, 0.44, WOOD_DARK, 0.04);
    }
    function plant(g, s = 1) {
      mesh(new THREE.CylinderGeometry(0.2 * s, 0.15 * s, 0.38 * s, 18), POT, g, 0, 0.19 * s, 0);
      const leafGeo = new THREE.IcosahedronGeometry(0.26 * s, 0);
      [[0, 0.62, 0, LEAF], [0.13, 0.82, 0.05, LEAF_DARK], [-0.1, 0.9, -0.06, LEAF], [0.02, 1.08, 0.02, LEAF_DARK]].forEach(([x, y, z, c], i) => {
        const m = mesh(leafGeo, new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, flatShading: true }), g, x * s, y * s, z * s);
        m.rotation.set(i, i * 1.3, 0);
        m.scale.setScalar(1 - i * 0.12);
      });
    }
    function counter(g, len, top = STONE) {
      mesh(rb(len, 0.84, 0.6, 0.02), WHITE, g, 0, 0.42, 0);
      mesh(box(len + 0.02, 0.05, 0.64), top, g, 0, 0.865, 0);
    }
    // Head towards -z, foot towards +z.
    function bed(g, w, l, cover) {
      mesh(rb(w + 0.1, 0.28, l, 0.05), WOOD, g, 0, 0.18, 0);
      mesh(rb(w + 0.16, 0.85, 0.1, 0.04), WOOD, g, 0, 0.43, -l / 2 + 0.02);
      mesh(rb(w, 0.22, l - 0.1, 0.08), WHITE, g, 0, 0.42, 0.03);
      mesh(rb(w + 0.04, 0.07, l * 0.55, 0.035), cover, g, 0, 0.55, l * 0.2);
      mesh(rb(w + 0.05, 0.08, 0.28, 0.035), tint(cover, 0.3), g, 0, 0.6, l * 0.2 - l * 0.26);
      const n = w > 1.3 ? 2 : 1;
      for (let i = 0; i < n; i++) mesh(rb(w / n - 0.12, 0.12, 0.34, 0.06), "#ffffff", g, (i - (n - 1) / 2) * (w / n), 0.59, -l / 2 + 0.3);
    }
    function sideTable(g) {

    const target = new THREE.Vector3(0, 0.3, 0);

    // Where the plan lands on screen (before any lens shift) from a given angle and distance.

      right.set(Math.cos(az), 0, -Math.sin(az));

      const shiftY = (range.y0 + range.y1) / 2 - (b.y0 + b.y1) / 2;

        for (const o of obstacles) if (sx > o.x0 && sx < o.x1 && sy > o.y0 && sy < o.y1) return true;

    function fitDistance(az, el) {

    function resize() {

        ? [

          { range: { x0: nx(col * 0.45), x1: nx(W - pad), y0: ny(Hh - pad), y1: ny(pad) }, obstacles: [rect(head), rect(card)] },

    // setAnimationLoop passes the time in milliseconds.

    (() => {

      const BEAT = LOOP / 24; // 120 bpm: 6 bars of 4 beats fill one 12 s loop exactly

      // Animation time in seconds, or null while the animation is not running.

      // Left or right on screen for a point on the plan, from the camera's orbit angle.
      const panAt = (x, z) => Math.max(-0.7, Math.min(0.7, ((x * Math.cos(baseAz) - z * Math.sin(baseAz)) / 8) * 0.7));

      // One loop of sounds, worked out from the same numbers and objects as the animation.
      const events = [];
      const fx = (t, kind, o = {}) => events.push({ t, kind, ...o });
      const mu = (t, kind, o = {}) => events.push({ t, kind, music: true, ...o });
      function plan() {
        events.length = 0;
        fx(0.1, "slab");
        // Walls rise room by room (each over 0.6 s), a step higher each time.
        const rise = [62, 64, 66, 69, 71, 74, 76];
        rooms.forEach((r, i) => fx(r.rise, "wall", { f: hz(rise[i]), x: (r.x[0] + r.x[1]) / 2, z: (r.z[0] + r.z[1]) / 2 }));
        // Windows chime and doors creak as they cut in, in the same order as the cuts.
        // The window chimes climb a D major pentatonic run.
        const glass = [74, 76, 78, 81, 83, 86, 88, 90, 93, 95, 98, 100];
        let w = 0;
        cuts.forEach((c, i) => {
          const x = c.plug.position.x, z = c.plug.position.z;
          if (c.o.door) fx(c.at + 0.2, "door", { x, z, seed: i });
          else fx(c.at + 0.12, "chime", { f: hz(glass[w % glass.length]), x, z, v: w++ % 2 ? 0.8 : 1 });
        });
        // Furniture pops in with a bounce (lands about 0.17 s after it starts). Big first pieces get a thud.
        const seen = {};
        for (const it of items) {
          const k = (seen[it.room] = (seen[it.room] ?? -1) + 1);
          const room = popOrder.indexOf(it.room);
          const x = it.pivot.position.x, z = it.pivot.position.z;
          fx(it.start, "pop", { f: hz(72 + ((room * 2 + k) % 7) * 2), x, z });
          if (k < 2) fx(it.start + 0.17, "thud", { x, z });
        }
        // Rooms light up one by one.
        tagged.forEach((r, i) => fx(r.lit, "light", { f: hz([74, 76, 78, 81, 83][i % 5]), x: r.at[0], z: r.at[1] }));
        fx(7.9, "card");
        // Fold away: tags and card fade, furniture pops out, walls sink, then the slab.
        fx(OUT, "cardOut");
        fx(OUT + 0.05, "unpop");
        fx(11.05, "sink");
        fx(11.45, "slabOut");

        // Music in D: Dmaj9, A, Bm7, Gmaj7, Em7, A7sus4. Warm electric keys, bass and a light beat.
        // The beat drops out for the last second while the plan folds away.
        const bars = [
          [[66, 69, 73, 76], 38],
          [[64, 69, 71, 73], 33],
          [[62, 66, 69, 71], 35],
          [[62, 66, 67, 71], 31],
          [[64, 67, 71, 74], 40],
          [[64, 67, 69, 74], 33],
        ];
        bars.forEach(([notes, root], b) => {
          const t0 = b * 4 * BEAT, last = b === bars.length - 1;
          const f = notes.map(hz);
          const comp = last ? [[0, 1.3, 1], [1.5, 2.4, 0.8]] : [[0, 1.2, 1], [1.5, 0.5, 0.7], [2.5, 1.2, 0.85]];
          for (const [beat, dur, v] of comp) mu(t0 + beat * BEAT, "keys", { notes: f, dur: dur * BEAT, v });
          mu(t0, "bass", { f: hz(root), dur: 1.3 * BEAT });
          mu(t0 + 2.5 * BEAT, "bass", { f: hz(root), dur: last ? 1.3 * BEAT : 0.9 * BEAT });
          if (!last) mu(t0 + 3.5 * BEAT, "bass", { f: hz(root + 12), dur: 0.4 * BEAT, v: 0.6 });
          mu(t0, "kick", { v: 1 });
          if (!last) mu(t0 + 2.5 * BEAT, "kick", { v: 0.8 });
          mu(t0 + BEAT, "clap");
          if (!last) mu(t0 + 3 * BEAT, "clap");
          for (let e = 0; e < (last ? 4 : 8); e++) mu(t0 + e * BEAT * 0.5, "hat", { v: e % 2 ? 1 : 0.45 });
        });
        events.sort((a, b) => a.t - b.t);
      }

      let ctx = null, master = null, noiseBuf = null, impulse = null, bus = null;
      let wanted = false, musicOn = true;
      let timer = 0, sleepTimer = 0, cursor = null, offset = null;

      function build() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const sr = ctx.sampleRate;
        // Compressor last, so nothing clips.
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp);
        comp.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, sr * 2, sr);
        const n = noiseBuf.getChannelData(0);
        for (let i = 0; i < n.length; i++) n[i] = Math.random() * 2 - 1;
        // A small bright room: stereo noise that fades away, used as the reverb impulse.
        const len = Math.floor(sr * 1.6);
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
        }
      }

      // A fresh set of nodes each time sound is turned on, so nothing booked before a stop leaks out later.
      function openBus() {
        const t = ctx.currentTime;
        const out = ctx.createGain();
        out.gain.setValueAtTime(0, t);
        out.gain.linearRampToValueAtTime(1, t + 0.08);
        out.connect(master);
        const fxIn = ctx.createGain();
        fxIn.connect(out);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const verbTone = filter("lowpass", 5000);
        verb.connect(verbTone);
        verbTone.connect(out);
        // Music gate: music:false fades this to zero, with its reverb.
        const mus = ctx.createGain();
        mus.gain.value = musicOn ? MUSIC_LEVEL : 0;
        mus.connect(out);
        const musVerb = ctx.createGain();
        musVerb.gain.value = 0.25;
        mus.connect(musVerb);
        musVerb.connect(verb);
        return { out, fx: fxIn, verb, mus };
      }

      function closeBus() {
        if (!bus) return;
        const old = bus, t = ctx.currentTime;
        bus = null;
        old.out.gain.cancelScheduledValues(t);
        old.out.gain.setValueAtTime(old.out.gain.value, t);
        old.out.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.out.disconnect(), 300);
      }

      // Small building blocks
      function filter(type, f, q = 0.7) {
        const b = ctx.createBiquadFilter();
        b.type = type;
        b.frequency.value = f;
        b.Q.value = q;
        return b;
      }
      function env(t, attack, peak, decay) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(peak, t + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
        return g;
      }
      function tone(type, f, t, out, stopAt) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        o.connect(out);
        o.start(t);
        o.stop(stopAt);
        return o;
      }
      function noiseAt(t, dur, out) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.connect(out);
        s.start(t, Math.random() * 1.5);
        s.stop(t + dur);
        return s;
      }
      // Send an effect to the mix, panned, with some reverb.
      function toFx(node, pan, send) {
        const p = ctx.createStereoPanner();
        p.pan.value = pan;
        node.connect(p);
        p.connect(bus.fx);
        if (send > 0) {
          const s = ctx.createGain();
          s.gain.value = send;
          p.connect(s);
          s.connect(bus.verb);
        }
        return p;
      }
      // A gain that follows a smooth curve over [t, t + dur].
      function curveGain(t, dur, shape) {
        const g = ctx.createGain();
        g.gain.value = 0;
        g.gain.setValueCurveAtTime(Float32Array.from({ length: 65 }, (_, i) => shape(i / 64)), t, dur);
        return g;
      }

      // Effects
      function slab(t) {
        // A deep, soft thump as the floor slab lands, with a short concrete scuff that spreads out.
        const g = env(t, 0.004, 0.5, 0.6);
        tone("sine", 78, t, g, t + 0.7).frequency.exponentialRampToValueAtTime(38, t + 0.35);
        toFx(g, 0, 0.15);
        const lp = filter("lowpass", 900, 0.7);
        lp.frequency.setValueAtTime(900, t);
        lp.frequency.exponentialRampToValueAtTime(250, t + 0.5);
        const n = curveGain(t, 0.7, (x) => 0.3 * Math.min(1, x * 30) * Math.pow(1 - x, 2.5));
        noiseAt(t, 0.72, lp);
        lp.connect(n);
        toFx(n, 0, 0.3);
      }
      function wall(t, e) {
        // A soft rising swell as a room's walls grow, fast at first like the ease.
        const pan = panAt(e.x, e.z);
        const bp = filter("bandpass", 260, 1.1);
        bp.frequency.setValueAtTime(260, t);
        bp.frequency.exponentialRampToValueAtTime(1500, t + 0.45);
        const g = curveGain(t, 0.62, (x) => 0.2 * Math.min(1, x * 5) * Math.pow(1 - x, 1.4));
        noiseAt(t, 0.64, bp);
        bp.connect(g);
        toFx(g, pan, 0.3);
        const s = curveGain(t, 0.62, (x) => 0.07 * Math.min(1, x * 4) * Math.pow(1 - x, 1.2));
        const o = tone("triangle", e.f * 0.5, t, s, t + 0.65);
        o.frequency.exponentialRampToValueAtTime(e.f, t + 0.3);
        toFx(s, pan, 0.35);
      }
      function chime(t, e) {
        // A small glass chime as the window glass fades in.
        const pan = panAt(e.x, e.z);
        for (const [m, a, d] of [[1, 1, 0.9], [2.76, 0.3, 0.35], [5.4, 0.1, 0.15]]) {
          const g = env(t, 0.002, 0.05 * e.v * a, d);
          tone("sine", e.f * m, t, g, t + d + 0.05);
          toFx(g, pan, 0.5);
        }
      }
      function door(t, e) {
        // A short, gentle creak as the door swings open: stick-slip clicks through a woody resonance.
        const pan = panAt(e.x, e.z);
        const d = 0.55;
        const rate = 34 + (e.seed % 3) * 7;
        const o = ctx.createOscillator();
        o.type = "sawtooth";
        o.frequency.setValueAtTime(rate, t);
        o.frequency.linearRampToValueAtTime(rate * 1.9, t + d * 0.35);
        o.frequency.linearRampToValueAtTime(rate * 1.3, t + d);
        const bp1 = filter("bandpass", 1100 + (e.seed % 4) * 120, 7);
        const bp2 = filter("bandpass", 2300, 5);
        const g = curveGain(t, d, (x) => 0.1 * Math.min(1, x * 12) * Math.pow(1 - x, 1.3));
        o.connect(bp1);
        o.connect(bp2);
        bp1.connect(g);
        bp2.connect(g);
        o.start(t);
        o.stop(t + d + 0.02);
        toFx(g, pan, 0.25);
      }
      function pop(t, e) {
        // A small springy pop as a piece of furniture appears.
        const pan = panAt(e.x, e.z);
        const g = env(t, 0.003, 0.09, 0.09);
        tone("sine", e.f * 0.6, t, g, t + 0.14).frequency.exponentialRampToValueAtTime(e.f * 1.15, t + 0.06);
        toFx(g, pan, 0.15);
      }
      function thud(t, e) {
        // A soft landing thud for the bigger pieces.
        const pan = panAt(e.x, e.z);
        const g = env(t, 0.003, 0.28, 0.14);
        tone("sine", 150, t, g, t + 0.2).frequency.exponentialRampToValueAtTime(62, t + 0.1);
        toFx(g, pan, 0.08);
        const n = env(t, 0.002, 0.07, 0.05);
        const lp = filter("lowpass", 700);
        noiseAt(t, 0.08, lp);
        lp.connect(n);
        toFx(n, pan, 0);
      }
      function light(t, e) {
        // A light switch click, then a soft warm glow that swells as the room colour comes up.
        const pan = panAt(e.x, e.z);
        for (const [dt, v] of [[0, 0.18], [0.028, 0.1]]) {
          const c = env(t + dt, 0.0005, v, 0.012);
          const hp = filter("highpass", 2500);
          noiseAt(t + dt, 0.03, hp);
          hp.connect(c);
          toFx(c, pan, 0.1);
          const k = env(t + dt, 0.0005, v * 0.5, 0.02);
          tone("sine", 3400 - dt * 20000, t + dt, k, t + dt + 0.04);
          toFx(k, pan, 0);
        }
        const glow = curveGain(t, 1.1, (x) => 0.045 * Math.min(1, x / 0.3) * Math.pow(1 - x, 1.5));
        tone("sine", e.f, t, glow, t + 1.15);
        tone("sine", e.f * 1.5, t, glow, t + 1.15).detune.value = 3;
        toFx(glow, pan, 0.5);
      }
      function card(t) {
        // The price card slides in: a soft swoosh that eases off, and a bright, confident two-note chime.
        const p0 = wide ? -0.7 : 0, p1 = wide ? -0.35 : 0;
        const lp = filter("lowpass", 1000, 0.6);
        lp.frequency.setValueAtTime(1000, t);
        lp.frequency.exponentialRampToValueAtTime(3500, t + 0.2);
        lp.frequency.exponentialRampToValueAtTime(1300, t + 0.7);
        const g = curveGain(t, 0.72, (x) => 0.3 * Math.min(1, x * 12) * Math.pow(1 - x, 2.2));
        const p = ctx.createStereoPanner();
        p.pan.setValueAtTime(p0, t);
        p.pan.linearRampToValueAtTime(p1, t + 0.5);
        noiseAt(t, 0.75, lp);
        lp.connect(g);
        g.connect(p);
        p.connect(bus.fx);
        [[0.36, 81, 0.07], [0.5, 86, 0.065]].forEach(([dt, m, v]) => {
          const at = t + dt;
          const a = env(at, 0.003, v, 0.9);
          tone("sine", hz(m), at, a, at + 1);
          const b = env(at, 0.002, v * 0.3, 0.3);
          tone("sine", hz(m) * 2.99, at, b, at + 0.35);
          toFx(a, p1, 0.45);
          toFx(b, p1, 0.45);
        });
      }
      function cardOut(t) {
        const bp = filter("bandpass", 2400, 0.9);
        bp.frequency.setValueAtTime(2400, t);
        bp.frequency.exponentialRampToValueAtTime(900, t + 0.35);
        const g = curveGain(t, 0.4, (x) => 0.1 * Math.sin(Math.PI * Math.pow(x, 0.6)));
        noiseAt(t, 0.42, bp);
        bp.connect(g);
        toFx(g, wide ? -0.4 : 0, 0.3);
      }
      function unpop(t) {
        // Furniture pops back out: a quick ripple of small reversed pops.
        for (let i = 0; i < 7; i++) {
          const at = t + i * 0.04, d = 0.14, f = hz(84 - i * 2);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, at);
          g.gain.exponentialRampToValueAtTime(0.06, at + d - 0.015);
          g.gain.linearRampToValueAtTime(0, at + d);
          tone("sine", f, at, g, at + d + 0.02).frequency.exponentialRampToValueAtTime(f * 0.55, at + d);
          toFx(g, (i % 2 ? 0.3 : -0.3), 0.2);
        }
      }
      function sink(t) {
        // Walls sink back down: a soft falling whoosh.
        const bp = filter("bandpass", 1500, 1);
        bp.frequency.setValueAtTime(1500, t);
        bp.frequency.exponentialRampToValueAtTime(220, t + 0.45);
        const g = curveGain(t, 0.5, (x) => 0.22 * Math.sin(Math.PI * x));
        noiseAt(t, 0.52, bp);
        bp.connect(g);
        toFx(g, 0, 0.3);
      }
      function slabOut(t) {
        // The slab folds away: a low, soft swoosh that closes to nothing.
        const lp = filter("lowpass", 500, 0.8);
        lp.frequency.setValueAtTime(500, t);
        lp.frequency.exponentialRampToValueAtTime(140, t + 0.45);
        const g = curveGain(t, 0.45, (x) => 0.25 * Math.sin(Math.PI * x));
        noiseAt(t, 0.47, lp);
        lp.connect(g);
        toFx(g, 0, 0.2);
        const s = curveGain(t, 0.45, (x) => 0.12 * Math.sin(Math.PI * x));
        tone("sine", 70, t, s, t + 0.47).frequency.exponentialRampToValueAtTime(42, t + 0.45);
        toFx(s, 0, 0);
      }

      // Music
      function keys(t, e) {
        // Warm electric piano: a soft sine body with a short bell-like tine on the attack.
        const lp = filter("lowpass", 2600, 0.5);
        const out = ctx.createGain();
        out.gain.value = 1;
        lp.connect(out);
        out.connect(bus.mus);
        const rel = 0.25;
        e.notes.forEach((f, i) => {
          const g = ctx.createGain();
          const peak = 0.05 * e.v;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(peak, t + 0.006);
          g.gain.exponentialRampToValueAtTime(peak * 0.45, t + Math.min(e.dur, 0.6));
          g.gain.setTargetAtTime(0.0001, t + e.dur, rel / 3);
          tone("sine", f, t, g, t + e.dur + rel + 0.1).detune.value = i % 2 ? 3 : -3;
          const p = ctx.createStereoPanner();
          p.pan.value = (i / (e.notes.length - 1) - 0.5) * 0.5;
          g.connect(p);
          p.connect(lp);
          const tine = env(t, 0.002, peak * 0.22, 0.25);
          tone("sine", f * 4.01, t, tine, t + 0.3);
          tine.connect(p);
        });
      }
      function bass(t, e) {
        const v = e.v || 1;
        const g = env(t, 0.01, 0.3 * v, e.dur);
        tone("sine", e.f, t, g, t + e.dur + 0.05);
        const lp = filter("lowpass", 500, 1);
        const h = env(t, 0.01, 0.06 * v, e.dur * 0.6);
        tone("triangle", e.f * 2, t, h, t + e.dur + 0.05);
        h.connect(lp);
        g.connect(bus.mus);
        lp.connect(bus.mus);
      }
      function kick(t, e) {
        const g = env(t, 0.003, 0.55 * e.v, 0.28);
        tone("sine", 140, t, g, t + 0.34).frequency.exponentialRampToValueAtTime(48, t + 0.1);
        g.connect(bus.mus);
        const c = env(t, 0.0005, 0.06 * e.v, 0.01);
        const hp = filter("highpass", 3000);
        noiseAt(t, 0.02, hp);
        hp.connect(c);
        c.connect(bus.mus);
      }
      function clap(t) {
        // Soft clap: three tiny noise bursts through a band-pass.
        const bp = filter("bandpass", 1600, 1.2);
        const out = ctx.createGain();
        bp.connect(out);
        out.connect(bus.mus);
        for (const [dt, v, d] of [[0, 0.12, 0.012], [0.011, 0.1, 0.012], [0.022, 0.15, 0.11]]) {
          const g = env(t + dt, 0.001, v, d);
          noiseAt(t + dt, d + 0.02, g);
          g.connect(bp);
        }
      }
      function hat(t, e) {
        const g = env(t, 0.001, 0.05 * e.v, 0.035);
        const hp = filter("highpass", 8000);
        noiseAt(t, 0.05, hp);
        hp.connect(g);
        const p = ctx.createStereoPanner();
        p.pan.value = 0.2;
        g.connect(p);
        p.connect(bus.mus);
      }
      const voices = { slab, wall, chime, door, pop, thud, light, card, cardOut, unpop, sink, slabOut, keys, bass, kick, clap, hat };

      function play(e, t, at) {
        if (window.__soundLog) window.__soundLog.push({ kind: e.kind, t: at, when: t }); // test hook
        voices[e.kind](t, e);
      }

      // Audio time being heard right now. Uses the output clock when the browser gives one.
      function heardNow() {
        const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
        const p = performance.now();
        if (ts && ts.contextTime > 0 && ts.performanceTime > 0 && Math.abs(p - ts.performanceTime) < 1000) {
          return ts.contextTime + (p - ts.performanceTime) / 1000;
        }
        return ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
      }

      // Look-ahead scheduler: every 25 ms, book the sounds that fall in the next 200 ms of animation time
      // (enough to ride out a slow frame on a busy page).
      function pump() {
        const now = bus && ctx.state === "running" ? clock() : null;
        // Paused or hidden: book nothing. The cursor stays, so a short stall does not book anything twice.
        if (now === null) return;
        // Audio time = animation time + offset, smoothed so small jitter does not move sounds.
        const raw = heardNow() - now;
        if (offset === null || Math.abs(raw - offset) > 0.05) offset = raw;
        else offset += (raw - offset) * 0.1;
        // Start, a long pause or a jump: pick up from now and skip anything missed, so nothing piles up.
        if (cursor === null || now - cursor > 0.3 || cursor - now > LOOK_AHEAD + 0.3) cursor = now;
        const end = now + LOOK_AHEAD;
        for (let k = Math.floor(cursor / LOOP); k * LOOP < end; k++) {
          for (const e of events) {
            const at = k * LOOP + e.t;
            // Each sound plays once: its time must fall in [cursor, end). Ones more than 80 ms late are skipped.
            if (at < cursor || at >= end || at < now - 0.08 || (e.music && !musicOn)) continue;
            play(e, Math.max(ctx.currentTime, at + offset), at);
          }
        }
        cursor = end;
      }

      function update() {
        const on = wanted && !reduce.matches;
        if (on) {
          if (!ctx) build();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!bus) {
            plan();
            bus = openBus();
            cursor = null;
            offset = null;
          }
          if (!timer) timer = setInterval(pump, 25);
          pump();
        } else if (ctx) {
          clearInterval(timer);
          timer = 0;
          cursor = null;
          closeBus();
          clearTimeout(sleepTimer);
          sleepTimer = setTimeout(() => {
            if (!(wanted && !reduce.matches)) ctx.suspend().catch(() => {});
          }, 220);
        }
      }

      function setMusic(on) {
        if (on === musicOn) return;
        musicOn = on;
        if (bus) {
          const g = bus.mus.gain, t = ctx.currentTime;
          g.cancelScheduledValues(t);
          g.setValueAtTime(g.value, t);
          g.linearRampToValueAtTime(on ? MUSIC_LEVEL : 0, t + 0.12);
        }
      }

      // Browsers may block audio until a click or key press: resume then.
      const unlock = () => {
        if (ctx && wanted && !reduce.matches && ctx.state !== "running") ctx.resume().catch(() => {});
      };
      window.addEventListener("pointerdown", unlock);
      window.addEventListener("keydown", unlock);
      reduce.addEventListener("change", update);

      window.addEventListener("message", (event) => {
        const d = event.data;
        if (event.origin !== location.origin || !d || d.type !== "motionprompt-sound") return;
        if (typeof d.music === "boolean") setMusic(d.music);
        if (typeof d.on === "boolean") wanted = d.on;
        update();
      });
      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wanted = true;
        setMusic(fromUrl === "1");
        update();
      }
    })();

    resize();
    apply();
    // Measure again once the font has loaded, since the title may change size.
    document.fonts.ready.then(() => {
      resize();
      if (reduce.matches) still();
    });
  </script>
</body>
</html>
