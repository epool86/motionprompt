<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slide deck demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.3.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.3.0/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.3.0/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.3.0/700.css">
  <style>
    /* Colours can be set from the URL: ?text=...&bg=e7e6ea&ink=2b2b33&accent=e8591a&accent2=f4c3ab */
    :root {
      --bg: #e7e6ea;
      --ink: #2b2b33;
      --accent: #e8591a;
      --accent2: #f4c3ab;
      --muted: color-mix(in srgb, var(--ink) 58%, #fff);
      --line: color-mix(in srgb, var(--ink) 12%, #fff);
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    /* The camera looks at a tilted table; the plane holds every slide card. */
    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      perspective-origin: 50% 50%;
      background: radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--bg) 70%, #fff), var(--bg) 70%);
    }
    #plane {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }
    .table {
      position: absolute;
      transform: translateZ(-2px);
      background:
        radial-gradient(50% 50% at 50% 50%, color-mix(in srgb, var(--bg) 60%, #fff), transparent 70%),
        var(--bg);
    }

    /* Soft light from above, a little haze on the far side, and a vignette. */
    .haze {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--bg) 75%, transparent) 0%, transparent 34%),
        radial-gradient(130% 100% at 50% 50%, transparent 58%, rgba(40, 30, 40, 0.16) 100%);
    }

    .card {
      position: absolute;
      left: 0;
      top: 0;
      width: 1000px;
      height: 562px;
      margin: -281px 0 0 -500px;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      font-family: "Poppins", system-ui, sans-serif;
      color: var(--ink);
      backface-visibility: hidden;
      box-shadow: 0 34px 60px rgba(30, 20, 30, 0.16), 0 8px 18px rgba(30, 20, 30, 0.08);
    }
    .card > * { position: absolute; margin: 0; }
    .card.orange { background: var(--accent); color: #fff; }

    .brand { left: 40px; top: 26px; display: flex; align-items: center; gap: 8px; font: 600 15px/1 "Poppins", sans-serif; }
    .brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); transform: rotate(45deg); }
    .orange .brand i { background: #fff; }
    .ox { right: 40px; top: 24px; width: 50px; height: 20px; }
    .ox b { position: absolute; left: 0; top: 0; width: 12px; height: 12px; border: 4px solid var(--accent); border-radius: 50%; }
    .ox s, .ox s::after { position: absolute; left: 30px; top: 8px; width: 20px; height: 4px; background: var(--accent); transform: rotate(45deg); border-radius: 2px; }
    .ox s::after { content: ""; left: 0; top: 0; transform: rotate(90deg); }
    .orange .ox b { border-color: #fff; }
    .orange .ox s, .orange .ox s::after { background: #fff; }

    .h { font-weight: 600; font-size: 50px; line-height: 1.08; letter-spacing: -0.01em; }
    .h em { font-style: normal; font-weight: 700; color: var(--accent); }
    .orange .h em { color: var(--ink); }
    .lab { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; color: var(--accent); }
    .lab::before { content: ""; width: 34px; height: 2px; background: currentColor; }
    .p { font-size: 16px; line-height: 1.6; color: var(--muted); }
    .orange .p { color: rgba(255, 255, 255, 0.86); }
    .k { font-size: 19px; font-weight: 600; color: var(--accent); }
    .w { display: inline-block; }
    .photo { overflow: hidden; border-radius: 12px; background: var(--accent2); }
    .photo svg, .fill { display: block; width: 100%; height: 100%; }
    .pill { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; }
    .pill::after { content: ""; width: 8px; height: 8px; border: solid #fff; border-width: 2.5px 2.5px 0 0; transform: rotate(45deg); }
    .chip { padding: 8px 18px; border-radius: 999px; border: 2px solid rgba(255, 255, 255, 0.8); color: #fff; font-size: 14px; font-weight: 600; }
    .box { border-radius: 12px; background: var(--accent); color: #fff; padding: 22px 24px; box-sizing: border-box; }
    .bub { width: 66px; height: 48px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; }
    .bub::after { content: ""; position: absolute; left: 14px; bottom: -8px; border: 9px solid transparent; border-top-color: var(--accent); border-bottom: 0; }
    .bub svg { width: 24px; height: 24px; }
    .bl { font-size: 14px; font-weight: 600; }
    .row { box-sizing: border-box; height: 64px; border-radius: 12px; background: #f3f2f5; display: flex; align-items: center; gap: 22px; padding: 0 26px; font-size: 18px; font-weight: 500; }
    .row b { font-weight: 700; color: var(--accent); }
    .row.on { background: var(--accent); color: #fff; }
    .row.on b { color: #fff; }
    .ring { border-radius: 50%; }
    .soc { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
    .soc svg { width: 22px; height: 22px; }
    .big { font-weight: 700; letter-spacing: -0.02em; }
    .col { display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  </style>
</head>
<body>
  <div id="stage" role="img"><div id="plane"></div></div>
  <div class="haze"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const root = document.documentElement;
    for (const key of ["bg", "ink", "accent", "accent2"]) {
      const value = params.get(key);
      if (/^[0-9a-f]{6}$/i.test(value ?? "")) root.style.setProperty(`--${key}`, `#${value}`);
    }
    const text = (params.get("text") || "Company profile 2026").trim().slice(0, 60);
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

    const stage = document.getElementById("stage");
    const plane = document.getElementById("plane");
    stage.setAttribute("aria-label", `Presentation slides spread on a table, the camera gliding from slide to slide: ${text}`);

    // Slides are 1000 x 562 units. Everything below is drawn in those units.
    const CW = 1000, CH = 562;
    const at = (x, y, w, h) => `left:${x}px;top:${y}px;${w ? `width:${w}px;` : ""}${h ? `height:${h}px;` : ""}`;

    // Small line icons, drawn in a 24 unit box with the current colour.
    const ICONS = {
      edit: "M4 20h4L19 9l-4-4L4 16z M13 7l4 4",
      chart: "M4 20V10 M10 20V4 M16 20v-7 M3 20h18",
      rocket: "M12 3c4 3 5 8 3 12H9C7 11 8 6 12 3z M9 15l-3 4 M15 15l3 4 M12 9.5v.1",
      check: "M4 12l5 5L20 6",
      globe: "M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18",
      mail: "M3 6h18v12H3z M3 7l9 6 9-6",
      phone: "M6 3h4l1.5 5-2.5 1.5a11 11 0 0 0 5.5 5.5L16 12.5l5 1.5v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z",
      pin: "M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z M12 7a2 2 0 1 0 0 4a2 2 0 1 0 0-4z",
    };
    const icon = (name, color = "#fff", width = 2.2) =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[name]}"/></svg>`;

    // Drawn "photos": a warm room with a chair, a building site, a meeting, a portrait.
    function room(v = 0) {
      const chair = v ? "#b8452a" : "var(--accent)";
      return `<svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="rw${v}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe3d6"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
        <rect width="200" height="240" fill="url(#rw${v})"/>
        <rect y="176" width="200" height="64" fill="#e4b39c"/>
        <rect x="${v ? 22 : 112}" y="34" width="64" height="98" rx="4" fill="#fff8f2" opacity="0.9"/>
        <path d="M${v ? 54 : 144} 34v98 M${v ? 22 : 112} 80h64" stroke="#e9c4b1" stroke-width="3"/>
        <rect x="${v ? 110 : 20}" y="150" width="54" height="8" rx="3" fill="#8a5a46"/>
        <path d="M${v ? 116 : 26} 158v36 M${v ? 158 : 68} 158v36" stroke="#8a5a46" stroke-width="3"/>
        <path d="M${v ? 118 : 28} 150c-2-34 4-54 20-60c10 4 14 26 12 60z" fill="#7d8f6c"/>
        <path d="M64 196l6-50h52l6 50" stroke="#3d2a26" stroke-width="3.5" fill="none"/>
        <path d="M70 146c-2-26 6-40 26-42s30 14 26 42z" fill="${chair}"/>
        <rect x="62" y="140" width="68" height="16" rx="7" fill="${chair}"/>
        <rect x="62" y="140" width="68" height="6" rx="3" fill="#fff" opacity="0.18"/>
        <path d="M176 40v74 M162 114h28" stroke="#3d2a26" stroke-width="2.5"/>
        <path d="M164 40h24l-4-16h-16z" fill="#f7efe8" stroke="#3d2a26" stroke-width="2"/>
      </svg>`;
    }
    function site() {
      let win = "";
      for (let x = 0; x < 7; x++) for (let y = 0; y < 5; y++) {
        win += `<rect x="${196 + x * 24}" y="${70 + y * 30}" width="18" height="22" rx="2" fill="${(x + y) % 3 ? "#cfdbe6" : "#eef3f7"}"/>`;
      }
      return `<svg viewBox="0 0 560 240" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe6ef"/><stop offset="1" stop-color="#fbeee6"/></linearGradient></defs>
        <rect width="560" height="240" fill="url(#sk)"/>
        <rect x="40" y="120" width="110" height="120" fill="#e9dcd4"/><rect x="420" y="100" width="110" height="140" fill="#eadfd8"/>
        <rect x="186" y="56" width="180" height="184" fill="#8d97a3"/>${win}
        <path d="M380 240V30 M380 34h150 M392 34l-12 18 M470 34v50" stroke="var(--accent)" stroke-width="5" fill="none"/>
        <rect x="462" y="84" width="16" height="14" fill="var(--accent)"/>
        <rect x="0" y="226" width="560" height="14" fill="#c9b4a8"/>
      </svg>`;
    }
    function meeting() {
      const person = (x, s, shirt, hair) => `<g transform="translate(${x} 0) scale(${s})">
        <path d="M-34 250c0-50 14-76 34-76s34 26 34 76z" fill="${shirt}"/>
        <circle cx="0" cy="150" r="22" fill="#c98e6b"/><path d="M-23 146c0-20 10-30 23-30s24 10 23 30c-8-10-30-12-46 0z" fill="${hair}"/></g>`;
      return `<svg viewBox="0 0 560 562" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9df"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
        <rect width="560" height="562" fill="url(#mt)"/>
        <rect x="330" y="60" width="170" height="220" rx="6" fill="#fff" opacity="0.7"/>
        <g transform="translate(0 150) scale(1.3)" transform-origin="280 200">${person(170, 1, "#3b3b46", "#2a1f1c")}${person(280, 1.1, "var(--accent)", "#3a2820")}${person(390, 1, "#f2efe9", "#20181a")}</g>
        <rect x="40" y="440" width="480" height="30" rx="8" fill="#8a5a46"/>
        <rect x="40" y="470" width="480" height="92" fill="#e2b7a2"/>
      </svg>`;
    }
    function face(skin, hair, shirt) {
      return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f6e3d9"/>
        <path d="M12 104c0-26 16-38 38-38s38 12 38 38z" fill="${shirt}"/>
        <circle cx="50" cy="44" r="19" fill="${skin}"/>
        <path d="M30 44c-2-18 8-28 20-28s23 8 20 28c-4-10-12-14-20-14s-16 4-20 14z" fill="${hair}"/></svg>`;
    }
    function worker() {
      return `<svg viewBox="0 0 300 330">
        <path d="M36 300c-30-60-10-160 40-190c-6 60 10 120 40 190z" fill="#dcdbe0"/>
        <path d="M250 300c40-50 40-150 0-200c-10 60-30 120-60 200z" fill="#e6e5ea"/>
        <path d="M70 250c-20-40-10-90 20-110c0 40 10 80 30 110z" fill="#cfcdd4"/>
        <ellipse cx="150" cy="300" rx="120" ry="16" fill="#000" opacity="0.06"/>
        <path d="M70 296c10-34 50-44 80-44s70 10 80 44z" fill="#34343f"/>
        <path d="M108 262c-6-50 10-96 42-96s48 46 42 96z" fill="var(--accent)"/>
        <circle cx="150" cy="128" r="26" fill="#b87a58"/>
        <path d="M122 126c-4-26 12-40 28-40s34 12 28 40c-6-14-16-18-28-18s-22 4-28 18z" fill="#231a1a"/>
        <path d="M96 238l108 0l14 44h-136z" fill="#9a9aa6"/>
        <path d="M88 282h124" stroke="#6e6e7a" stroke-width="8" stroke-linecap="round"/>
        <circle cx="150" cy="258" r="5" fill="#fff" opacity="0.8"/>
      </svg>`;
    }
    // A dotted world map made from a few rough continent blobs.
    function worldDots() {
      const blobs = [[0.2, 0.34, 0.14, 0.2], [0.27, 0.72, 0.07, 0.2], [0.5, 0.3, 0.07, 0.12], [0.53, 0.62, 0.08, 0.2], [0.68, 0.34, 0.16, 0.18], [0.78, 0.58, 0.06, 0.1], [0.86, 0.78, 0.07, 0.08]];
      let dots = "";
      for (let x = 0; x < 70; x++) for (let y = 0; y < 34; y++) {
        const u = x / 69, v = y / 33;
        if (blobs.some(([cx, cy, rx, ry]) => ((u - cx) / rx) ** 2 + ((v - cy) / ry) ** 2 < 1)) dots += `<circle cx="${10 + x * 12}" cy="${10 + y * 12}" r="3.4"/>`;
      }
      return `<svg viewBox="0 0 848 416" fill="#d9d8de">${dots}</svg>`;
    }

    // The title slide: split into words so they can rise one by one, last word in the accent colour.
    function titleHTML() {
      const words = text.split(/\s+/);
      return words.map((w, i) => i === words.length - 1 ? `<em class="w">${esc(w)}</em>` : `<span class="w">${esc(w)}</span>`).join(" ");
    }

    // Each slide: its markup and, for the slides the camera visits, what animates on arrival.
    const SLIDES = {
      title: () => `
        <div class="col" style="${at(64, 70, 470, 440)}">
          <div class="lab a1" style="position:static">Presentation</div>
          <h1 class="h ttl" style="position:static;margin:0;font-size:72px">${titleHTML()}</h1>
          <p class="p a2" style="position:static;margin:0;width:400px">Who we are, what we do and where we are going next.</p>
          <div class="a3" style="position:static"><span class="pill">Let's begin</span></div>
        </div>
        <div class="a4" style="${at(590, 0, 410, 562)};background:var(--accent);border-radius:180px 0 0 0"></div>
        <div class="photo a5" style="${at(665, 100, 260, 360)};border-radius:130px 130px 16px 16px;border:8px solid #fff">${room()}</div>
        <div class="a6" style="${at(600, 440, 60, 60)};background:radial-gradient(circle,#fff 2.5px,transparent 3px) 0 0/15px 15px"></div>`,
      diagram: () => `
        <div class="lab" style="${at(64, 92)}">Diagram and infographic</div>
        <h2 class="h" style="${at(64, 124, 380)};font-size:46px">Diagram &amp;<br><em>Infographic</em></h2>
        <p class="p" style="${at(64, 250, 330)}">One simple picture of how we work, from the first idea to the last check.</p>
        <div class="k" style="${at(64, 410)};font-size:16px">Detail information</div>
        <p class="p" style="${at(64, 440, 320)};font-size:14px">Four steps, one team, clear results.</p>
        <div style="${at(560, 190, 300, 330)}">${worker()}</div>
        ${[["edit", "Plan", 470, 170], ["chart", "Data", 590, 92], ["rocket", "Launch", 770, 104], ["check", "Check", 858, 250]]
          .map(([ic, lb, x, y]) => `<div class="bub pop" style="${at(x, y)}">${icon(ic)}</div><div class="bl pop" style="${at(x + 74, y + 12)}">${lb}</div>`).join("")}`,
      journey: () => `
        <h2 class="h" style="${at(64, 56)};font-size:44px">Our <em>Journey</em></h2>
        <p class="p" style="${at(600, 62, 340)};font-size:14px;text-align:right">From a small shop to a regional team in four years.</p>
        <div class="photo reveal" style="${at(64, 136, 872, 200)}">${site()}</div>
        <div class="tline" style="${at(110, 402, 780, 4)};background:var(--accent);border-radius:2px"></div>
        ${["2019", "2020", "2021", "2022"].map((y, i) => `
          <div class="ring pop" style="${at(98 + i * 260, 390, 28, 28)};background:var(--accent);box-shadow:0 0 0 6px #fff, 0 0 0 8px var(--accent2)"></div>
          <div class="k up" style="${at(80 + i * 260, 432)};color:var(--ink);font-size:22px">${y}</div>
          <div class="p up" style="${at(80 + i * 260, 466, 200)};font-size:13px;line-height:1.4">${["Founded in Shah Alam", "First big client", "Moved online", "New regional office"][i]}</div>`).join("")}`,
      chart: () => `
        <div class="lab" style="${at(64, 84)}">Performance</div>
        <h2 class="h" style="${at(64, 116, 320)};font-size:44px">Line <em>chart</em><br>detail</h2>
        <div class="k up" style="${at(64, 260)}">Detail information</div>
        <p class="p up" style="${at(64, 294, 290)}">Sales grew every quarter this year, with the best month in December.</p>
        <div style="${at(0, 452, 150, 110)};background:var(--accent);border-radius:0 90px 0 0"></div>
        <div style="${at(190, 490, 36, 36)};opacity:0.9"><svg viewBox="0 0 24 24" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg></div>
        <div style="${at(400, 76, 540, 420)};background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(40,20,20,0.1)">
          <div class="k" style="position:absolute;left:30px;top:24px;font-size:16px">Monthly sales</div>
          <svg style="position:absolute;left:24px;top:70px" width="492" height="320" viewBox="0 0 492 320">
            <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
            ${[0, 1, 2, 3, 4].map((i) => `<path d="M0 ${20 + i * 66}H492" stroke="var(--line)" stroke-width="2"/>`).join("")}
            <path class="area" d="M10 250L90 214L170 230L250 160L330 172L410 96L482 60V284H10z" fill="url(#ar)"/>
            <path class="cline" d="M10 250L90 214L170 230L250 160L330 172L410 96L482 60" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            ${[[90, 214], [250, 160], [410, 96], [482, 60]].map(([x, y]) => `<circle class="cdot" cx="${x}" cy="${y}" r="9" fill="#fff" stroke="var(--accent)" stroke-width="5"/>`).join("")}
          </svg>
        </div>`,
      project: () => `
        <div style="${at(0, 120, 64, 320)};background:linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 70%, #000));border-radius:0 12px 12px 0"></div>
        <h2 class="h" style="${at(110, 62)};font-size:46px">Project <em>Detail</em></h2>
        <div class="k up" style="${at(110, 170)}">Description</div>
        <p class="p up" style="${at(110, 206, 400)}">A clean new store design that doubled our walk in customers in six months.</p>
        <div class="k up" style="${at(110, 350)}">Points</div>
        <div class="big count" style="${at(110, 380)};font-size:60px">+0</div>
        <div class="k up" style="${at(600, 150)}">Creator</div>
        <div class="photo ring pop" style="${at(600, 192, 74, 74)}">${face("#c98e6b", "#2a1f1c", "var(--accent)")}</div>
        <div class="up" style="${at(692, 198)};font-size:22px;font-weight:600">Aisha Rahman</div>
        <div class="p up" style="${at(692, 232)};font-size:14px">Founder, Nova Studio</div>
        <div class="k up" style="${at(600, 310)}">Social media</div>
        ${["globe", "mail", "phone"].map((ic, i) => `<div class="soc pop" style="${at(600 + i * 60, 352)}">${icon(ic)}</div>`).join("")}`,
      purpose: () => `
        <div class="lab" style="${at(64, 92)}">Who we are</div>
        <h2 class="h" style="${at(64, 124)};font-size:46px">Purpose &amp;<br><em>Goal</em></h2>
        <p class="p" style="${at(64, 252, 230)};font-size:14px">Good design for small businesses, at a fair price.</p>
        <div class="photo" style="${at(330, 52, 330, 290)}">${room(1)}</div>
        <div class="box" style="${at(270, 300, 260, 170)}"><div style="font-size:20px;font-weight:600">Our Vision</div><div style="font-size:13px;line-height:1.5;margin-top:8px;opacity:0.9">Every local shop looks as good as the big brands.</div></div>
        <div class="k" style="${at(700, 120)}">Description</div>
        <p class="p" style="${at(700, 156, 250)};font-size:14px">We help owners tell their story with clear, friendly design.</p>

      thanks: () => `

        <div class="ring" style="${at(700, 300, 300, 300)};background:rgba(255,255,255,0.1)"></div>
        <h2 class="h" style="${at(64, 150)};font-size:78px">Thank <em>you</em></h2>

    };
    const VISITS = ["title", "diagram", "journey", "chart", "project"];
    const OTHERS = ["purpose", "features", "map", "meeting", "contents", "team", "thanks"];

    // Three layouts, picked by the shape of the window. v = virtual viewport in scene units.
    // visits = grid slots the camera stops at, in order (slot = row * cols + col).
    const layouts = {
      wide: { vw: 1600, vh: 900, cols: 4, rows: 3, visits: [1, 5, 6, 10, 9], wideS: 0.4, focusS: 1.3, rx: [40, 24], rz: [-18, -8], wideCy: 90 },
      square: { vw: 1200, vh: 1200, cols: 3, rows: 4, visits: [1, 4, 5, 8, 7], wideS: 0.37, focusS: 1.1, rx: [42, 22], rz: [-16, -7], wideCy: 180 },
      tall: { vw: 900, vh: 1600, cols: 2, rows: 6, visits: [2, 3, 5, 4, 6], wideS: 0.37, focusS: 0.87, rx: [44, 20], rz: [-14, -5], wideCy: 420 },
    };

    const GAP = 90, OFF = 0.42 * CW, P0 = 1500;
    const LOOP = 12; // seconds: six bars at 120 bpm
    const ARRIVE = [1.75, 3.5, 5.25, 7, 8.75]; // the camera lands on a slide every seven beats
    const GLIDE = 0.75, PULL = 10.4, EXIT = 11.45;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    let tl = null, k = 1, L = layouts.wide, sfx = [];
    const cam = { cx: 0, cy: 0, dist: 0, rx: 40, rz: -16 };

    function applyCam() {
      plane.style.transform = `scale3d(${k},${k},${k}) translate3d(0,0,${-cam.dist}px) rotateX(${cam.rx}deg) rotateZ(${cam.rz}deg) translate3d(${-cam.cx}px,${-cam.cy}px,0)`;
    }
    const distFor = (s) => P0 / s - P0;

    // The title fits its box: shrink the font until it stays inside, on up to three lines.
    function fitTitle(card) {
      const col = card.querySelector(".col"), h1 = card.querySelector(".ttl");
      let size = 72;
      for (let i = 0; i < 30; i++) {
        h1.style.fontSize = `${size}px`;
        if (col.scrollHeight <= 440 && h1.scrollWidth <= 470) break;
        size *= 0.94;
      }
    }

    function build() {
      const keep = tl ? tl.time() : 0;
      if (tl) tl.kill();
      plane.replaceChildren();
      sfx = [];

      const W = innerWidth, H = innerHeight, aspect = W / H;
      L = aspect >= 1.3 ? layouts.wide : aspect <= 0.85 ? layouts.tall : layouts.square;
      k = Math.min(W / L.vw, H / L.vh);
      stage.style.perspective = `${P0 * k}px`;

      // Slots on the table, in rows, every other row nudged sideways like slides spread by hand.
      const slots = [];
      for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++) {
        slots.push({ r, c, x: c * (CW + GAP) + (r % 2 ? OFF : 0) - (L.cols === 2 ? OFF / 2 : 0), y: r * (CH + GAP) });
      }
      const mx = (Math.min(...slots.map((s) => s.x)) + Math.max(...slots.map((s) => s.x))) / 2;
      const my = (L.rows - 1) * (CH + GAP) / 2;
      slots.forEach((s) => { s.x -= mx; s.y -= my; });

      const table = document.createElement("div");
      table.className = "table";
      Object.assign(table.style, { left: "-9000px", top: "-7000px", width: "18000px", height: "14000px" });
      plane.append(table);

      // Put the visited slides in their slots and the others in the rest.
      const kinds = new Array(slots.length);
      L.visits.forEach((slot, i) => { kinds[slot] = VISITS[i]; });
      let o = 0;
      for (let i = 0; i < kinds.length; i++) if (!kinds[i]) kinds[i] = OTHERS[o++ % OTHERS.length];
      const cards = slots.map((s, i) => {
        const card = document.createElement("div");
        card.className = `card${kinds[i] === "thanks" ? " orange" : ""}`;
        card.innerHTML = `<div class="brand"><i></i>Nova</div><div class="ox"><b></b><s></s></div>${SLIDES[kinds[i]]()}`;
        plane.append(card);
        gsap.set(card, { x: s.x, y: s.y, z: 0 });
        return card;
      });
      const byKind = (kind) => cards[kinds.indexOf(kind)];
      fitTitle(byKind("title"));

      // Camera stops: the wide view, then each visited slide, banking a little differently each time.
      const wideDist = distFor(L.wideS), focusDist = distFor(L.focusS), midDist = distFor(L.focusS * 0.72);
      const wide = { cx: 0, cy: L.wideCy, dist: wideDist, rx: L.rx[0], rz: L.rz[0] };
      Object.assign(cam, { ...wide, cx: -120, dist: wideDist * 1.12 });
      const bank = [0, 0.6, -0.5, 0.9, -0.2];
      const stops = L.visits.map((slot, i) => ({
        cx: slots[slot].x, cy: slots[slot].y,
        rx: L.rx[1] + (i % 2 ? 3 : 0), rz: L.rz[1] + bank[i] * 5,
      }));

      tl = gsap.timeline({ repeat: -1, onUpdate: applyCam });
      tl.to(cam, { cx: wide.cx, dist: wideDist, duration: ARRIVE[0] - GLIDE, ease: "sine.out" }, 0);

      // Slides drop onto the table, far rows first.
      const order = slots.map((s, i) => i).sort((a, b) => slots[a].r - slots[b].r || slots[a].c - slots[b].c);
      order.forEach((ci, n) => {
        const t = 0.05 + n * 0.05;
        tl.fromTo(cards[ci], { z: 420, opacity: 0 }, { z: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, t);
        sfx.push({ t: t + 0.3, type: "tap", p: Math.max(-0.6, Math.min(0.6, slots[ci].x / 2600)), v: 0.7 + (n % 3) * 0.12 });
      });

      // Glide from slide to slide: ease across, lift back a little in the middle, settle in close.
      stops.forEach((st, i) => {
        const first = i === 0;
        const dur = first ? GLIDE + 0.15 : GLIDE;
        const t0 = ARRIVE[i] - dur;
        tl.to(cam, { cx: st.cx, cy: st.cy, rx: st.rx, rz: st.rz, duration: dur, ease: "power2.inOut" }, t0);
        if (first) tl.to(cam, { dist: focusDist, duration: dur, ease: "power2.inOut" }, t0);
        else {
          tl.to(cam, { dist: midDist, duration: dur / 2, ease: "sine.out" }, t0);
          tl.to(cam, { dist: focusDist, duration: dur / 2, ease: "sine.in" }, t0 + dur / 2);
        }
        // A slow drift while the slide is on screen, so the shot never freezes.
        const hold = (i < stops.length - 1 ? ARRIVE[i + 1] - GLIDE : PULL) - ARRIVE[i];
        tl.to(cam, { cx: st.cx + 34, cy: st.cy - 10, duration: hold, ease: "none" }, ARRIVE[i]);
        const from = i ? stops[i - 1].cx : wide.cx;
        const pan = Math.max(-0.7, Math.min(0.7, (st.cx - from) / 1400));
        sfx.push({ t: t0, type: "whoosh", dur, p0: -pan, p1: pan, v: first ? 0.9 : 0.7 });
      });

      // Pull back to the wide view, then the slides lift away and the loop starts again.
      tl.to(cam, { cx: wide.cx, cy: wide.cy, rx: wide.rx, rz: wide.rz, duration: EXIT - PULL + 0.1, ease: "power2.inOut" }, PULL);
      tl.to(cam, { dist: wideDist * 0.95, duration: EXIT - PULL + 0.1, ease: "power2.inOut" }, PULL);
      sfx.push({ t: PULL, type: "whoosh", dur: EXIT - PULL, p0: 0.3, p1: -0.3, v: 1 });
      order.slice().reverse().forEach((ci, n) => {
        tl.to(cards[ci], { z: 380, opacity: 0, duration: 0.36, ease: "power2.in" }, EXIT + n * 0.012);
      });
      sfx.push({ t: EXIT, type: "lift", dur: 0.5 });

      // What happens on each slide as the camera arrives.
      const pops = (els, t0, gap, f) => els.forEach((el, n) => sfx.push({ t: t0 + n * gap + 0.05, type: "pop", f: f * Math.pow(1.12, n) }));

      let c = byKind("title"), t = ARRIVE[0] - 0.2;
      // Only the title words wait for the camera; the rest of the slide just settles in.
      tl.from(c.querySelector(".a4"), { xPercent: 14, duration: 0.8, ease: "power3.out" }, t);
      tl.from(c.querySelector(".a5"), { y: 24, scale: 0.94, duration: 0.8, ease: "back.out(1.5)" }, t + 0.1);
      tl.from(c.querySelector(".a1"), { x: -24, duration: 0.5, ease: "power2.out" }, t + 0.1);
      const words = c.querySelectorAll(".ttl .w");
      tl.from(words, { y: 50, opacity: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 }, t + 0.2);
      tl.from(c.querySelector(".a3"), { scale: 0.7, transformOrigin: "0% 50%", duration: 0.4, ease: "back.out(2.5)" }, t + 0.45 + words.length * 0.07);
      sfx.push({ t: ARRIVE[0], type: "chime" });
      sfx.push({ t: t + 0.6 + words.length * 0.07, type: "pop", f: 660 });

      c = byKind("diagram"); t = ARRIVE[1] - 0.1;
      const bubs = c.querySelectorAll(".bub.pop"), bls = c.querySelectorAll(".bl.pop");
      tl.from(bubs, { scale: 0, transformOrigin: "20% 100%", duration: 0.4, ease: "back.out(2.4)", stagger: 0.16 }, t + 0.15);
      tl.from(bls, { x: -12, opacity: 0, duration: 0.3, stagger: 0.16 }, t + 0.25);
      pops([...bubs], t + 0.15, 0.16, 520);

      c = byKind("journey"); t = ARRIVE[2] - 0.15;
      tl.from(c.querySelector(".reveal svg"), { scale: 1.15, duration: 1.6, ease: "power2.out" }, t);
      tl.from(c.querySelector(".tline"), { scaleX: 0, transformOrigin: "0% 50%", duration: 0.8, ease: "power2.inOut" }, t + 0.25);
      const jd = c.querySelectorAll(".pop");
      tl.from(jd, { scale: 0, duration: 0.35, ease: "back.out(3)", stagger: 0.2 }, t + 0.3);
      tl.from(c.querySelectorAll(".up"), { y: 14, opacity: 0, duration: 0.3, stagger: 0.1 }, t + 0.35);
      pops([...jd], t + 0.3, 0.2, 587);
      sfx.push({ t: t + 0.25, type: "swish", dur: 0.8, f0: 300, f1: 700 });

      c = byKind("chart"); t = ARRIVE[3] - 0.1;
      const line = c.querySelector(".cline"), len = line.getTotalLength() + 4;
      gsap.set(line, { strokeDasharray: len });
      tl.fromTo(line, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, t + 0.1);
      tl.from(c.querySelector(".area"), { opacity: 0, duration: 0.6 }, t + 0.5);
      const cd = c.querySelectorAll(".cdot");
      tl.from(cd, { scale: 0, transformOrigin: "50% 50%", transformBox: "fill-box", duration: 0.3, ease: "back.out(3)", stagger: 0.18 }, t + 0.35);
      tl.from(c.querySelectorAll(".up"), { x: -30, opacity: 0, duration: 0.4, stagger: 0.1 }, t + 0.1);
      sfx.push({ t: t + 0.1, type: "swish", dur: 0.9, f0: 350, f1: 1100 });
      pops([...cd], t + 0.35, 0.18, 698);

      c = byKind("project"); t = ARRIVE[4] - 0.1;
      tl.from(c.querySelectorAll(".up"), { y: 14, opacity: 0, duration: 0.3, stagger: 0.05 }, t);
      const pp = c.querySelectorAll(".pop");
      tl.from(pp, { scale: 0, duration: 0.35, ease: "back.out(2.5)", stagger: 0.1 }, t + 0.15);
      pops([...pp], t + 0.15, 0.1, 622);
      const counter = c.querySelector(".count"), num = { v: 0 };
      tl.fromTo(num, { v: 0 }, { v: 23534, duration: 0.9, ease: "power2.out", onUpdate: () => { counter.textContent = `+${Math.round(num.v).toLocaleString("en-US")}`; } }, t + 0.2);
      for (let i = 0; i < 12; i++) sfx.push({ t: t + 0.2 + 0.9 * (1 - Math.pow(1 - i / 12, 2)), type: "tick", f: 1500 + i * 70 });

      tl.addLabel("hold", ARRIVE[0] + 0.95);
      tl.set({}, {}, LOOP);

      if (reduce.matches) tl.pause(tl.labels.hold);
      else tl.time(keep % LOOP);
      applyCam();
      sound.replan();
    }

    reduce.addEventListener("change", () => {
      if (!tl) return;
      if (reduce.matches) tl.pause(tl.labels.hold);
      else tl.play();
    });

    // Sound: every sound is made with the Web Audio API. It is off until the
    // parent page (or ?sound=1 / ?sound=effects) turns it on, and it follows the
    // GSAP timeline clock. The effects come from the same list the timeline was
    // built from, so each whoosh rides its camera glide.
    const sound = (() => {
      const LEVEL = 1.1, MUSIC = 0.16;
      const BEAT = LOOP / 24; // 120 bpm: six bars fill one 12 s loop exactly
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      const clock = () => (tl && !tl.paused() ? tl.totalTime() : null);
      const loopLength = () => tl.duration();
      // Fmaj7, G, Em7, Am7, Fmaj7, Gsus4: a calm, hopeful corporate loop.
      const CHORDS = [[53, 57, 60, 64], [55, 59, 62, 67], [52, 55, 59, 62], [57, 60, 64, 67], [53, 57, 60, 64], [55, 60, 62, 67]];
      const ROOTS = [41, 43, 40, 45, 41, 43];
      let ctx = null, master, impulse, noiseBuf, session = null, fxBus, musicBus, verbSend;
      let wantOn = false, wantMusic = true, playing = false;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0;

      function plan() {
        const list = sfx.map((e) => ({ ...e, music: false }));
        const add = (t, type, extra = {}) => list.push({ t, type, music: true, ...extra });
        const ARP = [0, 2, 1, 3, 2, 1, 3, 2];
        CHORDS.forEach((notes, bar) => {
          const t0 = bar * 4 * BEAT;
          add(t0, "keys", { notes, dur: 4 * BEAT });
          add(t0, "pad", { notes, dur: 4 * BEAT });
          add(t0, "bass", { f: hz(ROOTS[bar]), dur: BEAT * 1.6 });
          add(t0 + 2.5 * BEAT, "bass", { f: hz(ROOTS[bar]), dur: BEAT * 0.4 });
          add(t0 + 3 * BEAT, "bass", { f: hz(ROOTS[bar] + 7), dur: BEAT * 0.8 });
          ARP.forEach((n, e) => add(t0 + (e * BEAT) / 2, "pluck", { f: hz(notes[n] + 12), v: e % 2 ? 0.6 : 0.9 }));
          for (let b = 0; b < 4; b++) {
            if (b % 2 === 0) add(t0 + b * BEAT, "kick", {});
            else add(t0 + b * BEAT, "snap", {});
            add(t0 + (b + 0.5) * BEAT, "hat", { v: 1 });
            add(t0 + b * BEAT, "hat", { v: 0.45 });
          }
        });
        return list.sort((a, b) => a.t - b.t);
      }
      let events = [];

      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);
        const len = Math.floor(ctx.sampleRate * 1.8);
        impulse = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = impulse.getChannelData(ch);
          for (let s = 0; s < len; s++) d[s] = (Math.random() * 2 - 1) * Math.pow(1 - s / len, 3);
        }
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const nd = noiseBuf.getChannelData(0);
        for (let s = 0; s < nd.length; s++) nd[s] = Math.random() * 2 - 1;
      }

      // Each time sound is turned on it gets fresh buses, so sounds queued before a
      // stop can never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.05);
        session.connect(master);
        fxBus = ctx.createGain();
        fxBus.connect(session);
        musicBus = ctx.createGain();
        musicBus.gain.value = wantMusic ? MUSIC : 0;
        musicBus.connect(session);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const tone = ctx.createBiquadFilter();
        tone.type = "lowpass";
        tone.frequency.value = 5000;
        const verbOut = ctx.createGain();
        verbOut.gain.value = 0.3;
        verbSend = ctx.createGain();
        verbSend.connect(verb).connect(tone).connect(verbOut).connect(session);
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.disconnect(), 250);
      }

      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function send(node, amount) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(verbSend);
      }
      function shape(when, points, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, when);
        for (const [dt, v] of points) g.gain.linearRampToValueAtTime(v, when + dt);
        g.connect(out);
        return g;
      }

      const voices = {
        tap(when, e) {
          // A slide landing on the table: a soft papery tap with a small low thud.
          const out = pan(e.p, fxBus);
          noise(when, 0.05).connect(filter("bandpass", 2200, 1.2)).connect(amp(when, 0.09 * e.v, 0.002, 0.04, out));
          const o = osc("sine", 180, when, 0.12);
          o.frequency.exponentialRampToValueAtTime(90, when + 0.1);
          o.connect(amp(when, 0.18 * e.v, 0.003, 0.1, out));
        },
        whoosh(when, e) {
          // Camera glide: filtered air that swells and pans with the move.
          const d = e.dur;
          const p = ctx.createStereoPanner();
          p.pan.setValueAtTime(e.p0, when);
          p.pan.linearRampToValueAtTime(e.p1, when + d);
          p.connect(fxBus);
          const g = shape(when, [[d * 0.55, 0.22 * e.v], [d + 0.15, 0]], p);
          const bp = filter("bandpass", 400, 1.1);
          bp.frequency.setValueAtTime(400, when);
          bp.frequency.exponentialRampToValueAtTime(1800, when + d * 0.55);
          bp.frequency.exponentialRampToValueAtTime(600, when + d + 0.15);
          noise(when, d + 0.2).connect(bp).connect(g);
          send(g, 0.3);
        },
        lift(when, e) {
          // The slides lift away: a light airy rise.
          const d = e.dur;
          const g = shape(when, [[d * 0.7, 0.14], [d + 0.2, 0]], fxBus);
          const bp = filter("bandpass", 800, 1.5);
          bp.frequency.setValueAtTime(800, when);
          bp.frequency.exponentialRampToValueAtTime(4000, when + d);
          noise(when, d + 0.25).connect(bp).connect(g);
          send(g, 0.5);
        },
        pop(when, e) {
          // A small rounded UI pop.
          const g = amp(when, 0.16, 0.003, 0.14, fxBus);
          const o = osc("sine", e.f * 1.7, when, 0.16);
          o.frequency.exponentialRampToValueAtTime(e.f, when + 0.06);
          o.connect(g);
          noise(when, 0.01).connect(filter("highpass", 4000)).connect(amp(when, 0.04, 0.001, 0.01, g));
          send(g, 0.3);
        },
        tick(when, e) {
          // One tick of the counter running up.
          const g = amp(when, 0.06, 0.001, 0.03, pan(-0.2, fxBus));
          osc("triangle", e.f, when, 0.04).connect(g);
        },
        swish(when, e) {
          // A line drawing across: a soft rising tone over a brush of air.
          const d = e.dur;
          const g = shape(when, [[0.05, 0.08], [d * 0.8, 0.07], [d + 0.1, 0]], fxBus);
          const o = osc("sine", e.f0, when, d + 0.1);
          o.frequency.exponentialRampToValueAtTime(e.f1, when + d);
          o.connect(g);
          const bp = filter("bandpass", 2400, 2);
          bp.frequency.setValueAtTime(1500, when);
          bp.frequency.exponentialRampToValueAtTime(4200, when + d);
          noise(when, d + 0.1).connect(bp).connect(shape(when, [[0.05, 0.9], [d, 0.6], [d + 0.1, 0]], g));
          send(g, 0.4);
        },
        chime(when) {
          // Arriving on the title slide: a soft bell chord.
          const out = fxBus;
          [76, 81, 88].forEach((m, i) => {
            const t = when + i * 0.04;
            const g = amp(t, 0.1, 0.003, 1.3, out);
            osc("sine", hz(m), t, 1.4).connect(g);
            osc("sine", hz(m) * 2.01, t, 0.5).connect(amp(t, 0.025, 0.002, 0.4, out));
            send(g, 0.6);
          });
        },
        keys(when, e) {
          // Soft electric piano chord on the downbeat.
          const g = amp(when, 0.22, 0.01, e.dur, musicBus);
          const lp = filter("lowpass", 1800);
          lp.connect(g);
          e.notes.forEach((m) => {
            osc("sine", hz(m), when, e.dur).connect(lp);
            osc("triangle", hz(m) * 2, when, 0.4).connect(amp(when, 0.08, 0.004, 0.35, lp));
          });
          send(g, 0.4);
        },
        pad(when, e) {
          // A warm pad under everything.
          const g = shape(when, [[0.6, 0.05], [e.dur - 0.2, 0.05], [e.dur + 0.3, 0]], musicBus);
          const lp = filter("lowpass", 900);
          lp.connect(g);
          e.notes.forEach((m) => [-6, 6].forEach((cents) => {
            const o = osc("sawtooth", hz(m), when, e.dur + 0.3);
            o.detune.value = cents;
            o.connect(lp);
          }));
          send(g, 0.6);
        },
        pluck(when, e) {
          const g = amp(when, 0.1 * e.v, 0.002, 0.22, musicBus);
          const lp = filter("lowpass", 2600);
          lp.frequency.exponentialRampToValueAtTime(700, when + 0.2);
          lp.connect(g);
          osc("triangle", e.f, when, 0.25).connect(lp);
          send(g, 0.35);
        },
        bass(when, e) {
          const g = amp(when, 0.34, 0.006, e.dur, musicBus);
          const lp = filter("lowpass", 500, 1);
          lp.connect(g);
          osc("triangle", e.f, when, e.dur + 0.02).connect(lp);
          osc("sine", e.f / 2, when, e.dur + 0.02).connect(amp(when, 0.5, 0.006, e.dur, lp));
        },
        kick(when) {
          const o = osc("sine", 120, when, 0.3);
          o.frequency.exponentialRampToValueAtTime(45, when + 0.18);
          o.connect(amp(when, 0.55, 0.003, 0.26, musicBus));
        },
        snap(when) {
          const g = ctx.createGain();
          g.connect(musicBus);
          noise(when, 0.1).connect(filter("bandpass", 1800, 1.4)).connect(amp(when, 0.22, 0.002, 0.08, g));
          send(g, 0.6);
        },
        hat(when, e) {
          noise(when, 0.05).connect(filter("highpass", 7500)).connect(amp(when, 0.07 * e.v, 0.002, 0.035, musicBus));
        },
      };

      // Look-ahead scheduler: every 25 ms, schedule sounds due in the next 100 ms.
      // Animation time is mapped to audio time by an anchor that is re-set after any jump
      // (a pause, a hidden tab, a restart), so missed sounds never pile up.
      function tick() {
        const now = playing && ctx.state === "running" && !document.hidden && !reduce.matches ? clock() : null;
        if (now === null) { anchor = null; return; }
        const loopLen = loopLength();
        const at = ctx.currentTime;
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.08) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          doneUpTo = now; // start fresh: nothing piles up
        }
        const cur = anchor.tl + (at - anchor.audio);
        const from = Math.max(doneUpTo, cur - 0.05); // after a stall, skip what is already late
        const to = cur + 0.1;
        if (to <= from) return;
        for (let n = Math.floor(from / loopLen); n <= Math.floor(to / loopLen); n++) {
          for (const e of events) {
            const t = n * loopLen + e.t;
            if (t < from || t >= to) continue;
            if (e.music && !wantMusic) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl)), e);
          }
        }
        doneUpTo = to;
      }

      function update() {
        const on = wantOn && !reduce.matches;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            openSession();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
          const t = ctx.currentTime;
          musicBus.gain.cancelScheduledValues(t);
          musicBus.gain.setTargetAtTime(wantMusic ? MUSIC : 0, t, 0.03);
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend(), 200);
        }
      }
      reduce.addEventListener("change", update);

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);

      addEventListener("message", (event) => {
        if (event.origin !== location.origin) return;
        const data = event.data;
        if (!data || data.type !== "motionprompt-sound") return;
        if (typeof data.on === "boolean") wantOn = data.on;
        if (typeof data.music === "boolean") wantMusic = data.music;
        update();
      });

      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantOn = true;
        wantMusic = fromUrl === "1";
        update();
      }
      return { replan() { events = plan(); } };
    })();

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(build, 150);
    });

    // Wait briefly for the font so the title is measured in the right face.
    Promise.race([
      Promise.all([document.fonts.load("600 1em Poppins"), document.fonts.load("700 1em Poppins")]),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(build);
  </script>
</body>
</html>
