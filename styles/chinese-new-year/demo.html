    // Small geometry helpers. Shapes are drawn in local units and scaled into place.
    const TAU = Math.PI * 2;
    const rad = (d) => (d * Math.PI) / 180;
    const n3 = (v) => +v.toFixed(3);
    const P = (p) => `${n3(p[0])} ${n3(p[1])}`;
    const polar = (r, deg, c = [0, 0]) => [c[0] + r * Math.cos(rad(deg)), c[1] + r * Math.sin(rad(deg))];
    const circle = (x, y, r) => `M${P([x - r, y])}a${n3(r)} ${n3(r)} 0 1 0 ${n3(r * 2)} 0a${n3(r)} ${n3(r)} 0 1 0 ${n3(-r * 2)} 0Z`;
    // A teardrop from (x, y), pointing along deg.
    const drop = (x, y, len, deg, w = 0.35) =>
      `M${P([x, y])}` + [[0.3, -w], [0.8, -w * 0.6], [1, 0], [0.8, w * 0.6], [0.3, w], [0, 0]]
        .map((q, i) => (i % 3 === 0 ? "C" : "") + P(polar(Math.hypot(q[0], q[1]) * len, deg + (Math.atan2(q[1], q[0]) * 180) / Math.PI, [x, y])) + " ")
        .join("") + "Z";
    // A scalloped edge between two angles: the radius swings from r0 up to r1 on every bump.
    function scallop(r0, r1, a0, a1, bumps, steps = 10) {
      const pts = [];
      for (let i = 0; i <= bumps * steps; i++) {
        const k = i / (bumps * steps);
        pts.push(polar(r0 + (r1 - r0) * Math.sin(Math.PI * ((k * bumps) % 1 || (i ? 1 : 0))), a0 + (a1 - a0) * k));
      }
      return pts;
    }
    const poly = (pts) => pts.map((p, i) => (i ? "L" : "M") + P(p)).join("");
    // A spiral cut, like the curl of a cloud scroll.
    function spiral(c, r0, turns, a0, dir = 1) {
      const pts = [];
      for (let i = 0; i <= 28; i++) {
        const k = i / 28;
        pts.push(polar(r0 * (1 - 0.8 * k), a0 + dir * k * turns * 360, c));
      }
      return poly(pts);
    }

    // A loop is 12 seconds; every sway repeats a whole number of times per loop.
    const LOOP = 12, STILL = 7.7;
    const wave = (t, cycles, phase = 0) => Math.sin(TAU * (t * cycles) / LOOP + phase);
    const clamp = (v) => Math.max(0, Math.min(1, v));

    let W, H, u, tl, S, R, defs;

    // Where everything goes for tall, square-ish and wide windows.
    function layout() {
      const r = W / H, L = {};
      if (r < 0.75) {
        L.R = Math.min(W * 0.3, H * 0.165);
        L.titleW = W * 0.88;
        L.fsMax = W * 0.15;
        L.cy = H * 0.45;
        L.corner = W * 0.32;
        L.lanterns = [{ x: W * 0.13, len: H * 0.045, w: W * 0.19 }, { x: W * 0.87, len: H * 0.045, w: W * 0.19 }];
        L.pile = { x: W * 0.76, y: H * 0.97, s: W * 0.07 };
        L.branch = { x: 0, y: H * 0.955, s: W * 0.52 };
      } else if (r < 1.3) {
        L.R = u * 0.16;
        L.titleW = W * 0.8;
        L.fsMax = u * 0.115;
        L.cy = H * 0.455;
        L.corner = u * 0.27;
        L.lanterns = [{ x: W * 0.1, len: H * 0.03, w: u * 0.14 }, { x: W * 0.9, len: H * 0.03, w: u * 0.14 }];
        L.pile = { x: W - u * 0.13, y: H - u * 0.025, s: u * 0.046 };
        L.branch = { x: 0, y: H - u * 0.025, s: u * 0.34 };
      } else {
        L.R = H * 0.19;
        L.titleW = W * 0.6;
        L.fsMax = H * 0.14;
        L.cy = H * 0.5;
        L.corner = H * 0.34;
        L.lanterns = [
          { x: W * 0.11, len: H * 0.06, w: H * 0.2 }, { x: W * 0.89, len: H * 0.06, w: H * 0.2 },
          { x: W * 0.22, len: H * 0.0, w: H * 0.13 }, { x: W * 0.78, len: H * 0.0, w: H * 0.13 },
        ];
        L.pile = { x: W - H * 0.28, y: H * 0.965, s: H * 0.07 };
        L.branch = { x: 0, y: H * 0.96, s: H * 0.52 };
      }
      return L;
    }

    // ---------- Paper-cut pieces are painted once into bitmaps, so they stay light ----------
    // paper is the sheet, holes are cut out as shapes, lines are cut out as thin strokes.
    // box is [x, y, w, h] in local units and px is the size of one local unit on screen.
    function paperBitmap({ paper, holes, lines, lw, box, px, copies = 1, shadow = 0 }) {
      const k = px * Math.min(2, devicePixelRatio || 1);
      const c = document.createElement("canvas");
      c.width = Math.max(2, Math.ceil(box[2] * k));
      c.height = Math.max(2, Math.ceil(box[3] * k));
      const g = c.getContext("2d");
      const sheet = document.createElement("canvas");
      sheet.width = c.width;
      sheet.height = c.height;
      const sg = sheet.getContext("2d");
      for (let i = 0; i < copies; i++) {
        const part = document.createElement("canvas");
        part.width = c.width;
        part.height = c.height;
        const pg = part.getContext("2d");
        pg.setTransform(k, 0, 0, k, -box[0] * k, -box[1] * k);
        pg.rotate((i * TAU) / copies);
        pg.fillStyle = C.paper;
        pg.fill(new Path2D(paper));
        pg.globalCompositeOperation = "destination-out";
        pg.fill(new Path2D(holes));
        pg.lineWidth = lw;
        pg.lineCap = "round";
        pg.stroke(new Path2D(lines));
        sg.drawImage(part, 0, 0);
      }
      // A soft shadow under the sheet, so it looks lifted off the background.
      if (shadow) {
        g.shadowColor = "rgba(40, 0, 6, 0.55)";
        g.shadowBlur = shadow * k;
        g.shadowOffsetY = shadow * k * 0.4;
      }
      g.drawImage(sheet, 0, 0);
      return c.toDataURL();
    }

    // ---------- Paper-cut corner: a fan of red paper with a lacy cut pattern ----------
    function cornerArt(px) {
      let holes = "";
      for (let i = 0; i < 7; i++) holes += circle(...polar(0.86, (i + 0.5) * (90 / 7)), 0.035);
      [13, 34, 56, 77].forEach((a) => (holes += drop(...polar(0.5, a), 0.21, a, 0.32)));
      [22, 68].forEach((a) => (holes += circle(...polar(0.3, a), 0.025)));
      const lines = `M${P(polar(0.77, 5))}A0.77 0.77 0 0 1 ${P(polar(0.77, 85))}` +
        `M${P(polar(0.44, 6))}A0.44 0.44 0 0 1 ${P(polar(0.44, 84))}` + spiral(polar(0.26, 45), 0.1, 1.4, 225, 1);
      const paper = `M0 0${poly(scallop(0.9, 1, 0, 90, 7)).replace("M", "L")}Z`;
      return paperBitmap({ paper, holes, lines, lw: 0.026, box: [-0.06, -0.06, 1.16, 1.16], px, shadow: 0.02 });
    }

    function buildCorner(parent, x, y, sx, sy, size, href, id) {
      const g = el("g", {}, parent);
      const clip = el("clipPath", { id, clipPathUnits: "userSpaceOnUse" }, defs);
      const reveal = el("circle", { r: 0 }, clip);
      const inner = el("g", { "clip-path": `url(#${id})` }, g);
      el("image", { href, x: -0.06, y: -0.06, width: 1.16, height: 1.16 }, inner);
      el("path", { d: `M${P(polar(0.955, 3))}A0.955 0.955 0 0 1 ${P(polar(0.955, 87))}`, fill: "none", stroke: C.gold, "stroke-width": 0.008, opacity: 0.7 }, inner);
      return { g, reveal, x, y, sx, sy, size };
    }

    // ---------- The paper-cut medallion: eight folded wedges that fan open ----------
    function buildMedallion(parent, R0) {
      const half = 22.5;
      const paper = `M0 0${poly(scallop(0.9, 1, -90 - half - 0.4, -90 + half + 0.4, 2)).replace("M", "L")}Z`;
      const holes = drop(0, -0.46, 0.36, -90, 0.3) + drop(...polar(0.5, -103), 0.2, -114, 0.32) + drop(...polar(0.5, -77), 0.2, -66, 0.32) +
        circle(...polar(0.83, -101.25), 0.032) + circle(...polar(0.83, -78.75), 0.032) + circle(...polar(0.24, -90), 0.024);
      const lines = `M${P(polar(0.34, -104))}A0.34 0.34 0 0 1 ${P(polar(0.34, -76))}`;
      const box = [-1.1, -1.1, 2.2, 2.2];
      // One loose wedge for the unfolding, and the whole open sheet with its shadow.
      const wedgeHref = paperBitmap({ paper, holes, lines, lw: 0.03, box, px: R0 });
      const fullHref = paperBitmap({ paper, holes, lines, lw: 0.03, box, px: R0, copies: 8, shadow: 0.014 });

      const g = el("g", {}, parent);
      const ring = el("g", { fill: "none", stroke: C.gold }, g);
      el("circle", { r: 1.07, "stroke-width": 0.012 }, ring);
      let dots = "";
      for (let i = 0; i < 48; i++) dots += circle(...polar(1.13, i * 7.5), 0.012);
      el("path", { d: dots, fill: C.gold, stroke: "none" }, ring);
      // Once open, the sheet sits on a gold backing, so the cut-outs shine through.
      const backing = el("circle", { r: 0.895, fill: "url(#cny-coin)" }, g);
      const img = (href) => el("image", { href, x: box[0], y: box[1], width: box[2], height: box[3] }, g);
      const wedges = Array.from({ length: 8 }, () => img(wedgeHref));
      const full = img(fullHref);
      // A gold rosette in the middle, seen before the fu diamond lands.
      let ros = "";
      for (let i = 0; i < 8; i++) ros += drop(0, 0, 0.16, i * 45, 0.4);
      el("path", { d: ros + circle(0, 0, 0.05), fill: C.gold }, g);
      return { g, ring, wedges, full, backing };
    }

    // ---------- Fu on a red diamond ----------
    function buildFu(parent, D) {
      const g = el("g", {}, parent);
      const a = D / Math.SQRT2;
      const sq = (s) => `M0 ${n3(-s / Math.SQRT2)}L${n3(s / Math.SQRT2)} 0L0 ${n3(s / Math.SQRT2)}L${n3(-s / Math.SQRT2)} 0Z`;
      el("path", { d: sq(a * 1.02), fill: C.shade, opacity: 0.35, transform: `translate(${n3(D * 0.02)} ${n3(D * 0.03)})` }, g);
      el("path", { d: sq(a), fill: "url(#cny-fu)", stroke: C.gold, "stroke-width": D * 0.025 }, g);
      el("path", { d: sq(a * 0.86), fill: "none", stroke: C.gold, "stroke-width": D * 0.008, opacity: 0.8 }, g);
      const glyph = el("path", { d: GLYPHS["福"], fill: C.gold }, g);
      const bb = glyph.getBBox(), s = (D * 0.5) / Math.max(bb.width, bb.height);
      glyph.setAttribute("transform", `scale(${n3(s)}) translate(${n3(-bb.x - bb.width / 2)} ${n3(-bb.y - bb.height / 2)})`);
      return g;
    }

    // ---------- Round red lantern with a gold tassel ----------
    function buildLantern(parent, lan) {
      const outer = el("g", {}, parent);
      const g = el("g", {}, outer);
      const ls = lan.len / lan.w + 0.12;
      el("circle", { cx: 0, cy: ls + 0.5, r: 0.95, fill: "url(#cny-glow)", opacity: 0.55 }, g);
      el("path", { d: `M0 ${n3(-ls - 2)}V${n3(ls + 0.02)}`, stroke: C.goldDeep, "stroke-width": 0.02 }, g);
      el("rect", { x: -0.19, y: ls, width: 0.38, height: 0.09, rx: 0.03, fill: C.gold }, g);
      el("ellipse", { cx: 0, cy: ls + 0.5, rx: 0.5, ry: 0.42, fill: "url(#cny-lan)" }, g);
      const ribs = el("g", { fill: "none", stroke: "#7a0812", "stroke-width": 0.014, opacity: 0.55 }, g);
      for (const rx of [0.13, 0.3]) el("ellipse", { cx: 0, cy: ls + 0.5, rx, ry: 0.42 }, ribs);
      el("path", { d: `M0 ${n3(ls + 0.08)}V${n3(ls + 0.92)}` }, ribs);
      el("ellipse", { cx: 0, cy: ls + 0.5, rx: 0.5, ry: 0.07, fill: "none", stroke: C.gold, "stroke-width": 0.02, opacity: 0.8 }, g);
      el("ellipse", { cx: -0.18, cy: ls + 0.32, rx: 0.14, ry: 0.07, fill: "#ffd0b0", opacity: 0.35, transform: `rotate(-25 -0.18 ${n3(ls + 0.32)})` }, g);
      el("rect", { x: -0.15, y: ls + 0.86, width: 0.3, height: 0.08, rx: 0.03, fill: C.gold }, g);
      const tassel = el("g", {}, g);
      const ty = ls + 0.94;
      el("path", { d: `M0 0V0.12`, stroke: C.gold, "stroke-width": 0.022 }, tassel);
      el("path", { d: "M0 0.08L0.05 0.13L0 0.18L-0.05 0.13Z", fill: C.gold }, tassel);
      el("path", { d: "M-0.035 0.18H0.035L0.075 0.56Q0 0.6 -0.075 0.56Z", fill: C.gold }, tassel);
      el("path", { d: "M-0.02 0.22L-0.04 0.55M0 0.22V0.57M0.02 0.22L0.04 0.55", stroke: C.goldDeep, "stroke-width": 0.01 }, tassel);
      el("rect", { x: -0.045, y: 0.19, width: 0.09, height: 0.035, fill: C.paper }, tassel);
      return { outer, g, tassel, ty, lan };
    }

    // ---------- Coins and mandarin oranges ----------
    function buildCoin(parent) {
      const g = el("g", {}, parent);
      el("path", { d: circle(0, 0, 1) + "M-0.2 -0.2H0.2V0.2H-0.2Z", fill: "url(#cny-coin)", "fill-rule": "evenodd", stroke: C.goldDeep, "stroke-width": 0.05 }, g);
      el("circle", { r: 0.74, fill: "none", stroke: C.goldDeep, "stroke-width": 0.05 }, g);
      el("path", { d: "M-0.08 -0.52h0.16v0.16h-0.16ZM-0.08 0.36h0.16v0.16h-0.16ZM-0.52 -0.08h0.16v0.16h-0.16ZM0.36 -0.08h0.16v0.16h-0.16Z", fill: C.goldDeep }, g);
      return g;
    }
    function buildOrange(parent) {
      const g = el("g", {}, parent);
      el("ellipse", { cx: 0, cy: 0, rx: 1, ry: 0.93, fill: "url(#cny-orange)" }, g);
      el("ellipse", { cx: -0.35, cy: -0.4, rx: 0.22, ry: 0.12, fill: "#fff3d6", opacity: 0.45, transform: "rotate(-30 -0.35 -0.4)" }, g);
      el("path", { d: "M0 -0.9Q0.03 -1.05 0.1 -1.12", stroke: C.branch, "stroke-width": 0.07, fill: "none", "stroke-linecap": "round" }, g);
      el("path", { d: drop(0.05, -0.95, 0.62, -20, 0.36) + drop(0.02, -0.95, 0.45, -150, 0.36), fill: C.leaf }, g);
      el("path", { d: `M0.1 -0.98L${P(polar(0.5, -20, [0.05, -0.95]))}`, stroke: "#1f5a32", "stroke-width": 0.025 }, g);
      return g;
    }

    // ---------- Plum blossom branch ----------
    function buildBranch(parent, B) {
      const g = el("g", { transform: `translate(${n3(B.x)} ${n3(B.y)}) scale(${n3(B.s)})` }, parent);
      const strokes = [
        { d: "M-0.05 0.02C0.2 0 0.35 -0.08 0.5 -0.2S0.78 -0.36 0.98 -0.44", w: 0.034 },
        { d: "M0.42 -0.14C0.44 -0.26 0.52 -0.36 0.6 -0.52", w: 0.018 },
        { d: "M0.72 -0.34C0.8 -0.3 0.9 -0.26 1.02 -0.28", w: 0.016 },
        { d: "M0.18 -0.03C0.24 -0.1 0.26 -0.18 0.24 -0.26", w: 0.014 },
      ];
      const lines = strokes.map((s) => el("path", { d: s.d, fill: "none", stroke: C.branch, "stroke-width": s.w, "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1 }, g));
      const spots = [
        [0.98, -0.44, 0.07, 0], [0.6, -0.52, 0.065, 30], [1.02, -0.28, 0.06, 60], [0.5, -0.2, 0.075, 15],
        [0.24, -0.26, 0.055, 45], [0.78, -0.37, 0.05, 20], [0.35, -0.1, 0.05, 70], [0.88, -0.29, 0.04, 10],
      ];
      const blossoms = spots.map(([x, y, s, a], i) => {
        const o = el("g", { transform: `translate(${x} ${y})` }, g);
        const inner = el("g", {}, o);
        if (i === 7 || i === 6) {
          el("circle", { r: s * 0.55, fill: C.petalDeep }, inner);
          return { g: inner, s };
        }
        let petals = "";
        for (let k = 0; k < 5; k++) petals += circle(...polar(s * 0.5, a + k * 72), s * 0.5);
        el("path", { d: petals, fill: "url(#cny-petal)" }, inner);
        el("circle", { r: s * 0.3, fill: C.petalDeep }, inner);
        let st = "", dt = "";
        for (let k = 0; k < 7; k++) {
          const p = polar(s * 0.52, a + k * 51 + 20);
          st += `M0 0L${P(p)}`;
          dt += circle(...p, s * 0.07);
        }
        el("path", { d: st, stroke: "#b8325a", "stroke-width": s * 0.04 }, inner);
        el("path", { d: dt, fill: C.gold }, inner);
        return { g: inner, s };
      });
      return { g, lines, blossoms };
    }

    // ---------- Build the whole scene and its timeline ----------
    function build() {
      W = innerWidth;
      H = innerHeight;
      u = Math.min(W, H);
      svg.replaceChildren();
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      defs = el("defs", {}, svg);
      const L = layout();

      const grad = (tag, id, attrs, stops) => {
        const g = el(tag, { id, ...attrs }, defs);
        stops.forEach(([o, c, a = 1]) => el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, g));
        return g;
      };
      grad("radialGradient", "cny-bg", { cx: 0.5, cy: 0.45, r: 0.75 }, [[0, "#c4212b"], [0.55, C.bg], [1, "#4c030b"]]);
      grad("radialGradient", "cny-lan", { fx: 0.38, fy: 0.32 }, [[0, "#ff7a55"], [0.45, "#e2262c"], [1, "#8f0a16"]]);
      grad("radialGradient", "cny-glow", {}, [[0, "#ffb347", 0.8], [0.45, "#ff8a3d", 0.3], [1, "#ff8a3d", 0]]);
      grad("radialGradient", "cny-coin", { fx: 0.35, fy: 0.3 }, [[0, C.goldLight], [0.5, C.gold], [1, C.goldDeep]]);
      grad("radialGradient", "cny-orange", { fx: 0.35, fy: 0.3 }, [[0, "#ffc766"], [0.55, C.orange], [1, "#c9570a"]]);
      grad("radialGradient", "cny-petal", { gradientUnits: "userSpaceOnUse", r: 0.07 }, [[0, "#fff4f7"], [0.6, C.petal], [1, "#f6a7bb"]]);
      grad("linearGradient", "cny-fu", { x1: 0, y1: 0, x2: 0, y2: 1 }, [[0, "#e8343a"], [1, "#a90f1c"]]);

      // Background: deep red with a faint gold coin lattice.
      el("rect", { width: W, height: H, fill: "url(#cny-bg)" }, svg);
      const cell = u * 0.09;
      const pat = el("pattern", { id: "cny-lattice", width: cell, height: cell, patternUnits: "userSpaceOnUse" }, defs);
      el("path", { d: circle(0, 0, cell / 2) + circle(cell, 0, cell / 2) + circle(0, cell, cell / 2) + circle(cell, cell, cell / 2) + circle(cell / 2, cell / 2, cell / 2), fill: "none", stroke: C.gold, "stroke-width": Math.max(0.6, u * 0.0016) }, pat);
      el("rect", { width: W, height: H, fill: "url(#cny-lattice)", opacity: 0.07 }, svg);

      // Stack in the middle: medallion with the fu diamond, title, characters and small line.
      const title0 = el("text", { class: "title", "font-size": 100 }, svg);
      const widthOf = (s) => { title0.textContent = s; return title0.getComputedTextLength() / 100; };
      const words = title.split(/\s+/).filter(Boolean);
      let lines = [words];
      let fs = Math.min(L.fsMax, L.titleW / widthOf(title));
      if (fs < L.fsMax * 0.62 && words.length > 1) {
        let best = null;
        for (let i = 1; i < words.length; i++) {
          const pair = [words.slice(0, i), words.slice(i)];
          const w = Math.max(...pair.map((p) => widthOf(p.join(" "))));
          if (!best || w < best.w) best = { pair, w };
        }
        lines = best.pair;
        fs = Math.min(L.fsMax * 0.85, L.titleW / best.w);
      }
      title0.remove();
      const stackOf = (f) => L.R * 2.26 + f * (0.28 + lines.length * 1.05 + 0.17 + 0.42 + 0.17 + (subtitle ? 0.24 : 0));
      // A long title on two lines makes the stack tall: shrink it all to fit.
      const fit = Math.min(1, (H * (W / H < 1.3 ? 0.8 : 0.74)) / stackOf(fs));
      L.R *= fit;
      fs *= fit;
      const cjkH = fs * 0.42, subFs = Math.max(7, fs * 0.2);
      const gap = fs * 0.28;
      const stackH = stackOf(fs);
      const top = L.cy - stackH / 2;
      const medY = top + L.R * 1.13;
      let y = top + L.R * 2.26 + gap;
      const lineY = lines.map(() => { const v = y + fs * 0.5; y += fs * 1.05; return v; });
      y += gap * 0.6;
      const cjkY = y + cjkH / 2;
      y += cjkH + gap * 0.6;
      const subY = y + subFs * 0.6;

      // Corners, lanterns, branch and the pile sit around the stack.
      const cornerHref = cornerArt(L.corner);
      const corners = [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]].map(([x, y2, sx, sy], i) => buildCorner(svg, x, y2, sx, sy, L.corner, cornerHref, `cny-clip${i}`));

      const glow = el("circle", { cx: W / 2, cy: medY, r: L.R * 2.2, fill: "url(#cny-glow)" }, svg);
      const med = buildMedallion(svg, L.R);
      const fuWrap = el("g", {}, svg);
      const fu = buildFu(fuWrap, L.R * 1.12);

      const branch = buildBranch(svg, L.branch);

      // Title words, each with a dark copy under it for depth.
      const gold = el("linearGradient", { id: "cny-gold", gradientUnits: "userSpaceOnUse", x1: W / 2 - L.titleW / 2, y1: 0, x2: W / 2 + L.titleW / 2, y2: fs }, defs);
      [[0, C.gold], [0.42, C.gold], [0.5, C.goldLight], [0.58, C.gold], [1, C.gold]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, gold));
      const measure = el("text", { class: "title", "font-size": fs }, svg);
      const wordEls = [];
      lines.forEach((ws, li) => {
        measure.textContent = ws.join(" ");
        const total = measure.getComputedTextLength();
        measure.textContent = " ";
        const space = measure.getComputedTextLength() || fs * 0.25;
        let x = W / 2 - total / 2;
        ws.forEach((w) => {
          measure.textContent = w;
          const ww = measure.getComputedTextLength();
          const g = el("g", {}, svg);
          const tx = { class: "title", "font-size": fs, x: n3(x + ww / 2), y: n3(lineY[li]) };
          el("text", { ...tx, fill: C.shade, opacity: 0.55, transform: `translate(${n3(fs * 0.025)} ${n3(fs * 0.04)})` }, g).textContent = w;
          el("text", { ...tx, fill: "url(#cny-gold)" }, g).textContent = w;
          wordEls.push({ g, x: x + ww / 2, y: lineY[li] });
          x += ww + space;
        });
      });
      measure.remove();

      // Characters 新年快乐 in brush strokes, with gold rules either side.
      const cjk = el("g", {}, svg);
      const glyphs = [..."新年快乐"].map((ch, i) => {
        const o = el("g", { transform: `translate(${n3(W / 2 + (i - 1.5) * cjkH * 1.12)} ${n3(cjkY)})` }, cjk);
        const inner = el("g", {}, o);
        el("path", { d: GLYPHS[ch], fill: C.gold, transform: `scale(${n3(cjkH / 1000)}) translate(-500 -470)` }, inner);
        return inner;
      });
      const ruleW = Math.min(cjkH * 2.2, (W - cjkH * 4.6) / 2 - u * 0.05);
      const rules = [-1, 1].map((side) => {
        const x0 = W / 2 + side * cjkH * 2.45;
        const g = el("g", { transform: `translate(${n3(x0)} ${n3(cjkY)}) scale(${side} 1)` }, cjk);
        const inner = el("g", {}, g);
        el("path", { d: `M0 0H${n3(ruleW)}`, stroke: C.gold, "stroke-width": Math.max(1, cjkH * 0.05) }, inner);
        el("path", { d: `M${n3(ruleW)} ${n3(-cjkH * 0.1)}l${n3(cjkH * 0.1)} ${n3(cjkH * 0.1)}l${n3(-cjkH * 0.1)} ${n3(cjkH * 0.1)}l${n3(-cjkH * 0.1)} ${n3(-cjkH * 0.1)}Z`, fill: C.gold }, inner);
        return inner;
      });
      let sub = null;
      if (subtitle) {
        sub = el("text", { class: "sub", "font-size": subFs, x: W / 2, y: n3(subY), fill: C.ink, "letter-spacing": `${n3(subFs * 0.22)}px` }, svg);
        sub.textContent = subtitle;
        const sw = sub.getComputedTextLength();
        if (sw > W * 0.9) sub.setAttribute("font-size", n3((subFs * W * 0.9) / sw));
      }

      // Oranges and coins, back to front.
      const pileG = el("g", { transform: `translate(${n3(L.pile.x)} ${n3(L.pile.y)}) scale(${n3(L.pile.s)})` }, svg);
      const pile = [
        { k: "o", x: -1.05, y: -1.95, s: 0.95 }, { k: "c", x: 1.6, y: -0.85, s: 0.8 }, { k: "o", x: 0.55, y: -0.95, s: 1 },
        { k: "o", x: -1.55, y: -0.9, s: 0.98 }, { k: "c", x: -0.35, y: -0.62, s: 0.66 }, { k: "c", x: 2.25, y: -0.5, s: 0.52 },
      ].map((p) => {
        const o = el("g", { transform: `translate(${p.x} ${p.y}) scale(${p.s})` }, pileG);
        const inner = el("g", {}, o);
        (p.k === "o" ? buildOrange : buildCoin)(inner);
        return { ...p, inner };
      });

      // Lanterns hang in front of everything but the sparks.
      const lanterns = L.lanterns.map((lan) => buildLantern(svg, lan));

      // Gold confetti, drifting down.
      const confG = el("g", {}, svg);
      const conf = [];
      for (let i = 0; i < 34; i++) {
        const c = el("rect", { x: -0.5, y: -0.5, width: 1, height: i % 3 ? 1.7 : 1, rx: i % 3 ? 0.15 : 0.5, fill: [C.gold, C.goldLight, "#ff8a6a", C.gold][i % 4] }, confG);
        const f = (a, b) => { const v = Math.sin(i * a + b) * 43758.5453; return v - Math.floor(v); };
        conf.push({ c, x: f(12.9, 1.3), p: f(78.2, 4.1), sp: 1 + (i % 2), sway: 1 + (i % 3), s: u * (0.009 + f(3.1, 2) * 0.008), spin: 2 + (i % 4) });
      }

      // Firecracker sparks: soft gold bursts that bloom and fade.
      const sparkG = el("g", {}, svg);
      const burstPos = W / H < 0.75
        ? [[0.5, 0.11], [0.19, 0.27], [0.8, 0.25], [0.24, 0.8]]
        : W / H < 1.3 ? [[0.2, 0.38], [0.8, 0.3], [0.22, 0.26], [0.79, 0.4]] : [[0.31, 0.32], [0.69, 0.27], [0.1, 0.52], [0.9, 0.5]];
      const bursts = [4.5, 6.0, 8.2, 9.3].map((t0, b) => {
        const g = el("g", {}, sparkG);
        const parts = [];
        for (let i = 0; i < 16; i++) {
          const a = (i / 16) * TAU + b, sp = 0.7 + ((i * 7) % 5) / 10;
          parts.push({ c: el("circle", { r: u * (0.006 + (i % 3) * 0.002), fill: [C.goldLight, C.gold, "#ffb35c"][i % 3] }, g), a, sp });
        }
        return { g, t0, x: burstPos[b][0] * W, y: burstPos[b][1] * H, parts };
      });

      S = {
        corner: corners.map(() => ({ s: 0, r: -30, c: 0 })),
        lan: lanterns.map(() => ({ y: 1, kick: 0 })),
        med: { s: 0, k: 0, o: 1 },
        fu: { s: 0, r: -120 },
        blos: branch.blossoms.map(() => ({ s: 0 })),
        words: wordEls.map(() => ({ o: 0, y: 1 })),
        glyphs: glyphs.map(() => ({ s: 0 })),
        rules: { s: 0 },
        sub: { o: 0 },
        pile: pile.map(() => ({ y: -1, r: 0 })),
        conf: { o: 0 },
        glow: { o: 0 },
      };
      R = { L, corners, lanterns, med, medY, fu, fuWrap, branch, wordEls, glyphs, rules, sub, pile, conf, bursts, glow, gold, cjk, confG, dashed: branch.lines };

      tl = gsap.timeline({ repeat: -1, onUpdate: update });
      tl.set({}, {}, LOOP);
      // 1. Lanterns drop in and swing; paper corners fan open and get cut.
      S.lan.forEach((l, i) => {
        tl.fromTo(l, { y: 1 }, { y: 0, duration: 1.1, ease: "back.out(1.3)" }, 0.1 + i * 0.18)
          .fromTo(l, { kick: 14 * (i % 2 ? -1 : 1) }, { kick: 0, duration: 3, ease: "sine.out" }, 0.4 + i * 0.18)
          .to(l, { y: 1, duration: 0.7, ease: "power2.in" }, 10.9 + i * 0.1);
      });
      S.corner.forEach((c, i) => {
        tl.fromTo(c, { s: 0, r: -40 }, { s: 1, r: 0, duration: 0.8, ease: "back.out(1.5)" }, 0.3 + i * 0.12)
          .to(c, { s: 0, r: -40, duration: 0.5, ease: "power2.in" }, 10.8 + i * 0.08);
      });
      // The pattern is cut out along a sweeping arc from the corner.
      S.corner.forEach((c, i) => tl.fromTo(c, { c: 0 }, { c: 1.12, duration: 1.1, ease: "power1.inOut" }, 0.35 + i * 0.12));
      // 2. The medallion unfolds, the fu diamond spins in, the plum branch grows and blooms.
      tl.fromTo(S.med, { s: 0.3 }, { s: 1, duration: 0.9, ease: "back.out(1.4)" }, 1.0)
        .fromTo(S.med, { k: 0 }, { k: 1, duration: 1.2, ease: "power2.inOut" }, 1.2)
        .fromTo(S.glow, { o: 0 }, { o: 1, duration: 1.2, ease: "sine.out" }, 1.4)
        .fromTo(S.fu, { s: 0, r: -120 }, { s: 1, r: 0, duration: 0.9, ease: "back.out(1.6)" }, 2.2);
      branch.lines.forEach((p, i) => tl.fromTo(p, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: i ? 0.6 : 1.1, ease: "sine.inOut" }, i ? 2.2 + i * 0.12 : 1.6));
      S.blos.forEach((b, i) => tl.fromTo(b, { s: 0 }, { s: 1, duration: 0.5, ease: "back.out(2.2)" }, 2.6 + i * 0.12).to(b, { s: 0, duration: 0.3, ease: "power2.in" }, 10.1 + i * 0.04));
      // 3. Title words rise, then the characters and the small line.
      tl.fromTo(S.words, { o: 0, y: 1 }, { o: 1, y: 0, duration: 0.8, ease: "power3.out", stagger: 0.14 }, 3.0)
        .fromTo(S.glyphs, { s: 0 }, { s: 1, duration: 0.5, ease: "back.out(2)", stagger: 0.1 }, 3.6)
        .fromTo(S.rules, { s: 0 }, { s: 1, duration: 0.7, ease: "power2.out" }, 3.9)
        .fromTo(S.sub, { o: 0 }, { o: 1, duration: 0.7, ease: "sine.out" }, 4.1);
      // 4. Coins and oranges bounce in; confetti starts.
      S.pile.forEach((p, i) => {
        tl.fromTo(p, { y: -1, r: (i % 2 ? 1 : -1) * 90 }, { y: 0, r: 0, duration: 1, ease: "bounce.out" }, 3.4 + [0.3, 0.45, 0.15, 0, 0.6, 0.72][i])
          .to(p, { y: 1, duration: 0.5, ease: "power2.in" }, 10.1 + i * 0.06);
      });
      tl.fromTo(S.conf, { o: 0 }, { o: 1, duration: 0.8, ease: "sine.out" }, 3.4).to(S.conf, { o: 0, duration: 0.8, ease: "sine.in" }, 10.0);
      // 5. Everything folds away, ready to loop.
      tl.to(S.sub, { o: 0, duration: 0.4 }, 9.9)
        .to(S.rules, { s: 0, duration: 0.4 }, 9.9)
        .to(S.glyphs, { s: 0, duration: 0.3, ease: "power2.in", stagger: 0.05 }, 9.95)
        .to(S.words, { o: 0, y: -0.6, duration: 0.5, ease: "power2.in", stagger: 0.06 }, 10.0)
        .to(S.fu, { s: 0, r: 120, duration: 0.5, ease: "back.in(1.6)" }, 10.3)
        .to(S.med, { k: 0, duration: 0.6, ease: "power2.inOut" }, 10.5)
        .to(S.med, { s: 0, duration: 0.4, ease: "back.in(1.5)" }, 10.95)
        .to(S.glow, { o: 0, duration: 0.8 }, 10.5);
      branch.lines.forEach((p, i) => tl.to(p, { attr: { "stroke-dashoffset": 1 }, duration: 0.5, ease: "sine.in" }, 10.4 - i * 0.05));
    }

    // Per-frame work: sways, confetti, sparks and the gold glint.
    // Only touch the DOM when a value really changes, so still parts are not redrawn.
    const set = (node, name, v) => {
      const key = "_" + name;
      if (node[key] !== v) { node[key] = v; node.setAttribute(name, v); }
    };

    function update() {
      const t = tl.time();
      const { L, corners, lanterns, med, medY, fu, fuWrap, branch, wordEls, glyphs, rules, sub, pile, conf, bursts, glow, gold } = R;
      const show = (g, on) => set(g, "display", on ? "inline" : "none");

      corners.forEach((c, i) => {
        const s = S.corner[i].s;
        show(c.g, s > 0.001);
        set(c.reveal, "r", n3(S.corner[i].c));
        set(c.g, "transform", `translate(${n3(c.x)} ${n3(c.y)}) scale(${n3(c.sx * c.size * Math.max(0.001, s))} ${n3(c.sy * c.size * Math.max(0.001, s))}) rotate(${n3(S.corner[i].r * (1 - s))})`);
      });

      lanterns.forEach((l, i) => {
        const st = S.lan[i], lan = l.lan;
        const a = st.kick * Math.cos(TAU * t * 0.9 + i) + 3 * wave(t, 5, i * 1.7);
        const drop = st.y * (lan.len + lan.w * 1.8);
        show(l.outer, st.y < 0.999);
        set(l.outer, "transform", `translate(${n3(lan.x)} ${n3(-drop)}) rotate(${n3(a)}) scale(${n3(lan.w)})`);
        set(l.tassel, "transform", `translate(0 ${n3(l.ty)}) rotate(${n3(-a * 0.6 + 5 * wave(t, 7, i))})`);
      });

      show(med.g, S.med.s > 0.01);
      set(med.g, "transform", `translate(${n3(W / 2)} ${n3(medY)}) scale(${n3(L.R * S.med.s)}) rotate(${n3(22.5 + 8 * wave(t, 1))})`);
      // The open sheet (with its shadow) fades in over the loose wedges as they finish fanning out.
      const full = clamp((S.med.k - 0.9) / 0.1);
      set(med.full, "opacity", n3(full));
      set(med.backing, "opacity", n3(full));
      med.wedges.forEach((w, i) => {
        show(w, full < 1);
        set(w, "transform", `rotate(${n3(i * 45 * S.med.k)})`);
      });
      set(med.ring, "opacity", n3(S.med.k));
      set(glow, "opacity", n3(S.glow.o * (0.55 + 0.1 * wave(t, 4))));

      show(fuWrap, S.fu.s > 0.01);
      set(fuWrap, "transform", `translate(${n3(W / 2)} ${n3(medY)}) rotate(${n3(S.fu.r + 2 * wave(t, 3))}) scale(${n3(S.fu.s)})`);

      // Round caps would leave a dot on a line that has not started drawing yet.
      for (const p of R.dashed) set(p, "visibility", +p.getAttribute("stroke-dashoffset") > 0.995 ? "hidden" : "visible");
      branch.blossoms.forEach((b, i) => set(b.g, "transform", `scale(${n3(Math.max(0.001, S.blos[i].s))}) rotate(${n3(6 * wave(t, 3, i))})`));

      wordEls.forEach((w, i) => {
        const st = S.words[i];
        set(w.g, "opacity", n3(st.o));
        set(w.g, "transform", `translate(0 ${n3(st.y * L.fsMax * 0.5)})`);
      });
      glyphs.forEach((g, i) => set(g, "transform", `scale(${n3(Math.max(0.001, S.glyphs[i].s))})`));
      rules.forEach((g) => set(g, "transform", `scale(${n3(Math.max(0.001, S.rules.s))} 1)`));
      if (sub) set(sub, "opacity", n3(S.sub.o));
      const glint = ((t % 4) / 4) * 3 - 1.5;
      set(gold, "gradientTransform", `translate(${n3(glint * L.titleW)} 0)`);

      pile.forEach((p, i) => {
        const st = S.pile[i];
        show(p.inner, st.y > -0.999);
        set(p.inner, "transform", `translate(0 ${n3(st.y * (st.y < 0 ? L.pile.y / L.pile.s + 4 : (H * 0.4) / L.pile.s))}) rotate(${n3(st.r)})`);
      });

      // Confetti: each piece falls a whole number of screens per loop, so the loop is seamless.
      conf.forEach((c) => {
        const k = ((t / LOOP) * c.sp + c.p) % 1;
        const x = (c.x + 0.03 * wave(t, c.sway, c.p * 6)) * W, y = -u * 0.05 + k * (H + u * 0.1);
        set(c.c, "transform", `translate(${n3(x)} ${n3(y)}) rotate(${n3(k * 360 * c.spin)}) scale(${n3(c.s * Math.cos(TAU * k * c.spin * 2))} ${n3(c.s)})`);
      });
      set(R.confG, "opacity", n3(S.conf.o * 0.9));

      // Sparks: move out, slow down, drift down a little and fade.
      for (const b of bursts) {
        const tau = t - b.t0;
        const on = tau > 0 && tau < 1.4;
        show(b.g, on);
        if (!on) continue;
        const reach = u * 0.1 * (1 - Math.exp(-3.2 * tau)), fall = u * 0.03 * tau * tau;
        set(b.g, "opacity", n3(Math.min(1, tau * 8) * (1 - tau / 1.4) ** 1.5));
        for (const p of b.parts) {
          set(p.c, "cx", n3(b.x + Math.cos(p.a) * reach * p.sp));
          set(p.c, "cy", n3(b.y + Math.sin(p.a) * reach * p.sp + fall));
        }
      }
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    // Reduced motion: one still frame with everything in place.
    function apply() {
      if (reduce.matches) tl.pause(STILL);
      else tl.play();
      update();
    }
    reduce.addEventListener("change", apply);

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const at = tl.time();
        tl.kill();
        build();
        tl.time(at);
        apply();
      }, 150);
    });

    // Wait briefly for the fonts so the title is measured in the right face.
    Promise.race([
      Promise.all([document.fonts.load("400 1em 'DM Serif Display'"), document.fonts.load("500 1em Jost")]),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => { build(); apply(); });
  </script>
</body>
</html>
