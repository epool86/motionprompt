<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chinese heritage demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dm-serif-display@5.3.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jost@5.3.0/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jost@5.3.0/600.css">
  <style>
    /* Colours can be set from the URL: ?text=Product name|Call to action&bg=8e0c18&ink=fff1d0&accent=f2c14e&accent2=d7262f */
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #8e0c18;
    }

    svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .title {
      font-family: "DM Serif Display", Georgia, serif;
      font-weight: 400;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .sub {
      font-family: "Jost", "Trebuchet MS", system-ui, sans-serif;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
      text-transform: uppercase;
    }

    .seal {
      font-family: "Jost", "Trebuchet MS", system-ui, sans-serif;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>
<body>
  <svg id="scene" role="img" xmlns="http://www.w3.org/2000/svg"></svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const hex = (key, fallback) => "#" + (/^[0-9a-f]{6}$/i.test(params.get(key) ?? "") ? params.get(key) : fallback);
    const C = {
      bg: hex("bg", "8e0c18"),
      ink: hex("ink", "fff1d0"),
      gold: hex("accent", "f2c14e"),
      paper: hex("accent2", "d7262f"),
      goldDeep: "#b9812a",
      goldLight: "#fff4c7",
      shade: "#3b0207",
      label: "#f6e6c4",
      leaf: "#2f7a45",
      branch: "#4a2218",
      petal: "#ffd3de",
      petalDeep: "#f07a9a",
    };
    document.body.style.background = C.bg;

    // ?text=Product name|Call to action. The default is a made-up herbal cough syrup brand.
    const raw = (params.get("text") || "").trim();
    const [title, cta] = raw
      ? [raw.split("|")[0].trim().slice(0, 36), (raw.split("|")[1] || "").trim().slice(0, 44)]
      : ["Cap Teratai Emas", "Dapatkan di farmasi berhampiran"];
    const SEALS = [["HERBA", "ASLI"], ["SEJAK", "1938"], ["MELEGAKAN", "TEKAK"]];

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("scene");
    svg.setAttribute("aria-label", `A vintage Chinese herbal cough syrup ad in red and gold: an amber bottle rises in with a gold shine, pours dark syrup onto a porcelain spoon, loquat, honey, ginger and star anise pop in around it, red seals stamp in, and the name ${title} appears${cta ? " with the line " + cta : ""}`);

    function el(name, attrs, parent) {
      const node = document.createElementNS(NS, name);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      if (parent) parent.append(node);
      return node;
    }

    // Brush outlines for the label characters (cough relief), traced from the Ma Shan Zheng font
    // (SIL Open Font License). Each one sits in a 1000 unit em box.
    const GLYPHS = {
      "止": "M489 144Q498 150 505 150Q511 150 530 168Q549 185 549 191Q550 199 549 282Q548 364 547 381Q546 404 552 406Q557 409 579 402Q601 394 602 389Q605 384 648 382Q692 381 701 386Q712 391 718 406Q724 420 723 433Q720 447 704 467Q692 481 687 484Q682 487 673 485Q661 482 634 490Q607 499 601 507Q590 519 564 498Q547 482 542 482Q536 482 530 556Q523 631 521 727V747H632Q744 745 809 744Q857 742 874 745Q890 748 890 756Q890 762 902 774Q915 786 918 797Q920 808 928 834Q935 859 930 863Q924 868 892 872Q859 875 846 872Q831 867 816 867Q802 867 792 862Q779 855 691 845Q655 841 642 838Q629 836 568 834L505 832L491 846Q481 855 476 857Q470 859 450 856Q424 853 421 848Q418 842 395 846Q372 850 350 852Q304 854 252 867Q235 872 228 872Q219 872 194 884Q170 895 157 907Q146 918 142 918Q138 919 130 914Q118 907 102 898Q85 888 81 878Q77 868 72 865Q57 855 102 835Q150 813 222 795L253 787L249 770Q247 754 252 732Q256 711 255 618Q254 475 257 446Q260 416 276 416Q287 416 287 420Q287 423 299 436Q324 462 315 482Q312 493 316 532Q319 572 320 612Q321 651 324 670Q326 690 328 731L331 771L347 769Q367 765 372 762Q378 760 378 751Q378 742 382 736Q386 730 396 737Q419 754 425 737Q429 729 433 726Q437 723 437 466Q438 271 440 206Q443 140 450 135Q455 133 468 136Q481 139 489 144Z",
      "咳": "M741 783Q746 783 786 798Q826 813 839 820Q851 827 859 821Q866 817 869 818Q872 818 877 826Q886 836 886 842Q886 849 895 860Q912 882 892 920Q876 951 863 956Q850 960 832 941Q818 925 763 868Q691 796 707 796Q712 796 709 791Q708 790 710 789Q712 788 715 788Q718 787 721 785ZM784 587Q790 599 790 603Q790 607 785 617Q777 631 777 636Q777 642 764 658Q751 675 751 680Q751 684 741 695Q731 706 720 724Q705 749 663 793Q645 813 607 844Q569 874 564 874Q562 874 530 894Q485 922 485 912Q486 909 490 906Q497 898 497 894Q497 889 517 866L562 809Q587 776 615 743Q636 718 664 668Q692 619 707 577Q717 553 721 548Q731 536 751 548Q771 561 784 587ZM387 459Q387 485 363 512Q345 529 352 558Q355 575 351 598Q348 613 344 618Q341 624 332 627Q318 634 298 632Q278 629 234 639L191 650V665Q191 677 189 680Q187 682 176 682Q162 682 154 670Q140 650 134 630Q129 610 125 568Q119 489 105 461Q101 452 98 428Q96 403 98 385Q101 364 114 356Q129 345 154 341Q180 337 237 335Q307 331 309 329Q314 324 352 334Q390 345 402 354Q414 364 414 382Q414 401 400 420Q387 440 387 459ZM204 401Q175 411 170 417Q164 423 161 446Q151 493 173 534Q178 546 178 557Q178 567 182 568Q186 568 208 561Q247 548 255 505Q258 488 266 473Q276 452 282 438Q288 423 290 413Q292 403 290 398Q288 393 281 391Q270 390 244 393Q219 396 204 401ZM582 325Q607 344 607 371Q607 381 598 391Q590 401 562 429Q517 474 523 476Q529 477 551 473Q577 466 617 473Q624 474 632 461Q640 448 674 376Q691 342 699 335Q705 329 708 330Q711 330 721 337Q772 371 733 442Q730 448 712 484Q694 520 690 520Q686 520 669 552Q635 620 582 688Q529 755 484 785Q327 896 327 874Q327 867 354 834Q380 802 417 765Q453 726 502 664Q551 603 569 572L581 549L564 552Q549 555 541 562Q534 568 512 577Q489 586 479 586Q469 586 457 578Q445 570 443 560Q438 541 438 513Q438 485 443 474Q449 459 476 430Q503 402 508 394Q521 371 538 350Q554 328 560 324Q569 321 572 321Q575 321 582 325ZM637 108Q649 119 664 148Q680 178 685 203Q685 204 686 205Q691 231 701 235Q711 239 763 237Q765 237 767 237Q835 234 844 240Q853 245 864 245Q876 245 888 256Q897 264 898 270Q899 275 898 290Q892 332 859 332Q844 332 840 329Q822 311 704 300Q587 290 537 302Q517 306 496 308Q475 311 460 324Q443 339 424 334Q405 330 405 310Q405 288 436 276Q466 263 536 257L595 252L594 238Q591 217 570 155Q562 134 567 105Q567 101 581 100Q607 96 617 98Q627 99 637 108Z",
    };
    // Small geometry helpers. Shapes are drawn in local units and scaled into place.
    const TAU = Math.PI * 2;
    const rad = (d) => (d * Math.PI) / 180;
    const n3 = (v) => +v.toFixed(3);
    const P = (p) => `${n3(p[0])} ${n3(p[1])}`;
    const polar = (r, deg, c = [0, 0]) => [c[0] + r * Math.cos(rad(deg)), c[1] + r * Math.sin(rad(deg))];
    const circle = (x, y, r) => `M${P([x - r, y])}a${n3(r)} ${n3(r)} 0 1 0 ${n3(r * 2)} 0a${n3(r)} ${n3(r)} 0 1 0 ${n3(-r * 2)} 0Z`;
    // A teardrop from (x, y), pointing along deg.
    const drop = (x, y, len, deg, w = 0.35) =>
      `M${P([x, y])}` + [[0.3, -w], [0.8, -w * 0.6], [1, 0], [0.8, w * 0.6], [0.3, w], [0, 0]]
        .map((q, i) => (i % 3 === 0 ? "C" : "") + P(polar(Math.hypot(q[0], q[1]) * len, deg + (Math.atan2(q[1], q[0]) * 180) / Math.PI, [x, y])) + " ")
        .join("") + "Z";
    // A scalloped edge between two angles: the radius swings from r0 up to r1 on every bump.
    function scallop(r0, r1, a0, a1, bumps, steps = 10) {
      const pts = [];
      for (let i = 0; i <= bumps * steps; i++) {
        const k = i / (bumps * steps);
        pts.push(polar(r0 + (r1 - r0) * Math.sin(Math.PI * ((k * bumps) % 1 || (i ? 1 : 0))), a0 + (a1 - a0) * k));
      }
      return pts;
    }
    const poly = (pts) => pts.map((p, i) => (i ? "L" : "M") + P(p)).join("");
    // A spiral cut, like the curl of a cloud scroll.
    function spiral(c, r0, turns, a0, dir = 1) {
      const pts = [];
      for (let i = 0; i <= 28; i++) {
        const k = i / 28;
        pts.push(polar(r0 * (1 - 0.8 * k), a0 + dir * k * turns * 360, c));
      }
      return poly(pts);
    }

    // ---------- Paper-cut pieces are painted once into bitmaps, so they stay light ----------
    // paper is the sheet, holes are cut out as shapes, lines are cut out as thin strokes.
    // box is [x, y, w, h] in local units and px is the size of one local unit on screen.
    function paperBitmap({ paper, holes, lines, lw, box, px, copies = 1, shadow = 0 }) {
      const k = px * Math.min(2, devicePixelRatio || 1);
      const c = document.createElement("canvas");
      c.width = Math.max(2, Math.ceil(box[2] * k));
      c.height = Math.max(2, Math.ceil(box[3] * k));
      const g = c.getContext("2d");
      const sheet = document.createElement("canvas");
      sheet.width = c.width;
      sheet.height = c.height;
      const sg = sheet.getContext("2d");
      for (let i = 0; i < copies; i++) {
        const part = document.createElement("canvas");
        part.width = c.width;
        part.height = c.height;
        const pg = part.getContext("2d");
        pg.setTransform(k, 0, 0, k, -box[0] * k, -box[1] * k);
        pg.rotate((i * TAU) / copies);
        pg.fillStyle = C.paper;
        pg.fill(new Path2D(paper));
        pg.globalCompositeOperation = "destination-out";
        pg.fill(new Path2D(holes));
        pg.lineWidth = lw;
        pg.lineCap = "round";
        pg.stroke(new Path2D(lines));
        sg.drawImage(part, 0, 0);
      }
      // A soft shadow under the sheet, so it looks lifted off the background.
      if (shadow) {
        g.shadowColor = "rgba(40, 0, 6, 0.55)";
        g.shadowBlur = shadow * k;
        g.shadowOffsetY = shadow * k * 0.4;
      }
      g.drawImage(sheet, 0, 0);
      return c.toDataURL();
    }

    // ---------- Paper-cut corner: a fan of red paper with a lacy cut pattern ----------
    function cornerArt(px) {
      let holes = "";
      for (let i = 0; i < 7; i++) holes += circle(...polar(0.86, (i + 0.5) * (90 / 7)), 0.035);
      [13, 34, 56, 77].forEach((a) => (holes += drop(...polar(0.5, a), 0.21, a, 0.32)));
      [22, 68].forEach((a) => (holes += circle(...polar(0.3, a), 0.025)));
      const lines = `M${P(polar(0.77, 5))}A0.77 0.77 0 0 1 ${P(polar(0.77, 85))}` +
        `M${P(polar(0.44, 6))}A0.44 0.44 0 0 1 ${P(polar(0.44, 84))}` + spiral(polar(0.26, 45), 0.1, 1.4, 225, 1);
      const paper = `M0 0${poly(scallop(0.9, 1, 0, 90, 7)).replace("M", "L")}Z`;
      return paperBitmap({ paper, holes, lines, lw: 0.026, box: [-0.06, -0.06, 1.16, 1.16], px, shadow: 0.02 });
    }

    function buildCorner(parent, x, y, sx, sy, size, href, id) {
      const g = el("g", {}, parent);
      const clip = el("clipPath", { id, clipPathUnits: "userSpaceOnUse" }, defs);
      const reveal = el("circle", { r: 0 }, clip);
      const inner = el("g", { "clip-path": `url(#${id})` }, g);
      el("image", { href, x: -0.06, y: -0.06, width: 1.16, height: 1.16 }, inner);
      el("path", { d: `M${P(polar(0.955, 3))}A0.955 0.955 0 0 1 ${P(polar(0.955, 87))}`, fill: "none", stroke: C.gold, "stroke-width": 0.008, opacity: 0.7 }, inner);
      return { g, reveal, x, y, sx, sy, size };
    }

    // ---------- The paper-cut medallion: eight folded wedges that fan open ----------
    function buildMedallion(parent, R0) {
      const half = 22.5;
      const paper = `M0 0${poly(scallop(0.9, 1, -90 - half - 0.4, -90 + half + 0.4, 2)).replace("M", "L")}Z`;
      const holes = drop(0, -0.46, 0.36, -90, 0.3) + drop(...polar(0.5, -103), 0.2, -114, 0.32) + drop(...polar(0.5, -77), 0.2, -66, 0.32) +
        circle(...polar(0.83, -101.25), 0.032) + circle(...polar(0.83, -78.75), 0.032) + circle(...polar(0.24, -90), 0.024);
      const lines = `M${P(polar(0.34, -104))}A0.34 0.34 0 0 1 ${P(polar(0.34, -76))}`;
      const box = [-1.1, -1.1, 2.2, 2.2];
      // One loose wedge for the unfolding, and the whole open sheet with its shadow.
      const wedgeHref = paperBitmap({ paper, holes, lines, lw: 0.03, box, px: R0 });
      const fullHref = paperBitmap({ paper, holes, lines, lw: 0.03, box, px: R0, copies: 8, shadow: 0.014 });

      const g = el("g", {}, parent);
      const ring = el("g", { fill: "none", stroke: C.gold }, g);
      el("circle", { r: 1.07, "stroke-width": 0.012 }, ring);
      let dots = "";
      for (let i = 0; i < 48; i++) dots += circle(...polar(1.13, i * 7.5), 0.012);
      el("path", { d: dots, fill: C.gold, stroke: "none" }, ring);
      // Once open, the sheet sits on a gold backing, so the cut-outs shine through.
      const backing = el("circle", { r: 0.895, fill: "url(#cny-coin)" }, g);
      const img = (href) => el("image", { href, x: box[0], y: box[1], width: box[2], height: box[3] }, g);
      const wedges = Array.from({ length: 8 }, () => img(wedgeHref));
      const full = img(fullHref);
      // A gold rosette in the middle, seen before the fu diamond lands.
      let ros = "";
      for (let i = 0; i < 8; i++) ros += drop(0, 0, 0.16, i * 45, 0.4);
      el("path", { d: ros + circle(0, 0, 0.05), fill: C.gold }, g);
      return { g, ring, wedges, full, backing };
    }

    // ---------- Round red lantern with a gold tassel ----------
    function buildLantern(parent, lan) {
      const outer = el("g", {}, parent);
      const g = el("g", {}, outer);
      const ls = lan.len / lan.w + 0.12;
      el("circle", { cx: 0, cy: ls + 0.5, r: 0.95, fill: "url(#cny-glow)", opacity: 0.55 }, g);
      el("path", { d: `M0 ${n3(-ls - 2)}V${n3(ls + 0.02)}`, stroke: C.goldDeep, "stroke-width": 0.02 }, g);
      el("rect", { x: -0.19, y: ls, width: 0.38, height: 0.09, rx: 0.03, fill: C.gold }, g);
      el("ellipse", { cx: 0, cy: ls + 0.5, rx: 0.5, ry: 0.42, fill: "url(#cny-lan)" }, g);
      const ribs = el("g", { fill: "none", stroke: "#7a0812", "stroke-width": 0.014, opacity: 0.55 }, g);
      for (const rx of [0.13, 0.3]) el("ellipse", { cx: 0, cy: ls + 0.5, rx, ry: 0.42 }, ribs);
      el("path", { d: `M0 ${n3(ls + 0.08)}V${n3(ls + 0.92)}` }, ribs);
      el("ellipse", { cx: 0, cy: ls + 0.5, rx: 0.5, ry: 0.07, fill: "none", stroke: C.gold, "stroke-width": 0.02, opacity: 0.8 }, g);
      el("ellipse", { cx: -0.18, cy: ls + 0.32, rx: 0.14, ry: 0.07, fill: "#ffd0b0", opacity: 0.35, transform: `rotate(-25 -0.18 ${n3(ls + 0.32)})` }, g);
      el("rect", { x: -0.15, y: ls + 0.86, width: 0.3, height: 0.08, rx: 0.03, fill: C.gold }, g);
      const tassel = el("g", {}, g);
      const ty = ls + 0.94;
      el("path", { d: `M0 0V0.12`, stroke: C.gold, "stroke-width": 0.022 }, tassel);
      el("path", { d: "M0 0.08L0.05 0.13L0 0.18L-0.05 0.13Z", fill: C.gold }, tassel);
      el("path", { d: "M-0.035 0.18H0.035L0.075 0.56Q0 0.6 -0.075 0.56Z", fill: C.gold }, tassel);
      el("path", { d: "M-0.02 0.22L-0.04 0.55M0 0.22V0.57M0.02 0.22L0.04 0.55", stroke: C.goldDeep, "stroke-width": 0.01 }, tassel);
      el("rect", { x: -0.045, y: 0.19, width: 0.09, height: 0.035, fill: C.paper }, tassel);
      return { outer, g, tassel, ty, lan };
    }

    // ---------- Gold coin ----------
    function buildCoin(parent) {
      const g = el("g", {}, parent);
      el("path", { d: circle(0, 0, 1) + "M-0.2 -0.2H0.2V0.2H-0.2Z", fill: "url(#cny-coin)", "fill-rule": "evenodd", stroke: C.goldDeep, "stroke-width": 0.05 }, g);
      el("circle", { r: 0.74, fill: "none", stroke: C.goldDeep, "stroke-width": 0.05 }, g);
      el("path", { d: "M-0.08 -0.52h0.16v0.16h-0.16ZM-0.08 0.36h0.16v0.16h-0.16ZM-0.52 -0.08h0.16v0.16h-0.16ZM0.36 -0.08h0.16v0.16h-0.16Z", fill: C.goldDeep }, g);
      return g;
    }
    // ---------- Plum blossom branch ----------
    function buildBranch(parent, B) {
      const g = el("g", { transform: `translate(${n3(B.x)} ${n3(B.y)}) scale(${n3(B.s)})` }, parent);
      const strokes = [
        { d: "M-0.05 0.02C0.2 0 0.35 -0.08 0.5 -0.2S0.78 -0.36 0.98 -0.44", w: 0.034 },
        { d: "M0.42 -0.14C0.44 -0.26 0.52 -0.36 0.6 -0.52", w: 0.018 },
        { d: "M0.72 -0.34C0.8 -0.3 0.9 -0.26 1.02 -0.28", w: 0.016 },
        { d: "M0.18 -0.03C0.24 -0.1 0.26 -0.18 0.24 -0.26", w: 0.014 },
      ];
      const lines = strokes.map((s) => el("path", { d: s.d, fill: "none", stroke: C.branch, "stroke-width": s.w, "stroke-linecap": "round", pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1 }, g));
      const spots = [
        [0.98, -0.44, 0.07, 0], [0.6, -0.52, 0.065, 30], [1.02, -0.28, 0.06, 60], [0.5, -0.2, 0.075, 15],
        [0.24, -0.26, 0.055, 45], [0.78, -0.37, 0.05, 20], [0.35, -0.1, 0.05, 70], [0.88, -0.29, 0.04, 10],
      ];
      const blossoms = spots.map(([x, y, s, a], i) => {
        const o = el("g", { transform: `translate(${x} ${y})` }, g);
        const inner = el("g", {}, o);
        if (i === 7 || i === 6) {
          el("circle", { r: s * 0.55, fill: C.petalDeep }, inner);
          return { g: inner, s };
        }
        let petals = "";
        for (let k = 0; k < 5; k++) petals += circle(...polar(s * 0.5, a + k * 72), s * 0.5);
        el("path", { d: petals, fill: "url(#cny-petal)" }, inner);
        el("circle", { r: s * 0.3, fill: C.petalDeep }, inner);
        let st = "", dt = "";
        for (let k = 0; k < 7; k++) {
          const p = polar(s * 0.52, a + k * 51 + 20);
          st += `M0 0L${P(p)}`;
          dt += circle(...p, s * 0.07);
        }
        el("path", { d: st, stroke: "#b8325a", "stroke-width": s * 0.04 }, inner);
        el("path", { d: dt, fill: C.gold }, inner);
        return { g: inner, s };
      });
      return { g, lines, blossoms };
    }


    // ---------- The hero: a vintage amber medicine bottle with a paper label ----------
    // Bottle units: the bottle stands on y = 0 and its lip is at y = -0.8. The whole product
    // group (bottle, spoon and props) fits the box x -0.68..0.92, y -1.1..0.24.
    const BOX = { x0: -0.68, y0: -1.1, w: 1.6, h: 1.34 };
    const PIVOT = -0.35, TILT = 100, LIFT = -0.28, SHIFT = -0.02;
    const MOUTH = 0.47; // lip distance above the pivot
    const SPOON = [0.5, -0.03];
    const BODY = "M-0.17 0Q-0.22 0 -0.22 -0.05L-0.22 -0.5C-0.22 -0.6 -0.075 -0.6 -0.075 -0.66L-0.075 -0.76L-0.09 -0.765L-0.09 -0.8L0.09 -0.8L0.09 -0.765L0.075 -0.76L0.075 -0.66C0.075 -0.6 0.22 -0.6 0.22 -0.5L0.22 -0.05Q0.22 0 0.17 0Z";

    function buildBottle(parent) {
      const g = el("g", {}, parent);
      const clip = el("clipPath", { id: "hb-glass" }, defs);
      el("path", { d: BODY }, clip);
      el("path", { d: BODY, fill: "url(#hb-amber)" }, g);
      // The neck above the syrup is lighter glass.
      el("path", { d: "M-0.2 -0.6H0.2V-0.82H-0.2Z", fill: "#e39a45", opacity: 0.45, "clip-path": "url(#hb-glass)" }, g);
      el("path", { d: "M-0.22 -0.585H0.22", stroke: "#ffb866", "stroke-width": 0.006, opacity: 0.6, "clip-path": "url(#hb-glass)" }, g);
      el("path", { d: BODY, fill: "none", stroke: "#ffb45a", "stroke-width": 0.007, opacity: 0.55 }, g);
      // Glass highlights: a long streak on the left, a small one on the right, a glint on the shoulder.
      el("rect", { x: -0.185, y: -0.5, width: 0.035, height: 0.44, rx: 0.017, fill: "url(#hb-streak)" }, g);

      // Paper-cut corners, and a paper-cut medallion behind the bottle.
      const cornerHref = cornerArt(L.corner);
      const corners = [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]].map(([x, y2, sx, sy], i) => buildCorner(svg, x, y2, sx, sy, L.corner, cornerHref, `cny-clip${i}`));
      const [mx, my] = toScreen(L, 0, -0.46);
      const medR = L.S * 0.6;
      const glow = el("circle", { cx: mx, cy: my, r: medR * 2.1, fill: "url(#cny-glow)" }, svg);
      const med = buildMedallion(svg, medR);
      const branch = buildBranch(svg, L.branch);

      // Product group: shadow, herbs and loquat behind, bottle, stream, spoon, props in front.
      const prod = el("g", { transform: `translate(${n3(L.gx)} ${n3(L.gy)}) scale(${n3(L.S)})` }, svg);
      const shadow = el("ellipse", { cx: 0, cy: 0.012, rx: 0.3, ry: 0.035, fill: C.shade, opacity: 0.35 }, prod);
      const props = [];
      const prop = (fn, x, y, rot, from) => {
        const o = el("g", { transform: `translate(${x} ${y}) rotate(${rot})` }, prod);
        const inner = el("g", {}, o);
        fn(inner);
        props.push({ inner, from, x, y });
      };
      prop(buildHerb, -0.52, -0.2, -16, -1);
      prop(buildLoquat, -0.4, -0.03, 0, 1);
      const bottleOuter = el("g", {}, prod);
      const bottle = buildBottle(bottleOuter);
      const stream = el("g", {}, prod);
      const streamBody = el("path", { fill: "url(#hb-stream)" }, stream);
      const streamHi = el("path", { fill: "none", stroke: "#ffe2b0", "stroke-width": 0.008, "stroke-linecap": "round", opacity: 0.7 }, stream);
      const spoonOuter = el("g", {}, prod);
      const spoon = buildSpoon(spoonOuter);
      prop(buildDipper, -0.26, 0.15, -14, -1);
      prop(buildAnise, 0.03, 0.165, 0, 1);
      prop(buildGinger, 0.29, 0.15, 0, -1);
      const corkG = buildCork(prod);

      // Words: seals, the product name, a gold divider and the call to action.
      const T = L.text;
      const probe = el("text", { class: "title", "font-size": 100 }, svg);
      const widthOf = (s) => { probe.textContent = s; return probe.getComputedTextLength() / 100; };
      const words = title.split(/\s+/).filter(Boolean);
      let lines = [title];
      let fs = Math.min(L.fsMax, T.maxW / widthOf(title));
      if (fs < L.fsMax * 0.55 && words.length > 1) {
        let best = null;
        for (let i = 1; i < words.length; i++) {
          const pair = [words.slice(0, i).join(" "), words.slice(i).join(" ")];
          const w = Math.max(...pair.map(widthOf));
          if (!best || w < best.w) best = { pair, w };
        }
        lines = best.pair;
        fs = Math.min(L.fsMax * 0.85, T.maxW / best.w);
      }
      probe.remove();
      let sealD = L.sealD, ctaFs = Math.max(7, fs * 0.3);
      const stackOf = () => sealD + fs * 0.35 + lines.length * fs * 1.08 + fs * 0.45 + (cta ? ctaFs * 1.4 : 0);
      const fit = Math.min(1, (T.bottom - T.top) / stackOf());
      fs *= fit; sealD *= fit; ctaFs = Math.max(6, ctaFs * fit);
      let y = T.top + (T.bottom - T.top - stackOf()) / 2;
      const sealY = y + sealD / 2;
      y += sealD + fs * 0.35;
      const lineY = lines.map(() => { const v = y + fs * 0.54; y += fs * 1.08; return v; });
      const divY = y + fs * 0.2;
      y += fs * 0.45;
      const ctaY = y + ctaFs * 0.7;

      const gap = Math.min(sealD * 0.35, (T.maxW - sealD * 3) / 2);
      const seals = SEALS.map((ln, i) => {
        const s = buildSeal(svg, ln, sealD);
        s.x = T.cx + (i - 1) * (sealD + gap);
        s.y = sealY;
        s.rot = [-8, 5, -4][i];
        return s;
      });
      const gold = el("linearGradient", { id: "cny-gold", gradientUnits: "userSpaceOnUse", x1: T.cx - T.maxW / 2, y1: 0, x2: T.cx + T.maxW / 2, y2: fs }, defs);
      [[0, C.gold], [0.42, C.gold], [0.5, C.goldLight], [0.58, C.gold], [1, C.gold]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, gold));
      const nameEls = lines.map((ln, i) => {
        const g = el("g", {}, svg);
        const at = { class: "title", "font-size": n3(fs), x: n3(T.cx), y: n3(lineY[i]) };
        el("text", { ...at, fill: C.shade, opacity: 0.55, transform: `translate(${n3(fs * 0.025)} ${n3(fs * 0.04)})` }, g).textContent = ln;
        el("text", { ...at, fill: "url(#cny-gold)" }, g).textContent = ln;
        return g;
      });
      const divider = el("g", {}, svg);
      const divW = Math.min(T.maxW * 0.36, fs * 2.4), dd = fs * 0.09;
      const rules = [-1, 1].map((side) => {
        const g = el("g", { transform: `translate(${n3(T.cx + side * dd * 2.2)} ${n3(divY)}) scale(${side} 1)` }, divider);
        const inner = el("g", {}, g);
        el("path", { d: `M0 0H${n3(divW)}`, stroke: C.gold, "stroke-width": Math.max(1, fs * 0.03) }, inner);
        return inner;
      });
      const diamond = el("path", { d: `M${n3(T.cx)} ${n3(divY - dd)}l${n3(dd)} ${n3(dd)}l${n3(-dd)} ${n3(dd)}l${n3(-dd)} ${n3(-dd)}Z`, fill: C.gold }, divider);
      let ctaEl = null;
      if (cta) {
        ctaEl = el("text", { class: "sub", "font-size": n3(ctaFs), x: T.cx, y: n3(ctaY), fill: C.ink, "letter-spacing": `${n3(ctaFs * 0.16)}px` }, svg);
        ctaEl.textContent = cta;
        const cw = ctaEl.getComputedTextLength();
        if (cw > T.maxW) ctaEl.setAttribute("font-size", n3((ctaFs * T.maxW) / cw));
      }

      // A few gold coins in the corner.
      const pileG = el("g", { transform: `translate(${n3(L.pile.x)} ${n3(L.pile.y)}) scale(${n3(L.pile.s)})` }, svg);
      const pile = [{ x: -1.2, y: -0.8, s: 0.85 }, { x: 0.4, y: -0.75, s: 0.95 }, { x: -0.35, y: -1.9, s: 0.75 }].map((p) => {
        const o = el("g", { transform: `translate(${p.x} ${p.y}) scale(${p.s})` }, pileG);
        const inner = el("g", {}, o);
        buildCoin(inner);
        return { ...p, inner };
      });

      // Lanterns hang in front of everything but the sparkles.
      const lanterns = L.lanterns.map((lan) => buildLantern(svg, lan));

      // Gold confetti, drifting down once the name lands.
      const confG = el("g", {}, svg);
      const conf = [];
      for (let i = 0; i < 26; i++) {
        const c = el("rect", { x: -0.5, y: -0.5, width: 1, height: i % 3 ? 1.7 : 1, rx: i % 3 ? 0.15 : 0.5, fill: [C.gold, C.goldLight, "#ff8a6a", C.gold][i % 4] }, confG);
        const f = (a, b) => { const v = Math.sin(i * a + b) * 43758.5453; return v - Math.floor(v); };
        conf.push({ c, x: f(12.9, 1.3), p: f(78.2, 4.1), sp: 1 + (i % 2), sway: 1 + (i % 3), s: u * (0.008 + f(3.1, 2) * 0.007), spin: 2 + (i % 4) });
      }

      // Soft gold sparkle bursts around the bottle and the name.
      const sparkG = el("g", {}, svg);
      const burstPos = [toScreen(L, -0.42, -0.86), toScreen(L, 0.62, -0.62), [T.cx + T.maxW * 0.42, lineY[0] - fs * 0.5]];
      const bursts = [7.35, 8.3, 9.25].map((t0, b) => {
        const g = el("g", {}, sparkG);
        const parts = [];
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * TAU + b, sp = 0.7 + ((i * 7) % 5) / 10;
          parts.push({ c: el("circle", { r: u * (0.005 + (i % 3) * 0.002), fill: [C.goldLight, C.gold, "#ffb35c"][i % 3] }, g), a, sp });
        }
        return { g, t0, x: burstPos[b][0], y: burstPos[b][1], parts };
      });

      S = {
        corner: corners.map(() => ({ s: 0, r: -30, c: 0 })),
        lan: lanterns.map(() => ({ y: 1, kick: 0 })),
        med: { s: 0, k: 0 },
        glow: { o: 0 },
        blos: branch.blossoms.map(() => ({ s: 0 })),
        bot: { y: 1, tilt: 0, shine: 0, shine2: 0 },
        cork: { p: 0, o: 1 },
        spoon: { x: 1 },
        pour: { head: 0, tail: 0, pool: 0 },
        props: props.map(() => ({ s: 0 })),
        seals: seals.map(() => ({ s: 0, out: 0 })),
        name: nameEls.map(() => ({ o: 0, y: 1 })),
        div: { s: 0 },
        cta: { o: 0 },
        pile: pile.map(() => ({ y: -1, r: 0 })),
        conf: { o: 0 },
      };
      R = { L, corners, lanterns, med, glow, branch, prod, shadow, props, bottleOuter, bottle, stream, streamBody, streamHi, spoonOuter, spoon, corkG, seals, nameEls, rules, diamond, ctaEl, pile, conf, confG, bursts, gold, dashed: branch.lines, fs };

      tl = gsap.timeline({ repeat: -1, onUpdate: update });
      tl.set({}, {}, LOOP);
      // 1. Lanterns drop in and swing; paper corners fan open and get cut; the medallion unfolds.
      S.lan.forEach((l, i) => {
        tl.fromTo(l, { y: 1 }, { y: 0, duration: 1.1, ease: "back.out(1.3)" }, 0.1 + i * 0.18)
          .fromTo(l, { kick: 14 * (i % 2 ? -1 : 1) }, { kick: 0, duration: 3, ease: "sine.out" }, 0.4 + i * 0.18)
          .to(l, { y: 1, duration: 0.7, ease: "power2.in" }, 10.9 + i * 0.1);
      });
      S.corner.forEach((c, i) => {
        tl.fromTo(c, { s: 0, r: -40 }, { s: 1, r: 0, duration: 0.8, ease: "back.out(1.5)" }, 0.3 + i * 0.12)
          .to(c, { s: 0, r: -40, duration: 0.5, ease: "power2.in" }, 10.8 + i * 0.08);
      });
      S.corner.forEach((c, i) => tl.fromTo(c, { c: 0 }, { c: 1.12, duration: 1.1, ease: "power1.inOut" }, 0.35 + i * 0.12));
      tl.fromTo(S.med, { s: 0 }, { s: 1, duration: 0.9, ease: "back.out(1.4)" }, 1.0)
        .fromTo(S.med, { k: 0 }, { k: 1, duration: 1.2, ease: "power2.inOut" }, 1.2)
        .fromTo(S.glow, { o: 0 }, { o: 1, duration: 1.2, ease: "sine.out" }, 1.4);
      branch.lines.forEach((p, i) => tl.fromTo(p, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: i ? 0.6 : 1.1, ease: "sine.inOut" }, i ? 2.2 + i * 0.12 : 1.6));
      S.blos.forEach((b, i) => tl.fromTo(b, { s: 0 }, { s: 1, duration: 0.5, ease: "back.out(2.2)" }, 2.6 + i * 0.12).to(b, { s: 0, duration: 0.3, ease: "power2.in" }, 10.1 + i * 0.04));
      // 2. The bottle rises into place with a gold shine, the cork pops, the spoon slides in.
      tl.fromTo(S.bot, { y: 1 }, { y: 0, duration: 1.0, ease: "back.out(1.2)" }, 0.6)
        .fromTo(S.bot, { shine: 0 }, { shine: 1, duration: 0.9, ease: "power1.inOut" }, 1.35)
        .fromTo(S.cork, { p: 0 }, { p: 1, duration: 0.75, ease: "none" }, 2.15)
        .fromTo(S.spoon, { x: 1 }, { x: 0, duration: 0.6, ease: "power3.out" }, 2.4)
        // 3. It tips over the spoon, a slow thick stream of syrup pours, then it stands back up.
        .fromTo(S.bot, { tilt: 0 }, { tilt: 1, duration: 0.7, ease: "sine.inOut" }, 2.55)
        .fromTo(S.pour, { head: 0 }, { head: 1, duration: 0.3, ease: "power1.in" }, 3.25)
        .fromTo(S.pour, { pool: 0 }, { pool: 1, duration: 1.6, ease: "sine.out" }, 3.5)
        .fromTo(S.pour, { tail: 0 }, { tail: 1, duration: 0.35, ease: "power1.in" }, 4.9)
        .to(S.bot, { tilt: 0, duration: 0.7, ease: "sine.inOut" }, 5.0);
      // 4. The ingredients pop in around it, a few coins bounce into the corner.
      S.props.forEach((p, i) => {
        tl.fromTo(p, { s: 0 }, { s: 1, duration: 0.6, ease: "back.out(1.8)" }, [5.3, 4.3, 4.55, 5.05, 4.8][i])
          .to(p, { s: 0, duration: 0.35, ease: "back.in(1.6)" }, 10.1 + i * 0.05);
      });
      S.pile.forEach((p, i) => {
        tl.fromTo(p, { y: -1, r: (i % 2 ? 1 : -1) * 90 }, { y: 0, r: 0, duration: 1, ease: "bounce.out" }, 5.6 + i * 0.15)
          .to(p, { y: 1, duration: 0.5, ease: "power2.in" }, 10.1 + i * 0.06);
      });
      // 5. Red seals stamp in, then the name and the call to action.
      S.seals.forEach((s, i) => {
        tl.fromTo(s, { s: 0 }, { s: 1, duration: 0.24, ease: "power2.in" }, 6.1 + i * 0.35)
          .fromTo(s, { out: 0 }, { out: 1, duration: 0.3, ease: "back.in(1.6)" }, 9.85 + i * 0.08);
      });
      tl.fromTo(S.name, { o: 0, y: 1 }, { o: 1, y: 0, duration: 0.9, ease: "power3.out", stagger: 0.14 }, 7.1)
        .fromTo(S.div, { s: 0 }, { s: 1, duration: 0.7, ease: "power2.out" }, 7.55)
        .fromTo(S.cta, { o: 0 }, { o: 1, duration: 0.7, ease: "sine.out" }, 7.75)
        .fromTo(S.conf, { o: 0 }, { o: 1, duration: 0.8, ease: "sine.out" }, 7.1)
        .fromTo(S.bot, { shine2: 0 }, { shine2: 1, duration: 0.9, ease: "power1.inOut" }, 9.0);
      // 6. Everything folds away, ready to loop.
      tl.to(S.cta, { o: 0, duration: 0.4 }, 9.9)
        .to(S.div, { s: 0, duration: 0.4 }, 9.9)
        .to(S.name, { o: 0, y: -0.6, duration: 0.5, ease: "power2.in", stagger: 0.06 }, 10.0)
        .to(S.conf, { o: 0, duration: 0.8, ease: "sine.in" }, 10.0)
        .to(S.cork, { o: 0, duration: 0.3 }, 10.1)
        .to(S.spoon, { x: 1, duration: 0.5, ease: "power2.in" }, 10.25)
        .to(S.bot, { y: 1, duration: 0.6, ease: "power2.in" }, 10.45)
        .to(S.med, { k: 0, duration: 0.6, ease: "power2.inOut" }, 10.5)
        .to(S.med, { s: 0, duration: 0.4, ease: "back.in(1.5)" }, 10.95)
        .to(S.glow, { o: 0, duration: 0.8 }, 10.5);
      branch.lines.forEach((p, i) => tl.to(p, { attr: { "stroke-dashoffset": 1 }, duration: 0.5, ease: "sine.in" }, 10.4 - i * 0.05));
    }

    // Where the bottle lip is (group units) for a tilt amount k.
    function mouthAt(k) {
      const a = rad(TILT * k);
      return [SHIFT * k + MOUTH * Math.sin(a), LIFT * k + PIVOT - MOUTH * Math.cos(a)];
    }

    // The syrup stream: a thick, slightly wobbly ribbon from the lip to the spoon, thinner as it falls.
    function streamPath(t) {
      const { head, tail } = S.pour;
      if (head <= 0.001 || tail >= 0.999) return null;
      const M = mouthAt(1), a = rad(TILT);
      const d = [Math.sin(a), -Math.cos(a)];
      const B = [SPOON[0] - 0.005, SPOON[1] - 0.008];
      const p0 = M, p1 = [M[0] + d[0] * 0.07, M[1] + d[1] * 0.07], p2 = [B[0] + 0.01, M[1] + (B[1] - M[1]) * 0.45], p3 = B;
      const at = (s) => {
        const m = 1 - s;
        return [0, 1].map((k) => m * m * m * p0[k] + 3 * m * m * s * p1[k] + 3 * m * s * s * p2[k] + s * s * s * p3[k]);
      };
      const n = 26, left = [], right = [], hi = [];
      for (let i = 0; i <= n; i++) {
        const s = tail + (head - tail) * (i / n);
        const p = at(s), q = at(Math.min(1, s + 0.01)), r = at(Math.max(0, s - 0.01));
        const tx = q[0] - r[0], ty = q[1] - r[1], len = Math.hypot(tx, ty) || 1;
        const nx = -ty / len, ny = tx / len;
        const w = (0.046 - 0.018 * s) * (1 + 0.08 * Math.sin(s * 18 - t * 9)) / 2;
        left.push([p[0] + nx * w, p[1] + ny * w]);
        right.push([p[0] - nx * w, p[1] - ny * w]);
        hi.push([p[0] + nx * w * 0.4, p[1] + ny * w * 0.4]);
      }
      const end = right.reverse();
      return {
        body: poly(left) + "L" + end.map(P).join("L") + "Z",
        hi: poly(hi.slice(1, -2)),
      };
    }

    // Per-frame work: sways, bottle, stream, confetti, sparkles and the gold glint.
    // Only touch the DOM when a value really changes, so still parts are not redrawn.
    const set = (node, name, v) => {
      const key = "_" + name;
      if (node[key] !== v) { node[key] = v; node.setAttribute(name, v); }
    };

    function update() {
      const t = tl.time();
      const { L, corners, lanterns, med, glow, branch, props, bottle, pile, conf, bursts, gold } = R;
      const show = (g, on) => set(g, "display", on ? "inline" : "none");

      corners.forEach((c, i) => {
        const s = S.corner[i].s;
        show(c.g, s > 0.001);
        set(c.reveal, "r", n3(S.corner[i].c));
        set(c.g, "transform", `translate(${n3(c.x)} ${n3(c.y)}) scale(${n3(c.sx * c.size * Math.max(0.001, s))} ${n3(c.sy * c.size * Math.max(0.001, s))}) rotate(${n3(S.corner[i].r * (1 - s))})`);
      });

      lanterns.forEach((l, i) => {
        const st = S.lan[i], lan = l.lan;
        const a = st.kick * Math.cos(TAU * t * 0.9 + i) + 3 * wave(t, 5, i * 1.7);
        const drop = st.y * (lan.len + lan.w * 1.8);
        show(l.outer, st.y < 0.999);
        set(l.outer, "transform", `translate(${n3(lan.x)} ${n3(-drop)}) rotate(${n3(a)}) scale(${n3(lan.w)})`);
        set(l.tassel, "transform", `translate(0 ${n3(l.ty)}) rotate(${n3(-a * 0.6 + 5 * wave(t, 7, i))})`);
      });

      const [mx, my] = toScreen(L, 0, -0.46);
      show(med.g, S.med.s > 0.01);
      set(med.g, "transform", `translate(${n3(mx)} ${n3(my)}) scale(${n3(L.S * 0.6 * S.med.s)}) rotate(${n3(22.5 + 8 * wave(t, 1))})`);
      const full = clamp((S.med.k - 0.9) / 0.1);
      set(med.full, "opacity", n3(full));
      set(med.backing, "opacity", n3(full));
      med.wedges.forEach((w, i) => {
        show(w, full < 1);
        set(w, "transform", `rotate(${n3(i * 45 * S.med.k)})`);
      });
      set(med.ring, "opacity", n3(S.med.k));
      set(glow, "opacity", n3(S.glow.o * (0.55 + 0.1 * wave(t, 4))));

      for (const p of R.dashed) set(p, "visibility", +p.getAttribute("stroke-dashoffset") > 0.995 ? "hidden" : "visible");
      branch.blossoms.forEach((b, i) => set(b.g, "transform", `scale(${n3(Math.max(0.001, S.blos[i].s))}) rotate(${n3(6 * wave(t, 3, i))})`));

      // Bottle: rises from below the frame, tips over the spoon, stands back up.
      const b = S.bot, k = b.tilt;
      const off = (H - L.gy) / L.S + 1.0;
      const rise = b.y * off;
      show(R.bottleOuter, b.y < 0.999);
      set(R.bottleOuter, "transform", `translate(${n3(SHIFT * k)} ${n3(LIFT * k + rise)}) rotate(${n3(TILT * k)} 0 ${PIVOT})`);
      set(R.shadow, "opacity", n3(0.35 * (1 - b.y) * (1 - 0.6 * k)));
      set(R.shadow, "rx", n3(0.3 * (1 - 0.35 * k)));
      const sh = b.shine > 0 && b.shine < 1 ? b.shine : b.shine2;
      set(bottle.shine, "opacity", sh > 0 && sh < 1 ? 1 : 0);
      set(bottle.shine, "x", n3(-0.42 + sh * 0.74));
      // Cork: sits in the neck, pops up and spins, lands on its side by the spoon.
      const cp = S.cork.p;
      let cx = 0, cy = rise - 0.865, cr = 0;
      if (cp > 0) {
        cx = 0.74 * cp;
        cy = (1 - cp) * -0.865 + cp * 0.165 - 1.3 * cp * (1 - cp);
        cr = 450 * cp;
      }
      show(R.corkG, S.cork.o > 0.01 && b.y < 0.999);
      set(R.corkG, "opacity", n3(S.cork.o));
      set(R.corkG, "transform", `translate(${n3(cx)} ${n3(cy)}) rotate(${n3(cr)})`);
      // Stream and spoon.
      const st = streamPath(t);
      show(R.stream, !!st);
      if (st) {
        set(R.streamBody, "d", st.body);
        set(R.streamHi, "d", st.hi);
      }
      const spoonOff = (W - L.gx) / L.S - 0.1;
      show(R.spoonOuter, S.spoon.x < 0.999);
      set(R.spoonOuter, "transform", `translate(${n3(SPOON[0] + S.spoon.x * spoonOff)} ${SPOON[1]})`);
      const pool = S.pour.pool;
      show(R.spoon.pool, pool > 0.01);
      set(R.spoon.pool, "transform", `scale(${n3(Math.max(0.01, pool))} ${n3(Math.max(0.01, pool * (0.9 + 0.1 * Math.sin(t * 7) * (1 - pool))))})`);

      props.forEach((p, i) => {
        const s = S.props[i].s;
        show(p.inner, s > 0.001);
        set(p.inner, "transform", `rotate(${n3(p.from * 30 * (1 - Math.min(1, s)))}) scale(${n3(Math.max(0.001, s))})`);
      });

      // Seals stamp down from big to their size, tilted a little.
      R.seals.forEach((s, i) => {
        const v = S.seals[i].s, out = S.seals[i].out;
        show(s.g, v > 0.001 && out < 0.999);
        set(s.g, "opacity", n3(Math.min(1, v * 1.6)));
        set(s.g, "transform", `translate(${n3(s.x)} ${n3(s.y)}) rotate(${n3(s.rot)}) scale(${n3(Math.max(0.001, (v < 1 ? 1.9 - 0.9 * v : 1) * (1 - out)))})`);
      });
      R.nameEls.forEach((g, i) => {
        const st2 = S.name[i];
        set(g, "opacity", n3(st2.o));
        set(g, "transform", `translate(0 ${n3(st2.y * R.fs * 0.5)})`);
      });
      R.rules.forEach((g) => set(g, "transform", `scale(${n3(Math.max(0.001, S.div.s))} 1)`));
      set(R.diamond, "opacity", n3(S.div.s));
      if (R.ctaEl) set(R.ctaEl, "opacity", n3(S.cta.o));
      const glint = ((t % 4) / 4) * 3 - 1.5;
      set(gold, "gradientTransform", `translate(${n3(glint * L.text.maxW)} 0)`);

      pile.forEach((p, i) => {
        const s2 = S.pile[i];
        show(p.inner, s2.y > -0.999);
        set(p.inner, "transform", `translate(0 ${n3(s2.y * (s2.y < 0 ? L.pile.y / L.pile.s + 4 : (H * 0.4) / L.pile.s))}) rotate(${n3(s2.r)})`);

      // Confetti: each piece falls a whole number of screens per loop, so the loop is seamless.
      conf.forEach((c) => {
        const q = ((t / LOOP) * c.sp + c.p) % 1;
        const x = (c.x + 0.03 * wave(t, c.sway, c.p * 6)) * W, y = -u * 0.05 + q * (H + u * 0.1);
        set(c.c, "transform", `translate(${n3(x)} ${n3(y)}) rotate(${n3(q * 360 * c.spin)}) scale(${n3(c.s * Math.cos(TAU * q * c.spin * 2))} ${n3(c.s)})`);
      });
      set(R.confG, "opacity", n3(S.conf.o * 0.8));

      // Sparkles: move out, slow down, drift down a little and fade.
      for (const s3 of bursts) {
        const tau = t - s3.t0;

        show(s3.g, on);

          set(p.c, "cx", n3(s3.x + Math.cos(p.a) * reach * p.sp));

        }
      }
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    // Reduced motion: one still frame with the bottle, the filled spoon, ingredients, seals and words.
    function apply() {
      if (reduce.matches) tl.pause(STILL);
      else tl.play();
      update();
    }
    reduce.addEventListener("change", apply);

    let resizeTimer;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const at = tl.time();
        tl.kill();
        build();
        tl.time(at);
        apply();
        sound.replan();
      }, 150);
    });

    // ---------- Sound ----------
    // Every sound is made here with the Web Audio API, no files. It stays off until the parent
    // page (or ?sound=1 / ?sound=effects) turns it on, and it follows the GSAP timeline clock,
    // so each sound lands on its moment in the animation.
    const sound = (() => {
      const LEVEL = 0.9, MUSIC = 0.27, ECHO = 0.375;
      const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
      let events = [];
      let ctx = null, master, impulse, noiseBuf, session = null, fxBus, musicBus, verbSend;
      let wantOn = false, wantMusic = true, playing = false, ready = false;
      let timer = 0, sleepTimer = 0, anchor = null, doneUpTo = 0;

      // The list of sounds for one loop, worked out from the same numbers as the timeline.
      function plan() {
        const list = [];
        const add = (t, type, extra = {}, music = false) => list.push({ t, type, music, ...extra });
        const panX = (x) => Math.max(-0.8, Math.min(0.8, (x / W) * 2 - 1));
        // Time at which an ease reaches a value (for tweens that start at t0 and last d).
        const reach = (name, v, t0, d) => {
          const f = gsap.parseEase(name);
          let lo = 0, hi = 1;
          for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (f(m) < v) lo = m; else hi = m; }
          return t0 + lo * d;
        };
        const { lanterns, corners, props, seals, nameEls, pile, bursts, branch, L } = R;
        const gp = (x, y) => panX(toScreen(L, x, y)[0]);
        const bp = gp(0, 0) * 0.6;

        // 1. Lanterns drop in with a soft swish and a wooden knock, then rustle as they swing.
        lanterns.forEach((l, i) => {
          const pan = panX(l.lan.x), t0 = 0.1 + i * 0.18;
          add(t0, "swish", { dur: 0.45, f0: 3200, f1: 700, v: 0.06, pan });
          add(t0 + 1.1 / 2.3, "knock", { pan, v: 0.13 });
          const k0 = 0.4 + i * 0.18;
          for (let k = 1; k < 8; k++) {
            const t = (k * Math.PI - i) / (TAU * 0.9);
            if (t > k0 + 0.35 && t < k0 + 2.6) add(t, "rustle", { pan, v: 0.045 * (1 - (t - k0) / 3) });
          }
          add(10.9 + i * 0.1, "swish", { dur: 0.6, f0: 600, f1: 3000, v: 0.05, pan });
        });
        // 2. Paper corners fan open with a rustle and two scissor snips; the medallion unfolds.
        corners.forEach((c, i) => {
          const pan = c.x > W / 2 ? 0.7 : -0.7;
          add(0.3 + i * 0.12, "crinkle", { dur: 0.5, v: 0.06, pan, n: 9 });
          for (const v of [0.35, 0.8]) add(reach("power1.inOut", v * 1.12, 0.35 + i * 0.12, 1.1), "snip", { pan, v: 0.11 });
          add(10.8 + i * 0.08, "crinkle", { dur: 0.35, v: 0.045, pan, n: 6 });
        });
        add(1.0, "crinkle", { dur: 0.35, v: 0.05, pan: bp, n: 7 });
        add(1.2, "fan", { dur: 1.2, v: 0.06, pan: bp });
        // 3. The bottle rises in and settles with a glass clink; a gold shine runs across it.
        add(0.6, "swish", { dur: 0.5, f0: 500, f1: 2400, v: 0.07, pan: bp });
        add(reach("back.out(1.2)", 1, 0.6, 1.0), "glass", { pan: bp, v: 1 });
        [1.35, 9.0].forEach((t0) => [86, 90, 93, 98].forEach((m, k) => {
          const p = (k + 0.5) / 4;
          add(reach("power1.inOut", p, t0, 0.9), "ting", { f: hz(m), pan: bp - 0.2 + p * 0.4, v: 0.05 });
        }));
        // 4. The cork pops and lands by the spoon; the spoon slides in and settles.
        add(2.15, "pop", { pan: bp });
        add(2.9, "knock", { pan: gp(0.74, 0.17), v: 0.08 });
        add(2.4, "swish", { dur: 0.45, f0: 3000, f1: 900, v: 0.05, pan: gp(0.8, 0) });
        add(2.78, "porcelain", { pan: gp(0.5, 0), v: 0.6 });
        // 5. The bottle tips, a slow thick pour lands in the spoon, a last clink, it stands back up.
        add(2.55, "swish", { dur: 0.7, f0: 400, f1: 1200, v: 0.035, pan: bp });
        add(3.25, "pour", { dur: 2.0, pan: gp(0.5, -0.3) });
        add(5.0, "swish", { dur: 0.7, f0: 1200, f1: 400, v: 0.03, pan: bp });
        add(5.3, "porcelain", { pan: gp(0.5, 0), v: 1 });
        add(5.62, "glass", { pan: bp, v: 0.5 });
        // 6. Ingredients pop in like paper cut-outs; blossoms open; coins clink as they bounce.
        const starts = [5.3, 4.3, 4.55, 5.05, 4.8];
        props.forEach((p, i) => add(starts[i] + 0.21, "paperPop", { f: hz([79, 74, 76, 83, 81][i]), pan: gp(p.x, p.y) }));
        branch.blossoms.forEach((b, i) => add(2.6 + i * 0.12 + 0.08, "pip", { f: hz([81, 83, 86, 88, 90, 93, 95, 98][i % 8]), pan: -0.65 + i * 0.05 }));
        pile.forEach((p, i) => {
          [0.364, 0.727, 0.909].forEach((b, j) => add(5.6 + i * 0.15 + b, "clink", { v: [0.8, 0.35, 0.14][j], pan: panX(L.pile.x) }));
        });
        // 7. Red seals stamp down with a soft thud.
        seals.forEach((s, i) => add(6.1 + i * 0.35 + 0.24, "stamp", { pan: panX(s.x) * 0.8 }));
        // 8. The name lands with a gentle gong and chime, then the call to action.
        nameEls.forEach((g, i) => add(7.1 + i * 0.14, "swish", { dur: 0.45, f0: 800, f1: 2600, v: 0.03, pan: panX(L.text.cx) * 0.5 }));
        add(7.3, "gong", { v: 0.24, pan: panX(L.text.cx) * 0.4 });
        add(7.3, "ting", { f: hz(93), pan: panX(L.text.cx) * 0.4, v: 0.06 });
        add(7.55, "swish", { dur: 0.6, f0: 2000, f1: 5000, v: 0.022, pan: panX(L.text.cx) * 0.5 });
        bursts.forEach((b) => add(b.t0, "twinkles", { pan: panX(b.x) * 0.8 }));
        // 9. Everything folds away.
        add(9.85, "crinkle", { dur: 0.35, v: 0.04, pan: panX(L.text.cx) * 0.5, n: 6 });
        add(10.0, "swish", { dur: 0.5, f0: 3000, f1: 900, v: 0.035, pan: panX(L.text.cx) * 0.5 });
        add(10.1, "crinkle", { dur: 0.4, v: 0.05, pan: bp, n: 9 });
        add(10.25, "swish", { dur: 0.5, f0: 900, f1: 3000, v: 0.04, pan: gp(0.8, 0) });
        add(10.45, "swish", { dur: 0.6, f0: 2600, f1: 500, v: 0.06, pan: bp });
        add(10.5, "fan", { dur: 0.6, v: 0.045, pan: bp, close: 1 });

        // Music, 120 bpm, six bars fill the 12 s loop: a guzheng style melody in a pentatonic
        // scale, low plucked bass, a big drum, woodblock and small cymbals.
        const beat = LOOP / 24, eighth = beat / 2, bar = beat * 4;
        const tune = [
          [69, 0, 71, 69, 66, 0, 64, 0],
          [62, 0, 64, 66, 69, 0, 0, 0],
          [71, 0, 74, 71, 69, 0, 66, 69],
          [64, 0, 66, 64, 62, 0, 0, 0],
          [66, 69, 71, 74, 76, 0, 74, 71],
          [69, 0, 71, 69, 0, 0, 0, 0],
        ];
        const bass = [[38, 45], [38, 45], [43, 38], [40, 45], [47, 42], [45, 38]];
        tune.forEach((row, b) => {
          const t0 = b * bar;
          row.forEach((m, s) => { if (m) add(t0 + s * eighth, "zheng", { f: hz(m), v: s % 2 ? 0.75 : 1, bend: s === 0 && b % 2 === 0 }, true); });
          bass[b].forEach((m, k) => add(t0 + k * beat * 2, "zheng", { f: hz(m), v: 0.8, low: 1 }, true));
          add(t0, "drum", { v: 1 }, true);
          add(t0 + beat * 2, "drum", { v: 0.55 }, true);
          if (b % 2 === 0) add(t0, "cymbal", { v: 1 }, true);
          [1, 3].forEach((q) => add(t0 + q * beat, "block", { v: 1 }, true));
          add(t0 + 3.5 * beat, "block", { v: 0.5 }, true);
        });
        // A quick rising glissando at the end of the loop leads back to the start.
        [62, 64, 66, 69, 71, 74, 76, 78, 81].forEach((m, i) => add(5 * bar + beat * 2 + i * 0.09, "zheng", { f: hz(m), v: 0.45 + i * 0.03 }, true));
        add(5 * bar + beat * 3, "cymbal", { v: 0.5 }, true);
        return list.sort((a, b) => a.t - b.t);
      }


      // Audio graph: effects and music buses, a soft hall reverb, a compressor before the speakers.
      function makeGraph() {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.knee.value = 8;
        comp.ratio.value = 4;
        comp.attack.value = 0.003;
        comp.release.value = 0.2;
        master = ctx.createGain();
        master.gain.value = LEVEL;
        master.connect(comp).connect(ctx.destination);
        const sr = ctx.sampleRate, len = Math.floor(sr * 2.2);
        impulse = ctx.createBuffer(2, len, sr);
        for (let c = 0; c < 2; c++) {
          const d = impulse.getChannelData(c);
          for (let s = 0; s < len; s++) d[s] = (Math.random() * 2 - 1) * Math.pow(1 - s / len, 3.5);
        }
        noiseBuf = ctx.createBuffer(1, sr * 2, sr);
        const nd = noiseBuf.getChannelData(0);
        for (let s = 0; s < nd.length; s++) nd[s] = Math.random() * 2 - 1;
      }

      // Each switch on gets fresh buses, so sounds queued before a stop never leak out later.
      function openSession() {
        const t = ctx.currentTime;
        session = ctx.createGain();
        session.gain.setValueAtTime(0, t);
        session.gain.linearRampToValueAtTime(1, t + 0.06);
        session.connect(master);
        fxBus = ctx.createGain();
        fxBus.connect(session);
        const verb = ctx.createConvolver();
        verb.buffer = impulse;
        const tone = filter("lowpass", 4200);
        const verbOut = ctx.createGain();
        verbOut.gain.value = 0.35;
        verb.connect(tone).connect(verbOut).connect(session);
        verbSend = ctx.createGain();
        verbSend.connect(verb);
        // Music gate: music:false fades this to zero, with its echo and reverb.
        musicBus = ctx.createGain();
        musicBus.gain.value = wantMusic ? MUSIC : 0;
        musicBus.connect(session);
        const wet = ctx.createGain();
        wet.gain.value = 0.3;
        musicBus.connect(wet).connect(verb);
        musicBus.echo = ctx.createGain();
        const delay = ctx.createDelay(1);
        delay.delayTime.value = ECHO;
        const fb = ctx.createGain();
        fb.gain.value = 0.25;
        const echoTone = filter("lowpass", 2400);
        musicBus.echo.connect(delay).connect(echoTone).connect(fb).connect(delay);
        const echoOut = ctx.createGain();
        echoOut.gain.value = 0.35;
        echoTone.connect(echoOut).connect(musicBus);
      }
      function closeSession() {
        const old = session, t = ctx.currentTime;
        session = null;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(old.gain.value, t);
        old.gain.linearRampToValueAtTime(0, t + 0.15);
        setTimeout(() => old.disconnect(), 300);
      }

      // Small building blocks.
      function amp(when, peak, attack, decay, out) {
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(peak, when + attack);
        g.gain.exponentialRampToValueAtTime(0.0001, when + attack + decay);
        g.connect(out);
        return g;
      }
      function osc(type, freq, when, dur) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(freq, when);
        o.start(when);
        o.stop(when + dur + 0.05);
        return o;
      }
      function noise(when, dur) {
        const s = ctx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        s.start(when, Math.random() * 1.5);
        s.stop(when + dur + 0.05);
        return s;
      }
      function filter(type, freq, q = 0.7) {
        const f = ctx.createBiquadFilter();
        f.type = type;
        f.frequency.value = freq;
        f.Q.value = q;
        return f;
      }
      function pan(value, out) {
        const p = ctx.createStereoPanner();
        p.pan.value = value;
        p.connect(out);
        return p;
      }
      function send(node, amount) {
        const g = ctx.createGain();
        g.gain.value = amount;
        node.connect(g).connect(verbSend);
      }
      // A small bell: a sine with two quieter overtones that fade faster.

      // A sweep of filtered noise, for swishes and whooshes.
      function sweep(when, dur, f0, f1, v, p0, p1 = p0, q = 1.2) {
        const n = noise(when, dur);
        const bp = filter("bandpass", f0, q);
        bp.frequency.setValueAtTime(f0, when);
        bp.frequency.exponentialRampToValueAtTime(f1, when + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(v, when + dur * 0.45);
        g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
        const pn = ctx.createStereoPanner();
        pn.pan.setValueAtTime(p0, when);
        pn.pan.linearRampToValueAtTime(p1, when + dur);
        pn.connect(fxBus);
        n.connect(bp).connect(g).connect(pn);
        return g;
      }
      // Paper: many tiny crackly grains of noise, spread over a short time.
      function crinkle(when, dur, v, p, n, lo = 1800, hi = 7000) {
        const out = pan(p, fxBus);
        send(out, 0.25);
        for (let k = 0; k < n; k++) {
          const t = when + (k / n) * dur + Math.random() * (dur / n);
          const s = noise(t, 0.05);
          s.connect(filter("bandpass", lo + Math.random() * (hi - lo), 2)).connect(amp(t, v * (0.4 + Math.random() * 0.6), 0.002, 0.015 + Math.random() * 0.03, out));
        }
      }
      // A small bell with two quieter overtones.
      function bell(when, f, v, p, decay = 1.2) {
        const out = pan(p, fxBus);
        [[1, 1, decay], [2.01, 0.3, decay * 0.5], [3.02, 0.12, decay * 0.25]].forEach(([r, a, d]) => {
          const g = amp(when, v * a, 0.003, d, out);
          osc("sine", f * r, when, d).connect(g);
          send(g, 0.4);
        });
      }

      // One function per sound.
      const voices = {
        swish(when, e) {
          const g = sweep(when, e.dur, e.f0, e.f1, e.v, e.pan);
          send(g, 0.3);
        },
        knock(when, e) {
          // Wooden knock of the lantern frame as it reaches the end of its drop.
          const out = pan(e.pan, fxBus);
          const o = osc("sine", 620, when, 0.1);
          o.frequency.exponentialRampToValueAtTime(480, when + 0.06);
          o.connect(amp(when, e.v, 0.001, 0.07, out));
          const n = noise(when, 0.04);
          n.connect(filter("bandpass", 1400, 5)).connect(amp(when, e.v * 0.6, 0.001, 0.035, out));
          send(out, 0.2);
        },
        rustle(when, e) {
          crinkle(when, 0.3, e.v, e.pan, 5, 1500, 4500);
        },
        crinkle(when, e) {
          crinkle(when, e.dur, e.v, e.pan, e.n);
        },
        snip(when, e) {
          // Two quick bright clicks, like the blades of small scissors.
          const out = pan(e.pan, fxBus);
          [0, 0.035].forEach((d, k) => {
            const t = when + d;
            const n = noise(t, 0.02);
            n.connect(filter("highpass", 3500)).connect(amp(t, e.v * (k ? 0.7 : 1), 0.001, 0.012, out));
            osc("sine", k ? 4700 : 5300, t, 0.04).connect(amp(t, e.v * 0.25, 0.001, 0.03, out));
          });
        },
        fan(when, e) {
          // Folded paper opening (or closing): a rustle whose tone moves as the wedges spread.
          const p = e.pan || 0;
          const g = sweep(when, e.dur, e.close ? 5000 : 1500, e.close ? 1500 : 5000, e.v * 0.5, p + (e.close ? 0.3 : -0.3), p + (e.close ? -0.3 : 0.3), 0.8);
          send(g, 0.3);
          crinkle(when, e.dur, e.v, p, 14);
        },
        pip(when, e) {
          // A tiny rising pip as a blossom opens.
          const out = pan(e.pan, fxBus);
          const o = osc("sine", e.f, when, 0.15);
          o.frequency.exponentialRampToValueAtTime(e.f * 1.25, when + 0.04);
          const g = amp(when, 0.06, 0.004, 0.11, out);
          o.connect(g);
          send(g, 0.4);
        },
        gong(when, e) {
          // A warm gong: slightly out of tune partials that bloom and ring on, with a soft strike.
          const out = ctx.createGain();
          out.gain.value = e.v;
          out.connect(fxBus);
          send(out, 0.55);
          const f = 98;
          [[1, 1, 4], [1.52, 0.55, 3], [2.03, 0.45, 2.6], [2.47, 0.3, 2], [2.97, 0.25, 1.6], [3.53, 0.16, 1.2], [4.13, 0.1, 0.9]].forEach(([r, a, d], k) => {
            const o = osc("sine", f * r, when, d);
            o.frequency.linearRampToValueAtTime(f * r * 0.985, when + d);
            o.connect(amp(when, a * 0.5, k ? 0.12 : 0.012, d, out));
          });
          const n = noise(when, 0.2);
          n.connect(filter("lowpass", 900)).connect(amp(when, 0.25, 0.002, 0.15, out));
        },
        ting(when, e) {
          bell(when, e.f, 0.06, e.pan, 0.9);
          const n = noise(when, 0.12);
          n.connect(filter("bandpass", 2600, 0.8)).connect(amp(when, 0.03, 0.02, 0.09, pan(e.pan, fxBus)));
        },
        clink(when, e) {
          // A gold coin: bright metal partials that fade fast.
          const out = pan(e.pan, fxBus);
          send(out, 0.35);
          const f = 2300 * (0.95 + Math.random() * 0.1);
          [[1, 1, 0.22], [1.58, 0.6, 0.16], [2.33, 0.45, 0.11], [3.12, 0.3, 0.07]].forEach(([r, a, d]) => {
            osc("sine", f * r, when, d).connect(amp(when, 0.1 * e.v * a, 0.001, d, out));
          });
          noise(when, 0.01).connect(filter("highpass", 5000)).connect(amp(when, 0.06 * e.v, 0.001, 0.006, out));
        },

        glass(when, e) {
          // Thick glass set down: a dull knock under a short bright ring.
          const out = pan(e.pan, fxBus);
          send(out, 0.35);
          const o = osc("sine", 190, when, 0.12);
          o.frequency.exponentialRampToValueAtTime(120, when + 0.06);
          o.connect(amp(when, 0.22 * e.v, 0.002, 0.08, out));
          [[1850, 1, 0.35], [2960, 0.55, 0.22], [4870, 0.3, 0.14]].forEach(([f, a, d]) => {
            osc("sine", f, when, d).connect(amp(when, 0.07 * a * e.v, 0.001, d, out));
          });
          noise(when, 0.02).connect(filter("highpass", 3000)).connect(amp(when, 0.05 * e.v, 0.001, 0.01, out));
        },
        pop(when, e) {
          // Cork out: a short squeak of friction, then a round pop.
          const out = pan(e.pan, fxBus);
          send(out, 0.4);
          const sq = noise(when - 0.07, 0.07);
          sq.connect(filter("bandpass", 2400, 6)).connect(amp(when - 0.07, 0.03, 0.03, 0.04, out));
          const o = osc("sine", 820, when, 0.12);
          o.frequency.exponentialRampToValueAtTime(190, when + 0.05);
          o.connect(amp(when, 0.3, 0.001, 0.07, out));
          noise(when, 0.04).connect(filter("bandpass", 1400, 1)).connect(amp(when, 0.18, 0.001, 0.03, out));
        },
        porcelain(when, e) {
          // A porcelain spoon: a clear, delicate clink.
          const out = pan(e.pan, fxBus);
          send(out, 0.45);
          [[2630, 1, 0.5], [4150, 0.5, 0.3], [6900, 0.25, 0.15]].forEach(([f, a, d]) => {
            osc("sine", f, when, d).connect(amp(when, 0.06 * a * e.v, 0.001, d, out));
          });
        },
        pour(when, e) {
          // Thick syrup: a low, soft rush that swells and eases, with slow round blups.
          const out = pan(e.pan, fxBus);
          const n = noise(when, e.dur);
          const lp = filter("lowpass", 520, 1.5);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, when);
          g.gain.exponentialRampToValueAtTime(0.16, when + 0.3);
          g.gain.setValueAtTime(0.16, when + e.dur - 0.45);
          g.gain.exponentialRampToValueAtTime(0.0001, when + e.dur);
          const lfo = osc("sine", 3.1, when, e.dur);
          const depth = ctx.createGain();
          depth.gain.value = 160;
          lfo.connect(depth).connect(lp.frequency);
          n.connect(lp).connect(g).connect(out);
          send(g, 0.3);
          for (let t = when + 0.28; t < when + e.dur - 0.2; t += 0.17 + Math.random() * 0.16) {
            const f = 230 + Math.random() * 90;
            const o = osc("sine", f, t, 0.12);
            o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.09);
            o.connect(amp(t, 0.1 + Math.random() * 0.05, 0.012, 0.08, out));
          }
        },
        paperPop(when, e) {
          // A paper cut-out popping in: a soft rising pip and a crisp flick of paper.
          const out = pan(e.pan, fxBus);
          const o = osc("sine", e.f * 0.5, when, 0.12);
          o.frequency.exponentialRampToValueAtTime(e.f, when + 0.05);
          const g = amp(when, 0.08, 0.004, 0.09, out);
          o.connect(g);
          send(g, 0.35);
          crinkle(when - 0.02, 0.08, 0.05, e.pan, 4, 2500, 7000);
        },
        stamp(when, e) {
          // A seal pressed onto paper: a soft, deep thud and a papery slap.
          const out = pan(e.pan, fxBus);
          const o = osc("sine", 120, when, 0.25);
          o.frequency.exponentialRampToValueAtTime(58, when + 0.09);
          o.connect(amp(when, 0.4, 0.002, 0.18, out));
          noise(when, 0.06).connect(filter("bandpass", 1100, 0.9)).connect(amp(when, 0.16, 0.001, 0.045, out));
          send(out, 0.2);
        },
        twinkles(when, e) {
          [93, 98, 100, 105].forEach((m, k) => bell(when + k * 0.07, hz(m), 0.025, e.pan + (k % 2 ? 0.15 : -0.15), 0.6));
        },

        // Music
        zheng(when, e) {
          // Guzheng style pluck: a bright attack that mellows, a small bend into some notes
          // and a gentle vibrato as the note rings.
          const len = e.low ? 1.4 : 0.9;
          const out = amp(when, (e.low ? 0.16 : 0.18) * e.v, 0.002, len, musicBus);
          if (!e.low) out.connect(musicBus.echo);
          const lp = filter("lowpass", e.low ? 1800 : 5200, 1.5);
          lp.frequency.setValueAtTime(e.low ? 1800 : 5200, when);
          lp.frequency.exponentialRampToValueAtTime(e.low ? 500 : 1300, when + 0.3);
          lp.connect(out);
          const o = osc("sawtooth", e.bend ? e.f * 0.944 : e.f, when, len);
          if (e.bend) o.frequency.exponentialRampToValueAtTime(e.f, when + 0.07);
          o.connect(lp);
          const lfo = osc("sine", 5.5, when, len);
          const depth = ctx.createGain();
          depth.gain.setValueAtTime(0, when);
          depth.gain.linearRampToValueAtTime(e.low ? 0 : 9, when + 0.4);
          lfo.connect(depth).connect(o.detune);
          osc("triangle", e.f * 2, when, 0.3).connect(amp(when, 0.3, 0.002, 0.18, lp));
          noise(when, 0.01).connect(filter("highpass", 3000)).connect(amp(when, 0.03 * e.v, 0.001, 0.008, out));
        },
        drum(when, e) {
          const o = osc("sine", 125, when, 0.5);
          o.frequency.exponentialRampToValueAtTime(62, when + 0.12);
          o.connect(amp(when, 0.55 * e.v, 0.002, 0.42, musicBus));
          noise(when, 0.05).connect(filter("lowpass", 400)).connect(amp(when, 0.2 * e.v, 0.001, 0.04, musicBus));
        },
        block(when, e) {
          const out = pan(0.3, musicBus);
          osc("sine", 1050, when, 0.06).connect(amp(when, 0.13 * e.v, 0.001, 0.045, out));
          noise(when, 0.03).connect(filter("bandpass", 1050, 8)).connect(amp(when, 0.25 * e.v, 0.001, 0.03, out));
        },
        cymbal(when, e) {
          // Small hand cymbals: a splash of metal partials and air.
          const out = pan(-0.25, musicBus);
          const hp = filter("highpass", 3000);
          hp.connect(amp(when, 0.05 * e.v, 0.002, 0.7, out));
          for (const f of [587, 845, 1127, 1553, 2031, 2677]) osc("square", f, when, 0.75).connect(hp);
          noise(when, 0.6).connect(filter("highpass", 6500)).connect(amp(when, 0.1 * e.v, 0.002, 0.5, out));
        },
      };

      // Bring in held sounds (like a chord) that are already under way at time `now`.
      function catchUp(now, at) {
        const lt = ((now % LOOP) + LOOP) % LOOP;
        for (const e of events) {
          if (!e.hold || (e.music && !wantMusic)) continue;
          const left = e.t + e.hold - lt;
          if (lt > e.t + 0.03 && left > 0.6) voices[e.type](at + 0.02, { ...e, hold: left });
        }
      }

      // Animation clock: the timeline time at the last GSAP tick, moved on by the real time since.
      let tickTl = 0, tickAt = -Infinity, lastAt = 0;
      gsap.ticker.add(() => {
        if (!tl) return;
        tickTl = tl.totalTime();
        tickAt = performance.now();
      });

      // Look-ahead scheduler: every 25 ms, schedule sounds due in the next 100 ms.
      // Timeline time is mapped to audio time by an anchor that is re-set after any jump.
      function tick() {
        const since = (performance.now() - tickAt) / 1000;
        if (!playing || ctx.state !== "running" || document.hidden || tl.paused() || reduce.matches || since > 0.25) {
          anchor = null;
          return;
        }
        const now = tickTl + since * tl.timeScale(), at = ctx.currentTime;
        if (anchor) {
          const err = now - (anchor.tl + (at - anchor.audio));
          if (Math.abs(err) > 0.1) anchor = null; // the animation jumped or stalled
          else anchor.tl += err * 0.05; // ease out small drift
        }
        if (!anchor) {
          anchor = { tl: now, audio: at };
          // Start fresh so nothing piles up (a sound up to 30 ms late still plays), but after a
          // hiccup or a pause at the same spot, never play a moment that is already booked.
          if (!(now < doneUpTo && doneUpTo - now < 0.3)) {
            doneUpTo = now - 0.03;
            catchUp(now, at);
          } else if (at - lastAt > 0.5) {
            catchUp(now, at); // back after a long pause: held chords have ended, bring them back
          }
        }
        const from = doneUpTo;
        const to = anchor.tl + (at - anchor.audio) + 0.1;
        if (to <= from) return;
        for (let k = Math.floor(from / LOOP); k <= Math.floor(to / LOOP); k++) {
          for (const e of events) {
            const t = k * LOOP + e.t;
            if (t < from || t >= to) continue;
            if (e.music && !wantMusic) continue;
            voices[e.type](Math.max(at, anchor.audio + (t - anchor.tl)), e);
          }
        }
        doneUpTo = to;
        lastAt = at;
      }

      // Turn sound on or off to match what was asked for.
      function update() {
        const on = wantOn && ready && !reduce.matches;
        if (on) {
          if (!ctx) makeGraph();
          clearTimeout(sleepTimer);
          if (ctx.state !== "running") ctx.resume().catch(() => {});
          if (!playing) {
            playing = true;
            anchor = null;
            doneUpTo = -1e9; // a new session has nothing booked yet
            openSession();
            clearInterval(timer);
            timer = setInterval(tick, 25);
          }
          const t = ctx.currentTime, g = musicBus.gain;
          const was = g.value > 0.001;
          g.cancelScheduledValues(t);
          g.setValueAtTime(g.value, t);
          g.linearRampToValueAtTime(wantMusic ? MUSIC : 0, t + 0.12);
          if (wantMusic && !was && anchor) catchUp(anchor.tl + (t - anchor.audio), t);
        } else if (playing) {
          playing = false;
          clearInterval(timer);
          closeSession();
          sleepTimer = setTimeout(() => ctx.suspend().catch(() => {}), 200);
        }
      }

      // Called after the scene is built (and rebuilt on resize), so pans and counts match.
      function replan() {
        events = plan();
        ready = true;
        update();
      }
      reduce.addEventListener("change", update);

      // Browsers may block audio until the first click or key press.
      const unlock = () => { if (playing && ctx && ctx.state !== "running") ctx.resume().catch(() => {}); };
      addEventListener("pointerdown", unlock);
      addEventListener("keydown", unlock);

      addEventListener("message", (event) => {
        if (event.origin !== location.origin) return;
        const data = event.data;
        if (!data || data.type !== "motionprompt-sound") return;
        if (typeof data.on === "boolean") wantOn = data.on;
        if (typeof data.music === "boolean") wantMusic = data.music;
        update();
      });

      const fromUrl = params.get("sound");
      if (fromUrl === "1" || fromUrl === "effects") {
        wantOn = true;
        wantMusic = fromUrl === "1";
      }

      return { replan };
    })();

    // Wait briefly for the fonts so the words are measured in the right face.
    Promise.race([
      Promise.all([document.fonts.load("400 1em 'DM Serif Display'"), document.fonts.load("500 1em Jost"), document.fonts.load("600 1em Jost")]),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).finally(() => { build(); apply(); sound.replan(); });
  </script>
</body>
</html>
